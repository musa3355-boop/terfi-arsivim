<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MESKİ Terfi Arşivim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
 --bg:#071a2f;
 --card:#0d2945;
 --card2:#102f4d;
 --line:#28506e;
 --text:#eef7ff;
 --muted:#9db7ca;
 --blue:#38a9e8;
 --green:#18b878;
 --red:#c84646;
 --white:#fff;
}

*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
 min-height:100vh;
}

button,
input,
textarea,
select{
 font:inherit;
}

main{
 max-width:1100px;
 margin:auto;
 padding:14px 14px 100px;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:15px;
 padding:14px;
 margin:10px 0;
}

.card h1,
.card h2,
.card h3{
 margin-top:0;
}

.row{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.field{
 min-width:0;
 margin-bottom:7px;
}

.field label{
 display:block;
 color:var(--muted);
 font-size:11px;
 font-weight:700;
 margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:11px;
 border-radius:9px;
 border:1px solid var(--line);
 background:#071a2f;
 color:#fff;
 outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:var(--blue);
}

.field textarea{
 min-height:75px;
 resize:vertical;
}

.btn{
 border:1px solid var(--line);
 background:#164465;
 color:#fff;
 padding:10px 13px;
 border-radius:9px;
 margin:3px;
 cursor:pointer;
}

.btn:hover{
 opacity:.92;
}

.btn.on{
 background:var(--blue);
 border-color:var(--blue);
}

.btn.ok{
 background:var(--green);
 border-color:var(--green);
}

.btn.bad{
 background:var(--red);
 border-color:var(--red);
}

.code{
 color:#62c8ff;
 font-weight:800;
}

.muted{
 color:var(--muted);
}

.tabs{
 display:flex;
 gap:5px;
 overflow-x:auto;
 padding:5px 0 8px;
 position:sticky;
 top:0;
 background:var(--bg);
 z-index:10;
}

.tabs .btn{
 white-space:nowrap;
}

.savebar{
 position:fixed;
 z-index:50;
 bottom:0;
 left:0;
 right:0;
 padding:9px;
 background:#051423;
 border-top:1px solid #18364f;
}

.savebar button{
 width:100%;
 border:0;
 padding:14px;
 border-radius:10px;
 background:var(--green);
 color:#fff;
 font-weight:800;
}

.workbox{
 background:#081b30;
 border:1px solid #274c67;
 border-radius:12px;
 padding:12px;
 margin:7px 0;
}

.workbox b{
 font-size:12px;
 color:#b5cad7;
}

.hmi{
 background:#102a34;
 border-color:#335563;
}

.hmi input{
 background:#f8fbfd;
 color:#061828;
 border-color:#7891a0;
}

.hmi-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px;
}

.number-input{
 text-align:right;
 font-weight:700;
}

.search{
 margin:10px 0;
}

.empty{
 text-align:center;
 color:var(--muted);
 padding:25px;
}

/* =========================
   PDF
========================= */

#printArea{
 display:none;
}

@media print{

 @page{
   size:A4 portrait;
   margin:6mm;
 }

 html,
 body{
   background:#fff!important;
   color:#111!important;
   width:210mm;
   margin:0;
   padding:0;
 }

 #app,
 .savebar{
   display:none!important;
 }

 #printArea{
   display:block!important;
   width:100%;
 }

 .print-page{
   width:198mm;
   height:285mm;
   overflow:hidden;
   page-break-after:always;
   break-after:page;
   background:#fff;
   color:#111;
   position:relative;
 }

 .print-page:last-child{
   page-break-after:auto;
   break-after:auto;
 }

 .print-header{
   border-bottom:2px solid #0b2742;
   padding-bottom:4px;
   margin-bottom:5px;
 }

 .print-header h1{
   margin:0;
   font-size:15px;
   color:#0b2742;
 }

 .print-header p{
   margin:2px 0 0;
   font-size:7px;
   color:#555;
 }

 .print-section{
   border:1px solid #c4cbd1;
   border-radius:4px;
   padding:4px;
   margin:4px 0;
 }

 .print-section-title{
   font-size:8px;
   font-weight:800;
   color:#0b2742;
   border-bottom:1px solid #d9dee2;
   padding-bottom:2px;
   margin-bottom:3px;
 }

 .print-grid{
   display:grid;
   grid-template-columns:1fr 1fr;
   gap:2px 4px;
 }

 .print-cell{
   border-bottom:1px solid #e5e8ea;
   min-height:13px;
   padding:1px 2px;
 }

 .print-cell b{
   display:block;
   font-size:5.8px;
   color:#5c6871;
 }

 .print-cell span{
   display:block;
   font-size:7px;
   font-weight:600;
 }

 .motor-print{
   border:1px solid #c4cbd1;
   margin:3px 0;
   padding:3px;
   border-radius:3px;
 }

 .motor-print-title{
   font-size:7px;
   font-weight:800;
   color:#0b2742;
   margin-bottom:2px;
 }

 .hmi-print-title{
   font-size:13px;
   font-weight:800;
   color:#0b2742;
   margin-bottom:5px;
 }

 .hmi-print-grid{
   display:grid;
   grid-template-columns:1fr 1fr;
   gap:3px;
 }

 .hmi-print-cell{
   border:1px solid #cbd3d9;
   border-radius:3px;
   padding:3px;
   min-height:22px;
 }

 .hmi-print-cell b{
   display:block;
   font-size:6px;
   color:#53616c;
 }

 .hmi-print-cell span{
   display:block;
   font-size:8px;
   font-weight:700;
   margin-top:1px;
   word-break:break-word;
 }

 .print-footer{
   position:absolute;
   bottom:2mm;
   right:0;
   font-size:6px;
   color:#777;
 }

 .print-note{
   font-size:6px;
   color:#555;
 }

}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

 .row{
   grid-template-columns:1fr;
 }

 main{
   padding-left:10px;
   padding-right:10px;

 .card{
   padding:12px;
 }

 .tabs{
   margin-left:-4px;
   margin-right:-4px;
   padding-left:4px;
   padding-right:4px;
 }

}

</style>
</head>

/* ============================================================
   HELPERS
============================================================ */

function esc(v){

 return String(v ?? "")
 .replace(/[&<>"']/g,function(m){

   return {
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#39;"
   }[m];

 });

}


function numberValue(v){

 if(v===null || v===undefined || v==="")
   return null;

 const n=Number(
   String(v)
   .replace(",",".")
   .replace(/[^0-9.\-]/g,"")
 );

 return Number.isFinite(n) ? n : null;
}


/*
  SAYISAL INPUT
  iPhone/iPad için numeric / decimal klavye.
*/

function numberInput(label,key,value=""){

 return `
 <div class="field">

   <label>${esc(label)}</label>

   <input
     class="number-input"
     data-k="${esc(key)}"
     type="number"
     inputmode="decimal"
     enterkeyhint="done"
     step="any"
     value="${esc(value)}"
     ${editMode ? "" : "disabled"}
     oninput="
       this.value=this.value
       .replace(/[^0-9.,-]/g,'')
       .replace(',', '.');
     "
   >

 </div>
 `;

}


function textInput(label,key,value=""){

 return `
 <div class="field">

   <label>${esc(label)}</label>

   <input
     data-k="${esc(key)}"
     type="text"
     value="${esc(value)}"
     ${editMode ? "" : "disabled"}
     oninput="dirty=true"
   >

 </div>
 `;

}


function dateInput(label,key,value=""){

 return `
 <div class="field">

   <label>${esc(label)}</label>

   <input
     data-k="${esc(key)}"
     type="date"
     value="${esc(value || "")}"
     ${editMode ? "" : "disabled"}
   >

 </div>
 `;

}


function textArea(label,key,value=""){

 return `
 <div class="field">

   <label>${esc(label)}</label>

   <textarea
     data-k="${esc(key)}"
     ${editMode ? "" : "disabled"}
   >${esc(value)}</textarea>

 </div>
 `;

}


function getVal(key){

 const el=
 document.querySelector(
   `[data-k="${CSS.escape(key)}"]`
 );

 return el ? el.value : "";

}


function printCell(label,value){

 if(value===null ||
    value===undefined ||
    value===""){
   value="—";
 }

 return `
 <div class="print-cell">
   <b>${esc(label)}</b>
   <span>${esc(value)}</span>
 </div>
 `;

}


/* ============================================================
   ANA SAYFA
============================================================ */

async function home(){

 const result=
 await db
 .from("terfiler")
 .select("*")
 .order("kod");

 if(result.error){

   alert(result.error.message);
   return;

 }

 const data=result.data || [];

 app.innerHTML=`

 <div class="card">

   <h1>MESKİ TERFİ ARŞİVİM</h1>

   <p class="muted">
     Merkezi saha teknik arşivi
   </p>

   <button
     class="btn ok"
     onclick="newStation()">
     ＋ YENİ TERFİ
   </button>

   <button
     class="btn"
     onclick="unlockEdit()">
     ${editMode ? "DÜZENLEME AÇIK" : "DÜZENLEME MODU"}
   </button>

 </div>

 <div class="field search">

   <label>TERFİ ARA</label>

   <input
     id="stationSearch"
     type="search"
     placeholder="Terfi, kod, bölge veya adres..."
     oninput="filterStations()"
   >

 </div>

 <div id="stationList">

   ${renderStationList(data)}

 </div>
 `;

}


function renderStationList(data){

 return data.map(x=>`

 <button
   class="card"
   style="
     width:100%;
     text-align:left;
     color:#fff;
     cursor:pointer;
   "
   onclick="openStation('${x.id}')"
 >

   <div class="code">
     ${esc(x.terfi_no || x.kod || "")}
   </div>

   <h3>
     ${esc(x.ad || "İsimsiz Terfi")}
   </h3>

   <div class="muted">
     ${esc(x.bolge || "")}
     ${x.adres ? " · " + esc(x.adres) : ""}
   </div>

 </button>

 `).join("");

}


async function filterStations(){

 const q=
 document.getElementById("stationSearch")
 ?.value
 ?.toLocaleLowerCase("tr-TR")
 || "";

 const result=
 await db
 .from("terfiler")
 .select("*")
 .order("kod");

 if(result.error){
   return;
 }

 const filtered=
 (result.data || []).filter(x=>{

   const text=`
     ${x.ad || ""}
     ${x.kod || ""}
     ${x.terfi_no || ""}
     ${x.bolge || ""}
     ${x.adres || ""}
   `.toLocaleLowerCase("tr-TR");

   return text.includes(q);

 });

 document.getElementById("stationList").innerHTML=
 renderStationList(filtered);

}


/* ============================================================

============================================================ */

async function openStation(id){

 const station=
 await db
 .from("terfiler")
 .select("*")
 .eq("id",id)
 .single();

 if(station.error){

   alert(station.error.message);
   return;

 }

 const [
   motors,
   pumps,
   drives,
   hmi,
   work
 ]=await Promise.all([

   db
   .from("motorlar")
   .select("*")
   .eq("terfi_id",id)
   .order("created_at"),

   db
   .from("pompalar")
   .select("*")
   .eq("terfi_id",id)
   .order("created_at"),

   db
   .from("suruculer")
   .select("*")
   .eq("terfi_id",id)
   .order("created_at"),

   db
   .from("hmi_kayitlari")
   .select("*")
   .eq("terfi_id",id)
   .order("ekran_no"),

   db
   .from("motor_calisma_kayitlari")
   .select("*")
   .eq("terfi_id",id)
   .order("captured_at",{ascending:false})

 ]);

 current={

   s:station.data,

   m:motors.data || [],

   p:pumps.data || [],

   d:drives.data || [],

   h:hmi.data || [],

   w:work.data || []

 };

 if(
   !workMotor ||
   !current.m.some(m=>m.id===workMotor)
 ){
   workMotor=
   current.m[0]?.id || null;
 }

 currentTab="terfi";

 renderStation();

}

     >

 </div>

 ${renderBody()}

 `;

}

function unlockEdit(){

 overlay.style.cssText=`

   position:fixed;
   inset:0;
   background:rgba(0,0,0,.72);
   z-index:9999;
   display:flex;
   align-items:center;
   justify-content:center;
   padding:20px;

 `;

 const box=
 document.createElement("div");

 box.style.cssText=`

   background:#0d2945;
   border:1px solid #28506e;
   border-radius:16px;
   padding:22px;
   width:100%;
   max-width:320px;
   text-align:center;

 `;

 box.innerHTML=`

   <h3>DÜZENLEME MODU</h3>

   <p style="color:#9db7ca">
     4 haneli yönetici şifresini girin.
   </p>

 `;

 const input=
 document.createElement("input");

 /*
   type="tel" + inputmode="numeric"
   iPhone'da sadece rakam klavyesi açar.
 */

 input.type="tel";

 input.inputMode="numeric";

 input.pattern="[0-9]*";

 input.maxLength=4;

 input.autocomplete="one-time-code";

 input.placeholder="••••";

 input.style.cssText=`

   width:100%;
   padding:15px;
   text-align:center;
   font-size:30px;
   letter-spacing:8px;
   border-radius:10px;
   border:1px solid #38a9e8;
   background:#071a2f;
   color:#fff;
   outline:none;

 `;

 const btn=
 document.createElement("button");

 btn.textContent="GİRİŞ";

 btn.className="btn ok";

 btn.style.width="100%";

 btn.style.marginTop="12px";

 box.appendChild(input);

 box.appendChild(btn);

 overlay.appendChild(box);

 document.body.appendChild(overlay);

 input.focus();


 function check(){

   const value=input.value;

   if(value==="6872"){

     editMode=true;

     overlay.remove();

     if(current)
       renderStation();
     else
       home();

   }else{

     input.value="";

     input.focus();

     alert("Şifre yanlış.");

   }

 }


 btn.onclick=check;

 input.addEventListener(
   "keydown",
   function(e){

     if(e.key==="Enter")
       check();

   }
 );

}

   <div class="print-section">

     <div class="print-grid">

         current.d.flatMap((d,index)=>[

           printCell(
             `${index+1}. Sürücü`,

           printCell(

             `${d.marka || "—"} / ${d.model || "—"}`

             d.besleme_v

           printCell(

     </div>

   </div>


   <div class="print-section">

     <div class="print-section-title">
       SON ANLIK ÇALIŞMA KAYITLARI
     </div>

     ${
       current.w.slice(0,4).map(w=>`

         <div class="print-grid">

           ${printCell(
             "Motor",
             current.m.find(
               m=>m.id===w.motor_id

             "Tarih",
             new Date(
               w.captured_at
             ).toLocaleString("tr-TR")
           )}

           ${printCell(
             "Frekans / Akım",
             `${w.frekans_hz ?? "—"} Hz / ${w.akim_a ?? "—"} A`
           )}

           ${printCell(
             "Devir / Güç",
             `${w.devir_rpm ?? "—"} RPM / ${w.guc_kw ?? "—"} kW`

           ${printCell(
             "Gerilim",

             "Sürücü Sıcaklık",

           ${printCell(
             "Durum",

       `).join("")
       ||
       `<div class="print-note">
          Henüz anlık çalışma kaydı yok.
        </div>`
     }

   </div>


   <div class="print-footer">
     MESKİ Terfi Arşivim · Teknik Arşiv
   </div>

 </section>

 `;

}


/* ============================================================
   HMI PDF SAYFASI
============================================================ */

function hmiPrintPage(page){

 const record=
 current.h.find(
   x=>x.ekran_no===page
 );

 const values=
 record?.degerler || {};

 return `

 <section class="print-page">

   <div class="print-header">

     <h1>
       MESKİ TERFİ ARŞİVİM · HMI / PLC
     </h1>

     <p>
       ${esc(
         current.s.terfi_no ||
         current.s.kod ||
         ""
       )}

       ·

       ${esc(
         current.s.ad ||
         ""
       )}
     </p>

   </div>


   <div class="hmi-print-title">
     HMI SAYFA ${page} / 5
   </div>


   <div class="hmi-print-grid">

     ${
       HMI[page-1].map((label,index)=>`

         <div class="hmi-print-cell">

           <b>
             ${esc(label)}
           </b>

           <span>
             ${
               values[index] === undefined ||
               values[index] === null ||
               values[index] === ""
               ?
               "—"
               :
               esc(values[index])
             }
           </span>

         </div>

       `).join("")
     }

   </div>


   <div class="print-footer">
     HMI Sayfa ${page} / 5
   </div>

 </section>

 `;

}
