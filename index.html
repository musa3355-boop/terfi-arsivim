<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MESKİ Terfi Arşivim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#071a2f;
 --card:#0d2945;
 --card2:#102f4d;
 --line:#28506e;
 --line2:#356b8e;
 --text:#eef7ff;
 --muted:#9db7ca;
 --blue:#38a9e8;
 --blue2:#63c4f5;
 --ok:#18b878;
 --danger:#c9464d;
 --warning:#e1a52e;
 --shadow:0 12px 35px rgba(0,0,0,.18);
 --radius:15px;
 --scale:1;
}

*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 background:
   radial-gradient(circle at top right,rgba(56,169,232,.09),transparent 30%),
   linear-gradient(145deg,#06172a,#0a2138);
 color:var(--text);
 font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 min-height:100vh;
}

body.zoom-small{--scale:.88}
body.zoom-large{--scale:1.12}

button,input,textarea,select{
 font:inherit;
}

button{
 -webkit-tap-highlight-color:transparent;
}

input[type=number]{
 appearance:textfield;
}

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
 appearance:none;
 margin:0;
}

.hidden{
 display:none!important;
}

#app{
 min-height:100vh;
}

main{
 max-width:1450px;
 margin:auto;
 padding:15px 15px 105px;
}

h1,h2,h3,h4{
 margin:0 0 10px;
}

.card{
 background:linear-gradient(145deg,rgba(13,41,69,.98),rgba(10,34,56,.98));
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:15px;
 margin:10px 0;
 box-shadow:var(--shadow);
}

.row{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.row3{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px;
}

.row4{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px;
}

.field{
 min-width:0;
}

.field label{
 display:block;
 font-size:11px;
 font-weight:700;
 color:var(--muted);
 margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:11px 12px;
 background:#071a2f;
 color:#fff;
 border:1px solid var(--line);
 border-radius:9px;
 outline:none;
}

.field textarea{
 min-height:80px;
 resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:var(--blue);
 box-shadow:0 0 0 3px rgba(56,169,232,.10);
}

.btn{
 padding:10px 13px;
 border:1px solid var(--line);
 border-radius:9px;
 background:#164465;
 color:#fff;
 margin:3px;
 cursor:pointer;
 font-weight:700;
}

.btn:hover{
 border-color:var(--blue2);
}

.btn.on{
 background:var(--blue);
 border-color:var(--blue);
}

.btn.ok{
 background:var(--ok);
 border-color:var(--ok);
}

.btn.bad{
 background:var(--danger);
 border-color:var(--danger);
}

.btn.warn{
 background:#77551d;
 border-color:#97702b;
}

.btn.big{
 padding:13px 16px;
 font-weight:900;
}

.btn:disabled{
 opacity:.55;
 cursor:not-allowed;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap;
}

.top-left{
 display:flex;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
}

.top-right{
 display:flex;
 align-items:center;
 gap:5px;
 flex-wrap:wrap;
}

.logo{
 width:45px;
 height:45px;
 display:grid;
 place-items:center;
 border-radius:13px;
 background:linear-gradient(145deg,#168fe2,#075fae);
 font-size:23px;
 font-weight:900;
}

.page-title{
 font-size:calc(22px * var(--scale));
 font-weight:950;
}

.page-sub{
 color:var(--muted);
 font-size:12px;
}

.badge{
 display:inline-block;
 padding:5px 8px;
 border-radius:999px;
 background:#163f59;
 color:#9edcff;
 font-size:10px;
 font-weight:850;
}

.badge.ok{
 background:#104b39;
 color:#8bf0bf;
}

.badge.warn{
 background:#574119;
 color:#ffd87c;
}

.tabs{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding:4px 0 10px;
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(7,26,47,.96);
 backdrop-filter:blur(12px);
 scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
 display:none;
}

.tabs .btn{
 white-space:nowrap;
 flex:0 0 auto;
}

.station{
 background:#0b2741;
 border:1px solid #28506e;
 border-radius:14px;
 padding:15px;
 margin:9px 0;
 cursor:pointer;
 transition:.2s;
}

.station:hover{
 border-color:var(--blue);
 transform:translateY(-1px);
}

.station-title{
 font-weight:950;
 font-size:18px;
}

.station-meta{
 font-size:12px;
 color:var(--muted);
 margin-top:4px;
}

.station-stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 margin-top:12px;
}

.mini{
 border:1px solid #284d67;
 border-radius:9px;
 padding:8px;
 background:#091d30;
}

.mini b{
 display:block;
 font-size:9px;
 color:#7f9cad;
}

.mini strong{
 display:block;
 margin-top:3px;
 font-size:15px;
}

.summary{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:10px;
}

.stat{
 border:1px solid var(--line);
 border-radius:13px;
 background:#0a2138;
 padding:14px;
}

.stat-label{
 font-size:11px;
 color:var(--muted);
}

.stat-value{
 font-size:25px;
 font-weight:950;
 margin-top:5px;
}

.stat-unit{
 font-size:10px;
 color:#7591a5;
}

.section-title{
 font-size:17px;
 font-weight:950;
 margin-bottom:10px;
}

.section-sub{
 color:var(--muted);
 font-size:11px;
 line-height:1.5;
}

.workbox{
 background:#081b30;
 border:1px solid #274c67;
 border-radius:12px;
 padding:12px;
 margin:8px 0;
}

.workbox h4{
 font-size:12px;
 color:#b5cad7;
}

.empty{
 padding:18px;
 color:var(--muted);
 border:1px dashed #34536b;
 border-radius:10px;
 text-align:center;
}

.motor-card,
.driver-card,
.pump-card,
.fault-card,
.param-card,
.history-card{
 background:#091827;
 border:1px solid #203b56;
 border-radius:14px;
 padding:13px;
 margin:9px 0;
}

.motor-header,
.driver-header,
.pump-header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:10px;
}

.grid2{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:9px;
}

.grid4{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:9px;
}

.library-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.library-card{
 background:#091827;
 border:1px solid #203b56;
 border-radius:14px;
 padding:13px;
 cursor:pointer;
}

.library-card:hover{
 border-color:var(--blue);
}

.library-code{
 font-size:20px;
 font-weight:950;
 color:#67c9ff;
}

.library-name{
 font-weight:900;
 margin-top:3px;
}

.library-desc{
 font-size:12px;
 color:#a9bbcd;
 line-height:1.5;
 margin-top:7px;
}

.library-source{
 font-size:10px;
 color:#71879b;
 margin-top:8px;
}

.hmi-shell{
 border:1px solid #335563;
 border-radius:14px;
 background:#102a34;
 padding:13px;
}

.hmi-tabs{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding-bottom:8px;
 scrollbar-width:none;
}

.hmi-tabs::-webkit-scrollbar{
 display:none;
}

.hmi-tab{
 flex:0 0 auto;
 padding:10px 13px;
 border:1px solid #466d7d;
 border-radius:9px;
 background:#163745;
 color:#a9cad9;
 cursor:pointer;
 font-weight:800;
}

.hmi-tab.active{
 background:var(--blue);
 color:#fff;
 border-color:var(--blue);
}

.hmi-fields{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:9px;
}

.hmi-field{
 background:#0b222c;
 border:1px solid #264c5a;
 border-radius:10px;
 padding:9px;
}

.hmi-field label{
 display:block;
 color:#a6c6d3;
 font-size:10px;
 font-weight:800;
 margin-bottom:5px;
}

.hmi-field input{
 width:100%;
 padding:10px;
 border-radius:7px;
 border:1px solid #597885;
 background:#f5f9fb;
 color:#061828;
}

.box-table{
 width:100%;
 border-collapse:collapse;
 overflow:hidden;
 border-radius:10px;
}

.box-table th,
.box-table td{
 border:1px solid #294d64;
 padding:7px;
 font-size:11px;
}

.box-table th{
 background:#123550;
 color:#9fd7ef;
 text-align:left;
}

.box-table input{
 width:100%;
 background:#071a2f;
 color:#fff;
 border:1px solid #315670;
 border-radius:6px;
 padding:7px;
}

.photo-grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:9px;
}

.photo-item{
 border:1px solid #284c63;
 border-radius:10px;
 overflow:hidden;
 background:#081726;
}

.photo-item img{
 width:100%;
 height:150px;
 object-fit:cover;
 display:block;
}

.photo-caption{
 padding:7px;
 font-size:10px;
 color:var(--muted);
}

.bottom-save{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 z-index:80;
 padding:9px;
 background:rgba(5,20,35,.97);
 border-top:1px solid #18364f;
}

.bottom-save button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:var(--ok);
 color:#fff;
 font-weight:950;
 cursor:pointer;
}

.modal-backdrop{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.78);
 z-index:9999;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal{
 width:min(520px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0d2945;
 border:1px solid #28506e;
 border-radius:17px;
 padding:18px;
 box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.modal h2{
 font-size:19px;
}

.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:6px;
 flex-wrap:wrap;
 margin-top:12px;
}

.toast{
 position:fixed;
 left:50%;
 bottom:78px;
 transform:translateX(-50%) translateY(10px);
 z-index:11000;
 background:#102f4d;
 border:1px solid #47718d;
 padding:11px 15px;
 border-radius:999px;
 opacity:0;
 pointer-events:none;
 transition:.2s;
 font-size:12px;
}

.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}

.login-wrap{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:
   radial-gradient(circle at top right,rgba(56,169,232,.12),transparent 30%),
   linear-gradient(145deg,#06172a,#0a2138);
}

.login-card{
 width:min(430px,100%);
 background:#0d2945;
 border:1px solid #28506e;
 border-radius:20px;
 padding:22px;
 box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.login-logo{
 width:70px;
 height:70px;
 border-radius:18px;
 background:linear-gradient(145deg,#168fe2,#075fae);
 display:grid;
 place-items:center;
 margin:0 auto 15px;
 font-size:32px;
 font-weight:950;
}

.login-title{
 text-align:center;
 font-size:24px;
 font-weight:950;
}

.login-sub{
 text-align:center;
 color:var(--muted);
 font-size:12px;
 line-height:1.5;
 margin:6px 0 18px;
}

.numeric{
 text-align:center;
 letter-spacing:8px;
 font-size:25px!important;
}

.settings-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.setting{
 background:#091827;
 border:1px solid #203b56;
 border-radius:12px;
 padding:12px;
}

.setting h4{
 margin-bottom:8px;
 font-size:12px;
}

.history-list{
 max-height:390px;
 overflow:auto;
}

.history-card{
 padding:10px;
}

.history-date{
 font-size:10px;
 color:#7896a8;
}

.history-title{
 font-weight:900;
 font-size:12px;
 margin-top:3px;
}

.kpi{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:8px;
}

.kpi span{
 border:1px solid #34546b;
 padding:5px 8px;
 border-radius:999px;
 font-size:10px;
 color:#9fc2d2;
}

.admin-status{
 font-size:10px;
 padding:5px 8px;
 border-radius:999px;
 background:#104b39;
 color:#8bf0bf;
 display:inline-block;
}

/* ---------------- PRINT ---------------- */

.print-only{
 display:none;
}

@media(max-width:900px){
 .summary{grid-template-columns:repeat(3,1fr)}
 .station-stats{grid-template-columns:repeat(2,1fr)}
 .grid4{grid-template-columns:repeat(2,1fr)}
 .photo-grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
 main{padding:10px 10px 100px}
 .row,.grid2,.grid3{grid-template-columns:1fr}
 .summary{grid-template-columns:repeat(2,1fr)}
 .library-grid{grid-template-columns:1fr}
 .hmi-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
 .settings-grid{grid-template-columns:1fr}
 .photo-grid{grid-template-columns:1fr 1fr}
}

@media print{

 @page{
  size:A4 landscape;
  margin:3mm;
 }

 html,body{
  width:100%;
  min-height:0;
  background:#fff!important;
  color:#111!important;
 }

 #app,
 .bottom-save,
 .toast{
  display:none!important;
 }

 .print-only{
  display:block!important;
 }

 .print-page{
  width:100%;
  min-height:0;
  color:#111;
  background:#fff;
  overflow:hidden;
 }

 .print-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1.2px solid #0c2b45;
  padding-bottom:1.7mm;
  margin-bottom:1.5mm;
 }

 .print-header h1{
  margin:0;
  font-size:10pt;
 }

 .print-header p{
  margin:1px 0 0;
  font-size:5pt;
  color:#555;
 }

 .print-right{
  text-align:right;
  font-size:5pt;
 }

 .print-columns{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:1.2mm;
  align-items:start;
 }

 .print-section{
  border:1px solid #aeb8c0;
  border-radius:2px;
  padding:1.2mm;
  margin-bottom:1.2mm;
  break-inside:avoid;
 }

 .print-section h2{
  font-size:5.7pt;
  margin:0 0 1mm;
  border-bottom:1px solid #d7dde2;
  padding-bottom:.7mm;
  color:#0c2b45;
 }

 .print-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:.5mm;
 }

 .print-grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.5mm;
 }

 .print-cell{
  border:1px solid #d7dde2;
  padding:.6mm;
  min-height:4.2mm;
 }

 .print-cell b{
  display:block;
  color:#55636e;
  font-size:3.8pt;
 }

 .print-cell span{
  display:block;
  font-size:4.2pt;
  font-weight:700;
  word-break:break-word;
 }

 .print-hmi{
  border:1px solid #9baab3;
  padding:1.1mm;
  margin-bottom:1mm;
  break-inside:avoid;
 }

 .print-hmi-title{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #cdd4d8;
  padding-bottom:.6mm;
  margin-bottom:.7mm;
  font-size:4.8pt;
  font-weight:900;
 }

 .print-hmi-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.45mm;
 }

 .print-hmi-cell{
  border:1px solid #d7dde2;
  padding:.55mm;
  min-height:3.8mm;
 }

 .print-hmi-cell b{
  display:block;
  font-size:3.35pt;
  color:#56656f;
  line-height:1.05;
 }

 .print-hmi-cell span{
  display:block;
  font-size:3.7pt;
  font-weight:700;
  word-break:break-word;
 }

 .print-footer{
  border-top:1px solid #777;
  padding-top:1mm;
  margin-top:1mm;
  display:flex;
  justify-content:space-between;
  font-size:3.8pt;
 }

 .print-small{
  font-size:3.8pt;
 }

 .print-item{
  margin-bottom:1mm;
 }

 .print-motor{
  border:1px solid #bbb;
  padding:.9mm;
  margin-bottom:.7mm;
 }

 .print-motor-title{
  font-size:4.5pt;
  font-weight:900;
  margin-bottom:.7mm;
 }

 .no-print{
  display:none!important;
 }
}
</style>
</head>

/* =========================================================
   HELPERS
========================================================= */

function esc(v){

 return String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#39;");

}

function val(id){

 const e=
  document.getElementById(id);

 return e?e.value:'';

}

function num(v){

 if(
  v===null||
  v===undefined||
  v===''
 )
  return null;

 const n=
  Number(
   String(v).replace(',','.')
  );

 return Number.isFinite(n)?n:null;

}

function nowText(){

 return new Date().toLocaleString('tr-TR');

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

 const t=
  document.getElementById('toast');

 if(!t)return;

 t.textContent=message;

 t.classList.add('show');

 clearTimeout(
  window.__toast
 );

 window.__toast=
  setTimeout(
   ()=>t.classList.remove('show'),
   2200
  );

}

function getAdminSession(){

 try{

  return JSON.parse(
   sessionStorage.getItem(
    ADMIN_SESSION_KEY
   )||'null'
  );

 }catch(e){

  return null;

 }

}

function setAdminSession(){

 const session={
  active:true,
  lastActivity:Date.now()
 };

 sessionStorage.setItem(
  ADMIN_SESSION_KEY,
  JSON.stringify(session)
 );

 armAdminTimeout();

}

function touchAdminSession(){

 if(!edit)
  return;

 const s=
  getAdminSession();

 if(
  !s ||
  !s.active
 ){

  edit=false;

  return;

 }

 s.lastActivity=
  Date.now();

 sessionStorage.setItem(
  ADMIN_SESSION_KEY,
  JSON.stringify(s)
 );

 armAdminTimeout();

}

function clearAdminSession(){

 edit=false;

 clearTimeout(
  adminTimer
 );

 adminTimer=null;

 try{

  sessionStorage.removeItem(
   ADMIN_SESSION_KEY
  );

 }catch(e){}

}

function restoreAdminSession(){

 const s=
  getAdminSession();

 if(
  !s ||
  !s.active
 ){

  edit=false;

  return false;

 }

 const age=
  Date.now()-
  Number(
   s.lastActivity||0
  );

 if(age>=ADMIN_IDLE_MS){

  clearAdminSession();

  return false;

 }

 edit=true;

 armAdminTimeout();

 return true;

}

function armAdminTimeout(){

 clearTimeout(
  adminTimer
 );

 if(!edit)
  return;

 const s=
  getAdminSession();

 if(!s){

  edit=false;

  return;

 }

 const remaining=
  ADMIN_IDLE_MS-
  (
   Date.now()-
   Number(
    s.lastActivity||0
   )
  );

 if(remaining<=0){

  lockAdminForTimeout();

  return;

 }

 adminTimer=
  setTimeout(
   ()=>{
    checkAdminTimeout();
   },
   Math.min(
    remaining,
    15000
   )
  );

}

function checkAdminTimeout(){

 if(!edit)
  return;

 const s=
  getAdminSession();

 if(!s){

  lockAdminForTimeout();

  return;

 }

 const age=
  Date.now()-
  Number(
   s.lastActivity||0
  );

 if(age>=ADMIN_IDLE_MS){

  lockAdminForTimeout();

 }else{

  armAdminTimeout();

 }

}

function lockAdminForTimeout(){

 clearAdminSession();

 toast(
  'Yönetici oturumu zaman aşımı nedeniyle kilitlendi.'
 );

 if(current){

  render();

 }else{

  home();

 }

}

async function countTable(table,ids){

  return 0;

 const r=
  await db
   .from(table)
   .select('id,terfi_id')
   .in(
    'terfi_id',
    ids
   );

 if(r.error)

 return (
  r.data||[]
 ).length;

}

function filterStations(){

 const q=
  (
   document
    .getElementById('search')
    ?.value||
   ''
  ).toLowerCase();

 document
  .querySelectorAll('.station')
  .forEach(x=>{

   x.style.display=
    x.dataset.search.includes(q)
    ?
    'block'
    :
    'none';

  });

}

async function openStation(id){

 const [
  s,
  m,
  p,
  d,
  h,
  w,
  tp
 ]=
  await Promise.all([

   db
    .from('terfiler')
    .select('*')
    .eq('id',id)
    .single(),

   db
    .from('motorlar')
    .select('*')
    .eq('terfi_id',id)
    .order(
     'created_at',
     {ascending:true}
    ),

   db
    .from('pompalar')
    .select('*')
    .eq('terfi_id',id)
    .order(
     'created_at',
     {ascending:true}
    ),

   db
    .from('suruculer')
    .select('*')
    .eq('terfi_id',id)
    .order(
     'created_at',
     {ascending:true}
    ),

   db
    .from('hmi_kayitlari')
    .select('*')
    .eq('terfi_id',id)
    .order(
     'ekran_no',
     {ascending:true}
    ),

   db
    .from('motor_calisma_kayitlari')
    .select('*')
    .eq('terfi_id',id)
    .order(
     'captured_at',
     {ascending:false}
    ),

   db
    .from('terfi_parametreleri')
    .select('*')
    .eq('terfi_id',id)
    .order(
     'sira',
     {ascending:true}
    )

  ]);

 if(s.error){

  alert(
   s.error.message
  );

  return;

 }

 current={
  s:s.data,
  m:m.data||[],
  p:p.data||[],
  d:d.data||[],
  h:h.data||[],
  w:w.data||[],
  tp:tp.data||[]
 };

 /*
   SSR cihaz tarafında saklanıyor.
 */
 const ssrMap=
  localJSON(
   LOCAL_SSR_KEY,
   {}
  );

 current.ssr=
  ssrMap[id]||{
   level:'',
   low:'',
   high:'',
   note:''
  };

 tab='terfi';

 hmiPage=1;

 workMotor=
  current.m[0]?.id||
  null;

 if(edit)
  touchAdminSession();

 recordHistory(
  'TERFİ AÇILDI',
  `${current.s.ad||''} (${current.s.kod||current.s.terfi_no||''})`
 );

 render();

}

  await db
   .from('motorlar')
   .insert({
    terfi_id:
     current.s.id,
    ad:
     `${current.m.length+1}. Motor`
   })
   .select()
   .single();

 if(r.error){

  alert(r.error.message);

  return;

 }

 recordHistory(
  'MOTOR EKLENDİ',
  r.data?.ad||''
 );

 await openStation(
  current.s.id
 );

}

async function deleteMotor(id){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(!confirm(
  'Bu motor ve bağlı bilgiler silinsin mi?'
 ))return;

 const d=
  current.d.find(
   x=>x.motor_id===id
  );

 if(d){

  const ur=
   await db
    .from('suruculer')
    .update({
     motor_id:null
    })
    .eq(
     'id',
     d.id
    );

  if(ur.error){

   alert(
    ur.error.message
   );

   return;

  }

 }

 const r=
  await db
   .from('motorlar')
   .delete()
   .eq(
    'id',
    id
   );

 if(r.error){

  alert(
   r.error.message
  );

  return;

 }

 delete localBoxes[id];

 saveLocal(
  LOCAL_BOX_KEY,
  localBoxes
 );

 recordHistory(
  'MOTOR SİLİNDİ',
  id
 );

 await openStation(
  current.s.id
 );

}

function boxChange(

 key,

  LOCAL_BOX_KEY,
  localBoxes
 );

}

function addPhotos(event){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 const files=[
  ...(event.target.files||[])
 ];

 if(!files.length)
  return;

 let pending=
  files.length;

 files.forEach(
  file=>{

   const reader=
    new FileReader();

   reader.onload=
    ()=>{

     localPhotos[
      current.s.id
     ] ||= [];

     localPhotos[
      current.s.id
     ].push({

      name:file.name,

      type:file.type,

      data:reader.result,

      date:nowText()

     });

     pending--;

     if(pending===0){

      saveLocal(
       LOCAL_PHOTO_KEY,
       localPhotos
      );

      recordHistory(
       'FOTOĞRAF EKLENDİ',
       `${files.length} fotoğraf`
      );

      render();

     }

    };

   reader.readAsDataURL(
    file
   );

  }
 );

}

function deletePhoto(index){

 if(!edit){

 touchAdminSession();

 if(!confirm(

 ))return;

 localPhotos[
  current.s.id
 ].splice(

  1
 );

 saveLocal(
  LOCAL_PHOTO_KEY,
  localPhotos
 );

 recordHistory(
  'FOTOĞRAF SİLİNDİ',
  ''
 );

 render();

}

async function deleteTerfi(){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(!current?.s?.id)
  return;

 const s=
  current.s;

 const sure=
  confirm(

   `"${s.ad||'Bu terfi'}" tamamen silinsin mi?\n\n`+

   `Bu işlem terfinin bağlı motor, pompa, sürücü, HMI, çalışma, `+
   `parametre ve diğer kayıtlarını da silmeyi deneyecek.\n\n`+

   `GERİ ALINAMAZ.`

  );

 if(!sure)
  return;

 const id=
  s.id;

 try{

  /* Motorlar */

  const mr=
   await db
    .from('motorlar')
    .select('id')
    .eq(
     'terfi_id',
     id
    );

  if(mr.error)
   throw mr.error;

  const motorIds=
   (mr.data||[])
    .map(
     x=>x.id
    );

  /* Motor bağlı BOX */

  for(
   const mid of motorIds
  ){

   delete localBoxes[mid];

  }

  saveLocal(
   LOCAL_BOX_KEY,
   localBoxes
  );


  /* Terfi bazlı bilinen tablolar */

  const terfiTables=[

   'motor_calisma_kayitlari',
   'hmi_kayitlari',
   'hmi_ayarlar',
   'ekran_ayarlari',
   'ekran_verileri',
   'anlik_calisma_verileri',
   'terfi_parametreleri',
   'servis_kayitlari',
   'bakim_kayitlari',
   'teknik_fotograflar',
   'fotograflar',
   'olcumler',
   'olcum_kayitlari',
   'panolar',
   'seviye_bilgileri',
   'degisiklik_gecmisi',
   'ariza_notlari',
   'kablo_baglantilari'

  ];

  for(
   const table of terfiTables
  ){

   const r=
    await db
     .from(table)
     .delete()
     .eq(
      'terfi_id',
      id
     );

   if(r.error){

    console.warn(
     'Silme atlandı:',
     table,
     r.error.message
    );

   }

  }


  /* Sürücüler */

  const dr=
   await db
    .from('suruculer')
    .select('id')
    .eq(
     'terfi_id',
     id
    );

  if(dr.error)
   throw dr.error;

  for(
   const d of dr.data||[]
  ){

   await db
    .from(
     'surucu_ariza_kayitlari'
    )
    .delete()
    .eq(
     'surucu_id',
     d.id
    );

   await db
    .from(
     'surucu_parametre_kayitlari'
    )
    .delete()
    .eq(
     'surucu_id',
     d.id
    );

   const r=
    await db
     .from('suruculer')
     .delete()
     .eq(
      'id',
      d.id
     );

   if(r.error)
    throw r.error;

  }


  /* Motorlar */

  for(
   const mid of motorIds
  ){

   const r=
    await db
     .from('motorlar')
     .delete()
     .eq(
      'id',
      mid
     );

   if(r.error)
    throw r.error;

  }


  /* Pompalar */

  const pumps=
   await db
    .from('pompalar')
    .select('id')
    .eq(
     'terfi_id',
     id
    );

  if(pumps.error)
   throw pumps.error;

  for(
   const p of pumps.data||[]
  ){

   const r=
    await db
     .from('pompalar')
     .delete()
     .eq(
      'id',
      p.id
     );

   if(r.error)
    throw r.error;

  }


  /* ANA TERFİ */

  const finalDelete=
   await db
    .from('terfiler')
    .delete()
    .eq(
     'id',
     id
    );

  if(finalDelete.error)
   throw finalDelete.error;


  /* Yerel foto / geçmiş */

  delete localPhotos[id];

  changeHistory=
   changeHistory.filter(
    x=>
     x.terfi_id!==id
   );

  const ssrMap=
   localJSON(
    LOCAL_SSR_KEY,
    {}
   );

  delete ssrMap[id];

  saveLocal(
   LOCAL_PHOTO_KEY,
   localPhotos
  );

  saveLocal(
   LOCAL_HISTORY_KEY,
   changeHistory
  );

  saveLocal(
   LOCAL_SSR_KEY,
   ssrMap
  );

  alert(
   'Terfi ve bağlı kayıtlar silindi.'
  );

  current=null;

  clearAdminSession();

  await home();

 }catch(e){

  console.error(e);

  alert(
   'Terfi tamamen silinemedi.\n\n'+
   (
    e.message||
    'Bilinmeyen hata'
   )
  );

 }

}

function makePDF(){

 if(!current){

  toast(
   'Önce terfi açın.'
  );

  return;

 }

 if(edit)
  touchAdminSession();

 const old=
  document.getElementById(
   'printArea'
  );

 if(old)
  old.remove();

 const area=
  document.createElement(
   'div'
  );

 area.id=
  'printArea';

 area.className=
  'print-only';

 area.innerHTML=
  reportHTML();

 document.body.appendChild(
  area
 );

 recordHistory(
  'PDF OLUŞTURULDU',
  'Tek sayfalık teknik arşiv raporu'
 );

 setTimeout(
  ()=>{
   window.print();
  },
  250
 );

}


/* =========================================================
   CSV / EXCEL
========================================================= */

function csvEscape(value){

 return `"${String(
  value??''
 ).replaceAll(
  '"',
  '""'
 )}"`;

}

function exportCSV(){

 if(!current){

  toast(
   'Önce terfi açın.'
  );

  return;

 }

 if(edit)
  touchAdminSession();

 const rows=[

  [
   'MESKİ TERFİ ARŞİVİM',
   ''
  ],

  [
   'Terfi',
   current.s.ad||''
  ],

  [
   'Kod',
   current.s.kod||
   current.s.terfi_no||
   ''
  ],

  [
   'Bölge',
   current.s.bolge||
   ''
  ],

  [
   'Adres',
   current.s.adres||
   ''
  ],

  [],

  [
   'MOTORLAR'
  ],

  [
   'Motor',
   'Marka',
   'Model',
   'kW',
   'V',
   'A',
   'Hz',
   'RPM'
  ]

 ];

 current.m.forEach(
  m=>{

   rows.push([

    m.ad,
    m.marka,
    m.model,
    m.guc_kw,
    m.gerilim_v,
    m.nominal_akim_a,
    m.frekans_hz,
    m.devir_rpm

   ]);

  }
 );

 rows.push([]);

 rows.push([
  'SÜRÜCÜLER'
 ]);

 rows.push([

  'Sürücü',
  'Marka',
  'Model',
  'kW',
  'V',
  'Bağlı Motor'

 ]);

 current.d.forEach(
  d=>{

   rows.push([

    d.ad,
    d.marka,
    d.model,
    d.guc_kw,
    d.besleme_v,

    current.m.find(
     m=>
      m.id===
      d.motor_id
    )?.ad||
    ''

   ]);

  }
 );

 rows.push([]);

 rows.push([
  'POMPALAR'
 ]);

 rows.push([

  'Pompa',
  'Marka',
  'Model',
  'kW',
  'Q Min',
  'Q Max',
  'H Min',
  'H Max'

 ]);

 current.p.forEach(
  p=>{

   rows.push([

    p.ad,
    p.marka,
    p.model,
    p.guc_kw,
    p.q_min_m3h,
    p.q_max_m3h,
    p.h_min_m,
    p.h_max_m

   ]);

  }
 );

 rows.push([]);

 rows.push([
  'HMI SAYFALARI'
 ]);

 for(
  let page=1;
  page<=5;
  page++
 ){

  const r=
   current.h.find(
    x=>
     x.ekran_no===
     page
   );

  const values=
   r?.degerler||
   {};

  HMI[
   page-1
  ].forEach(
   (label,i)=>{

    rows.push([

     `HMI ${page}`,
     label,
     values[i]??''

    ]);

   }
  );

 }

 const csv=
  '\ufeff'+
  rows
   .map(
    r=>
     r.map(
      csvEscape
     ).join(';')
   )
   .join('\r\n');

 const blob=
  new Blob(
   [csv],
   {
    type:
     'text/csv;charset=utf-8'
   }
  );

 const url=
  URL.createObjectURL(
   blob
  );

 const a=
  document.createElement(
   'a'
  );

 a.href=url;

 a.download=
  `${
   current.s.kod||
   'terfi'
  }-teknik-arsiv.csv`;

 a.click();

 URL.revokeObjectURL(
  url
 );

 recordHistory(
  'EXCEL/CSV DIŞA AKTARMA',
  ''
 );

}
