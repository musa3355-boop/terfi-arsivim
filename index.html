.system{overflow:hidden;padding:0}.system-head{background:linear-gradient(90deg,#771e2b,#b22d3a,#7b202c);padding:13px 14px}.system-head h2{font-size:19px}.system-nav{display:flex;gap:5px;overflow:auto;padding:7px;background:#071723;border-bottom:1px solid #214a61}.system-nav button{white-space:nowrap;border:1px solid #234e66;background:#0b263a;color:#9fbfce;border-radius:8px;padding:7px 9px;font-size:8px;font-weight:950}.system-nav button.active{background:#e74352;border-color:#ff6a73;color:#fff}.content{padding:0 11px 12px}

emplate-columns:repeat(3,1fr);gap:8px;margin:18px 0}.pressure-io span{border:1px solid #345b6e;border-radius:7px;padding:9px;text-align:center;color:#d2e2e8;font-size:9px}.pressure-io b{display:block;color:#f0f6f8;font-size:13px;margin-top:4px}.protection .protect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.protection .protect-grid>div{border:1px solid #31576a;border-radius:7px;padding:7px}.hmi-menu-tabs{display:grid;grid-template-columns:repeat(6,1fr);overflow:visible}.hmi-menu-tabs button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.hmi-menu-tabs button strong{font-size:12px;color:#fff}.hmi-menu-tabs button span{font-size:7px;line-height:1.1;text-align:center}.hmi-data-editor{margin-top:10px;border:1px solid #21495f;border-radius:9px;padding:8px;background:#081a28}.hmi-data-editor summary{cursor:pointer;color:#9ec0ce;font-size:9px;font-weight:900}.hmi-data-editor[open] summary{margin-bottom:8px}

.dark-real{background:linear-gradient(135deg,#17232d,#07111a);color:#fff;border:1px solid #66737d;border-radius:6px;padding:16px;min-height:310px;box-shadow:inset 0 0 0 3px #0d151c}

.hmi-home{color:#80d65a}.hmi-arrows{color:#f24c3e;font-size:20px}.hmi-save{background:#f0f4f7;color:#47677d;border-radius:50%;padding:7px 10px}

@media print{
 @page{size:A3 landscape;margin:6mm}
 /* PDF SABİT: beyaz zemin + siyah yazı */
 *{color:#000!important;background:#fff!important;box-shadow:none!important;text-shadow:none!important}
 .print-page,.print-page *{color:#000!important;background:#fff!important}

 html,body{margin:0!important;padding:0!important;background:#fff!important}

 .print-page{width:100%;box-sizing:border-box;color:#111;background:#fff;font-family:Arial,sans-serif;font-size:6pt;line-height:1.15;padding:0;page-break-after:always;break-after:page}

function mergeDeep(src,base){
 if(src===undefined||src===null)return clone(base);
 if(Array.isArray(src))return clone(src);
 if(typeof src!=="object")return src;
 const out={...(base&&typeof base==="object"&&!Array.isArray(base)?base:{})};
 Object.keys(src).forEach(k=>{out[k]=src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])?mergeDeep(src[k],out[k]||{}):clone(src[k])});
 return out;
}
function normalizePump(raw,index){
 const base=pumpTemplate(Number(raw?.no)||index+1,raw?.ad||("P"+(Number(raw?.no)||index+1)));
 return mergeDeep(raw||{},base);
}
function normalizeStation(raw,fallback){
 const base=fallback||blankStation(raw?.id,raw?.ad,raw?.rtu,raw?.bolge,raw?.tip);
 const x=mergeDeep(raw||{},base);
 const rawPumps=Array.isArray(raw?.pumps)?raw.pumps:null;
 const basePumps=Array.isArray(base.pumps)?base.pumps:[];
 x.pumps=rawPumps!==null?rawPumps.map((p,i)=>normalizePump(p,i)):basePumps.map((p,i)=>normalizePump(p,i));
 x.history=Array.isArray(x.history)?x.history:[];
 return x;
}
function normalize(saved){
 if(!Array.isArray(saved))return makeDB();
 const seeds=makeDB();
 const byId=new Map(saved.map(s=>[String(s.id||""),s]));
 const byName=new Map(saved.map(s=>[String(s.ad||"").trim().toLocaleLowerCase("tr-TR"),s]));
 const used=new Set();
 const result=seeds.map(seed=>{
  const raw=byId.get(String(seed.id))||byName.get(String(seed.ad).trim().toLocaleLowerCase("tr-TR"));
  if(!raw)return seed;
  used.add(raw);
  return normalizeStation(raw,seed);
 });
 saved.forEach(raw=>{
  if(used.has(raw))return;
  const x=normalizeStation(raw);
  if(!x.id)x.id=uid();
  result.push(x);
 });
 return result;
}
function load(){
 try{
  const raw=localStorage.getItem(STORE);
  if(!raw)return makeDB();
  const x=JSON.parse(raw);
  if(Array.isArray(x)&&x.length)return normalize(x);
  if(Array.isArray(x?.stations)&&x.stations.length)return normalize(x.stations);
 }catch(e){console.warn("Arşiv yükleme hatası",e)}
 return makeDB();
}

function loadDistricts(){try{const x=JSON.parse(localStorage.getItem("MESKI_ILCELER_2026")||"null");window.DISTRICTS=Array.isArray(x)&&x.length?x:["AKDENİZ","MEZİTLİ","TOROSLAR","YENİŞEHİR","MERKEZ"]}catch(e){window.DISTRICTS=["AKDENİZ","MEZİTLİ","TOROSLAR","YENİŞEHİR","MERKEZ"]}}
function openDistricts(){if(!needAdmin())return;openModal("İLÇE YÖNETİMİ",districtHTML())}
function districtHTML(){const ds=getDistricts();return '<div class="muted" style="margin-bottom:8px">Yeni ilçe ekleyebilir, mevcut ilçeyi değiştirebilir veya boş ilçeyi silebilirsin.</div><div id="districtList">'+ds.map((d,i)=>'<div class="data" style="margin:7px 0"><div class="section-head"><b>'+esc(d)+'</b><div class="actions"><button class="btn" onclick="renameDistrict('+i+')">DÜZENLE</button><button class="btn bad" onclick="deleteDistrict('+i+')">SİL</button></div></div><div class="muted">'+db.filter(s=>s.bolge===d).length+' terfi</div></div>').join('')+'</div><div class="actions" style="justify-content:flex-start;margin-top:10px"><button class="btn ok" onclick="addDistrict()">+ YENİ İLÇE</button></div>'}
function addDistrict(){if(!needAdmin())return;const n=prompt("Yeni ilçe adı:","");if(!n)return;const name=n.trim().toLocaleUpperCase("tr-TR");if(!name)return;const ds=getDistricts();if(ds.includes(name)){toast("Bu ilçe zaten var.");return}ds.push(name);window.DISTRICTS=ds;saveDistricts();closeModal();openDistricts();render()}
function renameDistrict(i){if(!needAdmin())return;const ds=getDistricts(),old=ds[i];const n=prompt("Yeni ilçe adı:",old);if(!n)return;const name=n.trim().toLocaleUpperCase("tr-TR");if(!name||name===old)return;if(ds.includes(name)){toast("Bu ilçe zaten var.");return}db.filter(s=>s.bolge===old).forEach(s=>{s.bolge=name;s.history.unshift({date:now(),action:"İLÇE DEĞİŞTİ",detail:old+" → "+name})});ds[i]=name;window.DISTRICTS=ds;saveDistricts();save(false);closeModal();openDistricts();render()}
function deleteDistrict(i){if(!needAdmin())return;const ds=getDistricts(),name=ds[i],count=db.filter(s=>s.bolge===name).length;if(count){toast("Bu ilçede terfi kayıtları var. Önce kayıtların ilçesini değiştir.");return}if(!confirm(name+" ilçesi silinsin mi?"))return;ds.splice(i,1);window.DISTRICTS=ds;saveDistricts();closeModal();openDistricts();render()}
function openMapOverview(){const rows=db.filter(s=>s.gps);const body='<div class="muted" style="margin-bottom:9px">Kayıtlı GPS konumları. Haritalar yalnızca harita işlevini açar; hidrolik ekranıyla bağlantılı değildir.</div>'+(rows.length?'<div class="library-grid">'+rows.map(s=>'<div class="library-item"><div class="library-name">'+esc(s.ad)+'</div><div class="library-desc">'+esc(s.bolge)+' · '+esc(s.gps)+'</div><div class="library-actions"><button class="btn primary" onclick="openGoogleMaps(encodeURIComponent(\''+esc(s.gps)+'\'))">GOOGLE</button><button class="btn" onclick="openAppleMaps(encodeURIComponent(\''+esc(s.gps)+'\'))">APPLE</button></div></div>').join('')+'</div>':'<div class="empty">Henüz kayıtlı GPS konumu yok. Terfi kartından KONUM AL ile ekleyebilirsin.</div>');openModal("HARİTA",body)}

s.tip)+'</div></div><span class="badge '+(s.pumps.length?'ok':'warn')+'">'+(s.pumps.length?s.pumps.length+' POMPA':'POMPA SAYISI GİRİLECEK')+'</span></div><div class="actions" style="justify-content:flex-start;margin:7px 0 4px">'+stationLocationHome(s)+'</div><div class="chips">'+s.pumps.slice(0,8).map(p=>'<span class="chip">'+esc(p.ad)+'</span>').join("")+(s.pumps.length>8?'<span class="chip">+'+(s.pumps.length-8)+'</span>':(s.pumps.length===0?'<span class="chip warn">Pompa sayısı sahadan girilecek</span>':""))+'</div>'+(s.referenceNote?'<div class="muted" style="margin-top:7px">'+esc(s.referenceNote)+'</div>':"")+'</article>').join("")+'</div></section>').join("")||'<div class="empty">Bu bölgede kayıt yok.</div>'}

ionGPS(s)+'</b></div></div></div><div class="card"><div class="section-head"><b>POMPA BLOKLARI · BAĞIMSIZ SİSTEM</b>'+(admin?'<button class="btn ok" onclick="addPump()">+ POMPA</button>':"")+'</div><div class="pumps" style="margin-top:8px">'+s.pumps.map((x,i)=>'<button class="pump c'+((i%6)+1)+' '+(x.id===p.id?"active":"")+'" onclick="selectPump(\''+x.id+'\')"><b>P'+x.no+'</b><small>'+esc(x.ad)+'</small></button>').join("")+'</div></div><div class="card system"><div class="system-head"><div class="section-head"><div><h2>P'+p.no+' · '+esc(p.ad)+'</h2><div class="muted" style="color:#ffe0e4">SEÇİLİ POMPA · TÜM TEKNİK KAYITLAR SADECE P'+p.no+' BLOĞUNA AİT</div></div><div class="actions">'+(admin?'<button class="btn" onclick="event.stopPropagation();editPump()">✏️ AD / NO</button><button class="btn bad" onclick="event.stopPropagation();deletePump()">🗑️ POMPAYI SİL</button>':'')+'<span class="badge">P'+p.no+'</span></div></div></div><div class="system-nav">'+[["genel","GENEL"],["pompa","POMPA"],["motor","MOTOR"],["surucu","SÜRÜCÜ"],["box","BOX / KABLO"],["ssr","SSR / SEVİYE"],["hmi","HMI / PLC"],["calisma","ANLIK ÇALIŞMA"],["param","PARAMETRE"],["ariza","ARIZA"],["olay","ALARM / OLAY"],["photo","FOTOĞRAF"],["gecmis","GEÇMİŞ"]].map(x=>'<button class="'+(tab===x[0]?"active":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</div><div class="content">'+tabBody()+'</div></div>'}

if(tab==="genel")return'<div class="grid3" style="margin-top:10px">'+kv("💧 POMPA",{"Ad":p.ad,"Marka":p.pump.marka,"Model":p.pump.model,"Tip":p.pump.tip,"Q min/max":(p.pump.q_min||p.pump.q_max)?(p.pump.q_min||"—")+" / "+(p.pump.q_max||"—")+" m³/h":"—"})+kv("⚙ MOTOR",{"Marka":p.motor.marka,"Model":p.motor.model,"Güç":p.motor.guc_kw?p.motor.guc_kw+" kW":"—","Akım":p.motor.nominal_akim_a?p.motor.nominal_akim_a+" A":"—","Devir":p.motor.devir_rpm?p.motor.devir_rpm+" rpm":"—"})+kv("🔌 SÜRÜCÜ",{"Marka":p.driver.marka,"Model":p.driver.model,"Seri":p.driver.seri_no,"Aile":p.driver.surucu_ailesi})+kv("🟢 SSR",{"Seviye":p.ssr.level,"Alt":p.ssr.low,"Üst":p.ssr.high,"Basınç Giriş":p.ssr.pump_in})+kv("🖥 HMI / PLC",{"Ekran":"6 adet","Kayıtlı":p.hmi.filter(x=>Object.keys(x).length).length,"Seçili":hmiPage})+kv("▶ ANLIK ÇALIŞMA",{"Frekans":p.work.current.frekans_hz?p.work.current.frekans_hz+" Hz":"—","Akım":p.work.current.akim_a?p.work.current.akim_a+" A":"—","Güç":p.work.current.guc_kw?p.work.current.guc_kw+" kW":"—","Durum":p.work.current.durum})+'</div><div class="card"><div class="section-head"><b>TERFİ SAHA BİLGİLERİ</b>'+(admin?'<button class="btn" onclick="editStation()">DÜZENLE</button>':"")+'</div><div class="grid3" style="margin-top:8px">'+kv("KAYNAK / ÇIKIŞ",{"Kaynak":s.source,"Basma / Çıkış":s.outlet,"Adres":s.address})+kv("SAHA",{"Kuyu":s.depth?s.depth+" m":"—","GPS":s.gps,"Tip":s.tip})+kv("NOT",{"Açıklama":s.note})+'</div></div>';

function hmiPageData(p,index){
 const sources=[p?.hmi,p?.hmiData,p?.hmi_kayitlari,p?.hmiKayitlari];
 for(const raw of sources){
  if(Array.isArray(raw)){
   const x=raw[index];
   if(x&&typeof x==='object')return x;
  }else if(raw&&typeof raw==='object'){
   const x=raw[index]??raw[String(index)]??raw[String(index+1)]??raw['ekran_'+(index+1)]??raw['E'+(index+1)]??raw['page_'+(index+1)];
   if(x&&typeof x==='object')return x;
  }
 }
 return {};
}
function hmiKey(s){return String(s??'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function hmiSearchObject(obj,wanted){
 if(!obj||typeof obj!=='object')return '';
 const keys=Object.keys(obj);
 for(const k of wanted){if(Object.prototype.hasOwnProperty.call(obj,k)){const v=obj[k];if(v!==undefined&&v!==null&&String(v)!=='')return v;}}
 const wantedNorm=wanted.map(hmiKey);
 for(const k of keys){if(wantedNorm.includes(hmiKey(k))){const v=obj[k];if(v!==undefined&&v!==null&&String(v)!=='')return v;}}
 return '';
}
function hmiReadValue(p,pageIndex,fieldIndex,label){
 const page=hmiPageData(p,pageIndex);
 const containers=[page,page?.degerler,page?.values,page?.veriler,page?.data,page?.fields,page?.alanlar].filter(x=>x&&typeof x==='object');
 const keys=[fieldIndex,String(fieldIndex),String(fieldIndex+1),label,hmiKey(label),'alan_'+fieldIndex,'field_'+fieldIndex,'deger_'+fieldIndex,'value_'+fieldIndex,'alan_'+(fieldIndex+1),'field_'+(fieldIndex+1),'deger_'+(fieldIndex+1),'value_'+(fieldIndex+1)];
 for(const c of containers){const v=hmiSearchObject(c,keys);if(v!==''&&v!==undefined&&v!==null)return v;}
 return '';
}
function hmiPdfValue(p,pageIndex,fieldIndex,label){
 const candidates=[];
 const push=v=>{if(v!==undefined&&v!==null&&String(v)!=='')candidates.push(v)};
 const raw=Array.isArray(p?.hmi)?p.hmi[pageIndex]:null;
 const data=raw&&typeof raw==='object'?raw:{};
 push(data[fieldIndex]); push(data[String(fieldIndex)]); push(data[String(fieldIndex+1)]);
 const k=hmiKey(label); push(data[k]); push(data[label]);
 ['degerler','values','veriler','data','fields','alanlar'].forEach(n=>{
  const o=data[n]; if(o&&typeof o==='object'){push(o[fieldIndex]);push(o[String(fieldIndex)]);push(o[String(fieldIndex+1)]);push(o[k]);push(o[label]);}
 });
 return candidates.length?candidates[0]:'';
}

function backup(){
 const payload={version:2,app:"MESKİ Terfi Arşivim",savedAt:new Date().toISOString(),stations:db,libraries:{params:PARAMS,faults:FAULTS,drivers:DRIVER_SERIES,hyd:HYD}};

 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="meski-terfi-arsiv-yedek.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast("Tam yedek oluşturuldu.");

function restore(e){
 const f=e.target.files?.[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const x=JSON.parse(r.result);
   const stations=Array.isArray(x)?x:x?.stations;
   if(!Array.isArray(stations))throw Error("Geçersiz MESKİ yedeği.");
   db=normalize(stations);
   if(x?.libraries){
    PARAMS=Array.isArray(x.libraries.params)?x.libraries.params:PARAMS;
    FAULTS=Array.isArray(x.libraries.faults)?x.libraries.faults:FAULTS;
    DRIVER_SERIES=Array.isArray(x.libraries.drivers)?x.libraries.drivers:DRIVER_SERIES;
    HYD=Array.isArray(x.libraries.hyd)?x.libraries.hyd:HYD;
    saveLibraries();
   }
   save(false);home();toast("Yedek geri yüklendi.");
  }catch(err){console.error(err);toast(err.message||"Yedek okunamadı.")}
 };
 r.readAsText(f);e.target.value="";
}

 const data=Array.isArray(rows)?rows:[];
 const th=headers.map(h=>'<th>'+esc(h)+'</th>').join('');
 if(!data.length)return '<table class="ptable"><thead><tr>'+th+'</tr></thead><tbody><tr><td colspan="'+headers.length+'">'+esc(emptyText||'Kayıt yok.')+'</td></tr></tbody></table>';
 return '<table class="ptable"><thead><tr>'+th+'</tr></thead><tbody>'+data.map(r=>'<tr>'+headers.map((_,i)=>'<td>'+esc(r?.[i]!==undefined&&r?.[i]!==null&&String(r[i])!==''?String(r[i]):'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}
function pdfHeader(s,p){
 const no=Number(p?.no)||1;
 return '<div class="print-head"><div><h1>MESKİ TERFİ TEKNİK ARŞİVİ</h1><p>'+esc(s?.ad||'TERFİ')+' · '+esc(s?.rtu||'RTU YOK')+' · TEKNİK POMPA P'+no+' · P'+no+'</p></div><div class="print-meta">'+esc(new Date().toLocaleString('tr-TR'))+'<br><b>SEÇİLİ POMPA: P'+no+'</b><br>'+esc(s?.bolge||'')+'</div></div>';
}
function pdfFooter(s,p,n){
 return '<div class="print-foot">MESKİ TERFİ ARŞİVİM · '+esc(s?.ad||'')+' · P'+(Number(p?.no)||1)+' · SAYFA '+n+'</div>';
}
function pumpPrint(s,p){
 const no=Number(p?.no)||1,pm=p.pump||{},m=p.motor||{},d=p.driver||{},ss=p.ssr||{},b=p.box||{},w=p.work?.current||{};
 const stationInfo=[['Terfi',s.ad],['RTU',s.rtu||'YOK'],['Bölge',s.bolge],['Terfi Tipi',s.tip],['Teknik Pompa No','P'+no],['Pompa Adı',p.ad||'P'+no],['Adres',s.address],['Kaynak / Emiş',s.source],['Basma / Çıkış',s.outlet],['Kuyu',s.depth?String(s.depth)+' m':'—'],['GPS',s.gps],['Saha Açıklaması',s.note],['Referans',s.referenceNote]];
 const pumpMotor=[['Pompa marka',pm.marka],['Pompa model',pm.model],['Pompa tip',pm.tip],['Pompa seri',pm.seri_no],['Pompa güç',pm.guc_kw?pm.guc_kw+' kW':'—'],['Pompa HP',pm.guc_hp],['Q min',pm.q_min],['Q max',pm.q_max],['H min',pm.h_min],['H max',pm.h_max],['Basma / Çıkış',pm.cikis],['Pompa not',pm.not],['Motor marka',m.marka],['Motor model',m.model],['Motor seri',m.seri_no],['Motor tip',m.motor_tipi],['Motor güç',m.guc_kw?m.guc_kw+' kW':'—'],['Motor HP',m.guc_hp],['Motor gerilim',m.gerilim_v?m.gerilim_v+' V':'—'],['Motor akım',m.nominal_akim_a?m.nominal_akim_a+' A':'—'],['Motor frekans',m.frekans_hz?m.frekans_hz+' Hz':'—'],['Motor devir',m.devir_rpm?m.devir_rpm+' rpm':'—'],['Cos φ',m.cos_phi],['Montaj tarihi',m.montaj_tarihi],['Değişim tarihi',m.degisim_tarihi],['Motor not',m.not]];
 const driver=[['Sürücü marka',d.marka],['Sürücü model',d.model],['Sürücü seri',d.seri_no],['Sürücü aile',d.surucu_ailesi],['Güç',d.guc_kw?d.guc_kw+' kW':'—'],['Besleme',d.besleme_v?d.besleme_v+' V':'—'],['Firmware',d.firmware],['Kontrol',d.kontrol],['Sürücü not',d.not],['SSR seviye',ss.level],['SSR alt',ss.low],['SSR üst',ss.high],['Pompa giriş basıncı',ss.pump_in],['Alçak koruma girme',ss.low_enter],['Yüksek koruma girme',ss.high_enter],['Alçak koruma çıkma',ss.low_exit],['Yüksek koruma çıkma',ss.high_exit],['SSR not',ss.note]];
 const work=[['Frekans',w.frekans_hz?w.frekans_hz+' Hz':'—'],['Akım',w.akim_a?w.akim_a+' A':'—'],['Devir',w.devir_rpm?w.devir_rpm+' rpm':'—'],['Güç',w.guc_kw?w.guc_kw+' kW':'—'],['Gerilim',w.gerilim_v?w.gerilim_v+' V':'—'],['Sürücü sıcaklık',w.surucu_sicaklik_c?w.surucu_sicaklik_c+' °C':'—'],['Set basıncı',w.set_basinci_bar?w.set_basinci_bar+' bar':'—'],['Çalışma basıncı',w.calisma_basinci_bar?w.calisma_basinci_bar+' bar':'—'],['Tasarruf',w.tasarruf_kwh?w.tasarruf_kwh+' kWh':'—'],['Durum',w.durum],['Teknik not',w.notlar]];
 const cable=[];[['MOTOR → BOX','motor'],['BOX → SÜRÜCÜ','out'],['SÜRÜCÜ','driver']].forEach(g=>['U','V','W'].forEach(ph=>{const z=b?.[g[1]]?.[ph]||{};cable.push([g[0]+' · '+ph,(z.renk||'—')+' / '+(z.etiket||'—')+' / '+(z.detay||'—')])}));
 const hp=(Array.isArray(HMI)?HMI.slice(0,6):[]);
 const page1='<div class="print-page">'+pdfHeader(s,p)+'<div class="psec"><h2>TERFİ / SEÇİLİ POMPA BİLGİLERİ</h2><div class="pdf-kvgrid">'+stationInfo.map(x=>'<div><b>'+esc(x[0])+'</b><span>'+esc(x[1]!==undefined&&x[1]!==null&&String(x[1])!==''?String(x[1]):'—')+'</span></div>').join('')+'</div></div><div class="pdf-three"><div class="psec"><h2>POMPA / MOTOR · TÜM ALANLAR</h2><div class="pdf-kvgrid two">'+pumpMotor.map(x=>'<div><b>'+esc(x[0])+'</b><span>'+esc(x[1]!==undefined&&x[1]!==null&&String(x[1])!==''?String(x[1]):'—')+'</span></div>').join('')+'</div></div><div class="psec"><h2>SÜRÜCÜ / SSR · TÜM ALANLAR</h2><div class="pdf-kvgrid two">'+driver.map(x=>'<div><b>'+esc(x[0])+'</b><span>'+esc(x[1]!==undefined&&x[1]!==null&&String(x[1])!==''?String(x[1]):'—')+'</span></div>').join('')+'</div></div><div class="psec live-pdf"><h2>ANLIK ÇALIŞMA · TÜM ALANLAR</h2><div class="pdf-kvgrid two">'+work.map(x=>'<div><b>'+esc(x[0])+'</b><span>'+esc(x[1]!==undefined&&x[1]!==null&&String(x[1])!==''?String(x[1]):'—')+'</span></div>').join('')+'</div></div></div><div class="psec"><h2>BOX / KABLO · U / V / W</h2>'+compactTable(['Hat','Değer'],cable,'Kablo kaydı yok.')+'</div>'+pdfFooter(s,p,1)+'</div>';
 const hmiPage='<div class="print-page">'+pdfHeader(s,p)+'<div class="print-hmi-title">HMI / PLC · 6 EKRAN · TEKNİK POMPA P'+no+'</div><div class="hmi-page-grid">'+[0,1,2,3,4,5].map(i=>hmiPrintScreen(p,i)).join('')+'</div>'+pdfFooter(s,p,2)+'</div>';
 const recordsPage='<div class="print-page">'+pdfHeader(s,p)+pdfRecords(s,p)+pdfFooter(s,p,3)+'</div>';
 return page1+hmiPage+recordsPage;
}
function pdfSelected(){
 const s=station(),p=pump();
 if(!s||!p){toast('Önce bir terfi ve pompa seçin.');return;}
 try{
  syncCurrentHMIFromDOM();
  save();
  const root=document.getElementById('printRoot');
  if(!root)throw new Error('PDF alanı bulunamadı');
  root.innerHTML=pumpPrint(s,p);
  requestAnimationFrame(()=>setTimeout(()=>window.print(),80));
 }catch(e){console.error('PDF HATASI',e);toast('PDF oluşturulamadı: '+e.message);}
}
function pdfAll(){
 const s=station();
 if(!s||!s.pumps.length){toast('Bu terfide pompa bulunamadı.');return;}
 try{
  syncCurrentHMIFromDOM();
  save();
  const root=document.getElementById('printRoot');
  if(!root)throw new Error('PDF alanı bulunamadı');
  root.innerHTML=s.pumps.map(p=>pumpPrint(s,p)).join('');
  requestAnimationFrame(()=>setTimeout(()=>window.print(),80));
 }catch(e){console.error('PDF HATASI',e);toast('PDF oluşturulamadı: '+e.message);}
}
window.addEventListener("afterprint",()=>{const e=document.getElementById("printRoot");if(e)e.innerHTML=""})

function render(){const root=document.getElementById("app");root.innerHTML='<div class="shell">'+sidebar()+'<main class="main">'+topbar()+(view==="home"?homeView():stationView())+'<div class="footer">MESKİ TERFİ ARŞİVİM · '+db.length+' TERFİ · '+db.reduce((n,x)=>n+x.pumps.length,0)+' POMPA · TEK DOSYA</div></main></div>';document.querySelectorAll(".adminbar").forEach(x=>x.remove());if(admin){const a=document.createElement("div");a.className="adminbar";a.textContent="● YÖNETİCİ MODU AKTİF · KİLİT";a.onclick=adminLogin;document.body.appendChild(a)}}
db=load();loadLibraries();loadDistricts();render();
</script>
