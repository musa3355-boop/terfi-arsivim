<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2f">
<title>MESKİ Teknik Arşiv</title>

<style>
:root{
 --bg:#061525;
 --bg2:#0a2138;
 --card:#0d2945;
 --card2:#102f4e;
 --line:#244a69;
 --txt:#edf5fb;
 --muted:#8fa8bc;
 --accent:#22a7ff;
 --ok:#35d39a;
 --warn:#ffbd59;
 --bad:#ff667b;
 --shadow:0 12px 30px #0005;
}

*{box-sizing:border-box}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 background:
 radial-gradient(circle at 80% -10%,#15476b 0,#061525 42%,#04111f 100%);
 color:var(--txt);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 min-height:100vh;
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 max-width:1180px;
 margin:auto;
 padding:14px 14px 70px;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 backdrop-filter:blur(18px);
 background:#061525dd;
 border-bottom:1px solid #ffffff12;
 margin:0 -14px;
 padding:12px 14px;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.brand{
 display:flex;
 gap:10px;
 align-items:center;
}

.logo{
 width:42px;
 height:42px;
 border-radius:13px;
 background:linear-gradient(145deg,#159de9,#07518d);
 display:grid;
 place-items:center;
 font-weight:900;
 box-shadow:0 8px 22px #008cff33;
}

.brand h1{
 font-size:16px;
 margin:0;
}

.brand small{
 display:block;
 color:var(--muted);
 font-size:11px;
 margin-top:2px;
}

.iconbtn,
.btn{
 border:1px solid var(--line);
 background:#0b2540;
 color:var(--txt);
 border-radius:11px;
 padding:10px 13px;
}

.iconbtn{
 width:42px;
 height:42px;
 padding:0;
}

.btn.primary{
 background:linear-gradient(135deg,#168fe0,#0966a8);
 border-color:#3eb6ff;
}

.btn.ok{
 background:#0b4d3c;
 border-color:#197e61;
}

.btn.danger{
 background:#501d2a;
 border-color:#8b3447;
}

.btn.ghost{
 background:transparent;
}

h2,h3{
 margin:0;
}

.hero{
 padding:18px 0 10px;
}

.hero h2{
 font-size:28px;
 letter-spacing:-.8px;
}

.hero p{
 color:var(--muted);
 margin:7px 0 0;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin:14px 0;
}

.stat,
.card{
 background:linear-gradient(145deg,#0d2945ee,#092039ee);
 border:1px solid #ffffff12;
 border-radius:17px;
 box-shadow:var(--shadow);
}

.stat{
 padding:14px;
}

.stat b{
 font-size:22px;
}

.stat span{
 display:block;
 color:var(--muted);
 font-size:11px;
 margin-top:3px;
}

.toolbar{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:12px 0;
}

.search{
 flex:1;
 min-width:220px;
 padding:13px 14px;
 background:#061a2d;
 border:1px solid var(--line);
 border-radius:12px;
 color:#fff;
 outline:none;
}

.search:focus,
input:focus,
select:focus,
textarea:focus{
 border-color:#2baaff;
 box-shadow:0 0 0 3px #159de91a;
 outline:none;
}

.chips{
 display:flex;
 gap:7px;
 overflow:auto;
 padding-bottom:3px;
}

.chip{
 white-space:nowrap;
 border:1px solid var(--line);
 background:#09213a;
 color:#bcd0df;
 border-radius:999px;
 padding:8px 12px;
}

.chip.active{
 background:#0e6da9;
 color:#fff;
 border-color:#38b4ff;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:11px;
}

.station{
 padding:15px;
 transition:.18s;
}

.station:hover{
 transform:translateY(-2px);
 border-color:#2c83b9;
}

.station .row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:flex-start;
}

.station h3{
 font-size:15px;
}

.tag{
 display:inline-flex;
 align-items:center;
 gap:5px;
 border-radius:999px;
 padding:5px 8px;
 font-size:10px;
 background:#123754;
 color:#a9c5d8;
}

.tag.ok{
 background:#0c4034;
 color:#6de2b8;
}

.tag.warn{
 background:#4a3518;
 color:#ffd486;
}

.meta{
 color:var(--muted);
 font-size:12px;
 margin-top:7px;
 line-height:1.5;
}

.pills{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:10px;
}

.pill{
 font-size:11px;
 padding:5px 8px;
 border-radius:8px;
 background:#071b2e;
 border:1px solid #ffffff0e;
 color:#bcd2e2;
}

.station-actions{
 display:flex;
 gap:7px;
 margin-top:12px;
}

.station-actions button{
 flex:1;
}

.view{
 display:none;
}

.view.active{
 display:block;
}

.back{
 margin:14px 0;
}

.back button{
 width:100%;
}

.station-head{
 padding:18px;
}

.station-head .eyebrow{
 color:#55bfff;
 font-size:11px;
 font-weight:700;
 letter-spacing:.08em;
}

.station-head h2{
 font-size:24px;
 margin:4px 0;
}

.station-head p{
 color:var(--muted);
 margin:0;
}

.tabs{
 display:flex;
 gap:6px;
 overflow:auto;
 margin:10px 0;
 position:sticky;
 top:67px;
 z-index:10;
 padding:5px 0;
 background:#061525e8;
 backdrop-filter:blur(14px);
}

.tab{
 white-space:nowrap;
 border:1px solid var(--line);
 background:#09213a;
 color:#abc0d0;
 border-radius:10px;
 padding:9px 12px;
}

.tab.active{
 background:#0b6da8;
 color:white;
 border-color:#35b4ff;
}

.section{
 padding:16px;
 margin-bottom:11px;
}

.section-title{
 font-weight:800;
 font-size:13px;
 margin-bottom:12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}

.sub{
 color:var(--muted);
 font-size:11px;
}

.formgrid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px;
}

.field label{
 display:block;
 font-size:10px;
 color:#91aac0;
 margin-bottom:5px;
}

.field input,
.field select,
.field textarea{
 width:100%;
 background:#061a2d;
 border:1px solid var(--line);
 color:#fff;
 border-radius:10px;
 padding:10px;
}

.field textarea{
 min-height:80px;
 resize:vertical;
}

.full{
 grid-column:1/-1;
}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:12px;
}

.actions .btn{
 flex:1;
 min-width:120px;
}

.readonly{
 padding:10px 0;
 border-bottom:1px solid #ffffff0b;
}

.readonly b{
 display:block;
 font-size:10px;
 color:#8da6ba;
}

.readonly span{
 display:block;
 margin-top:3px;
}

.pumpnav{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 margin-bottom:11px;
}

.pumpbtn{
 padding:11px;
 border:1px solid var(--line);
 border-radius:11px;
 background:#09213a;
 color:#bcd1e0;
}

.pumpbtn.active{
 background:#0d6ea8;
 border-color:#39b7ff;
 color:#fff;
}

.pump-summary{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.mini{
 padding:11px;
 border-radius:11px;
 background:#071b2e;
 border:1px solid #ffffff0b;
}

.mini b{
 font-size:10px;
 color:#8ea7bb;
}

.mini span{
 display:block;
 margin-top:4px;
}

.table{
 width:100%;
 border-collapse:collapse;
 font-size:12px;
}

.table th,
.table td{
 padding:9px;
 border-bottom:1px solid #ffffff0e;
 text-align:left;
 vertical-align:top;
}

.table th{
 color:#8fa8bc;
 font-size:10px;
}

.empty{
 padding:30px;
 text-align:center;
 color:var(--muted);
}

.note{
 padding:11px;
 background:#0b2239;
 border-left:3px solid #259ee8;
 border-radius:9px;
 color:#b6ccdc;
 font-size:12px;
 line-height:1.5;
}

.modal{
 position:fixed;
 inset:0;
 background:#0009;
 display:none;
 z-index:50;
 padding:20px;
 overflow:auto;
}

.modal.show{
 display:grid;
 place-items:center;
}

.modalbox{
 width:min(720px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0a2138;
 border:1px solid #2c5877;
 border-radius:18px;
 padding:17px;
 box-shadow:0 20px 70px #0009;
}

.modalhead{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:13px;
}

.x{
 border:0;
 background:#14334d;
 color:white;
 border-radius:10px;
 width:38px;
 height:38px;
}

.libgrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:9px;
}

.libitem{
 padding:12px;
 border:1px solid #ffffff10;
 border-radius:12px;
 background:#071b2e;
}

.libitem strong{
 display:block;
}

.libitem small{
 color:var(--muted);
 line-height:1.4;
}

.toast{
 position:fixed;
 left:50%;
 bottom:20px;
 transform:translate(-50%,20px);
 opacity:0;
 pointer-events:none;
 background:#0c2d49;
 border:1px solid #32739d;
 color:#fff;
 padding:11px 15px;
 border-radius:12px;
 z-index:100;
 transition:.2s;
 max-width:90%;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

footer{
 text-align:center;
 color:#607b90;
 font-size:10px;
 margin-top:25px;
}

@media(max-width:700px){

 .app{
  padding:10px 10px 60px;
 }

 .grid{
  grid-template-columns:1fr;
 }

 .stats{
  grid-template-columns:repeat(2,1fr);
 }

 .formgrid,
 .libgrid{
  grid-template-columns:1fr;
 }

 .pumpnav{
  grid-template-columns:repeat(3,1fr);
 }

 header{
  margin:0 -10px;
  padding:10px;
 }

 .tabs{
  top:61px;
 }

 .hero h2{
  font-size:24px;
 }

 .station-actions{
  flex-direction:column;
 }

}
</style>
</head>

<footer>

</footer>

</main>


<main id="stationView" class="view">

<div class="back">
<button class="btn ghost" onclick="goHome()">← ANA SAYFA</button>
</div>

<div id="stationHead"></div>

<div class="tabs" id="tabs"></div>

<div id="stationContent"></div>

</main>

</div>


<div id="modal" class="modal">

<div class="modalbox">

<div class="modalhead">

<h3 id="modalTitle"></h3>

<button class="x" onclick="closeModal()">✕</button>

</div>

<div id="modalBody"></div>

</div>

</div>


<div id="toast" class="toast"></div>

<input
 id="importFile"
 type="file"
 accept=".json,application/json"
 hidden

function loadDB(){

 try{

  let x=JSON.parse(
   localStorage.getItem("meski_archive_v3")
  );

  if(Array.isArray(x)&&x.length){

   return normalize(x);

  }

 }catch(e){}

 return freshDB();

}


function normalize(arr){

 const baseMap=
  Object.fromEntries(
   BASE.map(x=>[x.ad,x])
  );

 return arr.map(s=>{

  let b=baseMap[s.ad]||{};

  s.pompalar=(s.pompalar||[]).map((p,i)=>
   merge(
    p,
    pumpTemplate(
     (b.pompalar&&b.pompalar[i])
     ?b.pompalar[i].no
     :p.no||"P"+(i+1)
    )
   )
  );

  return {

   ...s,

   ilce:s.ilce||b.ilce||"MERKEZ",

   history:s.history||[],

   faults:s.faults||[],

   maintenance:s.maintenance||[],

   location:s.location||null

  };

 });

}


function merge(a,b){

 for(const k in b){

  if(
   a[k]===undefined||
   a[k]===null
  ){

   b[k]=a[k];

  }else if(
   typeof b[k]==="object"&&
   !Array.isArray(b[k])
  ){

   b[k]=merge(
    a[k]||{},
    b[k]
   );

  }else{

   b[k]=a[k];

  }

 }

 return b;

}

  /[&<>"']/g,
  m=>({

   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[m])
 );

}

function getLocation(){

 if(!navigator.geolocation){

  toast(
   "Bu cihaz GPS konumunu desteklemiyor"
  );

  return;

 }


 toast("Konum alınıyor…");


 navigator.geolocation.getCurrentPosition(

  pos=>{

   current.location={

    lat:
     pos.coords.latitude,

    lng:
     pos.coords.longitude,

    accuracy:
     pos.coords.accuracy,

    date:
     new Date().toISOString()

   };


   historyAdd(
    "KONUM",
    "GPS kaydedildi"
   );

   save();

   renderStation();

   toast("Konum kaydedildi");

  },

  e=>{

   toast(
    "Konum alınamadı: "+
    e.message
   );

  },

  {
   enableHighAccuracy:true,
   timeout:20000,
   maximumAge:0
  }

 );

}

function exportData(){

 let blob=
  new Blob(
   [
    JSON.stringify(
     db,
     null,
     2
    )
   ],
   {
    type:"application/json"
   }
  );


 let a=
  document.createElement("a");


 a.href=
  URL.createObjectURL(blob);


 a.download=
  "meski-teknik-arsiv-yedek.json";


 a.click();


 URL.revokeObjectURL(
  a.href
 );


 toast("Yedek hazır");

}


function importData(e){

 let f=e.target.files[0];

 if(!f)return;


 let r=
  new FileReader();


 r.onload=()=>{

  try{

   let x=
    JSON.parse(
     r.result
    );


   if(!Array.isArray(x))
    throw 0;


   db=
    normalize(x);


   save();

   closeModal();

   goHome();

   toast(
    "Yedek geri yüklendi"
   );

  }catch(_){

   toast(
    "Geçersiz JSON"
   );

  }

 };


 r.readAsText(f);

 e.target.value="";

}

 if(

  confirm(

  )

 ){

  db=
   freshDB();

  save();

  closeModal();

  goHome();

  toast(

  );

 }

}

 ).textContent=t;


 document.getElementById(
  "modalBody"
 ).innerHTML=b;


 document.getElementById(
  "modal"
 ).classList.add("show");

}


function closeModal(){

 document.getElementById(
  "modal"
 ).classList.remove("show");

}

){

 openModal(

  title,

  `

    id="promptValue"
    placeholder="${esc(placeholder)}"
    value="${esc(value)}">

  </div>

   <button
    class="btn primary"
    onclick="

     let v=
      document
      .getElementById('promptValue')
      .value.trim();

     closeModal();

     if(v)
      window._promptCB(v);

    ">

    KAYDET

   </button>

  </div>

  `

 );


 window._promptCB=cb;

}
