<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESKİ - Terfi Arşivim</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#03101f;
    --bg2:#06182b;
    --panel:#071d31;
    --panel2:#09243b;
    --border:#164a73;
    --blue:#1594ff;
    --blue2:#0876d8;
    --text:#edf6ff;
    --muted:#9bb4ca;
    --success:#27d17f;
    --danger:#ff5268;
    --warning:#ffbd45;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at 80% 20%,rgba(0,120,255,.09),transparent 35%),
        radial-gradient(circle at 20% 80%,rgba(0,80,160,.07),transparent 35%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

body:before{
    content:"MESKİ";
    position:fixed;
    right:5%;
    top:25%;
    font-size:150px;
    font-weight:900;
    color:rgba(40,130,210,.025);
    transform:rotate(-12deg);
    pointer-events:none;
    z-index:-1;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
}

/* HEADER */

.header{
    height:82px;
    border-bottom:1px solid rgba(43,128,190,.3);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    background:rgba(2,15,28,.82);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:50;
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand-mark{
    width:52px;
    height:52px;
    border-radius:14px;
    border:1px solid #1e79bd;
    background:linear-gradient(145deg,#073660,#0b82d9);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    box-shadow:0 0 25px rgba(0,140,255,.18);
}

.brand-title{
    font-size:24px;
    font-weight:800;
}

.brand-sub{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
}

.header-right{
    display:flex;
    gap:10px;
    align-items:center;
}

.mode{
    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#07192b;
    color:var(--muted);
    font-size:13px;
}

.mode.edit{
    color:#fff;
    border-color:#168cff;
    background:rgba(15,127,228,.14);
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 82px);
}

.sidebar{
    width:225px;
    border-right:1px solid rgba(35,105,157,.35);
    padding:18px 12px;
    background:rgba(3,18,33,.82);
    position:sticky;
    top:82px;
    height:calc(100vh - 82px);
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav button{
    border:0;
    color:#b9cde0;
    background:transparent;
    border-radius:9px;
    padding:13px 14px;
    text-align:left;
    display:flex;
    gap:12px;
    align-items:center;
    transition:.2s;
}

.nav button:hover{
    background:#0a2943;
    color:#fff;
}

.nav button.active{
    background:linear-gradient(90deg,#086dca,#0b82e5);
    color:#fff;
    box-shadow:0 5px 18px rgba(0,115,225,.2);
}

.nav-icon{
    width:25px;
    text-align:center;
}

.nav-separator{
    height:1px;
    background:#133a58;
    margin:12px 8px;
}

.main{
    flex:1;
    padding:25px;
    max-width:1500px;
    margin:auto;
    width:100%;
}

/* CARDS */

.card{
    background:linear-gradient(145deg,rgba(7,29,49,.96),rgba(4,22,38,.96));
    border:1px solid rgba(31,101,151,.55);
    border-radius:15px;
    box-shadow:0 10px 35px rgba(0,0,0,.16);
}

.card-header{
    padding:18px 20px;
    border-bottom:1px solid rgba(38,102,150,.4);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.card-title{
    font-size:18px;
    font-weight:750;
}

.card-body{
    padding:20px;
}

/* HOME */

.hero{
    padding:28px;
    min-height:225px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    overflow:hidden;
    position:relative;
}

.hero:after{
    content:"";
    position:absolute;
    width:360px;
    height:360px;
    right:-80px;
    top:-110px;
    border-radius:50%;
    border:35px solid rgba(15,121,211,.045);
}

.hero-left{
    position:relative;
    z-index:2;
}

.hero-title{
    font-size:31px;
    margin-bottom:8px;
}

.hero-sub{
    color:var(--muted);
    margin-bottom:22px;
}

.search{
    display:flex;
    gap:10px;
    max-width:720px;
}

.search input{
    flex:1;
    min-width:0;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #19527b;
    background:#061a2d;
    color:#edf6ff;
    border-radius:10px;
    padding:13px 15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#198ef0;
    box-shadow:0 0 0 3px rgba(25,142,240,.08);
}

textarea{
    min-height:110px;
    resize:vertical;
}

input:disabled,
textarea:disabled,
select:disabled{
    opacity:.72;
    cursor:not-allowed;
}

/* BUTTONS */

.btn{
    border:1px solid #1b5b87;
    background:#0a2740;
    color:#dcecff;
    padding:12px 17px;
    border-radius:9px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
    border-color:#2497ed;
}

.btn-primary{
    background:linear-gradient(135deg,#0789f4,#126fd1);
    border-color:#2499f7;
    color:#fff;
}

.btn-success{
    background:linear-gradient(135deg,#13a963,#168c5a);
    border-color:#29c77e;
}

.btn-danger{
    background:#481c29;
    border-color:#913242;
}

.btn-small{
    padding:8px 11px;
    font-size:13px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:13px;
    margin-top:18px;
}

.stat{
    padding:18px;
    min-height:115px;
}

.stat-icon{
    font-size:25px;
    margin-bottom:10px;
}

.stat-label{
    color:#aac1d5;
    font-size:13px;
}

.stat-value{
    font-size:28px;
    font-weight:800;
    margin-top:3px;
}

/* TABLE */

.table-card{
    margin-top:18px;
    overflow:hidden;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    text-align:left;
    color:#79b8eb;
    font-size:12px;
    padding:13px 14px;
    border-bottom:1px solid #164361;
    white-space:nowrap;
}

td{
    padding:13px 14px;
    border-bottom:1px solid rgba(25,74,105,.5);
    color:#dce9f5;
    font-size:13px;
}

tr:hover td{
    background:rgba(13,91,150,.08);
}

/* PAGE */

.page-title{
    margin-bottom:20px;
}

.page-title h1{
    font-size:27px;
}

.page-title p{
    color:var(--muted);
    margin-top:5px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.form-grid.three{
    grid-template-columns:repeat(3,1fr);
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    color:#a9bfd3;
    font-size:13px;
    font-weight:650;
}

.section{
    margin-bottom:18px;
}

.section-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:13px;
    display:flex;
    align-items:center;
    gap:9px;
}

.section-title span{
    color:#2097f7;
}

/* DETAIL */

.detail-top{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:17px;
}

.station-name{
    font-size:28px;
    font-weight:850;
}

.station-meta{
    color:var(--muted);
    margin-top:6px;
}

.badges{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:15px;
}

.badge{
    border:1px solid #1b557c;
    padding:6px 9px;
    border-radius:7px;
    background:#09253b;
    color:#afd4f2;
    font-size:12px;
}

.readonly-box{
    padding:17px;
    border:1px solid #184e74;
    border-radius:11px;
    background:#061a2c;
}

.value-big{
    font-size:24px;
    font-weight:800;
    margin-top:4px;
}

/* TABS */

.tabs{
    display:flex;
    gap:7px;
    overflow:auto;
    padding-bottom:4px;
    margin-bottom:15px;
}

.tab{
    white-space:nowrap;
    padding:10px 15px;
    border-radius:8px;
    background:#08233a;
    border:1px solid #164a6e;
    color:#a9c2d8;
}

.tab.active{
    background:#0b7fe2;
    color:#fff;
    border-color:#249cf7;
}

/* LABEL PLATE */

.nameplate{
    border:2px solid #8e99a5;
    background:#e9edf0;
    color:#111;
    text-align:center;
    padding:17px;
    border-radius:3px;
    margin-bottom:20px;
}

.nameplate strong{
    display:block;
    font-size:25px;
    letter-spacing:.5px;
}

.nameplate small{
    display:block;
    margin-top:4px;
    font-size:14px;
}

/* MOTOR / PUMP TAG */

.tag{
    background:linear-gradient(145deg,#dfe3e6,#aeb6bc);
    color:#111;
    border-radius:7px;
    padding:20px;
    border:1px solid #8b969e;
    box-shadow:inset 0 0 25px rgba(255,255,255,.3);
}

.tag-title{
    font-size:25px;
    font-weight:900;
    margin-bottom:4px;
}

.tag-subtitle{
    font-size:17px;
    font-weight:700;
    margin-bottom:15px;
}

.tag-table{
    width:100%;
    min-width:0;
    border-collapse:collapse;
}

.tag-table th,
.tag-table td{
    color:#111;
    border:1px solid #7f8a91;
    padding:8px;
    background:rgba(255,255,255,.35);
}

.tag-table th{
    font-size:12px;
}

.tag-table td{
    font-size:13px;
}

/* RUNNING */

.compare{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.change{
    border-left:3px solid var(--warning);
    padding-left:12px;
}

.good{
    border-left:3px solid var(--success);
}

.alert{
    border-left:3px solid var(--danger);
}

/* HMI */

.hmi-page{
    background:#02070c;
    border:2px solid #27333e;
    border-radius:9px;
    padding:22px;
    min-height:320px;
}

.hmi-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.hmi-field{
    display:grid;
    grid-template-columns:1fr 100px;
    gap:8px;
    align-items:center;
}

.hmi-field label{
    color:#f0f4f7;
    font-size:13px;
}

.hmi-field input{
    background:#e9edf0;
    color:#345d83;
    border:0;
    border-radius:2px;
    padding:8px;
    text-align:center;
}

/* PHOTO */

.photo-box{
    border:1px dashed #24638d;
    border-radius:11px;
    padding:16px;
    text-align:center;
    background:#061a2b;
}

.photo-preview{
    max-width:100%;
    max-height:280px;
    border-radius:8px;
    margin-top:12px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,5,12,.82);
    backdrop-filter:blur(7px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.hidden{
    display:none;
}

.modal-box{
    width:min(540px,100%);
    background:#071d31;
    border:1px solid #23628e;
    border-radius:17px;
    padding:25px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.modal-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:8px;
}

.modal-text{
    color:#a9bfd2;
    line-height:1.5;
    margin-bottom:20px;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.error{
    color:#ff7385;
    margin-top:10px;
    display:none;
}

/* TOAST */

.toast{
    position:fixed;
    bottom:25px;
    right:25px;
    background:#09263d;
    border:1px solid #2573a8;
    color:#fff;
    padding:13px 17px;
    border-radius:9px;
    opacity:0;
    transform:translateY(20px);
    pointer-events:none;
    transition:.25s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:1100px){
    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .detail-top{
        grid-template-columns:1fr;
    }

    .hmi-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid.three{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){
    .header{
        padding:0 14px;
    }

    .brand-title{
        font-size:18px;
    }

    .brand-sub{
        display:none;
    }

    .sidebar{
        width:66px;
        padding:12px 7px;
    }

    .nav button{
        justify-content:center;
        padding:13px 4px;
    }

    .nav button span:not(.nav-icon){
        display:none;
    }

    .main{
        padding:14px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid,
    .form-grid.three,
    .compare{
        grid-template-columns:1fr;
    }

    .hmi-grid{
        grid-template-columns:1fr;
    }

    .hero{
        padding:20px;
    }

    .hero-title{
        font-size:24px;
    }
}

@media(max-width:500px){
    .header-right .mode{
        display:none;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .modal-actions{
        flex-direction:column;
    }
}
</style>
</head>

        </div>

</nav>

</aside>


<main class="main" id="main"></main>

</div>
</div>


<!-- PASSWORD MODAL -->

<div id="passwordModal" class="modal hidden">

<div class="modal-box">

<div class="modal-title">🔐 Düzenleme Modu</div>

<div class="modal-text">
Kayıt eklemek, değiştirmek veya silmek için düzenleme şifresini girin.
</div>

<div class="field">
<label>Şifre</label>
<input id="passwordInput" type="password" inputmode="numeric"
placeholder="Şifreyi girin"
onkeydown="if(event.key==='Enter')checkPassword()">
</div>

<div id="passwordError" class="error">
Şifre hatalı.
</div>

<div class="modal-actions">

<button class="btn btn-primary" onclick="checkPassword()">
Düzenleme Moduna Gir
</button>

<button class="btn" onclick="continueVisitor()">
Ziyaretçi Olarak Devam Et
</button>

</div>

</div>
</div>


<div id="toast" class="toast"></div>

function buildDefaultHmi(){

let result={};

HMI_PAGES.forEach((page,index)=>{

    result[index]={};

    page.fields.forEach(([label,key])=>{
        result[index][key]="";
    });

});

return result;

}

--------------------------------------------------------- */

function loadData(){

const saved=localStorage.getItem("meski_terfi_arsiv");

if(saved){

    try{
        state.stations=JSON.parse(saved);
        return;
    }catch(e){}
}

state.stations=demoData();

saveData();

}


function saveData(){

localStorage.setItem(
    "meski_terfi_arsiv",
    JSON.stringify(state.stations)
);

}

function toast(text){

const el=document.getElementById("toast");

},2200);

}


/* ---------------------------------------------------------
   PASSWORD
--------------------------------------------------------- */

function openPassword(){

document.getElementById("passwordModal").classList.remove("hidden");

document.getElementById("passwordInput").value="";

document.getElementById("passwordError").style.display="none";

setTimeout(()=>{
    document.getElementById("passwordInput").focus();
},100);

}


function checkPassword(){

const value=document.getElementById("passwordInput").value;

if(value===EDIT_PASSWORD){

    state.editMode=true;

    document.getElementById("passwordModal").classList.add("hidden");

    updateMode();

    toast("Düzenleme modu açıldı.");

    renderCurrent();

}else{

    document.getElementById("passwordError").style.display="block";

}

}


function continueVisitor(){

state.editMode=false;

document.getElementById("passwordModal").classList.add("hidden");

updateMode();

toast("Ziyaretçi modu aktif.");

renderCurrent();

}


function updateMode(){

const badge=document.getElementById("modeBadge");

if(state.editMode){

    badge.textContent="✎ Düzenleme Modu";
    badge.classList.add("edit");

}else{

    badge.textContent="◉ Ziyaretçi Modu";
    badge.classList.remove("edit");

}

}

function hmiTab(index,button){

document.querySelectorAll("#stationTabContent .tab")
.forEach((x,i)=>{
    if(i<HMI_PAGES.length)x.classList.remove("active");
});

button.classList.add("active");

const s=state.stations.find(x=>x.id===state.currentStation);

document.getElementById("hmiContent").innerHTML=
renderHmiPage(s,index);

}


function renderHmiPage(s,index){

const page=HMI_PAGES[index];

if(!s.hmi)s.hmi=buildDefaultHmi();

if(!s.hmi[index])s.hmi[index]={};

return `

<div class="hmi-page">

<div style="font-size:19px;font-weight:800;margin-bottom:20px">
${esc(page.name)}
</div>

<div class="hmi-grid">

${page.fields.map(([label,key])=>`

<div class="hmi-field">

<label>${esc(label)}</label>

<input
value="${attr(s.hmi[index][key]||"")}"
${state.editMode?"":"disabled"}
onchange="setHmiValue(${index},'${key}',this.value)"
>

</div>

`).join("")}

</div>

</div>


${state.editMode ? `

<div style="margin-top:15px">

<button class="btn btn-success"
onclick="saveHmi()">
💾 Bu HMI Sayfasını Kaydet
</button>

</div>

`:""}

`;

}


function setHmiValue(page,key,value){

const s=state.stations.find(x=>x.id===state.currentStation);

if(!s.hmi)s.hmi=buildDefaultHmi();

if(!s.hmi[page])s.hmi[page]={};

s.hmi[page][key]=value;

}


function saveHmi(){

const s=state.stations.find(x=>x.id===state.currentStation);

s.updated=new Date().toLocaleString("tr-TR");

saveData();

toast("HMI sayfası kaydedildi.");

}

function exportJSON(){

const data=JSON.stringify(state.stations,null,2);

const blob=new Blob([data],{
type:"application/json"
});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download="meski-terfi-arsiv-"+new Date().toISOString().slice(0,10)+".json";

a.click();

URL.revokeObjectURL(url);

toast("Arşiv dışa aktarıldı.");

}


/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function esc(value){

if(value===undefined||value===null)return "";

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function attr(value){

return esc(value);

}


function renderCurrent(){

if(state.currentStation){

const s=state.stations.find(x=>x.id===state.currentStation);

if(s){

    renderStationDetail(s);
    return;

}

}

renderHome();

}
