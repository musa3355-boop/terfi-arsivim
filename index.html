async function openStation(id){
 if(String(id).startsWith('seed-')){
  const s=seedStations.find(x=>x.id===id);
  if(!s)return;
  current={s,m:[],p:[],d:[],h:[],w:[],ssr:localSSR[id]||{},detail:terfiDetails[id]||{},location:terfiLocations[id]||null};
  ensureSeedChildren();
  tab='terfi';render();
  return;
 }
 const s=await db.from('terfiler').select('*').eq('id',id).single();
 if(s.error){toast(s.error.message);return}
 const [m,p,d,h,w]=await Promise.all([
  db.from('motorlar').select('*').eq('terfi_id',id).order('created_at'),
  db.from('pompalar').select('*').eq('terfi_id',id).order('created_at'),
  db.from('suruculer').select('*').eq('terfi_id',id).order('created_at'),
  db.from('hmi_kayitlari').select('*').eq('terfi_id',id).order('ekran_no'),
  db.from('motor_calisma_kayitlari').select('*').eq('terfi_id',id).order('captured_at',{ascending:false})
 ]);
 current={s:s.data,m:m.data||[],p:p.data||[],d:d.data||[],h:h.data||[],w:w.data||[],ssr:localSSR[id]||{},detail:terfiDetails[id]||{},location:terfiLocations[id]||null};
 tab='terfi';render();
}

function ensureSeedChildren(){
 const s=current.s;

 if(!current.p.length)for(let i=0;i<count;i++)current.p.push({id:`${s.id}-p${i+1}`,ad:(s.pump_names||[])[i]||`${i+1}. Pompa`,marka:'',model:'',tip:'',seri_no:'',guc_kw:'',guc_hp:'',q_min_m3h:'',q_max_m3h:'',h_min_m:'',h_max_m:'',etiket_notu:''});

}

function captureLocation(){
 if(!ensureEdit())return;
 if(!navigator.geolocation){toast('Bu cihaz konum özelliğini desteklemiyor.');return}
 navigator.geolocation.getCurrentPosition(pos=>{
  const l={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,date:nowISO()};
  terfiLocations[current.s.id]=l;current.location=l;saveLocal(LOCAL_LOCATION_KEY,terfiLocations);recordHistory('TERFİ KONUMU KAYDEDİLDİ','');render();toast('Konum kaydedildi.');
 },err=>toast(err.code===1?'Konum izni verilmedi.':err.code===2?'Konum alınamadı.':'Konum alma zaman aşımına uğradı.'),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function openGoogleMaps(){const l=current.location||terfiLocations[current.s.id];if(l)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(`${l.lat},${l.lng}`),'_blank')}
function openAppleMaps(){const l=current.location||terfiLocations[current.s.id];if(l)window.open('https://maps.apple.com/?ll='+encodeURIComponent(`${l.lat},${l.lng}`)+'&q='+encodeURIComponent(current.s.ad||'MESKİ Terfi'),'_blank')}
function deleteLocation(){if(!ensureEdit())return;if(!confirm('Bu terfinin kayıtlı konumu silinsin mi?'))return;delete terfiLocations[current.s.id];saveLocal(LOCAL_LOCATION_KEY,terfiLocations);current.location=null;recordHistory('TERFİ KONUMU SİLİNDİ','');render()}

   if(kod){
    const dup=await db.from('terfiler').select('id').eq('kod',kod).neq('id',current.s.id).limit(1);
    if(dup.data?.length){toast('Bu kod başka bir terfide kullanılıyor.');return}
   }
   const payload={ad:val('s_ad'),terfi_no:val('s_no'),kod:kod||null,bolge:val('s_bolge'),adres:val('s_adres'),aciklama:val('s_aciklama'),pompa_sayisi:Number(val('s_pompa_sayisi')||0),updated_at:nowISO()};
   if(!String(current.s.id).startsWith('seed-')){
    const r=await db.from('terfiler').update(payload).eq('id',current.s.id);
    if(r.error)throw r.error;
   }
   const detail={pompa_tipi:val('s_pompa_tipi'),calisma_sekli:val('s_calisma_sekli'),emiş_kaynagi:val('s_emis'),basma_noktasi:val('s_basma'),kuyu_derinligi:val('s_kuyu_derinligi'),sistem_aciklama:val('s_sistem_aciklama')};
   terfiDetails[current.s.id]=detail;saveLocal(LOCAL_DETAIL_KEY,terfiDetails);current.detail=detail;
  }
  if(tab==='ssr'){current.ssr={level:val('ssr_level'),low:val('ssr_low'),high:val('ssr_high'),note:val('ssr_note')};localSSR[current.s.id]=current.ssr;saveLocal(LOCAL_SSR_KEY,localSSR)}
  if(tab==='motor'){
   for(const m of current.m){
    const data={ad:val(`m_${m.id}_ad`),marka:val(`m_${m.id}_marka`),model:val(`m_${m.id}_model`),seri_no:val(`m_${m.id}_seri`),guc_kw:val(`m_${m.id}_kw`),guc_hp:val(`m_${m.id}_hp`),gerilim_v:val(`m_${m.id}_v`),nominal_akim_a:val(`m_${m.id}_a`),frekans_hz:val(`m_${m.id}_hz`),devir_rpm:val(`m_${m.id}_rpm`),cos_phi:val(`m_${m.id}_cos`),montaj:val(`m_${m.id}_montaj`),degisim:val(`m_${m.id}_degisim`),notlar:val(`m_${m.id}_not`)};
    Object.assign(m,data);
    if(!String(current.s.id).startsWith('seed-')){const r=await db.from('motorlar').update(data).eq('id',m.id);if(r.error)throw r.error}
   }
  }
  if(tab==='pompa'){
   for(const p of current.p){
    const data={ad:val(`p_${p.id}_ad`),marka:val(`p_${p.id}_marka`),model:val(`p_${p.id}_model`),tip:val(`p_${p.id}_tip`),seri_no:val(`p_${p.id}_seri`),guc_kw:val(`p_${p.id}_kw`),guc_hp:val(`p_${p.id}_hp`),q_min_m3h:val(`p_${p.id}_qmin`),q_max_m3h:val(`p_${p.id}_qmax`),h_min_m:val(`p_${p.id}_hmin`),h_max_m:val(`p_${p.id}_hmax`),etiket_notu:val(`p_${p.id}_not`)};
    Object.assign(p,data);if(!String(current.s.id).startsWith('seed-')){const r=await db.from('pompalar').update(data).eq('id',p.id);if(r.error)throw r.error}
   }
  }
  if(tab==='surucu'){
   for(const d of current.d){
    const data={ad:val(`d_${d.id}_ad`),marka:val(`d_${d.id}_marka`),model:val(`d_${d.id}_model`),guc:val(`d_${d.id}_guc`),besleme:val(`d_${d.id}_besleme`),seri_no:val(`d_${d.id}_seri`),notlar:val(`d_${d.id}_not`)};
    Object.assign(d,data);if(!String(current.s.id).startsWith('seed-')){const r=await db.from('suruculer').update(data).eq('id',d.id);if(r.error)throw r.error}
   }
  }
  if(tab==='box'){
   const m=current.m[0];if(m){const b=getBox(m);for(const sec of ['motor','box_motor','box_surucu','surucu'])for(const k of ['u','v','w']){b[sec][k]={renk:val(`bx_${m.id}_${sec}_${k}_r`),etiket:val(`bx_${m.id}_${sec}_${k}_e`),detay:val(`bx_${m.id}_${sec}_${k}_d`)}}saveLocal('meski_box_v3',localBoxes)}
  }
  if(tab==='hmi'){
   const values={};for(let i=0;i<HMI[hmiPage-1].labels.length;i++)values[i]=val(`hmi_${hmiPage}_${i}`);
   current.h=current.h.filter(x=>Number(x.ekran_no)!==hmiPage);
   const rec={ekran_no:hmiPage,degerler:values};
   if(!String(current.s.id).startsWith('seed-')){const r=await db.from('hmi_kayitlari').insert({terfi_id:current.s.id,ekran_no:hmiPage,degerler:values});if(r.error)throw r.error}
   current.h.push(rec);
  }
  if(tab==='calisma')await saveWork();
  recordHistory('KAYIT GÜNCELLENDİ',tab);
  toast('Kaydedildi.');
  edit=false;clearAdminSession();render();
 }catch(e){console.error(e);toast(e?.message||'Kayıt sırasında hata oluştu')}finally{saveBusy=false}
}

async function saveWork(){
 if(!ensureEdit())return;
 const m=current.m[0];if(!m)return;
 const data={terfi_id:String(current.s.id).startsWith('seed-')?null:current.s.id,motor_id:String(m.id).startsWith('seed-')?null:m.id,motor_ad:m.ad,akim_a:val('work_a')||null,gerilim_v:val('work_v')||null,frekans_hz:val('work_hz')||null,calisma_basinci_bar:val('work_pressure')||null,captured_at:nowISO()};
 if(!String(current.s.id).startsWith('seed-')){const r=await db.from('motor_calisma_kayitlari').insert(data);if(r.error)throw r.error;current.w.unshift(r.data)}
 else current.w.unshift(data);
 recordHistory('ÇALIŞMA KAYDI EKLENDİ','');
 render();
}

function openModal(html,onSave){
 closeModal();
 const wrap=document.createElement('div');wrap.id='modalRoot';wrap.className='modal-backdrop';
 wrap.innerHTML=`<div class="modal"><div class="modal-head"><div></div><button class="modal-close" onclick="closeModal()">×</button></div><div id="modalContent"></div><div class="modal-actions"><button class="btn" onclick="closeModal()">İPTAL</button><button class="btn ok" id="modalSave">KAYDET</button></div></div>`;
 document.body.appendChild(wrap);
 document.getElementById('modalContent').innerHTML=html;
 const h=document.getElementById('modalContent').querySelector('h2');if(h)wrap.querySelector('.modal-head div').appendChild(h.cloneNode(true));if(h)h.remove();
 document.getElementById('modalSave').onclick=()=>onSave?.();
 wrap.addEventListener('click',e=>{if(e.target===wrap)closeModal()});
}
function closeModal(){document.getElementById('modalRoot')?.remove()}

function settingsMarkup(){
 return `<h2>YÖNETİCİ AYARLARI</h2><div class="section-sub">Site giriş şifresi kaldırılmıştır. Yönetici modu ayrı tutulur.</div><div class="settings-grid" style="margin-top:12px">
 <div class="setting"><h4>Görünüm</h4><select id="prefTheme"><option value="dark" selected>Koyu</option></select></div>
 <div class="setting"><h4>Yakınlaştırma</h4><select id="prefZoom"><option value="small" ${prefs.zoom==='small'?'selected':''}>Küçük</option><option value="normal" ${prefs.zoom==='normal'?'selected':''}>Normal</option><option value="large" ${prefs.zoom==='large'?'selected':''}>Büyük</option></select></div>
 <div class="setting"><h4>Ana Başlık</h4><input id="prefTitle" value="${esc(prefs.labels.title)}"></div>
 <div class="setting"><h4>Alt Başlık</h4><input id="prefSubtitle" value="${esc(prefs.labels.subtitle)}"></div>
 <div class="setting"><h4>Yönetici Şifresi</h4><input id="newAdminPassword" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Yeni yönetici şifresi"></div>
 </div>
 <div class="workbox" style="margin-top:12px"><h4>YÖNETİCİ OTURUMU</h4>30 dakika işlem yapılmazsa yönetici modu kilitlenir.</div>`;
}
function showSettings(){
 if(!ensureEdit())return;
 openModal(settingsMarkup(),saveSettings);
}
function saveSettings(){
 prefs.zoom=val('prefZoom')||'normal';prefs.labels.title=val('prefTitle')||'MESKİ Terfi Arşivim';prefs.labels.subtitle=val('prefSubtitle')||'Teknik saha arşivi';
 const np=val('newAdminPassword').trim();if(np){if(!/^\d+$/.test(np))return toast('Yönetici şifresi sadece sayı olabilir.');localStorage.setItem('adminPassword',np)}
 savePrefs();document.body.className='zoom-'+prefs.zoom;closeModal();toast('Ayarlar kaydedildi.');render()
}

async function newStation(){
 if(!ensureEdit())return;
 const k='T'+String(Date.now()).slice(-6);
 const r=await db.from('terfiler').insert({ad:'Yeni Terfi',kod:k,terfi_no:k,pompa_sayisi:0}).select().single();
 if(r.error)return toast(r.error.message);
 await openStation(r.data.id);
}

function collectAll(){
 return {terfi:current.s,motorlar:current.m,pompalar:current.p,suruculer:current.d,hmi:current.h,calisma:current.w};
}
function exportCSV(){
 if(!current)return;
 const rows=[];
 rows.push(['TERFİ',current.s.ad||'']);
 current.m.forEach((m,i)=>rows.push(['MOTOR',i+1,m.ad||'',m.marka||'',m.model||'',m.guc_kw||'',m.nominal_akim_a||'',m.gerilim_v||'',m.frekans_hz||'',m.devir_rpm||'',m.cos_phi||'',m.montaj||'']));
 current.p.forEach((p,i)=>rows.push(['POMPA',i+1,p.ad||'',p.marka||'',p.model||'',p.tip||'',p.seri_no||'',p.guc_kw||'',p.q_min_m3h||'',p.q_max_m3h||'',p.h_min_m||'',p.h_max_m||'']));
 const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(current.s.ad||'terfi')+'.csv';a.click();URL.revokeObjectURL(a.href)
}
function makePDF(){window.print()}

function applyExistingData(){
 try{localStorage.removeItem('sitePassword');localStorage.removeItem('newSitePassword')}catch(e){}
 restoreAdminSession();
}
applyExistingData();
home();
</script>
