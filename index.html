<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>MESKİ | Terfi Arşivim</title>

<style>
:root{
    --bg:#e9f0f5;
    --bg2:#f3f7fa;
    --panel:#ffffff;
    --panel2:#f5f9fc;
    --line:#cbdce8;
    --line2:#8fb6cf;
    --blue:#0878c9;
    --blue2:#1597ed;
    --dark:#123047;
    --text:#173247;
    --muted:#60798b;
    --success:#16865d;
    --warning:#b57900;
    --danger:#c74747;
    --shadow:0 10px 28px rgba(23,61,85,.10);
    --radius:14px;
}

*{box-sizing:border-box}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at 85% 5%,rgba(21,151,237,.10),transparent 28%),
        linear-gradient(145deg,#edf4f8,#e6eef3 60%,#dde8ef);
    color:var(--text);
    min-height:100vh;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:245px;
    min-width:245px;
    background:rgba(250,253,255,.96);
    border-right:1px solid var(--line);
    padding:22px 16px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:50;
    overflow-y:auto;
    box-shadow:5px 0 25px rgba(20,60,80,.04);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
    padding:4px 6px 25px;
    border-bottom:1px solid var(--line);
}

.brand-mark{
    width:54px;
    height:54px;
    border-radius:13px;
    background:linear-gradient(145deg,#0878d8,#1161a3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
    color:#fff;
    box-shadow:0 8px 25px rgba(22,136,237,.20);
}

.brand-title{
    font-size:21px;
    font-weight:800;
    letter-spacing:.5px;
    color:#123047;
}

.brand-sub{
    font-size:10px;
    color:var(--blue);
    letter-spacing:.7px;
    margin-top:3px;
}

.nav{
    margin-top:18px;
}

.nav button{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    margin-bottom:5px;
    border:1px solid transparent;
    border-radius:10px;
    background:transparent;
    color:#365367;
    cursor:pointer;
    text-align:left;
    font-size:14px;
    transition:.18s;
}

.nav button:hover{
    background:#edf7fd;
    border-color:#c6dfef;
}

.nav button.active{
    background:linear-gradient(90deg,#117ccf,#096bb5);
    border-color:#158de0;
    color:white;
    box-shadow:0 8px 20px rgba(0,105,200,.16);
}

.nav-icon{
    width:22px;
    text-align:center;
    color:#0878c9;
}

.nav button.active .nav-icon{
    color:#fff;
}

.sidebar-footer{
    margin-top:30px;
    padding-top:15px;
    border-top:1px solid var(--line);
    color:#7990a0;
    font-size:11px;
    line-height:1.7;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
}

.topbar{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid var(--line);
    background:rgba(249,252,254,.90);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:30;
}

.top-title{
    font-size:17px;
    font-weight:750;
    color:#173247;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.mode{
    border:1px solid #bfd3df;
    padding:9px 13px;
    border-radius:9px;
    font-size:12px;
    color:#627b8c;
    background:#f5f9fb;
}

.mode.edit{
    color:#0873bf;
    border-color:#8fc8ed;
    background:#edf8ff;
}

.content{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

/* =========================
   CARDS
========================= */

.card{
    background:linear-gradient(145deg,#ffffff,#f7fafc);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

.card-header{
    padding:20px 22px;
    border-bottom:1px solid #dce7ee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.card-title{
    font-size:18px;
    font-weight:750;
    color:#173247;
}

.card-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.card-body{
    padding:22px;
}

/* =========================
   HERO
========================= */

.hero{
    padding:28px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
}

.hero:after{
    content:"MESKİ";
    position:absolute;
    right:-25px;
    bottom:-45px;
    font-size:120px;
    font-weight:900;
    color:rgba(15,113,171,.035);
    pointer-events:none;
}

.hero-inner{
    position:relative;
    z-index:2;
}

.hero-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:7px;
    color:#123047;
}

.hero-sub{
    color:#4f6c80;
    font-size:15px;
}

.hero-note{
    margin-top:22px;
    max-width:850px;
    color:#5d7484;
    line-height:1.65;
    font-size:13px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    margin-bottom:20px;
}

.stat{
    padding:19px;
    background:linear-gradient(145deg,#ffffff,#f1f7fa);
    border:1px solid var(--line);
    border-radius:13px;
}

.stat-label{
    font-size:12px;
    color:var(--muted);
}

.stat-value{
    font-size:28px;
    font-weight:800;
    margin-top:9px;
    color:#123047;
}

.stat-unit{
    color:#8195a3;
    font-size:11px;
    margin-top:3px;
}

/* =========================
   BUTTONS
========================= */

button{
    font-family:inherit;
}

.btn{
    border:1px solid #b8cfdd;
    background:#f2f7fa;
    color:#24475d;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    font-size:13px;
    font-weight:650;
    transition:.18s;
}

.btn:hover{
    transform:translateY(-1px);
    border-color:#7eafc9;
}

.btn-primary{
    background:linear-gradient(135deg,#168ff2,#0876ce);
    border-color:#2498f1;
    color:#fff;
}

.btn-success{
    background:linear-gradient(135deg,#159d69,#117d57);
    border-color:#25b87e;
    color:#fff;
}

.btn-danger{
    background:#fff1f1;
    border-color:#e7aaaa;
    color:#c74747;
}

.btn-warning{
    background:#fff8e9;
    border-color:#e4c276;
    color:#956500;
}

.btn-small{
    padding:7px 10px;
    font-size:11px;
}

/* =========================
   SEARCH
========================= */

.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.search{
    flex:1;
    max-width:460px;
    position:relative;
}

.search input{
    width:100%;
    padding:12px 14px 12px 38px;
    background:#fff;
    color:#173247;
    border:1px solid #bfd3df;
    border-radius:9px;
    outline:none;
}

.search input:focus{
    border-color:#3998d3;
    box-shadow:0 0 0 3px rgba(22,136,237,.08);
}

.search span{
    position:absolute;
    left:13px;
    top:11px;
    color:#7196ae;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th{
    text-align:left;
    color:#47718a;
    font-size:11px;
    letter-spacing:.4px;
    font-weight:700;
    padding:13px 14px;
    border-bottom:1px solid #c9dce7;
}

td{
    padding:13px 14px;
    font-size:12px;
    border-bottom:1px solid #e1ebf0;
    color:#355469;
}

tr:hover td{
    background:#f3f9fd;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 8px;
    border-radius:6px;
    font-size:10px;
    background:#eef9f4;
    color:#16865d;
    border:1px solid #bfe6d3;
}

/* =========================
   STATION LIST
========================= */

.station-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.station-card{
    padding:20px;
    border:1px solid #c9dce7;
    background:linear-gradient(145deg,#ffffff,#f2f8fb);
    border-radius:12px;
    cursor:pointer;
    transition:.18s;
}

.station-card:hover{
    border-color:#78afd0;
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(30,88,120,.10);
}

.station-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.station-code{
    color:#0878c9;
    font-size:12px;
    font-weight:800;
}

.station-name{
    font-size:18px;
    font-weight:750;
    margin-top:6px;
    color:#173247;
}

.station-meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:17px;
}

.meta-box{
    background:#edf5f9;
    border:1px solid #d0e1ea;
    padding:9px;
    border-radius:8px;
}

.meta-label{
    font-size:9px;
    color:#78909f;
}

.meta-value{
    font-size:14px;
    font-weight:700;
    margin-top:3px;
    color:#173247;
}

/* =========================
   DETAIL
========================= */

.back-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
}

.station-heading{
    margin-bottom:18px;
}

.station-heading h1{
    margin:0;
    font-size:28px;
    color:#123047;
}

.station-heading p{
    margin:6px 0 0;
    color:var(--muted);
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;
}

.full{
    grid-column:1/-1;
}

/* =========================
   TECH VALUES
========================= */

.value-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.value{
    border:1px solid #cbdde7;
    background:#f5f9fb;
    border-radius:9px;
    padding:14px;
}

.value-label{
    color:#617b8d;
    font-size:11px;
}

.value-number{
    font-size:18px;
    font-weight:750;
    margin-top:6px;
    color:#173247;
}

/* =========================
   FORMS
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full-field{
    grid-column:1/-1;
}

.field label{
    color:#536e80;
    font-size:12px;
    font-weight:650;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#fff;
    border:1px solid #bcd2df;
    color:#173247;
    border-radius:9px;
    padding:12px 13px;
    outline:none;
    font-family:inherit;
    font-size:14px;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#2b9bed;
    box-shadow:0 0 0 3px rgba(22,136,237,.08);
}

.field textarea{
    min-height:105px;
    resize:vertical;
}

.field input:disabled,
.field textarea:disabled,
.field select:disabled{
    background:#f2f6f8;
    color:#637b8b;
}

/* =========================
   SSR
========================= */

.ssr-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.ssr-box{
    background:linear-gradient(145deg,#f6fbfe,#edf5f9);
    border:1px solid #c7dce8;
    border-radius:11px;
    padding:16px;
}

.ssr-title{
    font-size:11px;
    color:#607b8d;
    font-weight:700;
    margin-bottom:8px;
}

.ssr-value{
    font-size:20px;
    font-weight:800;
    color:#0878c9;
}

/* =========================
   MOTOR/PUMP LABEL
========================= */

.nameplate{
    background:
        linear-gradient(145deg,#f5f7f8,#dce3e7);
    color:#1d252a;
    border:6px solid #78858c;
    border-radius:9px;
    padding:20px;
    box-shadow:
        inset 0 0 0 1px #fff,
        0 14px 30px rgba(0,0,0,.14);
}

.nameplate-header{
    text-align:center;
    border-bottom:2px solid #30383d;
    padding-bottom:13px;
    margin-bottom:15px;
}

.nameplate-brand{
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
}

.nameplate-type{
    font-size:13px;
    font-weight:800;
    margin-top:4px;
}

.nameplate-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid #566169;
    border-left:1px solid #566169;
}

.np-field{
    padding:9px;
    border-right:1px solid #566169;
    border-bottom:1px solid #566169;
}

.np-label{
    font-size:9px;
    color:#536069;
    font-weight:700;
}

.np-value{
    font-size:13px;
    font-weight:800;
    margin-top:3px;
}

.nameplate-note{
    margin-top:13px;
    font-size:10px;
    color:#465158;
}

/* =========================
   CABLE
========================= */

.cable-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.cable-card{
    border:1px solid #c6dce8;
    border-radius:10px;
    padding:15px;
    background:#f7fbfd;
}

.cable-label{
    font-size:12px;
    color:#60798a;
    font-weight:700;
}

.cable-value{
    margin-top:8px;
    font-size:16px;
    font-weight:800;
    color:#173247;
}

/* =========================
   BACKUP
========================= */

.backup-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.backup-status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    color:#16865d;
    background:#edf9f3;
    border:1px solid #c1e7d4;
    padding:7px 10px;
    border-radius:8px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#20a96e;
}

/* =========================
   HMI
========================= */

.hmi-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
}

.hmi-tab{
    flex:0 0 auto;
    padding:11px 16px;
    border:1px solid #bdd2df;
    border-radius:8px;
    background:#eef5f9;
    color:#60798a;
    cursor:pointer;
}

.hmi-tab.active{
    background:#147fd9;
    color:white;
    border-color:#2999ef;
}

.hmi-screen{
    margin-top:16px;
    border:2px solid #394c58;
    background:#11181d;
    border-radius:12px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.hmi-title{
    text-align:center;
    font-size:19px;
    font-weight:800;
    color:#e7edf1;
    padding-bottom:14px;
    border-bottom:1px solid #303a41;
    margin-bottom:18px;
}

.hmi-fields{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.hmi-field{
    display:flex;
    align-items:center;
    gap:8px;
}

.hmi-field label{
    flex:1;
    font-size:11px;
    color:#e2e8ec;
}

.hmi-field input{
    width:105px;
    padding:9px 8px;
    border-radius:4px;
    border:1px solid #66737c;
    background:#eef3f6;
    color:#17222b;
    font-size:14px;
    font-weight:650;
}

.hmi-foot{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid #303a41;
    color:#bac4ca;
    font-size:11px;
}

/* =========================
   TECH REFERENCES
========================= */

.reference-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.reference{
    background:#fff;
    border:1px solid #cbdde7;
    border-radius:11px;
    padding:17px;
}

.reference h3{
    font-size:14px;
    margin:0 0 8px;
}

.reference p{
    font-size:11px;
    line-height:1.6;
    color:#667e8d;
    margin:0;
}

.ref-value{
    color:#0878c9;
    font-size:19px;
    font-weight:800;
    margin:8px 0;
}

/* =========================
   LOCK
========================= */

.lock-box{
    text-align:center;
    padding:35px 20px;
}

.lock-icon{
    width:66px;
    height:66px;
    margin:0 auto 15px;
    border:2px solid #218ddd;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    color:#50adff;
}

.lock-box h2{
    margin:0 0 7px;
}

.lock-box p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.password-row{
    max-width:390px;
    margin:auto;
    display:flex;
    gap:8px;
}

.password-row input{
    flex:1;
    background:#fff;
    border:1px solid #bcd2df;
    color:#173247;
    border-radius:9px;
    padding:12px;
    font-size:15px;
    text-align:center;
    letter-spacing:4px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.empty h3{
    color:#365469;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:100;
    padding:13px 17px;
    border-radius:9px;
    background:#fff;
    border:1px solid #9ec7df;
    box-shadow:var(--shadow);
    font-size:13px;
    color:#173247;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){

    .sidebar{
        width:76px;
        min-width:76px;
        padding:15px 9px;
    }

    .brand{
        justify-content:center;
        padding-bottom:16px;
    }

    .brand-text,
    .nav-text,
    .sidebar-footer{
        display:none;
    }

    .brand-mark{
        width:50px;
        height:50px;
    }

    .nav button{
        justify-content:center;
        padding:12px 5px;
    }

    .main{
        margin-left:76px;
        width:calc(100% - 76px);
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .station-grid{
        grid-template-columns:1fr;
    }

    .reference-grid{
        grid-template-columns:1fr;
    }

    .ssr-grid{
        grid-template-columns:1fr 1fr;
    }

    .cable-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:720px){

    .topbar{
        height:64px;
        padding:0 12px;
    }

    .top-title{
        font-size:14px;
    }

    .content{
        padding:14px;
    }

    .hero{
        padding:20px;
    }

    .hero-title{
        font-size:23px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full-field{
        grid-column:auto;
    }

    .value-grid{
        grid-template-columns:1fr;
    }

    .ssr-grid{
        grid-template-columns:1fr;
    }

    .cable-grid{
        grid-template-columns:1fr 1fr;
    }

    .hmi-fields{
        grid-template-columns:1fr;
    }

    .hmi-field{
        justify-content:space-between;
    }

    .hmi-field input{
        width:125px;
        min-height:43px;
        font-size:16px;
    }

    .nameplate-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        max-width:none;
    }

    .password-row{

========================================================= */

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function toast(message){

    const t=document.getElementById("toast");

    t.textContent=message;

    t.classList.add("show");

    setTimeout(()=>{

        t.classList.remove("show");

    },2200);

}


function currentStation(){

    return state.stations.find(
        x=>x.id===state.selectedStation
    );

}


/* =========================================================
   FORM INPUT
========================================================= */

function inputType(type){

    if(type==="date") return "date";

    if(type==="time") return "time";

    if(type==="text") return "text";

    if(type==="textarea") return "textarea";

    return "number";

}


function inputMode(type){

    if(type==="integer")
        return "numeric";

    if(type==="decimal")
        return "decimal";

    return undefined;

}


function fieldHTML(
    label,
    key,
    type,
    object,
    prefix=""
){

    const value=object?.[key] ?? "";

    if(type==="textarea"){

        return `

        <div class="field full-field">

            <label>${esc(label)}</label>

            <textarea
                ${state.editMode ? "" : "disabled"}
                onchange="
                    updateObject(
                        '${prefix}',
                        '${key}',
                        this.value
                    )
                "
            >${esc(value)}</textarea>

        </div>

        `;

    }

    let attr="";

    const htmlType=inputType(type);

    const mode=inputMode(type);

    if(mode)
        attr=`inputmode="${mode}"`;

    if(type==="decimal")
        attr+=` step="any"`;

    if(type==="integer")
        attr+=` step="1"`;

    return `

    <div class="field">

        <label>${esc(label)}</label>

        <input
            type="${htmlType}"
            ${attr}
            value="${esc(value)}"
            ${state.editMode ? "" : "disabled"}
            onchange="
                updateObject(
                    '${prefix}',
                    '${key}',
                    this.value
                )
            "
        >

    </div>

    `;

}


/* =========================================================
   OBJE GÜNCELLE
========================================================= */

function updateObject(prefix,key,value){

    const s=currentStation();

    if(!s) return;

    if(prefix==="measurement"){

        if(!s.measurement)
            s.measurement={};

        s.measurement[key]=value;

    }

    else if(prefix==="motor"){

        if(!s.motor)
            s.motor={};

        s.motor[key]=value;

    }

    else if(prefix==="backupMotor"){

        if(!s.backupMotor)
            s.backupMotor={};

        s.backupMotor[key]=value;

    }

    else if(prefix==="motorCable"){

        if(!s.motorCable)
            s.motorCable={};

        s.motorCable[key]=value;

    }

    else if(prefix==="ssr"){

        if(!s.ssr)
            s.ssr={};

        s.ssr[key]=value;

    }

    else if(prefix==="pump"){

        if(!s.pump)
            s.pump={};

        s.pump[key]=value;

    }

    else if(prefix==="station"){

        s[key]=value;

    }

    saveData();

}


/* =========================================================
   HMI
========================================================= */

function updateHMI(page,key,value){

    const s=currentStation();

    if(!s) return;

    if(!s.hmi)
        s.hmi=HMI_PAGES.map(()=>({}));

    if(!s.hmi[page])
        s.hmi[page]={};

    value=String(value).replace(",", ".");

    s.hmi[page][key]=value;

    saveData();

}

function stationCardsHTML(){

        const q=state.search.toLowerCase();

        if(!q)

        return (

            String(s.code).toLowerCase().includes(q) ||
            String(s.name).toLowerCase().includes(q) ||
            String(s.region).toLowerCase().includes(q) ||
            String(s.address).toLowerCase().includes(q)

        );

    });


    if(!list.length){

        return `

        <div class="empty">

            <h3>Kayıt bulunamadı</h3>

    return `

    <div class="station-grid">

                color:#718999;
                font-size:12px;
                margin-top:7px
            ">

                ${esc(
                    s.region ||
                    "Bölge girilmemiş"
                )}

                ·

                ${esc(
                    s.address ||
                    "Adres girilmemiş"
                )}

            </div>


            <div class="meta-box"
                 style="margin-top:15px">

                <div class="meta-label">

                <div style="

function removeBackupMotor(){

    const s=currentStation();

    if(!s || !state.editMode)
        return;

    if(!confirm(
        "Yedek motor kaydı tamamen kaldırılsın mı?"
    ))
        return;

    s.backupMotor=null;

    saveData();

    render();

    toast("Yedek motor kaldırıldı.");

}

            background:#f4f9fc;
            box-shadow:none;
         ">

        <div class="card-header">

            <div>

                <div class="card-title">
                    Yedek Motor Kablo Renkleri
                </div>

                <div class="card-subtitle">
                    Yedek motorun pano tarafındaki kablo bağlantıları
                </div>

            </div>

        </div>


        <div class="card-body">

            <div class="cable-grid">

                ${backupCableHTML(
                    "U / L1",
                    "u_l1",
                    m.cable.u_l1
                )}

                ${backupCableHTML(
                    "V / L2",
                    "v_l2",
                    m.cable.v_l2
                )}

                ${backupCableHTML(
                    "W / L3",
                    "w_l3",
                    m.cable.w_l3
                )}

                ${backupCableHTML(
                    "PE / Toprak",
                    "pe",
                    m.cable.pe
                )}

            </div>

        </div>

    </div>

    `;

}


/* =========================================================
   YEDEK MOTOR KABLO
========================================================= */

function backupCableHTML(label,key,value){

    return `

    <div class="cable-card">

        <div class="cable-label">
            ${esc(label)}
        </div>

        ${
            state.editMode

            ?

            `
            <input
                type="text"
                value="${esc(value||"")}"
                placeholder="Kablo rengi"
                onchange="
                    updateBackupCable(
                        '${key}',
                        this.value
                    )
                "
                style="
                    width:100%;
                    margin-top:8px;
                    padding:9px;
                    border:1px solid #bcd2df;
                    border-radius:7px;
                    background:#fff;
                    color:#173247;
                "
            >
            `

            :

            `
            <div class="cable-value">
                ${esc(value || "—")}
            </div>
            `
        }

    </div>

    `;

}


function updateBackupCable(key,value){

    const s=currentStation();

    if(!s || !s.backupMotor)
        return;

    if(!s.backupMotor.cable){

        s.backupMotor.cable={

            u_l1:"",
            v_l2:"",
            w_l3:"",
            pe:""

        };

    }

    s.backupMotor.cable[key]=value;

    saveData();

}


/* =========================================================
   HMI
========================================================= */

function hmiHTML(s){

    if(!s.hmi)
        s.hmi=HMI_PAGES.map(()=>({}));

    const page=
        HMI_PAGES[state.hmiPage];

    return `

    <div class="hmi-tabs">

        ${HMI_PAGES.map(
            (p,i)=>`

            <button
                class="hmi-tab ${
                    i===state.hmiPage
                    ?"active"
                    :""
                }"
                onclick="
                    state.hmiPage=${i};
                    render()
                ">

                ${esc(p.title)}

            </button>

        `).join("")}

    </div>


    <div class="hmi-screen">

        <div class="hmi-title">

            ${esc(page.title)}

        </div>


        <div class="hmi-fields">

            ${page.fields.map(
                ([label,key,type])=>{

                    const value=
                        s.hmi[state.hmiPage]?.[key]
                        ?? "";

                    return `

                    <div class="hmi-field">

                        <label>
                            ${esc(label)}
                        </label>

                        ${
                            state.editMode

                            ?

                            `
                            <input
                                type="number"
                                inputmode="${
                                    type==="decimal"
                                    ?"decimal"
                                    :
                                    "numeric"
                                }"
                                step="${
                                    type==="decimal"
                                    ?"any"
                                    :
                                    "1"
                                }"
                                value="${esc(value)}"
                                onchange="
                                    updateHMI(
                                        ${state.hmiPage},
                                        '${key}',
                                        this.value
                                    )
                                "
                            >
                            `

                            :

                            `
                            <input
                                type="text"
                                value="${esc(value)}"
                                disabled
                            >
                            `
                        }

                    </div>

                    `;

                }

            ).join("")}

        </div>


        <div class="hmi-foot">

            <span>
                WEINTEK HMI PARAMETRE ARŞİVİ
            </span>

            <span>
                Sayfa
                ${state.hmiPage+1}
                /
                ${HMI_PAGES.length}
            </span>

        </div>

    </div>

    `;

}


/* =========================================================
   REFERANSLAR
========================================================= */

/* =========================================================
   ERİŞİM
========================================================= */

function openAccess(){

    const root=
        document.getElementById("appContent");

    root.innerHTML=`

    <section class="card">

        <div class="lock-box">

            <div class="lock-icon">
                🔒
            </div>

            <h2>
                Düzenleme Yetkisi
            </h2>

            <p>
                Kayıt eklemek, değiştirmek veya silmek
                için düzenleme şifresini girin.
            </p>


            <div class="password-row">

                <input
                    id="passwordInput"
                    type="password"
                    inputmode="numeric"
                    maxlength="4"
                    placeholder="Şifre"
                    onkeydown="
                        if(event.key==='Enter')
                            checkPassword()
                    "
                >


                <button
                    class="btn btn-primary"
                    onclick="checkPassword()">

                    Düzenleme Moduna Gir

                </button>

            </div>


            <div style="margin-top:15px">

                <button
                    class="btn"
                    onclick="visitorContinue()">

                    Ziyaretçi Olarak Devam Et

                </button>

            </div>

        </div>

    </section>

    `;

}


function checkPassword(){

    const value=
        document.getElementById(
            "passwordInput"
        ).value;

    if(value===EDIT_PASSWORD){

        state.editMode=true;

        toast(
            "Düzenleme modu açıldı."
        );

        render();

    }else{

        toast(
            "Şifre hatalı."
        );

    }

}


function visitorContinue(){

    state.editMode=false;

    render();

    toast(
        "Ziyaretçi modu aktif."
    );

}


function lockEditing(){

    state.editMode=false;

    render();

    toast(
        "Düzenleme modu kapatıldı."
    );

}


/* =========================================================
   YENİ TERFİ
========================================================= */

function newStation(){

    if(!state.editMode){

        openAccess();

        return;

    }


    const s=createDefaultStation();


    const numbers=
        state.stations.map(
            x=>
                parseInt(
                    String(x.code)
                        .replace(/\D/g,"")
                ) || 0
        );


    const next=
        Math.max(0,...numbers)+1;


    s.code=
        "T"+
        String(next).padStart(3,"0");


    s.name="Yeni Terfi";


    state.stations.push(s);

    saveData();


    state.selectedStation=s.id;

    state.page="detail";

    state.hmiPage=0;


    document.getElementById(
        "pageTitle"
    ).textContent="Terfi Teknik Arşivi";


    setActiveNav("navStations");

    render();

    toast(
        "Yeni terfi oluşturuldu."
    );

}


/* =========================================================
   TERFİ SİL
========================================================= */

function deleteStation(){

    if(!state.editMode)
        return;

    const s=currentStation();

    if(!s)
        return;


    if(!confirm(
        `"${s.code} - ${s.name}" kaydı silinsin mi?`
    ))
        return;


    state.stations=
        state.stations.filter(
            x=>x.id!==s.id
        );


    saveData();

    showStations();

    toast(
        "Terfi kaydı silindi."
    );

}


/* =========================================================
   BAŞLAT
========================================================= */

loadData();

render();

</script>
