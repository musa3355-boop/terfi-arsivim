<!doctype html>  
<html lang="tr">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  
<meta name="theme-color" content="#061a2d">  
<title>MESKİ Terfi Arşivim</title>  
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  
<style>  
:root{  
 --bg:#061a2d;  
 --bg2:#09233b;  
 --card:#0c2a45;  
 --card2:#102f4d;  
 --line:#285573;  
 --line2:#3a769d;  
 --text:#eff8ff;  
 --muted:#9eb9cc;  
 --blue:#2eacef;  
 --blue2:#6dd0ff;  
 --ok:#18bd82;  
 --danger:#df4e5b;  
 --warn:#e0a62f;  
 --shadow:0 12px 32px rgba(0,0,0,.22);  
 --radius:16px;  
 --scale:1;  
}  
  
*{  
 box-sizing:border-box  
}  
  
html{  
 scroll-behavior:smooth  
}  
  
body{  
 margin:0;  
 min-height:100vh;  
 background:  
  radial-gradient(circle at top right,rgba(46,172,239,.11),transparent 28%),  
  linear-gradient(145deg,#041525,#09233b 60%,#071a2d);  
 color:var(--text);  
 font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif  
}  
  
body.zoom-small{  
 --scale:.88  
}  
  
body.zoom-large{  
 --scale:1.12  
}  
  
button,  
input,  
textarea,  
select{  
 font:inherit  
}  
  
button{  
 cursor:pointer;  
 -webkit-tap-highlight-color:transparent  
}  
  
input[type=number]{  
 appearance:textfield  
}  
  
input[type=number]::-webkit-outer-spin-button,  
input[type=number]::-webkit-inner-spin-button{  
 appearance:none;  
 margin:0  
}  
  
.hidden{  
 display:none!important  
}  
  
#app{  
 min-height:100vh  
}  
  
.wrap{  
 max-width:1450px;  
 margin:auto;  
 padding:12px 14px 105px  
}  
  
h1,  
h2,  
h3,  
h4{  
 margin:0 0 10px  
}  
  
.card{  
 background:linear-gradient(145deg,rgba(12,42,69,.99),rgba(8,30,50,.99));  
 border:1px solid var(--line);  
 border-radius:var(--radius);  
 padding:15px;  
 margin:10px 0;  
 box-shadow:var(--shadow)  
}  
  
.row{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:10px  
}  
  
.row3{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px  
}  
  
.row4{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:10px  
}  
  
.grid2{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:9px  
}  
  
.grid3{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:9px  
}  
  
.grid4{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:9px  
}  
  
.field{  
 min-width:0  
}  
  
.field label{  
 display:block;  
 font-size:11px;  
 font-weight:750;  
 color:var(--muted);  
 margin-bottom:5px  
}  
  
.field input,  
.field textarea,  
.field select{  
 width:100%;  
 padding:12px;  
 background:#061a2d;  
 color:#fff;  
 border:1px solid var(--line);  
 border-radius:10px;  
 outline:none;  
 min-height:44px  
}  
  
.field textarea{  
 min-height:90px;  
 resize:vertical  
}  
  
.field input[readonly],  
.field textarea[readonly],  
.field select:disabled{
 opacity:.88;
 cursor:default;
}

.hmi-field input[readonly]{
 opacity:.92;
}

.field input:focus,  
.field textarea:focus,  
.field select:focus{  
 border-color:var(--blue);  
 box-shadow:0 0 0 3px rgba(46,172,239,.11)  
}  
  
.btn{  
 min-height:44px;  
 padding:10px 14px;  
 border:1px solid var(--line);  
 border-radius:10px;  
 background:#154664;  
 color:#fff;  
 margin:3px;  
 cursor:pointer;  
 font-weight:800;  
 transition:.16s;  
 touch-action:manipulation  
}  
  
.btn:hover{  
 border-color:var(--blue2);  
 transform:translateY(-1px)  
}  
  
.btn:active{  
 transform:scale(.97)  
}  
  
.btn.primary{  
 background:linear-gradient(145deg,#2eacef,#197fb8);  
 border-color:#4ec1fa  
}  
  
.btn.on{  
 background:var(--blue);  
 border-color:var(--blue)  
}  
  
.btn.ok{  
 background:linear-gradient(145deg,#18bd82,#0e9164);  
 border-color:#2bd59a  
}  
  
.btn.bad{  
 background:linear-gradient(145deg,#df4e5b,#b73d49);  
 border-color:#f06a75  
}  
  
.btn.warn{  
 background:linear-gradient(145deg,#87631f,#695019);  
 border-color:#a8802e  
}  
  
.btn.big{  
 min-height:50px;  
 padding:13px 16px;  
 font-weight:950  
}  
  
.btn:disabled{  
 opacity:.55;  
 cursor:not-allowed  
}  
  
.top{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.top-left{  
 display:flex;  
 align-items:center;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.top-right{  
 display:flex;  
 align-items:center;  
 gap:6px;  
 flex-wrap:wrap;  
 justify-content:flex-end  
}  
  
.logo{  
 width:48px;  
 height:48px;  
 display:grid;  
 place-items:center;  
 border-radius:14px;  
 background:linear-gradient(145deg,#168fe2,#075fae);  
 font-size:24px;  
 font-weight:950;  
 box-shadow:0 8px 22px rgba(15,144,224,.24)  
}  
  
.page-title{  
 font-size:calc(22px * var(--scale));  
 font-weight:950;  
 letter-spacing:.2px  
}  
  
.page-sub{  
 color:var(--muted);  
 font-size:12px;  
 line-height:1.45  
}  
  
.badge{  
 display:inline-block;  
 padding:6px 9px;  
 border-radius:999px;  
 background:#163f59;  
 color:#9edcff;  
 font-size:10px;  
 font-weight:850  
}  
  
.badge.ok{  
 background:#104b39;  
 color:#8bf0bf  
}  
  
.badge.warn{  
 background:#574119;  
 color:#ffd87c  
}  
  
.badge.location{  
 background:#163d54;  
 color:#7fd9ff  
}  
  
.badge.danger{  
 background:#52242b;  
 color:#ff9ea7  
}  
  
.admin-status{  
 display:inline-block;  
 padding:7px 9px;  
 border-radius:999px;  
 background:#104b39;  
 color:#8bf0bf;  
 font-size:10px;  
 font-weight:800  
}  
  
.nav{  
 display:flex;  
 gap:6px;  
 overflow-x:auto;  
 padding:6px 0 10px;  
 position:sticky;  
 top:0;  
 z-index:50;  
 background:rgba(5,20,35,.95);  
 backdrop-filter:blur(12px);  
 scrollbar-width:none  
}  
  
.nav::-webkit-scrollbar{  
 display:none  
}  
  
.nav .btn{  
 white-space:nowrap;  
 flex:0 0 auto;  
 margin:0  
}  
  
.station{  
 background:linear-gradient(145deg,#0b2945,#0a2137);  
 border:1px solid #2a5775;  
 border-radius:15px;  
 padding:15px;  
 margin:9px 0;  
 cursor:pointer;  
 transition:.16s;  
 box-shadow:0 8px 20px rgba(0,0,0,.12)  
}  
  
.station:hover{  
 border-color:var(--blue);  
 transform:translateY(-1px)  
}  
  
.station:active{  
 transform:scale(.995)  
}  
  
.station-title{  
 font-weight:950;  
 font-size:18px  
}  
  
.station-meta{  
 font-size:12px;  
 color:var(--muted);  
 margin-top:4px  
}  
  
.station-badges{  
 display:flex;  
 gap:6px;  
 flex-wrap:wrap;  
 margin-top:9px  
}  
  
.station-actions{  
 display:flex;  
 gap:5px;  
 flex-wrap:wrap;  
 margin-top:10px  
}  
  
.station-actions .btn{  
 margin:0  
}  
  
.summary{  
 display:grid;  
 grid-template-columns:repeat(6,1fr);  
 gap:10px  
}  
  
.stat{  
 border:1px solid var(--line);  
 border-radius:13px;  
 background:#0a2138;  
 padding:14px  
}  
  
.stat-label{  
 font-size:11px;  
 color:var(--muted)  
}  
  
.stat-value{  
 font-size:25px;  
 font-weight:950;  
 margin-top:5px  
}  
  
.stat-unit{  
 font-size:10px;  
 color:#7591a5  
}  
  
.section-title{  
 font-size:17px;  
 font-weight:950;  
 margin-bottom:10px  
}  
  
.section-sub{  
 color:var(--muted);  
 font-size:11px;  
 line-height:1.55  
}  
  
.workbox{  
 background:#081b30;  
 border:1px solid #274c67;  
 border-radius:12px;  
 padding:12px;  
 margin:8px 0  
}  
  
.workbox h4{  
 font-size:12px;  
 color:#b5cad7  
}  
  
.empty{  
 padding:18px;  
 color:var(--muted);  
 border:1px dashed #34536b;  
 border-radius:10px;  
 text-align:center  
}  
  
.motor-card,  
.driver-card,  
.pump-card,  
.fault-card,  
.param-card,  
.history-card{  
 background:#091827;  
 border:1px solid #203b56;  
 border-radius:14px;  
 padding:13px;  
 margin:9px 0  
}  
  
.motor-header,  
.driver-header,  
.pump-header{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap;  
 margin-bottom:10px  
}  
  
.library-grid{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:10px  
}  
  
.library-card{  
 background:#091827;  
 border:1px solid #203b56;  
 border-radius:14px;  
 padding:13px;  
 transition:.15s  
}  
  
.library-card:hover{  
 border-color:var(--blue)  
}  
  
.library-code{  
 font-size:20px;  
 font-weight:950;  
 color:#67c9ff;  
 cursor:pointer  
}  
  
.library-name{  
 font-weight:900;  
 margin-top:3px;  
 cursor:pointer  
}  
  
.library-desc{  
 font-size:12px;  
 color:#a9bbcd;  
 line-height:1.5;  
 margin-top:7px;  
 cursor:pointer  
}  
  
.library-source{  
 font-size:10px;  
 color:#71879b;  
 margin-top:8px;  
 cursor:pointer  
}  
  
.library-driver{  
 display:inline-block;  
 margin-top:8px;  
 padding:6px 8px;  
 border-radius:999px;  
 background:#123b52;  
 border:1px solid #285d78;  
 color:#8fdcff;  
 font-size:10px;  
 font-weight:800  
}  
  
.library-actions{  
 display:flex;  
 gap:5px;  
 flex-wrap:wrap;  
 margin-top:10px  
}  
  
.library-actions .btn{  
 margin:0  
}  
  
.param-row-actions{  
 display:flex;  
 gap:5px;  
 flex-wrap:wrap;  
 margin-top:8px  
}  
  
.param-row-actions .btn{  
 margin:0  
}  
  
.quick-library-title{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.quick-library-card{  
 background:#091827;  
 border:1px solid #203b56;  
 border-radius:14px;  
 padding:13px  
}  
  
.quick-library-card h3{  
 font-size:15px  
}  
  
.quick-library-list{  
 display:grid;  
 gap:8px;  
 margin-top:10px  
}  
  
.quick-library-item{  
 border:1px solid #214159;  
 border-radius:11px;  
 background:#081b30;  
 padding:10px  
}  
  
.quick-library-main{  
 display:flex;  
 align-items:flex-start;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.quick-library-code{  
 color:#67c9ff;  
 font-size:14px;  
 font-weight:950  
}  
  
.quick-library-name{  
 font-size:12px;  
 font-weight:900;  
 margin-top:3px  
}  
  
.quick-library-meta{  
 color:#91adbf;  
 font-size:10px;  
 margin-top:4px;  
 line-height:1.45  
}  
  
.quick-library-driver{  
 color:#8bf0bf;  
 font-size:10px;  
 font-weight:800;  
 margin-top:7px  
}  
  
.quick-library-actions{  
 display:flex;  
 gap:4px;  
 flex-wrap:wrap  
}  
  
.quick-library-actions .btn{  
 margin:0;  
 min-height:38px;  
 padding:7px 9px;  
 font-size:11px  
}  
  
.hmi-shell{  
 border:1px solid #335563;  
 border-radius:14px;  
 background:#102a34;  
 padding:13px  
}  
  
.hmi-tabs{  
 display:flex;  
 gap:6px;  
 overflow-x:auto;  
 padding-bottom:8px;  
 scrollbar-width:none  
}  
  
.hmi-tabs::-webkit-scrollbar{  
 display:none  
}  
  
.hmi-tab{  
 flex:0 0 auto;  
 min-height:44px;  
 padding:10px 14px;  
 border:1px solid #466d7d;  
 border-radius:9px;  
 background:#163745;  
 color:#a9cad9;  
 cursor:pointer;  
 font-weight:800  
}  
  
.hmi-tab.active{  
 background:var(--blue);  
 color:#fff;  
 border-color:var(--blue)  
}  
  
.hmi-fields{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px;  
 align-items:start;  
 margin-top:12px  
}  
  
.hmi-column{  
 min-width:0  
}  
  
.hmi-column-title{  
 color:#8cb9c9;  
 font-size:10px;  
 font-weight:900;  
 margin:0 0 7px 2px;  
 text-transform:uppercase  
}  
  
.hmi-field{  
 background:#0b222c;  
 border:1px solid #264c5a;  
 border-radius:10px;  
 padding:9px;  
 margin-bottom:8px  
}  
  
.hmi-field label{  
 display:block;  
 color:#a6c6d3;  
 font-size:10px;  
 font-weight:800;  
 margin-bottom:5px;  
 line-height:1.35  
}  
  
.hmi-field input{  
 width:100%;  
 min-height:44px;  
 padding:10px;  
 border-radius:8px;  
 border:1px solid #597885;  
 background:#f5f9fb;  
 color:#061828  
}  
  

.hmi-visual{
 width:100%;
 aspect-ratio:16/9;
 border:2px solid #253a45;
 border-radius:8px;
 background:linear-gradient(135deg,#162b35,#07151d);
 overflow:hidden;
 position:relative;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
.hmi-visual-inner{
 position:absolute;
 inset:4%;
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:2.8%;
}
.hmi-vcol{min-width:0;display:flex;flex-direction:column;justify-content:flex-start}
.hmi-vfield{
 display:grid;
 grid-template-columns:minmax(0,1.45fr) minmax(48px,.75fr);
 gap:4px;
 align-items:center;
 margin-bottom:3.2%;
}
.hmi-vfield label{
 color:#e8eef1;
 font-size:clamp(6px,1.25vw,11px);
 line-height:1.08;
 font-weight:700;
}
.hmi-vfield input{
 width:100%;
 min-width:0;
 height:clamp(18px,3.7vw,35px);
 padding:2px 4px;
 border:1px solid #d9e0e4;
 border-radius:1px;
 background:#f4f7f8;
 color:#6d9ac4;
 font-size:clamp(8px,1.6vw,14px);
 text-align:center;
}
.hmi-screen-title{
 position:absolute;
 left:50%;
 top:2%;
 transform:translateX(-50%);
 color:#f3f7f8;
 font-size:clamp(8px,1.7vw,16px);
 font-weight:800;
 white-space:nowrap;
}
.hmi-screen-footer{
 position:absolute;
 left:4%;
 right:4%;
 bottom:3%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 color:#e8eef1;
 font-size:clamp(6px,1.25vw,11px);
 font-weight:800;
}
.hmi-footer-left,.hmi-footer-right{display:flex;align-items:center;gap:7px}
.hmi-btn{
 min-width:clamp(34px,7vw,66px);
 min-height:clamp(18px,4vw,34px);
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:clamp(6px,1.2vw,10px);
 color:#07151d;
 font-weight:900;
 background:#34e3d0;
 border:1px solid rgba(255,255,255,.4);
}
.hmi-btn.home{border-radius:3px;background:#68dc48}
.hmi-btn.save{background:#8cbbe0}
.hmi-arrows{display:flex;gap:8px;color:#ff5b4d;font-size:clamp(13px,3vw,25px);font-weight:900}
.hmi-pressure-visual{
 position:absolute;
 left:42%;
 top:42%;
 width:16%;
 height:22%;
 border-left:3px solid #b7c4ca;
 border-right:3px solid #b7c4ca;
 background:linear-gradient(to bottom,#eef3f4 0 35%,#2586e9 35% 100%);
 opacity:.9;
}
.hmi-pressure-pump{
 position:absolute;
 left:45%;
 top:50%;
 width:10%;
 height:8%;
 border-radius:50%;
 background:#123d68;
 border:2px solid #dfe8ed;
}
.hmi-status-dot{
 display:inline-block;
 width:clamp(8px,1.7vw,15px);
 height:clamp(8px,1.7vw,15px);
 border-radius:50%;
 border:2px solid #dce7eb;
 box-shadow:0 0 0 1px rgba(0,0,0,.35);
}
.hmi-status-dot.red{background:#ff4a3d}
.hmi-status-dot.green{background:#21c765}
.hmi-legend{
 position:absolute;
 left:39%;
 top:69%;
 transform:translateX(-50%);
 color:#e9f1f3;
 font-size:clamp(6px,1.1vw,10px);
 font-weight:800;
}
.hmi-ribbon{
 position:absolute;
 top:3%;
 right:4%;
 color:#9db4bf;
 font-size:clamp(5px,1vw,9px);
}

.hmi-layout-note{  
 margin-top:10px;  
 padding:9px;  
 border:1px dashed #396273;  
 border-radius:9px;  
 color:#86abba;  
 font-size:10px;  
 line-height:1.5  
}  
  
.box-grid{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px  
}  
  
.box-node{  
 background:#071827;  
 border:1px solid #2c536b;  
 border-radius:12px;  
 padding:11px  
}  
  
.box-node h4{  
 color:#a9cad9;  
 margin-bottom:8px  
}  
  
.box-table{  
 width:100%;  
 border-collapse:collapse;  
 overflow:hidden;  
 border-radius:10px  
}  
  
.box-table th,  
.box-table td{  
 border:1px solid #294d64;  
 padding:8px;  
 font-size:11px;  
 vertical-align:top  
}  
  
.box-table th{  
 background:#123550;  
 color:#9fd7ef;  
 text-align:left  
}  
  
.box-table input{  
 width:100%;  
 min-height:40px;  
 background:#071a2f;  
 color:#fff;  
 border:1px solid #315670;  
 border-radius:7px;  
 padding:8px  
}  
  
.photo-grid{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:9px  
}  
  
.photo-item{  
 border:1px solid #284c63;  
 border-radius:10px;  
 overflow:hidden;  
 background:#081726  
}  
  
.photo-item img{  
 width:100%;  
 height:160px;  
 object-fit:cover;  
 display:block  
}  
  
.photo-caption{  
 padding:8px;  
 font-size:10px;  
 color:var(--muted);  
 line-height:1.45  
}  
  
.location-card{  
 border:1px solid #23536b;  
 border-radius:14px;  
 background:  
  radial-gradient(circle at top right,rgba(46,172,239,.09),transparent 40%),  
  #081d30;  
 padding:13px  
}  
  
.location-main{  
 display:flex;  
 align-items:flex-start;  
 justify-content:space-between;  
 gap:12px;  
 flex-wrap:wrap  
}  
  
.location-coords{  
 font-size:13px;  
 font-weight:900;  
 color:#77d4ff;  
 line-height:1.55  
}  
  
.location-meta{  
 color:var(--muted);  
 font-size:10px;  
 margin-top:4px  
}  
  
.location-actions{  
 display:flex;  
 flex-wrap:wrap;  
 gap:5px  
}  
  
.location-actions .btn{  
 margin:0  
}  
  
.tag-grid{  
 display:flex;  
 gap:7px;  
 flex-wrap:wrap;  
 margin-top:8px  
}  
  
.tag{  
 border:1px solid #34566c;  
 background:#102b40;  
 color:#a9c9d8;  
 padding:7px 9px;  
 border-radius:999px;  
 font-size:10px;  
 font-weight:800  
}  
  
.tag.active{  
 border-color:#2bbf91;  
 color:#8bf0bf;  
 background:#104b39  
}

/* =========================================================  
   HELPERS  
========================================================= */  
  
function esc(v){  
  
 return String(v??'')  
  .replaceAll('&','&amp;')  
  .replaceAll('<','&lt;')  
  .replaceAll('>','&gt;')  
  .replaceAll('"','&quot;')  
  .replaceAll("'","&#39;");  
  
}  
  
function val(id){  
  
 const e=  
  document.getElementById(id);  
  
 return e?e.value:'';  
  
}  
  
function num(v){  
  
 if(  
  v===null||  
  v===undefined||  
  v===''  
 )  
  return null;  
  
 const n=  
  Number(  
   String(v).replace(',','.')  
  );  
  
 return Number.isFinite(n)  
  ?n  
  :null;  
  
}  
  
function now(){  
  
 return new Date()  
  .toLocaleString(  
   'tr-TR'  
  );  
  
}

function toast(message){  
  
 const t=  
  document.getElementById(  
   'toast'  
  );  
  
 if(!t)  
  return;  
  
 t.textContent=  
  message;  
  
 t.classList.add(  
  'show'  
 );  
  
 clearTimeout(  
  window.__toast  
 );  
  
 window.__toast=  
  setTimeout(  
   ()=>{  
    t.classList.remove(  
     'show'  
    );  
   },  
   2300  
  );  
  
}

/* =========================================================

========================================================= */  
  
function getSession(){  
  
 try{  
  
  return JSON.parse(  
   sessionStorage.getItem(  
    ADMIN_SESSION_KEY  
   )||'null'  
  );  
  
 }catch(e){  
  
  return null;  
  
 }  
}  
  
function setSession(){  
  
 const s={  
  active:true,  
  lastActivity:Date.now()  
 };  
  
 sessionStorage.setItem(  
  ADMIN_SESSION_KEY,  
  JSON.stringify(s)  
 );  
  
 armAdminTimeout();  
  
}  
  
function touchAdminSession(){  
  
 if(!edit)  
  return;  
  
 const s=  
  getSession();  
  
 if(!s?.active){  
  
  edit=false;  
  
  return;  
  
 }  
  
 s.lastActivity=  
  Date.now();  
  
 sessionStorage.setItem(  
  ADMIN_SESSION_KEY,  
  JSON.stringify(s)  
 );  
  
 armAdminTimeout();  
  
}  
  
function clearAdminSession(){  
  
 edit=false;  
  
 clearTimeout(  
  adminTimer  
 );  
  
 adminTimer=null;  
  
 try{  
  
  sessionStorage.removeItem(  
   ADMIN_SESSION_KEY  
  );  
  
 }catch(e){}  
  
}  
  
function restoreAdminSession(){  
  
 const s=  
  getSession();  
  
 if(!s?.active){  
  
  edit=false;  
  
  return false;  
  
 }  
  
 const age=  
  Date.now()-  
  Number(  
   s.lastActivity||0  
  );  
  
 if(  
  age>=ADMIN_IDLE_MS  
 ){  
  
  clearAdminSession();  
  
  return false;  
  
 }  
  
 edit=true;  
  
 armAdminTimeout();  
  
 return true;  
  
}  
  
function armAdminTimeout(){  
  
 clearTimeout(  
  adminTimer  
 );  
  
 if(!edit)  
  return;  
  
 const s=  
  getSession();  
  
 if(!s){  
  
  edit=false;  
  
  return;  
  
 }  
  
 const remaining=  
  ADMIN_IDLE_MS-  
  (  
   Date.now()-  
   Number(  
    s.lastActivity||0  
   )  
  );  
  
 if(remaining<=0){  
  
  lockAdminForTimeout();  
  
  return;  
  
 }  
  
 adminTimer=  
  setTimeout(  
   checkAdminTimeout,  
   Math.min(  
    remaining,  
    15000  
   )  
  );  
  
}  
  
function checkAdminTimeout(){  
  
 if(!edit)  
  return;  
  
 const s=  
  getSession();  
  
 if(!s){  
  
  lockAdminForTimeout();  
  
  return;  
  
 }  
  
 const age=  
  Date.now()-  
  Number(  
   s.lastActivity||0  
  );  
  
 if(age>=ADMIN_IDLE_MS){  
  
  lockAdminForTimeout();  
  
 }else{  
  
  armAdminTimeout();  
  
 }  
  
}  
  
function lockAdminForTimeout(){  
  
 clearAdminSession();  
  
 toast(  
  'Yönetici oturumu zaman aşımı nedeniyle kilitlendi.'  
 );  
  
 if(current){  
  
  render();  
  
 }else{  
  
  home();  
  
 }  
  
}

async function countTable(  
 table,  
 ids  
){  
  
 if(!ids.length)  
  return 0;  
  
 const r=  
  await db  
   .from(table)  
   .select('id,terfi_id')  
   .in(  
    'terfi_id',  
    ids  
   );  
  
 if(r.error)  
  return 0;  
  
 return (  
  r.data||[]  
 ).length;  
  
}

function loadViewState(){
 try{
  return JSON.parse(sessionStorage.getItem(VIEW_STATE_KEY)||'{}');
 }catch(e){ return {}; }
}

function saveViewState(state){
 try{ sessionStorage.setItem(VIEW_STATE_KEY,JSON.stringify(state)); }catch(e){}
}

function viewKey(id,section=tab,page=hmiPage){
 return `${id||'home'}::${section}::${page||1}`;
}

function captureScrollPosition(){
 if(!current?.s?.id) return;
 const state=loadViewState();
 state[viewKey(current.s.id,tab,hmiPage)]={y:window.scrollY||window.pageYOffset||0,at:Date.now()};
 saveViewState(state);
}

function restoreScrollPosition(){
 if(!current?.s?.id) return;
 const state=loadViewState();
 const saved=state[viewKey(current.s.id,tab,hmiPage)];
 const y=Number(saved?.y||0);
 requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:'auto'})));
}

function setHmiPage(page){
 if(edit) touchAdminSession();
 captureScrollPosition();
 hmiPage=Number(page)||1;
 render();
}

async function openStation(id){
 const sameStation=!!(current?.s?.id && current.s.id===id);
 const wantedTab=sameStation?tab:'terfi', wantedHmiPage=sameStation?hmiPage:1;
 const wantedWorkMotor=sameStation?workMotor:null, wantedSelectedMotorId=sameStation?selectedMotorId:null;
 const [s,m,p,d]=await Promise.all([
  db.from('terfiler').select('*').eq('id',id).single(),
  db.from('motorlar').select('*').eq('terfi_id',id).order('created_at',{ascending:true}),
  db.from('pompalar').select('*').eq('terfi_id',id).order('pompa_no',{ascending:true}),
  db.from('suruculer').select('*').eq('terfi_id',id).order('created_at',{ascending:true})
 ]);
 if(s.error){alert(s.error.message);return;}
 current={s:s.data,m:m.data||[],p:p.data||[],d:d.data||[],h:[],w:[],tp:[],detail:getTerfiDetail(id),location:getLocation(id),ssr:{level:'',low:'',high:'',note:''}};
 const ssrMap=localJSON(LOCAL_SSR_KEY,{}); current.ssr=ssrMap[id]||current.ssr;
 tab=wantedTab; hmiPage=wantedHmiPage; workMotor=wantedWorkMotor||current.m[0]?.id||null; selectedMotorId=wantedSelectedMotorId||current.m[0]?.id||null;
 const wantedPump=sameStation?current.p.find(p=>p.id===selectedPumpId):null;
 selectedPumpId=wantedPump?.id||current.p[0]?.id||null;
 if(selectedPumpId){ const sp=current.p.find(p=>p.id===selectedPumpId); if(sp?.motor_id) selectedMotorId=sp.motor_id; if(sp?.motor_id) workMotor=sp.motor_id; }
 if(edit)touchAdminSession();
 recordHistory('TERFİ AÇILDI',`${current.s.ad||''} (${current.s.kod||current.s.terfi_no||''})`);
 render(); restoreScrollPosition();
 const extras=await Promise.all([
  db.from('hmi_kayitlari').select('*').eq('terfi_id',id).order('ekran_no',{ascending:true}),
  db.from('motor_calisma_kayitlari').select('*').eq('terfi_id',id).order('captured_at',{ascending:false}),

 ]);
 if(current?.s?.id!==id)return;
 current.h=extras[0].data||[]; current.w=extras[1].data||[]; current.tp=extras[2].data||[];
 if(tab==='hmi'||tab==='calisma'||tab==='parametre')render();

function requestLocation(){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 if(!navigator.geolocation){  
  
  toast(  
   'Bu cihazda GPS konumu desteklenmiyor.'  
  );  
  
  return;  
  
 }  
  
 toast(  
  'Konum alınıyor...'  
 );  
  
 navigator.geolocation.getCurrentPosition(  
  
  position=>{  
  
   const lat=  
    Number(  
     position.coords.latitude  
    );  
  
   const lng=  
    Number(  
     position.coords.longitude  
    );  
  
   const accuracy=  
    Number(  
     position.coords.accuracy||0  
    );  
  
   const loc={  
  
    lat,  
    lng,  
    accuracy,  
  
    date:  
     now(),  
  
    iso:  
     new Date().toISOString()  
  
   };  
  
   terfiLocations[  
    current.s.id  
   ]=  
    loc;  
  
   saveLocal(  
    LOCAL_LOCATION_KEY,  
    terfiLocations  
   );  
  
   current.location=  
    loc;  
  
   recordHistory(  
    'KONUM KAYDEDİLDİ',  
    `${lat.toFixed(6)}, ${lng.toFixed(6)} · ±${Math.round(accuracy)} m`  
   );  
  
   render();  
  
   toast(  
    'Terfi konumu kaydedildi.'  
   );  
  
  },  
  
  error=>{  
  
   let message=  
    'Konum alınamadı.';  
  
   if(error?.code===1){  
  
    message=  
     'Konum izni verilmedi. Tarayıcı ayarlarından konum iznini aç.';  
  
   }  
  
   if(error?.code===2){  
  
    message=  
     'Konum bilgisi alınamadı. GPS/Wi-Fi konumunu kontrol et.';  
  
   }  
  
   if(error?.code===3){  
  
    message=  
     'Konum alma zaman aşımına uğradı. Tekrar dene.';  
  
   }  
  
   toast(  
    message  
   );  
  
  },  
  
  {  
   enableHighAccuracy:true,  
   timeout:15000,  
   maximumAge:0  
  }  
  
 );  
  
}

async function addMotor(){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 const r=  
  await db  
   .from('motorlar')  
   .insert({  
  
    terfi_id:  
     current.s.id,  
  
    ad:  
     `${current.m.length+1}. Motor`  
  
   })  
   .select()  
   .single();  
  
 if(r.error){  
  
  alert(  
   r.error.message  
  );  
  
  return;  
  
 }  
  
 recordHistory(  
  'MOTOR EKLENDİ',  
  r.data?.ad||''  
 );  
  
 await openStation(  
  current.s.id  
 );  
  
}  
  
async function deleteMotor(  
 id  
){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 if(!confirm(  
  'Bu motor ve bağlı sürücü ilişkisi silinsin mi?'  
 ))  
  return;  
  
 const d=  
  current.d.find(  
   x=>x.motor_id===id  
  );  
  
 if(d){  
  
  const ur=  
   await db  
    .from('suruculer')  
    .update({  
     motor_id:null  
    })  
    .eq(  
     'id',  
     d.id  
    );  
  
  if(ur.error){  
  
   alert(  
    ur.error.message  
   );  
  
   return;  
  
  }  
  
 }  
  
 const r=  
  await db  
   .from('motorlar')  
   .delete()  
   .eq(  
    'id',  
    id  
   );  
  
 if(r.error){  
  
  alert(  
   r.error.message  
  );  
  
  return;  
  
 }  
  
 delete localBoxes[id];  
  
 saveLocal(  
  LOCAL_BOX_KEY,  
  localBoxes  
 );  
  
 recordHistory(  
  'MOTOR SİLİNDİ',  
  id  
 );  
  
 await openStation(  
  current.s.id  
 );  
  
}

function defaultBox(){  
  
 return {  
  
  motor:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  },  
  
  box_motor:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  },  
  
  box_surucu:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  },  
  
  surucu:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  }  
  
 };  
  
}  
  
function normalizeBox(  
 b  
){  
  
 const d=  
  defaultBox();  
  
 return {  
  
  motor:{  
   u:{...d.motor.u,...(b?.motor?.u||{})},  
   v:{...d.motor.v,...(b?.motor?.v||{})},  
   w:{...d.motor.w,...(b?.motor?.w||{})}  
  },  
  
  box_motor:{  
   u:{...d.box_motor.u,...(b?.box_motor?.u||{})},  
   v:{...d.box_motor.v,...(b?.box_motor?.v||{})},  
   w:{...d.box_motor.w,...(b?.box_motor?.w||{})}  
  },  
  
  box_surucu:{  
   u:{...d.box_surucu.u,...(b?.box_surucu?.u||{})},  
   v:{...d.box_surucu.v,...(b?.box_surucu?.v||{})},  
   w:{...d.box_surucu.w,...(b?.box_surucu?.w||{})}  
  },  
  
  surucu:{  
   u:{...d.surucu.u,...(b?.surucu?.u||{})},  
   v:{...d.surucu.v,...(b?.surucu?.v||{})},  
   w:{...d.surucu.w,...(b?.surucu?.w||{})}  
  }  
  
 };  
  
}  
  
function getBox(  
 id  
){  
  
 localBoxes[id]=  
  normalizeBox(  
   localBoxes[id]  
  );  
  
 return localBoxes[id];  
  
}

function hmiBody(){
 const rec=current.h.find(x=>x.ekran_no===hmiPage);
 const values=rec?.degerler||{};
 const page=HMI[hmiPage-1];
 const cols=page.columns||[];
 const field=(i)=>`<div class="hmi-real-field"><span>${esc(page.labels[i])}</span><input id="hmi_${hmiPage}_${i}" value="${esc(values[i]??'')}" ${!edit?'readonly':''}></div>`;
 return `
 <div class="card"><div class="top"><div><h2>🖥 WEINTEK HMI / PLC</h2><div class="section-sub">5 saha ekranı; alan isimleri ve kolon yerleşimi fotoğraflardaki sıraya göre tutulur.</div></div></div><div class="hmi-tabs" style="margin-top:12px">${HMI.map((x,i)=>`<button class="hmi-tab ${hmiPage===i+1?'active':''}" onclick="setHmiPage(${i+1})">${i+1} · ${esc(x.title)}</button>`).join('')}</div></div>
 <div class="card"><div class="hmi-real"><div class="hmi-real-head"><span>WEINTEK · ${esc(page.title)}</span><span>EKRAN ${hmiPage}/5</span></div><div class="hmi-real-body">${cols.map(col=>`<div class="hmi-real-col">${col.indexes.map(i=>field(i)).join('')}</div>`).join('')}</div></div></div>`;
}

========================================================= */
function selectField(label,id,value,options,extra=''){
 const normalized=(options||[]).map(x=>typeof x==='string'?{value:x,label:x}:x);
 return `<div class="field"><label>${esc(label)}</label><select id="${id}" ${!edit?'disabled':''} ${extra||''}>
  <option value="">Seçilmedi</option>
  ${normalized.map(x=>`<option value="${esc(x.value??'')}" ${String(value??'')===String(x.value??'')?'selected':''}>${esc(x.label??x.value??'')}</option>`).join('')}
 </select></div>`;
}

async function saveActive(){
 if(!current){toast('Önce bir terfi açın.');return;}
 if(!edit){requestAdmin();return;}
 const tabBefore=tab;
 let pumpLinks=[], driverFamilies=[], terfiPayload=null;
 if(tabBefore==='pompa'){
  const sp=getSelectedPump();
  if(sp){ pumpLinks=[{id:sp.id,motor_id:val(`p_${sp.id}_motor`)||null,surucu_id:val(`p_${sp.id}_surucu`)||null,pompa_no:sp.pompa_no||null,ad:val(`p_${sp.id}_ad`)}]; }
 }
 if(tabBefore==='surucu'){
  driverFamilies=current.d.map(d=>({id:d.id,surucu_ailesi:val(`d_${d.id}_family`)||null}));
 }
 if(tabBefore==='terfi'){
  terfiPayload={
   ad:val('s_ad'),terfi_no:val('s_no'),kod:val('s_kod'),bolge:val('s_bolge'),adres:val('s_adres'),aciklama:val('s_aciklama'),
   terfi_tipi:val('s_terfi_tipi')||val('s_terfi_tipi')||'Terfi',
   kuyu_derinligi:num(val('s_kuyu_derinligi'))
  };
 }
 await saveActiveBase();
 if(tabBefore==='terfi' && terfiPayload){
  const r=await db.from('terfiler').update(terfiPayload).eq('id',current.s.id);
  if(r.error){alert(r.error.message);return;}
 }
 if(tabBefore==='pompa' && pumpLinks.length){
  const rr=await Promise.all(pumpLinks.map(x=>db.from('pompalar').update({motor_id:x.motor_id,surucu_id:x.surucu_id,pompa_no:x.pompa_no,ad:x.ad||null}).eq('id',x.id)));
  const bad=rr.find(x=>x.error); if(bad){alert(bad.error.message);return;}
 }
 if(tabBefore==='surucu' && driverFamilies.length){
  const rr=await Promise.all(driverFamilies.map(x=>db.from('suruculer').update({surucu_ailesi:x.surucu_ailesi}).eq('id',x.id)));
  const bad=rr.find(x=>x.error); if(bad){alert(bad.error.message);return;}
 }
 await openStation(current.s.id);
 if(tabBefore==='pompa' && pumpLinks.length){ selectedPumpId=pumpLinks.find(x=>x.id===selectedPumpId)?.id||pumpLinks[0].id; tab='pompa'; render(); }
 if(tabBefore==='surucu'){ tab='surucu'; render(); }
 if(tabBefore==='terfi'){ tab='terfi'; render(); }
}
