// Harici Supabase JS SDK'sına bağımlı kalmamak için doğrudan Supabase REST API kullanılır.
function createSupabaseRestClient(base,key){
  const api=base.replace(/\/$/,'')+'/rest/v1/';
  class QB{
    constructor(table){this.table=table;this.method='GET';this.body=null;this.filters=[];this.orders=[];this.lim=null;this.wantSingle=false;this.wantReturn=false;this.columns='*'}
    select(cols='*'){this.columns=cols||'*';this.wantReturn=true;return this}
    eq(k,v){this.filters.push([k,'eq',v]);return this}
    order(k,opt={}){this.orders.push(k+'.'+(opt.ascending===false?'desc':'asc'));return this}
    limit(v){this.lim=Number(v)||null;return this}
    insert(body){this.method='POST';this.body=body;return this}
    update(body){this.method='PATCH';this.body=body;return this}
    delete(){this.method='DELETE';return this}
    single(){this.wantSingle=true;return this}
    async run(){
      try{
        const u=new URL(api+this.table);
        if(this.method==='GET'||this.wantReturn)u.searchParams.set('select',this.columns);
        this.filters.forEach(([k,op,v])=>u.searchParams.set(k,op+'.'+(v===null?'null':String(v))));
        if(this.orders.length)u.searchParams.set('order',this.orders.join(','));
        if(this.lim)u.searchParams.set('limit',String(this.lim));
        const headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'};
        if(this.method==='POST'||this.method==='PATCH')headers['Prefer']=this.wantReturn?'return=representation':'return=minimal';
        const res=await fetch(u.toString(),{method:this.method,headers,body:this.method==='GET'||this.method==='DELETE'?undefined:JSON.stringify(this.body)});
        const text=await res.text();let data=null;
        if(text){try{data=JSON.parse(text)}catch{data=text}}
        if(!res.ok){const msg=data?.message||data?.error_description||data?.hint||data?.details||('HTTP '+res.status);return {data:null,error:{message:String(msg),code:data?.code||String(res.status)}}}
        if(this.wantSingle){
          if(Array.isArray(data)){if(data.length!==1)return {data:null,error:{message:data.length?'Birden fazla kayıt döndü.':'Kayıt bulunamadı.'}};data=data[0]}
        }
        return {data,error:null};
      }catch(e){return {data:null,error:{message:e?.message||String(e)}}}
    }
    then(resolve,reject){return this.run().then(resolve,reject)}
  }
  return {from(table){return new QB(table)}}
}

async function renderHome(){if(!S.logged){showLogin();return}S.station=null;const r=await db.from('terfiler').select('id,ad,kod,terfi_no,bolge,adres,terfi_tipi,kuyu_derinligi,aciklama').order('bolge').order('ad');if(r.error){$('app').innerHTML=`<div class="layout">${side('')}<main class="main"><div class="card"><div class="title">Veri yüklenemedi</div><div class="sub">${esc(r.error.message)}</div><button class="btn" onclick="renderHome()">TEKRAR DENE</button></div></main></div>`;return}const rows=r.data||[];const groups={};rows.forEach(x=>{const b=(x.bolge||'BÖLGE BELİRLENMEDİ').trim()||'BÖLGE BELİRLENMEDİ';(groups[b]??=[]).push(x)});const filtered=homeFilter==='TÜMÜ'?rows:rows.filter(x=>(x.bolge||'BÖLGE BELİRLENMEDİ')===homeFilter);const regionNames=['TÜMÜ',...Object.keys(groups).filter(x=>x!=='BÖLGE BELİRLENMEDİ').sort((a,b)=>a.localeCompare(b,'tr'))];$('app').innerHTML=`<div class="layout">${side('home')}<main class="main"><div class="topbar"><div class="crumb"><b>MESKİ</b> › Terfi Arşivi</div><div class="actions"><span class="badge ${S.admin?'warn':''}">${S.admin?'Yönetici':'Ziyaretçi'}</span><button class="btn ${S.admin?'warn':''}" onclick="admin()">${S.admin?'🔒 Kilitle':'🔐 Yönetici'}</button>${S.admin?'<button class="btn ok" onclick="newStation()">+ YENİ TERFİ</button>':''}</div></div><div class="card"><div class="home-head"><div><div class="title">TERFİ TEKNİK ARŞİVİ</div><div class="sub">Tüm sahalar bölgeye göre gruplanır. Bir sahaya girdiğinde seçtiğin pompa bağımsız teknik sistem olarak yönetilir.</div></div></div><div class="summary" style="margin-top:10px"><div class="stat"><b>${rows.length}</b><span>Kayıtlı Terfi</span></div><div class="stat"><b>${rows.filter(x=>x.terfi_tipi?.toLowerCase().includes('pompa')).length}</b><span>Pompa İstasyonu</span></div><div class="stat"><b>${new Set(rows.map(x=>x.bolge).filter(Boolean)).size}</b><span>Bölge</span></div><div class="stat"><b>${rows.filter(x=>x.terfi_tipi?.toLowerCase().includes('kuyu')).length}</b><span>K function renderHomeGroups(rows){if(!rows.length)return '<div class="card"><div class="empty">Bu filtrede terfi bulunamadı.</div></div>';const groups={};rows.forEach(x=>{const b=x.bolge||'BÖLGE BELİRLENMEDİ';(groups[b]??=[]).push(x)});return Object.keys(groups).sort((a,b)=>a==='BÖLGE BELİRLENMEDİ'?1:b==='BÖLGE BELİRLENMEDİ'?-1:a.localeCompare(b,'tr')).map(b=>`<section><div class="group-title"><b>📍 ${esc(b)}</b><span class="badge">${groups[b].length} TERFİ</span></div><div class="site-grid">${groups[b].map(x=>`<article class="site" data-search="${esc((x.ad+' '+(x.terfi_no||'')+' '+(x.bolge||'')+' '+(x.adres||'')).toLowerCase())}" onclick="openStation('${x.id}')"><div class="site-head"><div><h3>${esc(x.ad)}</h3><div class="site-meta">${esc(x.terfi_no||x.kod||'RTU YOK')} · ${esc(x.adres||'Adres kayıtlı değil')}</div></div><span class="badge ok"><i class="dot"></i>AKTİF</span></div><div class="chips"><span class="chip">${esc(x.terfi_tipi||'TERFİ')}</span>${x.kuyu_derinligi!=null?`<span class="chip">${esc(x.kuyu_derinligi)} m kuyu</span>`:''}<span class="chip ok">Teknik arşiv</span></div></article>`).join('')}</div></section>`).join('')}
function searchHome(){const q=(val('homeSearch')||'').toLowerCase();document.querySelectorAll('.site').forEach(x=>x.style.display=!q||x.dataset.search.includes(q)?'block':'none');document.querySelectorAll('section').forEach(s=>{if(s.querySelector('.site'))s.style.display=[...s.querySelectorAll('.site')].some(x=>x.style.display!=='none')?'block':'none'})}

async function newStation(){if(!S.admin){admin();return}const name=prompt('Terfi adı:','Yeni Terfi');if(!name)return;const rtu=prompt('RTU / Terfi No:','RTU YOK')||'RTU YOK';const bolge=prompt('Bölge:','BÖLGE BELİRLENMEDİ')||'BÖLGE BELİRLENMEDİ';const tip=prompt('Tip: Kuyu / Terfi / Pompa İstasyonu','Terfi')||'Terfi';let depth=null;if(tip.toLowerCase().includes('kuyu'))depth=n(prompt('Kuyu derinliği [m]:',''));const count=Math.max(1,Math.min(50,parseInt(prompt('Pompa sayısı:','2')||'2',10)||2));const kod='T'+Date.now().toString().slice(-6);const r=await db.from('terfiler').insert({ad:name,kod,terfi_no:rtu,bolge,terfi_tipi:tip,kuyu_derinligi:depth,aciklama:''}).select().single();if(r.error){toast(r.error.message);return}const pr=await db.from('pompalar').insert(Array.from({length:count},(_,i)=>({terfi_id:r.data.id,ad:`P${i+1}`,pompa_no:i+1})));if(pr.error)toast('Terfi oluşturuldu, pompalar eklenemedi: '+pr.error.message);else toast('Terfi oluşturuldu');await openStation(r.data.id)}
async function openStation(id){const q=await Promise.all([db.from('terfiler').select('*').eq('id',id).single(),db.from('pompalar').select('id,terfi_id,ad,pompa_no,marka,model,tip,guc_kw,seri_no,q_min_m3h,q_max_m3h,h_min_m,h_max_m,motor_id,surucu_id').eq('terfi_id',id).order('pompa_no'),db.from('motorlar').select('id,terfi_id,ad,marka,model,seri_no,guc_kw,gerilim_v,nominal_akim_a,frekans_hz,devir_rpm,cos_phi,etiket_notu,motor_tipi').eq('terfi_id',id).order('ad'),db.from('suruculer').select('id,terfi_id,ad,marka,model,seri_no,guc_kw,besleme_v,montaj_tarihi,degisim_tarihi,aktif,notlar,marka_model,motor_id,surucu_ailesi').eq('terfi_id',id).order('ad')]);if(q[0].error){toast(q[0].error.message);return}S.station=q[0].data;S.pumps=q[1].data||[];S.motors=q[2].data||[];S.drivers=q[3].data||[];S.pumpId=S.pumps.find(x=>x.id===S.pumpId)?.id||S.pumps[0]?.id||null;S.tab='overview';S.detail=JSON.parse(localStorage.getItem('meski_detail_'+id+'_'+S.pumpId)||'{}');await loadExtras();render()}
async function loadExtras(){if(!S.station)return;const id=S.station.id,pid=S.pumpId,motorId=currentMotor()?.id;const hs=db.from('hmi_kayitlari').select('*').eq('terfi_id',id).eq('pompa_id',pid).order('ekran_no');const ws=motorId?db.from('motor_calisma_kayitlari').select('*').eq('terfi_id',id).eq('motor_id',motorId).order('captured_at',{ascending:false}).limit(100):Promise.resolve({data:[],error:null});const ps=db.from('terfi_parametreleri').select('*').eq('terfi_id',id).eq('pompa_id',pid).order('created_at',{ascending:false});const [h,w,p]=await Promise.all([hs,ws,ps]);S.hmi=h.error?[]:(h.data||[]);S.work=w.error?[]:(w.data||[]);S.params=p.error?[]:(p.data||[]);S.detail=JSON.parse(localStorage.getItem('meski_detail_'+id+'_'+pid)||'{}')}
function currentPump(){return S.pumps.find(x=>x.id===S.pumpId)||S.pumps[0]||null}function currentMotor(){const p=currentPump();return p?.motor_id?S.motors.find(x=>x.id===p.motor_id):null}function currentDriver(){const p=currentPump();return p?.surucu_id?S.drivers.find(x=>x.id===p.surucu_id):null}
function navTab(t){S.tab=t;render()}
function selectPump(id){if(S.pumps.some(x=>x.id===id)){S.pumpId=id;S.tab='overview';render()}}
function saveDetail(){if(!S.admin){admin();return}const d={...S.detail,pompa_tipi:val('d_pompa_tipi'),calisma_sekli:val('d_calisma'),emis:val('d_emis'),basma:val('d_basma'),aciklama:val('d_aciklama')};S.detail=d;localStorage.setItem('meski_detail_'+S.station.id+'_'+S.pumpId,JSON.stringify(d));toast('P'+(currentPump()?.pompa_no||1)+' terfi bilgileri kaydedildi')}
async function saveStation(){if(!S.admin){admin();return}const obj={ad:val('s_ad'),terfi_no:val('s_rtu'),kod:val('s_kod'),bolge:val('s_bolge'),terfi_tipi:val('s_tip'),kuyu_derinligi:n(val('s_depth')),adres:val('s_adres'),aciklama:val('s_desc')};const r=await db.from('terfiler').update(obj).eq('id',S.station.id);if(r.error)toast(r.error.message);else{Object.assign(S.station,obj);toast('Terfi bilgileri kaydedildi');render()}}
async function savePump(){if(!S.admin)return admin();const p=currentPump();if(!p)return;const obj={ad:val('p_ad'),pompa_no:n(val('p_no')),marka:val('p_marka'),model:val('p_model'),tip:val('p_tip'),guc_kw:n(val('p_kw')),seri_no:val('p_seri'),q_min_m3h:n(val('p_qmin')),q_max_m3h:n(val('p_qmax')),h_min_m:n(val('p_hmin')),h_max_m:n(val('p_hmax'))};const r=await db.from('pompalar').update(obj).eq('id',p.id);if(r.error)toast(r.error.message);else{Object.assign(p,obj);toast('Pompa kaydı kaydedildi');render()}}
async function addPump(){if(!S.admin)return admin();const next=(Math.max(0,...S.pumps.map(x=>Number(x.pompa_no)||0))+1);const r=await db.from('pompalar').insert({terfi_id:S.station.id,ad:`P${next}`,pompa_no:next}).select().single();if(r.error)toast(r.error.message);else{S.pumps.push(r.data);S.pumpId=r.data.id;toast('Pompa eklendi');render()}}
async function saveMotor(){if(!S.admin)return admin();const p=currentPump();if(!p)return;const obj={ad:val('m_ad'),marka:val('m_marka'),model:val('m_model'),seri_no:val('m_seri'),guc_kw:n(val('m_kw')),gerilim_v:n(val('m_v')),nominal_akim_a:n(val('m_a')),frekans_hz:n(val('m_hz')),devir_rpm:n(val('m_rpm')),cos_phi:n(val('m_cos')),motor_tipi:val('m_tip'),etiket_notu:val('m_note')};let m=currentMotor();let r;if(m)r=await db.from('motorlar').update(obj).eq('id',m.id);else r=await db.from('motorlar').insert({...obj,terfi_id:S.station.id,ad:obj.ad||`P${p.pompa_no||1} MOTOR`}).select().single();if(r.error){toast(r.error.message);return}if(!m){m=r.data;S.motors.push(m);p.motor_id=m.id;await db.from('pompalar').update({motor_id:m.id}).eq('id',p.id)}else Object.assign(m,obj);toast('Motor kaydedildi');render()}
async function saveDriver(){if(!S.admin)return admin();const p=currentPump();if(!p)return;const obj={ad:val('dri_ad'),marka:val('dri_marka'),model:val('dri_model'),seri_no:val('dri_seri'),guc_kw:n(val('dri_kw')),besleme_v:n(val('dri_v')),aktif:true,notlar:val('dri_note'),marka_model:`${val('dri_marka')} ${val('dri_model')}`.trim(),motor_id:p.motor_id||null,surucu_ailesi:val('dri_family')};let d=currentDriver();let r;if(d)r=await db.from('suruculer').update(obj).eq('id',d.id);else r=await db.from('suruculer').insert({...obj,terfi_id:S.station.id,ad:obj.ad||`P${p.pompa_no||1} SÜRÜCÜ`}).select().single();if(r.error){toast(r.error.message);return}if(!d){d=r.data;S.drivers.push(d);p.surucu_id=d.id;await db.from('pompalar').update({surucu_id:d.id}).eq('id',p.id)}else Object.assign(d,obj);toast('Sürücü kaydedildi');render()}
async function saveHmi(){if(!S.admin)return admin();const page=HMI[S.hmiPage-1],values=page.labels.map((_,i)=>val(`hmi_${S.hmiPage}_${i}`));const old=S.hmi.find(x=>x.ekran_no===S.hmiPage);let r;if(old)r=await db.from('hmi_kayitlari').update({degerler:values,pompa_id:S.pumpId}).eq('id',old.id);else r=await db.from('hmi_kayitlari').insert({terfi_id:S.station.id,pompa_id:S.pumpId,ekran_no:S.hmiPage,degerler:values}).select().single();if(r.error){toast(r.error.message);return}if(old)old.degerler=values;else S.hmi.push(r.data);toast('HMI ekranı kaydedildi');render()}
async function saveWork(){if(!S.admin)return admin();const m=currentMotor();if(!m){toast('Önce seçili pompaya motor bağla');return}const obj={terfi_id:S.station.id,motor_id:m.id,frekans_hz:n(val('w_hz')),akim_a:n(val('w_a')),devir_rpm:n(val('w_rpm')),guc_kw:n(val('w_kw')),gerilim_v:n(val('w_v')),surucu_sicaklik_c:n(val('w_temp')),set_basinci_bar:n(val('w_set')),calisma_basinci_bar:n(val('w_run')),tasarruf_kwh:n(val('w_save')),durum:val('w_status')};const r=await db.from('motor_calisma_kayitlari').insert(obj).select().single();if(r.error)toast(r.error.message);else{S.work.unshift(r.data);toast('Çalışma kaydı eklendi');render()}}
async function saveParam(){if(!S.admin)return admin();const obj={terfi_id:S.station.id,pompa_id:S.pumpId,surucu_id:currentDriver()?.id||null,ekran_adi:val('tp_ekran'),parametre_adi:val('tp_code'),deger:val('tp_value'),birim:val('tp_unit'),aciklama:val('tp_desc'),kaynak:val('tp_source')||'Saha kaydı'};const r=await db.from('terfi_parametreleri').insert(obj).select().single();if(r.error)toast(r.error.message);else{S.params.unshift(r.data);toast('Terfi parametresi eklendi');render()}}
async function deleteParam(id){if(!S.admin)return admin();if(!confirm('Bu kayıt silinsin mi?'))return;const r=await db.from('terfi_parametreleri').delete().eq('id',id);if(r.error)toast(r.error.message);else{S.params=S.params.filter(x=>x.id!==id);render()}}
function library(family){S.tab=family;S.station=null;renderLibrary(family)}
function renderLibrary(family){$('app').innerHTML=`<div class="layout">${side()}<main class="main"><div class="topbar"><div class="crumb"><b>MESKİ</b> › ${family==='fault'?'Arıza Kütüphanesi':family+' Parametreleri'}</div><div class="actions"><button class="btn" onclick="renderHome()">← Ana Sayfa</button></div></div><div class="card"><div class="title">${family==='fault'?'ARIZA KÜTÜPHANESİ':family+' PARAMETRE KÜTÜPHANESİ'}</div><div class="sub">Genel referans bilgisi. Terfiye özel kayıtlar yalnızca ilgili terfinin içinde tutulur.</div><input class="search" id="libSearch" placeholder="Kod, ad veya açıklama ara..." oninput="filterLib()" style="margin-top:9px"></div><div id="libGrid" class="site-grid">${family==='fault'?FAULTS.map(f=>`<div class="card lib" data-q="${esc((f.code+' '+f.name+' '+f.cause+' '+f.solution).toLowerCase())}"><div class="badge red">${esc(f.code)}</div><h3>${esc(f.name)}</h3><div class="sub">${esc(f.cause)}</div><div class="notice" style="margin-top:7px">${esc(f.solution)}</div></div>`).join(''):PARAMS.filter(p=>p.family===family).map(p=>`<div class="card lib" data-q="${esc((p.code+' '+p.name+' '+p.desc).toLowerCase())}"><div class="badge">${esc(p.code)}</div><h3>${esc(p.name)}</h3><div class="sub">${esc(p.desc)}</div><div class="chip" style="display:inline-block;margin-top:7px">${esc(p.unit)} · ${esc(p.family)}</div></div>`).join('')}</div></main></div>`}
function filterLib(){const q=val('libSearch').toLowerCase();document.querySelectorAll('.lib').forEach(x=>x.style.display=!q||x.dataset.q.includes(q)?'block':'none')}
function openModal(title,body){$('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function render(){if(!S||!S.station){showLogin();return}const p=currentPump();const m=currentMotor();const d=currentDriver();const page=`${side()}<main class="main"><div class="topbar"><div class="crumb"><span onclick="renderHome()" style="cursor:pointer">Ana Sayfa</span> › ${esc(S.station.bolge||'Bölge')} › <b>${esc(S.station.ad)}</b>${p?' › P'+(p.pompa_no||1):''}</div><div class="actions"><button class="btn" onclick="renderHome()">← Geri</button><button class="btn primary" onclick="printReport()">▣ PDF / Yazdır</button>${S.admin?'<button class="btn ok" onclick="stationEdit()">✎ DÜZENLE</button>':''}<button class="btn ${S.admin?'warn':''}" onclick="admin()">${S.admin?'🔒 Yönetici Açık':'🔐 Yönetici'}</button></div></div>${stationHeader()}${pumpBar()}${system()}${tabContent()}</main>`;$('app').innerHTML=`<div class="layout">${page}</div>`}
function stationHeader(){const s=S&&S.station;if(!s)return '';return `<div class="station-head"><div class="station-main"><div class="station-photo">💧</div><div><div class="station-name">${esc(s.ad)} <span class="live"><i class="dot"></i> AKTİF</span></div><div class="station-meta">${esc(s.terfi_no||s.kod||'RTU YOK')} · ${esc(s.bolge||'Bölge belirtilmedi')} · ${esc(s.adres||'Adres kayıtlı değil')}</div></div></div><div class="info-grid"><div><b>TERFİ TİPİ</b><span>${esc(s.terfi_tipi||'Terfi')}</span></div><div><b>KUYU DERİNLİĞİ</b><span>${s.kuyu_derinligi!=null?esc(s.kuyu_derinligi)+' m':'—'}</span></div><div><b>POMPA SAYISI</b><span>${S.pumps.length}</span></div><div><b>GPS</b><span>Yerel konum kaydı</span></div></div></div>`}
function pumpBar(){return `<div class="pumpbar"><div class="pumpbar-head"><b>POMPA BLOKLARI</b><span>Her P tamamen ayrı bir teknik sistemdir · Toplam ${S.pumps.length}</span></div><div class="pumps">${S.pumps.map((x,i)=>`<button class="pump c${i%6+1} ${x.id===S.pumpId?'active':''}" onclick="selectPump('${x.id}')"><span class="ico">⚙</span><b>P${x.pompa_no||i+1}</b><small>${esc(x.ad||'Pompa')}</small><div class="oktxt">● Aktif</div></button>`).join('')}${S.admin?'<button class="pump" onclick="addPump()"><span class="ico">＋</span><b>Ekle</b><small>Yeni pompa</small></button>':''}</div></div>`}
function system(){const p=currentPump(),m=currentMotor(),d=currentDriver();const no=p?.pompa_no||1;const tabs=[['overview','Genel Bakış'],['pump','Pompa'],['motor','Motor'],['driver','Sürücü'],['box','Pano / Kablo'],['ssr','SSR / Seviye'],['hmi','HMI / PLC'],['params','Parametreler'],['work','Çalışma'],['fault','Arızalar'],['photos','Fotoğraflar']];return `<div class="system"><div class="system-head"><div class="system-title"><div class="ico">⚙</div><div><h2>P${no} · Pompa Sistemi</h2><div class="system-sub">Pompa + Motor + Sürücü + Pano</div></div></div><span class="badge ok"><i class="dot"></i> ÇALIŞIYOR</span></div><div class="section-tabs">${tabs.map(x=>`<button class="${S.tab===x[0]?'active':''}" onclick="navTab('${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}

function saveSSR(){if(!S.admin)return admin();Object.assign(S.detail,{level:val('ssr_high'),low:val('ssr_low'),sensor:val('ssr_sensor'),sensorBrand:val('ssr_brand'),pmin:val('ssr_min'),pmax:val('ssr_max'),ssrNote:val('ssr_note')});localStorage.setItem('meski_detail_'+S.station.id+'_'+S.pumpId,JSON.stringify(S.detail));toast('SSR / seviye kaydedildi');render()}
function hmiTab(){const page=HMI[S.hmiPage-1];const rec=S.hmi.find(x=>x.ekran_no===S.hmiPage);const v=rec?.degerler||{};const cols=[page.labels.slice(0,Math.ceil(page.labels.length/3)),page.labels.slice(Math.ceil(page.labels.length/3),Math.ceil(page.labels.length*2/3)),page.labels.slice(Math.ceil(page.labels.length*2/3))];let idx=0;return `<div class="section"><div class="toolbar"><div><h2>HMI / PLC</h2><div class="sub">Weintek saha ekranı · 5 kayıt sayfası. Dekoratif sahte buton yok; yalnızca gerçek veri giriş alanları.</div></div><button class="btn ok" onclick="saveHmi()">KAYDET</button></div><div class="hmi"><div class="hmi-head">${esc(page.title)}</div><div class="hmi-tabs">${HMI.map((x,i)=>`<button class="${S.hmiPage===i+1?'active':''}" onclick="S.hmiPage=${i+1};render()">${i+1}. ${esc(x.title)}</button>`).join('')}</div><div class="hmi-grid">${cols.map((col,ci)=>`<div class="hmi-col"><h4>${['SOL','ORTA','SAĞ'][ci]||''}</h4>${col.map(label=>{const i=idx++;return `<div class="hmi-field"><span>${esc(label)}</span><input id="hmi_${S.hmiPage}_${i}" value="${esc(v[i]??'')}"></div>`}).join('')}</div>`).join('')}</div><div class="hmi-screen-note">HMI ekranındaki alan adları teknik arşiv için tutulur. Görsel butonlar işlevsiz dekorasyon olarak eklenmez.</div></div></div>`}
function paramsTab(){const d=currentDriver();const family=(d?.surucu_ailesi||'').includes('ACS')?'ACS580':'ACQ580';const list=PARAMS.filter(x=>x.family===family);return `<div class="section"><div class="toolbar"><div><h2>TERFİYE ÖZEL PARAMETRELER</h2><div class="sub">Seçili sürücü: ${esc(d?.ad||'Sürücü yok')} · Kütüphane: ${family}</div></div></div>${S.params.length?S.params.map(x=>`<div class="data-card" style="margin-bottom:7px"><div class="data-row"><span>${esc(x.ekran_adi||'')}</span><span>${esc(x.parametre_adi||'')} · ${esc(x.deger||'—')} ${esc(x.birim||'')}</span></div><div class="sub">${esc(x.aciklama||'')} · ${esc(x.kaynak||'')}</div>${S.admin?`<button class="btn bad small" onclick="deleteParam('${x.id}')">Sil</button>`:''}</div>`).join(''):'<div class="empty">Bu terfi için özel parametre kaydı yok.</div>'}<div class="card" style="margin:10px 0 0"><div class="title">Yeni Terfi Parametresi</div><div class="grid3" style="margin-top:8px">${field('Ekran / Grup','tp_ekran')}${field('Parametre Kodu / Adı','tp_code')}${field('Değer','tp_value')}${field('Birim','tp_unit')}${field('Kaynak','tp_source','Saha kaydı')}</div>${area('Açıklama','tp_desc')}<button class="btn ok" onclick="saveParam()">PARAMETREYİ KAYDET</button></div><div class="card"><div class="title">${family} REFERANS KÜTÜPHANESİ</div><input class="search" id="paramSearch" placeholder="Parametre ara..." oninput="filterParamsLocal()" style="margin-top:8px"><div id="paramList" class="site-grid" style="margin-top:8px">${list.map(x=>`<div class="data-card param" data-q="${esc((x.code+' '+x.name+' '+x.desc).toLowerCase())}"><b>${esc(x.code)}</b><div>${esc(x.name)}</div><div class="sub">${esc(x.desc)} · ${esc(x.unit)}</div></div>`).join('')}</div></div></div>`}
function filterParamsLocal(){const q=val('paramSearch').toLowerCase();document.querySelectorAll('.param').forEach(x=>x.style.display=!q||x.dataset.q.includes(q)?'block':'none')}
function workTab(){const m=currentMotor();return `<div class="section"><div class="toolbar"><div><h2>ÇALIŞMA KAYITLARI</h2><div class="sub">Yalnızca P${currentPump()?.pompa_no||1} motoru.</div></div><button class="btn ok" onclick="saveWork()">KAYDET</button></div>${!m?'<div class="empty">Önce motor kaydı oluştur.</div>':''}<div class="grid3">${field('Frekans [Hz]','w_hz')}${field('Akım [A]','w_a')}${field('Devir [RPM]','w_rpm')}${field('Güç [kW]','w_kw')}${field('Gerilim [V]','w_v')}${field('Sürücü Sıcaklık [°C]','w_temp')}${field('Set Basıncı [bar]','w_set')}${field('Çalışma Basıncı [bar]','w_run')}${field('Tasarruf [kWh]','w_save')}${select('Durum','w_status','ÇALIŞIYOR',['ÇALIŞIYOR','DURUYOR','ARIZA'])}</div><h3 style="margin-top:15px">Son Kayıtlar</h3><div class="table"><table class="table"><thead><tr><th>Tarih</th><th>Hz</th><th>A</th><th>kW</th><th>Basınç</th><th>Durum</th></tr></thead><tbody>${S.work.slice(0,20).map(x=>`<tr><td>${esc(new Date(x.captured_at||x.created_at||Date.now()).toLocaleString('tr-TR'))}</td><td>${fmt(x.frekans_hz)}</td><td>${fmt(x.akim_a)}</td><td>${fmt(x.guc_kw)}</td><td>${fmt(x.calisma_basinci_bar)}</td><td>${esc(x.durum||'')}</td></tr>`).join('')}</tbody></table></div></div>`}
function faultTab(){const d=currentDriver();const fam=(d?.surucu_ailesi||'').includes('ACS')?'ACS580':'ACQ580';const list=FAULTS.filter(x=>x.family===fam);return `<div class="section"><div class="toolbar"><div><h2>ARIZA KAYITLARI</h2><div class="sub">Sürücü: ${esc(d?.ad||'Yok')} · Referans: ${fam}</div></div></div><div class="notice">Arıza kütüphanesi teşhis referansıdır. Saha tespitini ayrıca gerçek arıza kaydı olarak not edebilirsin.</div>${list.map(f=>`<div class="data-card" style="margin-top:8px"><div class="toolbar"><div><span class="badge red">${esc(f.code)}</span> <b>${esc(f.name)}</b></div><button class="btn small" onclick="openFault('${esc(f.code)}')">DETAY</button></div><div class="sub">${esc(f.cause)}</div></div>`).join('')}<div class="card"><div class="title">Gerçek Saha Arızası</div>${area('Tespit / Yapılan İşlem / Sonuç','realFault')}<button class="btn ok" onclick="saveRealFault()">ARIZA KAYDINI EKLE</button></div></div>`}
function openFault(code){const f=FAULTS.find(x=>x.code===code);if(!f)return;openModal(f.code+' · '+f.name,`<div class="notice"><b>Neden:</b><br>${esc(f.cause)}</div><div class="notice" style="margin-top:8px"><b>Önerilen kontrol:</b><br>${esc(f.solution)}</div>`)}
function saveRealFault(){if(!S.admin)return admin();const txt=val('realFault');if(!txt.trim())return toast('Arıza açıklaması boş');let a=JSON.parse(localStorage.getItem('meski_fault_history_'+S.station.id)||'[]');a.unshift({date:new Date().toISOString(),pump:S.pumpId,detail:txt});localStorage.setItem('meski_fault_history_'+S.station.id,JSON.stringify(a));toast('Saha arızası kaydedildi');render()}
function photoTab(){const key='meski_photos_'+S.station.id+'_'+S.pumpId;const arr=JSON.parse(localStorage.getItem(key)||'[]');return `<div class="section"><div class="toolbar"><div><h2>TEKNİK FOTOĞRAFLAR</h2><div class="sub">Fotoğraflar seçili P bloğuna göre yerel cihazda tutulur.</div></div><input id="photoInput" type="file" accept="image/*" multiple onchange="addPhotos(event)"></div><div class="photo-grid">${arr.map((x,i)=>`<div class="photo"><img src="${x.data}"><div>${esc(x.name)}<br>${esc(x.date)}<br>${S.admin?`<button class="btn bad small" onclick="deletePhoto(${i})">Sil</button>`:''}</div></div>`).join('')||'<div class="empty">Henüz fotoğraf yok.</div>'}</div></div>`}
function addPhotos(e){if(!S.admin){admin();return}const files=[...(e.target.files||[])];const key='meski_photos_'+S.station.id+'_'+S.pumpId;let arr=JSON.parse(localStorage.getItem(key)||'[]');let left=files.length;if(!left)return;files.forEach(f=>{const r=new FileReader();r.onload=()=>{arr.push({name:f.name,data:r.result,date:new Date().toLocaleString('tr-TR')});if(--left===0){localStorage.setItem(key,JSON.stringify(arr));render()}};r.readAsDataURL(f)})}
function deletePhoto(i){const key='meski_photos_'+S.station.id+'_'+S.pumpId;let a=JSON.parse(localStorage.getItem(key)||'[]');a.splice(i,1);localStorage.setItem(key,JSON.stringify(a));render()}
function saveTerfiHeader(){if(!S.admin)return admin();return saveStation()}
function printReport(){if(!S.station)return;const p=currentPump(),m=currentMotor(),d=currentDriver();$('printArea').innerHTML=`<div class="print-page"><div class="print-head"><div><h1>MESKİ TERFİ TEKNİK ARŞİV</h1><b>${esc(S.station.ad)}</b><div>${esc(S.station.terfi_no||S.station.kod||'')} · ${esc(S.station.bolge||'')}</div></div><div>${new Date().toLocaleString('tr-TR')}</div></div><div class="print-grid"><div class="print-box"><b>TERFİ</b><span>${esc(S.station.ad)}</span></div><div class="print-box"><b>RTU</b><span>${esc(S.station.terfi_no||'')}</span></div><div class="print-box"><b>POMPA</b><span>P${p?.pompa_no||1}</span></div><div class="print-box"><b>MOTOR</b><span>${esc(m?.marka||'')} ${esc(m?.model||'')} · ${fmt(m?.guc_kw)} kW</span></div><div class="print-box"><b>SÜRÜCÜ</b><span>${esc(d?.marka||'')} ${esc(d?.model||'')} · ${esc(d?.surucu_ailesi||'')}</span></div><div class="print-box"><b>POMPA</b><span>${esc(p?.marka||'')} ${esc(p?.model||'')} · ${fmt(p?.guc_kw)} kW</span></div></div><h2>HMI</h2>${HMI.map((pg,i)=>{const r=S.hmi.find(x=>x.ekran_no===i+1);const v=r?.degerler||{};return `<div class="print-box"><b>${i+1}. ${esc(pg.title)}</b><span>${pg.labels.map((x,j)=>esc(x)+': '+esc(v[j]??'')).join(' · ')}</span></div>`}).join('')}</div>`;window.print()}
function saveHmiHeader(){}
function saveEverything(){saveStation()}
// Keep the terfi information editor available from the station header.
function stationEdit(){if(!S.admin)return admin();const s=S.station;openModal('TERFİ BİLGİLERİ',`<div class="grid3">${field('Terfi Adı','s_ad',s.ad||'')}${field('RTU / Terfi No','s_rtu',s.terfi_no||'')}${field('Kod','s_kod',s.kod||'')}${field('Bölge','s_bolge',s.bolge||'')}${field('Terfi Tipi','s_tip',s.terfi_tipi||'Terfi')}${field('Kuyu Derinliği [m]','s_depth',s.kuyu_derinligi??'','number')}${field('Adres','s_adres',s.adres||'')}</div>${area('Açıklama','s_desc',s.aciklama||'')}<div class="row-actions"><button class="btn ok" onclick="saveStation();closeModal()">KAYDET</button></div>`) }
// Replace station header action area with an editor button without changing data model.
const _oldStationHeader=stationHeader;stationHeader=function(){const x=_oldStationHeader();return x.replace('</div></div>`','</div></div>`')}
(function boot(){try{showLogin()}catch(e){const a=document.getElementById('app');if(a)a.innerHTML='<div class=\"login\"><div class=\"login-card\"><div class=\"login-logo\">⚠️</div><div class=\"login-title\">BAŞLANGIÇ HATASI</div><div class=\"login-sub\">'+String(e&&e.message||e).replace(/[<>]/g,'')+'</div><button class=\"btn primary\" style=\"width:100%;margin-top:12px\" onclick=\"location.reload()\">TEKRAR DENE</button></div></div>'}})();
</script>
</body></html>
