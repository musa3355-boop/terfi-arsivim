{font-size:18px}.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:#081b30;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:23px}.tabs{display:flex;gap:5px;overflow:auto}.tab{white-space:nowrap}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid var(--line);padding:8px;text-align:left;font-size:12px}.modal-bg{position:fixed;inset:0;background:#000b;z-index:100;display:grid;place-items:center;padding:12px}.modal{width:min(850px,100%);max-height:92vh;overflow:auto;background:#0d2945;border:1px solid #397091;border-radius:16px;padding:16px}.close{float:right;background:#172f45;color:#fff;border:1px solid #45647a;border-radius:9px;width:40px;height:40px;font-size:20px}.hmi{background:#102a34;border:1px solid #426575;border-radius:14px;padding:12px}.hmi-tabs{display:flex;gap:5px;overflow:auto}.hmi-tab{white-space:nowrap;padding:10px;border:1px solid #466d7d;background:#163745;color:#fff;border-radius:8px}.hmi-tab.active{background:var(--blue)}.cable{background:#071827;border:1px solid #2c536b;border-radius:12px;padding:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#051423ee;padding:8px;z-index:30}.bottom button{width:100%}@media(max-width:800px){.grid4,.stats{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.title{font-size:20px}}@media(max-width:500px){.grid4,.stats{grid-template-columns:1fr 1fr}.wrap{padding:8px 8px 95px}}

let db=loadDB(), current=null, page="home", edit=false, admin=localStorage.getItem(ADMIN_KEY)==="1", hmiPage=0;

function loadDB(){
 try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}
 return {stations:STATIONS.map((s,i)=>({
 id:i+1,name:s[0],kod:"",rtu:s[1],pumps:s[2].map((p,j)=>pump(p,j)),detail:{},location:null
 })),faults:FAULTS.map(x=>({code:x[0],name:x[1],desc:""})),params:PARAMS.map(x=>({code:x[0],name:x[1],drive:x[2],desc:""})),history:[],settings:{adminPassword:ADMIN_DEFAULT}};
}
function pump(name,i){return{name,number:i+1,type:"",mounting:"",wellDepth:"",motor:{},drive:{},boxIn:{},boxOut:{},hmi:Array.from({length:5},()=>({})),measurements:[],faults:[],maintenance:[],work:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function val(v){return esc(v)}
function field(label,key,value="",type="text"){return`<div class="field"><label>${label}</label><input type="${type}" inputmode="${type==="number"?"decimal":"text"}" data-key="${key}" value="${val(value)}"></div>`}
function getObj(obj,key){return obj?.[key]??""}
function setObj(obj,key,v){obj[key]=v}

function header(){
 return `<div class="top"><div class="top" style="justify-content:flex-start"><div class="logo">M</div><div><div class="title">MESKİ Terfi Arşivim</div><div class="muted">Terfi • Pompa • Motor • Sürücü • HMI • Arıza • Bakım</div></div></div><div class="actions">${admin?'<span class="badge ok">YÖNETİCİ</span>':'<span class="badge">GÖRÜNTÜLEME</span>'}<button class="btn" onclick="adminLogin()">${admin?"🔓 Yönetici":"🔐 Yönetici"}</button></div></div>
 <div class="nav">${["home","terfiler","analiz","kutuphane","ayarlar"].map(x=>`<button class="btn ${page===x?"primary":""}" onclick="go('${x}')">${{home:"🏠 Ana Sayfa",terfiler:"🏭 Terfiler",analiz:"📊 Analiz",kutuphane:"📚 Kütüphane",ayarlar:"⚙️ Ayarlar"}[x]}</button>`).join("")}</div>`;
}
function go(p){page=p;current=null;edit=false;render()}
function render(){document.getElementById("app").innerHTML=`<div class="wrap">${header()}<main>${page==="home"?home():page==="terfiler"?stations():page==="analiz"?analysis():page==="kutuphane"?library():settings()}</main></div>`}
function home(){
 let ps=db.stations.reduce((a,s)=>a+s.pumps.length,0);
 return `<div class="stats"><div class="stat">🏭<b>${db.stations.length}</b><span class="muted">Terfi</span></div><div class="stat">💧<b>${ps}</b><span class="muted">Pompa</span></div><div class="stat">⚡<b>${db.stations.filter(s=>s.pumps.some(p=>p.drive?.model)).length}</b><span class="muted">Sürücü</span></div><div class="stat">🛠️<b>${db.history.length}</b><span class="muted">Kayıt</span></div><div class="stat">📍<b>${db.stations.filter(s=>s.location).length}</b><span class="muted">Konum</span></div></div>
 <div class="card"><div class="section"><h2>Terfi Arama</h2><input id="search" class="field input" style="width:100%;min-height:45px;background:#061a2d;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px" placeholder="Terfi, RTU veya pompa ara..." oninput="filterStations(this.value)"></div></div>
 <div id="homeList">${stationCards(db.stations.slice(0,15))}</div><div class="actions"><button class="btn primary" onclick="go('terfiler')">Tüm Terfileri Gör</button></div>`;
}
function filterStations(q){let x=db.stations.filter(s=>(s.name+" "+s.rtu+" "+s.pumps.map(p=>p.name).join(" ")).toLowerCase().includes(q.toLowerCase()));document.getElementById("homeList").innerHTML=stationCards(x)}
function stationCards(arr){return arr.map(s=>`<div class="station" onclick="openStation(${s.id})"><h3>${esc(s.name)}</h3><div class="muted">${esc(s.rtu)} • ${s.pumps.length} pompa</div><div class="badges">${s.pumps.map(p=>`<span class="badge">${esc(p.name)}${p.mounting?" • "+esc(p.mounting):""}</span>`).join("")}${s.location?'<span class="badge ok">📍 Konum kayıtlı</span>':""}</div></div>`).join("")||`<div class="empty">Kayıt bulunamadı.</div>`}
function stations(){return`<div class="card"><h2>Tüm Terfiler</h2><div id="stationList">${stationCards(db.stations)}</div></div>`}
function openStation(id){current=db.stations.find(s=>s.id===id);page="detail";renderDetail()}
function renderDetail(){
 let s=current;
 document.getElementById("app").innerHTML=`<div class="wrap">${header()}<div class="card"><div class="top"><div><h2>${esc(s.name)}</h2><div class="muted">${esc(s.rtu)} • ${s.pumps.length} pompa</div></div><div class="actions"><button class="btn" onclick="go('terfiler')">← Geri</button>${admin?`<button class="btn primary" onclick="edit=!edit;renderDetail()">✏️ ${edit?"Görüntüle":"Düzenle"}</button>`:""}</div></div>
 ${edit?stationEdit(s):stationView(s)}</div>${edit?`<div class="bottom"><button class="btn ok" onclick="saveStation()">💾 KAYDET</button></div>`:""}</div>`;
}
function stationView(s){
 return `<div class="section"><h3>Terfi Bilgileri</h3><div class="grid4">${detail("Kod",s.kod||"—")}${detail("RTU",s.rtu)}${detail("Pompa Sayısı",s.pumps.length)}${detail("Konum",s.location?"Kayıtlı":"Yok")}</div></div>
 <div class="section"><h3>Konum</h3>${s.location?`<div class="card"><b>📍 ${s.location.lat}, ${s.location.lng}</b><div class="muted">Doğruluk: ${s.location.acc||"—"} m</div><button class="btn primary" onclick="maps()">🗺️ Konuma Git</button></div>`:`<button class="btn primary" onclick="captureLocation()">📍 KONUMU AL VE KAYDET</button>`}</div>
 <div class="section"><h3>Pompalar</h3>${s.pumps.map((p,i)=>`<div class="item"><div class="top"><b>${esc(p.name)}</b><span class="badge">${esc(p.mounting||"Montaj tipi girilmedi")}</span></div><div class="muted">Tip: ${esc(p.type||"—")} • Kuyu: ${esc(p.wellDepth||"—")} m • Sürücü: ${esc(p.drive?.model||"—")}</div><div class="actions"><button class="btn primary" onclick="openPump(${i})">Pompa Arşivini Aç</button></div></div>`).join("")}</div>`;
}
function detail(a,b){return`<div class="stat"><span class="muted">${a}</span><b style="font-size:15px">${esc(b)}</b></div>`}
function stationEdit(s){return`<div class="grid">${field("Terfi Kodu","kod",s.kod)}${field("RTU","rtu",s.rtu)}</div><div class="grid">${field("Pompa tipi / sistem","pompa_tipi",s.detail.pompa_tipi)}${field("Çalışma şekli","calisma_sekli",s.detail.calisma_sekli)}</div><div class="grid">${field("Emiş kaynağı","emiş_kaynagi",s.detail.emiş_kaynagi)}${field("Basma noktası","basma_noktasi",s.detail.basma_noktasi)}</div><div class="field"><label>Sistem açıklaması</label><textarea data-key="sistem_aciklama">${val(s.detail.sistem_aciklama)}</textarea></div>`}
function saveStation(){
 let els=document.querySelectorAll("[data-key]");els.forEach(e=>{let k=e.dataset.key;if(k==="sistem_aciklama")current.detail[k]=e.value;else current[k]=e.value});save();edit=false;renderDetail()
}
function openPump(i){current.pumpIndex=i;page="pump";renderPump()}
function renderPump(){
 let s=current,p=s.pumps[s.pumpIndex];
 document.getElementById("app").innerHTML=`<div class="wrap">${header()}<div class="card"><div class="top"><div><h2>${esc(s.name)} / ${esc(p.name)}</h2><div class="muted">Pompa özel arşivi</div></div><button class="btn" onclick="renderDetail()">← Terfi</button></div>
 <div class="tabs">${["Genel","Motor","Box","Sürücü","HMI","Ölçüm","Arıza","Bakım"].map((x,i)=>`<button class="btn ${pumpTab===i?"primary":""}" onclick="pumpTab=${i};renderPump()">${x}</button>`).join("")}</div>${pumpContent(p)}${edit?`<div class="bottom"><button class="btn ok" onclick="savePump()">💾 KAYDET</button></div>`:""}</div></div>`;
}
let pumpTab=0;
function pumpContent(p){
 if(pumpTab===0)return edit?`<div class="grid4">${field("Pompa adı","name",p.name)}${field("Pompa tipi","type",p.type)}${field("Montaj","mounting",p.mounting)}${field("Kuyu derinliği (m)","wellDepth",p.wellDepth,"number")}</div>`:`<div class="grid4">${detail("Pompa",p.name)}${detail("Tip",p.type||"—")}${detail("Montaj",p.mounting||"—")}${detail("Kuyu",p.wellDepth?p.wellDepth+" m":"—")}</div>`;
 if(pumpTab===1)return motor(p);
 if(pumpTab===2)return box(p);
 if(pumpTab===3)return drive(p);
 if(pumpTab===4)return hmi(p);
 if(pumpTab===5)return measurements(p);
 if(pumpTab===6)return faults(p);
 return maintenance(p);
}
function motor(p){return `<div class="section"><h3>Motor Teknik Bilgileri</h3><div class="grid4">${field("Marka","brand",p.motor.brand)}${field("Model","model",p.motor.model)}${field("Güç kW","power",p.motor.power,"number")}${field("Gerilim V","voltage",p.motor.voltage,"number")}${field("Akım A","current",p.motor.current,"number")}${field("Frekans Hz","freq",p.motor.freq,"number")}${field("Devir rpm","rpm",p.motor.rpm,"number")}${field("Cosφ","cos",p.motor.cos,"number")}</div></div>${cableTable("MOTOR",p.motor)}`}
function cableTable(title,obj){return`<div class="section"><h3>${title} — U/V/W Kablo</h3><div class="grid3">${["U","V","W"].map(x=>`<div class="cable"><h4>${x}</h4>${field("Kablo rengi",x+"color",obj[x+"color"])}${field("Detay",x+"detail",obj[x+"detail"])}${field("Etiket",x+"label",obj[x+"label"])}</div>`).join("")}</div></div>`}
function box(p){return`<div class="section"><h3>BOX MOTOR GİRİŞİ</h3>${cableTable("BOX MOTOR GİRİŞİ",p.boxIn)}</div><div class="section"><h3>BOX SÜRÜCÜ ÇIKIŞI</h3>${cableTable("BOX SÜRÜCÜ ÇIKIŞI",p.boxOut)}</div>`}
function drive(p){return`<div class="section"><h3>Sürücü</h3><div class="grid4">${field("Seri / model","model",p.drive.model)}${field("Seri no","serial",p.drive.serial)}${field("Güç kW","power",p.drive.power,"number")}${field("Firmware","firmware",p.drive.firmware)}</div></div>${cableTable("SÜRÜCÜ",p.drive)}<div class="card"><b>ABB sürücü serileri</b><div class="badges">${DRIVES.map(x=>`<span class="badge">${x}</span>`).join("")}</div><p class="muted">Parametreler saha referansı olarak tutulur. Kritik ayarlar tam model ve firmware kılavuzundan doğrulanmalıdır.</p></div>`}
function hmi(p){let pg=p.hmi[hmiPage];return`<div class="hmi"><div class="hmi-tabs">${["Role / Dijital Çıkış","Basınç Koruma","Motor Teknik","Frekans / Uyku","Basınç Ayarı"].map((x,i)=>`<button class="hmi-tab ${hmiPage===i?"active":""}" onclick="hmiPage=${i};renderPump()">${x}</button>`).join("")}</div><div class="grid3" style="margin-top:12px">${["Başlangıç","Set Değeri","Alt Limit","Üst Limit","Gecikme","Açıklama"].map(k=>field(k,k,pg[k])).join("")}</div></div>`}
function measurements(p){return`<div class="actions"><button class="btn primary" onclick="addMeasurement()">+ Ölçüm Kaydı</button></div>${(p.measurements||[]).slice().reverse().map(x=>`<div class="item"><b>${esc(x.date)}</b><div class="muted">V: ${esc(x.v)} V • A: ${esc(x.a)} A • Hz: ${esc(x.hz)} • Basınç: ${esc(x.pressure)} • Debi: ${esc(x.flow)}</div></div>`).join("")||'<div class="item muted">Ölçüm yok.</div>'}`}
function faults(p){return`<div class="actions"><button class="btn primary" onclick="addFault()">+ Arıza Kaydı</button></div>${(p.faults||[]).slice().reverse().map(x=>`<div class="item"><b>${esc(x.code)} — ${esc(x.name)}</b><div class="muted">${esc(x.date)} • ${esc(x.note)}</div></div>`).join("")||'<div class="item muted">Arıza kaydı yok.</div>'}`}
function maintenance(p){return`<div class="actions"><button class="btn primary" onclick="addMaintenance()">+ Bakım Kaydı</button></div>${(p.maintenance||[]).slice().reverse().map(x=>`<div class="item"><b>${esc(x.date)}</b><div>${esc(x.title)}</div><div class="muted">${esc(x.note)}</div></div>`).join("")||'<div class="item muted">Bakım kaydı yok.</div>'}`}
function savePump(){
 let s=current,p=s.pumps[s.pumpIndex];document.querySelectorAll("[data-key]").forEach(e=>{let k=e.dataset.key;p[k]=e.value;p.motor[k]=e.value;p.drive[k]=e.value;p.boxIn[k]=e.value;p.boxOut[k]=e.value});save();edit=false;renderPump()
}
function adminLogin(){
 if(admin){admin=false;localStorage.removeItem(ADMIN_KEY);render();return}
 let p=prompt("Yönetici şifresi:");
 if(p===(db.settings.adminPassword||ADMIN_DEFAULT)){admin=true;localStorage.setItem(ADMIN_KEY,"1");render()}else if(p!==null)alert("Şifre yanlış.")
}
function addMeasurement(){let v=prompt("Ölçüm: V,A,Hz,Basınç,Debi şeklinde virgülle girin");if(!v)return;let a=v.split(",");current.pumps[current.pumpIndex].measurements.push({date:new Date().toLocaleString("tr-TR"),v:a[0],a:a[1],hz:a[2],pressure:a[3],flow:a[4]});save();renderPump()}
function addFault(){let v=prompt("Arıza kodu ve açıklama");if(!v)return;let a=v.split(" ");current.pumps[current.pumpIndex].faults.push({date:new Date().toLocaleString("tr-TR"),code:a.shift(),name:a.join(" "),note:""});save();renderPump()}
function addMaintenance(){let title=prompt("Bakım başlığı");if(!title)return;let note=prompt("Açıklama")||"";current.pumps[current.pumpIndex].maintenance.push({date:new Date().toLocaleString("tr-TR"),title,note});save();renderPump()}
function captureLocation(){
 if(!navigator.geolocation)return alert("Cihaz konum desteği yok.");
 navigator.geolocation.getCurrentPosition(pos=>{current.location={lat:pos.coords.latitude.toFixed(7),lng:pos.coords.longitude.toFixed(7),acc:Math.round(pos.coords.accuracy),date:new Date().toLocaleString("tr-TR")};save();renderDetail()},e=>alert("Konum alınamadı: "+e.message),{enableHighAccuracy:true,timeout:15000})
}
function maps(){if(current.location)location.href=`https://www.google.com/maps?q=${current.location.lat},${current.location.lng}`}
function analysis(){
 let pumps=db.stations.flatMap(s=>s.pumps),m=pumps.flatMap(p=>p.measurements||[]),f=pumps.flatMap(p=>p.faults||[]),b=pumps.flatMap(p=>p.maintenance||[]);
 return `<div class="stats"><div class="stat"><b>${pumps.length}</b><span class="muted">Toplam Pompa</span></div><div class="stat"><b>${m.length}</b><span class="muted">Ölçüm</span></div><div class="stat"><b>${f.length}</b><span class="muted">Arıza</span></div><div class="stat"><b>${b.length}</b><span class="muted">Bakım</span></div><div class="stat"><b>${db.history.length}</b><span class="muted">İş Kaydı</span></div></div><div class="card"><h2>Arıza Özeti</h2>${f.length?f.slice(-20).reverse().map(x=>`<div class="item"><b>${esc(x.code)}</b> ${esc(x.name)}<div class="muted">${esc(x.date)}</div></div>`).join(""):'<div class="muted">Henüz arıza kaydı yok.</div>'}</div>`
}
function library(){
 return `<div class="card"><h2>ABB Arıza Kütüphanesi</h2><input style="width:100%;min-height:44px;background:#061a2d;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px" placeholder="Kod veya açıklama ara..." oninput="libFilter(this.value)"><div id="faultLib">${db.faults.map(x=>`<div class="item"><b>${esc(x.code)}</b> — ${esc(x.name)}<div class="muted">${esc(x.desc)}</div></div>`).join("")}</div></div>
 <div class="card"><h2>ABB Parametre Kütüphanesi</h2><div id="paramLib">${db.params.map(x=>`<div class="item"><b>${esc(x.code)}</b> — ${esc(x.name)}<div class="muted">${esc(x.drive)}</div></div>`).join("")}</div></div>`
}
function libFilter(q){document.querySelectorAll("#faultLib .item").forEach(e=>e.style.display=e.innerText.toLowerCase().includes(q.toLowerCase())?"block":"none")}
function settings(){
 return `<div class="card"><h2>Ayarlar</h2><p class="muted">Site giriş şifresi kaldırılmıştır. Uygulama doğrudan açılır.</p><div class="grid">${field("Yönetici düzenleme şifresi","adminPassword",db.settings.adminPassword||ADMIN_DEFAULT,"password")}</div><button class="btn ok" onclick="saveSettings()">Ayarları Kaydet</button></div><div class="card"><h2>Veri</h2><button class="btn" onclick="exportJSON()">JSON Yedek Al</button><button class="btn bad" onclick="resetData()">Tüm yerel veriyi sıfırla</button></div>`
}
function saveSettings(){let p=document.querySelector("[data-key=adminPassword]").value.trim();if(p)db.settings.adminPassword=p;save();alert("Kaydedildi.");render()}
function exportJSON(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="meski-terfi-arsiv-yedek.json";a.click()}
function resetData(){if(confirm("Yerel veriler silinsin mi?")){localStorage.removeItem(KEY);db=loadDB();render()}}
function init(){render()}
init();
</script>
</body>
</html>
