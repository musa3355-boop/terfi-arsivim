/* =========================================================
   ESKİ VERİLERİ YENİ YAPIYA ÇEVİR
========================================================= */

function migrateStation(s){

 if(!s.motors){

  s.motors=[];

  let count=Number(s.motorCount||0);

  if(count<1) count=1;

  if(s.motor && Object.keys(s.motor).length){

   let m=createMotor(1);

   Object.assign(m,s.motor);

   m.name="Motor 1";

   s.motors.push(m);

   for(let i=2;i<=count;i++)
    s.motors.push(createMotor(i));

  }else{

   for(let i=1;i<=count;i++)
    s.motors.push(createMotor(i));

  }
 }

 if(!s.motors.length)
  s.motors.push(createMotor(1));

 s.motorCount=s.motors.length;

 if(!s.hmi)
  s.hmi=HMI_PAGES.map(()=>({}));

 if(!s.ssr)s.ssr={};
 if(!s.measurement)s.measurement={};
 if(!s.cable)s.cable={};

 return s;
}

function esc(v){

  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}

function toast(message){

 let t=document.getElementById("toast");

 if(!t)return;

 t.textContent=message;
 t.classList.add("show");

 clearTimeout(window.__toastTimer);

 window.__toastTimer=setTimeout(
  ()=>t.classList.remove("show"),
  2200
 );

}

function fieldHTML(label,key,type,obj,prefix){

 let value=obj?.[key]??"";
 let disabled=state.editMode?"":"disabled";

  return `
  <div class="field" style="grid-column:1/-1">
   <label>${esc(label)}</label>
   <textarea ${disabled}
    onchange="updateObject('${prefix}','${key}',this.value)">${esc(value)}</textarea>
  </div>
  `;

 }

 let htmlType="text";

 if(type==="integer"||type==="decimal")htmlType="number";
 if(type==="date")htmlType="date";
 if(type==="time")htmlType="time";

 return `
 <div class="field">
  <label>${esc(label)}</label>
  <input type="${htmlType}"
   ${type==="decimal"?'step="any" inputmode="decimal"':type==="integer"?'step="1" inputmode="numeric"':""}
   value="${esc(value)}"
   ${disabled}
   onchange="updateObject('${prefix}','${key}',this.value)">
 </div>
 `;

}

/* =========================================================
   UPDATE
========================================================= */

function updateObject(prefix,key,value){

 let s=currentStation();

 if(!s)return;

 if(prefix==="station"){

  s[key]=value;

  if(key==="motorCount"){

   let wanted=parseInt(value)||0;

   if(wanted<0)wanted=0;

   migrateStation(s);

   while(s.motors.length<wanted)
    s.motors.push(createMotor(s.motors.length+1));

   while(s.motors.length>wanted)
    s.motors.pop();

   s.motorCount=s.motors.length;

  }

 }else{

  if(!s[prefix])s[prefix]={};

  s[prefix][key]=value;

 }

 saveData();

 if(key==="motorCount")render();

}

function selectMotor(index){

 state.selectedMotor=index;
 render();

 setTimeout(()=>{
  let el=document.getElementById("section-motors");
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
 },30);

}

function addMotor(){

 if(!state.editMode){
  openAccess();
  return;
 }

 let s=currentStation();

 if(!s)return;

 migrateStation(s);

 let m=createMotor(s.motors.length+1);

 s.motors.push(m);
 s.motorCount=s.motors.length;

 state.selectedMotor=s.motors.length-1;

 saveData();
 render();

 toast("Yeni motor eklendi.");

}

function removeMotor(){

 if(!state.editMode)return;

 let s=currentStation();

 if(!s||s.motors.length<=1){

  toast("Terfide en az bir motor bırakılmalı.");
  return;

 }

 let m=s.motors[state.selectedMotor];

 if(!confirm((m?.name||"Motor")+
  " silinsin mi?"))return;

 s.motors.splice(state.selectedMotor,1);

 s.motors.forEach((x,i)=>{
  x.name="Motor "+(i+1);
 });

 s.motorCount=s.motors.length;

 if(state.selectedMotor>=s.motors.length)
  state.selectedMotor=s.motors.length-1;

 saveData();
 render();

 toast("Motor silindi.");

}

function newStation(){

 if(!state.editMode){

  openAccess();
  return;

 }

 let s=createDefaultStation();

 let numbers=state.stations.map(
  x=>parseInt(String(x.code).replace(/\D/g,""))||0
 );

 let next=Math.max(0,...numbers)+1;

 s.code="T"+String(next).padStart(3,"0");
 s.name="Yeni Terfi";

 state.stations.push(s);

 state.selectedStation=s.id;
 state.page="detail";
 state.detailTab="station";
 state.selectedMotor=0;

 saveData();

 document.getElementById("pageTitle").textContent="Terfi Teknik Arşivi";

 render();

 toast("Yeni terfi oluşturuldu.");

}

     ${pdfItem("Sürücü Sayısı",s.driveCount)}
     ${pdfItem("Açıklama",s.description,true)}

    </div>

   </div>

   <div class="pdf-box">

    <div class="pdf-box-title">SSR / SEVİYE</div>

    <div class="pdf-grid">

     ${pdfItem("SSR Seviyesi",s.ssr.level)}
     ${pdfItem("SSR Alt Seviyesi",s.ssr.low)}
     ${pdfItem("SSR Üst Seviyesi",s.ssr.high)}

    </div>

   </div>

   <div class="pdf-box">

    <div class="pdf-box-title">MOTOR ÇALIŞMA DEĞERLERİ</div>

    <div class="pdf-grid">

    ${RUNNING_FIELDS.map(
     ([label,key])=>
      pdfItem(label,s.measurement[key])
    ).join("")}

    </div>

   </div>

   <div class="pdf-box">

    <div class="pdf-box-title">POMPA ETİKETİ</div>

    <div class="pdf-grid">

    ${PUMP_FIELDS.map(
     ([label,key])=>
      pdfItem(label,s.pump?.[key])
    ).join("")}

    </div>

   </div>

   <div class="pdf-box">

    <div class="pdf-box-title">GENEL MOTOR KABLOSU</div>

    <div class="pdf-grid">

     ${pdfItem("L1",s.cable.l1)}
     ${pdfItem("L2",s.cable.l2)}
     ${pdfItem("L3",s.cable.l3)}
     ${pdfItem("PE",s.cable.pe)}
     ${pdfItem("Not",s.cable.note,true)}

    </div>

   </div>

   <div class="pdf-box">

    <div class="pdf-box-title">TEKNİK NOT</div>

    <div class="pdf-value">
     ${esc(s.notes||"—")}
    </div>

   </div>

  </div>

  <!-- =================================================
       BÜTÜN MOTORLAR
  ================================================== -->

  <div class="pdf-box">

   <div class="pdf-box-title">
    TERFİ MOTORLARI · ${s.motors.length} ADET
   </div>

   ${s.motors.map(
    (m,i)=>pdfMotorHTML(m,i)
   ).join("")}

  </div>

  <!-- =================================================
       TÜM 5 HMI SAYFASI
  ================================================== -->

  <div class="pdf-box" style="margin-top:1.5mm">

   <div class="pdf-box-title">
    HMI / PLC ARŞİVİ · TÜM 5 SAYFA
   </div>

   ${pdfHMIHTML(s)}

  </div>

  <div class="pdf-footer">

   <span>MESKİ · TERFİ ARŞİVİM</span>

   <span>
    ${esc(s.code)} · ${esc(s.name)}
   </span>

   <span>
    HMI 1/5 · 2/5 · 3/5 · 4/5 · 5/5
   </span>

  </div>

 </div>

 `;

}

/* =========================================================
   PDF AKTAR
========================================================= */

function exportPDF(){

 let s=currentStation();

 if(!s){

  toast("Önce bir terfi kaydı açın.");
  return;

 }

 migrateStation(s);

 /*
  BURADA state.hmiPage KULLANILMIYOR.

  PDF:
  HMI 1
  HMI 2
  HMI 3
  HMI 4
  HMI 5

  TAMAMINI pdfHMIHTML() İÇİNDEN ALIR.

  Aynı şekilde:
  Motor 1
  Motor 2
  Motor 3
  ...
  Motor N

  TAMAMI pdfMotorHTML() İÇİNDEN ALINIR.
 */

 let oldTitle=document.title;

 document.title=
  "MESKI - "+(s.code||"Terfi")+" - Teknik Arşiv";

 toast("PDF hazırlanıyor...");

 setTimeout(()=>{

  window.print();

  setTimeout(()=>{
   document.title=oldTitle;
  },1000);

 },250);

}

/* =========================================================
   SIFIRLA
========================================================= */

function resetPreferences(){

 state.settings={
  theme:"light",
  density:"normal"
 };

 savePreferences();
 render();

 toast("Varsayılan görünüm geri yüklendi.");

}

/* =========================================================
   BAŞLAT
========================================================= */

loadData();
render();

</script>
