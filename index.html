<style>
:root{
 --bg:#071a2f;--card:#0d2945;--line:#28506e;
 --text:#eef7ff;--muted:#9db7ca;--blue:#38a9e8;
 --ok:#18b878;--danger:#b83d42
}
*{box-sizing:border-box}
html,body{
 margin:0;background:var(--bg);color:var(--text);
 font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
main{max-width:1100px;margin:auto;padding:14px 14px 90px}
h1,h2,h3,h4{margin-top:0}
.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:14px;margin:10px 0
}
.row{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px
}
.field label{
 display:block;font-size:11px;color:var(--muted);margin-bottom:4px
}
.field input,.field textarea,.field select{
 width:100%;padding:11px;background:#071a2f;color:#fff;
 border:1px solid var(--line);border-radius:9px;outline:none
}
.field textarea{min-height:75px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{
 border-color:var(--blue)
}
.btn{
 padding:10px 13px;border:1px solid var(--line);border-radius:9px;
 background:#164465;color:#fff;margin:3px;cursor:pointer
}
.btn.on{background:var(--blue);border-color:var(--blue)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.bad{background:var(--danger);border-color:var(--danger)}
.btn.big{padding:13px 16px;font-weight:800}
.tabs{
 display:flex;gap:5px;overflow-x:auto;padding:4px 0 8px;
 position:sticky;top:0;background:var(--bg);z-index:5
}
.tabs .btn{white-space:nowrap}
.station{
 background:#0b2741;border:1px solid #28506e;
 border-radius:13px;padding:13px;margin:8px 0;cursor:pointer
}
.station:hover{border-color:var(--blue)}
.station-title{font-weight:900;font-size:17px}
.station-meta{font-size:12px;color:var(--muted);margin-top:5px}
.badge{
 display:inline-block;padding:4px 8px;border-radius:999px;
 background:#163f59;color:#9edcff;font-size:10px;font-weight:800
}
.muted{color:var(--muted)}
.code{color:#67c9ff;font-weight:900}
.library-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
.library-card{
 background:#091827;border:1px solid #203b56;
 border-radius:14px;padding:13px;cursor:pointer
}
.library-card:hover{border-color:#2997ff}
.library-code{font-size:20px;font-weight:900;color:#67c9ff}
.library-name{font-weight:900;margin-top:3px}
.library-desc{font-size:12px;color:#a9bbcd;line-height:1.5;margin-top:8px}
.library-source{font-size:10px;color:#71879b;margin-top:8px}
.workbox{
 background:#081b30;border:1px solid #274c67;
 border-radius:12px;padding:12px;margin:8px 0
}
.workbox h4{font-size:12px;color:#b5cad7}
.hmi{
 background:#102a34;border-color:#335563
}
.hmi input{background:#f8fbfd;color:#061828;border-color:#7891a0}
.empty{
 padding:14px;color:var(--muted);
 border:1px dashed #34536b;border-radius:10px
}
.save{
 position:fixed;z-index:20;bottom:0;left:0;right:0;
 padding:9px;background:#051423;border-top:1px solid #18364f
}
.save button{
 width:100%;padding:13px;border:0;border-radius:10px;
 background:var(--ok);color:white;font-weight:900
}
.print-only{display:none}

@media(max-width:650px){
 .row{grid-template-columns:1fr}
 .library-grid{grid-template-columns:1fr}
 .tabs{margin-inline:-4px;padding-inline:4px}
}

/* ================= PDF ================= */
@media print{
 @page{size:A4 portrait;margin:7mm}

 html,body{
  background:#fff!important;color:#111!important
 }

 #app,.save{display:none!important}
 .print-only{display:block!important}

 .print-page{
  width:100%;min-height:283mm;
  page-break-after:always;
  break-after:page;
  overflow:hidden;
  color:#111;background:#fff
 }

 .print-page:last-child{
  page-break-after:auto;
  break-after:auto
 }

 .print-head{
  border-bottom:2px solid #0b2742;
  padding-bottom:5px;margin-bottom:7px
 }

 .print-head h1{
  font-size:17px;margin:0
 }

 .print-head p{
  font-size:9px;margin:2px 0;color:#555
 }

 .print-section{
  border:1px solid #b8c1c8;
  border-radius:5px;margin:5px 0;padding:5px
 }

 .print-section h2{
  font-size:10px;margin:0 0 4px;
  color:#0b2742;
  border-bottom:1px solid #d7dde2;
  padding-bottom:3px
 }

 .print-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px
 }

 .print-cell{
  border-bottom:1px solid #e1e5e8;
  padding:2px 3px;min-height:15px
 }

 .print-cell b{
  font-size:7px;color:#5a6873;
  display:block
 }

 .print-cell span{font-size:8px}

 .print-hmi-title{
  font-size:14px;font-weight:900;
  color:#0b2742;margin-bottom:5px
 }

 .print-hmi-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px
 }

 .print-hmi-cell{
  border:1px solid #cbd3d9;
  border-radius:3px;padding:3px;
  min-height:23px
 }

 .print-hmi-cell b{
  display:block;font-size:6.5px;
  color:#53616c
 }

 .print-hmi-cell span{
  display:block;font-size:8.5px;
  font-weight:700;margin-top:1px;
  word-break:break-word
 }

 .print-foot{
  margin-top:4px;
  font-size:6.5px;
  color:#777;text-align:right
 }
}
</style>
</head>

/* =========================================================

========================================================= */

function esc(v){
 return String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#39;");
}

function val(id){
 const e=document.getElementById(id);
 return e?e.value:'';
}

function num(v){
 if(v===null||v===undefined||v==='')return null;
 return Number(String(v).replace(',','.'));
}

function renderStations(rows){

   ${esc(x.adres||'Adres girilmemiş')}
  </div>

function filterStations(){

 const q=(document.getElementById('search')?.value||'').toLowerCase();

 document.querySelectorAll('.station').forEach(x=>{
  x.style.display=
   x.dataset.search.includes(q)?'block':'none';
 });
}

async function openStation(id){

 const [
  s,m,p,d,h,w,tp
 ]=await Promise.all([

  db.from('terfiler').select('*').eq('id',id).single(),

  db.from('motorlar').select('*').eq('terfi_id',id).order('created_at'),

  db.from('pompalar').select('*').eq('terfi_id',id).order('created_at'),

  db.from('suruculer').select('*').eq('terfi_id',id).order('created_at'),

  db.from('hmi_kayitlari').select('*').eq('terfi_id',id).order('ekran_no'),

  db.from('motor_calisma_kayitlari').select('*').eq('terfi_id',id).order('captured_at',{ascending:false}),

  db.from('terfi_parametreleri').select('*').eq('terfi_id',id).order('sira')
 ]);

 if(s.error)return alert(s.error.message);

 current={
  s:s.data,
  m:m.data||[],
  p:p.data||[],
  d:d.data||[],
  h:h.data||[],
  w:w.data||[],
  tp:tp.data||[]
 };

 tab='terfi';
 workMotor=current.m[0]?.id||null;

 render();
}

async function save(){

 if(!current){
  alert('Önce bir terfi seçin.');
  return;
 }

 if(!edit){
  unlock();
  return;
 }

 const id=current.s.id;

 try{

  /* TERFİ */
  if(tab==='terfi'){

   const r=await db
    .from('terfiler')
    .update({
     ad:val('s_ad'),
     terfi_no:val('s_no'),
     kod:val('s_kod'),
     bolge:val('s_bolge'),
     adres:val('s_adres'),
     aciklama:val('s_aciklama'),
     updated_at:new Date().toISOString()
    })
    .eq('id',id);

   if(r.error)throw r.error;
  }


  /* MOTOR */
  if(tab==='motor'){

   for(const m of current.m){

    const r=await db
     .from('motorlar')
     .update({
      ad:val(`m_${m.id}_ad`),
      marka:val(`m_${m.id}_marka`),
      model:val(`m_${m.id}_model`),
      seri_no:val(`m_${m.id}_seri`),
      guc_kw:num(val(`m_${m.id}_kw`)),
      guc_hp:num(val(`m_${m.id}_hp`)),
      gerilim_v:num(val(`m_${m.id}_v`)),
      nominal_akim_a:num(val(`m_${m.id}_a`)),
      frekans_hz:num(val(`m_${m.id}_hz`)),
      devir_rpm:num(val(`m_${m.id}_rpm`)),
      cos_phi:num(val(`m_${m.id}_cos`)),
      montaj_tarihi:val(`m_${m.id}_montaj`)||null,
      degisim_tarihi:val(`m_${m.id}_degisim`)||null,
      etiket_notu:val(`m_${m.id}_not`)
     })
     .eq('id',m.id);

    if(r.error)throw r.error;
   }
  }


  /* POMPA */
  if(tab==='pompa'){

   for(const p of current.p){

    const r=await db
     .from('pompalar')
     .update({
      ad:val(`p_${p.id}_ad`),
      marka:val(`p_${p.id}_marka`),
      model:val(`p_${p.id}_model`),
      tip:val(`p_${p.id}_tip`),
      seri_no:val(`p_${p.id}_seri`),
      guc_kw:num(val(`p_${p.id}_kw`)),
      guc_hp:num(val(`p_${p.id}_hp`)),
      q_min_m3h:num(val(`p_${p.id}_qmin`)),
      q_max_m3h:num(val(`p_${p.id}_qmax`)),
      h_min_m:num(val(`p_${p.id}_hmin`)),
      h_max_m:num(val(`p_${p.id}_hmax`)),
      etiket_notu:val(`p_${p.id}_not`)
     })
     .eq('id',p.id);

    if(r.error)throw r.error;
   }
  }


  /* SÜRÜCÜ */
  if(tab==='surucu'){

   for(const d of current.d){

    const r=await db
     .from('suruculer')
     .update({
      ad:val(`d_${d.id}_ad`),
      marka:val(`d_${d.id}_marka`),
      model:val(`d_${d.id}_model`),
      seri_no:val(`d_${d.id}_seri`),
      guc_kw:num(val(`d_${d.id}_kw`)),
      besleme_v:num(val(`d_${d.id}_v`)),
      motor_id:val(`d_${d.id}_motor`)||null,
      notlar:val(`d_${d.id}_not`)
     })
     .eq('id',d.id);

    if(r.error)throw r.error;
   }
  }


  /* HMI */
  if(tab==='hmi'){

   for(let page=1;page<=5;page++){

    const values={};

    HMI[page-1].forEach((x,i)=>{
     values[i]=val(`hmi_${page}_${i}`);
    });

    const old=current.h.find(x=>x.ekran_no===page);

    if(old){

     const r=await db
      .from('hmi_kayitlari')
      .update({
       degerler:values
      })
      .eq('id',old.id);

     if(r.error)throw r.error;

    }else{

     const r=await db
      .from('hmi_kayitlari')
      .insert({
       terfi_id:id,
       ekran_no:page,
       degerler:values
      });

     if(r.error)throw r.error;
    }
   }
  }


  /* ÇALIŞMA */
  if(tab==='calisma'){

   if(!workMotor)
    throw new Error('Motor seçilmedi.');

   const patch={
    terfi_id:id,
    motor_id:workMotor,
    captured_at:new Date().toISOString(),
    frekans_hz:num(val('w_frekans_hz')),
    akim_a:num(val('w_akim_a')),
    devir_rpm:num(val('w_devir_rpm')),
    guc_kw:num(val('w_guc_kw')),
    gerilim_v:num(val('w_gerilim_v')),
    surucu_sicaklik_c:num(val('w_surucu_sicaklik_c')),
    set_basinci_bar:num(val('w_set_basinci_bar')),
    calisma_basinci_bar:num(val('w_calisma_basinci_bar')),
    tasarruf_kwh:num(val('w_tasarruf_kwh')),
    durum:val('w_durum')||null,
    notlar:val('w_notlar')||null
   };

   const r=await db
    .from('motor_calisma_kayitlari')
    .insert(patch);

   if(r.error)throw r.error;
  }

  alert('Kayıt başarıyla kaydedildi.');

  await openStation(id);

 }catch(e){

  console.error(e);

  alert(
   'Kayıt sırasında hata oluştu.\n\n'+
   (e.message||'Bilinmeyen hata')
  );
 }
}

   <button class="btn ok" onclick="checkEditPassword()">
    GİRİŞ
   </button>

  </div>

 </div>
 `;

 document.body.appendChild(box);

 setTimeout(()=>{
  document.getElementById('passwordBox')?.focus();
 },50);

 window.checkEditPassword=()=>{

  const p=document.getElementById('passwordBox');

  if(p.value==='6872'){

   edit=true;
   box.remove();

   if(current)render();
   else home();

  }else{

   p.value='';
   p.placeholder='Hatalı giriş';
  }
 };
}


/* =========================================================

========================================================= */

async function deleteTerfi(){

 if(!current?.s?.id)return;

 if(!edit){
  unlock();
  return;
 }

 const name=current.s.ad||'Bu terfi';

 if(!confirm(
  `"${name}" terfisi ve bağlı kayıtlar silinsin mi?\n\n`+
  `Motor, pompa, sürücü, HMI, çalışma, parametre, `+
  `ölçüm, bakım, arıza, fotoğraf ve kablo kayıtları da silinebilir.\n\n`+
  `BU İŞLEM GERİ ALINAMAZ.`
 ))return;

 const id=current.s.id;

 try{

  const mr=await db
   .from('motorlar')
   .select('id')
   .eq('terfi_id',id);

  if(mr.error)throw mr.error;

  const dr=await db
   .from('suruculer')
   .select('id')
   .eq('terfi_id',id);

  if(dr.error)throw dr.error;

  const motorIds=(mr.data||[]).map(x=>x.id);
  const driverIds=(dr.data||[]).map(x=>x.id);


  /* Motor ID'li kayıtlar */
  for(const mid of motorIds){

   const r=await db
    .from('motor_box_kablolari')
    .delete()
    .eq('motor_id',mid);

   if(r.error)throw r.error;
  }


  /* Sürücü ID'li kayıtlar */
  for(const did of driverIds){

   for(const table of [
    'surucu_ariza_kayitlari',
    'surucu_parametre_kayitlari'
   ]){

    const r=await db
     .from(table)
     .delete()
     .eq('surucu_id',did);

    if(r.error)throw r.error;
   }
  }


  /* Terfiye bağlı tablolar */
  const tables=[

   'motor_calisma_kayitlari',
   'hmi_kayitlari',
   'hmi_ayarlar',
   'ekran_ayarlari',
   'ekran_verileri',
   'anlik_calisma_verileri',
   'surucu_ariza_kayitlari',
   'surucu_parametre_kayitlari',
   'terfi_parametreleri',
   'servis_kayitlari',
   'teknik_fotograflar',
   'fotograflar',
   'olcumler',
   'olcum_kayitlari',
   'panolar',
   'seviye_bilgileri',
   'degisiklik_gecmisi',
   'ariza_notlari',
   'bakim_kayitlari',
   'kablo_baglantilari'
  ];


  for(const table of tables){

   const r=await db
    .from(table)
    .delete()
    .eq('terfi_id',id);

   if(r.error){

    console.warn(
     'Silinemeyen tablo:',
     table,
     r.error.message
    );

   }
  }


  /* Sürücüler */
  for(const did of driverIds){

   const r=await db
    .from('suruculer')
    .delete()
    .eq('id',did);

   if(r.error)throw r.error;
  }


  /* Motorlar */
  for(const mid of motorIds){

   const r=await db
    .from('motorlar')
    .delete()
    .eq('id',mid);

   if(r.error)throw r.error;
  }


  /* Pompalar */
  const pumps=await db
   .from('pompalar')
   .select('id')
   .eq('terfi_id',id);

  if(pumps.error)throw pumps.error;

  for(const p of pumps.data||[]){

   const r=await db
    .from('pompalar')
    .delete()
    .eq('id',p.id);

   if(r.error)throw r.error;
  }


  /* ANA TERFİ */
  const finalDelete=await db
   .from('terfiler')
   .delete()
   .eq('id',id);

  if(finalDelete.error)
   throw finalDelete.error;

  alert('Terfi ve bağlı kayıtlar silindi.');

  current=null;
  edit=false;

  await home();

 }catch(e){

  console.error(e);

  alert(
   'Terfi tamamen silinemedi.\n\n'+
   (e.message||'Bilinmeyen hata')
  );
 }
}
