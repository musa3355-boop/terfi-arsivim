<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>MESKİ | Terfi Arşivim</title>

<style>
:root{
    --bg:#071827;
    --bg2:#0a2033;
    --panel:#0c263c;
    --panel2:#102d45;
    --panel3:#0a2135;
    --line:#164c70;
    --line2:#23698f;
    --blue:#1688ed;
    --blue2:#42a9ff;
    --text:#edf5fb;
    --muted:#a9bfd1;
    --muted2:#7895aa;
    --success:#26c281;
    --warning:#f0b84b;
    --danger:#ef6262;
    --shadow:0 18px 45px rgba(0,0,0,.28);
    --radius:14px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at 80% 10%, rgba(22,136,237,.08), transparent 30%),
        linear-gradient(145deg,#091d2e,#071827 55%,#061522);
    color:var(--text);
    min-height:100vh;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:245px;
    min-width:245px;
    background:rgba(7,25,40,.94);
    border-right:1px solid rgba(35,105,143,.45);
    padding:22px 16px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:50;
    overflow-y:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
    padding:4px 6px 25px;
    border-bottom:1px solid rgba(35,105,143,.35);
}

.brand-mark{
    width:54px;
    height:54px;
    border-radius:13px;
    background:linear-gradient(145deg,#0878d8,#1161a3);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
    box-shadow:0 8px 25px rgba(22,136,237,.2);
}

.brand-title{
    font-size:21px;
    font-weight:800;
    letter-spacing:.5px;
}

.brand-sub{
    font-size:10px;
    color:var(--blue2);
    letter-spacing:.7px;
    margin-top:3px;
}

.nav{
    margin-top:18px;
}

.nav button{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 13px;
    margin-bottom:5px;
    border:1px solid transparent;
    border-radius:10px;
    background:transparent;
    color:#d9e7f1;
    cursor:pointer;
    text-align:left;
    font-size:14px;
    transition:.18s;
}

.nav button:hover{
    background:rgba(22,136,237,.09);
    border-color:rgba(35,105,143,.35);
}

.nav button.active{
    background:linear-gradient(90deg,#126fc2,#0d5fa8);
    border-color:#208be5;
    box-shadow:0 8px 20px rgba(0,105,200,.16);
}

.nav-icon{
    width:22px;
    text-align:center;
    color:#72baff;
}

.sidebar-footer{
    margin-top:30px;
    padding-top:15px;
    border-top:1px solid rgba(35,105,143,.3);
    color:var(--muted2);
    font-size:11px;
    line-height:1.7;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
}

.topbar{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid rgba(35,105,143,.32);
    background:rgba(7,24,38,.76);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:30;
}

.top-title{
    font-size:17px;
    font-weight:700;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.mode{
    border:1px solid var(--line);
    padding:9px 13px;
    border-radius:9px;
    font-size:12px;
    color:var(--muted);
}

.mode.edit{
    color:#fff;
    border-color:#2b8ddd;
    background:rgba(22,136,237,.1);
}

.content{
    padding:25px;
    max-width:1500px;
    margin:auto;
}

/* =========================
   CARDS
========================= */

.card{
    background:
        linear-gradient(145deg,rgba(14,43,66,.96),rgba(8,30,48,.96));
    border:1px solid rgba(35,105,143,.55);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

.card-header{
    padding:20px 22px;
    border-bottom:1px solid rgba(35,105,143,.38);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.card-title{
    font-size:18px;
    font-weight:750;
}

.card-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.card-body{
    padding:22px;
}

/* =========================
   DASHBOARD
========================= */

.hero{
    padding:28px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
}

.hero:after{
    content:"MESKİ";
    position:absolute;
    right:-25px;
    bottom:-45px;
    font-size:120px;
    font-weight:900;
    color:rgba(70,145,195,.035);
    pointer-events:none;
}

.hero-inner{
    position:relative;
    z-index:2;
}

.hero-title{
    font-size:30px;
    font-weight:800;
    margin-bottom:7px;
}

.hero-sub{
    color:var(--muted);
    font-size:15px;
}

.hero-note{
    margin-top:22px;
    max-width:750px;
    color:#c3d5e2;
    line-height:1.6;
    font-size:13px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;
    margin-bottom:20px;
}

.stat{
    padding:19px;
    background:linear-gradient(145deg,#0e2b43,#0a2237);
    border:1px solid rgba(35,105,143,.52);
    border-radius:13px;
}

.stat-label{
    font-size:12px;
    color:var(--muted);
}

.stat-value{
    font-size:28px;
    font-weight:800;
    margin-top:9px;
}

.stat-unit{
    color:var(--muted2);
    font-size:11px;
    margin-top:3px;
}

/* =========================
   BUTTONS
========================= */

button{
    font-family:inherit;
}

.btn{
    border:1px solid var(--line2);
    background:#0b2941;
    color:#e8f3fa;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    font-size:13px;
    font-weight:650;
    transition:.18s;
}

.btn:hover{
    transform:translateY(-1px);
    border-color:#3d91c1;
}

.btn-primary{
    background:linear-gradient(135deg,#168ff2,#0876ce);
    border-color:#2498f1;
}

.btn-success{
    background:linear-gradient(135deg,#159d69,#117d57);
    border-color:#25b87e;
}

.btn-danger{
    background:rgba(239,98,98,.08);
    border-color:rgba(239,98,98,.45);
    color:#ff9c9c;
}

.btn-small{
    padding:7px 10px;
    font-size:11px;
}

/* =========================
   SEARCH
========================= */

.toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.search{
    flex:1;
    max-width:460px;
    position:relative;
}

.search input{
    width:100%;
    padding:12px 14px 12px 38px;
    background:#081f33;
    color:#fff;
    border:1px solid var(--line);
    border-radius:9px;
    outline:none;
}

.search span{
    position:absolute;
    left:13px;
    top:11px;
    color:#7196ae;
}

/* =========================
   TABLE
========================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th{
    text-align:left;
    color:#82b7da;
    font-size:11px;
    letter-spacing:.4px;
    font-weight:700;
    padding:13px 14px;
    border-bottom:1px solid rgba(35,105,143,.45);
}

td{
    padding:13px 14px;
    font-size:12px;
    border-bottom:1px solid rgba(35,105,143,.22);
    color:#d9e7ef;
}

tr:hover td{
    background:rgba(22,136,237,.045);
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 8px;
    border-radius:6px;
    font-size:10px;
    background:rgba(38,194,129,.1);
    color:#65d6a5;
    border:1px solid rgba(38,194,129,.25);
}

/* =========================
   STATION LIST
========================= */

.station-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.station-card{
    padding:20px;
    border:1px solid rgba(35,105,143,.48);
    background:linear-gradient(145deg,#0d2941,#092238);
    border-radius:12px;
    cursor:pointer;
    transition:.18s;
}

.station-card:hover{
    border-color:#2789bd;
    transform:translateY(-2px);
}

.station-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.station-code{
    color:#54aaff;
    font-size:12px;
    font-weight:800;
}

.station-name{
    font-size:18px;
    font-weight:750;
    margin-top:6px;
}

.station-meta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:17px;
}

.meta-box{
    background:#081e31;
    border:1px solid rgba(35,105,143,.3);
    padding:9px;
    border-radius:8px;
}

.meta-label{
    font-size:9px;
    color:var(--muted2);
}

.meta-value{
    font-size:14px;
    font-weight:700;
    margin-top:3px;
}

/* =========================
   DETAIL
========================= */

.back-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
}

.station-heading{
    margin-bottom:18px;
}

.station-heading h1{
    margin:0;
    font-size:28px;
}

.station-heading p{
    margin:6px 0 0;
    color:var(--muted);
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;
}

.full{
    grid-column:1/-1;
}

/* =========================
   TECHNICAL VALUES
========================= */

.value-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.value{
    border:1px solid rgba(35,105,143,.4);
    background:#092239;
    border-radius:9px;
    padding:14px;
}

.value-label{
    color:#9db7c9;
    font-size:11px;
}

.value-number{
    font-size:18px;
    font-weight:750;
    margin-top:6px;
}

/* =========================
   FORMS
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field.full-field{
    grid-column:1/-1;
}

.field label{
    color:#a9bfd1;
    font-size:12px;
    font-weight:650;
}

.field input,
.field textarea,
.field select{
    width:100%;
    background:#071e31;
    border:1px solid #18547b;
    color:#f0f6fa;
    border-radius:9px;
    padding:12px 13px;
    outline:none;
    font-family:inherit;
    font-size:14px;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#2b9bed;
    box-shadow:0 0 0 3px rgba(22,136,237,.08);
}

.field textarea{
    min-height:105px;
    resize:vertical;
}

/* =========================
   HMI
========================= */

.hmi-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
}

.hmi-tab{
    flex:0 0 auto;
    padding:11px 16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#092239;
    color:#a8bfd1;
    cursor:pointer;
}

.hmi-tab.active{
    background:#147fd9;
    color:white;
    border-color:#2999ef;
}

.hmi-screen{
    margin-top:16px;
    border:2px solid #263c4c;
    background:#080d12;
    border-radius:12px;
    padding:20px;
}

.hmi-title{
    text-align:center;
    font-size:19px;
    font-weight:800;
    color:#e7edf1;
    padding-bottom:14px;
    border-bottom:1px solid #303a41;
    margin-bottom:18px;
}

.hmi-fields{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.hmi-field{
    display:flex;
    align-items:center;
    gap:8px;
}

.hmi-field label{
    flex:1;
    font-size:11px;
    color:#e2e8ec;
}

.hmi-field input{
    width:105px;
    padding:9px 8px;
    border-radius:4px;
    border:1px solid #66737c;
    background:#eef3f6;
    color:#17222b;
    font-size:14px;
    font-weight:650;
}

.hmi-foot{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid #303a41;
    color:#bac4ca;
    font-size:11px;
}

/* =========================
   NAMEPLATE
========================= */

.nameplate{
    background:
        linear-gradient(145deg,#e8ecef,#bfc8ce);
    color:#1d252a;
    border:6px solid #6f7a80;
    border-radius:9px;
    padding:20px;
    box-shadow:
        inset 0 0 0 1px #fff,
        0 14px 30px rgba(0,0,0,.25);
}

.nameplate-header{
    text-align:center;
    border-bottom:2px solid #30383d;
    padding-bottom:13px;
    margin-bottom:15px;
}

.nameplate-brand{
    font-size:23px;
    font-weight:900;
    letter-spacing:1px;
}

.nameplate-type{
    font-size:13px;
    font-weight:800;
    margin-top:4px;
}

.nameplate-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid #566169;
    border-left:1px solid #566169;
}

.np-field{
    padding:9px;
    border-right:1px solid #566169;
    border-bottom:1px solid #566169;
}

.np-label{
    font-size:9px;
    color:#536069;
    font-weight:700;
}

.np-value{
    font-size:13px;
    font-weight:800;
    margin-top:3px;
}

.nameplate-note{
    margin-top:13px;
    font-size:10px;
    color:#465158;
}

/* =========================
   TECH REFERENCE
========================= */

.reference-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.reference{
    background:#0b253b;
    border:1px solid rgba(35,105,143,.45);
    border-radius:11px;
    padding:17px;
}

.reference h3{
    font-size:14px;
    margin:0 0 8px;
}

.reference p{
    font-size:11px;
    line-height:1.6;
    color:#a8bdcc;
    margin:0;
}

.ref-value{
    color:#62b8fa;
    font-size:19px;
    font-weight:800;
    margin:8px 0;
}

/* =========================
   LOCK
========================= */

.lock-box{
    text-align:center;
    padding:35px 20px;
}

.lock-icon{
    width:66px;
    height:66px;
    margin:0 auto 15px;
    border:2px solid #218ddd;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    color:#50adff;
}

.lock-box h2{
    margin:0 0 7px;
}

.lock-box p{
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.password-row{
    max-width:390px;
    margin:auto;
    display:flex;
    gap:8px;
}

.password-row input{
    flex:1;
    background:#071e31;
    border:1px solid var(--line);
    color:#fff;
    border-radius:9px;
    padding:12px;
    font-size:15px;
    text-align:center;
    letter-spacing:4px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.empty h3{
    color:#dbe9f2;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    right:22px;
    bottom:22px;
    z-index:100;
    padding:13px 17px;
    border-radius:9px;
    background:#0d304a;
    border:1px solid #278ac1;
    box-shadow:var(--shadow);
    font-size:13px;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   MOBILE
========================= */

.mobile-menu{
    display:none;
}

@media(max-width:1000px){

    .sidebar{
        width:76px;
        min-width:76px;
        padding:15px 9px;
    }

    .brand{
        justify-content:center;
        padding-bottom:16px;
    }

    .brand-text,
    .nav-text,
    .sidebar-footer{
        display:none;
    }

    .brand-mark{
        width:50px;
        height:50px;
    }

    .nav button{
        justify-content:center;
        padding:12px 5px;
    }

    .main{
        margin-left:76px;
        width:calc(100% - 76px);
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .station-grid{
        grid-template-columns:1fr;
    }

    .reference-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:720px){

    .topbar{
        height:64px;
        padding:0 12px;
    }

    .top-title{
        font-size:14px;
    }

    .content{
        padding:14px;
    }

    .hero{
        padding:20px;
    }

    .hero-title{
        font-size:23px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full-field{
        grid-column:auto;
    }

    .value-grid{
        grid-template-columns:1fr;
    }

    .hmi-fields{
        grid-template-columns:1fr;
    }

    .hmi-field{
        justify-content:space-between;
    }

    .hmi-field input{
        width:125px;
        min-height:43px;
        font-size:16px;
    }

    .nameplate-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        max-width:none;
    }

    .password-row{
        flex-direction:column;
    }

    .station-heading h1{
        font-size:23px;
    }
}

@media(max-width:430px){

    .stats{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .stat{
        padding:14px;
    }

    .stat-value{
        font-size:22px;
    }

    .card-body{
        padding:15px;
    }

    .card-header{
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="brand">
        <div class="brand-mark">M</div>

        <div class="brand-text">
            <div class="brand-title">MESKİ</div>
            <div class="brand-sub">TERFİ ARŞİVİM</div>
        </div>
    </div>

    <nav class="nav">

        <button class="active" onclick="goHome()">
            <span class="nav-icon">⌂</span>
            <span class="nav-text">Ana Sayfa</span>
        </button>

        <button onclick="showStations()">
            <span class="nav-icon">▣</span>
            <span class="nav-text">Terfiler</span>
        </button>

        <button onclick="showReferences()">
            <span class="nav-icon">⌘</span>
            <span class="nav-text">Teknik Referanslar</span>
        </button>

    </nav>

    <div class="sidebar-footer">
        MESKİ<br>
        Merkezî Saha Teknik Arşivi<br><br>
        Veriler cihaz üzerinde saklanır.
    </div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">

<header class="topbar">

    <div class="top-title" id="pageTitle">
        Ana Sayfa
    </div>

    <div class="top-right">

        <div class="mode" id="modeBadge">
            Ziyaretçi Modu
        </div>

        <button class="btn btn-primary"
                id="editBtn"
                onclick="openAccess()">
            Düzenleme
        </button>

    </div>

</header>


<div class="content" id="appContent"></div>

</main>

</div>


<div class="toast" id="toast"></div>


<script>

/* =========================================================
   MESKİ TERFİ ARŞİVİM
   Tek dosyalık sürüm
========================================================= */


/* =========================================================
   AYARLAR
========================================================= */

const EDIT_PASSWORD = "6872";

const STORAGE_KEY = "meski_terfi_arsiv_v1";


/* =========================================================
   UYGULAMA DURUMU
========================================================= */

let state = {

    editMode:false,

    page:"home",

    selectedStation:null,

    hmiPage:0,

/* =========================================================
   YARDIMCI
========================================================= */

function esc(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function toast(message){

    const t=document.getElementById("toast");

    t.textContent=message;

    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },2200);

}


function currentStation(){

    return state.stations.find(
        x=>x.id===state.selectedStation
    );

}


/* =========================================================
   INPUT TİPİ
========================================================= */

function inputType(type){

    if(type==="date") return "date";

    if(type==="time") return "time";

    if(type==="text") return "text";

    if(type==="textarea") return "textarea";

    return "number";

}


function inputMode(type){

    if(type==="integer")
        return "numeric";

    if(type==="decimal")
        return "decimal";

    return undefined;

}


/* =========================================================
   FORM INPUT
========================================================= */

function fieldHTML(
    label,
    key,
    type,
    object,
    prefix=""
){

    const value=object?.[key] ?? "";

    if(type==="textarea"){

        return `

        <div class="field full-field">

            <label>${esc(label)}</label>

            <textarea
                ${state.editMode ? "" : "disabled"}
                onchange="updateObject('${prefix}','${key}',this.value)"
            >${esc(value)}</textarea>

        </div>

        `;

    }

    let attr="";

    const htmlType=inputType(type);

    const mode=inputMode(type);

    if(mode)
        attr=`inputmode="${mode}"`;

    if(type==="decimal")
        attr+=` step="any"`;

    if(type==="integer")
        attr+=` step="1"`;

    return `

    <div class="field">

        <label>${esc(label)}</label>

        <input
            type="${htmlType}"
            ${attr}
            value="${esc(value)}"
            ${state.editMode ? "" : "disabled"}
            onchange="updateObject('${prefix}','${key}',this.value)"
        >

    </div>

    `;

}


/* =========================================================
   OBJE GÜNCELLE
========================================================= */

function updateObject(prefix,key,value){

    const s=currentStation();

    if(!s) return;

    if(prefix==="measurement"){

        if(!s.measurement)
            s.measurement={};

        s.measurement[key]=value;

    }

    else if(prefix==="motor"){

        if(!s.motor)
            s.motor={};

        s.motor[key]=value;

    }

    else if(prefix==="pump"){

        if(!s.pump)
            s.pump={};

        s.pump[key]=value;

    }

    else if(prefix==="station"){

        s[key]=value;

    }

    saveData();

}


/* =========================================================
   HMI GÜNCELLE
========================================================= */

function updateHMI(page,key,value){

    const s=currentStation();

    if(!s) return;

    if(!s.hmi)
        s.hmi=HMI_PAGES.map(()=>({}));

    if(!s.hmi[page])
        s.hmi[page]={};

    value=String(value).replace(",", ".");

    s.hmi[page][key]=value;

    saveData();

}

========================================================= */

function runningHTML(s){

    if(!s.measurement)
        s.measurement={};

    return `

    <div class="value-grid">

        ${RUNNING_FIELDS.map(
            ([label,key,type])=>{

                const val=s.measurement[key] ?? "";

                return `

                <div class="value">

                    <div class="value-label">
                        ${esc(label)}
                    </div>

                    ${
                        state.editMode
                        ?

                        `
                        <input
                            type="${
                                type==="date"
                                ?"date":
                                type==="time"
                                ?"time":
                                "text"
                            }"
                            inputmode="${
                                type==="decimal"
                                ?"decimal":
                                type==="text"
                                ?"text":
                                "numeric"
                            }"
                            step="${
                                type==="decimal"
                                ?"any":
                                "1"
                            }"
                            value="${esc(val)}"
                            onchange="updateObject('measurement','${key}',this.value)"
                            style="
                                width:100%;
                                margin-top:7px;
                                background:#071e31;
                                color:white;
                                border:1px solid #18547b;
                                border-radius:8px;
                                padding:10px;
                                font-size:15px;
                            "
                        >
                        `

                        :

                        `
                        <div class="value-number">

                            ${esc(val || "—")}

                        </div>
                        `
                    }

                </div>

                `;

            }
        ).join("")}

    </div>

    `;

}

function hmiHTML(s){

        s.hmi=HMI_PAGES.map(()=>({}));

    const page=HMI_PAGES[state.hmiPage];

    return `

    <div class="hmi-tabs">

        ${HMI_PAGES.map((p,i)=>`

            <button
                class="hmi-tab ${i===state.hmiPage?"active":""}"

    </div>

        <div class="hmi-title">

            ${esc(page.title)}

        </div>

            ${page.fields.map(
                ([label,key,type])=>{

                    const value=s.hmi[state.hmiPage]?.[key] ?? "";

                    return `

                    <div class="hmi-field">

                        <label>

                                    :
                                    "numeric"
                                }"
                                step="${
                                    type==="decimal"

                                    :

                                }"
                                value="${esc(value)}"
                                onchange="updateHMI(${state.hmiPage},'${key}',this.value)"
                            >
                            `
                            :
                            `
                            <input
                                type="text"
                                value="${esc(value)}"

                            >
                            `
                        }

            ).join("")}

        <div class="hmi-foot">

            <span>

function openAccess(){

    const root=document.getElementById("appContent");

    root.innerHTML=`

    <section class="card">

        <div class="lock-box">

            <div class="lock-icon">
                🔒
            </div>

            <h2>
                Düzenleme Yetkisi
            </h2>

            <p>
                Kayıt eklemek, değiştirmek veya silmek için
                düzenleme şifresini girin.
            </p>

            <div class="password-row">

                <input
                    id="passwordInput"
                    type="password"
                    inputmode="numeric"
                    maxlength="4"
                    placeholder="Şifre"
                    onkeydown="if(event.key==='Enter')checkPassword()"
                >

                <button
                    class="btn btn-primary"
                    onclick="checkPassword()"
                >
                    Düzenleme Moduna Gir
                </button>

            </div>

            <div style="margin-top:15px">

                <button
                    class="btn"
                    onclick="visitorContinue()"
                >
                    Ziyaretçi Olarak Devam Et
                </button>

            </div>

        </div>

    </section>

    `;

}


function checkPassword(){

    const value=document.getElementById("passwordInput").value;

    if(value===EDIT_PASSWORD){

        state.editMode=true;

        toast("Düzenleme modu açıldı.");

        render();

    }else{

        toast("Şifre hatalı.");

    }

}


function visitorContinue(){

    state.editMode=false;

    render();

    toast("Ziyaretçi modu aktif.");

}


function lockEditing(){

    state.editMode=false;

    render();

    toast("Düzenleme modu kapatıldı.");

}


/* =========================================================
   YENİ TERFİ
========================================================= */

function newStation(){

    if(!state.editMode){

        openAccess();

        return;

    }

    const s=createDefaultStation();

    const numbers=state.stations
        .map(x=>parseInt(String(x.code).replace(/\D/g,""))||0);

    const next=Math.max(0,...numbers)+1;

    s.code="T"+String(next).padStart(3,"0");

    s.name="Yeni Terfi";

    s.measurement={};

    state.stations.push(s);

    saveData();

    state.selectedStation=s.id;

    state.page="detail";

    render();

    toast("Yeni terfi oluşturuldu.");

}


/* =========================================================
   TERFİ SİL
========================================================= */

function deleteStation(){

    if(!state.editMode)
        return;

    const s=currentStation();

    if(!s)
        return;

    if(!confirm(
        `"${s.code} - ${s.name}" kaydı silinsin mi?`
    ))
        return;

    state.stations=state.stations.filter(
        x=>x.id!==s.id
    );

    saveData();

    showStations();

    toast("Terfi kaydı silindi.");

}
