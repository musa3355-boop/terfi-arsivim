function mergeDeep(src,base){if(!src||typeof src!=="object")return src??base;const o={...base};for(const k of Object.keys(base||{})){if(src[k]===undefined)continue;o[k]=src[k]&&typeof src[k]==="object"&&!Array.isArray(src[k])?mergeDeep(src[k],base[k]):src[k]}return o}

if(tab==="pompa")return formCard("💧 POMPA ETİKETİ",p.pump,"pump",[["Pompa Adı","ad"],["Marka","marka"],["Model","model"],["Tip","tip"],["Seri No","seri_no"],["Güç kW","guc_kw","number"],["Güç HP","guc_hp","number"],["Q Min","q_min","number"],["Q Max","q_max","number"],["H Min","h_min","number"],["H Max","h_max","number"],["Basma / Çıkış","cikis"]],"savePump");
if(tab==="motor")return formCard("⚙ MOTOR ETİKETİ",p.motor,"motor",[["Marka","marka"],["Model","model"],["Seri No","seri_no"],["Motor Tipi","motor_tipi"],["Güç kW","guc_kw","number"],["Güç HP","guc_hp","number"],["Gerilim V","gerilim_v","number"],["Nominal Akım A","nominal_akim_a","number"],["Frekans Hz","frekans_hz","number"],["Devir RPM","devir_rpm","number"],["Cos φ","cos_phi"],["Montaj Tarihi","montaj_tarihi"],["Değişim Tarihi","degisim_tarihi"]],"saveMotor");
if(tab==="surucu")return formCard("🔌 SÜRÜCÜ",p.driver,"driver",[["Marka","marka"],["Model","model"],["Seri No","seri_no"],["Sürücü Ailesi","surucu_ailesi"],["Güç kW","guc_kw","number"],["Besleme V","besleme_v","number"],["Firmware","firmware"],["Kontrol","kontrol"]],"saveDriver");
if(tab==="box")return boxTab(p);if(tab==="ssr")return ssrTab(p);if(tab==="hmi")return hmiTab(p);if(tab==="calisma")return workTab(p);if(tab==="param")return paramTab(p);if(tab==="ariza")return faultTab(p);if(tab==="photo")return photoTab(p);return historyTab(s,p)}
function savePump(){if(!needAdmin())return;const p=pump();document.querySelectorAll('[data-path^="pump."]').forEach(e=>setPath(p.pump,e.dataset.path.slice(5),e.value));p.ad=p.pump.ad||p.ad;save();render()}
function saveMotor(){if(!needAdmin())return;const p=pump();document.querySelectorAll('[data-path^="motor."]').forEach(e=>setPath(p.motor,e.dataset.path.slice(6),e.value));save();render()}
function saveDriver(){if(!needAdmin())return;const p=pump();document.querySelectorAll('[data-path^="driver."]').forEach(e=>setPath(p.driver,e.dataset.path.slice(7),e.value));save();render()}
function boxTab(p){const groups=[["motor","MOTOR → BOX"],["out","BOX → SÜRÜCÜ"],["driver","SÜRÜCÜ U/V/W"]];return'<div class="card"><div class="section-head"><div><h3>🔧 U / V / W KABLO HARİTASI</h3><div class="muted">Motor → Box, Box → Sürücü ve Sürücü tarafı ayrı tutulur.</div></div></div>'+groups.map(g=>'<div class="card"><h3>'+g[1]+'</h3><div class="grid3">'+["U","V","W"].map(ph=>'<div class="field"><label>'+ph+' Renk</label><input data-box="'+g[0]+'.'+ph+'.renk" value="'+esc(p.box[g[0]][ph].renk)+'" '+(admin?"":"readonly")+'></div><div class="field"><label>'+ph+' Etiket</label><input data-box="'+g[0]+'.'+ph+'.etiket" value="'+esc(p.box[g[0]][ph].etiket)+'" '+(admin?"":"readonly")+'></div><div class="field"><label>'+ph+' Detay</label><input data-box="'+g[0]+'.'+ph+'.detay" value="'+esc(p.box[g[0]][ph].detay)+'" '+(admin?"":"readonly")+'></div>').join("")+'</div></div>').join("")+(admin?'<button class="btn ok" onclick="saveBox()">BOX / KABLO KAYDET</button>':"")+'</div>'}
function saveBox(){if(!needAdmin())return;const p=pump();document.querySelectorAll("[data-box]").forEach(e=>setPath(p.box,e.dataset.box,e.value));save();render()}
function ssrTab(p){return'<div class="card"><div class="section-head"><h3>🟢 SSR / SEVİYE / BASINÇ KORUMA</h3>'+(admin?'<button class="btn ok" onclick="saveSSR()">KAYDET</button>':"")+'</div><div class="grid4" style="margin-top:9px">'+inp("Seviye","ssr.level",p.ssr.level)+inp("Alt Seviye","ssr.low",p.ssr.low)+inp("Üst Seviye","ssr.high",p.ssr.high)+inp("Pompa Giriş Basıncı","ssr.pump_in",p.ssr.pump_in)+inp("Alçak Koruma Girme","ssr.low_enter",p.ssr.low_enter)+inp("Yüksek Koruma Girme","ssr.high_enter",p.ssr.high_enter)+inp("Alçak Koruma Çıkma","ssr.low_exit",p.ssr.low_exit)+inp("Yüksek Koruma Çıkma","ssr.high_exit",p.ssr.high_exit)+'</div>'+txt("Not","ssr.note",p.ssr.note)+'</div>'}
function saveSSR(){if(!needAdmin())return;const p=pump();document.querySelectorAll('[data-path^="ssr."]').forEach(e=>setPath(p.ssr,e.dataset.path.slice(4),e.value));save();render()}
function hmiTab(p){const page=HMI[hmiPage-1],vals=p.hmi[hmiPage-1]||{},third=Math.ceil(page.labels.length/3),cols=[page.labels.slice(0,third),page.labels.slice(third,third*2),page.labels.slice(third*2)];return'<div class="card"><div class="section-head"><div><h3>🖥 WEINTEK HMI / PLC · P'+p.no+'</h3><div class="muted">Fotoğraflardaki HMI alanları eksiksiz tutulur. Her ekran seçili P'+p.no+' pompasına aittir.</div></div><span class="badge">EKRAN '+hmiPage+' / 5</span></div><div class="hmi-tabs">'+HMI.map((x,i)=>'<button class="'+(hmiPage===i+1?"active":"")+'" onclick="setHmiPage('+(i+1)+')">'+x.no+' · '+esc(x.title)+'</button>').join("")+'</div><div class="hmi-grid">'+cols.map((col,ci)=>{const start=ci===0?0:ci===1?third:third*2;return'<div class="hmi-col"><h4>'+["SOL","ORTA","SAĞ"][ci]+'</h4>'+col.map((lab,j)=>{const i=start+j;return'<div class="hmi-field"><label>'+esc(lab)+'</label><input data-hmi="'+i+'" value="'+esc(vals[i]??"")+'" '+(admin?"":"readonly")+'></div>'}).join("")+'</div>'}).join("")+'</div>'+(admin?'<div class="actions"><button class="btn ok" onclick="saveHMI()">HMI EKRANINI KAYDET</button></div>':"")+'</div>'}
function saveHMI(){if(!needAdmin())return;const p=pump(),v=p.hmi[hmiPage-1]||{};document.querySelectorAll("[data-hmi]").forEach(e=>v[e.dataset.hmi]=e.value);p.hmi[hmiPage-1]=v;save();render()}
function workTab(p){const w=p.work.current;const fields=[["Frekans [Hz]","frekans_hz"],["Akım [A]","akim_a"],["Devir [RPM]","devir_rpm"],["Güç [kW]","guc_kw"],["Gerilim [V]","gerilim_v"],["Sürücü Sıcaklık [°C]","surucu_sicaklik_c"],["Set Basıncı [bar]","set_basinci_bar"],["Çalışma Basıncı [bar]","calisma_basinci_bar"],["Tasarruf [kWh]","tasarruf_kwh"]];return'<div class="card"><div class="section-head"><div><h3>▶ ANLIK ÇALIŞMA EKRANI · P'+p.no+'</h3><div class="muted">Gerçek PLC bağlantısı değil; sahadan okunan anlık değerleri ve kayıtları tutar. Değerler bu pompa bloğuna özeldir.</div></div>'+(admin?'<button class="btn ok" onclick="saveWork()">KAYDA AL</button>':"")+'</div><div class="live-grid" style="margin-top:10px">'+fields.map(x=>'<div class="live-kpi"><small>'+x[0]+'</small><strong>'+esc(w[x[1]]||"—")+'</strong></div>').join("")+'</div><div class="grid3" style="margin-top:10px">'+fields.map(x=>inp(x[0],"work.current."+x[1],w[x[1]],"number")).join("")+'</div>'+inp("Çalışma Durumu","work.current.durum",w.durum)+txt("Teknik Not","work.current.notlar",w.notlar)+'</div><div class="card"><h3>ÇALIŞMA GEÇMİŞİ</h3>'+p.work.history.map(x=>'<div class="data" style="margin-top:7px"><div class="kv"><span>Tarih</span><span>'+esc(x.date)+'</span></div><div class="kv"><span>Hz / A / kW</span><span>'+esc(x.frekans_hz)+' / '+esc(x.akim_a)+' / '+esc(x.guc_kw)+'</span></div><div class="kv"><span>Basınç</span><span>'+esc(x.set_basinci_bar)+' / '+esc(x.calisma_basinci_bar)+'</span></div><div class="muted">'+esc(x.notlar||"")+'</div></div>').join("")||'<div class="empty">Henüz çalışma kaydı yok.</div>'+'</div>'}
function saveWork(){if(!needAdmin())return;const p=pump();document.querySelectorAll('[data-path^="work.current."]').forEach(e=>setPath(p.work.current,e.dataset.path.slice(13),e.value));p.work.history.unshift({...clone(p.work.current),date:now()});p.work.history=p.work.history.slice(0,100);save();render();toast("Anlık çalışma kaydı eklendi.")}
function paramTab(p){return'<div class="card"><div class="section-head"><div><h3>⚙ P'+p.no+' · TERFİYE ÖZEL PARAMETRELER</h3><div class="muted">Sadece seçili P'+p.no+' pompası.</div></div>'+(admin?'<button class="btn ok" onclick="addPumpParam()">+ PARAMETRE</button>':"")+'</div><div class="table-wrap"><table><tr><th>Kod</th><th>Ad</th><th>Değer</th><th>Birim</th><th>Açıklama</th>'+(admin?"<th>İşlem</th>":"")+'</tr>'+p.params.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.value)+'</td><td>'+esc(x.unit)+'</td><td>'+esc(x.note)+'</td>'+(admin?'<td><button class="btn" onclick="editPumpParam(\''+x.id+'\')">DÜZENLE</button></td>':"")+'</tr>').join("")||'<tr><td colspan="'+(admin?6:5)+'"><div class="empty">P'+p.no+' için özel parametre kaydı yok.</div></td></tr>'+'</table></div></div><div class="card"><div class="section-head"><h3>ABB PARAMETRE KÜTÜPHANESİ</h3><button class="btn" onclick="openLibrary(\'param\')">AÇ</button></div><div class="muted">Genel kütüphane yönetici modunda tamamen düzenlenebilir.</div></div>'}
function addPumpParam(){if(!needAdmin())return;const p=pump(),x={id:uid(),code:"",name:"",value:"",unit:"",note:""};p.params.push(x);save();editPumpParam(x.id)}
function editPumpParam(id){const p=pump(),x=p.params.find(y=>y.id===id);if(!x)return;openModal("POMPA PARAMETRESİ",'<div class="grid2">'+inp("Kod","x.code",x.code)+inp("Ad","x.name",x.name)+inp("Değer","x.value",x.value)+inp("Birim","x.unit",x.unit)+txt("Not","x.note",x.note)+'</div><div class="actions"><button class="btn ok" onclick="savePumpParam(\''+id+'\')">KAYDET</button></div>')}
function savePumpParam(id){if(!needAdmin())return;const p=pump(),x=p.params.find(y=>y.id===id);document.querySelectorAll('[data-path^="x."]').forEach(e=>setPath(x,e.dataset.path.slice(2),e.value));save();closeModal();render()}
function faultTab(p){return'<div class="card"><div class="section-head"><div><h3>⚠ P'+p.no+' · ARIZA KAYITLARI</h3><div class="muted">Seçili pompanın saha arıza geçmişi.</div></div>'+(admin?'<button class="btn bad" onclick="addFault()">+ ARIZA</button>':"")+'</div><div class="table-wrap"><table><tr><th>Tarih</th><th>Kod</th><th>Başlık</th><th>Tespit</th><th>Yapılan İşlem</th><th>Sonuç</th></tr>'+p.faults.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.cause)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.result)+'</td></tr>').join("")||'<tr><td colspan="6"><div class="empty">Arıza kaydı yok.</div></td></tr>'+'</table></div></div><div class="card"><h3>ABB ARIZA KÜTÜPHANESİ</h3><div class="library-grid" style="margin-top:8px">'+FAULTS.slice(0,9).map(x=>'<div class="library-item" onclick="openFaultDetail(\''+esc(x.code)+'\')"><div class="library-code">'+esc(x.code)+'</div><div class="library-name">'+esc(x.name)+'</div><div class="library-desc">'+esc(x.cause)+'</div></div>').join("")+'</div></div>'}
function addFault(){if(!needAdmin())return;const p=pump(),x={id:uid(),date:now(),code:"",name:"",cause:"",action:"",result:""};p.faults.push(x);save();editFault(x.id)}
function editFault(id){const p=pump(),x=p.faults.find(y=>y.id===id);openModal("ARIZA KAYDI",'<div class="grid2">'+inp("Kod","x.code",x.code)+inp("Başlık","x.name",x.name)+txt("Tespit","x.cause",x.cause)+txt("Yapılan İşlem","x.action",x.action)+txt("Sonuç","x.result",x.result)+'</div><div class="actions"><button class="btn ok" onclick="saveFault(\''+id+'\')">KAYDET</button></div>')}
function saveFault(id){if(!needAdmin())return;const p=pump(),x=p.faults.find(y=>y.id===id);document.querySelectorAll('[data-path^="x."]').forEach(e=>setPath(x,e.dataset.path.slice(2),e.value));save();closeModal();render()}
function openFaultDetail(code){const x=FAULTS.find(f=>f.code===code);if(x)openModal(x.code+" · "+x.name,'<div class="data"><b>Neden</b><div class="muted">'+esc(x.cause)+'</div><br><b>Kontrol / Çözüm</b><div class="muted">'+esc(x.solution)+'</div><br><b>Sürücü</b><div class="muted">'+esc(x.driver)+'</div></div>')}
function photoTab(p){return'<div class="card"><div class="section-head"><div><h3>📷 P'+p.no+' · FOTOĞRAF / DOKÜMAN</h3><div class="muted">Fotoğraf/doküman adı ve notu seçili pompa altında tutulur.</div></div>'+(admin?'<button class="btn ok" onclick="addPhoto()">+ EKLE</button>':"")+'</div>'+p.photos.map(x=>'<div class="data" style="margin-top:7px"><div class="kv"><span>'+esc(x.date)+'</span><span>'+esc(x.name)+'</span></div><div class="muted">'+esc(x.note||"")+'</div></div>').join("")||'<div class="empty">Fotoğraf/doküman kaydı yok.</div>'+'</div>'}
function addPhoto(){if(!needAdmin())return;const name=prompt("Fotoğraf / doküman adı");if(!name)return;pump().photos.push({id:uid(),name,date:now(),note:""});save();render()}
function historyTab(s,p){return'<div class="card"><h3>🕘 GEÇMİŞ · P'+p.no+'</h3>'+s.history.map(x=>'<div class="kv"><span>'+esc(x.date)+'</span><span>'+esc(x.action)+' · '+esc(x.detail)+'</span></div>').join("")||'<div class="empty">Geçmiş kaydı yok.</div>'+'</div>'}

function editStation(){if(!needAdmin())return;const s=station();openModal("TERFİ BİLGİLERİ",'<div class="grid2">'+inp("Terfi Adı","s.ad",s.ad)+inp("RTU / Terfi No","s.rtu",s.rtu)+inp("Bölge","s.bolge",s.bolge)+inp("Terfi Tipi","s.tip",s.tip)+inp("Adres","s.address",s.address)+inp("Kaynak / Emiş","s.source",s.source)+inp("Basma / Çıkış","s.outlet",s.outlet)+inp("Kuyu Derinliği [m]","s.depth",s.depth,"number")+inp("GPS","s.gps",s.gps)+'</div>'+txt("Açıklama","s.note",s.note)+'<div class="actions"><button class="btn ok" onclick="saveStation()">KAYDET</button></div>')}
function saveStation(){if(!needAdmin())return;const s=station();document.querySelectorAll('[data-path^="s."]').forEach(e=>setPath(s,e.dataset.path.slice(2),e.value));s.history.unshift({date:now(),action:"TERFİ DÜZENLENDİ",detail:s.ad});save();closeModal();render()}
function addPump(){if(!needAdmin())return;const s=station(),no=s.pumps.length+1;s.pumps.push(pumpTemplate(no,"P"+no));pumpId=s.pumps.at(-1).id;save();render()}
function deletePump(){if(!needAdmin())return;const s=station();if(s.pumps.length<=1){toast("En az 1 pompa kalmalı.");return}if(!confirm("Seçili pompa silinsin mi?"))return;s.pumps=s.pumps.filter(p=>p.id!==pumpId);pumpId=s.pumps[0].id;save();render()}
function newStation(){if(!needAdmin())return;openModal("YENİ TERFİ",'<div class="grid2">'+inp("Terfi Adı","n.ad","Yeni Terfi")+inp("RTU","n.rtu","RTU YOK")+'<div class="field"><label>Bölge</label><select id="n_bolge"><option>AKDENİZ</option><option>MEZİTLİ</option><option>TOROSLAR</option><option>YENİŞEHİR</option><option>MERKEZ</option></select></div><div class="field"><label>Tip</label><select id="n_tip"><option>TERFİ</option><option>KUYU</option><option>POMPA İSTASYONU</option></select></div>'+inp("Pompa Sayısı","n.count","2","number")+'</div><div class="actions"><button class="btn ok" onclick="createStation()">OLUŞTUR</button></div>')}
function createStation(){if(!needAdmin())return;const ad=document.querySelector('[data-path="n.ad"]').value||"Yeni Terfi",rtu=document.querySelector('[data-path="n.rtu"]').value||"RTU YOK",b=document.getElementById("n_bolge").value,t=document.getElementById("n_tip").value,c=Math.max(1,Math.min(50,parseInt(document.querySelector('[data-path="n.count"]').value||"2",10)||2));const s={id:uid(),ad,rtu,bolge:b,tip:t,address:"",source:"",outlet:"",depth:"",gps:"",note:"",history:[],pumps:Array.from({length:c},(_,i)=>pumpTemplate(i+1,"P"+(i+1)))};db.push(s);stationId=s.id;pumpId=s.pumps[0].id;save();closeModal();view="station";render()}

function openLibrary(mode){libraryMode=mode;openModal(mode==="fault"?"ARIZA KÜTÜPHANESİ":mode==="driver"?"SÜRÜCÜ SERİLERİ":"ACS580 / ACQ580 PARAMETRELERİ",libraryHTML(mode))}
function libraryHTML(mode){let arr=mode==="fault"?FAULTS:mode==="driver"?DRIVER_SERIES:PARAMS;return'<div class="filterbar"><input id="libSearch" placeholder="Ara..." oninput="filterLib()"></div><div id="libGrid" class="library-grid">'+arr.map((x,i)=>mode==="fault"?'<div class="library-item" data-lib="'+esc((x.code+" "+x.name+" "+x.cause+" "+x.solution).toLocaleLowerCase("tr-TR"))+'"><div class="library-code">'+esc(x.code)+'</div><div class="library-name">'+esc(x.name)+'</div><div class="library-desc">'+esc(x.cause)+'<br>'+esc(x.solution)+'<br><b>Sürücü:</b> '+esc(x.driver)+'</div>'+(admin?'<div class="library-actions"><button class="btn" onclick="editLibrary(\'fault\','+i+')">DÜZENLE</button><button class="btn bad" onclick="deleteLibrary(\'fault\','+i+')">SİL</button></div>':"")+'</div>':mode==="driver"?'<div class="library-item"><div class="library-name">'+esc(x.name)+'</div><div class="library-desc">'+esc(x.type)+' · '+esc(x.use)+'<br>'+esc(x.note)+'</div>'+(admin?'<div class="library-actions"><button class="btn" onclick="editLibrary(\'driver\','+i+')">DÜZENLE</button><button class="btn bad" onclick="deleteLibrary(\'driver\','+i+')">SİL</button></div>':"")+'</div>':'<div class="library-item" data-lib="'+esc((x.code+" "+x.name+" "+x.desc+" "+x.source).toLocaleLowerCase("tr-TR"))+'"><div class="library-code">'+esc(x.code)+'</div><div class="library-name">'+esc(x.name)+'</div><div class="library-desc">'+esc(x.desc)+'<br><b>Birim:</b> '+esc(x.unit)+' · <b>Kaynak:</b> '+esc(x.source)+'</div>'+(admin?'<div class="library-actions"><button class="btn" onclick="editLibrary(\'param\','+i+')">DÜZENLE</button><button class="btn bad" onclick="deleteLibrary(\'param\','+i+')">SİL</button></div>':"")+'</div>').join("")+'</div>'+(admin?'<div class="actions"><button class="btn ok" onclick="newLibraryItem(\''+mode+'\')">+ EKLE</button></div>':"")}
function filterLib(){const q=(document.getElementById("libSearch")?.value||"").toLocaleLowerCase("tr-TR");document.querySelectorAll("#libGrid [data-lib]").forEach(x=>x.style.display=!q||x.dataset.lib.includes(q)?"block":"none")}
function editLibrary(type,i){if(!needAdmin())return;const x=type==="param"?PARAMS[i]:type==="fault"?FAULTS[i]:DRIVER_SERIES[i];const body=type==="param"?'<div class="grid2">'+inp("Kod","x.code",x.code)+inp("Ad","x.name",x.name)+inp("Birim","x.unit",x.unit)+inp("Kaynak","x.source",x.source)+txt("Açıklama","x.desc",x.desc)+'</div>':type==="fault"?'<div class="grid2">'+inp("Kod","x.code",x.code)+inp("Başlık","x.name",x.name)+inp("Sürücü","x.driver",x.driver)+txt("Neden","x.cause",x.cause)+txt("Çözüm","x.solution",x.solution)+'</div>':'<div class="grid2">'+inp("Seri","x.name",x.name)+inp("Tip","x.type",x.type)+inp("Kullanım","x.use",x.use)+txt("Not","x.note",x.note)+'</div>';openModal("KÜTÜPHANE DÜZENLE",body+'<div class="actions"><button class="btn ok" onclick="saveLibrary(\''+type+'\','+i+')">KAYDET</button></div>')}
function saveLibrary(type,i){if(!needAdmin())return;const x=type==="param"?PARAMS[i]:type==="fault"?FAULTS[i]:DRIVER_SERIES[i];document.querySelectorAll('[data-path^="x."]').forEach(e=>setPath(x,e.dataset.path.slice(2),e.value));closeModal();openLibrary(type);toast("Kütüphane kaydedildi.")}
function deleteLibrary(type,i){if(!needAdmin())return;if(!confirm("Bu kayıt silinsin mi?"))return;(type==="param"?PARAMS:type==="fault"?FAULTS:DRIVER_SERIES).splice(i,1);openLibrary(type)}
function newLibraryItem(type){if(!needAdmin())return;const arr=type==="param"?PARAMS:type==="fault"?FAULTS:DRIVER_SERIES;arr.push(type==="param"?{code:"",name:"",unit:"",desc:"",source:"Kullanıcı"}:type==="fault"?{code:"",name:"",driver:"",cause:"",solution:""}:{name:"ABB Yeni Seri",type:"",use:"",note:""});editLibrary(type,arr.length-1)}
function openHyd(){openModal("HİDROLİK / SAHA REFERANSLARI",'<div class="filterbar"><input id="libSearch" placeholder="Hidrolik referans ara..." oninput="filterLib()"></div><div id="libGrid" class="library-grid">'+HYD.map((x,i)=>'<div class="library-item" data-lib="'+esc((x.name+" "+x.bolge+" "+x.source+" "+x.outlet+" "+x.note).toLocaleLowerCase("tr-TR"))+'"><div class="library-code">'+esc(x.bolge)+'</div><div class="library-name">'+esc(x.name)+'</div><div class="library-desc">Kaynak: '+esc(x.source||"—")+'<br>Çıkış: '+esc(x.outlet||"—")+'<br>'+esc(x.note)+'</div>'+(admin?'<div class="library-actions"><button class="btn" onclick="editHyd('+i+')">DÜZENLE</button><button class="btn bad" onclick="deleteHyd('+i+')">SİL</button></div>':"")+'</div>').join("")+'</div>'+(admin?'<div class="actions"><button class="btn ok" onclick="newHyd()">+ REFERANS EKLE</button></div>':""));}
function editHyd(i){if(!needAdmin())return;const x=HYD[i];openModal("HİDROLİK REFERANS",'<div class="grid2">'+inp("Ad","x.name",x.name)+inp("Bölge","x.bolge",x.bolge)+inp("Kaynak","x.source",x.source)+inp("Çıkış","x.outlet",x.outlet)+txt("Not","x.note",x.note)+'</div><div class="actions"><button class="btn ok" onclick="saveHyd('+i+')">KAYDET</button></div>')}
function saveHyd(i){if(!needAdmin())return;const x=HYD[i];document.querySelectorAll('[data-path^="x."]').forEach(e=>setPath(x,e.dataset.path.slice(2),e.value));closeModal();openHyd()}
function deleteHyd(i){if(!needAdmin())return;if(confirm("Silinsin mi?")){HYD.splice(i,1);openHyd()}}
function newHyd(){if(!needAdmin())return;HYD.push({name:"Yeni Hidrolik Referans",bolge:"",source:"",outlet:"",note:""});editHyd(HYD.length-1)}

function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="meski-terfi-arsiv-yedek.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function restore(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw Error("Geçersiz JSON");db=normalize(x);save();home();toast("Yedek geri yüklendi.")}catch(err){toast(err.message)}};r.readAsText(f);e.target.value=""}

function editStation(){if(!needAdmin())return;const s=station();openModal("TERFİ BİLGİLERİ",'<div class="grid2">'+inp("Terfi Adı","s.ad",s.ad)+inp("RTU / Terfi No","s.rtu",s.rtu)+inp("Bölge","s.bolge",s.bolge)+inp("Terfi Tipi","s.tip",s.tip)+inp("Adres","s.address",s.address)+inp("Kaynak / Emiş","s.source",s.source)+inp("Basma / Çıkış","s.outlet",s.outlet)+inp("Kuyu Derinliği [m]","s.depth",s.depth,"number")+inp("GPS","s.gps",s.gps)+'</div>'+txt("Açıklama","s.note",s.note)+'<div class="actions"><button class="btn ok" onclick="saveStation()">KAYDET</button></div>')}
function openModal(title,body){document.getElementById("modalRoot").innerHTML='<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>'+esc(title)+'</h2><button class="btn" onclick="closeModal()">✕</button></div>'+body+'</div></div>'}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}

function statRows(obj){return Object.entries(obj).map(([k,v])=>'<div class="pcell"><b>'+esc(k)+'</b><span>'+esc(v||"—")+'</span></div>').join("")}
function hmiPrint(p){return HMI.map((pg,i)=>'<div class="hmi-pbox"><h3>HMI '+pg.no+' · '+esc(pg.title)+'</h3><table>'+pg.labels.map((lab,j)=>'<tr><td>'+esc(lab)+'</td><td>'+esc((p.hmi[i]||{})[j]||"—")+'</td></tr>').join("")+'</table></div>').join("")}
function pumpPrint(s,p){const w=p.work.current||{};return'<div class="print-page"><div class="print-head"><div><h1>MESKİ TERFİ TEKNİK ARŞİVİ</h1><p>'+esc(s.ad)+' · '+esc(s.rtu==="YOK"?"RTU YOK":"RTU "+s.rtu)+' · P'+p.no+'</p></div><div>'+esc(now())+'<br>'+esc(s.bolge)+'</div></div><div class="pgrid">'+statRows({"Terfi":s.ad,"RTU":s.rtu,"Bölge":s.bolge,"Tip":s.tip,"Pompa":p.ad,"Adres":s.address,"Kaynak":s.source,"Basma":s.outlet,"Kuyu":s.depth?s.depth+" m":"—","GPS":s.gps})+'</div><div class="pcols"><div><div class="psec"><h2>POMPA / MOTOR</h2><div class="pmini">'+statRows({"Pompa marka":p.pump.marka,"Pompa model":p.pump.model,"Pompa tip":p.pump.tip,"Seri":p.pump.seri_no,"Q min":p.pump.q_min,"Q max":p.pump.q_max,"H min":p.pump.h_min,"H max":p.pump.h_max,"Motor marka":p.motor.marka,"Motor model":p.motor.model,"Motor seri":p.motor.seri_no,"Motor güç":p.motor.guc_kw+" kW","Motor gerilim":p.motor.gerilim_v+" V","Motor akım":p.motor.nominal_akim_a+" A","Motor frekans":p.motor.frekans_hz+" Hz","Motor devir":p.motor.devir_rpm+" rpm"})+'</div></div><div class="psec"><h2>SÜRÜCÜ / SSR / BOX</h2><div class="pmini">'+statRows({"Sürücü marka":p.driver.marka,"Sürücü model":p.driver.model,"Sürücü seri":p.driver.seri_no,"Sürücü aile":p.driver.surucu_ailesi,"SSR seviye":p.ssr.level,"SSR alt":p.ssr.low,"SSR üst":p.ssr.high,"Basınç giriş":p.ssr.pump_in,"Motor U":p.box.motor.U.renk+" / "+p.box.motor.U.etiket,"Motor V":p.box.motor.V.renk+" / "+p.box.motor.V.etiket,"Motor W":p.box.motor.W.renk+" / "+p.box.motor.W.etiket,"Sürücü U":p.box.driver.U.renk+" / "+p.box.driver.U.etiket,"Sürücü V":p.box.driver.V.renk+" / "+p.box.driver.V.etiket,"Sürücü W":p.box.driver.W.renk+" / "+p.box.driver.W.etiket})+'</div></div><div class="psec"><h2>ANLIK ÇALIŞMA</h2><div class="pmini">'+statRows({"Frekans":w.frekans_hz+" Hz","Akım":w.akim_a+" A","Devir":w.devir_rpm+" rpm","Güç":w.guc_kw+" kW","Gerilim":w.gerilim_v+" V","Sürücü sıcaklık":w.surucu_sicaklik_c+" °C","Set basıncı":w.set_basinci_bar+" bar","Çalışma basıncı":w.calisma_basinci_bar+" bar","Tasarruf":w.tasarruf_kwh+" kWh","Durum":w.durum})+'</div></div></div><div><div class="psec"><h2>HMI / PLC · TÜM 5 EKRAN</h2><div class="hmi-print">'+hmiPrint(p)+'</div></div><div class="psec"><h2>TERFİYE ÖZEL PARAMETRELER</h2><table class="ptable"><tr><th>Kod</th><th>Ad</th><th>Değer</th><th>Birim</th><th>Not</th></tr>'+p.params.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.value)+'</td><td>'+esc(x.unit)+'</td><td>'+esc(x.note)+'</td></tr>').join("")||'<tr><td colspan="5">Kayıt yok</td></tr>'+'</table></div><div class="psec"><h2>ARIZA KAYITLARI</h2><table class="ptable"><tr><th>Tarih</th><th>Kod</th><th>Başlık</th><th>Tespit</th><th>İşlem</th><th>Sonuç</th></tr>'+p.faults.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.cause)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.result)+'</td></tr>').join("")||'<tr><td colspan="6">Kayıt yok</td></tr>'+'</table></div></div></div><div class="print-foot">MESKİ TERFİ ARŞİVİM · '+esc(s.ad)+' · P'+p.no+' · Tek pompa = tek PDF sayfası</div></div>'}
function pdfSelected(){const s=station(),p=pump();if(!s||!p)return;document.getElementById("printRoot").innerHTML=pumpPrint(s,p);window.print()}
function pdfAll(){const s=station();if(!s)return;document.getElementById("printRoot").innerHTML=s.pumps.map(p=>pumpPrint(s,p)).join("");window.print()}

function render(){const root=document.getElementById("app");root.innerHTML='<div class="shell">'+sidebar()+'<main class="main">'+topbar()+(view==="home"?homeView():stationView())+'<div class="footer">MESKİ TERFİ ARŞİVİM · 42 TERFİ · 109 POMPA · TEK DOSYA</div></main></div>';document.querySelectorAll(".adminbar").forEach(x=>x.remove());if(admin){const a=document.createElement("div");a.className="adminbar";a.textContent="● YÖNETİCİ MODU AKTİF · KİLİT";a.onclick=adminLogin;document.body.appendChild(a)}}
db=load();render();
</script>
</body>
</html>
