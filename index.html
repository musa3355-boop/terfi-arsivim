<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>MESKİ | Terfi Arşivim</title>

<style>

:root{
    --bg:#e8f0f4;
    --bg-soft:#f2f6f8;
    --panel:#ffffff;
    --panel2:#f7fafc;
    --line:#cbdde8;
    --line2:#8ebbd4;

    --blue:#1688ed;
    --blue-dark:#0967b8;
    --blue-soft:#e9f4ff;

    --text:#162a38;
    --muted:#647b8b;
    --muted2:#8da0ad;

    --success:#159b69;
    --warning:#d99418;
    --danger:#d84e55;

    --shadow:0 12px 35px rgba(26,61,82,.10);

    --radius:15px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 80% 0%,
            rgba(22,136,237,.09),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #edf4f7,
            #e7f0f4 50%,
            #dde9ee
        );

    color:var(--text);
    min-height:100vh;
}

/* =====================================================
   APP
===================================================== */

.app{
    min-height:100vh;
    display:flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:210px;
    min-width:210px;

    background:
        rgba(248,252,254,.96);

    border-right:1px solid #c7dbe6;

    padding:18px 13px;

    position:fixed;
    left:0;
    top:0;
    bottom:0;

    z-index:50;

    overflow-y:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    padding:3px 5px 19px;

    border-bottom:1px solid #d4e3ea;
}

.brand-mark{
    width:48px;
    height:48px;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #178fee,
            #0869b8
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:23px;
    font-weight:900;

    box-shadow:
        0 7px 18px
        rgba(22,136,237,.20);
}

.brand-title{
    font-size:18px;
    font-weight:850;
}

.brand-sub{
    font-size:9px;
    color:var(--blue);
    letter-spacing:.7px;
    margin-top:2px;
    font-weight:700;
}

.nav{
    margin-top:16px;
}

.nav button{
    width:100%;

    display:flex;
    align-items:center;
    gap:10px;

    padding:11px 11px;

    margin-bottom:5px;

    border:1px solid transparent;
    border-radius:10px;

    background:transparent;

    color:#526b7b;

    cursor:pointer;

    text-align:left;

    font-size:13px;

    transition:.18s;
}

.nav button:hover{
    background:#eef7fc;
    border-color:#d1e4ef;
}

.nav button.active{
    background:
        linear-gradient(
            90deg,
            #1585e2,
            #0870c5
        );

    border-color:#2a98ed;

    color:white;

    box-shadow:
        0 7px 18px
        rgba(0,115,210,.15);
}

.nav-icon{
    width:22px;
    text-align:center;
    font-size:17px;
}

.sidebar-footer{
    margin-top:28px;

    padding-top:14px;

    border-top:1px solid #d4e3ea;

    color:#8a9ca8;

    font-size:10px;

    line-height:1.7;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    margin-left:210px;

    width:calc(100% - 210px);

    min-height:100vh;
}

.topbar{
    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 24px;

    border-bottom:1px solid #cadde7;

    background:
        rgba(248,252,254,.90);

    backdrop-filter:blur(12px);

    position:sticky;

    top:0;

    z-index:30;
}

.top-title{
    font-size:16px;
    font-weight:800;
}

.top-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.mode{
    border:1px solid #cbdde8;

    padding:8px 11px;

    border-radius:9px;

    font-size:11px;

    color:#738895;

    background:white;
}

.mode.edit{
    color:#0b6bb8;

    border-color:#9bc9e8;

    background:#edf7ff;
}

.content{
    padding:22px;

    max-width:1500px;

    margin:auto;
}

/* =====================================================
   CARD
===================================================== */

.card{
    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f8fbfc
        );

    border:1px solid #c9dce6;

    border-radius:var(--radius);

    box-shadow:var(--shadow);
}

.card-header{
    padding:18px 20px;

    border-bottom:1px solid #dbe7ed;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}

.card-title{
    font-size:17px;
    font-weight:800;
}

.card-subtitle{
    color:var(--muted);

    font-size:11px;

    margin-top:4px;
}

.card-body{
    padding:20px;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    padding:26px;

    margin-bottom:17px;

    position:relative;

    overflow:hidden;
}

.hero:after{
    content:"MESKİ";

    position:absolute;

    right:-25px;
    bottom:-40px;

    font-size:115px;

    font-weight:900;

    color:rgba(21,111,164,.035);

    pointer-events:none;
}

.hero-title{
    font-size:28px;
    font-weight:900;
}

.hero-sub{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
}

.hero-note{
    margin-top:18px;

    max-width:850px;

    color:#627987;

    line-height:1.65;

    font-size:12px;
}

/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:12px;

    margin-bottom:17px;
}

.stat{
    padding:17px;

    background:white;

    border:1px solid #cbdde7;

    border-radius:13px;
}

.stat-label{
    font-size:11px;
    color:var(--muted);
}

.stat-value{
    font-size:25px;

    font-weight:900;

    margin-top:7px;
}

.stat-unit{
    color:var(--muted2);

    font-size:10px;

    margin-top:2px;
}

/* =====================================================
   BUTTONS
===================================================== */

button{
    font-family:inherit;
}

.btn{
    border:1px solid #b8d1df;

    background:#f5f9fb;

    color:#365262;

    border-radius:9px;

    padding:9px 13px;

    cursor:pointer;

    font-size:12px;

    font-weight:700;

    transition:.18s;
}

.btn:hover{
    transform:translateY(-1px);

    border-color:#81b5d2;
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            #178ff0,
            #0874cb
        );

    border-color:#2097ef;

    color:white;
}

.btn-success{
    background:
        linear-gradient(
            135deg,
            #16a36e,
            #128158
        );

    border-color:#1db47c;

    color:white;
}

.btn-danger{
    background:#fff4f4;

    border-color:#efb0b4;

    color:#c84c52;
}

.btn-small{
    padding:7px 10px;
    font-size:10px;
}

/* =====================================================
   SEARCH
===================================================== */

.toolbar{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:13px;
}

.search{
    flex:1;

    max-width:480px;

    position:relative;
}

.search input{
    width:100%;

    padding:11px 13px 11px 35px;

    background:white;

    color:#1c3443;

    border:1px solid #bfd5e1;

    border-radius:9px;

    outline:none;
}

.search span{
    position:absolute;

    left:12px;

    top:9px;

    color:#7d9bab;
}

/* =====================================================
   STATION
===================================================== */

.station-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;
}

.station-card{
    padding:18px;

    border:1px solid #cbdde7;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f6fafc
        );

    border-radius:12px;

    cursor:pointer;

    transition:.18s;
}

.station-card:hover{
    border-color:#80b9d8;

    transform:translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(27,91,126,.08);
}

.station-top{
    display:flex;

    justify-content:space-between;

    gap:10px;
}

.station-code{
    color:#137bc9;

    font-size:11px;

    font-weight:900;
}

.station-name{
    font-size:17px;

    font-weight:800;

    margin-top:5px;
}

.station-meta{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-top:15px;
}

.meta-box{
    background:#f2f7fa;

    border:1px solid #d4e3ea;

    padding:8px;

    border-radius:8px;
}

.meta-label{
    font-size:8px;

    color:#8296a2;

    font-weight:700;
}

.meta-value{
    font-size:13px;

    font-weight:800;

    margin-top:3px;
}

/* =====================================================
   BADGE
===================================================== */

.badge{
    display:inline-flex;

    align-items:center;

    padding:4px 7px;

    border-radius:6px;

    font-size:9px;

    background:#edf9f4;

    color:#159364;

    border:1px solid #bde5d3;

    height:max-content;
}

/* =====================================================
   DETAIL
===================================================== */

.back-row{
    display:flex;

    align-items:center;

    gap:8px;

    margin-bottom:13px;
}

.station-heading{
    margin-bottom:13px;
}

.station-heading h1{
    margin:0;

    font-size:25px;

    font-weight:900;
}

.station-heading p{
    margin:5px 0 0;

    color:var(--muted);

    font-size:12px;
}

.detail-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;
}

.full{
    grid-column:1/-1;
}

/* =====================================================
   SECTION NAVIGATION
===================================================== */

.section-nav{
    position:sticky;

    top:70px;

    z-index:20;

    display:flex;

    gap:7px;

    overflow-x:auto;

    padding:9px;

    margin-bottom:14px;

    background:
        rgba(244,249,252,.95);

    border:1px solid #cbdde7;

    border-radius:12px;

    box-shadow:
        0 6px 20px
        rgba(31,79,104,.07);

    backdrop-filter:blur(10px);
}

.section-nav button{
    flex:0 0 auto;

    border:1px solid #c8dce7;

    background:white;

    color:#587080;

    border-radius:8px;

    padding:8px 12px;

    cursor:pointer;

    font-size:11px;

    font-weight:700;
}

.section-nav button:hover{
    border-color:#8abbd7;
}

.section-nav button.active{
    color:white;

    border-color:#1688ed;

    background:#1688ed;
}

/* =====================================================
   FORM
===================================================== */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;
}

.field{
    display:flex;

    flex-direction:column;

    gap:6px;
}

.field.full-field{
    grid-column:1/-1;
}

.field label{
    color:#627988;

    font-size:11px;

    font-weight:750;
}

.field input,
.field textarea,
.field select{
    width:100%;

    background:#f7fafc;

    border:1px solid #bfd5e1;

    color:#1a3444;

    border-radius:8px;

    padding:10px 11px;

    outline:none;

    font-family:inherit;

    font-size:13px;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#2999e8;

    box-shadow:
        0 0 0 3px
        rgba(22,136,237,.08);
}

.field textarea{
    min-height:95px;

    resize:vertical;
}

/* =====================================================
   TECH VALUES
===================================================== */

.value-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:11px;
}

.value{
    border:1px solid #cfdee6;

    background:#f8fbfc;

    border-radius:9px;

    padding:13px;
}

.value-label{
    color:#708795;

    font-size:10px;

    font-weight:700;
}

.value-number{
    font-size:17px;

    font-weight:850;

    margin-top:6px;

    color:#183849;
}

/* =====================================================
   SSR
===================================================== */

.ssr-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.ssr-box{
    border:1px solid #cbdde7;

    background:
        linear-gradient(
            145deg,
            #f8fbfd,
            #eef7fb
        );

    border-radius:11px;

    padding:15px;
}

.ssr-label{
    color:#6b8190;

    font-size:10px;

    font-weight:750;
}

.ssr-value{
    margin-top:8px;

    color:#176fb1;

    font-size:22px;

    font-weight:900;
}

.ssr-unit{
    color:#91a4af;

    font-size:10px;

    margin-left:2px;
}

/* =====================================================
   NAMEPLATE
===================================================== */

.nameplate{
    background:
        linear-gradient(
            145deg,
            #edf1f3,
            #cdd6db
        );

    color:#20292e;

    border:5px solid #7d898f;

    border-radius:8px;

    padding:17px;

    box-shadow:
        inset 0 0 0 1px white,
        0 10px 25px rgba(0,0,0,.10);
}

.nameplate-header{
    text-align:center;

    border-bottom:2px solid #4a555b;

    padding-bottom:11px;

    margin-bottom:13px;
}

.nameplate-brand{
    font-size:21px;

    font-weight:950;

    letter-spacing:.7px;
}

.nameplate-type{
    font-size:11px;

    font-weight:850;

    margin-top:3px;
}

.nameplate-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    border-top:1px solid #667177;

    border-left:1px solid #667177;
}

.np-field{
    padding:8px;

    border-right:1px solid #667177;

    border-bottom:1px solid #667177;
}

.np-label{
    font-size:8px;

    color:#59656b;

    font-weight:750;
}

.np-value{
    font-size:12px;

    font-weight:850;

    margin-top:3px;
}

/* =====================================================
   CABLE
===================================================== */

.cable-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.cable-card{
    border:1px solid #cbdde7;

    background:#f7fafc;

    border-radius:11px;

    padding:14px;
}

.cable-title{
    font-size:13px;

    font-weight:850;

    margin-bottom:9px;
}

.cable-preview{
    height:28px;

    border-radius:6px;

    border:1px solid rgba(0,0,0,.12);

    margin-bottom:10px;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.4);
}

.cable-card select{
    width:100%;

    padding:9px;

    border-radius:8px;

    border:1px solid #bdd3df;

    background:white;

    color:#263f4d;

    font-family:inherit;
}

/* =====================================================
   BACKUP MOTOR
===================================================== */

.backup-box{
    border:1px dashed #a9c7d8;

    background:#f4f9fc;

    border-radius:11px;

    padding:16px;
}

.backup-head{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:13px;
}

.backup-title{
    font-size:15px;

    font-weight:850;
}

.backup-sub{
    color:#718895;

    font-size:10px;

    margin-top:3px;
}

/* =====================================================
   HMI
===================================================== */

.hmi-tabs{
    display:flex;

    gap:7px;

    overflow-x:auto;

    padding-bottom:3px;
}

.hmi-tab{
    flex:0 0 auto;

    padding:10px 14px;

    border:1px solid #c3d8e4;

    border-radius:8px;

    background:#f6fafc;

    color:#637b89;

    cursor:pointer;

    font-size:11px;

    font-weight:700;
}

.hmi-tab.active{
    background:#1688ed;

    color:white;

    border-color:#1688ed;
}

.hmi-screen{
    margin-top:14px;

    border:2px solid #4d5a62;

    background:#0b1116;

    border-radius:11px;

    padding:18px;

    overflow:hidden;
}

.hmi-title{
    text-align:center;

    font-size:17px;

    font-weight:850;

    color:#e6edf2;

    padding-bottom:12px;

    border-bottom:1px solid #333e45;

    margin-bottom:15px;
}

.hmi-fields{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:11px;
}

.hmi-field{
    display:flex;

    align-items:center;

    gap:7px;
}

.hmi-field label{
    flex:1;

    font-size:10px;

    color:#e1e8ed;
}

.hmi-field input{
    width:105px;

    padding:8px;

    border-radius:4px;

    border:1px solid #65737d;

    background:#eef3f6;

    color:#18252d;

    font-size:13px;

    font-weight:650;
}

.hmi-foot{
    display:flex;

    justify-content:space-between;

    margin-top:15px;

    padding-top:11px;

    border-top:1px solid #333e45;

    color:#aab8c0;

    font-size:9px;
}

/* =====================================================
   TECH REFERENCE
===================================================== */

.reference-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:13px;
}

.reference{
    background:white;

    border:1px solid #cadde7;

    border-radius:11px;

    padding:15px;
}

.reference h3{
    font-size:13px;

    margin:0 0 7px;
}

.reference p{
    font-size:10px;

    line-height:1.6;

    color:#708591;

    margin:0;
}

.ref-value{
    color:#1479c5;

    font-size:18px;

    font-weight:900;

    margin:7px 0;
}

/* =====================================================
   SETTINGS
===================================================== */

.settings-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;
}

.setting-card{
    border:1px solid #cbdde7;

    border-radius:11px;

    padding:16px;

    background:#f8fbfc;
}

.setting-card h3{
    margin:0 0 6px;

    font-size:14px;
}

.setting-card p{
    color:#708591;

    font-size:10px;

    margin:0 0 12px;
}

.setting-row{
    display:flex;

    gap:7px;

    flex-wrap:wrap;
}

.setting-option{
    border:1px solid #c5d8e3;

    background:white;

    color:#617986;

    padding:9px 12px;

    border-radius:8px;

    cursor:pointer;

    font-size:11px;

    font-weight:700;
}

.setting-option.active{
    background:#1688ed;

    border-color:#1688ed;

    color:white;
}

/* =====================================================
   EMPTY
===================================================== */

.empty{
    text-align:center;

    padding:45px 20px;

    color:#78909e;
}

.empty h3{
    color:#395363;
}

/* =====================================================
   LOCK
===================================================== */

.lock-box{
    text-align:center;

    padding:35px 20px;
}

.lock-icon{
    width:62px;

    height:62px;

    margin:0 auto 14px;

    border:2px solid #218ddd;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:25px;

    color:#218ddd;

    background:#edf7ff;
}

.lock-box h2{
    margin:0 0 6px;
}

.lock-box p{
    color:#718795;

    font-size:12px;

    margin-bottom:18px;
}

.password-row{
    max-width:400px;

    margin:auto;

    display:flex;

    gap:8px;
}

.password-row input{
    flex:1;

    background:white;

    border:1px solid #bdd3df;

    color:#263e4d;

    border-radius:9px;

    padding:11px;

    font-size:15px;

    text-align:center;

    letter-spacing:4px;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
    position:fixed;

    right:20px;

    bottom:20px;

    z-index:100;

    padding:12px 15px;

    border-radius:9px;

    background:#183a4f;

    border:1px solid #3b86ad;

    color:white;

    box-shadow:var(--shadow);

    font-size:12px;

    opacity:0;

    transform:translateY(10px);

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:translateY(0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:1050px){

    .sidebar{
        width:74px;

        min-width:74px;

        padding:14px 8px;
    }

    .brand{
        justify-content:center;
    }

    .brand-text,
    .nav-text,
    .sidebar-footer{
        display:none;
    }

    .nav button{
        justify-content:center;

        padding:11px 5px;
    }

    .main{
        margin-left:74px;

        width:calc(100% - 74px);

    if(!s.measurement)

    if(!s.cable){

        };

/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================================================
   TOAST
========================================================= */

function toast(message){

    const t =
        document.getElementById("toast");

    t.textContent=message;

    t.classList.add("show");

    setTimeout(()=>{

        t.classList.remove("show");

    },2200);

}

========================================================= */

function currentStation(){

    return state.stations.find(

        x =>
        x.id === state.selectedStation

    );

}


/* =========================================================
   INPUT TYPE
========================================================= */

function inputMode(type){

    if(type==="integer")
        return "numeric";

    if(type==="decimal")
        return "decimal";

    return null;

}


/* =========================================================
   FIELD
========================================================= */

function fieldHTML(
    label,
    key,
    type,
    object,
    prefix
){

    const value =
        object?.[key] ?? "";


    if(type==="textarea"){

        return `

        <div class="field full-field">

            <label>
                ${esc(label)}
            </label>

            <textarea
                ${state.editMode ? "" : "disabled"}
                onchange="
                    updateObject(
                        '${prefix}',
                        '${key}',
                        this.value
                    )
                "
            >${esc(value)}</textarea>

        </div>

        `;

    }


    let mode="";

    if(type==="integer")
        mode='inputmode="numeric"';

    if(type==="decimal")
        mode='inputmode="decimal"';


    let inputType =
        type==="date"
        ? "date"
        :
        type==="time"
        ? "time"
        :
        type==="text"
        ? "text"
        :
        "number";


    let step="";

    if(type==="decimal")
        step='step="any"';

    if(type==="integer")
        step='step="1"';


    return `

    <div class="field">

        <label>
            ${esc(label)}
        </label>

        <input
            type="${inputType}"
            ${mode}
            ${step}
            value="${esc(value)}"
            ${state.editMode ? "" : "disabled"}

            onchange="
                updateObject(
                    '${prefix}',
                    '${key}',
                    this.value
                )
            "
        >

    </div>

    `;

}


/* =========================================================
   UPDATE OBJECT
========================================================= */

function updateObject(
    prefix,
    key,
    value
){

    const s=currentStation();

    if(!s) return;


    if(prefix==="measurement"){

        s.measurement[key]=value;

    }

    else if(prefix==="motor"){

        s.motor[key]=value;

    }

    else if(prefix==="pump"){

        s.pump[key]=value;

    }

    else if(prefix==="station"){

        s[key]=value;

    }

    else if(prefix==="ssr"){

        s.ssr[key]=value;

    }

    else if(prefix==="cable"){

        s.cable[key]=value;

    }

    else if(prefix==="backup"){

        if(!s.backupMotor)
            s.backupMotor={};

        s.backupMotor[key]=value;

    }


    saveData();

    updateHeaderOnly();

}


/* =========================================================
   HMI
========================================================= */

function updateHMI(
    page,
    key,
    value
){

    const s=currentStation();

    if(!s) return;

    if(!s.hmi)
        s.hmi=HMI_PAGES.map(()=>({}));

    if(!s.hmi[page])
        s.hmi[page]={};

    s.hmi[page][key]=String(value)
        .replace(",", ".");

    saveData();

}


/* =========================================================
   UPDATE HEADER
========================================================= */

function updateHeaderOnly(){

    const s=currentStation();

    if(!s) return;

    const heading =
        document.querySelector(
            ".station-heading h1"
        );

    if(heading){

        heading.innerHTML =
            `${esc(s.code)} · ${esc(s.name)}`;

    }

}

========================================================= */

function render(){

    updateMode();

    const root =
        document.getElementById("appContent");


    if(state.page==="home")
        root.innerHTML=homeHTML();


    if(state.page==="stations")
        root.innerHTML=stationsHTML();


    if(state.page==="detail")
        root.innerHTML=detailHTML();


    if(state.page==="references")
        root.innerHTML=referencesHTML();


    if(state.page==="settings")
        root.innerHTML=settingsHTML();

}


/* =========================================================
   MODE
========================================================= */

function updateMode(){

    const badge =
        document.getElementById("modeBadge");

    const button =
        document.getElementById("editBtn");


    if(state.editMode){

        badge.textContent =
            "Düzenleme Modu";

        badge.classList.add("edit");

        button.textContent =
            "🔒 Kilitle";

        button.onclick =
            lockEditing;

    }else{

        badge.textContent =
            "Ziyaretçi Modu";

        badge.classList.remove("edit");

        button.textContent =
            "Düzenleme";

        button.onclick =
            openAccess;

    }

}

    </button>

function selectSection(id){

    state.activeSection=id;

    render();

    setTimeout(()=>{

        const el =
            document.getElementById(
                "section-"+id
            );

        if(el){

            const offset=135;

            const y =
                el.getBoundingClientRect()
                    .top
                +
                window.scrollY
                -
                offset;

            window.scrollTo({

                top:y,

                behavior:"smooth"

            });

        }

    },40);

}

function addBackupMotor(){

    if(!state.editMode)
        return;

    const s=currentStation();

    if(!s) return;

    s.backupMotor={

        sameLabel:true,

        label:
            s.motor.brand ||
            "Ana motor ile aynı",

        cable:{

            l1:"",
            l2:"",
            l3:""

        },

        labelPrepared:false

    };

    saveData();

    render();

    toast(
        "Yedek motor eklendi."
    );

}


function removeBackupMotor(){

    if(!state.editMode)
        return;

    const s=currentStation();

    if(!s) return;

    if(
        !confirm(
            "Yedek motor kaydı kaldırılsın mı?"
        )
    )
        return;

    s.backupMotor=null;

    saveData();

    render();

}


function updateBackupCable(
    key,
    value
){

    const s=currentStation();

    if(!s || !s.backupMotor)
        return;

    if(!s.backupMotor.cable)
        s.backupMotor.cable={};

    s.backupMotor.cable[key]=value;

    saveData();

    render();

}


function setBackupSameLabel(value){

    const s=currentStation();

    if(!s || !s.backupMotor)
        return;

    s.backupMotor.sameLabel =
        value==="yes";

    if(
        s.backupMotor.sameLabel
    ){

        s.backupMotor.label =
            s.motor.brand ||
            "Ana motor ile aynı";

    }

    saveData();

    render();

}


function prepareBackupLabel(){

    const s=currentStation();

    if(!s || !s.backupMotor)
        return;

    s.backupMotor.labelPrepared=true;

    saveData();

    render();

    toast(
        "Yedek motor etiketi hazırlandı."
    );

}

/* =========================================================
   NEW STATION
========================================================= */

function newStation(){

    if(!state.editMode){

        openAccess();

        return;

    }


    const s =
        createDefaultStation();


    const numbers =
        state.stations.map(
            x =>
            parseInt(
                String(x.code)
                    .replace(/\D/g,"")
            ) || 0
        );


    const next =
        Math.max(0,...numbers)+1;


    s.code =
        "T" +
        String(next)
            .padStart(3,"0");


    s.name="Yeni Terfi";


    state.stations.push(s);

    saveData();


    state.selectedStation=s.id;

    state.page="detail";

    document
        .getElementById("pageTitle")
        .textContent="Terfi Teknik Arşivi";


    render();


    toast(
        "Yeni terfi oluşturuldu."
    );

}

/* =========================================================
   DOWNLOAD JSON
========================================================= */

function downloadJSON(
    data,
    filename
){

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


/* =========================================================
   IMPORT
========================================================= */

function importData(event){

    const file =
        event.target.files[0];

    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload=function(){

        try{

            const data =
                JSON.parse(
                    reader.result
                );


            let imported=[];


            if(
                Array.isArray(
                    data.stations
                )
            ){

                imported=data.stations;

            }

            else if(
                data.station
            ){

                imported=[
                    data.station
                ];

            }

            else{

                throw new Error(
                    "Geçersiz dosya"
                );

            }


            imported.forEach(
                normalizeStation
            );


            if(
                !confirm(
                    `${imported.length} kayıt içe aktarılacak. Mevcut kayıtların üzerine eklenmesini onaylıyor musunuz?`
                )
            )
                return;


            imported.forEach(s=>{

                const existing =
                    state.stations.find(
                        x =>
                        x.code===s.code
                    );


                if(existing){

                    Object.assign(
                        existing,
                        s
                    );

                    normalizeStation(
                        existing
                    );

                }else{

                    state.stations.push(s);

                }

            });


            saveData();

            render();

            toast(
                "Arşiv başarıyla içe aktarıldı."
            );


        }catch(e){

            alert(
                "Dosya okunamadı veya geçersiz JSON dosyası."
            );

        }

    };


    reader.readAsText(file);

    event.target.value="";

}


/* =========================================================
   PRINT / PDF
========================================================= */

function printStationPDF(){

    const s=currentStation();

    if(!s)
        return;


    normalizeStation(s);


    const html =
        buildPDFHTML(s);


    const win =
        window.open(
            "",
            "_blank"
        );


    if(!win){

        alert(
            "PDF ekranı açılamadı. Tarayıcı açılır penceresine izin verin."
        );

        return;

    }


    win.document.open();

    win.document.write(html);

    win.document.close();


    setTimeout(()=>{

        win.focus();

        win.print();

    },700);

}
