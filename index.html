let db=loadDB();
let state={page:"home",stationId:null,pumpIndex:0,tab:"GENEL",region:"TÜMÜ",search:"",admin:false};

function loadDB(){
 try{
  const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(x && Array.isArray(x.stations)) return x;
 }catch(e){}
 return {stations:JSON.parse(JSON.stringify(seedStations)),records:{}};
}
function saveDB(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function station(){return db.stations.find(x=>x.id===state.stationId)||null}
function key(){return state.stationId+"::"+state.pumpIndex}
function rec(){const k=key();if(!db.records[k])db.records[k]={pump:{},motor:{},driver:{},box:{},ssr:{},hmi:{},params:[],work:[],faults:[],photos:[]};return db.records[k]}
function pumpName(s,i){return (s?.pompalar||[])[i]||("P"+(i+1))}
function requireAdmin(){if(!state.admin){openLogin(true);return false}return true}

function render(){
 try{
  const root=document.getElementById("root");
  if(!root) return;
  if(!state.stationId){renderHome(root);return}
  const s=station();
  if(!s){state.stationId=null;renderHome(root);return}
  renderStation(root,s);
 }catch(e){
  console.error(e);
  document.getElementById("root").innerHTML=`<div class="login"><div class="login-card"><div class="login-logo">⚠️</div><h1>EKRAN HATASI</h1><p>${esc(e.message||e)}</p><button class="btn primary" onclick="location.reload()">TEKRAR DENE</button></div></div>`;
 }
}

function tabContent(s,r){
 if(state.tab==="GENEL")return overview(s,r);
 if(state.tab==="POMPA")return formPump(s,r);
 if(state.tab==="MOTOR")return formMotor(s,r);
 if(state.tab==="SÜRÜCÜ")return formDriver(s,r);
 if(state.tab==="BOX / KABLO")return formBox(s,r);
 if(state.tab==="SSR / SEVİYE")return formSSR(s,r);
 if(state.tab==="HMI / PLC")return hmi(s,r);

function saveForm(type){

 const o=rec()[type]||{};
 document.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value);

}
function saveHmi(n){
 if(!requireAdmin())return;
 const o={};document.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value);
 rec().hmi[String(n)]=o;saveDB();alert("HMI ekranı kaydedildi.");render();

function openLogin(adminOnly=false){
 const root=document.getElementById("root");
 root.insertAdjacentHTML("beforeend",`<div class="modal" id="loginModal"><div class="modal-card" style="max-width:420px"><div class="modal-head"><h2>${adminOnly?"YÖNETİCİ GİRİŞİ":"UYGULAMA GİRİŞİ"}</h2><button class="modal-close" onclick="document.getElementById('loginModal').remove()">×</button></div><div class="field"><label>${adminOnly?"Yönetici şifresi":"Şifre"}</label><input id="loginPass" type="password" inputmode="numeric" autocomplete="off"></div><div id="loginErr" class="error"></div><div class="modal-actions"><button class="btn primary" onclick="login(${adminOnly})">GİRİŞ</button></div></div></div>`);
 document.getElementById("loginPass").focus();
}
function login(adminOnly){
 const v=document.getElementById("loginPass").value;
 if((adminOnly&&v===ADMIN_PASSWORD)||(!adminOnly&&(v===ADMIN_PASSWORD||v===SITE_PASSWORD))){
  state.admin=adminOnly||v===ADMIN_PASSWORD;document.getElementById("loginModal").remove();render();return;
 }
 document.getElementById("loginErr").textContent="Şifre hatalı.";
}
function openStationForm(editId=null){
 if(!requireAdmin())return;
 const s=editId?db.stations.find(x=>x.id===editId):null;
 document.getElementById("root").insertAdjacentHTML("beforeend",`<div class="modal" id="stationModal"><div class="modal-card"><div class="modal-head"><h2>${s?"TERFİ DÜZENLE":"YENİ TERFİ"}</h2><button class="modal-close" onclick="document.getElementById('stationModal').remove()">×</button></div>
 <div class="form-grid">
 <div class="field"><label>Terfi Adı</label><input id="sf_ad" value="${esc(s?.ad||"")}"></div>
 <div class="field"><label>RTU / Terfi No</label><input id="sf_rtu" value="${esc(s?.rtu||"")}"></div>
 <div class="field"><label>Bölge</label><select id="sf_bolge">${["AKDENİZ","MEZİTLİ","TOROSLAR","YENİŞEHİR","MERKEZ"].map(x=>`<option ${s?.bolge===x?"selected":""}>${x}</option>`).join("")}</select></div>
 <div class="field"><label>Terfi Tipi</label><input id="sf_tip" value="${esc(s?.tip||"TERFİ")}"></div>
 <div class="field"><label>Pompa Sayısı</label><input id="sf_count" type="number" min="1" max="50" value="${s?.pompalar?.length||1}"></div>
 </div><div class="modal-actions"><button class="btn primary" onclick="saveStation('${esc(editId||"")}')">KAYDET</button>${s?`<button class="btn danger" onclick="deleteStation('${esc(s.id)}')">SİL</button>`:""}<button class="btn" onclick="document.getElementById('stationModal').remove()">İPTAL</button></div></div></div>`);
}
function saveStation(editId){
 const ad=document.getElementById("sf_ad").value.trim(),rtu=document.getElementById("sf_rtu").value.trim(),bolge=document.getElementById("sf_bolge").value,tip=document.getElementById("sf_tip").value.trim()||"TERFİ",count=Math.max(1,Math.min(50,Number(document.getElementById("sf_count").value)||1));
 if(!ad){alert("Terfi adı gerekli.");return}
 if(editId){
  const s=db.stations.find(x=>x.id===editId);if(!s)return;
  s.ad=ad;s.rtu=rtu;s.bolge=bolge;s.tip=tip;
  const old=s.pompalar||[];s.pompalar=Array.from({length:count},(_,i)=>old[i]||("P"+(i+1)));
 }else{
  const id="RTU-"+Date.now();db.stations.unshift({id,rtu,ad,bolge,tip,pompalar:Array.from({length:count},(_,i)=>"P"+(i+1))});
 }
 saveDB();document.getElementById("stationModal").remove();state.stationId=editId||db.stations[0].id;state.pumpIndex=0;render();
}
function deleteStation(id){
 if(!confirm("Bu terfi kaydı silinsin mi?"))return;
 db.stations=db.stations.filter(x=>x.id!==id);Object.keys(db.records).filter(k=>k.startsWith(id+"::")).forEach(k=>delete db.records[k]);saveDB();document.getElementById("stationModal").remove();state.stationId=null;render();
}
function addWork(){
 if(!requireAdmin())return;
 const r=rec();const date=prompt("Tarih (YYYY-AA-GG):",new Date().toISOString().slice(0,10));if(!date)return;const type=prompt("İşlem:","BAKIM");const note=prompt("Açıklama:","");const person=prompt("Teknisyen:","");r.work.unshift({date,type,note,person});saveDB();render();
}
function addFault(){
 if(!requireAdmin())return;
 const code=prompt("Arıza kodu (örn. 2310):","2310");if(!code)return;const hit=faultLibrary.find(x=>x[0]===code);const desc=prompt("Açıklama:",hit?hit[2]:"");const action=prompt("Tespit / yapılan işlem:","");const result=prompt("Sonuç:","");rec().faults.unshift({date:new Date().toISOString().slice(0,10),code,desc,action,result});saveDB();render();
}
function addParam(){
 if(!requireAdmin())return;
 const code=prompt("Parametre kodu:","40.01");if(!code)return;const all=[...acsParams,...acqParams];const hit=all.find(x=>x[0]===code);const name=prompt("Parametre adı:",hit?hit[1]:"");const value=prompt("Yeni değer:","");const unit=hit?hit[2]:"";rec().params.unshift({code,name,value,unit,date:new Date().toISOString().slice(0,10)});saveDB();render();
}
function filterParam(q){
 const body=document.getElementById("paramBody");if(!body)return;const x=String(q).toLocaleLowerCase("tr-TR");body.querySelectorAll("tr").forEach(tr=>tr.style.display=tr.textContent.toLocaleLowerCase("tr-TR").includes(x)?"":"none");
}
function library(type){
 state.stationId=null;state.page="library";const root=document.getElementById("root");
 const title=type==="fault"?"ARIZA KÜTÜPHANESİ":type==="acs"?"ACS580 PARAMETRELERİ":"ACQ580 PARAMETRELERİ";
 const data=type==="fault"?faultLibrary.map(x=>[x[0],x[1],x[2],""]):(type==="acs"?acsParams:acqParams);
 root.innerHTML=`<div class="app">${sidebar(title)}<main class="main"><div class="topbar"><div class="crumb">TEKNİK KÜTÜPHANE / <b>${title}</b></div><button class="btn" onclick="state.stationId=null;state.page='home';render()">GERİ</button></div><section class="hero"><h1>${title}</h1><div class="hero-sub">Referans kütüphane · terfiye özel kayıtlar ayrı tutulur.</div></section><div class="toolbar"><input class="search" placeholder="Ara..." oninput="filterLibrary(this.value)"></div><table class="table"><thead><tr><th>KOD</th><th>AD</th><th>BİRİM / TÜR</th><th>AÇIKLAMA</th></tr></thead><tbody id="libBody">${data.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2]||"")}</td><td>${esc(x[3]||"")}</td></tr>`).join("")}</tbody></table></main></div>${mobileNav("library")}`;
}
function filterLibrary(q){const x=q.toLocaleLowerCase("tr-TR");document.querySelectorAll("#libBody tr").forEach(tr=>tr.style.display=tr.textContent.toLocaleLowerCase("tr-TR").includes(x)?"":"none")}
function side(x){
 if(x==="home"){state.stationId=null;state.page="home";state.region="TÜMÜ";render();return}
 if(x==="HYD"){state.stationId=null;state.page="home";state.region="TÜMÜ";state.search="HİDROLİK";render();return}
 state.stationId=null;state.page="home";state.region=x;state.search="";render();
}
function printHome(){window.print()}
function printStation(){
 const s=station(),r=rec(),pn=pumpName(s,state.pumpIndex),m=r.motor||{},d=r.driver||{};
 const w=window.open("","_blank");if(!w)return;
 w.document.write(`<html><head><title>${esc(s.ad)} - ${esc(pn)}</title><style>body{font-family:Arial;padding:28px;color:#111}h1{font-size:22px}h2{font-size:15px;background:#eee;padding:8px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:7px;text-align:left;font-size:11px}</style></head><body><h1>MESKİ TERFİ ARŞİVİM</h1><p><b>${esc(s.ad)}</b> · RTU ${esc(s.rtu||"—")} · ${esc(s.bolge)} · ${esc(pn)}</p><h2>POMPA</h2><table><tr><th>Alan</th><th>Değer</th></tr>${Object.entries(r.pump||{}).map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("")}</table><h2>MOTOR</h2><table>${Object.entries(m).map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("")}</table><h2>SÜRÜCÜ</h2><table>${Object.entries(d).map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join("")}</table><h2>ARIZA KAYITLARI</h2><table><tr><th>Tarih</th><th>Kod</th><th>Açıklama</th><th>İşlem</th><th>Sonuç</th></tr>${r.faults.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.code)}</td><td>${esc(x.desc)}</td><td>${esc(x.action)}</td><td>${esc(x.result)}</td></tr>`).join("")}</table><script>window.print()<\/script></body></html>`);
 w.document.close();
}

function boot(){
 const old=localStorage.getItem(STORAGE_KEY);
 if(!old)saveDB();
 render();
}
window.addEventListener("error",e=>console.error("MESKI:",e.error||e.message));
boot();
</script>
</body>
</html>
