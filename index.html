<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">

<title>Terfi Arşivim • Musa Er</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

:root{
--bg:#06111f;
--card:#0c1d30;
--card2:#10263c;
--line:#23415d;
--text:#f5f8fc;
--muted:#93a7bb;
--blue:#2997ff;
--cyan:#2bd9ff;
--green:#35d07f;
--red:#ff6573;
--orange:#ffb04d;
}

*{box-sizing:border-box}

body{
margin:0;
background:
radial-gradient(circle at 10% 0%,#123a5b,transparent 32%),
var(--bg);
color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea,select{font:inherit}

button{
border:0;
cursor:pointer;
color:white;
background:#16304a;
border-radius:13px;
padding:12px 15px;
font-weight:800;
}

button:hover{filter:brightness(1.12)}

.primary{
background:linear-gradient(135deg,#168cff,#2997ff);
}

.green{
background:#116f43;
}

.danger{
background:#55232b;
color:#ffabb3;
}

.app{
width:min(1150px,100%);
margin:auto;
padding:15px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px;
}

.brand{
display:flex;
gap:12px;
align-items:center;
}

.logo{
width:54px;
height:54px;
border-radius:17px;
display:grid;
place-items:center;
font-size:28px;
background:linear-gradient(135deg,#2997ff,#34d7d0);
}

.brand h1{
margin:0;
font-size:24px;
}

.brand p{
margin:3px 0 0;
color:var(--muted);
font-size:13px;
}

.tech{
text-align:right;
color:var(--muted);
font-size:12px;
}

.hero{
padding:30px;
border-radius:26px;
margin-bottom:16px;
border:1px solid #2a4c69;
background:
linear-gradient(90deg,#06121eee,#07182dcc),
url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=80")
center/cover;
}

.hero small{
color:var(--cyan);
font-weight:900;
letter-spacing:2px;
}

.hero h2{
font-size:40px;
max-width:700px;
line-height:1.1;
margin:10px 0;
}

.hero p{
color:#bdcad8;
font-size:17px;
line-height:1.6;
max-width:700px;
}

.toolbar{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-bottom:15px;
}

.search{
flex:1 1 280px;
}

input,textarea,select{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid #294964;
background:#081827;
color:white;
outline:none;
}

textarea{
min-height:110px;
resize:vertical;
}

input:focus,textarea:focus,select:focus{
border-color:var(--blue);
box-shadow:0 0 0 3px #2997ff22;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:11px;
margin:14px 0 22px;
}

.stat{
padding:18px;
border-radius:18px;
border:1px solid var(--line);
background:var(--card);
}

.stat strong{
display:block;
font-size:28px;
margin:5px 0;
}

.stat span{
color:var(--muted);
font-size:13px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
}

.card{
background:linear-gradient(145deg,#0c1e31,#081827);
border:1px solid var(--line);
border-radius:20px;
padding:18px;
margin-bottom:13px;
}

.station{
cursor:pointer;
transition:.15s;
}

.station:hover{
transform:translateY(-2px);
border-color:#397bab;
}

.station h3{
margin:10px 0 5px;
font-size:21px;
}

.no{
color:var(--cyan);
font-weight:800;
}

.muted{
color:var(--muted);
}

.badges{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px;
}

.badge{
padding:6px 9px;
border-radius:999px;
background:#112b43;
color:#aec2d6;
font-size:11px;
}

.tabs{
display:flex;
gap:7px;
overflow:auto;
margin:16px 0;
padding-bottom:5px;
position:sticky;
top:0;
z-index:5;
background:#06111fe8;
backdrop-filter:blur(12px);
}

.tabs button{
white-space:nowrap;
}

.active{
background:linear-gradient(135deg,#168cff,#2bc5ff);
}

.formgrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
}

.field{
margin-bottom:11px;
}

.field label{
display:block;
font-size:12px;
font-weight:800;
color:#b9c9d9;
margin-bottom:6px;
}

.section{
margin:18px 0 9px;
display:flex;
justify-content:space-between;
align-items:center;
}

.section h2,.section h3{
margin:0;
}

.empty{
text-align:center;
padding:35px;
color:var(--muted);
}

.item{
border-top:1px solid #1c354c;
padding:14px 0;
}

.item:first-child{
border-top:0;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

.notice{
padding:13px;
border-radius:13px;
background:#102a40;
border:1px solid #234a67;
color:#b5c9da;
margin:10px 0;
}

.notice.warning{
background:#382919;
border-color:#684a28;
color:#ffd39a;
}

.hmi-screen{
background:#02070b;
border:1px solid #315773;
border-radius:17px;
padding:14px;
margin-bottom:15px;
}

.hmi-title{
text-align:center;
font-weight:900;
color:#9be7ff;
margin-bottom:13px;
}

.hmi-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
}

.hmi-field{
position:relative;
}

.hmi-field input{
padding-right:45px;
}

.unit{
position:absolute;
right:10px;
bottom:13px;
font-size:11px;
color:#7189a0;
}

.compare{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.compare-box{
background:#081827;
border:1px solid var(--line);
padding:12px;
border-radius:13px;
}

.compare-box b{
font-size:18px;
display:block;
}

table{
width:100%;
border-collapse:collapse;
font-size:12px;
}

th,td{
padding:8px;
border-bottom:1px solid #203a51;
text-align:left;
}

th{
color:#9fc8e9;
}

.footer{
text-align:center;
padding:30px 0 10px;
color:#60778e;
font-size:12px;
}

.loading{
text-align:center;
padding:50px;
color:var(--muted);
}

@media(max-width:800px){

.stats{
grid-template-columns:1fr 1fr;
}

.grid,.formgrid,.hmi-grid{
grid-template-columns:1fr;
}

.hero h2{
font-size:31px;
}

.tech{
display:none;
}

}

</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">

<div class="logo">⚡</div>

<div>
<h1>Terfi Arşivim</h1>
<p>Saha teknik arşiv sistemi</p>
</div>

</div>

<div class="tech">
ELEKTRİK • OTOMASYON • MEKANİK<br>
<strong>Teknisyen Musa Er</strong>
</div>

</header>

<div id="app"></div>

<footer class="footer">
Terfi Arşivim • Merkezi Teknik Arşiv
<br>
Teknisyen Musa Er
</footer>

</div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vthjqdlsijdvvlegpqrg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pJrgD6-8p-SOxTu8bP02Ag_Cv5InPtB";

const db=supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GLOBAL
===================================================== */

let terfiler=[];
let current=null;
let activeTab="genel";
let hmiScreen=1;
let hmiCurrent={};


/* =====================================================
   HELPERS
===================================================== */

function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function fmt(date){

if(!date)return"";

return new Date(date).toLocaleString(
"tr-TR",
{
dateStyle:"short",
timeStyle:"short"
}
);

}

function loading(text){

document.getElementById("app").innerHTML=
`<div class="loading">${esc(text)}</div>`;

}


/* =====================================================
   ANA YÜKLEME
===================================================== */

async function load(){

loading("Merkezi arşiv yükleniyor...");

const {data,error}=await db
.from("terfiler")
.select("*")
.order("terfi_no");

if(error){

document.getElementById("app").innerHTML=`

<div class="card">

<h2>⚠️ Supabase bağlantı hatası</h2>

<p>${esc(error.message)}</p>

<div class="notice warning">

Uygulama veritabanına bağlanamadı.

</div>

</div>`;

return;
}

terfiler=data||[];

home();

}


/* =====================================================
   ANA SAYFA
===================================================== */

function home(){

document.getElementById("app").innerHTML=`

<div class="hero">

<small>MERKEZİ SAHA TEKNİK ARŞİVİ</small>

<h2>İstasyon bilgisini kaybetme.</h2>

<p>
Motor, pompa, sürücü, HMI ayarları, pano,
ölçüm, bakım ve arıza kayıtlarını tek merkezde tut.
</p>

</div>


<div class="toolbar">

<input
class="search"
id="search"
placeholder="Terfi, istasyon veya adres ara..."
>

<button class="primary"
onclick="newTerfi()">
＋ Yeni Terfi
</button>

<button
onclick="exportAllExcel()">
📊 Excel
</button>

<button
onclick="backupJSON()">
💾 Yedek
</button>

</div>


<div class="stats">

<div class="stat">
<strong>${terfiler.length}</strong>
<span>Terfi</span>
</div>

<div class="stat">
<strong id="motorTotal">...</strong>
<span>Motor</span>
</div>

<div class="stat">
<strong id="pumpTotal">...</strong>
<span>Pompa</span>
</div>

<div class="stat">
<strong>☁️</strong>
<span>Supabase Merkez</span>
</div>

</div>


<div class="section">
<h2>🏭 İstasyonlar</h2>
<span class="muted">${terfiler.length} kayıt</span>
</div>

<div id="list" class="grid"></div>

`;

document.getElementById("search").oninput=e=>
drawList(e.target.value);

drawList("");

quickStats();

}


function drawList(q){

q=(q||"").toLocaleLowerCase("tr-TR");

const rows=terfiler.filter(t=>

(
(t.terfi_no||"")+" "+
(t.ad||"")+" "+
(t.adres||"")+" "+
(t.bolge||"")
)
.toLocaleLowerCase("tr-TR")
.includes(q)

);

const el=document.getElementById("list");

if(!rows.length){

el.innerHTML=
`<div class="card empty" style="grid-column:1/-1">
Kayıt bulunamadı.
</div>`;

return;
}

el.innerHTML=rows.map(t=>`

<div class="card station"
onclick="openTerfi('${esc(t.id)}')">

<div class="no">
${esc(t.terfi_no||t.kod||"")}
</div>

<h3>
🏭 ${esc(t.ad||"İsimsiz İstasyon")}
</h3>

<div class="muted">
📍 ${esc(t.adres||"Adres girilmedi")}
</div>

<div class="badges">

<span class="badge">⚡ Motor</span>
<span class="badge">💧 Pompa</span>
<span class="badge">🎛️ Sürücü</span>
<span class="badge">🖥️ HMI</span>

</div>

</div>

`).join("");

}


async function quickStats(){

const [m,p]=await Promise.all([

db.from("motorlar")
.select("id",{count:"exact",head:true}),

db.from("pompalar")
.select("id",{count:"exact",head:true})

]);

const a=document.getElementById("motorTotal");
const b=document.getElementById("pumpTotal");

if(a)a.textContent=m.count??0;
if(b)b.textContent=p.count??0;

}


/* =====================================================
   YENİ TERFİ
===================================================== */

function newTerfi(){

const no=
"T"+
String(terfiler.length+1)
.padStart(3,"0");

const name=prompt(
"Terfi / istasyon adı:"
);

if(!name)return;

const address=prompt(
"Adres / bölge:"
)||"";

createTerfi(no,name,address);

}


async function createTerfi(no,name,address){

const {data,error}=await db
.from("terfiler")
.insert({

terfi_no:no,
ad:name,
adres:address,
aciklama:""

})
.select()
.single();

if(error){

alert(error.message);
return;

}

terfiler.push(data);

openTerfi(data.id);

}


/* =====================================================
   TERFİ DETAY
===================================================== */

function openTerfi(id){

current=
terfiler.find(x=>String(x.id)===String(id));

if(!current)return;

activeTab="genel";

detail();

}


function detail(){

document.getElementById("app").innerHTML=`

<button onclick="home()">
← İstasyonlara dön
</button>


<div class="section">

<div>

<h2>
🏭 ${esc(current.ad)}
</h2>

<div class="muted">
${esc(current.terfi_no)}
 • ${esc(current.adres||"")}
</div>

</div>

</div>


<div class="tabs">

${tab("genel","📋 Genel")}
${tab("motor","⚡ Motor")}
${tab("pompa","💧 Pompa")}
${tab("surucu","🎛️ Sürücü")}
${tab("hmi","🖥️ HMI Ayarları")}
${tab("anlik","📟 Anlık Veriler")}
${tab("pano","🔌 Pano")}
${tab("olcum","📏 Ölçüm")}
${tab("bakim","🛠️ Bakım")}
${tab("ariza","⚠️ Arıza")}
${tab("gecmis","🕘 Geçmiş")}
${tab("rapor","📄 PDF / Dışa Aktar")}

</div>

<div id="content"></div>

`;

renderTab();

}


function tab(id,text){

return`

<button
class="${activeTab===id?"active":""}"
onclick="switchTab('${id}')">

${text}

</button>

`;

}


function switchTab(tabName){

activeTab=tabName;

detail();

}


function renderTab(){

const el=document.getElementById("content");

if(activeTab==="genel")general(el);
if(activeTab==="motor")motor(el);
if(activeTab==="pompa")pump(el);
if(activeTab==="surucu")drive(el);
if(activeTab==="hmi")hmi(el);
if(activeTab==="anlik")instant(el);
if(activeTab==="pano")panel(el);
if(activeTab==="olcum")measurement(el);
if(activeTab==="bakim")maintenance(el);
if(activeTab==="ariza")fault(el);
if(activeTab==="gecmis")history(el);
if(activeTab==="rapor")reports(el);

}


/* =====================================================
   GENEL
===================================================== */

function general(el){

el.innerHTML=`

<div class="card">

<h3>📋 İstasyon Bilgileri</h3>

<div class="formgrid">

<div class="field">
<label>Terfi No</label>
<input id="gNo" value="${esc(current.terfi_no||"")}">
</div>

<div class="field">
<label>İstasyon Adı</label>
<input id="gName" value="${esc(current.ad||"")}">
</div>

</div>

<div class="field">
<label>Bölge</label>
<input id="gRegion" value="${esc(current.bolge||"")}">
</div>

<div class="field">
<label>Adres</label>
<input id="gAddress" value="${esc(current.adres||"")}">
</div>

<div class="field">
<label>Genel Teknik Not</label>
<textarea id="gNote">${esc(current.aciklama||"")}</textarea>
</div>

<button class="primary"
onclick="saveGeneral()">
💾 Kaydet
</button>

</div>


<div class="grid">

<div class="card">

<h3>⚡ Elektrik</h3>

<p class="muted">
Motor • Sürücü • Pano • Kablo • Ölçüm
</p>

</div>

<div class="card">

<h3>🖥️ Otomasyon</h3>

<p class="muted">
HMI • PLC • Sensör • Parametre • Anlık veriler
</p>

</div>

</div>


<div class="card">

<h3>🛡️ Arşiv Güvenliği</h3>

<div class="notice">

Ana kayıtlar Supabase üzerinde tutulur.
Telefonun tarayıcı hafızasına güvenilmez.

</div>

<div class="notice">

📄 PDF = teknik belge<br>
📊 Excel = rapor / dış yedek<br>
💾 JSON = tam veri yedeği

</div>

</div>

`;


}


async function saveGeneral(){

const old={...current};

const payload={

terfi_no:
document.getElementById("gNo").value.trim(),

ad:
document.getElementById("gName").value.trim(),

bolge:
document.getElementById("gRegion").value.trim(),

adres:
document.getElementById("gAddress").value.trim(),

aciklama:
document.getElementById("gNote").value.trim()

};

const {data,error}=await db
.from("terfiler")
.update(payload)
.eq("id",current.id)
.select()
.single();

if(error){

alert(error.message);
return;

}

current=data;

const i=terfiler.findIndex(x=>x.id===current.id);

if(i>=0)terfiler[i]=data;

await logChange(
"terfi",
current.id,
"güncelleme",
old,
data
);

alert("İstasyon kaydedildi.");

detail();

}


/* =====================================================
   MOTOR
===================================================== */

async function motor(el){

const {data,error}=await db
.from("motorlar")
.select("*")
.eq("terfi_id",current.id)
.order("created_at",{ascending:false});

if(error){

el.innerHTML=err(error);
return;

}

el.innerHTML=`

<div class="card">

<h3>⚡ Motor Etiketi</h3>

${input("mAd","Motor Adı")}
${input("mMarka","Marka")}
${input("mModel","Model")}
${input("mSeri","Seri No")}

<div class="formgrid">

${input("mKw","Güç kW")}
${input("mHp","Güç HP")}
${input("mV","Gerilim V")}
${input("mA","Nominal Akım A")}
${input("mHz","Frekans Hz")}
${input("mRpm","Devir RPM")}
${input("mCos","Cos φ")}

</div>

${textarea("mNote","Etiket / teknik not")}

<button class="primary"
onclick="addMotor()">
＋ Motoru Kaydet
</button>

</div>


<div class="section">
<h2>Motorlar</h2>
<span class="muted">${data.length}</span>
</div>

<div class="grid">

${data.map(x=>`

<div class="card">

<h3>
⚡ ${esc(x.ad||x.marka||"Motor")}
</h3>

<div class="badges">

<span class="badge">
${esc(x.guc||x.guc_kw||"")} kW
</span>

<span class="badge">
${esc(x.gerilim||x.gerilim_v||"")} V
</span>

<span class="badge">
${esc(x.akim||x.nominal_akim_a||"")} A
</span>

<span class="badge">
${esc(x.devir||x.devir_rpm||"")} RPM
</span>

</div>

<p class="muted">
${esc(x.marka_model||x.marka||"")}
</p>

<button class="danger"
onclick="del('motorlar','${esc(x.id)}')">
Sil
</button>

</div>

`).join("")}

</div>

`;

}


async function addMotor(){

const record={

terfi_id:current.id,

ad:val("mAd"),

marka:val("mMarka"),

model:val("mModel"),

seri_no:val("mSeri"),

guc_kw:num("mKw"),

guc_hp:num("mHp"),

gerilim_v:num("mV"),

nominal_akim_a:num("mA"),

frekans_hz:num("mHz"),

devir_rpm:num("mRpm"),

cos_phi:num("mCos"),

etiket_notu:val("mNote")

};

const {error}=await db
.from("motorlar")
.insert(record);

if(error){

alert(error.message);
return;

}

alert("Motor kaydedildi.");

motor(document.getElementById("content"));

}


/* =====================================================
   POMPA
===================================================== */

async function pump(el){

const {data,error}=await db
.from("pompalar")
.select("*")
.eq("terfi_id",current.id)
.order("created_at",{ascending:false});

if(error){

el.innerHTML=err(error);
return;

}

el.innerHTML=`

<div class="card">

<h3>💧 Pompa Etiketi</h3>

${input("pAd","Pompa Adı")}
${input("pMarka","Marka")}
${input("pModel","Model")}
${input("pTip","Tip")}
${input("pSeri","Seri No")}

<div class="formgrid">

${input("pKw","Güç kW")}
${input("pHp","Güç HP")}
${input("pQmin","Q Min m³/h")}
${input("pQmax","Q Max m³/h")}
${input("pHmin","H Min m")}
${input("pHmax","H Max m")}

</div>

${textarea("pNote","Etiket / teknik not")}

<button class="primary"
onclick="addPump()">
＋ Pompayı Kaydet
</button>

</div>


<div class="section">
<h2>Pompalar</h2>
<span class="muted">${data.length}</span>
</div>

<div class="grid">

${data.map(x=>`

placeholder="Değer">

</div>

`).join("")}

</div>

<br>

${textarea("hmiNote","Bu ekranla ilgili not")}

<button class="primary"
onclick="saveHMI()">

</div>

loadHMIHistory();

}


async function saveHMI(){

const values={};

hmiScreens[hmiScreen].fields.forEach(f=>{

values[f[0]]=val("hmi_"+f[0]);

});


const {error}=await db
.from("hmi_kayitlari")
.insert({

terfi_id:current.id,

ekran_no:hmiScreen,

degerler:values,

notlar:val("hmiNote")

});


if(error){

alert(error.message);
return;

}

alert("HMI ekranı arşivlendi.");

loadHMIHistory();

}

function pdfSection(pdf,title,rows,y){

if(y>255){

pdf.addPage();
y=18;

}

pdf.setFontSize(13);
pdf.setFont("helvetica","bold");
pdf.text(title,15,y);

y+=7;

pdf.setFontSize(9);
pdf.setFont("helvetica","normal");

rows.forEach(r=>{

const text=
r[0]+": "+String(r[1]||"");

const lines=pdf.splitTextToSize(text,175);

pdf.text(lines,15,y);

y+=lines.length*5;

});

return y+7;

}


function pdfTable(pdf,title,rows,fields,y){

if(!rows||!rows.length)return y;

if(y>230){

pdf.addPage();
y=18;

}

pdf.setFontSize(13);
pdf.setFont("helvetica","bold");

pdf.text(title,15,y);

y+=5;

const head=[
fields.map(x=>pretty(x))
];

const body=rows.map(r=>
fields.map(f=>String(r[f]??""))
);

pdf.autoTable({

startY:y+2,

head:head,

body:body,

theme:"grid",

styles:{
fontSize:7,
cellPadding:2
},

margin:{
left:10,
right:10
}

});

return pdf.lastAutoTable.finalY+10;

}


function pdfHMI(pdf,records,y){

if(!records.length)return y;

if(y>220){

pdf.addPage();
y=18;

}

pdf.setFontSize(13);
pdf.setFont("helvetica","bold");

pdf.text("HMI AYARLARI",15,y);

y+=5;

records.forEach(r=>{

if(y>255){

pdf.addPage();
y=18;

}

pdf.setFontSize(10);

pdf.text(
"EKRAN "+r.ekran_no+
" • "+fmt(r.created_at),
15,y
);

y+=5;

const body=
Object.entries(r.degerler||{})
.map(([k,v])=>[
pretty(k),
String(v??"")
]);

pdf.autoTable({

startY:y,

head:[["Parametre","Değer"]],

body:body,

theme:"grid",

styles:{
fontSize:7
},

margin:{
left:12,
right:12
}

});

y=pdf.lastAutoTable.finalY+8;

});

return y;

}

async function collectStationData(){

const tables={

motorlar:"motorlar",

pompalar:"pompalar",

suruculer:"suruculer",

panolar:"panolar",

olcumler:"olcum_kayitlari",

bakim:"bakim_kayitlari",

arizalar:"ariza_notlari",

anlik:"anlik_calisma_verileri",

hmi:"hmi_kayitlari",

gecmis:"degisiklik_gecmisi"

};

const out={};

for(const [key,table] of Object.entries(tables)){

const r=await db
.from(table)
.select("*")
.eq("terfi_id",current.id)
.order("created_at",{ascending:false});

out[key]=r.data||[];

}

return out;

}

function input(id,label,value=""){

return`

<div class="field">

<label>${esc(label)}</label>

<input
id="${esc(id)}"
value="${esc(value)}"
placeholder="${esc(label)}">

</div>

`;

}


function textarea(id,label){

return`

<div class="field">

<label>${esc(label)}</label>

<textarea
id="${esc(id)}"
placeholder="${esc(label)}"></textarea>

</div>

`;

}


function val(id){

const e=document.getElementById(id);

return e?e.value.trim():"";

}


function num(id){

const v=val(id);

if(v==="")return null;

const n=Number(v.replace(",","."));

return Number.isFinite(n)?n:null;

}


function safeFile(text){

return String(text||"ARSIV")
.replace(/[^\p{L}\p{N}\-_ ]/gu,"")
.replace(/\s+/g,"_")
.slice(0,80);

}


function pretty(k){

const map={

ad:"Ad",

marka:"Marka",

model:"Model",

guc_kw:"Güç kW",

guc_hp:"Güç HP",

gerilim_v:"Gerilim V",

nominal_akim_a:"Akım A",

devir_rpm:"Devir RPM",

pano_adi:"Pano",

marka_model:"Marka / Model",

plc:"PLC",

hmi:"HMI",

surucu_besleme:"Sürücü Besleme",

ana_salter:"Ana Şalter",

haberlesme:"Haberleşme",

olcum_tipi:"Ölçüm",

deger:"Değer",

birim:"Birim",

nokta:"Nokta",

ekipman:"Ekipman",

islem:"İşlem",

personel:"Personel",

baslik:"Başlık",

notlar:"Notlar",

cozuldu:"Çözüldü",

ekipman_turu:"Ekipman Türü",

ekipman_adi:"Ekipman",

parametre:"Parametre",

kayit_tarihi:"Kayıt Tarihi"

};

return map[k]||k;

}

async function del(table,id){

if(!confirm("Bu kayıt silinsin mi?"))return;

const {error}=await db
.from(table)
.delete()
.eq("id",id);

if(error){

alert(error.message);
return;

}

if(activeTab==="motor")
motor(document.getElementById("content"));

else if(activeTab==="pompa")
pump(document.getElementById("content"));

else if(activeTab==="surucu")
drive(document.getElementById("content"));

else if(activeTab==="hmi")
loadHMIHistory();

else if(activeTab==="pano")
panel(document.getElementById("content"));

else
renderTab();

}


function downloadBlob(blob,name){

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>URL.revokeObjectURL(a.href),
1000
);

}
