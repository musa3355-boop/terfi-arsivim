/* =========================================================
   ANA TASARIM
========================================================= */

:root{
  --bg:#06182b;
  --card:#0d2a43;
  --card2:#103a56;
  --line:#285675;
  --blue:#36aae8;
  --green:#16bd7b;
  --red:#d84d55;
  --text:#eef8ff;
  --muted:#9fb8ca;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

main{
  width:100%;
  max-width:1150px;
  margin:0 auto;
  padding:
    10px
    10px
    100px;
}

/* =========================================================
   KART
========================================================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  margin:10px 0;
}

.card h1,
.card h2,
.card h3{
  margin-top:0;
}

.muted{
  color:var(--muted);
}

.code{
  color:#61c9ff;
  font-weight:800;
}

/* =========================================================
   BUTON
========================================================= */

.btn{
  border:1px solid var(--line);
  background:#164765;
  color:#fff;
  padding:10px 14px;
  border-radius:11px;
  cursor:pointer;
  margin:3px;
  white-space:nowrap;
}

.btn:active{
  transform:scale(.98);
}

.btn.on{
  background:var(--blue);
  border-color:var(--blue);
}

.btn.ok{
  background:var(--green);
  border-color:var(--green);
}

.btn.bad{
  background:var(--red);
  border-color:var(--red);
}

/* =========================================================
   FORM
========================================================= */

.row{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:10px;
}

.field{
  min-width:0;
  margin-bottom:8px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px;
  background:#06182b;
  color:#fff;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.number-input{
  text-align:right;
}

/* =========================================================
   SEKME
========================================================= */

.tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  position:sticky;
  top:0;
  z-index:50;
  background:var(--bg);
  padding:7px 2px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tabs .btn{
  flex:none;
}

/* =========================================================
   HMI
========================================================= */

.hmi{
  background:#102e38;
  border-color:#315a69;
}

.hmi-page{
  margin-bottom:12px;
}

.hmi-page-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:10px;
}

.hmi-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:9px;
}

.hmi .field{
  margin-bottom:0;
}

.hmi .field input,
.hmi .field textarea,
.hmi .field select{
  background:#e8eef1;
  color:#071a2b;
  border-color:#758e9b;
}

/* =========================================================
   ÇALIŞMA
========================================================= */

.workbox{
  background:#081d31;
  border:1px solid #28516d;
  border-radius:12px;
  padding:11px;
  margin:7px 0;
}

/* =========================================================
   ARAMA
========================================================= */

.searchbox{
  margin:10px 0;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;

/* =========================================================
   ALT KAYDET
========================================================= */

.savebar{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  padding:9px;
  background:#041321;
  border-top:1px solid #23445e;

.savebar button{

  border:0;
  border-radius:13px;
  padding:16px;
  color:#fff;
  background:var(--green);

/* =========================================================
   YÜKLENİYOR
========================================================= */

  text-align:center;
  padding:40px 10px;
  color:var(--muted);
}

/* =========================================================
   PDF EKRANDA GİZLİ
========================================================= */

#printArea{
  display:none;
}

   PRINT
========================================================= */

    grid-template-columns:

    gap:1.5mm;
  }

  .pdf-column{
    min-width:0;
  }

  .pdf-section{
    border:.45px solid #bcc7cd;
    border-radius:1.5mm;
    padding:1.1mm;
    margin-bottom:1.2mm;

  }

  .pdf-section-title{
    font-size:5.8px;
    font-weight:900;

/* =========================================================

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* =========================================================
   SAYI
========================================================= */

function numberValue(value){

  if(
    value===null ||
    value===undefined ||
    value===""
  ){
    return null;
  }

  const n =
    Number(
      String(value)
      .replace(",",".")
    );

  return Number.isFinite(n)
    ? n
    : null;

}

function renderStationList(data){

  if(!data.length){

    return `

      <div class="card empty">

        Kayıtlı terfi bulunamadı.

      </div>

    `;

  }


  return data.map(
    function(x,index){

      const id =
        String(x.id || "");


      const code =
        x.terfi_no ||
        x.kod ||
        `T-${index+1}`;


      const name =
        x.ad ||
        "İsimsiz Terfi";


      return `

        <div
          class="card"
          style="
            cursor:pointer;
            user-select:none;
          "
          onclick='openStationSafe(${JSON.stringify(id)})'
        >

          <div
            class="code"
            style="
              font-size:13px;
              margin-bottom:4px;
            "
          >
            ${esc(code)}
          </div>

          <div
            style="
              font-size:19px;
              font-weight:900;
              margin-bottom:6px;
            "
          >
            ${esc(name)}
          </div>

          <div
            class="muted"
            style="
              font-size:14px;
            "
          >
            ${esc(x.bolge || "")}

            ${
              x.adres
              ?
              " · "+esc(x.adres)
              :
              ""
            }

          </div>

          <div
            style="
              margin-top:9px;
              color:#36aae8;
              font-size:13px;
              font-weight:800;
            "
          >
            TEKNİK ARŞİVİ AÇ →
          </div>

        </div>

      `;

    }
  ).join("");

}


/* =========================================================
   TERFİ ARAMA
========================================================= */

async function filterStations(){

  const input =
    document.getElementById(
      "stationSearch"
    );


  const q =
    String(
      input?.value || ""
    )
    .toLocaleLowerCase("tr-TR");


  const result =
    await db
    .from("terfiler")
    .select("*")
    .order("kod");


  if(result.error)
    return;


  const filtered =
    (result.data || [])
    .filter(
      function(x){

        const text = `

          ${x.ad || ""}

          ${x.kod || ""}

          ${x.terfi_no || ""}

          ${x.bolge || ""}

          ${x.adres || ""}

        `
        .toLocaleLowerCase("tr-TR");


        return text.includes(q);

      }
    );


  const list =
    document.getElementById(
      "stationList"
    );


  if(list){

    list.innerHTML =
      renderStationList(
        filtered
      );

  }

}

========================================================= */

async function openStationSafe(id){

  if(!id){

    alert(
      "Terfi ID bulunamadı."
    );

    return;

  }


  try{

    await openStation(id);

  }catch(error){

    console.error(error);

    alert(
      "Terfi açılırken hata oluştu:\n\n"+
      (
        error?.message ||
        error
      )
    );

  }

}


/* =========================================================
   TERFİYİ AÇ
========================================================= */

async function openStation(id){

  /*
     Önce SADECE terfiyi getiriyoruz.
     Böylece diğer tablolardan biri sorunlu
     olsa bile terfi ekranı açılabilir.
  */

  const station =
    await db
    .from("terfiler")
    .select("*")
    .eq("id",id)
    .single();


  if(station.error){

    throw new Error(
      "Terfi kaydı alınamadı: "+
      station.error.message
    );

  }


  if(!station.data){

    throw new Error(
      "Terfi kaydı bulunamadı."
    );

  }


  current={

    s:station.data,

    m:[],

    p:[],

    d:[],

    h:[],

    w:[],

    levels:[],

    services:[],

    faults:[],

    params:[],

    cables:[],

    photos:[],

    changes:[]

  };


  /*
     MOTORLAR
  */

  const motors =
    await db
    .from("motorlar")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at");


  if(!motors.error){

    current.m =
      motors.data || [];

  }else{

    console.warn(
      "Motor:",
      motors.error
    );

  }


  /*
     POMPALAR
  */

  const pumps =
    await db
    .from("pompalar")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at");


  if(!pumps.error){

    current.p =
      pumps.data || [];

  }else{

    console.warn(
      "Pompa:",
      pumps.error
    );

  }


  /*
     SÜRÜCÜLER
  */

  const drives =
    await db
    .from("suruculer")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at");


  if(!drives.error){

    current.d =
      drives.data || [];

  }else{

    console.warn(
      "Sürücü:",
      drives.error
    );

  }


  /*
     HMI
  */

  const hmi =
    await db
    .from("hmi_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order("ekran_no");


  if(!hmi.error){

    current.h =
      hmi.data || [];

  }else{

    console.warn(
      "HMI:",
      hmi.error
    );

  }


  /*
     ÇALIŞMA
  */

  const work =
    await db
    .from("motor_calisma_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "captured_at",
      {ascending:false}
    );


  if(!work.error){

    current.w =
      work.data || [];

  }else{

    console.warn(
      "Çalışma:",
      work.error
    );

  }


  /*
     SEVİYE
  */

  const levels =
    await db
    .from("seviye_bilgileri")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!levels.error){

    current.levels =
      levels.data || [];

  }


  /*
     SERVİS
  */

  const services =
    await db
    .from("servis_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "created_at",
      {ascending:false}
    );


  if(!services.error){

    current.services =
      services.data || [];

  }


  /*
     ARIZA
  */

  const faults =
    await db
    .from("surucu_ariza_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!faults.error){

    current.faults =
      faults.data || [];

  }


  /*
     PARAMETRE
  */

  const params =
    await db
    .from("surucu_parametre_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!params.error){

    current.params =
      params.data || [];

  }


  /*
     FOTOĞRAFLAR
  */

  const photos =
    await db
    .from("teknik_fotograflar")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "created_at",
      {ascending:false}
    );


  if(!photos.error){

    current.photos =
      photos.data || [];

  }


  /*
     DEĞİŞİKLİK GEÇMİŞİ
  */

  const changes =
    await db
    .from("degisiklik_gecmisi")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!changes.error){

    current.changes =
      changes.data || [];

  }


  /*
     BOX KABLOLARI
  */

  if(current.m.length){

    const motorIds =
      current.m
      .map(
        x=>x.id
      )
      .filter(Boolean);


    if(motorIds.length){

      const cables =
        await db
        .from("motor_box_kablolari")
        .select("*")
        .in(
          "motor_id",
          motorIds
        );


      if(!cables.error){

        current.cables =
          cables.data || [];

      }

    }

  }


  /*
     Çalışma motoru
  */

  if(
    !workMotor ||
    !current.m.some(
      x=>x.id===workMotor
    )
  ){

    workMotor =
      current.m[0]?.id ||
      null;

  }


  currentTab="terfi";

  renderStation();

}

async function newStation(){

  if(!editMode){

    unlockEdit();

    return;

  }


  const code =
    "T"+
    String(
      Date.now()
    ).slice(-6);


  /*
     Mevcut tabloda güvenli olarak
     kod alanını kullanıyoruz.
  */

  const result =
    await db
    .from("terfiler")
    .insert({

      ad:
        "Yeni Terfi",

      kod:
        code

    })
    .select()
    .single();


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  await openStation(
    result.data.id
  );

}

/* =========================================================
   PDF ÖLÇEKLEME
========================================================= */

function fitPDFToOnePage(){

  const page =
    document.querySelector(
      ".pdf-page"
    );

  const scale =
    document.getElementById(
      "pdfScale"
    );


  if(!page || !scale)
    return;


  /*
     A4 alanı yaklaşık olarak:
     291mm x 201mm

     İçeriğin gerçek yüksekliğini ölçüp
     tek sayfaya sığacak kadar küçültüyoruz.
  */

  scale.style.transform=
    "scale(1)";


  requestAnimationFrame(
    function(){

      const pageWidth =
        page.clientWidth;

      const pageHeight =
        page.clientHeight;


      const contentWidth =
        scale.scrollWidth;

      const contentHeight =
        scale.scrollHeight;


      let factor=1;


      if(contentWidth>pageWidth){

        factor =
          Math.min(
            factor,
            pageWidth /
            contentWidth
          );

      }


      if(contentHeight>pageHeight){

        factor =
          Math.min(
            factor,
            pageHeight /
            contentHeight
          );

      }


      /*
         Biraz güvenlik payı.
      */

      factor *= .985;


      /*
         Çok küçük olmasın.
         Ama yine de tek sayfayı korusun.
      */

      if(
        !Number.isFinite(factor) ||
        factor<=0
      ){

        factor=1;

      }


      scale.style.transform =
        `scale(${factor})`;

    }
  );

}


/* =========================================================

========================================================= */

function makePDF(){

  if(!current){

    alert(
      "Önce bir terfi seçin."
    );

    return;

  }


  const printArea =
    document.getElementById(
      "printArea"
    );


  /*
     Açık sekmeden bağımsız olarak
     bütün arşivi yeniden oluşturuyoruz.
  */

  printArea.innerHTML =
    buildPDF();


  /*
     Önce render.
  */

  setTimeout(
    function(){

      fitPDFToOnePage();


      /*
         Ölçeklendirme tamamlandıktan sonra
         yazdırma ekranı.
      */

      setTimeout(
        function(){

          window.print();

        },
        350
      );

    },
    150
  );

}
