function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(p="ID"){return p+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}
function loadStations(){
 try{
  const raw=JSON.parse(localStorage.getItem(KEY));
  if(Array.isArray(raw)&&raw.length)return raw.map(normalizeStation);
 }catch(e){}
 return SEED.map(s=>normalizeStation(makeStation(s)));
}
function normalizeStation(s){
 const st=Object.assign(makeStation({pumpCount:1}),clone(s||{}));
 st.pumps=Array.isArray(s?.pumps)&&s.pumps.length?s.pumps.map((p,i)=>normalizePump(p,i+1)):[makePump(1)];
 st.pumps.forEach((p,i)=>p.no=i+1);st.pumpCount=st.pumps.length;return st;
}
function normalizePump(p,no){
 const d=makePump(no),x=clone(p||{});
 for(const k of ["pump","motor","driver","ssr","pano","hmi"])x[k]=Object.assign({},d[k],x[k]||{});
 x.hmiScreens=Array.from({length:5},(_,i)=>Object.assign({},d.hmiScreens[i],(x.hmiScreens||[])[i]||{}));
 x.params=Array.isArray(x.params)?x.params:[];x.work=Array.isArray(x.work)?x.work:[];x.faults=Array.isArray(x.faults)?x.faults:[];x.photos=Array.isArray(x.photos)?x.photos:[];x.notes=x.notes||"";
 return Object.assign(d,x);
}
function saveAll(){
 try{localStorage.setItem(KEY,JSON.stringify(state.stations));return true}
 catch(e){toast("Kayıt başarısız: tarayıcı depolama alanı dolu olabilir.");return false}
}
function makeStation(s){
 const st=clone(s); st.pumps=[];
 for(let i=0;i<(Number(st.pumpCount)||1);i++) st.pumps.push(makePump(i+1));
 return st;
}

function st(){return state.stations.find(x=>x.id===state.stationId)||null}
function pm(){
 const s=st();if(!s)return null;
 if(!Array.isArray(s.pumps)||!s.pumps.length)s.pumps=[makePump(1)];
 if(state.pump<0||state.pump>=s.pumps.length)state.pump=0;
 s.pumps[state.pump]=normalizePump(s.pumps[state.pump],state.pump+1);
 return s.pumps[state.pump];
}

 if(!requireAdmin())return;

 els.forEach(e=>{let [sec,k]=e.dataset.edit.split(".");if(sec===section)x[sec][k]=e.value});

function detail(section,title){return objectForm(title,pm()[section],section)}

function photos(files){if(!requireAdmin())return;[...files].forEach(f=>{const r=new FileReader();r.onload=()=>{pm().photos.push({name:f.name,data:r.result});saveAll();render()};r.readAsDataURL(f)})}
function delPhoto(i){if(!requireAdmin())return;pm().photos.splice(i,1);saveAll();render()}
function notesPage(){return `<div class="card"><h3>▤ NOTLAR · P${state.pump+1}</h3><div style="padding:12px"><textarea id="notes" style="width:100%;min-height:260px;background:#071a29;border:1px solid #24536b;color:#fff;border-radius:7px;padding:10px">${esc(pm().notes||"")}</textarea><div class="formactions"><button class="smallbtn" onclick="saveNotes()">NOTU KAYDET</button></div></div></div>`}
function saveNotes(){if(!requireAdmin())return;pm().notes=document.getElementById("notes").value;saveAll();toast("Not kaydedildi.")}
function requireAdmin(){if(isAdmin()){touchAdmin();return true}login(true);return false}
function login(force=false){
 const html=`<div class="modal" id="loginModal"><div class="login"><div class="lock">🔒</div><h2>Yönetici Girişi</h2><p>Teknik arşiv düzenleme yetkisi için yönetici şifresini girin.</p><input id="pass" type="password" inputmode="numeric" maxlength="20" placeholder="••••"><button onclick="doLogin()">GİRİŞ YAP</button><button class="smallbtn" style="width:100%;margin-top:8px" onclick="closeModal()">İPTAL</button></div></div>`;
 document.body.insertAdjacentHTML("beforeend",html);setTimeout(()=>document.getElementById("pass")?.focus(),50);
}
function doLogin(){
 const inp=document.getElementById("pass");
 if(inp&&inp.value===ADMIN_PASS){
  sessionStorage.setItem(ADMIN,"1");sessionStorage.setItem("meski_admin_time",String(Date.now()));
  closeModal();showAdmin();render();toast("Yönetici modu aktif.");
 }else toast("Yönetici şifresi hatalı.");
}
function closeModal(){document.getElementById("loginModal")?.remove()}
function showAdmin(){
 let old=document.querySelector(".adminbar");if(old)old.remove();
 let d=document.createElement("div");d.className="adminbar";d.textContent="● YÖNETİCİ MODU AKTİF · ÇIKIŞ";
 d.onclick=()=>{sessionStorage.removeItem(ADMIN);sessionStorage.removeItem("meski_admin_time");d.remove();toast("Yönetici modu kapatıldı.");render()};
 document.body.appendChild(d);
}

function siteEdit(){
 if(!requireAdmin())return;
 const s=st();
 if(!s){toast("Önce bir terfi açın.");return}
 const keys=["ad","rtu","bolge","altBolge","kaynak","basma","terfiTipi","pompaTipi","calisma","kuyu","gps","aciklama"];
 modal("TERFİ BİLGİLERİNİ DÜZENLE",`<div class="formgrid">${keys.map(k=>`<div class="field"><label>${esc(labelSite(k))}</label><input data-siteedit="${k}" value="${esc(s[k]||"")}"></div>`).join("")}</div><div class="formactions"><button class="smallbtn" onclick="saveSiteEdit()">KAYDET</button></div>`);
}

function labelSite(k){return ({ad:"Terfi Adı",rtu:"RTU No",bolge:"Bölge",altBolge:"Alt Bölge",kaynak:"Kaynak",basma:"Basma",terfiTipi:"Terfi Tipi",pompaTipi:"Pompa Tipi",calisma:"Çalışma",kuyu:"Kuyu Derinliği (m)",gps:"GPS",aciklama:"Açıklama"}[k]||k)}
function saveSiteEdit(){if(!requireAdmin())return;const s=st();document.querySelectorAll("[data-siteedit]").forEach(e=>s[e.dataset.siteedit]=e.value);saveAll();closeAnyModal();render()}
function stationManager(){
 if(!requireAdmin())return;
 const list=state.stations.map((s,i)=>`<tr><td>${esc(s.ad)}</td><td>RTU ${esc(s.rtu)}</td><td>${esc(s.bolge)}</td><td>${s.pumps.length}</td><td><button class="smallbtn" onclick="chooseStation('${esc(s.id)}')">AÇ</button> <button class="smallbtn danger" onclick="deleteStation('${esc(s.id)}')">SİL</button></td></tr>`).join("");
 modal("TERFİ YÖNETİMİ",`<div class="formactions" style="justify-content:flex-start"><button class="smallbtn" onclick="newStation()">＋ YENİ TERFİ</button></div><table class="table"><tr><th>Terfi</th><th>RTU</th><th>Bölge</th><th>Pompa</th><th>İşlem</th></tr>${list}</table>`);
}
function chooseStation(id){state.stationId=id;state.pump=0;state.tab="GENEL";closeAnyModal();render()}
function deleteStation(id){if(state.stations.length<=1){toast("Son terfi silinemez.");return}if(!confirm("Bu terfiyi ve tüm pompa kayıtlarını silmek istediğinize emin misiniz?"))return;state.stations=state.stations.filter(s=>s.id!==id);if(state.stationId===id)state.stationId=state.stations[0].id;state.pump=0;saveAll();closeAnyModal();render()}
function newStation(){
 modal("YENİ TERFİ OLUŞTUR",`<div class="formgrid">
 <div class="field"><label>Terfi Adı</label><input id="n_ad"></div><div class="field"><label>RTU / Terfi No</label><input id="n_rtu"></div>
 <div class="field"><label>Bölge</label><select id="n_bolge"><option>AKDENİZ</option><option>MEZİTLİ</option><option>TOROSLAR</option><option>YENİŞEHİR</option><option>MERKEZ</option></select></div>
 <div class="field"><label>Alt Bölge</label><input id="n_alt"></div><div class="field"><label>Terfi Tipi</label><input id="n_tip" value="Terfi"></div>
 <div class="field"><label>Pompa Tipi</label><input id="n_ptip" value="Dalgıç"></div><div class="field"><label>Kuyu Derinliği (m)</label><input id="n_kuyu" type="number"></div>
 <div class="field"><label>Pompa Sayısı (1–50)</label><input id="n_count" type="number" min="1" max="50" value="1"></div>
 <div class="field"><label>Kaynak</label><input id="n_kaynak"></div><div class="field"><label>Basma</label><input id="n_basma"></div>
 <div class="field"><label>GPS</label><input id="n_gps"></div><div class="field"><label>Çalışma</label><input id="n_cal"></div>
 </div><div class="formactions"><button class="smallbtn" onclick="createStation()">OLUŞTUR</button></div>`);
}
function createStation(){
 if(!requireAdmin())return;
 const ad=document.getElementById("n_ad").value.trim(),rtu=document.getElementById("n_rtu").value.trim();
 if(!ad||!rtu){toast("Terfi adı ve RTU zorunlu.");return}
 const n=Math.max(1,Math.min(50,Number(document.getElementById("n_count").value)||1));
 const s={id:"RTU-"+rtu,ad,rtu,bolge:document.getElementById("n_bolge").value,altBolge:document.getElementById("n_alt").value,kaynak:document.getElementById("n_kaynak").value,basma:document.getElementById("n_basma").value,terfiTipi:document.getElementById("n_tip").value,pompaTipi:document.getElementById("n_ptip").value,calisma:document.getElementById("n_cal").value,kuyu:document.getElementById("n_kuyu").value,gps:document.getElementById("n_gps").value,aciklama:"",pumps:[]};
 for(let i=1;i<=n;i++)s.pumps.push(makePump(i));state.stations.push(s);state.stationId=s.id;state.pump=0;saveAll();closeAnyModal();render();toast("Yeni terfi oluşturuldu.");
}
function addPump(){if(!requireAdmin())return;const s=st();if(s.pumps.length>=50){toast("En fazla 50 pompa.");return}s.pumps.push(makePump(s.pumps.length+1));state.pump=s.pumps.length-1;saveAll();render();toast("Yeni pompa oluşturuldu.")}
function removeCurrentPump(){if(!requireAdmin())return;const s=st();if(s.pumps.length<=1){toast("Terfide en az 1 pompa olmalı.");return}if(!confirm("Seçili pompa ve ona ait tüm kayıtlar silinsin mi?"))return;s.pumps.splice(state.pump,1);s.pumps.forEach((p,i)=>p.no=i+1);state.pump=Math.max(0,state.pump-1);saveAll();render()}
function modal(title,body){closeAnyModal();document.body.insertAdjacentHTML("beforeend",`<div class="modal appmodal"><div class="modalcard"><div class="modalhead"><h2>${esc(title)}</h2><button class="x" onclick="closeAnyModal()">×</button></div>${body}</div></div>`)}
function closeAnyModal(){document.querySelectorAll(".appmodal").forEach(x=>x.remove())}
function library(type){
 const arr=type==="fault"?FAULTS:type==="acs"?ACS:ACQ,title=type==="fault"?"ARIZA KÜTÜPHANESİ":type==="acs"?"ACS580 PARAMETRELERİ":"ACQ580 PARAMETRELERİ";
 modal(title,`<input id="libsearch" oninput="filterLib()" style="width:100%;background:#071a29;border:1px solid #24536b;color:#fff;border-radius:7px;padding:9px;margin-bottom:9px" placeholder="Kod veya açıklama ara..."><table class="table" id="libtable"><tr><th>Kod</th><th>Açıklama</th><th>Detay/Birim</th></tr>${arr.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2]||"")}</td></tr>`).join("")}</table>`);
}
function filterLib(){const q=document.getElementById("libsearch").value.toLocaleLowerCase("tr-TR");document.querySelectorAll("#libtable tr").forEach((r,i)=>{if(i)r.style.display=r.textContent.toLocaleLowerCase("tr-TR").includes(q)?"":"none"})}
function home(){state.stationId=null;state.pump=0;state.tab="GENEL";state.filter="TÜMÜ";state.search="";renderHome()}
function renderHome(){
 const matches=state.stations.filter(s=>(state.filter==="TÜMÜ"||s.bolge===state.filter)&&(!state.search||(`${s.ad} ${s.rtu} ${s.bolge}`).toLocaleLowerCase("tr-TR").includes(state.search.toLocaleLowerCase("tr-TR"))));
 const groups=["AKDENİZ","MEZİTLİ","TOROSLAR","YENİŞEHİR","MERKEZ"];
 document.getElementById("crumb").innerHTML="<b>Ana Sayfa</b>";
 document.getElementById("siteTitle").textContent="MESKİ TERFİ TEKNİK ARŞİV";
 document.getElementById("siteSub").textContent=`${state.stations.length} terfi · ${state.stations.reduce((a,s)=>a+(s.pumps?.length||0),0)} pompa`;
 document.querySelectorAll("[data-site]").forEach(e=>e.textContent="—");
 document.getElementById("pumpList").innerHTML="";document.getElementById("pumpCount").textContent="";
 document.getElementById("sysTitle").textContent="TERFİLER";document.getElementById("sysSub").textContent="Bölge bazlı teknik arşiv";document.getElementById("innerNav").innerHTML="";
 document.getElementById("content").innerHTML=`<div style="display:flex;gap:8px;margin-bottom:9px"><input id="homeSearch" value="${esc(state.search)}" oninput="state.search=this.value;renderHome()" placeholder="Terfi / RTU / bölge ara..." style="flex:1;background:#071a29;border:1px solid #24536b;color:#fff;border-radius:8px;padding:11px"><button class="smallbtn" onclick="stationManager()">TERFİ YÖNETİMİ</button></div>${groups.map(g=>{let a=matches.filter(s=>s.bolge===g);return a.length?`<div class="card" style="margin-top:9px"><h3>⌂ ${g} <span style="float:right">${a.length} terfi</span></h3><div style="padding:10px" class="grid">${a.map(s=>`<div class="card"><h3>${esc(s.ad)}</h3>${rows([["RTU",s.rtu],["Pompa",s.pumps?.length||0],["Tip",s.terfiTipi||"—"],["Kaynak",s.kaynak||"—"]])}<div style="padding:8px"><button class="smallbtn" onclick="openStation('${esc(s.id)}')">TERFİYİ AÇ</button></div></div>`).join("")}</div></div>`:""}).join("")}${matches.length?"":`<div class="card" style="margin-top:9px"><h3>Sonuç</h3><div style="padding:15px">Bu filtreyle terfi bulunamadı.</div></div>`}`;
}
function openStation(id){
 const found=state.stations.find(s=>s.id===id);
 if(!found){toast("Terfi bulunamadı.");return}
 state.stationId=id;state.pump=0;state.tab="GENEL";render();
}
function saveCurrent(){if(!requireAdmin())return;saveAll();toast("Tüm değişiklikler kaydedildi.")}
function exportData(){if(!requireAdmin())return;const b=new Blob([JSON.stringify(state.stations,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meski-terfi-arsiv-yedek.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(inp){if(!requireAdmin())return;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw Error();state.stations=x;state.stationId=x[0].id;state.pump=0;saveAll();render();toast("Yedek geri yüklendi.")}catch(e){toast("Geçersiz yedek dosyası.")}};r.readAsText(f)}
function importPicker(){if(!requireAdmin())return;let i=document.getElementById("importFile");if(!i){i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.id="importFile";i.style.display="none";i.onchange=()=>importData(i);document.body.appendChild(i)}i.click()}
function printRows(o){
 return Object.entries(o||{}).map(([k,v])=>`<div class="print-row"><b>${esc(label(k))}</b><span>${esc(v||"—")}</span></div>`).join("");
}
function printBox(title,o){
 return `<div class="print-box"><h3>${esc(title)}</h3>${printRows(o)}</div>`;
}
function printObjectPage(title,subtitle,boxes){
 return `<div class="print-page"><div class="print-head"><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="print-grid">${boxes.join("")}</div></div>`;
}
function printArray(title,headers,arr,mapper){
 return `<div class="print-box" style="grid-column:1/-1"><h3>${esc(title)}</h3><table class="print-table"><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${(arr||[]).map(r=>`<tr>${mapper(r).map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${headers.length}">Kayıt yok.</td></tr>`}</table></div>`;
}
function report(){
 const s=st(),x=pm();if(!s||!x){toast("Önce bir terfi ve pompa açın.");return}
 const names=["1. Motor Termik / Hata","2. Röle / Basınç Koruma","3. Motor Teknik Değerleri","4. Frekans / Uyku / Pompa Yönetimi","5. Basınç Ayarı / Analoglar"];
 const pages=[];
 pages.push(printObjectPage("MESKİ TERFİ TEKNİK ARŞİV",
  `${s.ad} · RTU ${s.rtu} · ${s.bolge||"—"} · P${x.no} · Rapor tarihi: ${now()}`,
  [
   printBox("TERFİ KİMLİĞİ",{"Terfi Adı":s.ad,"RTU No":s.rtu,"Bölge":s.bolge,"Alt Bölge":s.altBolge,"Terfi Tipi":s.terfiTipi,"Pompa Tipi":s.pompaTipi}),
   printBox("HİDROLİK / SAHA",{"Kaynak":s.kaynak,"Basma":s.basma,"Kuyu Derinliği":s.kuyu?s.kuyu+" m":"—","GPS":s.gps,"Çalışma":s.calisma,"Açıklama":s.aciklama}),
   printBox("POMPA",x.pump),printBox("MOTOR",x.motor),
   printBox("SÜRÜCÜ",x.driver),printBox("SSR / SEVİYE",x.ssr),
   printBox("PANO / KABLO",x.pano),printBox("HMI / PLC",x.hmi)
  ]));
 pages.push(printObjectPage(`P${x.no} · POMPA / MOTOR / SÜRÜCÜ`,
  `${s.ad} · RTU ${s.rtu}`,
  [printBox("POMPA TEKNİK BİLGİLERİ",x.pump),printBox("MOTOR TEKNİK BİLGİLERİ",x.motor),printBox("SÜRÜCÜ TEKNİK BİLGİLERİ",x.driver)]));
 pages.push(printObjectPage(`P${x.no} · SSR / SEVİYE · PANO / KABLO · HMI`,
  `${s.ad} · RTU ${s.rtu}`,
  [printBox("SSR / SEVİYE",x.ssr),printBox("PANO / KABLO",x.pano),printBox("HMI / PLC",x.hmi)]));
 names.forEach((name,i)=>{
  const o=x.hmiScreens?.[i]||{};
  const keys=[
   ["Motor 1 Termik","Motor 1 Hata","Motor 2 Termik","Motor 2 Hata","Motor 3 Termik","Motor 3 Hata","Genel Hata","Hata Kodu"],
   ["Röle 1","Röle 2","Röle 3","Röle 4","Basınç Koruma","Basınç Değeri","Min Basınç","Max Basınç"],
   ["Motor Gücü","Motor Akımı","Motor Gerilimi","Motor Frekansı","Motor Devri","Motor Cosφ","Motor Termik","Çalışma Durumu"],
   ["Frekans","Uyku Seviyesi","Uyku Gecikmesi","Uyanma Seviyesi","Aktif Pompa","Pompa 1","Pompa 2","Pompa 3"],
   ["Basınç Set","Basınç Feedback","Analog 1 Değeri","Analog 2 Değeri","AI1 Birim","AI2 Birim","Min Basınç","Max Basınç"]
  ][i];
  const o2={};keys.forEach((k,j)=>o2[k]=o["a"+j]||"");
  pages.push(printObjectPage(`HMI EKRANI ${i+1}`,
   `${name} · ${s.ad} · P${x.no}`,[printBox(name,o2)]));
 });
 pages.push(`<div class="print-page"><div class="print-head"><h1>P${x.no} · PARAMETRELER / ÇALIŞMA / ARIZA</h1><p>${esc(s.ad)} · RTU ${esc(s.rtu)}</p></div><div class="print-grid">
 ${printArray("Pompa Özel Parametreleri",["Kod","Ad","Mevcut","Yeni","Birim","Not"],x.params,r=>[r.kod,r.ad,r.mevcut,r.yeni,r.birim,r.not])}
 ${printArray("Çalışma Kayıtları",["Tarih","Başlangıç","Duruş","Saat","Teknisyen","Not"],x.work,r=>[r.tarih,r.bas,r.durus,r.saat,r.tek,r.not])}
 ${printArray("Arıza Kayıtları",["Kod","Açıklama","Tespit","İşlem","Sonuç","Tarih"],x.faults,r=>[r.kod,r.aciklama,r.tespit,r.islem,r.sonuc,r.tarih])}
 </div></div>`);
 pages.push(`<div class="print-page"><div class="print-head"><h1>P${x.no} · FOTOĞRAFLAR / NOTLAR</h1><p>${esc(s.ad)} · RTU ${esc(s.rtu)}</p></div><div class="print-box"><h3>FOTOĞRAFLAR (${(x.photos||[]).length})</h3><div>${(x.photos||[]).map(p=>`<img class="print-photo" src="${p.data}" alt="${esc(p.name)}"><div style="font-size:7px">${esc(p.name)}</div>`).join("")||"<p>Fotoğraf kaydı yok.</p>"}</div></div><div class="print-box" style="margin-top:8px"><h3>NOTLAR</h3><div style="white-space:pre-wrap;font-size:9px">${esc(x.notes||"Not yok.")}</div></div></div>`);
 const root=document.createElement("div");root.className="print-root";root.id="printRoot";
 root.innerHTML=pages.join("");
 document.body.appendChild(root);
 const cleanup=()=>{document.getElementById("printRoot")?.remove();window.removeEventListener("afterprint",cleanup)};
 window.addEventListener("afterprint",cleanup);
 setTimeout(()=>window.print(),120);
}
function clock(){document.getElementById("clock").textContent=new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})+" "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}
function init(){
 try{
  document.getElementById("adminBtn").onclick=()=>isAdmin()?showAdmin():login();
  if(isAdmin())showAdmin();
  clock();setInterval(clock,30000);render();
 }catch(e){
  console.error(e);document.body.innerHTML=`<div style="padding:40px;background:#061522;color:#fff;min-height:100vh;font-family:Arial"><h2>Uygulama başlatılamadı</h2><p>${esc(e.message||e)}</p><button onclick="location.reload()">Tekrar Dene</button></div>`;
 }
}

init();
</script></body></html>
