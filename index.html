<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#07111f">

<title>Terfi Arşivim • Teknisyen Musa Er</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
 --bg:#06101d;
 --panel:#0b1b2d;
 --panel2:#0e2238;
 --line:#1c3955;
 --text:#f4f7fb;
 --muted:#9eafc3;
 --blue:#2997ff;
 --cyan:#29d7ff;
 --green:#35d07f;
 --red:#ff5d6c;
 --orange:#ffad42;
 --shadow:0 18px 50px #0008;
}

*{
 box-sizing:border-box;
}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(circle at 15% 0%,#123b61 0,transparent 32%),
 radial-gradient(circle at 100% 20%,#073a55 0,transparent 28%),
 var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input,
textarea,
select{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 width:min(1180px,100%);
 margin:auto;
 padding:18px;
}

.header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px;
}

.brand{
 display:flex;
 align-items:center;
 gap:14px;
}

.logo{
 width:58px;
 height:58px;
 border-radius:18px;
 display:grid;
 place-items:center;
 font-size:30px;
 background:linear-gradient(135deg,#2997ff,#39d7d1);
 box-shadow:0 10px 30px #0005;
}

.brand h1{
 margin:0;
 font-size:25px;
}

.brand p{
 margin:4px 0 0;
 color:var(--muted);
 font-size:14px;
}

.technician{
 text-align:right;
 color:#91a7bd;
 font-size:13px;
}

.hero{
 position:relative;
 overflow:hidden;
 min-height:285px;
 padding:35px;
 border:1px solid #284b6a;
 border-radius:28px;
 background:
 linear-gradient(90deg,#071522e8,#071522aa),
 url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=80")
 center/cover;
 box-shadow:var(--shadow);
 margin-bottom:18px;
}

.hero:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(120deg,transparent,#2997ff0c,transparent);
 pointer-events:none;
}

.hero small{
 color:var(--cyan);
 font-weight:800;
 letter-spacing:2px;
}

.hero h2{
 position:relative;
 z-index:1;
 max-width:720px;
 font-size:46px;
 line-height:1.05;
 margin:12px 0;
}

.hero p{
 position:relative;
 z-index:1;
 max-width:720px;
 color:#c0ccda;
 font-size:18px;
 line-height:1.7;
 margin:0;
}

.toolbar{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:16px;
}

.search{
 flex:1 1 280px;
}

input,
textarea,
select{
 width:100%;
 border:1px solid #274663;
 border-radius:14px;
 background:#081a2b;
 color:var(--text);
 padding:14px;
 outline:none;
}

input:focus,
textarea:focus,
select:focus{
 border-color:var(--blue);
 box-shadow:0 0 0 3px #2997ff22;
}

textarea{
 min-height:120px;
 resize:vertical;
}

button{
 border:0;
 border-radius:14px;
 padding:13px 17px;
 font-weight:800;
 color:white;
 background:#183049;
}

button:hover{
 filter:brightness(1.12);
}

.primary{
 background:linear-gradient(135deg,#168cff,#2997ff);
}

.green{
 background:linear-gradient(135deg,#20b86b,#35d07f);
}

.danger{
 background:#54202a;
 color:#ff9aa4;
}

.secondary{
 background:#10263c;
 border:1px solid #284965;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
 margin:16px 0 22px;
}

.stat{
 padding:22px;
 border:1px solid var(--line);
 border-radius:22px;
 background:linear-gradient(145deg,#0c2034,#081728);
}

.stat .icon{
 font-size:25px;
}

.stat strong{
 display:block;
 font-size:30px;
 margin:7px 0;
}

.stat span{
 color:var(--muted);
}

.section-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin:25px 0 12px;
}

.section-title h2{
 margin:0;
 font-size:22px;
}

.section-title span{
 color:var(--muted);
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:14px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
}

.card{
 background:linear-gradient(145deg,#0b1c2e,#081726);
 border:1px solid var(--line);
 border-radius:22px;
 padding:20px;
 box-shadow:0 10px 30px #0003;
}

.station-card{
 cursor:pointer;
 transition:.18s;
}

.station-card:hover{
 transform:translateY(-2px);
 border-color:#3575a6;
}

.station-top{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:flex-start;
}

.station-icon{
 width:48px;
 height:48px;
 display:grid;
 place-items:center;
 border-radius:15px;
 background:#102a43;
 font-size:25px;
}

.station-card h3{
 margin:12px 0 5px;
 font-size:21px;
}

.station-no{
 color:var(--cyan);
 font-weight:800;
}

.address{
 color:#aebdcd;
 line-height:1.5;
}

.badges{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin-top:15px;
}

.badge{
 padding:7px 10px;
 border-radius:999px;
 background:#10273c;
 color:#aec0d2;
 font-size:12px;
}

.empty{
 text-align:center;
 padding:40px;
 color:var(--muted);
}

.detail-head{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:15px;
 margin:15px 0;
}

.detail-title h2{
 margin:0 0 5px;
 font-size:30px;
}

.detail-title p{
 margin:0;
 color:var(--muted);
}

.tabs{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding-bottom:4px;
 margin:18px 0;
}

.tabs button{
 white-space:nowrap;
}

.tab-active{
 background:linear-gradient(135deg,#168cff,#29b9ff);
}

.field{
 margin-bottom:13px;
}

.field label{
 display:block;
 margin-bottom:7px;
 color:#b9c9d9;
 font-size:13px;
 font-weight:800;
}

.field small{
 display:block;
 color:#71869b;
 margin-top:5px;
}

.form-card h3{
 margin-top:0;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
 margin-top:15px;
}

.photo-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}

.photo{
 position:relative;
 border-radius:16px;
 overflow:hidden;
 border:1px solid var(--line);
 background:#06111e;
}

.photo img{
 width:100%;
 height:190px;
 display:block;
 object-fit:cover;
}

.photo .caption{
 padding:9px;
 font-size:12px;
 color:#aebdcd;
}

.photo button{
 position:absolute;
 right:8px;
 top:8px;
 padding:7px 9px;
}

.hmi-group{
 margin-bottom:22px;
}

.hmi-group h3{
 margin:0 0 12px;
 color:#dce8f4;
}

.hmi-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:11px;
}

.number-field{
 position:relative;
}

.number-field input{
 padding-right:55px;
}

.unit{
 position:absolute;
 right:12px;
 bottom:14px;
 color:#7189a0;
 font-size:12px;
}

.connection{
 padding:15px;
 border:1px solid var(--line);
 border-radius:16px;
 background:#091a2b;
 margin-bottom:10px;
}

.connection strong{
 display:block;
 margin-bottom:5px;
}

.connection span{
 color:var(--muted);
 font-size:13px;
}

.footer{
 margin:35px 0 10px;
 padding:20px;
 text-align:center;
 border-top:1px solid #19334c;
 color:#70859a;
}

.footer strong{
 color:#aabbd0;
}

.loading{
 text-align:center;
 padding:60px 20px;
 color:#9eb1c5;
}

.spinner{
 width:35px;
 height:35px;
 border:3px solid #24425d;
 border-top-color:var(--blue);
 border-radius:50%;
 margin:0 auto 15px;
 animation:spin 1s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

.notice{
 padding:13px 15px;
 border-radius:14px;
 background:#10273b;
 border:1px solid #214661;
 color:#abc0d3;
 margin:12px 0;
}

.notice.warning{
 background:#392719;
 border-color:#704b27;
 color:#ffd39a;
}

.modal{
 position:fixed;
 inset:0;
 background:#000b;
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:100;
}

.modal.show{
 display:flex;
}

.modal-box{
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0a1b2c;
 border:1px solid #31516d;
 border-radius:24px;
 padding:22px;
 box-shadow:var(--shadow);
}

.modal-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
}

.modal-head h2{
 margin:0;
}

.close{
 background:#1b3045;
 border-radius:50%;
 width:42px;
 height:42px;
 padding:0;
}

@media(max-width:850px){

 .stats{
  grid-template-columns:repeat(2,1fr);
 }

 .grid3,
 .hmi-grid{
  grid-template-columns:repeat(2,1fr);
 }

 .photo-grid{
  grid-template-columns:repeat(2,1fr);
 }

 .hero h2{
  font-size:36px;
 }

}

@media(max-width:600px){

 .app{
  padding:12px;
 }

 .header{
  align-items:flex-start;
 }

 .technician{
  display:none;
 }

 .hero{
  min-height:270px;
  padding:25px 20px;
 }

 .hero h2{
  font-size:31px;
 }

 .hero p{
  font-size:16px;
 }

 .grid,
 .grid3,
 .hmi-grid{
  grid-template-columns:1fr;
 }

 .stats{
  grid-template-columns:1fr 1fr;
 }

 .stat{
  padding:15px;
 }

 .stat strong{
  font-size:25px;
 }

 .photo-grid{
  grid-template-columns:1fr;
 }

 .detail-head{
  flex-direction:column;
 }

}

</style>
</head>

<body>

<div class="app">

<header class="header">

<div class="brand">

<div class="logo">⚡</div>

<div>
<h1>Terfi Arşivim</h1>
<p>Saha teknik kayıt sistemi</p>
</div>

</div>

<div class="technician">
TEKNİSYEN<br>
<strong>Musa Er</strong>
</div>

</header>

<div id="app">

<div class="loading">
<div class="spinner"></div>
Arşiv yükleniyor...
</div>

</div>

<footer class="footer">
<strong>Terfi Arşivim</strong> • Elektrik / Otomasyon / Mekanik Saha Arşivi
<br>
Teknisyen <strong>Musa Er</strong>
</footer>

</div>


<div id="modal" class="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle">Yeni Terfi İstasyonu</h2>

<button class="close" onclick="closeModal()">×</button>

</div>

<div id="modalBody"></div>

</div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://vthjqdlsijdvvlegpqrg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pJrgD6-8p-SOxTu8bP02Ag_Cv5InPtB";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let terfiler = [];
let current = null;
let activeTab = "genel";
let searchText = "";


/* =========================================================
   YARDIMCI
========================================================= */

function esc(value){

 return String(value ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function showLoading(text="Yükleniyor..."){

 document.getElementById("app").innerHTML=`

 <div class="loading">

 <div class="spinner"></div>

 ${esc(text)}

 </div>

 `;

}


function closeModal(){

 document.getElementById("modal").classList.remove("show");

}


function openModal(title,body){

 document.getElementById("modalTitle").textContent=title;

 document.getElementById("modalBody").innerHTML=body;

 document.getElementById("modal").classList.add("show");

}


/* =========================================================
   TERFİLER
========================================================= */

async function loadTerfiler(){

 showLoading("Saha arşivi yükleniyor...");

 const {data,error}=await db
 .from("terfiler")
 .select("*")
 .order("terfi_no");

 if(error){

   document.getElementById("app").innerHTML=`

   <div class="card">

   <h2>⚠️ Veritabanı bağlantı hatası</h2>

   <p>${esc(error.message)}</p>

   <div class="notice warning">

   Supabase bağlantısını kontrol et.

   </div>

   </div>

   `;

   return;
 }

 terfiler=data||[];

 renderHome();

}


/* =========================================================
   ANA SAYFA
========================================================= */

function renderHome(){

 const filtered=terfiler.filter(t=>{

   const text=(

    (t.ad||"")+" "+
    (t.terfi_no||"")+" "+
    (t.adres||"")+" "+
    (t.aciklama||"")

   ).toLocaleLowerCase("tr-TR");

   return text.includes(searchText.toLocaleLowerCase("tr-TR"));

 });


 document.getElementById("app").innerHTML=`

 <section class="hero">

 <small>SAHA TEKNİK ARŞİVİ</small>

 <h2>İstasyon bilgisini kaybetme.</h2>

 <p>
 Motor, pompa, sürücü, HMI ayarları, pano bağlantıları,
 ölçümler ve saha fotoğraflarını tek istasyonda sakla.
 </p>

 </section>


 <div class="toolbar">

 <input
 class="search"
 id="searchInput"
 placeholder="İstasyon adı, terfi no veya adres ara..."
 value="${esc(searchText)}"
 >

 <button class="primary" onclick="newTerfi()">
 ＋ Yeni Terfi İstasyonu
 </button>

 </div>


 <div class="stats">

 <div class="stat">
 <div class="icon">🏭</div>
 <strong>${terfiler.length}</strong>
 <span>Terfi istasyonu</span>
 </div>

 <div class="stat">
 <div class="icon">⚡</div>
 <strong id="motorCount">—</strong>
 <span>Motor</span>
 </div>

 <div class="stat">
 <div class="icon">💧</div>
 <strong id="pumpCount">—</strong>
 <span>Pompa</span>
 </div>

 <div class="stat">
 <div class="icon">🛠️</div>
 <strong>${terfiler.length}</strong>
 <span>Aktif arşiv</span>
 </div>

 </div>


 <div class="section-title">

 <h2>İstasyonlar</h2>

 <span>${filtered.length} kayıt gösteriliyor</span>

 </div>


 <div id="stationList" class="grid"></div>

 `;


 document.getElementById("searchInput").addEventListener(
 "input",
 e=>{
   searchText=e.target.value;
   renderHome();
   document.getElementById("searchInput").focus();
 }
 );


 const list=document.getElementById("stationList");


 if(!filtered.length){

   list.innerHTML=`

   <div class="card empty" style="grid-column:1/-1">

   🔎 Kayıt bulunamadı.

   </div>

   `;

 }else{

   list.innerHTML=filtered.map(t=>`

   <div class="card station-card"
   onclick="openTerfi('${esc(t.id)}')">

   <div class="station-top">

   <div>

   <div class="station-no">
   ${esc(t.terfi_no)}
   </div>

   <h3>
   🏭 ${esc(t.ad||"İsimsiz İstasyon")}
   </h3>

   </div>

   <div class="station-icon">⚡</div>

   </div>

   <div class="address">
   ${esc(t.adres||"Adres girilmedi")}
   </div>

   <div class="badges">

   <span class="badge">⚡ Motor</span>
   <span class="badge">💧 Pompa</span>
   <span class="badge">🎛️ Sürücü</span>
   <span class="badge">🖥️ HMI</span>

   </div>

   </div>

   `).join("");

 }

 loadQuickStats();

}


async function loadQuickStats(){

 const motor=db.from("motorlar").select("id",{count:"exact",head:true});
 const pump=db.from("pompalar").select("id",{count:"exact",head:true});

 const [m,p]=await Promise.all([motor,pump]);

 const motorEl=document.getElementById("motorCount");
 const pumpEl=document.getElementById("pumpCount");

 if(motorEl)motorEl.textContent=m.count ?? 0;
 if(pumpEl)pumpEl.textContent=p.count ?? 0;

}


/* =========================================================
   YENİ TERFİ
========================================================= */

function newTerfi(){

 const nextNo="T"+String(terfiler.length+1).padStart(3,"0");

 openModal(
 "Yeni Terfi İstasyonu",
 `

 <div class="field">
 <label>Terfi No</label>
 <input id="newNo" value="${nextNo}">
 </div>

 <div class="field">
 <label>Terfi İstasyonu Adı</label>
 <input id="newName" placeholder="Örn. Dalgıç 3">
 </div>

 <div class="field">
 <label>Adres / Bölge</label>
 <input id="newAddress" placeholder="Örn. Şebeke - Yeni Mahalle">
 </div>

 <div class="field">
 <label>Açıklama</label>
 <textarea id="newDescription"
 placeholder="İstasyon hakkında teknik not..."></textarea>
 </div>

 <div class="actions">

 <button class="primary" onclick="createTerfi()">
 💾 İstasyonu Kaydet
 </button>

 <button class="secondary" onclick="closeModal()">
 Vazgeç
 </button>

 </div>

 `);

}


async function createTerfi(){

 const payload={

   terfi_no:document.getElementById("newNo").value.trim(),

   ad:document.getElementById("newName").value.trim(),

   adres:document.getElementById("newAddress").value.trim(),

   aciklama:document.getElementById("newDescription").value.trim()

 };


 if(!payload.terfi_no || !payload.ad){

   alert("Terfi No ve Terfi Adı zorunludur.");

   return;

 }


 const {data,error}=await db
 .from("terfiler")
 .insert(payload)
 .select()
 .single();


 if(error){

   alert(error.message);

   return;

 }


 closeModal();

 terfiler.unshift(data);

 openTerfi(data.id);

}


/* =========================================================
   TERFİ DETAY
========================================================= */

async function openTerfi(id){

 current=terfiler.find(x=>String(x.id)===String(id));

 if(!current){

   alert("İstasyon bulunamadı.");

   return;

 }

 activeTab="genel";

 renderDetail();

}


function renderDetail(){

 document.getElementById("app").innerHTML=`

 <button class="secondary"
 onclick="loadTerfiler()">
 ← İstasyonlara dön
 </button>


 <div class="detail-head">

 <div class="detail-title">

 <h2>🏭 ${esc(current.ad||"İsimsiz")}</h2>

 <p>
 ${esc(current.terfi_no)}
 • ${esc(current.adres||"Adres girilmedi")}
 </p>

 </div>


 <div class="actions">

 <button class="primary"
 onclick="saveGeneral()">
 💾 Değişiklikleri kaydet
 </button>

 </div>

 </div>


 <div class="tabs">

 ${tabButton("genel","📋 Genel")}
 ${tabButton("motor","⚡ Motorlar")}
 ${tabButton("pompa","💧 Pompalar")}
 ${tabButton("surucu","🎛️ Sürücüler")}
 ${tabButton("hmi","🖥️ HMI Ayarları")}
 ${tabButton("pano","🔌 Pano / Bağlantılar")}
 ${tabButton("olcum","📏 Ölçümler")}
 ${tabButton("foto","📷 Saha Fotoğrafları")}
 ${tabButton("bakim","🛠️ Bakım / Arıza")}

 </div>


 <div id="detailContent"></div>

 `;


 renderTab();

}


function tabButton(id,text){

 return `

 <button
 class="${activeTab===id?"tab-active":""}"
 onclick="setTab('${id}')">

 ${text}

 </button>

 `;

}


function setTab(tab){

 activeTab=tab;

 renderDetail();

}


function renderTab(){

 const el=document.getElementById("detailContent");

 if(activeTab==="genel") renderGeneral(el);
 if(activeTab==="motor") renderMotor(el);
 if(activeTab==="pompa") renderPompa(el);
 if(activeTab==="surucu") renderSurucu(el);
 if(activeTab==="hmi") renderHMI(el);
 if(activeTab==="pano") renderPano(el);
 if(activeTab==="olcum") renderOlcum(el);
 if(activeTab==="foto") renderPhotos(el);
 if(activeTab==="bakim") renderMaintenance(el);

}


/* =========================================================
   GENEL
========================================================= */

function renderGeneral(el){

 el.innerHTML=`

 <div class="grid">

 <div class="card form-card">

 <h3>📋 İstasyon Bilgileri</h3>

 <div class="field">
 <label>Terfi No</label>
 <input id="generalNo" value="${esc(current.terfi_no)}">
 </div>

 <div class="field">
 <label>Terfi İstasyonu</label>
 <input id="generalName" value="${esc(current.ad)}">
 </div>

 <div class="field">
 <label>Adres</label>
 <input id="generalAddress" value="${esc(current.adres||"")}">
 </div>

 <div class="field">
 <label>Açıklama</label>
 <textarea id="generalDescription">${esc(current.aciklama||"")}</textarea>
 </div>

 <button class="primary"
 onclick="saveGeneral()">
 💾 Bilgileri Kaydet
 </button>

 </div>


 <div class="card">

 <h3>👨‍🔧 Teknisyen Kaydı</h3>

 <div class="notice">

 Bu arşiv <strong>Teknisyen Musa Er</strong>
 tarafından saha ekipmanlarının teknik bilgilerinin
 kayıt altında tutulması amacıyla oluşturulmuştur.

 </div>

 <div class="connection">
 <strong>⚡ Elektrik</strong>
 <span>Motor, sürücü, pano ve enerji bilgileri</span>

 <div class="field">

 placeholder="Örn. Pano içi / Motor etiketi / HMI ekranı">

 <div class="field">

 </button>

function savePhoto(){

 const file=document.getElementById("photoFile").files[0];

 if(!file){

   alert("Önce bir fotoğraf seç.");

   return;

 }

 const caption=document
 .getElementById("photoCaption")
 .value
 .trim();


 const reader=new FileReader();


 reader.onload=()=>{

   const photos=getPhotos();

   photos.unshift({

     data:reader.result,

     caption:caption,

     date:new Date().toISOString()

   });


   try{

     localStorage.setItem(
      photoKey(),
      JSON.stringify(photos)
     );

     renderPhotos(document.getElementById("detailContent"));

   }catch(e){

     alert(
      "Fotoğraf cihaz hafızasına sığmadı. Daha küçük bir fotoğraf seç."
     );

   }

 };


 reader.readAsDataURL(file);

}


function deletePhoto(index){

 if(!confirm("Bu fotoğraf silinsin mi?"))
 return;

 const photos=getPhotos();

 photos.splice(index,1);

 localStorage.setItem(
  photoKey(),
  JSON.stringify(photos)
 );

 renderPhotos(document.getElementById("detailContent"));

}

function getMaintenance(){

 try{

   return JSON.parse(
    localStorage.getItem(maintenanceKey())||"[]"
   );

 }catch(e){

   return [];

 }

}


function renderMaintenance(el){

 const rows=getMaintenance();

 el.innerHTML=`

 <div class="card">

 <h3>🛠️ Yeni Bakım / Arıza Kaydı</h3>

 <div class="grid">

 ${fieldHTML(
 "maint_date",
 "Tarih",
 new Date().toLocaleDateString("tr-TR")
 )}

 ${fieldHTML(
 "maint_subject",
 "Konu",
 ""
 )}

 </div>

 ${fieldHTML(
 "maint_description",
 "Yapılan İşlem / Arıza Açıklaması",
 "",
 true
 )}

 ${fieldHTML(
 "maint_measurement",
 "Ölçüm / Sonuç",
 "",
 true
 )}

 <button class="primary"
 onclick="addMaintenance()">
 ＋ Kaydı Ekle
 </button>

 </div>


 <div class="section-title">

 <h2>Bakım / Arıza Geçmişi</h2>

 <span>${rows.length} kayıt</span>

 </div>


 <div>

 ${rows.length
 ?rows.map((r,i)=>`

 <div class="card" style="margin-bottom:12px">

 <div class="station-no">
 ${esc(r.date)}
 </div>

 <h3>
 🛠️ ${esc(r.subject||"Bakım Kaydı")}
 </h3>

 <p>
 ${esc(r.description||"")}
 </p>

 <div class="notice">
 ${esc(r.measurement||"")}
 </div>

 <button class="danger"
 onclick="deleteMaintenance(${i})">
 Sil
 </button>

 </div>

 `).join("")
 :`<div class="card empty">Henüz bakım / arıza kaydı yok.</div>`
 }

 </div>

 `;

}


function addMaintenance(){

 const rows=getMaintenance();

 rows.unshift({

   date:document.getElementById("maint_date").value.trim(),

   subject:document.getElementById("maint_subject").value.trim(),

   description:document.getElementById("maint_description").value.trim(),

   measurement:document.getElementById("maint_measurement").value.trim()

 });


 localStorage.setItem(
  maintenanceKey(),
  JSON.stringify(rows)
 );


 renderMaintenance(document.getElementById("detailContent"));

}


function deleteMaintenance(index){

 if(!confirm("Bu bakım kaydı silinsin mi?"))
 return;

 const rows=getMaintenance();

 rows.splice(index,1);

 localStorage.setItem(
  maintenanceKey(),
  JSON.stringify(rows)
 );

 renderMaintenance(document.getElementById("detailContent"));

}

========================================================= */

async function deleteEquipment(table,id){

 if(!confirm("Bu kayıt silinsin mi?"))
 return;


 const {error}=await db
 .from(table)
 .delete()
 .eq("id",id);


 if(error){

   alert(error.message);

   return;

 }


 renderTab();

}

========================================================= */

async function deleteCurrentTerfi(){

 if(!current)return;

 if(!confirm(
 "DİKKAT!\n\nBu istasyonun ana kaydı silinecek.\nDevam edilsin mi?"
 ))return;


 const {error}=await db
 .from("terfiler")
 .delete()
 .eq("id",current.id);


 if(error){

   alert(error.message);

   return;

 }


 localStorage.removeItem(hmiKey());
 localStorage.removeItem("terfi_pano_"+current.id);
 localStorage.removeItem(photoKey());
 localStorage.removeItem(maintenanceKey());

 current=null;

 await loadTerfiler();

}
