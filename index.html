<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061728">
<title>MESKİ TERFİ ARŞİVİM · SCADA</title>

<style>
:root{
 --bg:#031525;
 --bg2:#061d31;
 --panel:#06253d;
 --panel2:#082e49;
 --panel3:#0a3856;
 --line:#0d5476;
 --line2:#167ca7;
 --cyan:#16bff5;
 --cyan2:#49d8ff;
 --green:#16dc78;
 --red:#ff4655;
 --yellow:#ffd04a;
 --white:#eff9ff;
 --muted:#82a5b8;
 --dark:#020e18;
 --shadow:0 10px 30px rgba(0,0,0,.42);
}

*{box-sizing:border-box}

html,body{
 margin:0;
 min-height:100%;
 background:
 radial-gradient(circle at 75% -5%,#124665 0,transparent 31%),
 linear-gradient(180deg,#041d31,#02121f 75%);
 color:var(--white);
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

body{overflow-x:hidden}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

input,textarea,select{
 width:100%;
 background:#041a2b;
 border:1px solid #155373;
 color:#edf9ff;
 border-radius:6px;
 padding:8px 9px;
 outline:none
}

input:focus,textarea:focus,select:focus{
 border-color:var(--cyan2);
 box-shadow:0 0 0 2px #19bff522
}

textarea{min-height:80px;resize:vertical}

button{
 color:inherit
}

/* =========================================================
   ANA YAPI
========================================================= */

.app{
 min-height:100vh;
 display:grid;
 grid-template-columns:220px minmax(0,1fr)
}

.sidebar{
 background:
 linear-gradient(180deg,#062440,#04192a 65%,#03131f);
 border-right:1px solid #0d4c6c;
 min-height:100vh;
 position:sticky;
 top:0;
 overflow:auto;
 z-index:30;
 box-shadow:7px 0 25px #0005
}

.brand{
 height:100px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:13px;
 border-bottom:1px solid #0d4866
}

.brand-logo{
 width:55px;
 height:55px;
 flex:0 0 auto;
 border-radius:9px;
 background:linear-gradient(145deg,#1bc8fb,#0873ad);
 display:grid;
 place-items:center;
 color:white;
 font-weight:1000;
 font-size:30px;
 font-style:italic;
 transform:skew(-8deg)
}

.brand-text b{
 display:block;
 color:#1fc2f5;
 font-size:20px;
 letter-spacing:1px
}

.brand-text span{
 display:block;
 color:#b2cbd7;
 font-size:7px;
 line-height:1.3;
 margin-top:2px
}

.side-title{
 color:#54839a;
 font-size:8px;
 font-weight:950;
 letter-spacing:1.4px;
 margin:17px 11px 7px
}

.side-btn{
 width:100%;
 border:1px solid transparent;
 background:transparent;
 color:#a9c6d2;
 text-align:left;
 border-radius:5px;
 padding:10px 12px;
 font-size:10px;
 font-weight:850;
 margin:1px 0
}

.side-btn:hover,
.side-btn.active{
 background:linear-gradient(90deg,#0b4669,#082e49);
 border-color:#126085;
 color:#fff;
 box-shadow:inset 3px 0 #24c7fa
}

.side-btn .count{
 float:right;
 color:#73a1b6
}

/* =========================================================
   ANA ALAN
========================================================= */

.main{
 min-width:0;
 padding:0 12px 45px
}

/* =========================================================
   ÜST MESKİ BAR
========================================================= */

.topbar{
 min-height:86px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 border-bottom:1px solid #0c4b69
}

.meski-brand{
 display:flex;
 align-items:center;
 gap:12px;
 min-width:240px
}

.meski-mark{
 width:68px;
 height:58px;
 position:relative;
 display:grid;
 place-items:center;
 color:#1bc5f5;
 font-size:36px;
 font-weight:1000;
 font-style:italic
}

.meski-mark:before,
.meski-mark:after{
 content:"";
 position:absolute;
 border:6px solid #12b8ec;
 border-radius:10px;
 transform:rotate(-28deg);
 width:28px;
 height:40px
}

.meski-mark:before{
 left:7px;
 top:8px;
 border-right-color:transparent;
 border-bottom-color:transparent
}

.meski-mark:after{
 right:6px;
 top:8px;
 border-left-color:transparent;
 border-bottom-color:transparent
}

.meski-title b{
 color:#1bc1f2;
 font-size:28px;
 letter-spacing:1px
}

.meski-title small{
 display:block;
 color:#b6ced9;
 font-size:8px;
 margin-top:0
}

.slogan{
 color:#32c9f4;
 font-size:11px;
 font-style:italic;
 margin-left:10px;
 line-height:1.1
}

.top-info{
 display:flex;
 align-items:center;
 gap:17px;
 justify-content:flex-end
}

.weather{
 display:flex;
 align-items:center;
 gap:8px
}

.sun{
 font-size:27px
}

.weather b{
 display:block;
 font-size:14px
}

.weather small{
 display:block;
 color:#8ba9b9;
 font-size:8px
}

.datebox{
 padding-left:15px;
 border-left:1px solid #0d4b69
}

.datebox strong{
 display:block;
 font-size:14px
}

.datebox small{
 display:block;
 color:#8ba9b9;
 font-size:8px
}

.user{
 display:flex;
 align-items:center;
 gap:7px;
 padding-left:13px;
 border-left:1px solid #0d4b69
}

.avatar{
 width:38px;
 height:38px;
 border-radius:50%;
 background:#075584;
 border:1px solid #20bdf1;
 display:grid;
 place-items:center;
 font-size:20px
}

.user b{
 display:block;
 font-size:10px
}

.user small{
 display:block;
 color:#86a6b6;
 font-size:8px
}

.exit{
 border:0;
 background:none;
 color:#b8d4df;
 font-size:25px
}

/* =========================================================
   ÜST NAV
========================================================= */

.nav{
 display:flex;
 gap:5px;
 overflow:auto;
 padding:8px 0;
 border-bottom:1px solid #0b4562
}

.nav button{
 flex:0 0 auto;
 background:#06253d;
 border:1px solid #0e4e6d;
 color:#a9c6d3;
 border-radius:6px;
 padding:9px 12px;
 font-size:9px;
 font-weight:900
}

.nav button:hover,
.nav button.active{
 background:#0789c4;
 border-color:#39cdf9;
 color:#fff
}

.search{
 min-width:180px;
 flex:1;
 max-width:260px
}

/* =========================================================
   KARTLAR
========================================================= */

.card{
 background:linear-gradient(145deg,#082b46,#041b2c);
 border:1px solid #0d5274;
 border-radius:7px;
 padding:10px;
 margin:8px 0;
 box-shadow:var(--shadow)
}

.section-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px
}

.section-head h2{
 font-size:16px
}

.section-head h3{
 font-size:10px
}

.muted{
 color:var(--muted);
 font-size:8px;
 line-height:1.45
}

.badge{
 display:inline-flex;
 align-items:center;
 gap:5px;
 border-radius:20px;
 padding:4px 7px;
 background:#0a3853;
 color:#a9e6fa;
 font-size:7px;
 font-weight:950
}

.badge.online{
 background:#075337;
 color:#62e8a8
}

.badge.warn{
 background:#4a3814;
 color:#ffd766
}

.badge.red{
 background:#4d2029;
 color:#ff8992
}

/* =========================================================
   BUTONLAR
========================================================= */

.btn{
 border:1px solid #155673;
 background:#082b43;
 color:#eaf8ff;
 border-radius:5px;
 padding:7px 10px;
 font-size:8px;
 font-weight:900
}

.btn:hover{
 border-color:#31c8f6
}

.btn.primary{
 background:linear-gradient(#12afe9,#087db8);
 border-color:#30cafa
}

.btn.ok{
 background:linear-gradient(#13c976,#079758);
 border-color:#28e598
}

.btn.red{
 background:linear-gradient(#e84755,#a72230);
 border-color:#ff6973
}

.btn.yellow{
 background:linear-gradient(#a77b18,#6d500d);
 border-color:#d8a72f
}

/* =========================================================
   ANA SCADA BAŞLIK
========================================================= */

.scada-head{
 background:linear-gradient(90deg,#072f4c,#051d31);
 border:1px solid #0e5b7e;
 border-radius:6px;
 padding:9px 12px;
 margin-top:8px
}

.scada-head h1{
 font-size:21px;
 margin:0
}

.crumb{
 color:#7da1b3;
 font-size:8px;
 margin-top:2px
}

.scada-head-right{
 display:flex;
 align-items:center;
 gap:10px
}

/* =========================================================
   GENEL ÖZET
========================================================= */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px
}

.stat{
 background:#041b2d;
 border:1px solid #0c4c6a;
 border-radius:6px;
 padding:9px
}

.stat small{
 color:#7597a9;
 font-size:7px;
 font-weight:900
}

.stat strong{
 display:block;
 color:#19c5f8;
 font-size:21px;
 margin-top:2px
}

.stat.green strong{
 color:#16dd78
}

.stat.yellow strong{
 color:#ffd04a
}

.stat span{
 color:#6f94a6;
 font-size:7px
}

/* =========================================================
   BÖLGE FİLTRELERİ
========================================================= */

.districts{
 display:flex;
 gap:5px;
 overflow:auto
}

.district{
 flex:0 0 auto;
 background:#062941;
 border:1px solid #12506d;
 color:#9dbccc;
 border-radius:5px;
 padding:7px 10px;
 font-size:8px;
 font-weight:900
}

.district.active{
 background:#078cc8;
 border-color:#38cefa;
 color:#fff
}

.filter{
 display:flex;
 gap:7px;
 margin-top:8px
}

/* =========================================================
   TERFİ LİSTESİ
========================================================= */

.group{
 margin-top:10px
}

.group-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:0 2px 5px
}

.group-title b{
 font-size:11px
}

.group-title span{
 color:#7296a8;
 font-size:8px
}

.station-grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:7px
}

.station{
 cursor:pointer;
 transition:.15s;
 min-width:0
}

.station:hover{
 transform:translateY(-2px);
 border-color:#25c8f7
}

.station h3{
 font-size:10px;
 margin:0;
 line-height:1.25
}

.station-meta{
 color:#7498aa;
 font-size:7px;
 margin-top:3px
}

.station-row{
 display:flex;
 justify-content:space-between;
 gap:7px;
 align-items:center
}

.chips{
 display:flex;
 flex-wrap:wrap;
 gap:3px;
 margin-top:7px
}

.chip{
 background:#0a3a53;
 color:#94d9ef;
 border-radius:10px;
 padding:3px 6px;
 font-size:7px;
 font-weight:900
}

/* =========================================================
   TERFİ DETAY
========================================================= */

.detail-grid{
 display:grid;
 grid-template-columns:minmax(0,1.5fr) minmax(310px,.8fr);
 gap:8px
}

.detail-left,
.detail-right{
 min-width:0
}

/* =========================================================
   KUYU / POMPA SCADA GÖRSELİ
========================================================= */

.scada-visual{
 height:435px;
 position:relative;
 overflow:hidden;
 border:1px solid #126087;
 border-radius:6px;
 background:#061c2b
}

.sky{
 position:absolute;
 inset:0 0 54% 0;
 background:
 radial-gradient(circle at 74% 23%,#82c9dc33 0 8%,transparent 9%),
 linear-gradient(180deg,#0d5875,#0b344e)
}

.mountain{
 position:absolute;
 left:-5%;
 right:-5%;
 bottom:34%;
 height:30%;
 background:#174650;
 clip-path:polygon(
 0 80%,10% 52%,17% 67%,27% 27%,36% 61%,
 47% 42%,56% 69%,67% 35%,76% 63%,87% 25%,
 100% 58%,100% 100%,0 100%
 )
}

.ground{
 position:absolute;
 inset:auto 0 0;
 height:38%;
 background:
 linear-gradient(180deg,#24452f,#0b2424)
}

.water{
 position:absolute;
 left:11%;
 right:11%;
 bottom:0;
 height:32%;
 background:
 repeating-linear-gradient(
  0deg,
  #0879a2 0 3px,
  #1597ba 4px 6px,
  #0b6c92 7px 9px
 );
 border-top:2px solid #3ed6f7
}

.water:after{
 content:"";
 position:absolute;
 left:0;
 right:0;
 top:18%;
 height:2px;
 background:#75e7ff88;
 box-shadow:
 0 22px #75e7ff44,
 0 44px #75e7ff33,
 0 66px #75e7ff22
}

.box-house{
 position:absolute;
 left:14%;
 bottom:36%;
 width:34%;
 height:24%;
 background:#d9dddf;
 border:3px solid #82939a;
 box-shadow:7px 9px 16px #0009
}

.box-door{
 position:absolute;
 left:9%;
 bottom:8%;
 width:27%;
 height:68%;
 background:#b9c0c4;
 border:2px solid #68777d
}

.box-logo{
 position:absolute;
 left:43%;
 top:39%;
 color:#0874a7;
 font-size:22px;
 font-weight:1000;
 font-style:italic
}

.pipe{
 position:absolute;
 height:10px;
 background:linear-gradient(#1685b7,#075174);
 border:2px solid #2bb8eb;
 border-radius:7px;
 box-shadow:0 0 8px #19c6fa66
}

.pipe-a{
 left:42%;
 right:5%;
 bottom:52%
}

.pipe-b{
 left:49%;
 right:5%;
 bottom:60%
}

.pipe-c{
 left:59%;
 right:19%;
 bottom:69%
}

.pipe-arrow{
 position:absolute;
 right:8%;
 bottom:56%;
 font-size:28px;
 color:#eafaff
}

.pipe-text{
 position:absolute;
 right:9%;
 bottom:62%;
 color:#d9f6ff;
 font-size:8px;
 font-weight:950;
 letter-spacing:.5px
}

.pump-unit{
 position:absolute;
 bottom:7%;
 width:43px;
 height:128px;
 border-radius:19px 19px 7px 7px;
 background:linear-gradient(90deg,#849296,#f1f3f3 43%,#89979b);
 border:2px solid #68787e;
 box-shadow:0 8px 12px #0009
}

.pump-unit:before{
 content:"";
 position:absolute;
 top:43px;
 left:7px;
 right:7px;
 height:50px;
 border:2px solid #67757a;
 border-radius:5px;
 background:#c6cdcf
}

.pump-1{left:57%}
.pump-2{left:75%}

.pump-tag{
 position:absolute;
 bottom:4%;
 background:#05253a;
 border:1px solid #16d879;
 border-radius:5px;
 padding:5px 8px;
 font-size:8px;
 text-align:center
}

.pump-tag b{
 display:block;
 color:#18e47d;
 font-size:12px
}

.pump-tag.p1{left:48%}
.pump-tag.p2{
 left:69%;
 border-color:#54798a
}

.pump-tag.p2 b{
 color:#c7d4d9
}

.scada-label{
 position:absolute;
 background:#06273e;
 border:1px solid #168dc0;
 border-radius:5px;
 padding:6px 9px;
 box-shadow:0 5px 13px #0008;
 font-size:8px
}

.scada-label b{
 display:block;
 color:#18dd7a;
 font-size:18px;
 margin-top:1px
}

.level-label{
 left:4%;
 bottom:7%
}

.pressure-label{
 right:9%;
 top:8%
}

.pressure-label b{
 color:#18dd7a
}

.water-level{
 position:absolute;
 left:5%;
 bottom:24%;
 width:12px;
 height:100px;
 border-left:3px solid #ffd44a
}

.water-level:before,
.water-level:after{
 content:"";
 position:absolute;
 left:-7px;
 width:12px;
 height:2px;
 background:#ffd44a
}

.water-level:before{top:0}
.water-level:after{bottom:0}

/* =========================================================
   SAHA BİLGİLERİ
========================================================= */

.photo-card{
 height:210px;
 position:relative;
 overflow:hidden;
 background:
 linear-gradient(180deg,#16516b 0 48%,#31503b 49% 100%);
 border:1px solid #0e5b7d;
 border-radius:6px
}

.photo-building{
 position:absolute;
 left:17%;
 bottom:22%;
 width:53%;
 height:52%;
 background:#d4d8d9;
 border:3px solid #7f9098;
 box-shadow:0 7px 15px #0009
}

.photo-building:after{
 content:"MESKİ";
 position:absolute;
 left:38%;
 top:45%;
 color:#0874a6;
 font-size:17px;
 font-weight:1000;
 font-style:italic
}

.photo-fence{
 position:absolute;
 left:8%;
 right:8%;
 bottom:12%;
 height:31%;
 border:1px solid #9fb3b1;
 background:repeating-linear-gradient(
  90deg,
  transparent 0 25px,
  #9fb3b1 26px 27px
 )
}

.photo-caption{
 position:absolute;
 left:7px;
 bottom:7px;
 background:#05273ddd;
 border:1px solid #1479a3;
 border-radius:4px;
 padding:5px 7px;
 font-size:7px;
 font-weight:900
}

.station-info{
 margin-top:7px
}

.kv{
 display:flex;
 justify-content:space-between;
 gap:8px;
 padding:5px 0;
 border-bottom:1px solid #ffffff0b;
 font-size:8px
}

.kv:last-child{border-bottom:0}

.kv span:first-child{color:#7095a8}
.kv span:last-child{
 font-weight:850;
 text-align:right
}

/* =========================================================
   METRİK KARTLARI
========================================================= */

.metrics{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-top:7px
}

.metric{
 min-height:82px;
 background:#041b2c;
 border:1px solid #0d5374;
 border-radius:6px;
 padding:9px
}

.metric-icon{
 float:left;
 font-size:22px;
 margin-right:7px
}

.metric small{
 color:#7398aa;
 font-size:7px;
 font-weight:900
}

.metric strong{
 display:block;
 color:#13c5f8;
 font-size:21px;
 margin-top:4px
}

.metric.green strong{color:#17df79}
.metric.yellow strong{color:#ffd24b}

.metric span{
 color:#789aaa;
 font-size:7px
}

/* =========================================================
   POMPA DURUMLARI
========================================================= */

.table-wrap{
 overflow:auto
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:620px
}

th,td{
 border:1px solid #104e6b;
 padding:7px;
 font-size:8px;
 text-align:left
}

th{
 background:#072c46;
 color:#a4c3d0
}

td{
 background:#041b2b
}

.run{
 color:#17e077;
 font-weight:950
}

.stop{
 color:#d9e4e9;
 font-weight:850
}

.alarm{
 color:#ff4e5c;
 font-weight:950
}

/* =========================================================
   ALT PANELLER
========================================================= */

.bottom-grid{
 display:grid;
 grid-template-columns:1fr 1fr 1.3fr;
 gap:7px
}

.alarm-row{
 display:grid;
 grid-template-columns:12px 1fr auto;
 gap:7px;
 align-items:center;
 padding:7px 0;
 border-bottom:1px solid #ffffff0a;
 font-size:8px
}

.alarm-dot{
 width:8px;
 height:8px;
 border-radius:50%;
 background:#ffd13d;
 box-shadow:0 0 8px #ffd13d66
}

.alarm-dot.red{
 background:#ff4050;
 box-shadow:0 0 8px #ff405066
}

.quick{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px
}

.quick-btn{
 min-height:60px;
 border:1px solid #0d4f70;
 background:#062640;
 border-radius:5px;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 gap:4px;
 color:#a9c8d4;
 font-size:7px;
 font-weight:900
}

.quick-btn b{
 color:#17c7fa;
 font-size:19px
}

.quick-btn:hover{
 border-color:#29c9f8;
 color:#fff
}

/* =========================================================
   POMPA SEÇİMİ
========================================================= */

.pump-selector{
 display:flex;
 gap:6px;
 overflow:auto
}

.pump-button{
 min-width:105px;
 flex:0 0 auto;
 background:#082b43;
 border:1px solid #14536f;
 border-radius:6px;
 padding:8px;
 text-align:left
}

.pump-button b{
 display:block;
 color:#18c7fa;
 font-size:17px
}

.pump-button small{
 display:block;
 color:#8eafbd;
 font-size:7px;
 margin-top:2px
}

.pump-button.active{
 background:#0a4665;
 border-color:#31ccfa;
 box-shadow:0 0 0 1px #31ccfa
}

.pump-button.running{
 background:#075337
}

.pump-button.running b{
 color:#18e278
}

/* =========================================================
   TEKNİK SEKME
========================================================= */

.system{
 padding:0;
 overflow:hidden
}

.system-head{
 padding:11px 13px;
 background:linear-gradient(90deg,#062e4b,#072239);
 border-bottom:1px solid #0e5778
}

.system-head h2{
 font-size:18px
}

.system-tabs{
 display:flex;
 gap:4px;
 overflow:auto;
 padding:6px;
 background:#031a29;
 border-bottom:1px solid #0d4c68
}

.system-tabs button{
 flex:0 0 auto;
 background:#06263d;
 border:1px solid #104d69;
 color:#9fbfce;
 border-radius:4px;
 padding:7px 9px;
 font-size:7px;
 font-weight:950
}

.system-tabs button.active{
 background:#078dc8;
 border-color:#42d1fa;
 color:#fff
}

.system-content{
 padding:0 9px 10px
}

/* =========================================================
   FORM
========================================================= */

.grid2{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:7px

/* =========================================================
   DB OLUŞTUR
========================================================= */

function makeDB(){

 return STATIONS.map(s=>{

  const pumps=[];

  for(let i=1;i<=s[5];i++){
   pumps.push(pumpTemplate(i,"P"+i))
  }

  return {
   id:s[0],
   ad:s[1],
   rtu:s[2],
   bolge:s[3],
   tip:s[4],
   address:"",
   source:"",
   outlet:"",
   depth:"",
   gps:"",
   note:"",
   history:[],
   pumps:pumps
  }
 })
}

function normalize(saved){

 const base=makeDB();

 if(!Array.isArray(saved))return base;

 const map=new Map(saved.map(s=>[s.ad,s]));

 return base.map(b=>{

  const old=map.get(b.ad);

  if(!old)return b;

  const result={
   ...b,
   ...old
  };

  result.pumps=b.pumps.map(bp=>{

   const op=(old.pumps||[]).find(p=>p.no===bp.no);

   if(!op)return bp;

   return {
    ...bp,
    ...op,
    pump:{...bp.pump,...(op.pump||{})},
    motor:{...bp.motor,...(op.motor||{})},
    driver:{...bp.driver,...(op.driver||{})},
    ssr:{...bp.ssr,...(op.ssr||{})},
    box:{...bp.box,...(op.box||{})},
    work:{...bp.work,...(op.work||{})}
   }
  });

  return result
 })
}

function load(){

 try{

  const raw=localStorage.getItem(STORE);

  if(raw){
   const x=JSON.parse(raw);

   if(Array.isArray(x)&&x.length){
    return normalize(x)
   }
  }

 }catch(e){
  console.warn(e)
 }

 return makeDB()
}

function inp(label,path,value){

 return `
 <div class="field">
  <label>${esc(label)}</label>
  <input
   data-path="${esc(path)}"
   value="${esc(value??"")}"
   ${admin?"":"readonly"}
  >
 </div>
 `
}

function txt(label,path,value){

 return `
 <div class="field">
  <label>${esc(label)}</label>
  <textarea
   data-path="${esc(path)}"
   ${admin?"":"readonly"}
  >${esc(value??"")}</textarea>
 </div>
 `
}

function setPath(obj,path,value){

 const parts=path.split(".");
 let x=obj;

 for(let i=0;i<parts.length-1;i++){

  if(!x[parts[i]]||typeof x[parts[i]]!=="object"){
   x[parts[i]]={}
  }

  x=x[parts[i]]
 }

 x[parts.at(-1)]=value
}

function formCard(title,obj,root,fields,saveFn){

 return `
 <div class="card">

  <div class="section-head">

   <div>
    <h3>${title}</h3>
    <div class="muted">
     Yalnızca seçili P${pump().no} için.
    </div>
   </div>

   ${admin?`
    <button class="btn ok" onclick="${saveFn}()">
     KAYDET
    </button>
   `:""}

  </div>

  <div class="grid3" style="margin-top:8px">

   ${fields.map(f=>
    inp(f[0],root+"."+f[1],obj[f[1]])
   ).join("")}

  </div>

 </div>
 `
}

    <h3>FREKANS TRENDİ</h3>
    <div class="muted" style="padding:60px 10px;text-align:center">
     Grafik için çalışma kaydı oluşturulmalı.
    </div>
   </div>
  `
 }

 const values=a.map(x=>Number(x.frekans_hz)||0);

 const max=Math.max(50,...values);

 const points=values.map((v,i)=>{

  const x=5+(i*(90/Math.max(1,values.length-1)));
  const y=90-(v/max*70);

  return x+","+y

 }).join(" ");

 return `
 <div class="chart">

  <div class="section-head">
   <h3>FREKANS TRENDİ</h3>
   <span class="muted">${a.length} kayıt</span>
  </div>

  <svg viewBox="0 0 100 100">

   <line x1="5" y1="90" x2="95" y2="90"></line>
   <line x1="5" y1="20" x2="5" y2="90"></line>

   <polyline points="${points}"></polyline>

  </svg>

 </div>
 `
}

function backup(){

 const blob=new Blob(
  [JSON.stringify(db,null,2)],
  {type:"application/json"}
 );

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="meski-terfi-arsiv-yedek.json";

 a.click();

 setTimeout(()=>{
  URL.revokeObjectURL(a.href)
 },500);

 toast("JSON yedeği oluşturuldu.")
}

function restore(event){

 const file=event.target.files?.[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  try{

   const data=JSON.parse(reader.result);

   if(!Array.isArray(data)){
    throw new Error("Geçersiz JSON.")
   }

   db=normalize(data);

   save();

   home();

   toast("Yedek geri yüklendi.")

  }catch(e){

   toast("Yedek okunamadı: "+e.message)

  }
 };

 reader.readAsText(file);

 event.target.value=""
}
