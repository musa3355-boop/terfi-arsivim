<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MESKİ Terfi Arşivim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#06182b;
  --card:#0d2a43;
  --card2:#10354f;
  --line:#285675;
  --blue:#36aae8;
  --green:#16bd7b;
  --red:#d04b4b;
  --text:#eef8ff;
  --muted:#9fb8ca;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

main{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:12px 12px 100px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin:10px 0;
}

.card h1,
.card h2,
.card h3{
  margin-top:0;
}

.muted{
  color:var(--muted);
}

.code{
  color:#61c9ff;
  font-weight:800;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.field{
  min-width:0;
  margin-bottom:8px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:#06182b;
  color:#fff;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--blue);
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.number-input{
  text-align:right;
}

.btn{
  border:1px solid var(--line);
  background:#164765;
  color:#fff;
  padding:10px 13px;
  border-radius:10px;
  margin:3px;
  cursor:pointer;
}

.btn.on{
  background:var(--blue);
  border-color:var(--blue);
}

.btn.ok{
  background:var(--green);
  border-color:var(--green);
}

.btn.bad{
  background:var(--red);
  border-color:var(--red);
}

.tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  position:sticky;
  top:0;
  z-index:20;
  padding:7px 3px;
  background:var(--bg);
}

.tabs .btn{
  white-space:nowrap;
}

.search{
  margin:10px 0;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

/* ==========================================================
   HMI EKRANI
========================================================== */

.hmi{
  background:#102e38;
  border-color:#315a69;
}

.hmi .field input,
.hmi .field textarea,
.hmi .field select{
  background:#eef4f7;
  color:#071a2b;
  border-color:#78919d;
}

.hmi-page{
  margin-bottom:16px;
}

.hmi-page-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:12px;
  color:#eef8ff;
}

.hmi-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

/* ==========================================================
   ÇALIŞMA
========================================================== */

.workbox{
  background:#081d31;
  border:1px solid #28516d;
  border-radius:12px;
  padding:11px;
  margin:7px 0;
}

/* ==========================================================
   SABİT KAYDET
========================================================== */

.savebar{
  position:fixed;
  z-index:100;
  bottom:0;
  left:0;
  right:0;
  padding:9px;
  background:#041321;
  border-top:1px solid #23445e;
}

.savebar button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  color:#fff;
  background:var(--green);
  font-weight:800;
}

/* ==========================================================
   PDF GÖRÜNÜMÜ
   TEK A4 YATAY SAYFA
========================================================== */

#printArea{
  display:none;
}

@media print{

  @page{
    size:A4 landscape;
    margin:3mm;
  }

  html,
  body{
    background:#fff!important;
    color:#111!important;
    margin:0!important;
    padding:0!important;
    width:100%!important;
  }

  #app,
  .savebar{
    display:none!important;
  }

  #printArea{
    display:block!important;
    width:100%!important;
    height:100%!important;
    overflow:hidden!important;
  }

  /*
     EN ÖNEMLİ KISIM:

     Burada bütün rapor TEK .pdf-one-page
     içerisinde bulunuyor.

     page-break KULLANILMIYOR.
  */

  .pdf-one-page{
    width:291mm;
    height:198mm;
    overflow:hidden;
    position:relative;
    background:#fff;
    color:#111;
    padding:3mm;
    font-family:Arial,sans-serif;
  }

  .pdf-header{
    height:13mm;
    border-bottom:1.2px solid #0b2941;
    margin-bottom:2mm;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }

  .pdf-header h1{
    margin:0;
    font-size:12px;
    color:#0b2941;
  }

  .pdf-header p{
    margin:1px 0 0;
    font-size:5.5px;
    color:#555;
  }

  .pdf-header-right{
    text-align:right;
    font-size:5.5px;
    color:#555;
  }

  /*
     ANA RAPOR:
     3 SÜTUN
  */

  .pdf-columns{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:2mm;
    height:177mm;
  }

  .pdf-column{
    min-width:0;
    overflow:hidden;
  }

  .pdf-section{
    border:0.6px solid #bfc8ce;
    border-radius:2px;
    padding:1.2mm;
    margin-bottom:1.3mm;
    overflow:hidden;
  }

  .pdf-section-title{
    font-size:6.5px;
    font-weight:800;
    color:#0b2941;
    border-bottom:0.5px solid #d8dee2;
    padding-bottom:0.7mm;
    margin-bottom:0.7mm;
  }

  .pdf-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0.5mm 1mm;
  }

  .pdf-cell{
    min-width:0;
    border-bottom:0.4px solid #e1e5e8;
    padding:0.45mm;
    overflow:hidden;
  }

  .pdf-cell b{
    display:block;
    color:#69757d;
    font-size:4.1px;
    line-height:1.1;
  }

  .pdf-cell span{
    display:block;
    color:#111;
    font-size:5px;
    line-height:1.25;
    font-weight:600;
    word-break:break-word;
  }

  .pdf-motor{
    border:0.5px solid #c3ccd1;
    border-radius:2px;
    padding:0.9mm;
    margin-bottom:0.8mm;
  }

  .pdf-motor-title{
    color:#0b2941;
    font-size:5.5px;
    font-weight:800;
    margin-bottom:0.5mm;
  }

  .pdf-small{
    font-size:4.5px;
    color:#555;
  }

  /*
     HMI PDF:
     5 HMI EKRANINI AYNI SAYFADA
  */

  .pdf-hmi-section{
    border:0.6px solid #aebbc2;
    border-radius:2px;
    padding:1mm;
    margin-bottom:1mm;
  }

  .pdf-hmi-title{
    font-size:6px;
    font-weight:800;
    color:#0b2941;
    margin-bottom:0.7mm;
  }

  .pdf-hmi-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0.5mm;
  }

  .pdf-hmi-cell{
    border:0.4px solid #d1d7db;
    border-radius:1.5px;
    padding:0.6mm;
    min-width:0;
    overflow:hidden;
  }

  .pdf-hmi-cell b{
    display:block;
    font-size:3.5px;
    color:#66737b;
    line-height:1.05;
  }

  .pdf-hmi-cell span{
    display:block;
    font-size:4.4px;
    color:#111;
    font-weight:700;
    line-height:1.2;
    word-break:break-word;
  }

  .pdf-footer{
    position:absolute;
    bottom:1mm;
    left:3mm;
    right:3mm;
    display:flex;
    justify-content:space-between;
    font-size:4.5px;
    color:#777;
  }
}

/* ==========================================================
   MOBİL
========================================================== */

@media(max-width:650px){

  .row{
    grid-template-columns:1fr;
  }

  .hmi-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  main{
    padding-left:9px;
    padding-right:9px;
  }
}

</style>

/* ==========================================================
   ESCAPE
========================================================== */

function esc(v){

  return String(v ?? "")
  .replace(/[&<>"']/g,function(m){

    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m];

  });

}


/* ==========================================================
   SAYI
========================================================== */

function numberValue(v){

  if(
    v===null ||
    v===undefined ||
    v===""
  ){
    return null;
  }

  const n=Number(
    String(v)
    .replace(",",".")
    .replace(/[^0-9.\-]/g,"")
  );

  return Number.isFinite(n)
    ? n
    : null;

}


/* ==========================================================
   INPUT
========================================================== */

function numberInput(label,key,value=""){

  return `

    <input

      data-k="${esc(key)}"
      type="number"
      inputmode="decimal"

}

function getVal(key){

/* ==========================================================
   HOME
========================================================== */

async function home(){

  const r=
  await db
  .from("terfiler")
  .select("*")
  .order("kod");

  if(r.error){

    alert(r.error.message);
    return;

  }

  const data=r.data || [];

  app.innerHTML=`

  <div class="card">

    <h1>MESKİ TERFİ ARŞİVİM</h1>

    <p class="muted">
      Merkezi saha teknik arşivi
    </p>

    <button
      class="btn ok"
      onclick="newStation()">
      ＋ YENİ TERFİ
    </button>

    <button
      class="btn"
      onclick="unlockEdit()">
      ${editMode
        ? "DÜZENLEME AÇIK"
        : "DÜZENLEME MODU"}
    </button>

  </div>

  <div class="field">

    <label>TERFİ ARA</label>

    <input
      id="stationSearch"
      type="search"
      placeholder="Terfi, kod, bölge veya adres..."
      oninput="filterStations()"
    >

  </div>

  <div id="stationList">

    ${renderStationList(data)}

  </div>

  `;

}


function renderStationList(data){

  if(!data.length){

    return `
    <div class="card empty">
      Kayıt bulunamadı.
    </div>
    `;

  }

  return data.map(x=>`

    <button
      class="card"
      style="
        width:100%;
        text-align:left;
        color:#fff;
        cursor:pointer;
      "
      onclick="openStation('${x.id}')"
    >

      <div class="code">
        ${esc(x.terfi_no || x.kod || "")}
      </div>

      <h3>
        ${esc(x.ad || "İsimsiz Terfi")}
      </h3>

      <div class="muted">
        ${esc(x.bolge || "")}
        ${x.adres
          ? " · "+esc(x.adres)
          : ""}
      </div>

    </button>

  `).join("");

}


async function filterStations(){

  const q=
  document.getElementById("stationSearch")
  ?.value
  ?.toLocaleLowerCase("tr-TR")
  || "";

  const r=
  await db
  .from("terfiler")
  .select("*")
  .order("kod");

  if(r.error)
    return;

  const filtered=
  (r.data || []).filter(x=>{

    const text=`

      ${x.ad || ""}
      ${x.kod || ""}
      ${x.terfi_no || ""}
      ${x.bolge || ""}
      ${x.adres || ""}

    `.toLocaleLowerCase("tr-TR");

    return text.includes(q);

  });

  document.getElementById("stationList")
  .innerHTML=
  renderStationList(filtered);

}

async function openStation(id){

  .select("*")

  .single();

  if(s.error){

    alert(s.error.message);
    return;

  }


  const [
    motors,
    pumps,
    drives,
    hmi,
    work,
    levels,
    services,
    faults,
    params,
    cables,
    photos,
    changes
  ]=await Promise.all([

    db
    .from("motorlar")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at"),

    db
    .from("pompalar")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at"),

    db
    .from("suruculer")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at"),

    db
    .from("hmi_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order("ekran_no"),

    db
    .from("motor_calisma_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order("captured_at",{ascending:false}),

    db
    .from("seviye_bilgileri")
    .select("*")
    .eq("terfi_id",id)
    .order("tarih",{ascending:false}),

    db
    .from("servis_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at",{ascending:false}),

    db
    .from("surucu_ariza_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order("tarih",{ascending:false}),

    db
    .from("surucu_parametre_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order("tarih",{ascending:false}),

    db
    .from("motor_box_kablolari")
    .select("*")
    .in(
      "motor_id",
      (
        motors.data || []
      ).map(x=>x.id)
    ),

    db
    .from("teknik_fotograflar")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at",{ascending:false}),

    db
    .from("degisiklik_gecmisi")
    .select("*")
    .eq("terfi_id",id)
    .order("tarih",{ascending:false})

  ]);


  current={

    s:s.data,

    m:motors.data || [],

    p:pumps.data || [],

    d:drives.data || [],

    h:hmi.data || [],

    w:work.data || [],

    levels:levels.data || [],

    services:services.data || [],

    faults:faults.data || [],

    params:params.data || [],

    cables:cables.data || [],

    photos:photos.data || [],

    changes:changes.data || []

  };


  if(
    !workMotor ||
    !current.m.some(
      x=>x.id===workMotor
    )
  ){

    workMotor=
      current.m[0]?.id || null;

  }


  currentTab="terfi";

  renderStation();

}

   STATION

function renderStation(){

  const s=current.s;

  const tabs=[

    ["terfi","Terfi"],

    ["motor","Motorlar"],

    ["pompa","Pompa"],

    ["surucu","Sürücüler"],

    ["calisma","Çalışma"],

    ["hmi","HMI / PLC"]

  ];


  app.innerHTML=`

  <button
    class="btn"
    onclick="home()">
    ← TERFİLER
  </button>

  <button
    class="btn ok"
    onclick="makePDF()">
    📄 PDF AKTAR
  </button>


  <div class="card">

    <div class="code">
      ${esc(
        s.terfi_no ||
        s.kod ||
        ""
      )}
    </div>

    <h2>
      ${esc(s.ad || "")}
    </h2>

    <div class="muted">

      ${esc(s.bolge || "")}

      ${s.adres
        ? " · "+esc(s.adres)
        : ""}

    </div>

  </div>


  <div class="tabs">

    ${
      tabs.map(t=>`

      <button
        class="btn ${
          currentTab===t[0]
          ? "on"
          : ""
        }"
        onclick="
          currentTab='${t[0]}';
          renderStation();
        "
      >
        ${t[1]}
      </button>

      `).join("")
    }

  </div>


  ${renderBody()}

  `;

function unlockEdit(){

  overlay.style.cssText=`

    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

  `;


  const box=
    document.createElement("div");


  box.style.cssText=`

    background:#0d2945;
    border:1px solid #285675;
    border-radius:18px;
    padding:22px;
    width:100%;
    max-width:330px;
    text-align:center;

  `;


  box.innerHTML=`

    <h3>DÜZENLEME MODU</h3>

    <p style="color:#9fb8ca">
      Yönetici şifresini girin.
    </p>

  `;


  const input=
    document.createElement("input");


  /*
    iPhone:
    sadece rakam klavyesi
  */

  input.type="tel";

  input.inputMode="numeric";

  input.pattern="[0-9]*";

  input.maxLength=4;

  input.autocomplete="one-time-code";

  input.placeholder="••••";


  input.style.cssText=`

    width:100%;
    padding:15px;
    text-align:center;
    font-size:30px;
    letter-spacing:8px;
    border-radius:11px;
    border:1px solid #36aae8;
    background:#06182b;
    color:#fff;
    outline:none;

  `;


  const btn=
    document.createElement("button");


  btn.textContent="GİRİŞ";

  btn.className="btn ok";

  btn.style.width="100%";

  btn.style.marginTop="12px";


  box.appendChild(input);

  box.appendChild(btn);

  overlay.appendChild(box);

  document.body.appendChild(overlay);


  input.focus();


  function check(){

    if(input.value==="6872"){

      editMode=true;

      overlay.remove();

      if(current)
        renderStation();
      else
        home();

    }else{

      input.value="";

      input.focus();

      alert("Şifre yanlış.");

    }

  }


  btn.onclick=check;


  input.addEventListener(
    "keydown",
    e=>{

      if(e.key==="Enter")
        check();

    }
  );

}

                      x.aciklama ||
                      ""
                    )}

                  </span>

                </div>

                `)
                .join("")
              }

            </div>
            `
            :
            `<div class="pdf-small">
              Değişiklik geçmişi yok.
            </div>`
          )
        }


        ${
          pdfSection(
            "TEKNİK FOTOĞRAFLAR",

            current.photos.length
            ?
            `
            <div class="pdf-grid">

              ${
                current.photos
                .slice(0,20)
                .map(x=>`

                <div class="pdf-cell">

                  <b>
                    ${esc(
                      x.kategori ||
                      "Genel"
                    )}
                  </b>

                  <span>

                    ${esc(
                      x.baslik ||
                      x.aciklama ||
                      "Fotoğraf"
                    )}

                  </span>

                </div>

                `)
                .join("")
              }

            </div>
            `
            :
            `<div class="pdf-small">
              Fotoğraf kaydı yok.
            </div>`
          )
        }


      </div>


    </div>


    <div class="pdf-footer">

      <span>
        MESKİ Terfi Arşivim · Merkezi Teknik Arşiv
      </span>

      <span>
        ${esc(
          s.terfi_no ||
          s.kod ||
          ""
        )}
        · TEK SAYFA
      </span>

    </div>


  </div>

  `;

}
