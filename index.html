<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a2d">
<title>MESKİ Terfi Arşivim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#061a2d;
 --bg2:#09233b;
 --card:#0c2a45;
 --card2:#102f4d;
 --line:#285573;
 --line2:#3a769d;
 --text:#eff8ff;
 --muted:#9eb9cc;
 --blue:#2eacef;
 --blue2:#6dd0ff;
 --ok:#18bd82;
 --danger:#df4e5b;
 --warn:#e0a62f;
 --shadow:0 12px 32px rgba(0,0,0,.22);
 --radius:16px;
 --scale:1;
}

*{
 box-sizing:border-box
}

html{
 scroll-behavior:smooth
}

body{
 margin:0;
 min-height:100vh;
 background:
  radial-gradient(circle at top right,rgba(46,172,239,.11),transparent 28%),
  linear-gradient(145deg,#041525,#09233b 60%,#071a2d);
 color:var(--text);
 font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

body.zoom-small{
 --scale:.88
}

body.zoom-large{
 --scale:1.12
}

button,
input,
textarea,
select{
 font:inherit
}

button{
 cursor:pointer;
 -webkit-tap-highlight-color:transparent
}

input[type=number]{
 appearance:textfield
}

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{
 appearance:none;
 margin:0
}

.hidden{
 display:none!important
}

#app{
 min-height:100vh
}

.wrap{
 max-width:1450px;
 margin:auto;
 padding:12px 14px 105px
}

h1,
h2,
h3,
h4{
 margin:0 0 10px
}

.card{
 background:linear-gradient(145deg,rgba(12,42,69,.99),rgba(8,30,50,.99));
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:15px;
 margin:10px 0;
 box-shadow:var(--shadow)
}

.row{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px
}

.row3{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px
}

.row4{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px
}

.grid2{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:9px
}

.grid4{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:9px
}

.field{
 min-width:0
}

.field label{
 display:block;
 font-size:11px;
 font-weight:750;
 color:var(--muted);
 margin-bottom:5px
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:12px;
 background:#061a2d;
 color:#fff;
 border:1px solid var(--line);
 border-radius:10px;
 outline:none;
 min-height:44px
}

.field textarea{
 min-height:90px;
 resize:vertical
}

.field input:focus,
.field textarea:focus,
.field select:focus{
 border-color:var(--blue);
 box-shadow:0 0 0 3px rgba(46,172,239,.11)
}

.btn{
 min-height:44px;
 padding:10px 14px;
 border:1px solid var(--line);
 border-radius:10px;
 background:#154664;
 color:#fff;
 margin:3px;
 cursor:pointer;
 font-weight:800;
 transition:.16s;
 touch-action:manipulation
}

.btn:hover{
 border-color:var(--blue2);
 transform:translateY(-1px)
}

.btn:active{
 transform:scale(.97)
}

.btn.primary{
 background:linear-gradient(145deg,#2eacef,#197fb8);
 border-color:#4ec1fa
}

.btn.on{
 background:var(--blue);
 border-color:var(--blue)
}

.btn.ok{
 background:linear-gradient(145deg,#18bd82,#0e9164);
 border-color:#2bd59a
}

.btn.bad{
 background:linear-gradient(145deg,#df4e5b,#b73d49);
 border-color:#f06a75
}

.btn.warn{
 background:linear-gradient(145deg,#87631f,#695019);
 border-color:#a8802e
}

.btn.big{
 min-height:50px;
 padding:13px 16px;
 font-weight:950
}

.btn:disabled{
 opacity:.55;
 cursor:not-allowed
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap
}

.top-left{
 display:flex;
 align-items:center;
 gap:10px;
 flex-wrap:wrap
}

.top-right{
 display:flex;
 align-items:center;
 gap:6px;
 flex-wrap:wrap;
 justify-content:flex-end
}

.logo{
 width:48px;
 height:48px;
 display:grid;
 place-items:center;
 border-radius:14px;
 background:linear-gradient(145deg,#168fe2,#075fae);
 font-size:24px;
 font-weight:950;
 box-shadow:0 8px 22px rgba(15,144,224,.24)
}

.page-title{
 font-size:calc(22px * var(--scale));
 font-weight:950;
 letter-spacing:.2px
}

.page-sub{
 color:var(--muted);
 font-size:12px;
 line-height:1.45
}

.badge{
 display:inline-block;
 padding:6px 9px;
 border-radius:999px;
 background:#163f59;
 color:#9edcff;
 font-size:10px;
 font-weight:850
}

.badge.ok{
 background:#104b39;
 color:#8bf0bf
}

.badge.warn{
 background:#574119;
 color:#ffd87c
}

.badge.location{
 background:#163d54;
 color:#7fd9ff
}

.badge.danger{
 background:#52242b;
 color:#ff9ea7
}

.admin-status{
 display:inline-block;
 padding:7px 9px;
 border-radius:999px;
 background:#104b39;
 color:#8bf0bf;
 font-size:10px;
 font-weight:800
}

.nav{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding:6px 0 10px;
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(5,20,35,.95);
 backdrop-filter:blur(12px);
 scrollbar-width:none
}

.nav::-webkit-scrollbar{
 display:none
}

.nav .btn{
 white-space:nowrap;
 flex:0 0 auto;
 margin:0
}

.station{
 background:linear-gradient(145deg,#0b2945,#0a2137);
 border:1px solid #2a5775;
 border-radius:15px;
 padding:15px;
 margin:9px 0;
 cursor:pointer;
 transition:.16s;
 box-shadow:0 8px 20px rgba(0,0,0,.12)
}

.station:hover{
 border-color:var(--blue);
 transform:translateY(-1px)
}

.station:active{
 transform:scale(.995)
}

.station-title{
 font-weight:950;
 font-size:18px
}

.station-meta{
 font-size:12px;
 color:var(--muted);
 margin-top:4px
}

.station-badges{
 display:flex;
 gap:6px;
 flex-wrap:wrap;
 margin-top:9px
}

.station-actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:10px
}

.station-actions .btn{
 margin:0
}

.summary{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:10px
}

.stat{
 border:1px solid var(--line);
 border-radius:13px;
 background:#0a2138;
 padding:14px
}

.stat-label{
 font-size:11px;
 color:var(--muted)
}

.stat-value{
 font-size:25px;
 font-weight:950;
 margin-top:5px
}

.stat-unit{
 font-size:10px;
 color:#7591a5
}

.section-title{
 font-size:17px;
 font-weight:950;
 margin-bottom:10px
}

.section-sub{
 color:var(--muted);
 font-size:11px;
 line-height:1.55
}

.workbox{
 background:#081b30;
 border:1px solid #274c67;
 border-radius:12px;
 padding:12px;
 margin:8px 0
}

.workbox h4{
 font-size:12px;
 color:#b5cad7
}

.empty{
 padding:18px;
 color:var(--muted);
 border:1px dashed #34536b;
 border-radius:10px;
 text-align:center
}

.motor-card,
.driver-card,
.pump-card,
.fault-card,
.param-card,
.history-card{
 background:#091827;
 border:1px solid #203b56;
 border-radius:14px;
 padding:13px;
 margin:9px 0
}

.motor-header,
.driver-header,
.pump-header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:10px
}

.library-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px
}

.library-card{
 background:#091827;
 border:1px solid #203b56;
 border-radius:14px;
 padding:13px;
 transition:.15s
}

.library-card:hover{
 border-color:var(--blue)
}

.library-code{
 font-size:20px;
 font-weight:950;
 color:#67c9ff;
 cursor:pointer
}

.library-name{
 font-weight:900;
 margin-top:3px;
 cursor:pointer
}

.library-desc{
 font-size:12px;
 color:#a9bbcd;
 line-height:1.5;
 margin-top:7px;
 cursor:pointer
}

.library-source{
 font-size:10px;
 color:#71879b;
 margin-top:8px;
 cursor:pointer
}

.library-driver{
 display:inline-block;
 margin-top:8px;
 padding:6px 8px;
 border-radius:999px;
 background:#123b52;
 border:1px solid #285d78;
 color:#8fdcff;
 font-size:10px;
 font-weight:800
}

.library-actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:10px
}

.library-actions .btn{
 margin:0
}

.param-row-actions{
 display:flex;
 gap:5px;
 flex-wrap:wrap;
 margin-top:8px
}

.param-row-actions .btn{
 margin:0
}

.quick-library-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap
}

.quick-library-card{
 background:#091827;
 border:1px solid #203b56;
 border-radius:14px;
 padding:13px
}

.quick-library-card h3{
 font-size:15px
}

.quick-library-list{
 display:grid;
 gap:8px;
 margin-top:10px
}

.quick-library-item{
 border:1px solid #214159;
 border-radius:11px;
 background:#081b30;
 padding:10px
}

.quick-library-main{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:10px;
 flex-wrap:wrap
}

.quick-library-code{
 color:#67c9ff;
 font-size:14px;
 font-weight:950
}

.quick-library-name{
 font-size:12px;
 font-weight:900;
 margin-top:3px
}

.quick-library-meta{
 color:#91adbf;
 font-size:10px;
 margin-top:4px;
 line-height:1.45
}

.quick-library-driver{
 color:#8bf0bf;
 font-size:10px;
 font-weight:800;
 margin-top:7px
}

.quick-library-actions{
 display:flex;
 gap:4px;
 flex-wrap:wrap
}

.quick-library-actions .btn{
 margin:0;
 min-height:38px;
 padding:7px 9px;
 font-size:11px
}

.hmi-shell{
 border:1px solid #335563;
 border-radius:14px;
 background:#102a34;
 padding:13px
}

.hmi-tabs{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding-bottom:8px;
 scrollbar-width:none
}

.hmi-tabs::-webkit-scrollbar{
 display:none
}

.hmi-tab{
 flex:0 0 auto;
 min-height:44px;
 padding:10px 14px;
 border:1px solid #466d7d;
 border-radius:9px;
 background:#163745;
 color:#a9cad9;
 cursor:pointer;
 font-weight:800
}

.hmi-tab.active{
 background:var(--blue);
 color:#fff;
 border-color:var(--blue)
}

.hmi-fields{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px;
 align-items:start;
 margin-top:12px
}

.hmi-column{
 min-width:0
}

.hmi-column-title{
 color:#8cb9c9;
 font-size:10px;
 font-weight:900;
 margin:0 0 7px 2px;
 text-transform:uppercase
}

.hmi-field{
 background:#0b222c;
 border:1px solid #264c5a;
 border-radius:10px;
 padding:9px;
 margin-bottom:8px
}

.hmi-field label{
 display:block;
 color:#a6c6d3;
 font-size:10px;
 font-weight:800;
 margin-bottom:5px;
 line-height:1.35
}

.hmi-field input{
 width:100%;
 min-height:44px;
 padding:10px;
 border-radius:8px;
 border:1px solid #597885;
 background:#f5f9fb;
 color:#061828
}

.hmi-layout-note{
 margin-top:10px;
 padding:9px;
 border:1px dashed #396273;
 border-radius:9px;
 color:#86abba;
 font-size:10px;
 line-height:1.5
}

.box-grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px
}

.box-node{
 background:#071827;
 border:1px solid #2c536b;
 border-radius:12px;
 padding:11px
}

.box-node h4{
 color:#a9cad9;
 margin-bottom:8px
}

.box-table{
 width:100%;
 border-collapse:collapse;
 overflow:hidden;
 border-radius:10px
}

.box-table th,
.box-table td{
 border:1px solid #294d64;
 padding:8px;
 font-size:11px;
 vertical-align:top
}

.box-table th{
 background:#123550;
 color:#9fd7ef;
 text-align:left
}

.box-table input{
 width:100%;
 min-height:40px;
 background:#071a2f;
 color:#fff;
 border:1px solid #315670;
 border-radius:7px;
 padding:8px
}

.photo-grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:9px
}

.photo-item{
 border:1px solid #284c63;
 border-radius:10px;
 overflow:hidden;
 background:#081726
}

.photo-item img{
 width:100%;
 height:160px;
 object-fit:cover;
 display:block
}

.photo-caption{
 padding:8px;
 font-size:10px;
 color:var(--muted);
 line-height:1.45
}

.location-card{
 border:1px solid #23536b;
 border-radius:14px;
 background:
  radial-gradient(circle at top right,rgba(46,172,239,.09),transparent 40%),
  #081d30;
 padding:13px
}

.location-main{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:12px;
 flex-wrap:wrap
}

.location-coords{
 font-size:13px;
 font-weight:900;
 color:#77d4ff;
 line-height:1.55
}

.location-meta{
 color:var(--muted);
 font-size:10px;
 margin-top:4px
}

.location-actions{
 display:flex;
 flex-wrap:wrap;
 gap:5px
}

.location-actions .btn{
 margin:0
}

.tag-grid{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:8px
}

.tag{
 border:1px solid #34566c;
 background:#102b40;
 color:#a9c9d8;
 padding:7px 9px;
 border-radius:999px;
 font-size:10px;
 font-weight:800
}

.tag.active{
 border-color:#2bbf91;
 color:#8bf0bf;
 background:#104b39
}

.detail-banner{
 background:linear-gradient(145deg,#0a2842,#0a2137);
 border:1px solid #2b5873;
 border-radius:13px;
 padding:12px
}

.detail-grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:9px
}

.detail-card{
 background:#091827;
 border:1px solid #203b56;
 border-radius:12px;
 padding:11px
}

.detail-label{
 font-size:10px;
 color:#7996a7;
 text-transform:uppercase;
 font-weight:800
}

.detail-value{
 font-size:14px;
 font-weight:900;
 margin-top:5px;
 color:#dff5ff
}

.bottom-save{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 z-index:80;
 padding:9px;
 background:rgba(5,20,35,.97);
 border-top:1px solid #18364f;
 box-shadow:0 -8px 30px rgba(0,0,0,.18)
}

.bottom-save button{
 width:100%;
 min-height:52px;
 padding:14px;
 border:0;
 border-radius:11px;
 background:linear-gradient(145deg,#18bd82,#0d9665);
 color:#fff;
 font-weight:950;
 cursor:pointer;
 font-size:15px
}

.modal-backdrop{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.78);
 z-index:9999;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px
}

.modal{
 width:min(700px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0d2945;
 border:1px solid #28506e;
 border-radius:17px;
 padding:18px;
 box-shadow:0 25px 80px rgba(0,0,0,.45);
 position:relative
}

.modal h2{
 font-size:19px
}

.modal-head{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:10px
}

.modal-head h2{
 margin:0;
 padding-right:8px
}

.modal-close{
 width:42px;
 height:42px;
 flex:0 0 42px;
 border:1px solid #44637a;
 border-radius:10px;
 background:#172f45;
 color:#fff;
 font-size:21px;
 font-weight:900;
 cursor:pointer;
 display:grid;
 place-items:center;
 line-height:1
}

.modal-close:hover{
 background:var(--danger);
 border-color:var(--danger)
}

.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:6px;
 flex-wrap:wrap;
 margin-top:12px
}

.toast{
 position:fixed;
 left:50%;
 bottom:78px;
 transform:translateX(-50%) translateY(10px);
 z-index:11000;
 background:#102f4d;
 border:1px solid #47718d;
 padding:11px 15px;
 border-radius:999px;
 opacity:0;
 pointer-events:none;
 transition:.2s;
 font-size:12px;
 max-width:92vw;
 text-align:center
}

.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0)
}

.login-wrap{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:
  radial-gradient(circle at top right,rgba(56,169,232,.12),transparent 30%),
  linear-gradient(145deg,#06172a,#0a2138)
}

.login-card{
 width:min(440px,100%);
 background:#0d2945;
 border:1px solid #28506e;
 border-radius:20px;
 padding:22px;
 box-shadow:0 30px 90px rgba(0,0,0,.35)
}

.login-logo{
 width:70px;
 height:70px;
 border-radius:18px;
 background:linear-gradient(145deg,#168fe2,#075fae);
 display:grid;
 place-items:center;
 margin:0 auto 15px;
 font-size:32px;
 font-weight:950
}

.login-title{
 text-align:center;
 font-size:24px;
 font-weight:950
}

.login-sub{
 text-align:center;
 color:var(--muted);
 font-size:12px;
 line-height:1.5;
 margin:6px 0 18px
}

.numeric{
 text-align:center;
 letter-spacing:8px;
 font-size:25px!important
}

.settings-grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px
}

.setting{
 background:#091827;
 border:1px solid #203b56;
 border-radius:12px;
 padding:12px
}

.setting h4{
 margin-bottom:8px;
 font-size:12px
}

.history-list{
 max-height:390px;
 overflow:auto
}

.history-card{
 padding:10px
}

.history-date{
 font-size:10px;
 color:#7896a8
}

.history-title{
 font-weight:900;
 font-size:12px;
 margin-top:3px
}

.kpi{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:8px
}

.kpi span{
 border:1px solid #34546b;
 padding:5px 8px;
 border-radius:999px;
 font-size:10px;
 color:#9fc2d2
}

/* PRINT */

.print-only{
 display:none
}

@media(max-width:1100px){

 .summary{
  grid-template-columns:repeat(3,1fr)
 }

 .detail-grid{
  grid-template-columns:repeat(2,1fr)
 }

}

@media(max-width:900px){

 .grid4{
  grid-template-columns:repeat(2,1fr)
 }

 .photo-grid{
  grid-template-columns:repeat(2,1fr)
 }

 .box-grid{
  grid-template-columns:repeat(2,minmax(0,1fr))
 }

 .hmi-fields{
  grid-template-columns:repeat(2,minmax(0,1fr))
 }

}

@media(max-width:650px){

 .wrap{
  padding:10px 10px 100px
 }

 .row,
 .row3,
 .row4,
 .grid2,
 .grid3,
 .grid4{
  grid-template-columns:1fr
 }

 .summary{
  grid-template-columns:repeat(2,1fr)
 }

 .library-grid{
  grid-template-columns:1fr
 }

 .hmi-fields{
  grid-template-columns:1fr
 }

 .settings-grid{
  grid-template-columns:1fr
 }

 .photo-grid{
  grid-template-columns:1fr 1fr
 }

 .box-grid{
  grid-template-columns:1fr
 }

 .detail-grid{
  grid-template-columns:1fr
 }

 .top-right{
  width:100%;
  justify-content:flex-start
 }

 .top-right .btn{
  min-height:46px
 }

 .page-title{
  font-size:20px
 }

 .station-title{
  font-size:17px
 }

 .modal{
  padding:15px
 }

 .station-actions .btn{
  width:100%
 }

}

@media print{

 @page{
  size:A4 landscape;
  margin:3mm
 }

 html,
 body{
  width:100%;
  min-height:0;
  background:#fff!important;
  color:#111!important
 }

 #app,
 .bottom-save,
 .toast{
  display:none!important
 }

 .print-only{
  display:block!important
 }

/* =========================================================
   ADMIN SESSION
========================================================= */

function getSession(){

 try{

  return JSON.parse(
   sessionStorage.getItem(
    ADMIN_SESSION_KEY
   )||'null'
  );

 }catch(e){

  return null;

 }
}

function setSession(){

 const s={
  active:true,
  lastActivity:Date.now()
 };

 sessionStorage.setItem(
  ADMIN_SESSION_KEY,
  JSON.stringify(s)
 );

 armAdminTimeout();

}

function touchAdminSession(){

 if(!edit)
  return;

 const s=
  getSession();

 if(!s?.active){

  edit=false;

  return;

 }

 s.lastActivity=
  Date.now();

 sessionStorage.setItem(
  ADMIN_SESSION_KEY,
  JSON.stringify(s)
 );

 armAdminTimeout();

}

function clearAdminSession(){

 edit=false;

 clearTimeout(
  adminTimer
 );

 adminTimer=null;

 try{

  sessionStorage.removeItem(
   ADMIN_SESSION_KEY
  );

 }catch(e){}

}

function restoreAdminSession(){

 const s=
  getSession();

 if(!s?.active){

  edit=false;

  return false;

 }

 const age=
  Date.now()-
  Number(
   s.lastActivity||0
  );

 if(
  age>=ADMIN_IDLE_MS
 ){

  clearAdminSession();

  return false;

 }

 edit=true;

 armAdminTimeout();

 return true;

}

function armAdminTimeout(){

 clearTimeout(
  adminTimer
 );

 if(!edit)
  return;

 const s=
  getSession();

 if(!s){

  edit=false;

  return;

 }

 const remaining=
  ADMIN_IDLE_MS-
  (
   Date.now()-
   Number(
    s.lastActivity||0
   )
  );

 if(remaining<=0){

  lockAdminForTimeout();

  return;

 }

 adminTimer=
  setTimeout(
   checkAdminTimeout,
   Math.min(
    remaining,
    15000
   )
  );

}

function checkAdminTimeout(){

 if(!edit)
  return;

 const s=
  getSession();

 if(!s){

  lockAdminForTimeout();

  return;

 }

 const age=
  Date.now()-
  Number(
   s.lastActivity||0
  );

 if(age>=ADMIN_IDLE_MS){

  lockAdminForTimeout();

 }else{

  armAdminTimeout();

 }

}

function lockAdminForTimeout(){

 clearAdminSession();

 toast(
  'Yönetici oturumu zaman aşımı nedeniyle kilitlendi.'
 );

 if(current){

  render();

 }else{

  home();

 }

}

async function countTable(
 table,
 ids
){

 if(!ids.length)
  return 0;

 const r=
  await db
   .from(table)
   .select('id,terfi_id')
   .in(
    'terfi_id',
    ids
   );

 if(r.error)
  return 0;

 return (
  r.data||[]
 ).length;

}

function requestLocation(){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(!navigator.geolocation){

  toast(
   'Bu cihazda GPS konumu desteklenmiyor.'
  );

  return;

 }

 toast(
  'Konum alınıyor...'
 );

 navigator.geolocation.getCurrentPosition(

  position=>{

   const lat=
    Number(
     position.coords.latitude
    );

   const lng=
    Number(
     position.coords.longitude
    );

   const accuracy=
    Number(
     position.coords.accuracy||0
    );

   const loc={

    lat,
    lng,
    accuracy,

    date:
     now(),

    iso:
     new Date().toISOString()

   };

   terfiLocations[
    current.s.id
   ]=
    loc;

   saveLocal(
    LOCAL_LOCATION_KEY,
    terfiLocations
   );

   current.location=
    loc;

   recordHistory(
    'KONUM KAYDEDİLDİ',
    `${lat.toFixed(6)}, ${lng.toFixed(6)} · ±${Math.round(accuracy)} m`
   );

   render();

   toast(
    'Terfi konumu kaydedildi.'
   );

  },

  error=>{

   let message=
    'Konum alınamadı.';

   if(error?.code===1){

    message=
     'Konum izni verilmedi. Tarayıcı ayarlarından konum iznini aç.';

   }

   if(error?.code===2){

    message=
     'Konum bilgisi alınamadı. GPS/Wi-Fi konumunu kontrol et.';

   }

   if(error?.code===3){

    message=
     'Konum alma zaman aşımına uğradı. Tekrar dene.';

   }

   toast(
    message
   );

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }

 );

}

   .insert({

     current.s.id,

    ad:
     `${current.m.length+1}. Motor`

   })
   .select()
   .single();

 if(r.error){

  );

  return;

 }

 recordHistory(

 );

 );

async function deleteMotor(
 id
){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(!confirm(
  'Bu motor ve bağlı sürücü ilişkisi silinsin mi?'
 ))
  return;

 const d=
  current.d.find(
   x=>x.motor_id===id
  );

 if(d){

  const ur=
   await db
    .from('suruculer')
    .update({
     motor_id:null
    })
    .eq(
     'id',
     d.id
    );

  if(ur.error){

   alert(
    ur.error.message
   );

   return;

  }

 }

 const r=
  await db
   .from('motorlar')
   .delete()
   .eq(
    'id',
    id
   );

 if(r.error){

  alert(
   r.error.message
  );

  return;

 }

 delete localBoxes[id];

 saveLocal(
  LOCAL_BOX_KEY,
  localBoxes
 );

 recordHistory(
  'MOTOR SİLİNDİ',
  id
 );

 await openStation(
  current.s.id
 );

}

function blankTerm(){

 return {
  renk:'',
  detay:'',
  etiket:''
 };

}

function defaultBox(){

 return {

  motor:{
   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()
  },

  box_motor:{
   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()
  },

  box_surucu:{
   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()
  },

  surucu:{
   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()
  }

 };

}

function normalizeBox(
 b
){

 const d=
  defaultBox();

 return {

  motor:{
   u:{...d.motor.u,...(b?.motor?.u||{})},
   v:{...d.motor.v,...(b?.motor?.v||{})},
   w:{...d.motor.w,...(b?.motor?.w||{})}
  },

  box_motor:{
   u:{...d.box_motor.u,...(b?.box_motor?.u||{})},
   v:{...d.box_motor.v,...(b?.box_motor?.v||{})},
   w:{...d.box_motor.w,...(b?.box_motor?.w||{})}
  },

  box_surucu:{
   u:{...d.box_surucu.u,...(b?.box_surucu?.u||{})},
   v:{...d.box_surucu.v,...(b?.box_surucu?.v||{})},
   w:{...d.box_surucu.w,...(b?.box_surucu?.w||{})}
  },

  surucu:{
   u:{...d.surucu.u,...(b?.surucu?.u||{})},
   v:{...d.surucu.v,...(b?.surucu?.v||{})},
   w:{...d.surucu.w,...(b?.surucu?.w||{})}
  }

 };

}

function getBox(
 id
){

 localBoxes[id]=
  normalizeBox(
   localBoxes[id]

 return localBoxes[id];

}

async function addPump(){

  await db
   .from('pompalar')
   .insert({

async function deletePump(
 id
){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(!confirm(
  'Pompa silinsin mi?'
 ))

  await db
   .from('pompalar')
   .delete()
   .eq(

  );

 recordHistory(

function filterParams(){

}

function addPhotos(
 event
){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 const files=[
  ...(event.target.files||[])
 ];

 if(!files.length)
  return;

 let pending=
  files.length;

 files.forEach(
  file=>{

   const reader=
    new FileReader();

   reader.onload=
    ()=>{

     localPhotos[
      current.s.id
     ] ||=
      [];

     localPhotos[
      current.s.id
     ].push({

      name:file.name,
      type:file.type,
      data:reader.result,
      date:now()

     });

     pending--;

     if(pending===0){

      saveLocal(
       LOCAL_PHOTO_KEY,
       localPhotos
      );

      recordHistory(
       'FOTOĞRAF EKLENDİ',
       `${files.length} fotoğraf`
      );

      render();

     }

    };

   reader.readAsDataURL(
    file
   );

  }
 );

}

function openModal(
 html
){

 closeModal();

 const wrap=
  document.createElement(
   'div'
  );

 wrap.className=
  'modal-backdrop';

 wrap.id=
  'modalRoot';

 wrap.innerHTML=`

  <div
   class="modal"
   onclick="event.stopPropagation()">

   <div class="modal-head">

    <h2>
     ${getModalTitle(html)}
    </h2>

    <button
     class="modal-close"
     type="button"
     aria-label="Kapat"
     onclick="closeModal()">

     ✕

    </button>

   </div>

   <div id="modalContent">

    ${removeFirstH2(html)}

   </div>

  </div>

 `;

 document.body.appendChild(
  wrap
 );

 wrap.addEventListener(
  'click',
  function(e){

   if(e.target===wrap){

    closeModal();

   }

  }
 );

}

function getModalTitle(
 html
){

 try{

  const holder=
   document.createElement(
    'div'
   );

  holder.innerHTML=
   html;

  const h2=
   holder.querySelector(
    'h2'
   );

  return h2
   ?
   h2.textContent.trim()
   :
   '';

 }catch(e){

  return '';

 }

}

function removeFirstH2(
 html
){

 try{

  const holder=
   document.createElement(
    'div'
   );

  holder.innerHTML=
   html;

  const h2=
   holder.querySelector(
    'h2'
   );

  if(h2)
   h2.remove();

  return holder.innerHTML;

 }catch(e){

  return html;

 }

}

function closeModal(){

 document
  .getElementById(
   'modalRoot'
  )
  ?.remove();

}

async function deleteTerfi(){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(!current?.s?.id)
  return;

 const s=
  current.s;

 if(!confirm(
  `"${s.ad||'Bu terfi'}" tamamen silinsin mi?\n\n`+
  `Bağlı motor, pompa, sürücü, HMI, çalışma `+
  `ve terfi parametre kayıtları da silinebilir.\n\n`+
  `GERİ ALINAMAZ.`
 ))
  return;

 const id=
  s.id;

 try{

  const mr=
   await db
    .from('motorlar')
    .select('id')
    .eq(
     'terfi_id',
     id
    );

  if(mr.error)
   throw mr.error;

  const motorIds=
   (mr.data||[])
    .map(
     x=>x.id
    );

  for(
   const mid of motorIds
  ){

   delete localBoxes[mid];

  }

  saveLocal(
   LOCAL_BOX_KEY,
   localBoxes
  );


  const terfiTables=[

   'motor_calisma_kayitlari',
   'hmi_kayitlari',
   'hmi_ayarlar',
   'ekran_ayarlari',
   'ekran_verileri',
   'anlik_calisma_verileri',
   'terfi_parametreleri',
   'servis_kayitlari',
   'bakim_kayitlari',
   'teknik_fotograflar',
   'fotograflar',
   'olcumler',
   'olcum_kayitlari',
   'panolar',
   'seviye_bilgileri',
   'degisiklik_gecmisi',
   'ariza_notlari',
   'kablo_baglantilari'

  ];

  for(
   const table of terfiTables
  ){

   try{

    await db
     .from(table)
     .delete()
     .eq(
      'terfi_id',
      id
     );

   }catch(e){

    console.warn(
     'Tablo silme atlandı:',
     table,
     e
    );

   }

  }


  const dr=
   await db
    .from('suruculer')
    .select('id')
    .eq(
     'terfi_id',
     id
    );

  if(dr.error)
   throw dr.error;

  for(
   const d of dr.data||[]
  ){

   try{

    await db
     .from(
      'surucu_ariza_kayitlari'
     )
     .delete()
     .eq(
      'surucu_id',
      d.id
     );

   }catch(e){}

   try{

    await db
     .from(
      'surucu_parametre_kayitlari'
     )
     .delete()
     .eq(
      'surucu_id',
      d.id
     );

   }catch(e){}

   const r=
    await db
     .from('suruculer')
     .delete()
     .eq(
      'id',
      d.id
     );

   if(r.error)
    throw r.error;

  }


  for(
   const mid of motorIds
  ){

   const r=
    await db
     .from('motorlar')
     .delete()
     .eq(
      'id',
      mid
     );

   if(r.error)
    throw r.error;

  }


  const pumps=
   await db
    .from('pompalar')
    .select('id')
    .eq(
     'terfi_id',
     id
    );

  if(pumps.error)
   throw pumps.error;

  for(
   const p of pumps.data||[]
  ){

   const r=
    await db
     .from('pompalar')
     .delete()
     .eq(
      'id',
      p.id
     );

   if(r.error)
    throw r.error;

  }


  const finalDelete=
   await db
    .from('terfiler')
    .delete()
    .eq(
     'id',
     id
    );

  if(finalDelete.error)
   throw finalDelete.error;


  delete localPhotos[id];

  delete terfiLocations[id];

  delete terfiDetails[id];

  changeHistory=
   changeHistory.filter(
    x=>
     x.terfi_id!==id
   );

  const ssrMap=
   localJSON(
    LOCAL_SSR_KEY,
    {}
   );

  delete ssrMap[id];

  saveLocal(
   LOCAL_PHOTO_KEY,
   localPhotos
  );

  saveLocal(
   LOCAL_LOCATION_KEY,
   terfiLocations
  );

  saveLocal(
   LOCAL_TERFI_DETAIL_KEY,
   terfiDetails
  );

  saveLocal(
   LOCAL_HISTORY_KEY,
   changeHistory
  );

  saveLocal(
   LOCAL_SSR_KEY,
   ssrMap
  );

  alert(
   'Terfi ve bağlı kayıtlar silindi.'
  );

  current=null;

  clearAdminSession();

  await home();

 }catch(e){

  console.error(e);

  alert(
   'Terfi tamamen silinemedi.\n\n'+
   (
    e.message||
    'Bilinmeyen hata'
   )
  );

 }

}

/* =========================================================
   CSV
========================================================= */

function csvEscape(
 value
){

 return `"${String(
  value??''
 ).replaceAll(
  '"',
  '""'
 )}"`;

}

function exportCSV(){

 if(!current){

  toast(
   'Önce terfi açın.'
  );

  return;

 }

 if(edit)
  touchAdminSession();

 const detail=
  current.detail||
  getTerfiDetail(
   current.s.id
  );

 const loc=
  current.location||
  getLocation(
   current.s.id
  );

 const rows=[

  [
   'MESKİ TERFİ ARŞİVİM',
   ''
  ],

  [
   'Terfi',
   current.s.ad||''
  ],

  [
   'Kod',
   current.s.kod||
   current.s.terfi_no||
   ''
  ],

  [
   'Bölge',
   current.s.bolge||
   ''
  ],

  [
   'Adres',
   current.s.adres||
   ''
  ],

  [
   'Pompa Tipi',
   detail.pompa_tipi||
   ''
  ],

  [
   'Çalışma Şekli',
   detail.calisma_sekli||
   ''
  ],

  [
   'Emiş / Kaynak',
   detail.emiş_kaynagi||
   ''
  ],

  [
   'Basma Noktası',
   detail.basma_noktasi||
   ''
  ],

  [
   'GPS Enlem',
   loc?.lat||
   ''
  ],

  [
   'GPS Boylam',
   loc?.lng||
   ''
  ],

  [
   'GPS Doğruluk',
   loc?.accuracy||
   ''
  ],

  [],

  [
   'MOTORLAR'
  ],

  [
   'Motor',
   'Marka',
   'Model',
   'kW',
   'V',
   'A',
   'Hz',
   'RPM'
  ]

 ];

 current.m.forEach(
  m=>{

   rows.push([

    m.ad,
    m.marka,
    m.model,
    m.guc_kw,
    m.gerilim_v,
    m.nominal_akim_a,
    m.frekans_hz,
    m.devir_rpm

   ]);

  }
 );

 rows.push([]);

 rows.push([
  'MOTOR · BOX · SÜRÜCÜ U/V/W'
 ]);

 rows.push([
  'Motor',
  'Bölüm',
  'Terminal',
  'Renk',
  'Detay',
  'Etiket'
 ]);

 current.m.forEach(
  m=>{

   const b=
    getBox(
     m.id
    );

   [
    ['MOTOR','motor'],
    ['BOX MOTOR GİRİŞİ','box_motor'],
    ['BOX SÜRÜCÜ ÇIKIŞI','box_surucu'],
    ['SÜRÜCÜ','surucu']
   ].forEach(
    ([title,section])=>{

     ['u','v','w']
      .forEach(
       k=>{

        rows.push([

         m.ad,
         title,
         k.toUpperCase(),
         b[section][k].renk,
         b[section][k].detay,
         b[section][k].etiket

        ]);

       }
      );

    }
   );

  }
 );

 rows.push([]);

 rows.push([
  'SÜRÜCÜLER'
 ]);

 rows.push([

  'Sürücü',
  'Marka',
  'Model',
  'kW',
  'V',
  'Bağlı Motor'

 ]);

 current.d.forEach(
  d=>{

   rows.push([

    d.ad,
    d.marka,
    d.model,
    d.guc_kw,
    d.besleme_v,

    current.m.find(
     m=>
      m.id===
      d.motor_id
    )?.ad||
    ''

   ]);

  }
 );

 rows.push([]);

 rows.push([
  'POMPALAR'
 ]);

 rows.push([

  'Pompa',
  'Marka',
  'Model',
  'kW',
  'Q Min',
  'Q Max',
  'H Min',
  'H Max'

 ]);

 current.p.forEach(
  p=>{

   rows.push([

    p.ad,
    p.marka,
    p.model,
    p.guc_kw,
    p.q_min_m3h,
    p.q_max_m3h,
    p.h_min_m,
    p.h_max_m

   ]);

  }
 );

 rows.push([]);

 rows.push([
  'HMI SAYFALARI'
 ]);

 HMI.forEach(
  (page,pageIndex)=>{

   const pageNo=
    pageIndex+1;

   const r=
    current.h.find(
     x=>
      x.ekran_no===
      pageNo
    );

   const values=
    r?.degerler||
    {};

   page.labels.forEach(
    (label,i)=>{

     rows.push([

      `HMI ${pageNo}`,
      page.title,
      label,
      values[i]??''

     ]);

    }
   );

  }
 );

 rows.push([]);

 rows.push([
  'TERFİYE ÖZEL PARAMETRELER'
 ]);

 rows.push([
  'Ekran',
  'Parametre',
  'Değer',
  'Birim',
  'Açıklama',
  'Kaynak'
 ]);

 current.tp.forEach(
  x=>{

   rows.push([

    x.ekran_adi,
    x.parametre_adi,
    x.deger,
    x.birim,
    x.aciklama,
    x.kaynak

   ]);

  }
 );

 const csv=
  '\ufeff'+
  rows
   .map(
    r=>
     r.map(
      csvEscape
     ).join(';')
   )
   .join('\r\n');

 const blob=
  new Blob(
   [csv],
   {
    type:
     'text/csv;charset=utf-8'
   }
  );

 const url=
  URL.createObjectURL(
   blob
  );

 const a=
  document.createElement(
   'a'
  );

 a.href=url;

 a.download=
  `${
   current.s.kod||
   'terfi'
  }-teknik-arsiv.csv`;

 a.click();

 setTimeout(
  ()=>{
   URL.revokeObjectURL(
    url
   );
  },
  500
 );

 recordHistory(
  'EXCEL/CSV DIŞA AKTARMA',
  ''
 );

}

 applyPrefs();

 restoreAdminSession();

 showLogin();

})();
</script>
