<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a2f">
<title>Terfi Arşivim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#06182b;
 --bg2:#0a2239;
 --card:#0d2a45;
 --card2:#103653;
 --line:#28516e;
 --text:#eef8ff;
 --muted:#9eb9cc;
 --accent:#32a9e8;
 --green:#16b978;
 --red:#dd5555;
 --yellow:#e3a928;
 --radius:14px;
 --scale:1;
}

*{box-sizing:border-box}

html{
 font-size:calc(16px * var(--scale));
 scroll-behavior:smooth;
}

body{
 margin:0;
 background:
 linear-gradient(180deg,#06182b 0%,#0a233b 100%);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 min-height:100vh;
}

button,input,textarea,select{
 font:inherit;
}

button{
 border:0;
 border-radius:10px;
 padding:11px 14px;
 color:white;
 background:#164665;
 cursor:pointer;
}

button:hover{
 filter:brightness(1.12);
}

button.primary{background:var(--green)}
button.danger{background:var(--red)}
button.warn{background:var(--yellow);color:#172000}
button.ghost{
 background:transparent;
 border:1px solid var(--line);
}

button.active{
 background:var(--accent);
}

button:disabled{
 opacity:.45;
 cursor:not-allowed;
}

#topbar{
 position:sticky;
 top:0;
 z-index:100;
 background:rgba(5,20,35,.96);
 backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);
 padding:12px 14px;
}

.toprow{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 max-width:1200px;
 margin:auto;
}

.brand{
 font-weight:900;
 letter-spacing:.6px;
 font-size:18px;
}

.subtitle{
 color:var(--muted);
 font-size:11px;
 margin-top:2px;
}

main{
 max-width:1200px;
 margin:auto;
 padding:14px 14px 100px;
}

.toolbar{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin:10px 0;
}

.search{
 width:100%;
 padding:14px;
 border-radius:12px;
 border:1px solid var(--line);
 background:#071a2f;
 color:white;
 outline:none;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 margin:12px 0;
}

.stat{
 background:linear-gradient(180deg,var(--card),#09233b);
 border:1px solid var(--line);
 border-radius:14px;
 padding:13px;
}

.stat b{
 display:block;
 font-size:22px;
}

.stat span{
 color:var(--muted);
 font-size:11px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:10px;
}

.card{
 background:linear-gradient(180deg,var(--card),#09233b);
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:14px;
}

.station{
 width:100%;
 text-align:left;
}

.station .code{
 color:#62c9ff;
 font-weight:900;
}

.station h3{
 margin:5px 0;
}

.station small{
 color:var(--muted);
}

.code{
 color:#62c9ff;
 font-weight:800;
}

.section{
 margin:12px 0;
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:9px;
}

.section-title h2{
 margin:0;
 font-size:17px;
}

.row{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:9px;
}

.field{
 display:flex;
 flex-direction:column;
 gap:5px;
}

.field.full{
 grid-column:1/-1;
}

.field label{
 color:var(--muted);
 font-size:11px;
}

.field input,
.field textarea,
.field select{
 width:100%;
 padding:11px;
 border:1px solid var(--line);
 border-radius:9px;
 background:#071a2f;
 color:white;
 outline:none;
}

.field textarea{
 min-height:90px;
 resize:vertical;
}

.readonly{
 opacity:.86;
}

.tabs{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:8px 0;
 position:sticky;
 top:62px;
 z-index:50;
 background:rgba(6,24,43,.97);
}

.tabs button{
 white-space:nowrap;
 flex:0 0 auto;
}

.subtabs{
 display:flex;
 gap:7px;
 overflow-x:auto;
 padding:7px 0;
}

.subtabs button{
 white-space:nowrap;
}

.hmi{
 background:#102a34;
 border:2px solid #718b98;
 border-radius:10px;
 padding:12px;
 box-shadow:inset 0 0 0 2px #253f49;
}

.hmihead{
 display:flex;
 justify-content:space-between;
 gap:10px;
 color:#c9f2ff;
 margin-bottom:10px;
 font-size:12px;
}

.notice{
 padding:11px;
 border:1px dashed var(--line);
 border-radius:10px;
 color:var(--muted);
 font-size:12px;
 margin:8px 0;
}

.pill{
 display:inline-block;
 padding:4px 8px;
 border-radius:999px;
 background:#153e59;
 color:#c5ebff;
 font-size:11px;
}

.ok{
 color:#4de2a7;
}

.dangerText{
 color:#ff9999;
}

.tablewrap{
 overflow-x:auto;
 border:1px solid var(--line);
 border-radius:10px;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:760px;
}

th,td{
 padding:9px;
 border-bottom:1px solid var(--line);
 text-align:left;
 font-size:12px;
}

th{
 color:#b9d8e9;
 background:#0b2942;
}

td input,td select{
 width:100%;
 padding:8px;
 background:#071a2f;
 border:1px solid var(--line);
 border-radius:7px;
 color:white;
}

.bottomsave{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 z-index:120;
 padding:10px 14px;
 background:rgba(4,18,31,.98);
 border-top:1px solid var(--line);
}

.bottomsave button{
 width:100%;
}

.hidden{
 display:none!important;
}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.loginbox{
 width:min(430px,100%);
 background:linear-gradient(180deg,#0d2b47,#081e34);
 border:1px solid var(--line);
 border-radius:20px;
 padding:25px;
 box-shadow:0 20px 70px rgba(0,0,0,.35);
}

.loginlogo{
 width:64px;
 height:64px;
 border-radius:18px;
 background:#123b58;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:27px;
 margin-bottom:14px;
}

.loginbox h1{
 margin:0 0 5px;
}

.loginbox p{
 color:var(--muted);
 font-size:13px;
}

.loginbox input{
 width:100%;
 padding:14px;
 border-radius:11px;
 border:1px solid var(--line);
 background:#06182b;
 color:white;
 margin:10px 0;
 text-align:center;
 letter-spacing:5px;
}

.loginerror{
 color:#ff9999;
 font-size:12px;
 min-height:18px;
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.65);
 z-index:200;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modalbox{
 width:min(700px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0b2944;
 border:1px solid var(--line);
 border-radius:18px;
 padding:17px;
}

@media(max-width:650px){
 .stats{
  grid-template-columns:repeat(2,1fr);
 }
 .row{
  grid-template-columns:1fr;
 }
 .tabs{
  top:61px;
 }
}

@media(min-width:651px){
 .tabs{
  top:61px;
 }
}
</style>
</head>

<div id="modal" class="modal hidden">

</div>

function esc(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

function n(v){
 return v===null || v===undefined ? "" : v;
}

function label(group,key){
 return settings?.arayuz_json?.[group]?.[key]
     || DEFAULT_LABELS?.[group]?.[key]
     || key;
}

function openModal(html){
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
 document.getElementById("modal").classList.add("hidden");
}

function field(labelText,key,value="",type="text",extra=""){
 return `
 <div class="field">
  <label>${esc(labelText)}</label>
  <input
   data-key="${esc(key)}"
   type="${type}"
   value="${esc(n(value))}"
   ${extra}
   oninput="dirty=true"
  >
 </div>`;
}

function textarea(labelText,key,value=""){
 return `
 <div class="field full">
  <label>${esc(labelText)}</label>
  <textarea
   data-key="${esc(key)}"
   oninput="dirty=true"
  >${esc(n(value))}</textarea>
 </div>`;
}

function collect(){
 const o={};
 document.querySelectorAll("[data-key]").forEach(el=>{
  o[el.dataset.key]=el.value;
 });
 return o;
}

async function loadPublicSettings(){

 const {data,error}=await db.rpc("get_app_public_settings");

 if(error){
  console.error(error);
  settings={
   baslik:"TERFİ ARŞİVİM",
   alt_baslik:"Merkezi saha teknik arşivi",
   yazi_boyutu:1,
   tema:"koyu",
   arayuz_json:{}
  };
 }else{
  settings=data||{
   baslik:"TERFİ ARŞİVİM",
   alt_baslik:"Merkezi saha teknik arşivi",
   yazi_boyutu:1,
   tema:"koyu",
   arayuz_json:{}
  };
 }

 applySettings();
}

function applySettings(){

 document.getElementById("loginTitle").textContent =
  settings.baslik || "TERFİ ARŞİVİM";

 document.getElementById("loginSubtitle").textContent =
  settings.alt_baslik || "Merkezi saha teknik arşivi";

 document.getElementById("appTitle").textContent =
  settings.baslik || "TERFİ ARŞİVİM";

 document.getElementById("appSubtitle").textContent =
  settings.alt_baslik || "Merkezi saha teknik arşivi";

 document.documentElement.style.setProperty(
  "--scale",
  settings.yazi_boyutu || 1
 );
}

async function login(){

 const pass=document.getElementById("sitePassword").value.trim();

 if(!pass){
  document.getElementById("loginError").textContent=
   "Şifre girin.";
  return;
 }

 const {data,error}=await db.rpc(
  "verify_site_password",
  {p_password:pass}
 );

 if(error || data!==true){
  document.getElementById("loginError").textContent=
   "Şifre yanlış.";
  return;
 }

 siteUnlocked=true;
 sessionStorage.setItem("terfiUnlocked","1");

 document.getElementById("loginScreen").classList.add("hidden");
 document.getElementById("topbar").classList.remove("hidden");
 document.getElementById("app").classList.remove("hidden");

 await loadStations();
}

function logout(){
 sessionStorage.removeItem("terfiUnlocked");
 location.reload();
}

async function boot(){

 await loadPublicSettings();

 if(sessionStorage.getItem("terfiUnlocked")==="1"){
  siteUnlocked=true;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("topbar").classList.remove("hidden");
  document.getElementById("app").classList.remove("hidden");
  await loadStations();
 }
}

async function loadStations(){

 const {data,error}=await db
  .from("terfiler")
  .select("*")
  .order("kod",{ascending:true});

 if(error){
  showError(error);
  return;
 }

 const motors=await db
  .from("motorlar")
  .select("id",{count:"exact",head:true});

 const pumps=await db
  .from("pompalar")
  .select("id",{count:"exact",head:true});

 const drives=await db
  .from("suruculer")
  .select("id",{count:"exact",head:true});

 let q=document.getElementById("stationSearch")?.value||"";

 const rows=(data||[]).filter(x=>{
  const text=[
   x.ad,x.kod,x.terfi_no,x.bolge,x.adres
  ].join(" ").toLocaleLowerCase("tr-TR");

  return text.includes(q.toLocaleLowerCase("tr-TR"));
 });

 document.getElementById("app").innerHTML=`

 <div class="toolbar">
  <button class="primary"
   onclick="newStation()"
   ${editMode?"":"disabled"}>
   ＋ Yeni Terfi
  </button>

  <button onclick="loadStations()">
   ↻ Yenile
  </button>

  <button class="ghost" onclick="openAdminLogin()">
   ⚙️ Yönetici
  </button>

  <button class="ghost" onclick="logout()">
   Çıkış
  </button>
 </div>

 <div class="stats">

  <div class="stat">
   <b>${data?.length||0}</b>
   <span>Kayıtlı Terfi</span>
  </div>

  <div class="stat">
   <b>${motors.count||0}</b>
   <span>Motor</span>
  </div>

  <div class="stat">
   <b>${pumps.count||0}</b>
   <span>Pompa</span>
  </div>

  <div class="stat">
   <b>${drives.count||0}</b>
   <span>Sürücü</span>
  </div>

 </div>

 <input
  id="stationSearch"
  class="search"
  placeholder="Terfi, kod, bölge veya adres ara..."
  value="${esc(q)}"
  oninput="loadStations()"
 >

 <div class="grid">

 ${rows.map(x=>`

  <button
   class="card station"
   onclick="openStation('${x.id}')"
  >

   <div class="code">
    ${esc(x.terfi_no||x.kod||"TERFİ")}
   </div>

   <h3>
    ${esc(x.ad||"İsimsiz Terfi")}
   </h3>

   <small>
    ${esc(x.bolge||"")}
    ${x.adres?" · "+esc(x.adres):""}
   </small>

  </button>

 `).join("")}

 </div>
 `;

 setSaveBar();
}

async function openStation(id){

  .from("terfiler")
  .select("*")
  .eq("id",id)
  .single();

 if(error){
  showError(error);
  return;
 }

  station:data,
  motors:[],
  pumps:[],
  drives:[],
  boxes:[],
  hmi:[],
  faults:[],
  params:[],
  services:[],
  photos:[],
  history:[],
  level:null
 };

 currentTab="terfi";
 currentMotor=null;
 currentHmiPage=1;
 dirty=false;

 await refreshChildren();
 renderDetail();
}

async function refreshChildren(){

 const id=current.station.id;

 const [
  m,p,s,b,h,
  f,pa,sv,ph,hist,
  lv
 ]=await Promise.all([

  db.from("motorlar")
   .select("*")
   .eq("terfi_id",id)
   .order("created_at"),

  db.from("pompalar")
   .select("*")
   .eq("terfi_id",id)
   .order("created_at"),

  db.from("suruculer")
   .select("*")
   .eq("terfi_id",id)
   .order("created_at"),

  db.from("motor_box_kablolari")
   .select("*")
   .order("sira_no"),

function numOrNull(v){

 if(v===undefined||v===null||v==="")
  return null;

 const n=Number(String(v).replace(",","."));

 return Number.isFinite(n)?n:null;
}

async function uploadPhotos(event){

 if(!editMode)
  return;

 const files=[...event.target.files];

 for(const file of files){

  const path=
   current.station.id+
   "/"+
   Date.now()+"_"+
   file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

  const {error}=await db.storage
   .from("terfi-fotograflari")
   .upload(path,file,{
    upsert:false
   });

  if(error){
   showError(error);
   continue;
  }

  await db
   .from("fotograflar")
   .insert({
    terfi_id:current.station.id,
    kategori:"Genel",
    dosya_adi:file.name,
    storage_path:path,
    aciklama:""
   });
 }

 await refreshChildren();
 renderDetail();
}

function photoUrl(path){

 if(!path)return "";

 return db.storage
  .from("terfi-fotograflari")
  .getPublicUrl(path)
  .data.publicUrl;
}
