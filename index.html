<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b35">
<title>Terfi Arşivim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#071b35;
  --bg2:#0b2748;
  --card:#102f50;
  --card2:#123858;
  --line:#285071;
  --text:#eef6ff;
  --muted:#9eb5ca;
  --green:#20c77a;
  --red:#e95656;
  --yellow:#f1c75b;
  --blue:#42a5ff;
  --white:#fff;
  --scale:1;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;font-size:calc(15px * var(--scale))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

#gate{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(circle at top right,#123f69 0,#071b35 45%),
    #071b35;
}

.gateBox{
  width:min(430px,100%);
  background:rgba(16,47,80,.96);
  border:1px solid var(--line);
  border-radius:26px;
  padding:30px;
  box-shadow:0 25px 80px #0007;
}

.logo{
  width:68px;height:68px;border-radius:18px;
  background:#183d61;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;
  margin-bottom:20px;
}

h1,h2,h3{margin:0}
.gateBox h1{font-size:28px}
.gateBox p{color:var(--muted)}

.field{margin-bottom:14px}
label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
  font-weight:700;
  letter-spacing:.3px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#071f39;
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
}

input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:90px;resize:vertical}

.btn{
  border:1px solid var(--line);
  background:#143958;
  color:var(--text);
  border-radius:11px;
  padding:10px 14px;
  font-weight:700;
}

.btn:hover{filter:brightness(1.12)}
.btn.primary{background:var(--green);color:#03150d;border-color:var(--green)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.blue{background:var(--blue);color:#031322;border-color:var(--blue)}
.btn.yellow{background:var(--yellow);color:#171006;border-color:var(--yellow)}
.btn.small{padding:7px 10px;font-size:12px}

.full{width:100%}

#app{display:none;min-height:100vh}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(7,27,53,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}

.topinner{
  max-width:1400px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand{
  min-width:220px;
}
.brand strong{display:block;font-size:19px}
.brand span{font-size:11px;color:var(--muted)}

.topActions{
  margin-left:auto;
  display:flex;
  gap:8px;
}

.page{
  max-width:1400px;
  margin:auto;
  padding:18px 16px 90px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  background:linear-gradient(145deg,#113454,#0d2946);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px;
}
.stat b{font-size:25px;display:block}
.stat span{font-size:11px;color:var(--muted)}

.search{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.stationGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:12px;
}

.station{
  background:linear-gradient(145deg,#123657,#0d2946);
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px;
  transition:.2s;
}

.station:hover{
  transform:translateY(-2px);
  border-color:#3c6c91;
}

.stationHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.stationCode{
  color:var(--blue);
  font-size:12px;
  font-weight:800;
}

.station h3{margin-top:4px;font-size:18px}
.stationMeta{color:var(--muted);font-size:12px;margin:8px 0}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  padding:5px 8px;
  background:#071f39;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:10px;
  color:#cce1f5;
}

.detailHead{
  background:linear-gradient(145deg,#123858,#0b2745);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:12px;
}

.detailTitle{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.detailTitle h2{font-size:22px}
.detailTitle small{color:var(--blue)}

.detailActions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.tabs{
  display:flex;
  overflow-x:auto;
  gap:7px;
  padding:7px 0 12px;
  position:sticky;
  top:68px;
  z-index:30;
  background:rgba(7,27,53,.95);
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{display:none}

.tab{
  flex:0 0 auto;
  white-space:nowrap;
  border:1px solid var(--line);
  background:#0d2946;
  color:#aac2d7;
  padding:9px 13px;
  border-radius:10px;
  font-weight:800;
  font-size:12px;
}

.tab.active{
  background:var(--blue);
  color:#04172a;
  border-color:var(--blue);
}

.section{
  background:linear-gradient(145deg,#102f50,#0c2844);
  border:1px solid var(--line);
  border-radius:18px;
  padding:17px;
  margin-bottom:13px;
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.sectionHead h3{font-size:17px}
.sectionHead span{font-size:11px;color:var(--muted)}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.card{
  background:#09223c;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
}

.card h4{
  margin:0 0 10px;
  font-size:13px;
}

.readonly{
  padding:10px 11px;
  border-radius:9px;
  background:#071c32;
  border:1px solid #173a59;
  color:#d9e8f5;
}

.motorCard{
  border:1px solid var(--line);
  background:#0a2642;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.motorTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.motorTop h4{margin:0}

.tableWrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:12px;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:720px;
}

th,td{
  padding:9px;
  border-bottom:1px solid #173b5a;
  text-align:left;
  font-size:12px;
}

th{background:#0a223b;color:#a9c4d9}
td{background:#09243e}

.hmiNav{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:12px;
  scrollbar-width:none;
}
.hmiNav::-webkit-scrollbar{display:none}

.hmiBtn{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#09243e;
  color:#aac4d9;
  border-radius:10px;
  padding:9px 14px;
  font-weight:800;
}
.hmiBtn.active{background:#20c77a;color:#03150d}

.hmiScreen{
  background:#020b13;
  border:8px solid #111923;
  border-radius:12px;
  padding:15px;
  box-shadow:inset 0 0 30px #000;
}

.hmiTitle{
  background:linear-gradient(180deg,#1262a7,#06335f);
  padding:13px;
  text-align:center;
  font-weight:900;
  letter-spacing:1px;
}

.hmiGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  padding:12px;
  background:#e7edf0;
  color:#111;
}

.hmiItem{
  background:#d9e2e7;
  border:1px solid #a7b5bd;
  border-radius:6px;
  padding:8px;
}

.hmiItem label{color:#344651;font-size:9px}
.hmiItem input{
  background:#061523;
  border:1px solid #203b52;
  color:#49e0a2;
  border-radius:4px;
  font-family:monospace;
  font-weight:900;
  padding:7px;
}

.workGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.workValue{
  background:#061c31;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
}
.workValue label{font-size:10px}
.workValue input{
  font-size:22px;
  font-weight:900;
  color:#45dfa0;
  font-family:monospace;
}

.notice{
  padding:11px 13px;
  background:#09253e;
  border:1px solid var(--line);
  border-radius:10px;
  color:#abc4d7;
  font-size:12px;
  margin-bottom:12px;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:13px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:#132f49;
  border:1px solid var(--line);
  padding:11px 16px;
  border-radius:12px;
  box-shadow:0 10px 35px #0007;
  z-index:1000;
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:900;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modalBox{
  width:min(720px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0d2946;
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.adminTag{
  display:inline-flex;
  padding:5px 8px;
  border-radius:7px;
  background:#183d2f;
  color:#57e7a5;
  font-size:10px;
  font-weight:900;
}

.footerSave{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(7,27,53,.97);
  border-top:1px solid var(--line);
  padding:9px 14px;
  z-index:40;
  display:flex;
  justify-content:center;
}

.footerSave button{min-width:260px}

@media(max-width:900px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .grid,.grid4{grid-template-columns:repeat(2,1fr)}
  .workGrid{grid-template-columns:repeat(2,1fr)}
  .brand{min-width:0}
}

@media(max-width:620px){
  .topinner{padding:10px}
  .brand strong{font-size:16px}
  .brand span{font-size:9px}
  .topActions .btn span{display:none}
  .page{padding:12px 10px 85px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid,.grid2,.grid4,.workGrid{grid-template-columns:1fr}
  .stationGrid{grid-template-columns:1fr}
  .detailTitle{flex-direction:column}
  .detailActions{width:100%}
  .hmiGrid{grid-template-columns:repeat(2,1fr)}
}

@media print{
  body{background:#fff;color:#111}
  #app{display:block!important}
  .topbar,.tabs,.detailActions,.footerSave,.noPrint,.btn{display:none!important}
  .page{max-width:none;padding:0}
  .section,.detailHead,.motorCard,.station{
    background:#fff!important;
    color:#111!important;
    border:1px solid #bbb;
    break-inside:avoid;
  }
  input,textarea,select{
    color:#111!important;
    background:#fff!important;
    border:0!important;
  }
  .hmiScreen{break-inside:avoid}
  .hmiGrid{background:#eee}
  .hmiItem{background:#f4f4f4}
  .hmiItem input{background:#fff;color:#111}
}
</style>
</head>

<body>

<!-- GİRİŞ -->
<div id="gate">
  <div class="gateBox">
    <div class="logo">TA</div>
    <h1 id="gateTitle">TERFİ ARŞİVİM</h1>
    <p id="gateSub">Merkezi saha teknik arşivi</p>

    <div class="field">
      <label>UYGULAMA ŞİFRESİ</label>
      <input id="gatePassword" type="password" inputmode="numeric" placeholder="Şifre">
    </div>

    <button class="btn primary full" onclick="enterApp()">GİRİŞ</button>
    <div id="gateError" class="notice hidden" style="margin-top:12px">
      Şifre hatalı.
    </div>
  </div>
</div>

<!-- UYGULAMA -->
<div id="app">

<header class="topbar">
  <div class="topinner">
    <div class="brand">
      <strong id="appTitle">TERFİ ARŞİVİM</strong>
      <span id="appSubtitle">Merkezi saha teknik arşivi</span>
    </div>

    <div class="topActions">
      <button class="btn small" onclick="showHome()">TERFİLER</button>
      <button class="btn small" onclick="openAdmin()">⚙ <span>YÖNETİCİ</span></button>
      <button class="btn small danger" onclick="logout()">ÇIKIŞ</button>
    </div>
  </div>
</header>

<main class="page">

  <!-- ANA SAYFA -->
  <section id="homeView">

    <div class="stats">
      <div class="stat"><b id="statTerfi">0</b><span>KAYITLI TERFİ</span></div>
      <div class="stat"><b id="statMotor">0</b><span>MOTOR</span></div>
      <div class="stat"><b id="statPump">0</b><span>POMPA</span></div>
      <div class="stat"><b id="statDrive">0</b><span>SÜRÜCÜ</span></div>
      <div class="stat"><b id="statArchive">0</b><span>ARŞİV</span></div>
    </div>

    <div class="search">
      <input id="stationSearch"
             placeholder="Terfi adı, kod, bölge veya adres ara..."
             oninput="renderStations()">
      <button class="btn primary" onclick="newStation()">+ TERFİ</button>
    </div>

    <div id="stationGrid" class="stationGrid"></div>

  </section>

  <!-- DETAY -->
  <section id="detailView" class="hidden">

    <div class="detailHead">
      <div class="detailTitle">
        <div>
          <small id="detailCode">T001</small>
          <h2 id="detailName">Terfi</h2>
          <div id="detailMeta" style="color:var(--muted);font-size:12px"></div>
        </div>

        <div class="detailActions">
          <button class="btn small" onclick="showHome()">← TERFİLER</button>
          <button class="btn small blue" onclick="printPDF()">PDF AKTAR</button>
          <button id="editBtn" class="btn small yellow" onclick="toggleEdit()">DÜZENLE</button>
        </div>
      </div>
    </div>

    <!-- YATAY BÖLÜMLER -->
    <div id="tabs" class="tabs"></div>

    <div id="detailContent"></div>

    <div id="saveBar" class="footerSave hidden">
      <button class="btn primary" onclick="saveEverything()">DEĞİŞİKLİKLERİ KAYDET</button>
    </div>

  </section>

</main>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modalBox">
    <div class="modalHead">
      <h3 id="modalTitle">İşlem</h3>
      <button class="btn small" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

/* ---------------- YARDIMCI ---------------- */

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.remove("hidden");
  setTimeout(()=>el.classList.add("hidden"),2300);
}

function openModal(title,body){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").classList.remove("hidden");
}

function closeModal(){
  document.getElementById("modal").classList.add("hidden");
}

function val(id){
  const e=document.getElementById(id);
  return e ? e.value : "";
}

function num(id){
  const v=val(id);
  return v==="" ? null : Number(v.replace(",","."));
}

function setVal(id,v){
  const e=document.getElementById(id);
  if(e) e.value=v??"";
}

function showHome(){
  document.getElementById("homeView").classList.remove("hidden");
  document.getElementById("detailView").classList.add("hidden");

function logout(){

/* ---------------- AYARLAR ---------------- */

async function loadSettings(){
  const {data,error}=await sb
    .from("uygulama_ayarlar")
    .select("*")
    .limit(1)
    .maybeSingle();

  if(!error && data){
    settings={...settings,...data};
  }

  applySettings();
}

function applySettings(){
  document.documentElement.style.setProperty(
    "--scale",
    Number(settings.yazi_boyutu||1)
  );

  document.getElementById("gateTitle").textContent=settings.baslik;
  document.getElementById("gateSub").textContent=settings.alt_baslik;
  document.getElementById("appTitle").textContent=settings.baslik;
  document.getElementById("appSubtitle").textContent=settings.alt_baslik;
}

/* ---------------- GİRİŞ ---------------- */

async function enterApp(){
  const p=document.getElementById("gatePassword").value;

  if(p!==settings.site_sifresi){
    document.getElementById("gateError").classList.remove("hidden");
    return;
  }

  localStorage.setItem("ta_access","1");

  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";

  await loadStations();
}

async function boot(){
  await loadSettings();

  if(localStorage.getItem("ta_access")==="1"){
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="block";
    await loadStations();
  }
}

/* ---------------- TERFİLER ---------------- */

async function loadStations(){
  const {data,error}=await sb
    .from("terfiler")
    .select("*")
    .order("kod",{ascending:true});

  if(error){
    console.error(error);
    toast("Terfiler okunamadı: "+error.message);
    return;
  }

  stations=data||[];
  renderStations();
  updateStats();
}

function renderStations(){
  const q=(document.getElementById("stationSearch")?.value||"")
    .toLocaleLowerCase("tr");

  const arr=stations.filter(s=>{
    const text=[
      s.kod,s.terfi_no,s.ad,s.bolge,s.adres,s.aciklama
    ].join(" ").toLocaleLowerCase("tr");
    return text.includes(q);
  });

  const box=document.getElementById("stationGrid");

  if(!arr.length){
    box.innerHTML=`<div class="empty">
      Kayıt bulunamadı.<br><br>
      <button class="btn primary" onclick="newStation()">İlk Terfiyi Oluştur</button>
    </div>`;
    return;
  }

  box.innerHTML=arr.map(s=>`
    <div class="station" onclick="openStation('${s.id}')">
      <div class="stationHead">
        <div>
          <div class="stationCode">${esc(s.terfi_no||s.kod||"TERFİ")}</div>
          <h3>${esc(s.ad||"İsimsiz Terfi")}</h3>
        </div>
        <div>›</div>
      </div>

      <div class="stationMeta">
        ${esc(s.bolge||"Bölge belirtilmemiş")}
        ${s.adres ? " · "+esc(s.adres):""}
      </div>

      <div class="badges">
        <span class="badge">TEKNİK ARŞİV</span>
        <span class="badge">HMI 5 SAYFA</span>
        <span class="badge">PDF</span>
      </div>
    </div>
  `).join("");
}

async function updateStats(){
  document.getElementById("statTerfi").textContent=stations.length;

  const [m,p,d]=await Promise.all([
    sb.from("motorlar").select("id",{count:"exact",head:true}),
    sb.from("pompalar").select("id",{count:"exact",head:true}),
    sb.from("suruculer").select("id",{count:"exact",head:true})
  ]);

  document.getElementById("statMotor").textContent=m.count||0;
  document.getElementById("statPump").textContent=p.count||0;
  document.getElementById("statDrive").textContent=d.count||0;

  document.getElementById("statArchive").textContent=
    (m.count||0)+(p.count||0)+(d.count||0);
}

/* ---------------- TERFİ OLUŞTUR ---------------- */

function newStation(){
  if(!isAdmin){
    const p=prompt("Yönetici şifresini gir:");
    if(p!==settings.yonetici_sifresi){
      toast("Yönetici yetkisi gerekli");
      return;
    }
    isAdmin=true;
  }

  openModal("YENİ TERFİ",`
    <div class="grid2">
      <div class="field">
        <label>TERFİ NO / KOD</label>
        <input id="newKod" placeholder="T001">
      </div>
      <div class="field">
        <label>TERFİ ADI</label>
        <input id="newAd" placeholder="Örn. Başaran Terfi">
      </div>
      <div class="field">
        <label>BÖLGE</label>
        <input id="newBolge">
      </div>
      <div class="field">
        <label>ADRES</label>
        <input id="newAdres">
      </div>
    </div>

    <div class="field">
      <label>AÇIKLAMA</label>

    </div>

async function createStation(){
  const kod=val("newKod").trim();
  const ad=val("newAd").trim();

  if(!kod||!ad){
    toast("Kod ve terfi adı gerekli");
    return;
  }

  const {data,error}=await sb
    .from("terfiler")
    .insert({
      kod,
      terfi_no:kod,
      ad,
      bolge:val("newBolge"),
      adres:val("newAdres"),
      aciklama:val("newAciklama")
    })
    .select()
    .single();

  if(error){
    toast(error.message);
    return;
  }

  closeModal();
  toast("Terfi oluşturuldu");
  await loadStations();
  openStation(data.id);
}

/* ---------------- DETAY ---------------- */

async function openStation(id){
  const s=stations.find(x=>x.id===id);
  if(!s)return;

  current={
    station:s,
    motors:[],
    pumps:[],
    drives:[],
    cables:[],
    work:[],
    hmi:{},
    faults:[],
    params:[],
    services:[],
    photos:[],
    history:[]
  };

  document.getElementById("homeView").classList.add("hidden");
  document.getElementById("detailView").classList.remove("hidden");

  await loadStationData();

  activeTab="terfi";
  editing=false;
  renderTabs();
  renderDetail();
}

async function loadStationData(){
  const id=current.station.id;

  const [
    motors,pumps,drives,cables,work,hmi,faults,params,services,photos,history
  ]=await Promise.all([
    sb.from("motorlar").select("*").eq("terfi_id",id).order("created_at"),
    sb.from("pompalar").select("*").eq("terfi_id",id).order("created_at"),
    sb.from("suruculer").select("*").eq("terfi_id",id).order("created_at"),
    sb.from("motor_box_kablolari")
      .select("*")
      .in("motor_id",
        (await sb.from("motorlar").select("id").eq("terfi_id",id)).data?.map(x=>x.id)||[]
      ),
    sb.from("motor_calisma_kayitlari")
      .select("*").eq("terfi_id",id)
      .order("captured_at",{ascending:false}).limit(50),
    sb.from("hmi_kayitlari")
      .select("*").eq("terfi_id",id).order("created_at"),
    sb.from("surucu_ariza_kayitlari")
      .select("*").eq("terfi_id",id).order("tarih",{ascending:false}),
    sb.from("surucu_parametre_kayitlari")
      .select("*").eq("terfi_id",id).order("tarih",{ascending:false}),
    sb.from("servis_kayitlari")
      .select("*").eq("terfi_id",id).order("created_at",{ascending:false}),
    sb.from("teknik_fotograflar")
      .select("*").eq("terfi_id",id).order("created_at",{ascending:false}),
    sb.from("degisiklik_gecmisi")
      .select("*").eq("terfi_id",id).order("tarih",{ascending:false})
  ]);

  current.motors=motors.data||[];
  current.pumps=pumps.data||[];
  current.drives=drives.data||[];
  current.cables=cables.data||[];
  current.work=work.data||[];
  current.faults=faults.data||[];
  current.params=params.data||[];
  current.services=services.data||[];
  current.photos=photos.data||[];
  current.history=history.data||[];

  hmiData={};
  (hmi.data||[]).forEach(r=>{
    hmiData[r.ekran_no]=r.degerler||{};
  });
}

function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(t=>`
    <button class="tab ${activeTab===t[0]?"active":""}"
      onclick="changeTab('${t[0]}')">${t[1]}</button>
  `).join("");
}

function changeTab(t){
  activeTab=t;
  renderTabs();
  renderDetail();
}

function renderDetail(){
  const s=current.station;

  document.getElementById("detailCode").textContent=
    s.terfi_no||s.kod||"TERFİ";

  document.getElementById("detailName").textContent=
    s.ad||"İsimsiz Terfi";

  document.getElementById("detailMeta").textContent=
    [s.bolge,s.adres].filter(Boolean).join(" · ");

  document.getElementById("saveBar")
    .classList.toggle("hidden",!editing);

  const box=document.getElementById("detailContent");

  if(activeTab==="terfi")box.innerHTML=renderTerfi();
  if(activeTab==="ssr")box.innerHTML=renderSSR();
  if(activeTab==="motor")box.innerHTML=renderMotors();
  if(activeTab==="calisma")box.innerHTML=renderWork();
  if(activeTab==="pompa")box.innerHTML=renderPumps();
  if(activeTab==="surucu")box.innerHTML=renderDrivers();
  if(activeTab==="box")box.innerHTML=renderBox();
  if(activeTab==="hmi")box.innerHTML=renderHMI();
  if(activeTab==="ariza")box.innerHTML=renderFaults();
  if(activeTab==="parametre")box.innerHTML=renderParams();
  if(activeTab==="servis")box.innerHTML=renderServices();
  if(activeTab==="foto")box.innerHTML=renderPhotos();
  if(activeTab==="gecmis")box.innerHTML=renderHistory();
}

/* ---------------- YÖNETİCİ ---------------- */

async function openAdmin(){
  if(!isAdmin){
    const p=prompt("YÖNETİCİ ŞİFRESİ:");
    if(p!==settings.yonetici_sifresi){
      toast("Yönetici şifresi hatalı");
      return;
    }
    isAdmin=true;
  }

  openModal("YÖNETİCİ AYARLARI",`
    <div class="adminTag">YÖNETİCİ ERİŞİMİ AKTİF</div>

    <h3 style="margin:18px 0 10px">GÜVENLİK</h3>

    ${inp("setSite","Uygulama Giriş Şifresi",settings.site_sifresi)}
    ${inp("setAdmin","Yönetici Şifresi",settings.yonetici_sifresi)}

    <h3 style="margin:18px 0 10px">GÖRÜNÜM</h3>

    <div class="grid2">
      <div class="field">
        <label>YAZI / ARAYÜZ ÖLÇEĞİ</label>
        <select id="setScale">
          <option value="0.9" ${settings.yazi_boyutu==.9?"selected":""}>Küçük</option>
          <option value="1" ${settings.yazi_boyutu==1?"selected":""}>Normal</option>
          <option value="1.1" ${settings.yazi_boyutu==1.1?"selected":""}>Büyük</option>
          <option value="1.2" ${settings.yazi_boyutu==1.2?"selected":""}>Çok Büyük</option>
        </select>
      </div>

      <div class="field">
        <label>TEMA</label>
        <select id="setTheme">
          <option value="koyu" ${settings.tema==="koyu"?"selected":""}>Koyu Teknik</option>
          <option value="mavi" ${settings.tema==="mavi"?"selected":""}>Mavi</option>
        </select>
      </div>
    </div>

    <h3 style="margin:18px 0 10px">BAŞLIKLAR</h3>

    ${inp("setTitle","Ana Başlık",settings.baslik)}
    ${inp("setSubtitle","Alt Başlık",settings.alt_baslik)}

    <button class="btn primary full" onclick="saveAdminSettings()">
      YÖNETİCİ AYARLARINI KAYDET
    </button>
  `);
}

async function saveAdminSettings(){
  const update={
    site_sifresi:val("setSite"),
    yonetici_sifresi:val("setAdmin"),
    yazi_boyutu:Number(val("setScale")||1),
    tema:val("setTheme"),
    baslik:val("setTitle"),
    alt_baslik:val("setSubtitle"),
    updated_at:new Date().toISOString()
  };

  const {data,error}=await sb
    .from("uygulama_ayarlar")
    .select("id")
    .limit(1)
    .maybeSingle();

  if(error){
    toast(error.message);
    return;
  }

  let result;

  if(data?.id){
    result=await sb.from("uygulama_ayarlar")
      .update(update)
      .eq("id",data.id);
  }else{
    result=await sb.from("uygulama_ayarlar")
      .insert(update);
  }

  if(result.error){
    toast(result.error.message);
    return;
  }

  settings={...settings,...update};
  applySettings();

  closeModal();
  toast("Yönetici ayarları kaydedildi");
}

/* ---------------- TOPLU KAYIT ---------------- */

async function saveEverything(){
  if(!editing){
    toast("Önce yönetici düzenleme moduna gir");
    return;
  }

  if(activeTab==="terfi"){
    await saveStationInfo();
  }

  if(activeTab==="motor"){
    for(const m of current.motors){
      await saveMotor(m.id);
    }
  }

  if(activeTab==="pompa"){
    for(const p of current.pumps){
      await savePump(p.id);
    }
  }

  if(activeTab==="surucu"){
    for(const d of current.drives){
      await saveDriver(d.id);
    }
  }

  toast("Değişiklikler kaydedildi");
}

/* ---------------- PDF ---------------- */

function printPDF(){
  if(!current){
    toast("Önce bir terfi aç");
    return;
  }

  /*
    Tarayıcının yerleşik yazdır/PDF özelliği kullanılıyor.
    iPhone/iPad Safari'de:
    Paylaş → Yazdır veya PDF olarak kaydet.
  */

  const oldTab=activeTab;
  activeTab="terfi";
  renderDetail();

  setTimeout(()=>{
    window.print();
    activeTab=oldTab;
    renderDetail();
  },300);
}

const oldRenderDetail=renderDetail;
renderDetail=function(){
  oldRenderDetail();

  if(activeTab==="ariza"){
    setTimeout(loadFaultLibrary,50);
  }
};
