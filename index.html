<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>MESKİ | Terfi Arşivim</title>

<style>
:root{
--bg:#edf3f6;
--bg2:#e4edf2;
--panel:#fff;
--line:#cbdce6;
--blue:#087fe0;
--blue2:#2c9af0;
--text:#173042;
--muted:#698092;
--success:#159b69;
--danger:#d84b4b;
--warning:#d89216;
--shadow:0 10px 30px rgba(27,68,91,.10);
--radius:16px
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:
radial-gradient(circle at 80% 0%,rgba(47,154,240,.08),transparent 28%),
linear-gradient(145deg,var(--bg),var(--bg2));
color:var(--text);
min-height:100vh
}

button,input,textarea,select{font:inherit}

button{
-webkit-tap-highlight-color:transparent;
cursor:pointer
}

.app{min-height:100vh;display:flex}

.sidebar{
width:225px;
min-width:225px;
position:fixed;
inset:0 auto 0 0;
background:rgba(248,252,254,.96);
border-right:1px solid var(--line);
padding:18px 14px;
z-index:50;
overflow:auto
}

.brand{
display:flex;
align-items:center;
gap:11px;
padding:4px 5px 20px;
border-bottom:1px solid var(--line)
}

.brand-mark{
width:50px;
height:50px;
border-radius:14px;
background:linear-gradient(145deg,#168ee8,#075fae);
color:#fff;
display:grid;
place-items:center;
font-size:25px;
font-weight:900
}

.brand-title{font-size:19px;font-weight:850}
.brand-sub{
font-size:9px;
color:var(--blue);
font-weight:750;
letter-spacing:.7px;
margin-top:2px
}

.nav{margin-top:15px}

.nav button{
width:100%;
display:flex;
align-items:center;
gap:11px;
padding:12px;
border:1px solid transparent;
border-radius:11px;
background:transparent;
color:#385366;
text-align:left;
margin-bottom:5px
}

.nav button:hover{
background:#edf7fd;
border-color:#d2e7f3
}

.nav button.active{
background:#1285df;
color:#fff;
border-color:#2698ee;
box-shadow:0 7px 18px rgba(8,127,224,.18)
}

.nav-icon{width:22px;text-align:center;font-size:17px}

.sidebar-footer{
margin-top:25px;
padding-top:14px;
border-top:1px solid var(--line);
font-size:10px;
color:#8aa0ae;
line-height:1.6
}

.main{
margin-left:225px;
width:calc(100% - 225px);
min-height:100vh
}

.topbar{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
border-bottom:1px solid var(--line);
background:rgba(255,255,255,.78);
backdrop-filter:blur(12px);
position:sticky;
top:0;
z-index:30
}

.top-title{font-size:16px;font-weight:800}

.top-right{
display:flex;
align-items:center;
gap:8px
}

.mode{
padding:8px 11px;
border:1px solid var(--line);
border-radius:9px;
color:#718594;
font-size:11px;
background:#fff
}

.mode.edit{
border-color:#78bdf0;
color:#0874c8;
background:#eef8ff
}

.content{
padding:22px;
max-width:1450px;
margin:auto
}

.card{
background:rgba(255,255,255,.94);
border:1px solid var(--line);
border-radius:var(--radius);
box-shadow:var(--shadow);
overflow:hidden
}

.card+.card{margin-top:16px}

.card-header{
padding:18px 20px;
border-bottom:1px solid var(--line);
display:flex;
justify-content:space-between;
align-items:center;
gap:12px
}

.card-title{font-size:17px;font-weight:800}
.card-subtitle{
font-size:11px;
color:var(--muted);
margin-top:4px
}

.card-body{padding:20px}

.hero{
padding:26px;
margin-bottom:18px
}

.hero-title{
font-size:29px;
font-weight:900
}

.hero-sub{
color:var(--muted);
margin-top:5px
}

.hero-note{
margin-top:17px;
max-width:850px;
color:#607989;
line-height:1.6;
font-size:12px
}

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin-bottom:18px
}

.stat{
padding:17px;
border:1px solid var(--line);
background:#fff;
border-radius:13px
}

.stat-label{font-size:11px;color:var(--muted)}

.stat-value{
font-size:25px;
font-weight:900;
margin-top:7px
}

.stat-unit{
font-size:10px;
color:#8ba0ad
}

.btn{
border:1px solid #aac8d9;
background:#f4f9fc;
color:#29485b;
border-radius:9px;
padding:9px 13px;
font-size:12px;
font-weight:700
}

.btn:hover{
border-color:#5aa9df;
transform:translateY(-1px)
}

.btn-primary{
background:linear-gradient(135deg,#138de9,#0876ce);
border-color:#1994ed;
color:#fff
}

.btn-success{
background:#eaf8f2;
color:#12835a;
border-color:#9bd9bf
}

.btn-danger{
background:#fff1f1;
color:#c44747;
border-color:#efb1b1
}

.btn-warning{
background:#fff7e8;
color:#a96c08;
border-color:#ebc477
}

.btn-save{
background:linear-gradient(135deg,#159b69,#087d53);
color:#fff;
border-color:#159b69;
font-size:13px;
padding:11px 17px
}

.btn-small{
padding:6px 9px;
font-size:10px
}

.toolbar{
display:flex;
gap:9px;
align-items:center;
margin-bottom:13px
}

.search{
flex:1;
max-width:470px
}

.search input{
width:100%;
background:#f8fbfd;
color:var(--text);
border:1px solid #c8dce7;
border-radius:9px;
padding:11px 12px;
outline:none
}

.station-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px
}

.station-card{
padding:18px;
border:1px solid var(--line);
background:linear-gradient(145deg,#fff,#f7fafc);
border-radius:13px;
cursor:pointer
}

.station-card:hover{
border-color:#73b5df;
transform:translateY(-1px)
}

.station-top{
display:flex;
justify-content:space-between
}

.station-code{
font-size:11px;
color:#087fdc;
font-weight:850
}

.station-name{
font-size:18px;
font-weight:850;
margin-top:5px
}

.station-meta{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-top:14px
}

.meta-box{
background:#f2f7fa;
border:1px solid #d7e5ec;
padding:9px;
border-radius:8px
}

.meta-label{
font-size:8px;
color:#8196a4
}

.meta-value{
font-size:13px;
font-weight:800;
margin-top:3px
}

.badge{
display:inline-flex;
padding:5px 8px;
border-radius:6px;
background:#edf9f4;
color:#16845b;
border:1px solid #b5e3cd;
font-size:9px;
font-weight:750
}

.back-row{
display:flex;
gap:8px;
margin-bottom:14px;
flex-wrap:wrap
}

.station-heading{margin-bottom:15px}

.station-heading h1{
margin:0;
font-size:27px
}

.station-heading p{
margin:5px 0;
color:var(--muted);
font-size:12px
}

.detail-tabs{
display:flex;
gap:7px;
overflow-x:auto;
padding:5px 2px 13px;
position:sticky;
top:70px;
z-index:20;
background:rgba(237,243,246,.94);
backdrop-filter:blur(10px);
margin-bottom:5px;
scrollbar-width:none
}

.detail-tabs::-webkit-scrollbar{display:none}

.detail-tab{
flex:0 0 auto;
border:1px solid #bdd4e0;
background:#fff;
color:#547080;
border-radius:10px;
padding:10px 13px;
font-size:11px;
font-weight:750;
white-space:nowrap
}

.detail-tab.active{
background:#0f84df;
color:#fff;
border-color:#2498ec;
box-shadow:0 5px 13px rgba(8,127,224,.15)
}

.section{scroll-margin-top:145px}

.detail-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px
}

.full{grid-column:1/-1}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px
}

.field{
display:flex;
flex-direction:column;
gap:6px
}

.field label{
font-size:11px;
color:#647d8c;
font-weight:700
}

.field input,
.field textarea,
.field select{
width:100%;
background:#f8fbfd;
color:var(--text);
border:1px solid #c8dce7;
border-radius:9px;
padding:11px 12px;
outline:none
}

.field textarea{
min-height:100px;
resize:vertical
}

.field input:focus,
.field textarea:focus,
.field select:focus{
border-color:#53a9e5;
box-shadow:0 0 0 3px rgba(22,136,237,.08)
}

.field input:disabled,
.field textarea:disabled,
.field select:disabled{
opacity:.72;
background:#f3f6f8
}

.motor-toolbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:14px;
padding:12px;
background:#f3f8fb;
border:1px solid #d6e5ec;
border-radius:11px
}

.motor-list{
display:flex;
flex-direction:column;
gap:12px
}

.motor-card{
border:1px solid #cbdde7;
border-radius:12px;
overflow:hidden;
background:#f8fbfd
}

.motor-card-head{
padding:13px 15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
background:#eef6fa;
border-bottom:1px solid #d5e4eb
}

.motor-card-title{
font-weight:850;
font-size:14px
}

.motor-card-sub{
font-size:10px;
color:#718796;
margin-top:3px
}

.motor-actions{
display:flex;
gap:6px;
flex-wrap:wrap
}

.motor-body{padding:15px}

.value-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.value{
border:1px solid #d1e1e8;
background:#f7fafc;
border-radius:10px;
padding:13px
}

.value-label{
font-size:10px;
color:#718796
}

.value-number{
font-size:18px;
font-weight:850;
margin-top:6px
}

.value input{
width:100%;
margin-top:7px;
background:#fff;
border:1px solid #c8dce7;
border-radius:8px;
padding:9px
}

.nameplate{
background:linear-gradient(145deg,#f0f3f4,#d7dee2);
color:#253137;
border:5px solid #77838a;
border-radius:9px;
padding:17px
}

.nameplate-header{
text-align:center;
border-bottom:2px solid #465158;
padding-bottom:11px;
margin-bottom:12px
}

.nameplate-brand{
font-size:21px;
font-weight:900
}

.nameplate-type{
font-size:11px;
font-weight:800;
margin-top:3px
}

.nameplate-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
border-top:1px solid #69757b;
border-left:1px solid #69757b
}

.np-field{
padding:8px;
border-right:1px solid #69757b;
border-bottom:1px solid #69757b
}

.np-label{
font-size:8px;
color:#59676e;
font-weight:750
}

.np-value{
font-size:12px;
font-weight:850;
margin-top:3px
}

.np-field input{
width:100%;
margin-top:4px;
padding:7px;
border:1px solid #89959b;
background:#fff;
color:#18252c;
border-radius:4px;
font-size:12px
}

.ssr-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px
}

.ssr-card{
border:1px solid #cbdde7;
background:linear-gradient(145deg,#f8fbfd,#eef6fa);
border-radius:12px;
padding:17px
}

.ssr-card-title{
font-size:11px;
color:#617b8b;
font-weight:750
}

.ssr-card-value{
font-size:25px;
color:#087bd2;
font-weight:900;
margin-top:7px
}

.cable-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.cable{
border:1px solid #d1e1e8;
background:#f8fbfd;
border-radius:11px;
padding:14px
}

.wire{
height:13px;
border-radius:20px;
margin-bottom:10px;
border:1px solid rgba(0,0,0,.18)
}

.wire-red{background:#d92828}
.wire-yellow{background:#e8c52e}
.wire-black{background:#111}
.wire-green{background:#198744}

.wire-label{
font-size:10px;
color:#6c8190;
margin-bottom:7px
}

.cable input{
width:100%;
padding:9px;
border:1px solid #c8dce7;
border-radius:8px;
background:#fff
}

.hmi-tabs{
display:flex;
gap:7px;
overflow:auto;
margin-bottom:13px
}

.hmi-tab{
flex:0 0 auto;
padding:10px 14px;
border:1px solid #bdd4e0;
border-radius:8px;
background:#f4f9fc;
color:#5d7787;
font-size:11px
}

.hmi-tab.active{
background:#1285df;
color:#fff;
border-color:#2a9af0
}

.hmi-screen{
border:2px solid #344d5c;
background:#111b22;
border-radius:12px;
padding:18px
}

.hmi-title{
text-align:center;
color:#e8eef2;
font-weight:850;
padding-bottom:13px;
border-bottom:1px solid #36444d;
margin-bottom:15px
}

.hmi-fields{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:11px
}

.hmi-field{
display:flex;
align-items:center;
gap:7px
}

.hmi-field label{
flex:1;
color:#d9e2e7;
font-size:10px
}

.hmi-field input{
width:105px;
padding:8px;
border-radius:4px;
border:1px solid #6a7881;
background:#eef3f6;
color:#15232d;
font-size:13px
}

.hmi-foot{
display:flex;
justify-content:space-between;
margin-top:16px;
padding-top:11px;
border-top:1px solid #36444d;
color:#aebcc4;
font-size:9px
}

.reference-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px
}

.reference{
background:#f7fafc;
border:1px solid #d2e1e8;
border-radius:11px;
padding:15px
}

.reference h3{
font-size:13px;
margin:0 0 7px
}

.reference p{
font-size:10px;
line-height:1.6;
color:#708694;
margin:0
}

.ref-value{
color:#087bd2;
font-size:17px;
font-weight:850;
margin:7px 0
}

.settings-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}

.setting-group{
border:1px solid #d3e1e8;
border-radius:12px;
padding:16px;
background:#f8fbfd
}

.setting-group h3{
font-size:13px;
margin:0 0 12px
}

.choice-row{
display:flex;
flex-wrap:wrap;
gap:8px
}

.choice{
border:1px solid #c6dbe6;
background:#fff;
border-radius:9px;
padding:9px 12px;
color:#567181;
font-size:11px
}

.choice.active{
background:#1285df;
color:#fff;
border-color:#2799ed
}

.empty{
text-align:center;
padding:45px 20px;
color:#718796
}

.empty h3{color:#365467}

.lock-box{
text-align:center;
padding:40px 20px
}

.lock-icon{
width:62px;
height:62px;
margin:auto auto 14px;
border:2px solid #2493e8;
border-radius:50%;
display:grid;
place-items:center;
font-size:25px
}

.password-row{
max-width:420px;
margin:auto;
display:flex;
gap:8px
}

.password-row input{
flex:1;
padding:11px;
border:1px solid #c8dce7;
border-radius:9px;
text-align:center;
letter-spacing:4px
}

.save-bar{
position:sticky;
bottom:10px;
z-index:15;
margin-top:15px;
display:flex;
justify-content:flex-end;
gap:8px;
padding:10px;
border:1px solid #cbdde7;
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
border-radius:12px;
box-shadow:0 8px 25px rgba(20,60,80,.12)
}

.toast{
position:fixed;
right:18px;
bottom:18px;
z-index:100;
padding:12px 15px;
border-radius:9px;
background:#173b50;
color:#fff;
box-shadow:var(--shadow);
font-size:12px;
opacity:0;
transform:translateY(8px);
pointer-events:none;
transition:.25s
}

.toast.show{
opacity:1;
transform:none
}

/* DARK */

.theme-dark{
--bg:#0b1d2d;
--bg2:#0d263a;
--line:#24506b;
--text:#edf5fb;
--muted:#9ab0bf;
--shadow:0 16px 40px rgba(0,0,0,.25)
}

.theme-dark .sidebar,
.theme-dark .topbar{
background:rgba(7,25,40,.95)
}

.theme-dark .card,
.theme-dark .station-card,
.theme-dark .stat,
.theme-dark .detail-tab,
.theme-dark .choice,
.theme-dark .search input,
.theme-dark .field input,
.theme-dark .field textarea,
.theme-dark .field select,
.theme-dark .meta-box,
.theme-dark .value,
.theme-dark .cable,
.theme-dark .setting-group,
.theme-dark .reference,
.theme-dark .motor-card,
.theme-dark .motor-toolbar,
.theme-dark .save-bar{
background:#102b40;
color:var(--text);
border-color:var(--line)
}

.theme-dark .field input,
.theme-dark .field textarea,
.theme-dark .field select,
.theme-dark .search input{
color:#fff;
background:#0a2235
}

.theme-dark .nav button{color:#d8e7f0}

.theme-dark .detail-tabs{
background:rgba(11,29,45,.94)
}

.theme-dark .motor-card-head{
background:#0d2538
}

.theme-dark .mode{
background:#102b40;
color:#b7c9d4;
border-color:#24506b
}

@media(max-width:1000px){
.sidebar{
width:72px;
min-width:72px;
padding:14px 8px
}

.brand{justify-content:center}

.brand-text,
.nav-text,
.sidebar-footer{display:none}

.nav button{justify-content:center}

.main{
margin-left:72px;
width:calc(100% - 72px)
}

.stats{grid-template-columns:repeat(3,1fr)}
.station-grid,.reference-grid{grid-template-columns:1fr}
.hmi-fields{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:720px){
.topbar{
height:62px;
padding:0 12px
}

.content{padding:12px}

.detail-tabs{top:62px}

.stats{grid-template-columns:repeat(2,1fr)}

.detail-grid,
.form-grid,
.settings-grid,
.ssr-grid,
.cable-grid{
grid-template-columns:1fr
}

.full{grid-column:auto}

.value-grid{grid-template-columns:1fr}

.hmi-fields{grid-template-columns:1fr}

.hmi-field input{
width:125px;
min-height:42px;
font-size:16px
}

.nameplate-grid{grid-template-columns:repeat(2,1fr)}

.toolbar{
flex-direction:column;
align-items:stretch
}

.search{max-width:none}

.password-row{
flex-direction:column
}

.station-heading h1{font-size:23px}

.detail-tab{padding:10px 11px}

.station-meta{grid-template-columns:repeat(2,1fr)}

.motor-toolbar{
flex-direction:column;
align-items:stretch
}

.save-bar{
position:static;
flex-direction:column
}

.save-bar .btn{width:100%}
}

/* PRINT / PDF */

.pdf-report{display:none}

@media print{

@page{
size:A4 landscape;
margin:4mm
}

html,body{
width:100%;
height:auto;
margin:0;
padding:0;
background:#fff!important
}

body{overflow:visible!important}

.sidebar,
.topbar,
.back-row,
.detail-tabs,
.toast,
.screen-detail{
display:none!important
}

.main{
margin:0!important;
width:100%!important
}

.content{
max-width:none!important;
padding:0!important;
margin:0!important
}

.pdf-report{
display:block!important;
width:100%!important;
background:#fff!important;
color:#111!important;
box-shadow:none!important;
margin:0!important;
padding:0!important
}

.pdf-report-header{
border:1px solid #333;
padding:2mm;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:1.5mm
}

.pdf-title{
font-size:11pt;
font-weight:900
}

.pdf-subtitle{
font-size:6pt;
margin-top:.5mm
}

.pdf-header-right{
text-align:right;
font-size:5.5pt
}

.pdf-main-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:1.5mm;
margin-bottom:1.5mm
}

.pdf-box{
border:1px solid #777;
padding:1.5mm;
break-inside:avoid;
page-break-inside:avoid
}

.pdf-box-title{
font-size:6.5pt;
font-weight:900;
border-bottom:1px solid #888;
padding-bottom:.8mm;
margin-bottom:1mm
}

.pdf-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:.5mm
}

.pdf-item{
border:1px solid #ccc;

/* =========================================================
   VERİ DÖNÜŞÜMÜ
========================================================= */

function normalizeStation(s){

if(!s.motors){

if(s.motor){

s.motors=[
{
...createMotor(1),
...s.motor
}
];

}else{

s.motors=[
createMotor(1)
];

}

}

if(!Array.isArray(s.motors))
s.motors=[createMotor(1)];

if(!s.motors.length)
s.motors=[createMotor(1)];

s.motors.forEach((m,i)=>{

const base=createMotor(i+1);

Object.assign(base,m);

if(!base.name)
base.name="Motor "+(i+1);

if(!base.cable)
base.cable={
l1:"",
l2:"",
l3:"",
pe:"",
note:""
};

if(!base.measurement)
base.measurement={};

Object.assign(m,base);

});

s.motorCount=s.motors.length;

if(!Array.isArray(s.pumps))
s.pumps=[s.pump||{}];

if(!s.pumps.length)
s.pumps=[{}];

if(!Array.isArray(s.hmi))
s.hmi=HMI_PAGES.map(()=>({}));

while(s.hmi.length<5)
s.hmi.push({});

if(!s.ssr)s.ssr={level:"",low:"",high:""};

if(!s.cable)s.cable={l1:"",l2:"",l3:"",pe:"",note:""};

if(!s.measurement)s.measurement={};

return s;

}

JSON.stringify(state.stations)
);

return true;

}catch(e){

toast("Kayıt sırasında hata oluştu.");

return false;

}

}


function loadData(){

try{

let old=
localStorage.getItem(STORAGE_KEY);

if(old){

state.stations=
JSON.parse(old);

if(!Array.isArray(state.stations))
state.stations=[];

state.stations=
state.stations.map(normalizeStation);

}

}catch(e){

state.stations=[];

}

try{

const prefs=
JSON.parse(
localStorage.getItem(PREF_KEY)||"null"
);

if(prefs){

state.settings={
...state.settings,
...prefs
};

if(!state.stations.length){

/* =========================================================

========================================================= */

function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function toast(message){

const t=document.getElementById("toast");

if(!t)return;

t.textContent=message;

t.classList.add("show");

clearTimeout(window.__toastTimer);

window.__toastTimer=
setTimeout(()=>{
t.classList.remove("show");
},2300);

}


function currentStation(){

return state.stations.find(
x=>x.id===state.selectedStation
);

}


function currentMotor(){

const s=currentStation();

if(!s)return null;

normalizeStation(s);

return s.motors[state.selectedMotor]||null;

}

function setMotorCount(value){

const s=currentStation();

if(!s)return;

let count=parseInt(value)||1;

count=Math.max(1,Math.min(20,count));

normalizeStation(s);

while(s.motors.length<count){

s.motors.push(
createMotor(s.motors.length+1)
);

}

while(s.motors.length>count){

s.motors.pop();

}

s.motors.forEach((m,i)=>{

m.name=m.name||"Motor "+(i+1);

});

s.motorCount=count;

state.selectedMotor=
Math.min(
state.selectedMotor,
count-1
);

render();

toast(
count+" motor hazırlandı. Kaydetmeyi unutmayın."
);

}

function addMotor(){

const s=currentStation();

if(!s)return;

normalizeStation(s);

if(s.motors.length>=20){

toast("En fazla 20 motor eklenebilir.");

return;

}

s.motors.push(
createMotor(s.motors.length+1)
);

s.motorCount=s.motors.length;

state.selectedMotor=s.motors.length-1;

render();

toast(
"Motor "+s.motors.length+" eklendi. Kaydetmeyi unutmayın."
);

}


function removeMotor(){

const s=currentStation();

if(!s)return;

normalizeStation(s);

if(s.motors.length<=1){

toast("En az 1 motor bulunmalı.");

return;

}

const deleted=s.motors.pop();

s.motorCount=s.motors.length;

state.selectedMotor=
Math.min(
state.selectedMotor,
s.motors.length-1
);

render();

toast(
deleted.name+" kaldırıldı. Kaydetmeyi unutmayın."
);

}


function renameMotor(index){

const s=currentStation();

if(!s)return;

const m=s.motors[index];

const name=prompt(
"Motorun adı:",
m.name||"Motor "+(index+1)
);

if(name===null)return;

m.name=name.trim()||"Motor "+(index+1);

render();

toast("Motor adı değiştirildi. Kaydetmeyi unutmayın.");

}

<h3>Renk Teması</h3>

<div class="choice-row">

${choice("theme","light","Açık")}

${choice("theme","dark","Koyu")}

</div>

</div>

<div class="setting-group">

<h3>Bilgi Yoğunluğu</h3>

<div class="choice-row">

${choice("density","normal","Normal")}

class="setting-group"
style="grid-column:1/-1">

<h3>Veri Kaydı</h3>

color:#708694;

Değişiklikleri yaptıktan sonra

</p>

`;

}


function choice(key,value,label){

return`

<button
class="choice ${state.settings[key]===value?"active":""}"
onclick="
setPreference(
'${key}',
'${value}'
)
">

${label}

</button>

`;

}


function setPreference(key,value){

state.settings[key]=value;

localStorage.setItem(
PREF_KEY,
JSON.stringify(state.settings)
);

applyPreferences();

render();

toast("Görünüm ayarı kaydedildi.");

}


function applyPreferences(){

document.body.classList.toggle(
"theme-dark",
state.settings.theme==="dark"
);

document.body.classList.toggle(
"compact",
state.settings.density==="compact"
);

}


/* =========================================================
   ACCESS
========================================================= */

function openAccess(){

document.getElementById("appContent").innerHTML=`

<section class="card">

<div class="lock-box">

<div class="lock-icon">
🔒
</div>

<h2>
Düzenleme Yetkisi
</h2>

<p>
Kayıt eklemek veya değiştirmek için
düzenleme şifresini girin.
</p>

<div class="password-row">

<input
id="passwordInput"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="Şifre"
onkeydown="
if(event.key==='Enter')
checkPassword()
">

<button
class="btn btn-primary"
onclick="checkPassword()">

Düzenleme Moduna Gir

</button>

</div>

<div style="margin-top:14px">

<button
class="btn"
onclick="visitorContinue()">

Ziyaretçi Olarak Devam Et

</button>

</div>

</div>

</section>

`;

}


function checkPassword(){

const input=
document.getElementById("passwordInput");

if(
input &&
input.value===EDIT_PASSWORD
){

state.editMode=true;

render();

toast("Düzenleme modu açıldı.");

}else{

toast("Şifre hatalı.");

}

}


function visitorContinue(){

state.editMode=false;

render();

}


function lockEditing(){

/*
   Kilitlemeden önce açık olan değişiklikleri
   otomatik kaydetmiyoruz.
   Kullanıcı KAYDET'e basmalı.
*/

state.editMode=false;

render();

toast("Düzenleme modu kapatıldı.");

}


/* =========================================================
   YENİ TERFİ
========================================================= */

function newStation(){

if(!state.editMode){

openAccess();

return;

}

const s=createDefaultStation();

const numbers=
state.stations.map(
x=>
parseInt(
String(x.code).replace(/\D/g,"")
)||0
);

const next=
Math.max(0,...numbers)+1;

s.code=
"T"+
String(next).padStart(3,"0");

s.name="Yeni Terfi";

state.stations.push(s);

saveData();

state.selectedStation=s.id;
state.page="detail";
state.detailTab="station";
state.hmiPage=0;
state.selectedMotor=0;

document.getElementById("pageTitle").textContent=
"Terfi Teknik Arşivi";

render();

toast("Yeni terfi oluşturuldu.");

}


/* =========================================================
   SİL
========================================================= */

function deleteStation(){

if(!state.editMode)return;

const s=currentStation();

if(!s)return;

if(!confirm(
`"${s.code} - ${s.name}" kaydı silinsin mi?`
))
return;

state.stations=
state.stations.filter(
x=>x.id!==s.id
);

saveData();

showStations();

toast("Terfi kaydı silindi.");

}

function exportPDF(){

const s=currentStation();

if(!s){

toast("Önce bir terfi kaydı açın.");

return;

}

normalizeStation(s);

/*
   PDF oluşturulurken state.hmiPage kesinlikle
   kullanılmıyor.

   Böylece ekranda HMI Sayfa 1 açık olsa bile:

   HMI 1
   HMI 2
   HMI 3
   HMI 4
   HMI 5

   tamamı PDF raporuna hazırlanıyor.
*/

document.title=
"MESKI - "+
(s.code||"Terfi")+
" - Teknik Arşiv";

toast("PDF hazırlanıyor...");

setTimeout(()=>{

window.print();

setTimeout(()=>{

document.title="MESKİ | Terfi Arşivim";

},1000);

},250);

}
