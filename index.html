<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">

<title>Terfi Arşivim</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#07111f;
  --panel:#0d1b2d;
  --panel2:#10243a;
  --line:#20354d;
  --text:#f5f7fb;
  --muted:#9fb0c3;
  --blue:#2997ff;
  --cyan:#28d7ff;
  --green:#35d07f;
  --red:#ff5d6c;
  --orange:#ffad42;
  --shadow:0 18px 50px #0008
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}

body{
  min-height:100vh
}

button,input,textarea,select{
  font:inherit
}

button{
  border:0;
  cursor:pointer
}

.app{
  max-width:1180px;
  margin:auto;
  padding:18px 18px 100px
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px
}

.brand{
  display:flex;
  align-items:center;
  gap:12px
}

.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#1687ff,#16d5c5);
  font-size:24px;
  box-shadow:0 8px 25px #078fff44
}

.brand h1{
  font-size:19px;
  margin:0
}

.brand p{
  font-size:12px;
  color:var(--muted);
  margin:3px 0 0
}

.technician{
  font-size:12px;
  color:#dce8f5;
  background:#10243a;
  border:1px solid var(--line);
  padding:9px 12px;
  border-radius:999px
}

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid #29445f;
  border-radius:30px;
  min-height:300px;
  padding:34px;
  background:
  linear-gradient(90deg,#07111ff5 0%,#07111fcc 42%,#07111f70 100%),
  url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=85")
  center/cover
}

.hero:after{
  content:"";
  position:absolute;
  right:-80px;
  bottom:-110px;
  width:330px;
  height:330px;
  border-radius:50%;
  background:#1598ff22;
  filter:blur(5px)
}

.hero .eyebrow{
  color:#70d9ff;
  font-weight:800;
  letter-spacing:.12em;
  font-size:12px
}

.hero h2{
  font-size:clamp(34px,7vw,62px);
  line-height:.98;
  margin:10px 0 14px;
  max-width:720px
}

.hero p{
  max-width:620px;
  color:#c5d2df;
  line-height:1.55;
  margin:0
}

.hero-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:24px
}

.btn{
  padding:12px 16px;
  border-radius:13px;
  font-weight:800
}

.btn.primary{
  background:var(--blue);
  color:white
}

.btn.secondary{
  background:#ffffff12;
  color:white;
  border:1px solid #ffffff18
}

.btn.danger{
  background:#ff5d6c18;
  color:#ff9aa4;
  border:1px solid #ff5d6c35
}

.btn.green{
  background:#35d07f18;
  color:#70e8a7;
  border:1px solid #35d07f35
}

.searchbar{
  display:flex;
  gap:10px;
  margin:20px 0
}

.searchbar input,
.field input,
.field textarea,
.field select{
  width:100%;
  background:#0c1a2a;
  color:white;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  outline:none
}

input:focus,
textarea:focus,
select:focus{
  border-color:#2e9eff;
  box-shadow:0 0 0 3px #2997ff18
}

.searchbar input{
  padding:15px 16px
}

.section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin:26px 0 12px
}

.section-title h3{
  margin:0;
  font-size:22px
}

.section-title span{
  color:var(--muted);
  font-size:13px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.stat{
  background:linear-gradient(145deg,#0f2236,#0a1726);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px
}

.stat .icon{
  font-size:23px
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:8px
}

.stat span{
  color:var(--muted);
  font-size:12px
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.card{
  background:#0d1b2d;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  box-shadow:0 10px 30px #0002
}

.station{
  position:relative;
  overflow:hidden;
  min-height:190px;
  cursor:pointer
}

.station:before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--img) center/cover;
  opacity:.22;
  transition:.25s
}

.station:hover:before{
  opacity:.34;
  transform:scale(1.03)
}

.station>*{
  position:relative
}

.station h3{
  font-size:23px;
  margin:8px 0 5px
}

.station p{
  color:var(--muted);
  margin:0
}

.station .tag{
  display:inline-block;
  background:#07111dcc;
  border:1px solid #ffffff20;
  padding:6px 9px;
  border-radius:999px;
  font-size:11px
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px;
  border:1px dashed #2a4159;
  border-radius:20px
}

.detail-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin:20px 0
}

.back{
  color:#b9c9da;
  background:#ffffff0d;
  border:1px solid var(--line);
  padding:10px 13px;
  border-radius:12px
}

.detail-title h2{
  margin:0;
  font-size:32px
}

.detail-title p{
  margin:5px 0;
  color:var(--muted)
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:4px;
  margin:18px 0
}

.tab{
  white-space:nowrap;
  background:#0d1b2d;
  color:#aebed0;
  border:1px solid var(--line);
  padding:10px 13px;
  border-radius:12px;
  font-weight:800
}

.tab.active{
  background:#1687ff;
  color:white;
  border-color:#1687ff
}

.form-card{
  margin-bottom:14px
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.field{
  margin-bottom:12px
}

.field label{
  display:block;
  font-size:12px;
  color:#b8c8d8;
  font-weight:800;
  margin:0 0 6px
}

.field textarea{
  min-height:100px;
  resize:vertical
}

.record{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  border-top:1px solid #ffffff0d;
  padding:15px 0
}

.record:first-child{
  border-top:0
}

.record h4{
  margin:0 0 5px;
  font-size:16px
}

.record p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45
}

.record .meta{
  text-align:right;
  color:#7890a8;
  font-size:11px;
  white-space:nowrap
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:800
}

.ok{
  background:#35d07f18;
  color:#70e8a7
}

.warn{
  background:#ffad4218;
  color:#ffc16d
}

.fault{
  background:#ff5d6c18;
  color:#ff8995
}

.motor-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}

.motor-card{
  background:linear-gradient(145deg,#0e2034,#091727);
  border:1px solid #28435e;
  border-radius:22px;
  padding:18px;
  position:relative
}

.motor-card.saved{
  border-color:#28704d
}

.motor-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px
}

.motor-title{
  display:flex;
  align-items:center;
  gap:10px
}

.motor-number{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#1687ff20;
  border:1px solid #1687ff55;
  display:grid;
  place-items:center;
  color:#6fc1ff;
  font-weight:900
}

.motor-title h4{
  margin:0;
  font-size:18px
}

.motor-title span{
  color:var(--muted);
  font-size:11px
}

.motor-actions{
  display:flex;
  gap:6px
}

.small-btn{
  padding:8px 10px;
  border-radius:10px;
  background:#ffffff0c;
  color:#cbd8e5;
  border:1px solid #ffffff12
}

.small-btn.delete{
  color:#ff8995;
  background:#ff5d6c10
}

.motor-fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.motor-fields .field{
  margin-bottom:0
}

.motor-fields .full{
  grid-column:1/-1
}

.motor-status{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #ffffff0d;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.motor-empty{
  border:1px dashed #2a4159;
  border-radius:18px;
  padding:25px;
  text-align:center;
  color:var(--muted)
}

.motor-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:15px 0
}

.info-box{
  background:#1687ff0c;
  border:1px solid #1687ff25;
  border-radius:16px;
  padding:14px;
  color:#bcd8ee;
  font-size:13px;
  line-height:1.5;
  margin-bottom:15px
}

.footer{
  margin-top:45px;
  padding:18px 2px;
  color:#708398;
  font-size:12px;
  text-align:center;
  border-top:1px solid #ffffff0b
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(30px);
  opacity:0;
  background:#10243a;
  border:1px solid #29445f;
  color:white;
  padding:12px 16px;
  border-radius:13px;
  box-shadow:var(--shadow);
  transition:.25s;
  z-index:20
}

.toast.show{
  opacity:1;
  transform:translateX(-50%)
}

.loading{
  padding:35px;
  text-align:center;
  color:var(--muted)
}

@media(max-width:900px){
  .motor-grid{
    grid-template-columns:1fr
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  .cards{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:600px){
  .app{
    padding:12px 12px 90px
  }

  .topbar{
    align-items:flex-start
  }

  .technician{
    display:none
  }

  .hero{
    border-radius:24px;
    min-height:270px;
    padding:25px
  }

  .cards,
  .form-grid{
    grid-template-columns:1fr
  }

  .stats{
    grid-template-columns:1fr 1fr
  }

  .detail-head{
    flex-direction:column
  }

  .searchbar{
    margin-top:15px
  }

  .motor-fields{
    grid-template-columns:1fr
  }

  .motor-fields .full{
    grid-column:auto
  }

  .motor-toolbar{
    align-items:flex-start;
    flex-direction:column
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="topbar">

    <div class="brand">
      <div class="logo">⚡</div>

      <div>
        <h1>Terfi Arşivim</h1>
        <p>Saha teknik kayıt sistemi</p>
      </div>
    </div>

    <div class="technician">
      👨‍🔧 Teknisyen: <b>Musa</b>
    </div>

  </div>

  <main id="app">
    <div class="loading">Arşiv yükleniyor…</div>
  </main>

  <div class="footer">
    Terfi Arşivim • Elektrik / Mekanik Saha Arşivi
  </div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://vthjqdlsijdvvlegpqrg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pJrgD6-8p-SOxTu8bP02Ag_Cv5InPtB";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let terfiler = [];

let current = null;

let activeTab = "genel";

let records = [];

let motorRecords = [];


/* =========================================================
   TABLAR
========================================================= */

const tabs = [

  ["genel","📋 Genel"],

  ["motor","⚡ Motorlar"],

  ["pompa","💧 Pompalar"],

  ["surucu","🎛️ Sürücüler"],

  ["olcum","📏 Ölçümler"]

];


/* =========================================================
   TANIMLAR
========================================================= */

const definitions = {

  motor:{
    table:"motorlar",
    title:"Motor",
    icon:"⚡",

    fields:[
      ["ad","Motor Adı"],
      ["marka_model","Marka / Model"],
      ["guc","Güç"],
      ["gerilim","Gerilim"],
      ["akim","Akım"],
      ["devir","Devir"],
      ["seri_no","Seri No"],
      ["notlar","Teknisyen Notu"]
    ]
  },

  pompa:{
    table:"pompalar",
    title:"Pompa",
    icon:"💧",

    fields:[
      ["ad","Pompa Adı"],
      ["marka_model","Marka / Model"],
      ["debi","Debi"],
      ["basma_yuksekligi","Basma Yüksekliği"],
      ["guc","Güç"],
      ["notlar","Teknisyen Notu"]
    ]
  },

  surucu:{
    table:"suruculer",
    title:"Sürücü",
    icon:"🎛️",

    fields:[
      ["ad","Sürücü Adı"],
      ["marka","Marka"],
      ["model","Model"],
      ["guc","Güç"],
      ["gerilim","Gerilim"],
      ["parametreler","Parametre / Ayar Notları"],
      ["ariza_kayitlari","Arıza Kayıtları"],
      ["notlar","Teknisyen Notu"]
    ]
  },

  olcum:{
    table:"olcumler",
    title:"Ölçüm",
    icon:"📏",

    fields:[
      ["tur","Ölçüm Türü"],
      ["deger","Değer"],
      ["birim","Birim"],
      ["aciklama","Açıklama"]
    ]
  }

};


/* =========================================================
   YARDIMCI
========================================================= */

const esc = s =>
String(s ?? "")
.replace(/[&<>"']/g,m=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  "\"":"&quot;",
  "'":"&#39;"

}[m]));


const toast = m => {

  const x =
  document.getElementById("toast");

  x.textContent = m;

  x.classList.add("show");

  setTimeout(
    ()=>x.classList.remove("show"),
    2200
  );

};


/* =========================================================
   TERFİLERİ YÜKLE
========================================================= */

async function loadTerfiler(){

  const {data,error} =
  await db
  .from("terfiler")
  .select("*")
  .order("terfi_no");

  if(error){

    renderError(error.message);

    return;
  }

  terfiler = data || [];

  showHome();

}


/* =========================================================
   HATA
========================================================= */

function renderError(msg){

  document.getElementById("app").innerHTML = `

    <div class="card" style="margin-top:25px">

      <h2>⚠️ Veritabanına bağlanamadı</h2>

      <p style="color:var(--muted)">
        ${esc(msg)}
      </p>

      <p style="color:var(--muted)">
        Supabase URL/anahtarını ve tablo izinlerini kontrol et.
      </p>

      <button
        class="btn primary"
        onclick="loadTerfiler()">
        Tekrar Dene
      </button>

    </div>

  `;

}


/* =========================================================
   ANA SAYFA
========================================================= */

function showHome(){

  current = null;

  document.getElementById("app").innerHTML = `

    <section class="hero">

      <div class="eyebrow">
        SAHA TEKNİK ARŞİVİ
      </div>

      <h2>
        İstasyondaki bilgiyi kaybetme.
      </h2>

      <p>
        Terfi, motor, pompa, sürücü ve ölçüm
        kayıtlarını tek yerde tut.
        Her terfinin kendi motorlarını ayrı ayrı
        takip et.
      </p>

      <div class="hero-actions">

        <button
          class="btn primary"
          onclick="newTerfi()">
          ＋ Yeni Terfi İstasyonu
        </button>

        <button
          class="btn secondary"
          onclick="document.getElementById('search').focus()">
          🔎 Arşivde Ara
        </button>

      </div>

    </section>


    <div class="searchbar">

      <input
        id="search"
        placeholder="İstasyon adı, terfi no veya adres ara…">

    </div>


    <div class="stats">

      <div class="stat">

        <div class="icon">🏭</div>

        <b>${terfiler.length}</b>

        <span>Terfi istasyonu</span>

      </div>


      <div class="stat">

        <div class="icon">⚡</div>

        <b id="totalMotor">
          …
        </b>

        <span>Motor</span>

      </div>


      <div class="stat">

        <div class="icon">💧</div>

        <b id="totalPompa">
          …
        </b>

        <span>Pompa</span>

      </div>


      <div class="stat">

        <div class="icon">🔧</div>

        <b>${terfiler.length}</b>

        <span>Aktif arşiv</span>

      </div>

    </div>


    <div class="section-title">

      <h3>İstasyonlar</h3>

      <span>
        ${terfiler.length} kayıt
      </span>

    </div>


    <div id="stationList" class="cards"></div>

  `;


  document.getElementById("search").oninput =
  e => drawStations(e.target.value);


  drawStations("");


  loadTotalEquipment();

}


/* =========================================================
   TOPLAM MOTOR / POMPA
========================================================= */

async function loadTotalEquipment(){

  const motorResult =
  await db
  .from("motorlar")
  .select("id",{count:"exact",head:true});


  const pompaResult =
  await db
  .from("pompalar")
  .select("id",{count:"exact",head:true});


  const motorEl =
  document.getElementById("totalMotor");

  const pompaEl =
  document.getElementById("totalPompa");


  if(motorEl){

    motorEl.textContent =
    motorResult.error
      ? "—"
      : motorResult.count || 0;

  }


  if(pompaEl){

    pompaEl.textContent =
    pompaResult.error
      ? "—"
      : pompaResult.count || 0;

  }

}


/* =========================================================
   TERFİ LİSTESİ
========================================================= */

function drawStations(q){

  const box =
  document.getElementById("stationList");

  if(!box)return;


  const rows =
  terfiler.filter(t =>

    (`${t.ad || ""} ${t.terfi_no || ""} ${t.adres || ""}`)
    .toLowerCase()
    .includes(q.toLowerCase())

  );


  if(!rows.length){

    box.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1">

        Henüz kayıt yok.
        İlk terfi istasyonunu oluşturabilirsin.

      </div>

    `;

    return;
  }


  box.innerHTML =

  rows.map(t => `

    <article
      class="card station"
      style="--img:url('https://images.unsplash.com/photo-1581092921461-eab62e97a780?auto=format&fit=crop&w=1000&q=80')"
      onclick="openTerfi('${esc(t.id)}')">

      <span class="tag">
        ${esc(t.terfi_no)}
      </span>

      <h3>
        ${esc(t.ad)}
      </h3>

      <p>
        ${esc(t.adres || "Adres girilmedi")}
      </p>

      <div
        style="margin-top:25px;color:#c7d5e3;font-size:12px">

        Detayları Aç →

      </div>

    </article>

  `).join("");

}


/* =========================================================
   YENİ TERFİ
========================================================= */

function newTerfi(){

  current = {

    id:null,

    terfi_no:
    "T" +
    String(terfiler.length + 1)
    .padStart(3,"0"),

    ad:"",

    adres:"",

    aciklama:""

  };


  activeTab = "genel";

  showDetail();

}


/* =========================================================
   TERFİ AÇ
========================================================= */

function openTerfi(id){

  current =
  terfiler.find(x => x.id === id);

  if(!current)return;

  activeTab = "genel";

  showDetail();

}


/* =========================================================
   TERFİ DETAY
========================================================= */

function showDetail(){

  document.getElementById("app").innerHTML = `

    <div class="detail-head">

      <div class="detail-title">

        <button
          class="back"
          onclick="showHome()">
          ← Arşive Dön
        </button>

        <h2 style="margin-top:15px">

          ${esc(
            current.ad ||
            "Yeni Terfi İstasyonu"
          )}

        </h2>

        <p>
          ${esc(current.terfi_no || "")}
        </p>

      </div>


      ${
        current.id
        ?
        `<button
          class="btn danger"
          onclick="deleteTerfi()">
          Terfiyi Sil
        </button>`
        :
        ""
      }

    </div>


    <div class="card form-card">

      <div class="form-grid">

        <div class="field">

          <label>
            Terfi No
          </label>

          <input
            id="terfi_no"
            value="${esc(current.terfi_no)}">

        </div>


        <div class="field">

          <label>
            Terfi / İstasyon Adı
          </label>

          <input
            id="ad"
            value="${esc(current.ad)}">

        </div>

      </div>


      <div class="field">

        <label>
          Adres / Konum
        </label>

        <input
          id="adres"
          value="${esc(current.adres)}">

      </div>


      <div class="field">

        <label>
          Genel Teknik Açıklama
        </label>

        <textarea
          id="aciklama">${esc(current.aciklama)}</textarea>

      </div>


      <button
        class="btn primary"
        onclick="saveTerfi()">

        💾 ${
          current.id
          ?
          "Değişiklikleri Kaydet"
          :
          "İstasyonu Oluştur"
        }

      </button>


      <div id="message"></div>

    </div>


    ${
      current.id
      ?

      `

      <div class="tabs">

        ${
          tabs.map(t => `

            <button
              class="tab ${
                activeTab === t[0]
                ? "active"
                : ""
              }"
              onclick="changeTab('${t[0]}')">

              ${t[1]}

            </button>

          `).join("")
        }

      </div>

      <div id="tab"></div>

      `

      :

      `

      <div class="info-box">

        ℹ️ Önce terfi istasyonunu oluştur.
        Daha sonra bu istasyonun içine
        istediğin kadar motor, pompa, sürücü
        ve ölçüm ekleyebilirsin.

      </div>

      `
    }

  `;


  if(
    current.id &&
    activeTab !== "genel"
  ){

    loadTab();

  }

}


/* =========================================================
   TAB DEĞİŞTİR
========================================================= */

function changeTab(t){

  activeTab = t;

  showDetail();

}


/* =========================================================
   TERFİ KAYDET
========================================================= */

async function saveTerfi(){

  const payload = {

    terfi_no:
    val("terfi_no"),

    ad:
    val("ad"),

    adres:
    val("adres"),

    aciklama:
    val("aciklama")

  };


  if(
    !payload.terfi_no ||
    !payload.ad
  ){

    alert(
      "Terfi No ve istasyon adı zorunlu."
    );

    return;

  }


  let result;


  if(current.id){

    result =
    await db
    .from("terfiler")
    .update(payload)
    .eq("id",current.id)
    .select()
    .single();

  }else{

    result =
    await db
    .from("terfiler")
    .insert(payload)
    .select()
    .single();

  }


  if(result.error){

    const msg =
    document.getElementById("message");

    if(msg){

      msg.innerHTML = `

        <div class="badge fault">

          ${esc(result.error.message)}

        </div>

      `;

    }

    return;

  }


  current = result.data;


  const {data} =
  await db
  .from("terfiler")
  .select("*")
  .order("terfi_no");


  terfiler = data || [];


  showDetail();

  toast(
    "Terfi istasyonu başarıyla kaydedildi ✓"
  );

}


/* =========================================================
   TERFİ SİL
========================================================= */

async function deleteTerfi(){

  if(
    !confirm(
      "Bu terfi istasyonu silinsin mi?"
    )
  )return;


  const {error} =
  await db
  .from("terfiler")
  .delete()
  .eq("id",current.id);


  if(error){

    alert(error.message);

    return;

  }


  terfiler =
  terfiler.filter(
    x => x.id !== current.id
  );


  showHome();

  toast(
    "İstasyon silindi"
  );

}


/* =========================================================
   NORMAL TABLAR
========================================================= */

async function loadTab(){

  if(activeTab === "motor"){

    await loadMotors();

    return;

  }


  const d =
  definitions[activeTab];


  const {data,error} =
  await db
  .from(d.table)
  .select("*")
  .eq("terfi_id",current.id)
  .order(
    "created_at",
    {ascending:false}
  );


  const tab =
  document.getElementById("tab");


  if(error){

    tab.innerHTML = `

      <div class="card">

        <span class="badge fault">
          Tablo hatası
        </span>

        <p style="color:var(--muted)">
          ${esc(error.message)}
        </p>

      </div>

    `;

    return;

  }


  records = data || [];


  tab.innerHTML = `

    <div class="card form-card">

      <div class="section-title"
           style="margin-top:0">

        <h3>
          ${d.icon} Yeni ${d.title}
        </h3>

        <span>
          Saha kaydı
        </span>

      </div>


      ${
        d.fields.map(
          f => `

          <div class="field">

            <label>
              ${esc(f[1])}
            </label>

            ${
              [
                "notlar",
                "parametreler",
                "ariza_kayitlari",
                "aciklama"
              ].includes(f[0])

              ?

              `
              <textarea
                id="field_${f[0]}"
                placeholder="Teknik detay, ölçüm sonucu, gözlem…">
              </textarea>
              `

              :

              `
              <input
                id="field_${f[0]}"
                placeholder="${esc(f[1])}">
              `
            }

          </div>

        `
        ).join("")
      }


      <button
        class="btn primary"
        onclick="addRecord()">

        ＋ ${d.title} Kaydet

      </button>

    </div>


    <div class="card">

      <div class="section-title"
           style="margin-top:0">

        <h3>
          Geçmiş ${d.title} Kayıtları
        </h3>

        <span>
          ${records.length} kayıt
        </span>

      </div>


      ${
        records.length
        ?
        records.map(recordHtml).join("")
        :
        `
        <div class="empty">

          Bu istasyon için henüz
          ${d.title.toLowerCase()}
          kaydı yok.

        </div>
        `
      }

    </div>

  `;

}


/* =========================================================
   MOTORLARI YÜKLE
========================================================= */

async function loadMotors(){

  const tab =
  document.getElementById("tab");


  tab.innerHTML = `

    <div class="loading">
      Motorlar yükleniyor…
    </div>

  `;


  const {data,error} =
  await db
  .from("motorlar")
  .select("*")
  .eq("terfi_id",current.id)
  .order(
    "created_at",
    {ascending:true}
  );


  if(error){

    tab.innerHTML = `

      <div class="card">

        <span class="badge fault">
          Motor tablosu hatası
        </span>

        <p style="color:var(--muted)">
          ${esc(error.message)}
        </p>

      </div>

    `;

    return;

  }


  motorRecords = data || [];


  renderMotors();

}


/* =========================================================
   MOTORLARI EKRANA BAS
========================================================= */

function renderMotors(){

  const tab =
  document.getElementById("tab");


  /*
    En az 5 motor kutusu hazır.
    Eğer veritabanında 7 motor varsa 7 kutu gösterilir.
  */

  const count =
  Math.max(
    5,
    motorRecords.length
  );


  let html = `

    <div class="info-box">

      <b>⚡ Bu terfinin motorları</b><br>

      Bu bölümde bu istasyona bağlı
      motorları tek tek kaydedebilirsin.
      İlk 5 motor alanı hazır olarak
      oluşturulmuştur.

      İhtiyaç olursa
      <b>+ Motor Ekle</b>
      ile motor sayısını artırabilirsin.

    </div>


    <div class="motor-toolbar">

      <div>

        <b style="font-size:18px">
          Motor Listesi
        </b>

        <div
          style="color:var(--muted);font-size:12px;margin-top:4px">

          ${
            motorRecords.length
          }
          kayıtlı motor

        </div>

      </div>


      <button
        class="btn primary"
        onclick="addMotorCard()">

        ＋ Motor Ekle

      </button>

    </div>


    <div
      id="motorGrid"
      class="motor-grid">

  `;


  for(let i=0;i<count;i++){

    const motor =
    motorRecords[i] || null;

    html +=
    motorCardHtml(
      motor,
      i + 1
    );

  }


  html += `

    </div>

  `;


  tab.innerHTML = html;

}


/* =========================================================
   MOTOR KARTI

        <div class="motor-actions">

            motor
            ?

            `
            <button

            Marka / Model

              motor?.marka_model || ""
            )}"

        </div>


        <div class="field">

          <label>
            Güç
          </label>

          <input
            id="motor_${esc(id)}_guc"
            value="${esc(
              motor?.guc || ""
            )}"
            placeholder="Örn: 75 kW">

        </div>


        <div class="field">

          <label>
            Gerilim
          </label>

          <input
            id="motor_${esc(id)}_gerilim"
            value="${esc(
              motor?.gerilim || ""
            )}"
            placeholder="Örn: 400 V">

        </div>


        <div class="field">

          <label>
            Akım
          </label>

          <input
            id="motor_${esc(id)}_akim"
            value="${esc(
              motor?.akim || ""
            )}"
            placeholder="Örn: 140 A">

        </div>


        <div class="field">

          <label>
            Devir
          </label>

          <input
            id="motor_${esc(id)}_devir"
            value="${esc(
              motor?.devir || ""
            )}"
            placeholder="Örn: 1480 d/d">

        </div>


        <div class="field">

          <label>
            Seri No
          </label>

          <input
            id="motor_${esc(id)}_seri_no"
            value="${esc(
              motor?.seri_no || ""
            )}"
            placeholder="Motor seri numarası">

        </div>


        <div class="field full">

          <label>
            Teknisyen Notu
          </label>

          <textarea

            )}</textarea>

        </div>


      </div>


      <div class="motor-status">

        <span>

          ${
            motor

            `
            <span class="badge ok">
              ✓ Kayıtlı
            </span>
            `

            `
            <span class="badge warn">

        <button

/* =========================================================
   YENİ MOTOR KARTI
========================================================= */

function addMotorCard(){

  const nextNumber =
  motorRecords.length + 1;


  /*
    Burada doğrudan veritabanına kayıt atmıyoruz.
    Önce yeni kart oluşturuyoruz.
  */


  const grid =
  document.getElementById("motorGrid");


  if(!grid)return;


  grid.insertAdjacentHTML(
    "beforeend",
    motorCardHtml(
      null,
      nextNumber
    )
  );


  const card =
  document.getElementById(
    "motorCard_new_" + nextNumber
  );


  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }


  toast(
    "Yeni motor alanı eklendi"
  );

}


/* =========================================================
   MOTOR KAYDET
========================================================= */

async function saveMotor(
  id,
  number,
  isExisting
){

  const prefix =
  "motor_" + id;


  const payload = {

    terfi_id:current.id,

    ad:
    document.getElementById(
      prefix + "_ad"
    ).value.trim(),

    marka_model:
    document.getElementById(
      prefix + "_marka_model"
    ).value.trim(),

    guc:
    document.getElementById(
      prefix + "_guc"
    ).value.trim(),

    gerilim:
    document.getElementById(
      prefix + "_gerilim"
    ).value.trim(),

    akim:
    document.getElementById(
      prefix + "_akim"
    ).value.trim(),

    devir:
    document.getElementById(
      prefix + "_devir"
    ).value.trim(),

    seri_no:
    document.getElementById(
      prefix + "_seri_no"
    ).value.trim(),

    notlar:
    document.getElementById(
      prefix + "_notlar"
    ).value.trim()

  };


  if(!payload.ad){

    alert(
      "Motor adı boş bırakılamaz."
    );

    return;

  }


  let result;


  if(isExisting){

    result =
    await db
    .from("motorlar")
    .update(payload)
    .eq("id",id)
    .select()
    .single();

  }else{

    result =
    await db
    .from("motorlar")
    .insert(payload)
    .select()
    .single();

  }


  if(result.error){

    alert(
      "Motor kaydedilemedi:\n\n" +
      result.error.message
    );

    return;

  }


  toast(
    "Motor " +
    number +
    " başarıyla kaydedildi ✓"
  );


  await loadMotors();

}


/* =========================================================
   MOTOR SİL
========================================================= */

async function deleteMotor(id){

  if(
    !confirm(
      "Bu motor kaydı silinsin mi?"
    )
  ){

    return;

  }


  const {error} =
  await db
  .from("motorlar")
  .delete()
  .eq("id",id);


  if(error){

    alert(
      "Motor silinemedi:\n\n" +
      error.message
    );

    return;

  }


  toast(
    "Motor silindi"
  );


  await loadMotors();

}


/* =========================================================
   DİĞER KAYITLAR
========================================================= */

function recordHtml(x){

  const d =
  definitions[activeTab];


  let title =
  x.ad ||
  x.tur ||
  "Kayıt";


  let sub =
  x.marka_model ||
  x.model ||
  x.deger ||
  x.aciklama ||
  "";


  let extra =
  d.fields
  .filter(
    f =>
    ![
      "ad",
      "tur",
      "marka_model",
      "model",
      "deger",
      "aciklama"
    ].includes(f[0])
    &&
    x[f[0]]
  )
  .slice(0,2)
  .map(
    f =>
    `${esc(f[1])}: ${esc(x[f[0]])}`
  )
  .join(" • ");


  return `

    <div class="record">

      <div>

        <h4>
          ${esc(title)}
        </h4>

        <p>

          ${esc(sub)}

          ${
            extra
            ?
            `<br>${extra}`
            :
            ""
          }

        </p>

      </div>


      <div class="meta">

        ${
          x.created_at
          ?
          new Date(
            x.created_at
          ).toLocaleDateString("tr-TR")
          :
          ""
        }

        <br>


        <button
          class="btn danger"
          style="
            padding:7px 9px;
            margin-top:8px;
            font-size:11px
          "
          onclick="removeRecord('${esc(x.id)}')">

          Sil

        </button>

      </div>

    </div>

  `;

}


/* =========================================================
   NORMAL KAYIT EKLE
========================================================= */

async function addRecord(){

  const d =
  definitions[activeTab];


  const record = {
    terfi_id:current.id
  };


  d.fields.forEach(
    f => {

      const element =
      document.getElementById(
        "field_" + f[0]
      );


      if(element){

        record[f[0]] =
        element.value.trim();

      }

    }
  );


  if(activeTab === "olcum"){

    record.tarih =
    new Date().toISOString();

  }


  const {error} =
  await db
  .from(d.table)
  .insert(record);


  if(error){

    alert(error.message);

    return;

  }


  await loadTab();

  toast(
    `${d.title} kaydedildi ✓`
  );

}


/* =========================================================
   NORMAL KAYIT SİL
========================================================= */

async function removeRecord(id){

  if(
    !confirm(
      "Bu kayıt silinsin mi?"
    )
  ){

    return;

  }


  const d =
  definitions[activeTab];


  const {error} =
  await db
  .from(d.table)
  .delete()
  .eq("id",id);


  if(error){

    alert(error.message);

    return;

  }


  await loadTab();

  toast(
    "Kayıt silindi"
  );

}


/* =========================================================
   INPUT DEĞERİ
========================================================= */

function val(id){

  const el =
  document.getElementById(id);

  return el
    ?
    el.value.trim()
    :
    "";

}

   BAŞLAT
========================================================= */

loadTerfiler();

</script>
