<!doctype html>  
<html lang="tr">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  
<meta name="theme-color" content="#061a2d">  
<title>MESKİ Terfi Arşivim</title>  
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  
<style>  
:root{  
 --bg:#061a2d;  
 --bg2:#09233b;  
 --card:#0c2a45;  
 --card2:#102f4d;  
 --line:#285573;  
 --line2:#3a769d;  
 --text:#eff8ff;  
 --muted:#9eb9cc;  
 --blue:#2eacef;  
 --blue2:#6dd0ff;  
 --ok:#18bd82;  
 --danger:#df4e5b;  
 --warn:#e0a62f;  
 --shadow:0 12px 32px rgba(0,0,0,.22);  
 --radius:16px;  
 --scale:1;  
}  
  
*{  
 box-sizing:border-box  
}  
  
html{  
 scroll-behavior:smooth  
}  
  
body{  
 margin:0;  
 min-height:100vh;  
 background:  
  radial-gradient(circle at top right,rgba(46,172,239,.11),transparent 28%),  
  linear-gradient(145deg,#041525,#09233b 60%,#071a2d);  
 color:var(--text);  
 font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif  
}  
  
body.zoom-small{  
 --scale:.88  
}  
  
body.zoom-large{  
 --scale:1.12  
}  
  
button,  
input,  
textarea,  
select{  
 font:inherit  
}  
  
button{  
 cursor:pointer;  
 -webkit-tap-highlight-color:transparent  
}  
  
input[type=number]{  
 appearance:textfield  
}  
  
input[type=number]::-webkit-outer-spin-button,  
input[type=number]::-webkit-inner-spin-button{  
 appearance:none;  
 margin:0  
}  
  
.hidden{  
 display:none!important  
}  
  
#app{  
 min-height:100vh  
}  
  
.wrap{  
 max-width:1450px;  
 margin:auto;  
 padding:12px 14px 105px  
}  
  
h1,  
h2,  
h3,  
h4{  
 margin:0 0 10px  
}  
  
.card{  
 background:linear-gradient(145deg,rgba(12,42,69,.99),rgba(8,30,50,.99));  
 border:1px solid var(--line);  
 border-radius:var(--radius);  
 padding:15px;  
 margin:10px 0;  
 box-shadow:var(--shadow)  
}  
  
.row{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:10px  
}  
  
.row3{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px  
}  
  
.row4{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:10px  
}  
  
.grid2{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:9px  
}  
  
.grid3{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:9px  
}  
  
.grid4{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:9px  
}  
  
.field{  
 min-width:0  
}  
  
.field label{  
 display:block;  
 font-size:11px;  
 font-weight:750;  
 color:var(--muted);  
 margin-bottom:5px  
}  
  
.field input,  
.field textarea,  
.field select{  
 width:100%;  
 padding:12px;  
 background:#061a2d;  
 color:#fff;  
 border:1px solid var(--line);  
 border-radius:10px;  
 outline:none;  
 min-height:44px  
}  
  
.field textarea{  
 min-height:90px;  
 resize:vertical  
}  
  
.field input[readonly],  
.field textarea[readonly],  
.field select:disabled{
 opacity:.88;
 cursor:default;
}

.hmi-field input[readonly]{
 opacity:.92;
}

.field input:focus,  
.field textarea:focus,  
.field select:focus{  
 border-color:var(--blue);  
 box-shadow:0 0 0 3px rgba(46,172,239,.11)  
}  
  
.btn{  
 min-height:44px;  
 padding:10px 14px;  
 border:1px solid var(--line);  
 border-radius:10px;  
 background:#154664;  
 color:#fff;  
 margin:3px;  
 cursor:pointer;  
 font-weight:800;  
 transition:.16s;  
 touch-action:manipulation  
}  
  
.btn:hover{  
 border-color:var(--blue2);  
 transform:translateY(-1px)  
}  
  
.btn:active{  
 transform:scale(.97)  
}  
  
.btn.primary{  
 background:linear-gradient(145deg,#2eacef,#197fb8);  
 border-color:#4ec1fa  
}  
  
.btn.on{  
 background:var(--blue);  
 border-color:var(--blue)  
}  
  
.btn.ok{  
 background:linear-gradient(145deg,#18bd82,#0e9164);  
 border-color:#2bd59a  
}  
  
.btn.bad{  
 background:linear-gradient(145deg,#df4e5b,#b73d49);  
 border-color:#f06a75  
}  
  
.btn.warn{  
 background:linear-gradient(145deg,#87631f,#695019);  
 border-color:#a8802e  
}  
  
.btn.big{  
 min-height:50px;  
 padding:13px 16px;  
 font-weight:950  
}  
  
.btn:disabled{  
 opacity:.55;  
 cursor:not-allowed  
}  
  
.top{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.top-left{  
 display:flex;  
 align-items:center;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.top-right{  
 display:flex;  
 align-items:center;  
 gap:6px;  
 flex-wrap:wrap;  
 justify-content:flex-end  
}  
  
.logo{  
 width:48px;  
 height:48px;  
 display:grid;  
 place-items:center;  
 border-radius:14px;  
 background:linear-gradient(145deg,#168fe2,#075fae);  
 font-size:24px;  
 font-weight:950;  
 box-shadow:0 8px 22px rgba(15,144,224,.24)  
}  
  
.page-title{  
 font-size:calc(22px * var(--scale));  
 font-weight:950;  
 letter-spacing:.2px  
}  
  
.page-sub{  
 color:var(--muted);  
 font-size:12px;  
 line-height:1.45  
}  
  
.badge{  
 display:inline-block;  
 padding:6px 9px;  
 border-radius:999px;  
 background:#163f59;  
 color:#9edcff;  
 font-size:10px;  
 font-weight:850  
}  
  
.badge.ok{  
 background:#104b39;  
 color:#8bf0bf  
}  
  
.badge.warn{  
 background:#574119;  
 color:#ffd87c  
}  
  
.badge.location{  
 background:#163d54;  
 color:#7fd9ff  
}  
  
.badge.danger{  
 background:#52242b;  
 color:#ff9ea7  
}  
  
.admin-status{  
 display:inline-block;  
 padding:7px 9px;  
 border-radius:999px;  
 background:#104b39;  
 color:#8bf0bf;  
 font-size:10px;  
 font-weight:800  
}  
  
.nav{  
 display:flex;  
 gap:6px;  
 overflow-x:auto;  
 padding:6px 0 10px;  
 position:sticky;  
 top:0;  
 z-index:50;  
 background:rgba(5,20,35,.95);  
 backdrop-filter:blur(12px);  
 scrollbar-width:none  
}  
  
.nav::-webkit-scrollbar{  
 display:none  
}  
  
.nav .btn{  
 white-space:nowrap;  
 flex:0 0 auto;  
 margin:0  
}  
  
.station{  
 background:linear-gradient(145deg,#0b2945,#0a2137);  
 border:1px solid #2a5775;  
 border-radius:15px;  
 padding:15px;  
 margin:9px 0;  
 cursor:pointer;  
 transition:.16s;  
 box-shadow:0 8px 20px rgba(0,0,0,.12)  
}  
  
.station:hover{  
 border-color:var(--blue);  
 transform:translateY(-1px)  
}  
  
.station:active{  
 transform:scale(.995)  
}  
  
.station-title{  
 font-weight:950;  
 font-size:18px  
}  
  
.station-meta{  
 font-size:12px;  
 color:var(--muted);  
 margin-top:4px  
}  
  
.station-badges{  
 display:flex;  
 gap:6px;  
 flex-wrap:wrap;  
 margin-top:9px  
}  
  
.station-actions{  
 display:flex;  
 gap:5px;  
 flex-wrap:wrap;  
 margin-top:10px  
}  
  
.station-actions .btn{  
 margin:0  
}  
  
.summary{  
 display:grid;  
 grid-template-columns:repeat(6,1fr);  
 gap:10px  
}  
  
.stat{  
 border:1px solid var(--line);  
 border-radius:13px;  
 background:#0a2138;  
 padding:14px  
}  
  
.stat-label{  
 font-size:11px;  
 color:var(--muted)  
}  
  
.stat-value{  
 font-size:25px;  
 font-weight:950;  
 margin-top:5px  
}  
  
.stat-unit{  
 font-size:10px;  
 color:#7591a5  
}  
  
.section-title{  
 font-size:17px;  
 font-weight:950;  
 margin-bottom:10px  
}  
  
.section-sub{  
 color:var(--muted);  
 font-size:11px;  
 line-height:1.55  
}  
  
.workbox{  
 background:#081b30;  
 border:1px solid #274c67;  
 border-radius:12px;  
 padding:12px;  
 margin:8px 0  
}  
  
.workbox h4{  
 font-size:12px;  
 color:#b5cad7  
}  
  
.empty{  
 padding:18px;  
 color:var(--muted);  
 border:1px dashed #34536b;  
 border-radius:10px;  
 text-align:center  
}  
  
.motor-card,  
.driver-card,  
.pump-card,  
.fault-card,  
.param-card,  
.history-card{  
 background:#091827;  
 border:1px solid #203b56;  
 border-radius:14px;  
 padding:13px;  
 margin:9px 0  
}  
  
.motor-header,  
.driver-header,  
.pump-header{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap;  
 margin-bottom:10px  
}  
  
.library-grid{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:10px  
}  
  
.library-card{  
 background:#091827;  
 border:1px solid #203b56;  
 border-radius:14px;  
 padding:13px;  
 transition:.15s  
}  
  
.library-card:hover{  
 border-color:var(--blue)  
}  
  
.library-code{  
 font-size:20px;  
 font-weight:950;  
 color:#67c9ff;  
 cursor:pointer  
}  
  
.library-name{  
 font-weight:900;  
 margin-top:3px;  
 cursor:pointer  
}  
  
.library-desc{  
 font-size:12px;  
 color:#a9bbcd;  
 line-height:1.5;  
 margin-top:7px;  
 cursor:pointer  
}  
  
.library-source{  
 font-size:10px;  
 color:#71879b;  
 margin-top:8px;  
 cursor:pointer  
}  
  
.library-driver{  
 display:inline-block;  
 margin-top:8px;  
 padding:6px 8px;  
 border-radius:999px;  
 background:#123b52;  
 border:1px solid #285d78;  
 color:#8fdcff;  
 font-size:10px;  
 font-weight:800  
}  
  
.library-actions{  
 display:flex;  
 gap:5px;  
 flex-wrap:wrap;  
 margin-top:10px  
}  
  
.library-actions .btn{  
 margin:0  
}  
  
.param-row-actions{  
 display:flex;  
 gap:5px;  
 flex-wrap:wrap;  
 margin-top:8px  
}  
  
.param-row-actions .btn{  
 margin:0  
}  
  
.quick-library-title{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.quick-library-card{  
 background:#091827;  
 border:1px solid #203b56;  
 border-radius:14px;  
 padding:13px  
}  
  
.quick-library-card h3{  
 font-size:15px  
}  
  
.quick-library-list{  
 display:grid;  
 gap:8px;  
 margin-top:10px  
}  
  
.quick-library-item{  
 border:1px solid #214159;  
 border-radius:11px;  
 background:#081b30;  
 padding:10px  
}  
  
.quick-library-main{  
 display:flex;  
 align-items:flex-start;  
 justify-content:space-between;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.quick-library-code{  
 color:#67c9ff;  
 font-size:14px;  
 font-weight:950  
}  
  
.quick-library-name{  
 font-size:12px;  
 font-weight:900;  
 margin-top:3px  
}  
  
.quick-library-meta{  
 color:#91adbf;  
 font-size:10px;  
 margin-top:4px;  
 line-height:1.45  
}  
  
.quick-library-driver{  
 color:#8bf0bf;  
 font-size:10px;  
 font-weight:800;  
 margin-top:7px  
}  
  
.quick-library-actions{  
 display:flex;  
 gap:4px;  
 flex-wrap:wrap  
}  
  
.quick-library-actions .btn{  
 margin:0;  
 min-height:38px;  
 padding:7px 9px;  
 font-size:11px  
}  
  
.hmi-shell{  
 border:1px solid #335563;  
 border-radius:14px;  
 background:#102a34;  
 padding:13px  
}  
  
.hmi-tabs{  
 display:flex;  
 gap:6px;  
 overflow-x:auto;  
 padding-bottom:8px;  
 scrollbar-width:none  
}  
  
.hmi-tabs::-webkit-scrollbar{  
 display:none  
}  
  
.hmi-tab{  
 flex:0 0 auto;  
 min-height:44px;  
 padding:10px 14px;  
 border:1px solid #466d7d;  
 border-radius:9px;  
 background:#163745;  
 color:#a9cad9;  
 cursor:pointer;  
 font-weight:800  
}  
  
.hmi-tab.active{  
 background:var(--blue);  
 color:#fff;  
 border-color:var(--blue)  
}  
  
.hmi-fields{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px;  
 align-items:start;  
 margin-top:12px  
}  
  
.hmi-column{  
 min-width:0  
}  
  
.hmi-column-title{  
 color:#8cb9c9;  
 font-size:10px;  
 font-weight:900;  
 margin:0 0 7px 2px;  
 text-transform:uppercase  
}  
  
.hmi-field{  
 background:#0b222c;  
 border:1px solid #264c5a;  
 border-radius:10px;  
 padding:9px;  
 margin-bottom:8px  
}  
  
.hmi-field label{  
 display:block;  
 color:#a6c6d3;  
 font-size:10px;  
 font-weight:800;  
 margin-bottom:5px;  
 line-height:1.35  
}  
  
.hmi-field input{  
 width:100%;  
 min-height:44px;  
 padding:10px;  
 border-radius:8px;  
 border:1px solid #597885;  
 background:#f5f9fb;  
 color:#061828  
}  
  

.hmi-visual{
 width:100%;
 aspect-ratio:16/9;
 border:2px solid #253a45;
 border-radius:8px;
 background:linear-gradient(135deg,#162b35,#07151d);
 overflow:hidden;
 position:relative;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}
.hmi-visual-inner{
 position:absolute;
 inset:4%;
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:2.8%;
}
.hmi-vcol{min-width:0;display:flex;flex-direction:column;justify-content:flex-start}
.hmi-vfield{
 display:grid;
 grid-template-columns:minmax(0,1.45fr) minmax(48px,.75fr);
 gap:4px;
 align-items:center;
 margin-bottom:3.2%;
}
.hmi-vfield label{
 color:#e8eef1;
 font-size:clamp(6px,1.25vw,11px);
 line-height:1.08;
 font-weight:700;
}
.hmi-vfield input{
 width:100%;
 min-width:0;
 height:clamp(18px,3.7vw,35px);
 padding:2px 4px;
 border:1px solid #d9e0e4;
 border-radius:1px;
 background:#f4f7f8;
 color:#6d9ac4;
 font-size:clamp(8px,1.6vw,14px);
 text-align:center;
}
.hmi-screen-title{
 position:absolute;
 left:50%;
 top:2%;
 transform:translateX(-50%);
 color:#f3f7f8;
 font-size:clamp(8px,1.7vw,16px);
 font-weight:800;
 white-space:nowrap;
}
.hmi-screen-footer{
 position:absolute;
 left:4%;
 right:4%;
 bottom:3%;
 display:flex;
 align-items:center;
 justify-content:space-between;
 color:#e8eef1;
 font-size:clamp(6px,1.25vw,11px);
 font-weight:800;
}
.hmi-footer-left,.hmi-footer-right{display:flex;align-items:center;gap:7px}
.hmi-btn{
 min-width:clamp(34px,7vw,66px);
 min-height:clamp(18px,4vw,34px);
 border-radius:50%;
 display:grid;
 place-items:center;
 font-size:clamp(6px,1.2vw,10px);
 color:#07151d;
 font-weight:900;
 background:#34e3d0;
 border:1px solid rgba(255,255,255,.4);
}
.hmi-btn.home{border-radius:3px;background:#68dc48}
.hmi-btn.save{background:#8cbbe0}
.hmi-arrows{display:flex;gap:8px;color:#ff5b4d;font-size:clamp(13px,3vw,25px);font-weight:900}
.hmi-pressure-visual{
 position:absolute;
 left:42%;
 top:42%;
 width:16%;
 height:22%;
 border-left:3px solid #b7c4ca;
 border-right:3px solid #b7c4ca;
 background:linear-gradient(to bottom,#eef3f4 0 35%,#2586e9 35% 100%);
 opacity:.9;
}
.hmi-pressure-pump{
 position:absolute;
 left:45%;
 top:50%;
 width:10%;
 height:8%;
 border-radius:50%;
 background:#123d68;
 border:2px solid #dfe8ed;
}
.hmi-status-dot{
 display:inline-block;
 width:clamp(8px,1.7vw,15px);
 height:clamp(8px,1.7vw,15px);
 border-radius:50%;
 border:2px solid #dce7eb;
 box-shadow:0 0 0 1px rgba(0,0,0,.35);
}
.hmi-status-dot.red{background:#ff4a3d}
.hmi-status-dot.green{background:#21c765}
.hmi-legend{
 position:absolute;
 left:39%;
 top:69%;
 transform:translateX(-50%);
 color:#e9f1f3;
 font-size:clamp(6px,1.1vw,10px);
 font-weight:800;
}
.hmi-ribbon{
 position:absolute;
 top:3%;
 right:4%;
 color:#9db4bf;
 font-size:clamp(5px,1vw,9px);
}

.hmi-layout-note{  
 margin-top:10px;  
 padding:9px;  
 border:1px dashed #396273;  
 border-radius:9px;  
 color:#86abba;  
 font-size:10px;  
 line-height:1.5  
}  
  
.box-grid{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px  
}  
  
.box-node{  
 background:#071827;  
 border:1px solid #2c536b;  
 border-radius:12px;  
 padding:11px  
}  
  
.box-node h4{  
 color:#a9cad9;  
 margin-bottom:8px  
}  
  
.box-table{  
 width:100%;  
 border-collapse:collapse;  
 overflow:hidden;  
 border-radius:10px  
}  
  
.box-table th,  
.box-table td{  
 border:1px solid #294d64;  
 padding:8px;  
 font-size:11px;  
 vertical-align:top  
}  
  
.box-table th{  
 background:#123550;  
 color:#9fd7ef;  
 text-align:left  
}  
  
.box-table input{  
 width:100%;  
 min-height:40px;  
 background:#071a2f;  
 color:#fff;  
 border:1px solid #315670;  
 border-radius:7px;  
 padding:8px  
}  
  
.photo-grid{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:9px  
}  
  
.photo-item{  
 border:1px solid #284c63;  
 border-radius:10px;  
 overflow:hidden;  
 background:#081726  
}  
  
.photo-item img{  
 width:100%;  
 height:160px;  
 object-fit:cover;  
 display:block  
}  
  
.photo-caption{  
 padding:8px;  
 font-size:10px;  
 color:var(--muted);  
 line-height:1.45  
}  
  
.location-card{  
 border:1px solid #23536b;  
 border-radius:14px;  
 background:  
  radial-gradient(circle at top right,rgba(46,172,239,.09),transparent 40%),  
  #081d30;  
 padding:13px  
}  
  
.location-main{  
 display:flex;  
 align-items:flex-start;  
 justify-content:space-between;  
 gap:12px;  
 flex-wrap:wrap  
}  
  
.location-coords{  
 font-size:13px;  
 font-weight:900;  
 color:#77d4ff;  
 line-height:1.55  
}  
  
.location-meta{  
 color:var(--muted);  
 font-size:10px;  
 margin-top:4px  
}  
  
.location-actions{  
 display:flex;  
 flex-wrap:wrap;  
 gap:5px  
}  
  
.location-actions .btn{  
 margin:0  
}  
  
.tag-grid{  
 display:flex;  
 gap:7px;  
 flex-wrap:wrap;  
 margin-top:8px  
}  
  
.tag{  
 border:1px solid #34566c;  
 background:#102b40;  
 color:#a9c9d8;  
 padding:7px 9px;  
 border-radius:999px;  
 font-size:10px;  
 font-weight:800  
}  
  
.tag.active{  
 border-color:#2bbf91;  
 color:#8bf0bf;  
 background:#104b39  
}

========================================================= */  
  
function esc(v){  
  
 return String(v??'')  
  .replaceAll('&','&amp;')  
  .replaceAll('<','&lt;')  
  .replaceAll('>','&gt;')  
  .replaceAll('"','&quot;')  
  .replaceAll("'","&#39;");  
  
}  
  
function val(id){  
  
 const e=  
  document.getElementById(id);  
  
 return e?e.value:'';  
  
}  
  
function num(v){  
  
 if(  
  v===null||  
  v===undefined||  
  v===''  
 )  
  return null;  
  
 const n=  
  Number(  
   String(v).replace(',','.')  
  );  
  
 return Number.isFinite(n)  
  ?n  
  :null;  
  
}  
  
function now(){  
  
 return new Date()  
  .toLocaleString(  
   'tr-TR'  
  );  
  
}

========================================================= */  
  
function toast(message){  
  
 const t=  
  document.getElementById(  
   'toast'  
  );  
  
 if(!t)  
  return;  
  
 t.textContent=  
  message;  
  
 t.classList.add(  
  'show'  
 );  
  
 clearTimeout(  
  window.__toast  
 );  
  
 window.__toast=  
  setTimeout(  
   ()=>{  
    t.classList.remove(  
     'show'  
    );  
   },  
   2300  
  );  
  
}

   Date.now()+

 });

  );  
  
 saveLocal(

  changeHistory  
 );

function getSession(){  
  
 try{  
  
  return JSON.parse(  
   sessionStorage.getItem(  
    ADMIN_SESSION_KEY  
   )||'null'  
  );  
  
 }catch(e){  
  
  return null;  
  
 }  
}  
  
function setSession(){  
  
 const s={  
  active:true,  
  lastActivity:Date.now()  
 };  
  
 sessionStorage.setItem(  
  ADMIN_SESSION_KEY,  
  JSON.stringify(s)  
 );  
  
 armAdminTimeout();  
  
}  
  
function touchAdminSession(){  
  
 if(!edit)  
  return;  
  
 const s=  
  getSession();  
  
 if(!s?.active){  
  
  edit=false;  
  
  return;  
  
 }  
  
 s.lastActivity=  
  Date.now();  
  
 sessionStorage.setItem(  
  ADMIN_SESSION_KEY,  
  JSON.stringify(s)  
 );  
  
 armAdminTimeout();  
  
}  
  
function clearAdminSession(){  
  
 edit=false;  
  
 clearTimeout(  
  adminTimer  
 );  
  
 adminTimer=null;  
  
 try{  
  
  sessionStorage.removeItem(  
   ADMIN_SESSION_KEY  
  );  
  
 }catch(e){}  
  
}  
  
function restoreAdminSession(){  
  
 const s=  
  getSession();  
  
 if(!s?.active){  
  
  edit=false;  
  
  return false;  
  
 }  
  
 const age=  
  Date.now()-  
  Number(  
   s.lastActivity||0  
  );  
  
 if(  
  age>=ADMIN_IDLE_MS  
 ){  
  
  clearAdminSession();  
  
  return false;  
  
 }  
  
 edit=true;  
  
 armAdminTimeout();  
  
 return true;  
  
}  
  
function armAdminTimeout(){  
  
 clearTimeout(  
  adminTimer  
 );  
  
 if(!edit)  
  return;  
  
 const s=  
  getSession();  
  
 if(!s){  
  
  edit=false;  
  
  return;  
  
 }  
  
 const remaining=  
  ADMIN_IDLE_MS-  
  (  
   Date.now()-  
   Number(  
    s.lastActivity||0  
   )  
  );  
  
 if(remaining<=0){  
  
  lockAdminForTimeout();  
  
  return;  
  
 }  
  
 adminTimer=  
  setTimeout(  
   checkAdminTimeout,  
   Math.min(  
    remaining,  
    15000  
   )  
  );  
  
}  
  
function checkAdminTimeout(){  
  
 if(!edit)  
  return;  
  
 const s=  
  getSession();  
  
 if(!s){  
  
  lockAdminForTimeout();  
  
  return;  
  
 }  
  
 const age=  
  Date.now()-  
  Number(  
   s.lastActivity||0  
  );  
  
 if(age>=ADMIN_IDLE_MS){  
  
  lockAdminForTimeout();  
  
 }else{  
  
  armAdminTimeout();  
  
 }  
  
}  
  
function lockAdminForTimeout(){  
  
 clearAdminSession();  
  
 toast(  
  'Yönetici oturumu zaman aşımı nedeniyle kilitlendi.'  
 );  
  
 if(current){  
  
  render();  
  
 }else{  
  
  home();  
  
 }  
  
}

async function countTable(  
 table,  
 ids  
){  
  
 if(!ids.length)  
  return 0;  
  
 const r=  
  await db  
   .from(table)  
   .select('id,terfi_id')  
   .in(

 ).length;

function loadViewState(){
 try{
  return JSON.parse(sessionStorage.getItem(VIEW_STATE_KEY)||'{}');
 }catch(e){ return {}; }
}

function saveViewState(state){
 try{ sessionStorage.setItem(VIEW_STATE_KEY,JSON.stringify(state)); }catch(e){}
}

function viewKey(id,section=tab,page=hmiPage){
 return `${id||'home'}::${section}::${page||1}`;
}

function captureScrollPosition(){
 if(!current?.s?.id) return;
 const state=loadViewState();
 state[viewKey(current.s.id,tab,hmiPage)]={y:window.scrollY||window.pageYOffset||0,at:Date.now()};
 saveViewState(state);
}

function restoreScrollPosition(){
 if(!current?.s?.id) return;
 const state=loadViewState();
 const saved=state[viewKey(current.s.id,tab,hmiPage)];
 const y=Number(saved?.y||0);
 requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:'auto'})));
}

function setHmiPage(page){
 if(edit) touchAdminSession();
 captureScrollPosition();
 hmiPage=Number(page)||1;
 render();
}

async function openStation(id){
 const sameStation=!!(current?.s?.id&&current.s.id===id);
 const wantedTab=sameStation?tab:'terfi';
 const wantedHmiPage=sameStation?hmiPage:1;
 const wantedPumpId=sameStation?selectedPumpId:null;
 const [s,m,p,d]=await Promise.all([
  db.from('terfiler').select('*').eq('id',id).single(),
  db.from('motorlar').select('*').eq('terfi_id',id).order('created_at',{ascending:true}),
  db.from('pompalar').select('*').eq('terfi_id',id).order('pompa_no',{ascending:true}),
  db.from('suruculer').select('*').eq('terfi_id',id).order('created_at',{ascending:true})
 ]);
 if(s.error){alert('Terfi açılamadı: '+s.error.message);return;}
 const errs=[m.error,p.error,d.error].filter(Boolean);
 if(errs.length){alert('Terfi verileri okunamadı:\n\n'+errs.map(e=>e.message).join('\n'));return;}
 current={s:s.data,m:m.data||[],p:p.data||[],d:d.data||[],h:[],w:[],tp:[],detail:getTerfiDetail(id),location:getLocation(id),ssr:{level:'',low:'',high:'',note:''}};
 const ssrMap=localJSON(LOCAL_SSR_KEY,{});current.ssr=ssrMap[id]||current.ssr;
 tab=wantedTab;hmiPage=wantedHmiPage;
 const pumps=[...current.p].sort((a,b)=>(Number(a.pompa_no)||999)-(Number(b.pompa_no)||999));
 selectedPumpId=pumps.find(x=>x.id===wantedPumpId)?.id||pumps[0]?.id||null;
 const sp=pumps.find(x=>x.id===selectedPumpId);
 selectedMotorId=sp?.motor_id||current.m[0]?.id||null;
 workMotor=sp?.motor_id||current.m[0]?.id||null;
 if(edit)touchAdminSession();
 render();restoreScrollPosition();
 recordHistory('TERFİ AÇILDI',`${current.s.ad||''} (${current.s.kod||current.s.terfi_no||''})`);
 const extras=await Promise.all([
  db.from('hmi_kayitlari').select('*').eq('terfi_id',id).order('ekran_no',{ascending:true}),
  db.from('motor_calisma_kayitlari').select('*').eq('terfi_id',id).order('captured_at',{ascending:false}),

 ]);
 if(current?.s?.id!==id)return;
 current.h=extras[0].data||[];current.w=extras[1].data||[];current.tp=extras[2].data||[];
 if(tab==='hmi'||tab==='calisma'||tab==='parametre')render();
}

function requestLocation(){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 if(!navigator.geolocation){  
  
  toast(  
   'Bu cihazda GPS konumu desteklenmiyor.'  
  );  
  
  return;  
  
 }  
  
 toast(  
  'Konum alınıyor...'  
 );  
  
 navigator.geolocation.getCurrentPosition(  
  
  position=>{  
  
   const lat=  
    Number(  
     position.coords.latitude  
    );  
  
   const lng=  
    Number(  
     position.coords.longitude  
    );  
  
   const accuracy=  
    Number(  
     position.coords.accuracy||0  
    );  
  
   const loc={  
  
    lat,  
    lng,  
    accuracy,  
  
    date:  
     now(),  
  
    iso:  
     new Date().toISOString()  
  
   };  
  
   terfiLocations[  
    current.s.id  
   ]=  
    loc;  
  
   saveLocal(  
    LOCAL_LOCATION_KEY,  
    terfiLocations  
   );  
  
   current.location=  
    loc;  
  
   recordHistory(  
    'KONUM KAYDEDİLDİ',  
    `${lat.toFixed(6)}, ${lng.toFixed(6)} · ±${Math.round(accuracy)} m`  
   );  
  
   render();  
  
   toast(  
    'Terfi konumu kaydedildi.'  
   );  
  
  },  
  
  error=>{  
  
   let message=  
    'Konum alınamadı.';  
  
   if(error?.code===1){  
  
    message=  
     'Konum izni verilmedi. Tarayıcı ayarlarından konum iznini aç.';  
  
   }  
  
   if(error?.code===2){  
  
    message=  
     'Konum bilgisi alınamadı. GPS/Wi-Fi konumunu kontrol et.';  
  
   }  
  
   if(error?.code===3){  
  
    message=  
     'Konum alma zaman aşımına uğradı. Tekrar dene.';  
  
   }  
  
   toast(  
    message  
   );  
  
  },  
  
  {  
   enableHighAccuracy:true,  
   timeout:15000,  
   maximumAge:0  
  }  
  
 );  
  
}

async function addMotor(){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 const r=  
  await db  
   .from('motorlar')  
   .insert({  
  
    terfi_id:  
     current.s.id,  
  
    ad:  
     `${current.m.length+1}. Motor`  
  
   })  
   .select()  
   .single();  
  
 if(r.error){  
  
  alert(  
   r.error.message  
  );  
  
  return;  
  
 }  
  
 recordHistory(  
  'MOTOR EKLENDİ',  
  r.data?.ad||''  
 );  
  
 await openStation(  
  current.s.id  
 );  
  
}  
  
async function deleteMotor(  
 id  
){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 if(!confirm(  
  'Bu motor ve bağlı sürücü ilişkisi silinsin mi?'  
 ))  
  return;  
  
 const d=  
  current.d.find(  
   x=>x.motor_id===id  
  );  
  
 if(d){  
  
  const ur=  
   await db  
    .from('suruculer')  
    .update({  
     motor_id:null  
    })  
    .eq(  
     'id',  
     d.id  
    );  
  
  if(ur.error){  
  
   alert(  
    ur.error.message  
   );  
  
   return;  
  
  }  
  
 }  
  
 const r=  
  await db  
   .from('motorlar')  
   .delete()  
   .eq(  
    'id',  
    id  
   );  
  
 if(r.error){  
  
  alert(  
   r.error.message  
  );  
  
  return;  
  
 }  
  
 delete localBoxes[id];  
  
 saveLocal(  
  LOCAL_BOX_KEY,  
  localBoxes  
 );  
  
 recordHistory(  
  'MOTOR SİLİNDİ',  
  id  
 );  
  
 await openStation(  
  current.s.id  
 );  
  
}

function blankTerm(){  
  
 return {  
  renk:'',  
  detay:'',  
  etiket:''  
 };  
  
}  
  
function defaultBox(){  
  
 return {  
  
  motor:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  },  
  
  box_motor:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  },  
  
  box_surucu:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  },  
  
  surucu:{  
   u:blankTerm(),  
   v:blankTerm(),  
   w:blankTerm()  
  }  
  
 };  
  
}  
  
function normalizeBox(  
 b  
){  
  
 const d=  
  defaultBox();  
  
 return {  
  
  motor:{  
   u:{...d.motor.u,...(b?.motor?.u||{})},  
   v:{...d.motor.v,...(b?.motor?.v||{})},  
   w:{...d.motor.w,...(b?.motor?.w||{})}  
  },  
  
  box_motor:{  
   u:{...d.box_motor.u,...(b?.box_motor?.u||{})},  
   v:{...d.box_motor.v,...(b?.box_motor?.v||{})},  
   w:{...d.box_motor.w,...(b?.box_motor?.w||{})}  
  },  
  
  box_surucu:{  
   u:{...d.box_surucu.u,...(b?.box_surucu?.u||{})},  
   v:{...d.box_surucu.v,...(b?.box_surucu?.v||{})},  
   w:{...d.box_surucu.w,...(b?.box_surucu?.w||{})}  
  },  
  
  surucu:{  
   u:{...d.surucu.u,...(b?.surucu?.u||{})},  
   v:{...d.surucu.v,...(b?.surucu?.v||{})},  
   w:{...d.surucu.w,...(b?.surucu?.w||{})}  
  }  
  
 };  
  
}  
  
function getBox(  
 id  
){  
  
 localBoxes[id]=  
  normalizeBox(  
   localBoxes[id]  
  );  
  
 return localBoxes[id];  
  
}

function saveParamEditor(  
 isEdit  
){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 const original=  
  isEdit  
  ?  
  val(  
   'param_original_code'  
  )  
  :  
  '';  
  
 const code=  
  val(  
   'param_edit_code'  
  ).trim();  
  
 const name=  
  val(  
   'param_edit_name'  
  ).trim();  
  
 const unit=  
  val(  
   'param_edit_unit'  
  ).trim();  
  
 const desc=  
  val(  
   'param_edit_desc'  
  ).trim();  
  
 const source=  
  val(  
   'param_edit_source'  
  ).trim();  
  
 const driver=  
  val(  
   'param_edit_driver'  
  ).trim();  
  
 if(!code){  
  
  toast(  
   'Parametre kodu boş bırakılamaz.'  
  );  
  
  return;  
  
 }  
  
 if(!name){  
  
  toast(  
   'Parametre adı boş bırakılamaz.'  
  );  
  
  return;  
  
 }  
  
 if(isEdit){  
  
  const duplicate=  
   params().some(  
    x=>  
     x.code===code &&  
     x.code!==original  
   );  
  
  if(duplicate){  
  
   toast(  
    'Bu parametre kodu zaten mevcut.'  
   );  
  
   return;  
  
  }  
  
  if(  
   original &&  
   original!==code  
  ){  
  
   delete paramEdits[  
    original  
   ];  
  
  }  
  
  paramDeleted=  
   paramDeleted.filter(  
    x=>x!==code  
   );  
  
  paramEdits[code]={  
  
   code,  
   name,  
   unit,  
   desc,  
   source,  
   driver  
  
  };  
  
  const customIndex=  
   customParams.findIndex(  
    x=>x.code===original  
   );  
  
  if(customIndex>=0){  
  
   customParams[  
    customIndex  
   ]={  
  
    code,  
    name,  
    unit,  
    desc,  
    source,  
    driver  
  
   };  
  
   saveLocal(  
    LOCAL_PARAM_KEY,  
    customParams  
   );  
  
  }  
  
  saveLocal(  
   LOCAL_PARAM_EDIT_KEY,  
   paramEdits  
  );  
  
  saveLocal(  
   LOCAL_PARAM_DELETE_KEY,  
   paramDeleted  
  );  
  
  recordHistory(  
   'PARAMETRE KÜTÜPHANESİ DÜZENLENDİ',  
   `${code} · ${name} · ${driver||'Sürücü belirtilmedi'}`  
  );  
  
  closeModal();  
  
  render();  
  
  toast(  
   'Parametre güncellendi.'  
  );  
  
  return;  
  
 }  
  
 const exists=  
  [  
   ...DEFAULT_PARAMS,  
   ...customParams  
  ].some(  
   x=>x.code===code  
  );  
  
 if(exists){  
  
  toast(  
   'Bu parametre kodu zaten mevcut.'  
  );  
  
  return;  
  
 }  
  
 customParams.push({  
  
  code,  
  name,  
  unit,  
  desc,  
  source,  
  driver  
  
 });  
  
 saveLocal(  
  LOCAL_PARAM_KEY,  
  customParams  
 );  
  
 paramDeleted=  
  paramDeleted.filter(  
   x=>x!==code  
  );  
  
 saveLocal(  
  LOCAL_PARAM_DELETE_KEY,  
  paramDeleted  
 );  
  
 recordHistory(  
  'PARAMETRE KÜTÜPHANESİNE EKLENDİ',  
  `${code} · ${name} · ${driver||'Sürücü belirtilmedi'}`  
 );  
  
 closeModal();  
  
 render();  
  
 toast(  
  'Yeni parametre eklendi.'  
 );  
  
}  
  
function deleteParam(  
 code  
){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 const p=  
  params().find(  
   x=>x.code===code  
  );  
  
 if(!p)  
  return;  
  
 if(!confirm(  
  `${code} · ${p.name}\n\nBu parametre silinsin mi?`  
 ))  
  return;  
  
 if(  
  DEFAULT_PARAMS.some(  
   x=>x.code===code  
  )  
 ){  
  
  if(  
   !paramDeleted.includes(  
    code  
   )  
  )  
   paramDeleted.push(  
    code  
   );  
  
  delete paramEdits[code];  
  
  saveLocal(

function saveFaultEditor(  
 isEdit  
){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 const original=  
  isEdit  
  ?  
  val(  
   'fault_original_code'  
  )  
  :  
  '';  
  
 const code=  
  val(  
   'fault_edit_code'  
  ).trim();  
  
 const name=  
  val(  
   'fault_edit_name'  
  ).trim();  
  
 const cause=  
  val(  
   'fault_edit_cause'  
  ).trim();  
  
 const solution=  
  val(  
   'fault_edit_solution'  
  ).trim();  
  
 const source=  
  val(  
   'fault_edit_source'  
  ).trim();  
  
 const driver=  
  val(  
   'fault_edit_driver'  
  ).trim();  
  
 if(!code){  
  
  toast(  
   'Hata kodu boş bırakılamaz.'  
  );  
  
  return;  
  
 }  
  
 if(!name){  
  
  toast(  
   'Başlık boş bırakılamaz.'  
  );  
  
  return;  
  
 }  
  
 if(isEdit){  
  
  const duplicate=  
   faults().some(  
    x=>  
     x.code===code &&  
     x.code!==original  
   );  
  
  if(duplicate){  
  
   toast(  
    'Bu hata kodu zaten mevcut.'  
   );  
  
   return;  
  
  }  
  
  if(  
   original &&  
   original!==code  
  ){  
  
   delete faultEdits[  
    original  
   ];  
  
  }  
  
  faultDeleted=  
   faultDeleted.filter(  
    x=>x!==code  
   );  
  
  faultEdits[code]={  
  
   code,  
   name,  
   cause,  
   solution,  
   source,  
   driver  
  
  };  
  
  const customIndex=  
   customFaults.findIndex(  
    x=>x.code===original  
   );  
  
  if(customIndex>=0){  
  
   customFaults[  
    customIndex  
   ]={  
  
    code,  
    name,  
    cause,  
    solution,  
    source,  
    driver  
  
   };  
  
   saveLocal(  
    LOCAL_FAULT_KEY,  
    customFaults  
   );  
  
  }  
  
  saveLocal(  
   LOCAL_FAULT_EDIT_KEY,  
   faultEdits  
  );  
  
  saveLocal(  
   LOCAL_FAULT_DELETE_KEY,  
   faultDeleted  
  );  
  
  recordHistory(  
   'ARIZA KÜTÜPHANESİ DÜZENLENDİ',  
   `${code} · ${name} · ${driver||'Sürücü belirtilmedi'}`  
  );  
  
  closeModal();  
  
  if(current)  
   render();  
  else  
   home();  
  
  toast(  
   'Arıza kaydı güncellendi.'  
  );  
  
  return;  
  
 }  
  
 const exists=  
  [  
   ...DEFAULT_FAULTS,  
   ...customFaults  
  ].some(  
   x=>x.code===code  
  );  
  
 if(exists){  
  
  toast(  
   'Bu hata kodu zaten mevcut.'  
  );  
  
  return;  
  
 }  
  
 customFaults.push({  
  
  code,  
  name,  
  cause,  
  solution,  
  source,  
  driver  
  
 });  
  
 saveLocal(  
  LOCAL_FAULT_KEY,  
  customFaults  
 );  
  
 faultDeleted=  
  faultDeleted.filter(  
   x=>x!==code  
  );  
  
 saveLocal(  
  LOCAL_FAULT_DELETE_KEY,  
  faultDeleted  
 );  
  
 recordHistory(  
  'ARIZA KÜTÜPHANESİNE EKLENDİ',  
  `${code} · ${name} · ${driver||'Sürücü belirtilmedi'}`  
 );  
  
 closeModal();  
  
 if(current)  
  render();  
 else  
  home();  
  
 toast(  
  'Yeni arıza kodu eklendi.'  
 );  
  
}  
  
function deleteFault(  
 code

 if(!edit){

 touchAdminSession();

  faults().find(

   LOCAL_FAULT_KEY,

function addPhotos(  
 event  
){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 const files=[  
  ...(event.target.files||[])  
 ];  
  
 if(!files.length)  
  return;  
  
 let pending=  
  files.length;  
  
 files.forEach(  
  file=>{  
  
   const reader=  
    new FileReader();  
  
   reader.onload=  
    ()=>{  
  
     localPhotos[  
      current.s.id  
     ] ||=  
      [];  
  
     localPhotos[  
      current.s.id  
     ].push({  
  
      name:file.name,  
      type:file.type,  
      data:reader.result,  
      date:now()  
  
     });  
  
     pending--;  
  
     if(pending===0){  
  
      saveLocal(  
       LOCAL_PHOTO_KEY,  
       localPhotos  
      );  
  
      recordHistory(  
       'FOTOĞRAF EKLENDİ',  
       `${files.length} fotoğraf`  
      );  
  
      render();  
  
     }  
  
    };  
  
   reader.readAsDataURL(  
    file  
   );  
  
  }  
 );  
  
}  
  
function deletePhoto(  
 index  
){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 if(!confirm(  
  'Fotoğraf silinsin mi?'  
 ))  
  return;  
  
 localPhotos[  
  current.s.id  
 ].splice(  
  index,  
  1  
 );  
  
 saveLocal(  
  LOCAL_PHOTO_KEY,  
  localPhotos  
 );  
  
 recordHistory(  
  'FOTOĞRAF SİLİNDİ',  
  ''  
 );  
  
 render();  
  
}

function openModal(  
 html  
){  
  
 closeModal();  
  
 const wrap=  
  document.createElement(  
   'div'  
  );  
  
 wrap.className=  
  'modal-backdrop';  
  
 wrap.id=  
  'modalRoot';  
  
 wrap.innerHTML=`  
  
  <div  
   class="modal"  
   onclick="event.stopPropagation()">  
  
   <div class="modal-head">  
  
    <h2>  
     ${getModalTitle(html)}  
    </h2>  
  
    <button  
     class="modal-close"  
     type="button"  
     aria-label="Kapat"  
     onclick="closeModal()">  
  
     ✕  
  
    </button>  
  
   </div>  
  
   <div id="modalContent">  
  
    ${removeFirstH2(html)}  
  
   </div>  
  
  </div>  
  
 `;  
  
 document.body.appendChild(  
  wrap  
 );  
  
 wrap.addEventListener(  
  'click',  
  function(e){  
  
   if(e.target===wrap){  
  
    closeModal();  
  
   }  
  
  }  
 );  
  
}  
  
function getModalTitle(  
 html  
){  
  
 try{  
  
  const holder=  
   document.createElement(  
    'div'  
   );  
  
  holder.innerHTML=  
   html;  
  
  const h2=  
   holder.querySelector(  
    'h2'  
   );  
  
  return h2  
   ?  
   h2.textContent.trim()  
   :  
   '';  
  
 }catch(e){  
  
  return '';  
  
 }  
  
}  
  
function removeFirstH2(  
 html  
){  
  
 try{  
  
  const holder=  
   document.createElement(  
    'div'  
   );  
  
  holder.innerHTML=  
   html;  
  
  const h2=  
   holder.querySelector(  
    'h2'  
   );  
  
  if(h2)  
   h2.remove();  
  
  return holder.innerHTML;  
  
 }catch(e){  
  
  return html;  
  
 }  
  
}  
  
function closeModal(){  
  
 document  
  .getElementById(  
   'modalRoot'  
  )  
  ?.remove();  
  
}

        ),  
  
       h_max_m:  
        num(  
         val(  
          `p_${p.id}_hmax`  
         )  
        ),  
  
       etiket_notu:  
        val(  
         `p_${p.id}_not`  
        )  
  
      })  
      .eq(  
       'id',  
       p.id  
      );  
  
    if(r.error)  
     throw r.error;  
  
   }  
  
  }  
  
  
  if(tab==='surucu'){  
  
   for(  
    const d of current.d  
   ){  
  
    const r=  
     await db  
      .from('suruculer')  
      .update({  
  
       ad:  
        val(  
         `d_${d.id}_ad`  
        ),  
  
       marka:  
        val(  
         `d_${d.id}_marka`  
        ),  
  
       model:  
        val(  
         `d_${d.id}_model`  
        ),  
  
       seri_no:  
        val(  
         `d_${d.id}_seri`  
        ),  
  
       guc_kw:  
        num(  
         val(  
          `d_${d.id}_kw`  
        )  
        ),  
  
       besleme_v:  
        num(  
         val(  
          `d_${d.id}_v`  
         )  
        ),  
  
       motor_id:  
        val(  
         `d_${d.id}_motor`  
        )||  
        null,  
  
       notlar:  
        val(  
         `d_${d.id}_not`  
        )  
  
      })  
      .eq(  
       'id',  
       d.id  
      );  
  
    if(r.error)  
     throw r.error;  
  
   }  
  
  }  
  
  
  if(tab==='hmi'){  
  
   for(  
    let pageNo=1;  
    pageNo<=HMI.length;  
    pageNo++  
   ){  
  
    const page=  
     HMI[  
      pageNo-1  
     ];  
  
    const old=current.h.find(x=>x.pompa_id===selectedPumpId && x.ekran_no===pageNo) || current.h.find(x=>!x.pompa_id && x.ekran_no===pageNo);  
  
    if(  
     pageNo===hmiPage||  
     !old  
    ){  
  
     const values=  
      old?.degerler||  
      {};  
  
     if(pageNo===hmiPage){  
  
      page.labels.forEach(  
       (_,i)=>{  
  
        values[i]=  
         val(  
          `hmi_${pageNo}_${i}`  
         );  
  
       }  
      );  
  
     }  
  
     if(old){  
  
      const r=  
       await db  
        .from(  
         'hmi_kayitlari'  
        )  
        .update({degerler:values,pompa_id:selectedPumpId})  
        .eq(  
         'id',  
         old.id  
        );  
  
      if(r.error)  
       throw r.error;  
  
     }else{  
  
      const r=  
       await db  
        .from(  
         'hmi_kayitlari'  
        )  
        .insert({terfi_id:current.s.id,ekran_no:pageNo,degerler:values,pompa_id:selectedPumpId});  
  
      if(r.error)  
       throw r.error;  
  
     }  
  
    }  
  
   }  
  
  }  
  
  
  if(tab==='calisma'){  
  
   if(!workMotor){  
  
    throw new Error(  
     'Motor seçilmedi.'  
    );  
  
   }  
  
   const patch={  
  
    terfi_id:  
     current.s.id,  
  
    motor_id:  
     workMotor,  
  
    captured_at:  
     new Date().toISOString(),  
  
    frekans_hz:  
     num(  
      val(  
       'w_frekans_hz'  
      )  
     ),  
  
    akim_a:  
     num(  
      val(  
       'w_akim_a'  
      )  
     ),  
  
    devir_rpm:  
     num(  
      val(  
       'w_devir_rpm'  
      )  
     ),  
  
    guc_kw:  
     num(  
      val(  
       'w_guc_kw'  
      )  
     ),  
  
    gerilim_v:  
     num(  
      val(  
       'w_gerilim_v'  
      )  
     ),  
  
    surucu_sicaklik_c:  
     num(  
      val(  
       'w_surucu_sicaklik_c'  
      )  
     ),  
  
    set_basinci_bar:  
     num(  
      val(  
       'w_set_basinci_bar'  
      )  
     ),  
  
    calisma_basinci_bar:  
     num(  
      val(  
       'w_calisma_basinci_bar'  
      )  
     ),  
  
    tasarruf_kwh:  
     num(  
      val(  
       'w_tasarruf_kwh'  
      )  
     ),  
  
    durum:  
     val(  
      'w_durum'  
     )||  
     null,  
  
    notlar:  
     val(  
      'w_notlar'  
     )||  
     null  
  
   };  
  
   const r=  
    await db  
     .from(  
      'motor_calisma_kayitlari'  
     )  
     .insert(  
      patch  
     );  
  
   if(r.error)  
    throw r.error;  
  
  }  
  
  
  recordHistory(  
   'KAYIT KAYDEDİLDİ',  
   `Sekme: ${tab}`  
  );  
  
  toast(  
   'Değişiklikler başarıyla kaydedildi.'  
  );  
  
  await openStation(  
   current.s.id  
  );  
  
 }catch(e){  
  
  console.error(e);  
  
  alert(  
   'Kayıt sırasında hata oluştu.\n\n'+  
   (  
    e.message||  
    'Bilinmeyen hata'  
   )  
  );  
  
 }  
  
}

async function newStation(){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  

  const pumpCountInput=prompt(
   'Bu terfide kaç pompa olacak? (0-50)',
   '2'
  );
  const pumpCount=Math.max(
   0,
   Math.min(
    50,
    Number.parseInt(
     pumpCountInput||'0',
     10
    )||0
   )
  );

 const kod=  
  'T'+  
  String(  
   Date.now()  
  ).slice(-6);  
  
 const r=  
  await db  
   .from('terfiler')  
   .insert({  
  
    ad:  
     'Yeni Terfi',  
  
    kod,  
  
    terfi_no:  
     kod,  
  
    aciklama:  
     ''  
  
   })  
   .select()  
   .single();  
  
 if(r.error){  
  
  alert(  
   r.error.message  
  );  
  
  return;  
  
 }  
  
 saveTerfiDetail(  
  r.data.id,  
  stationDetailDefaults()  
 );  
  
 current={  
  
  s:r.data,  
  m:[],  
  p:[],  
  d:[],  
  h:[],  
  w:[],  
  tp:[],  
  
  detail:  
   stationDetailDefaults(),  
  
  location:  
   null,  
  
  ssr:{  
   level:'',  
   low:'',  
   high:'',  
   note:''  
  }  
  
 };  
  

 if(pumpCount>0){
  const pumpRows=Array.from(
   {length:pumpCount},
   (_,i)=>({
    terfi_id:r.data.id,
    ad:`P${i+1}`
   })
  );
  const pr=await db
   .from('pompalar')
   .insert(pumpRows);

  if(pr.error){
   alert(
    'Terfi oluşturuldu fakat pompa kayıtları eklenemedi.\n\n'+
    pr.error.message
   );
  }
 }

 tab='terfi';  
  
 recordHistory(  
  'YENİ TERFİ OLUŞTURULDU',  
  `${kod} · Yeni Terfi`  
 );  
  
 render();  
  
 toast(  
  'Yeni terfi oluşturuldu.'  
 );  
  
}

async function deleteTerfi(){  
  
 if(!edit){  
  
  requestAdmin();  
  
  return;  
  
 }  
  
 touchAdminSession();  
  
 if(!current?.s?.id)  
  return;  
  
 const s=  
  current.s;  
  
 if(!confirm(  
  `"${s.ad||'Bu terfi'}" tamamen silinsin mi?\n\n`+  
  `Bağlı motor, pompa, sürücü, HMI, çalışma `+  
  `ve terfi parametre kayıtları da silinebilir.\n\n`+  
  `GERİ ALINAMAZ.`  
 ))  
  return;  
  
 const id=  
  s.id;  
  
 try{  
  
  const mr=  
   await db  
    .from('motorlar')  
    .select('id')  
    .eq(  
     'terfi_id',  
     id  
    );  
  
  if(mr.error)  
   throw mr.error;  
  
  const motorIds=  
   (mr.data||[])  
    .map(  
     x=>x.id  
    );  
  
  for(  
   const mid of motorIds  
  ){  
  
   delete localBoxes[mid];  
  
  }  
  
  saveLocal(  
   LOCAL_BOX_KEY,  
   localBoxes  
  );  
  
  
  const terfiTables=[  
  
   'motor_calisma_kayitlari',  
   'hmi_kayitlari',  
   'hmi_ayarlar',  
   'ekran_ayarlari',  
   'ekran_verileri',  
   'anlik_calisma_verileri',  
   'terfi_parametreleri',  
   'servis_kayitlari',  
   'bakim_kayitlari',  
   'teknik_fotograflar',  
   'fotograflar',  
   'olcumler',  
   'olcum_kayitlari',  
   'panolar',  
   'seviye_bilgileri',  
   'degisiklik_gecmisi',  
   'ariza_notlari',  
   'kablo_baglantilari'  
  
  ];  
  
  for(  
   const table of terfiTables  
  ){  
  
   try{  
  
    await db  
     .from(table)  
     .delete()  
     .eq(  
      'terfi_id',  
      id  
     );  
  
   }catch(e){  
  
    console.warn(  
     'Tablo silme atlandı:',  
     table,  
     e  
    );  
  
   }  
  
  }  
  
  
  const dr=  
   await db  
    .from('suruculer')  
    .select('id')  
    .eq(  
     'terfi_id',  
     id  
    );  
  
  if(dr.error)  
   throw dr.error;  
  
  for(  
   const d of dr.data||[]  
  ){  
  
   try{  
  
    await db  
     .from(  
      'surucu_ariza_kayitlari'  
     )  
     .delete()  
     .eq(  
      'surucu_id',  
      d.id  
     );  
  
   }catch(e){}  
  
   try{  
  
    await db  
     .from(  
      'surucu_parametre_kayitlari'  
     )  
     .delete()  
     .eq(  
      'surucu_id',  
      d.id  
     );  
  
   }catch(e){}  
  
   const r=  
    await db  
     .from('suruculer')  
     .delete()  
     .eq(  
      'id',  
      d.id  
     );  
  
   if(r.error)  
    throw r.error;  
  
  }  
  
  
  for(  
   const mid of motorIds  
  ){  
  
   const r=  
    await db  
     .from('motorlar')  
     .delete()  
     .eq(  
      'id',  
      mid  
     );  
  
   if(r.error)  
    throw r.error;  
  
  }  
  
  
  const pumps=  
   await db  
    .from('pompalar')  
    .select('id')  
    .eq(  
     'terfi_id',  
     id  
    );  
  
  if(pumps.error)  
   throw pumps.error;  
  
  for(  
   const p of pumps.data||[]  
  ){  
  
   const r=  
    await db  
     .from('pompalar')  
     .delete()  
     .eq(  
      'id',  
      p.id  
     );  
  
   if(r.error)  
    throw r.error;  
  
  }  
  
  
  const finalDelete=  
   await db  
    .from('terfiler')  
    .delete()  
    .eq(  
     'id',  
     id  
    );  
  
  if(finalDelete.error)  
   throw finalDelete.error;  
  
  
  delete localPhotos[id];  
  
  delete terfiLocations[id];  
  
  delete terfiDetails[id];  
  
  changeHistory=  
   changeHistory.filter(  
    x=>  
     x.terfi_id!==id  
   );  
  
  const ssrMap=  
   localJSON(  
    LOCAL_SSR_KEY,  
    {}  
   );  
  
  delete ssrMap[id];  
  
  saveLocal(  
   LOCAL_PHOTO_KEY,  
   localPhotos  
  );  
  
  saveLocal(  
   LOCAL_LOCATION_KEY,  
   terfiLocations  
  );  
  
  saveLocal(  
   LOCAL_TERFI_DETAIL_KEY,  
   terfiDetails  
  );  
  
  saveLocal(  
   LOCAL_HISTORY_KEY,  
   changeHistory  
  );  
  
  saveLocal(  
   LOCAL_SSR_KEY,  
   ssrMap  
  );  
  
  alert(  
   'Terfi ve bağlı kayıtlar silindi.'  
  );  
  
  current=null;  
  
  clearAdminSession();  
  
  await home();  
  
 }catch(e){  
  
  console.error(e);  
  
  alert(  
   'Terfi tamamen silinemedi.\n\n'+  
   (  
    e.message||  
    'Bilinmeyen hata'  
   )  
  );  
  
 }  
  
}

function getTerfiReference(s){
 const rtu=String(s?.terfi_no||'').replace(/\D/g,'');
 return TERFI_DATA.find(x=>x.rtu!=null && String(x.rtu)===rtu)
   || TERFI_DATA.find(x=>String(x.ad).toLocaleLowerCase('tr-TR')===String(s?.ad||'').toLocaleLowerCase('tr-TR'))
   || null;
}

function filterStations(){
 const q=(document.getElementById('search')?.value||'').toLowerCase().trim();
 document.querySelectorAll('.station-group').forEach(group=>{
  let visible=0;
  group.querySelectorAll('.station').forEach(x=>{
   const show=!q || (x.dataset.search||'').includes(q);
   x.style.display=show?'block':'none';
   if(show) visible++;
  });
  group.style.display=visible?'block':'none';
 });
}



async function newStation(){
 if(!edit){requestAdmin();return;}
 touchAdminSession();

 const name=prompt('Terfi adı:','Yeni Terfi');
 if(!name) return;
 const rtu=prompt('RTU / Terfi No:','RTU YOK')||'RTU YOK';
 const region=prompt('Bölge (ör. MEZİTLİ, AKDENİZ, TOROSLAR):','BÖLGE BELİRLENMEDİ')||'BÖLGE BELİRLENMEDİ';
 const type=prompt('Terfi tipi: Kuyu / Terfi / Pompa İstasyonu','Terfi')||'Terfi';
 let depth=null;
 if(type.toLowerCase().includes('kuyu')){
  const raw=prompt('Kuyu derinliği [m]:','');
  depth=raw===''?null:Number(raw);
 }
 const count=Math.max(1,Math.min(50,parseInt(prompt('Pompa sayısı:','2')||'2',10)||2));
 const kod='T'+String(Date.now()).slice(-6);

 const r=await db.from('terfiler').insert({
  ad:name, kod, terfi_no:rtu, bolge:region, terfi_tipi:type,
  kuyu_derinligi:Number.isFinite(depth)?depth:null, aciklama:''
 }).select().single();
 if(r.error){alert(r.error.message);return;}

 const pumpRows=Array.from({length:count},(_,i)=>({
  terfi_id:r.data.id, ad:`P${i+1}`, pompa_no:i+1
 }));
 const pr=await db.from('pompalar').insert(pumpRows);
 if(pr.error){alert('Terfi oluşturuldu ancak P kayıtları eklenemedi.\n\n'+pr.error.message);}

 saveTerfiDetail(r.data.id,stationDetailDefaults());
 recordHistory('YENİ TERFİ OLUŞTURULDU',`${kod} · ${name}`);
 await openStation(r.data.id);
}

function selectField(label,id,value,options,extra=''){
 const normalized=(options||[]).map(x=>typeof x==='string'?{value:x,label:x}:x);
 return `<div class="field"><label>${esc(label)}</label><select id="${id}" ${!edit?'disabled':''} ${extra||''}>
  <option value="">Seçilmedi</option>
  ${normalized.map(x=>`<option value="${esc(x.value??'')}" ${String(value??'')===String(x.value??'')?'selected':''}>${esc(x.label??x.value??'')}</option>`).join('')}
 </select></div>`;
}

async function saveActive(){
 if(!current){toast('Önce bir terfi açın.');return;}
 if(!edit){requestAdmin();return;}
 const tabBefore=tab;
 let pumpLinks=[], driverFamilies=[], terfiPayload=null;
 if(tabBefore==='pompa'){
  pumpLinks=current.p.map(p=>({id:p.id,motor_id:val(`p_${p.id}_motor`)||null,surucu_id:val(`p_${p.id}_surucu`)||null,pompa_no:p.pompa_no||null}));
 }
 if(tabBefore==='surucu'){
  driverFamilies=current.d.map(d=>({id:d.id,surucu_ailesi:val(`d_${d.id}_family`)||null}));
 }
 if(tabBefore==='terfi'){
  terfiPayload={
   ad:val('s_ad'),terfi_no:val('s_no'),kod:val('s_kod'),bolge:val('s_bolge'),adres:val('s_adres'),aciklama:val('s_aciklama'),
   terfi_tipi:val('s_terfi_tipi')||val('s_terfi_tipi')||'Terfi',
   kuyu_derinligi:num(val('s_kuyu_derinligi'))
  };
 }
 await saveActiveBase();
 if(tabBefore==='terfi' && terfiPayload){
  const r=await db.from('terfiler').update(terfiPayload).eq('id',current.s.id);
  if(r.error){alert(r.error.message);return;}
 }
 if(tabBefore==='pompa' && pumpLinks.length){
  const rr=await Promise.all(pumpLinks.map(x=>db.from('pompalar').update({motor_id:x.motor_id,surucu_id:x.surucu_id,pompa_no:x.pompa_no}).eq('id',x.id)));
  const bad=rr.find(x=>x.error); if(bad){alert(bad.error.message);return;}
 }
 if(tabBefore==='surucu' && driverFamilies.length){
  const rr=await Promise.all(driverFamilies.map(x=>db.from('suruculer').update({surucu_ailesi:x.surucu_ailesi}).eq('id',x.id)));
  const bad=rr.find(x=>x.error); if(bad){alert(bad.error.message);return;}
 }
 await openStation(current.s.id);
 if(tabBefore==='pompa' && pumpLinks.length){ selectedPumpId=pumpLinks.find(x=>x.id===selectedPumpId)?.id||pumpLinks[0].id; tab='pompa'; render(); }
 if(tabBefore==='surucu'){ tab='surucu'; render(); }
 if(tabBefore==='terfi'){ tab='terfi'; render(); }
}

function v5Esc(x){return typeof esc==='function'?esc(x??''):String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function v5PumpNo(p,i){return Number(p?.pompa_no)||i+1}
function v5Pumps(){return [...(current?.p||[])].sort((a,b)=>v5PumpNo(a,0)-v5PumpNo(b,0))}
function v5SelectedPump(){const ps=v5Pumps();let p=ps.find(x=>x.id===selectedPumpId)||ps[0];if(p)selectedPumpId=p.id;return p}
function v5RefFor(s){return typeof getTerfiReference==='function'?getTerfiReference(s):null}
function v5Match(ref,rows){
 if(!ref)return null;
 const r=ref.rtu!=null?String(ref.rtu):'';
 return rows.find(x=>r&&String(x.terfi_no||'').replace(/\D/g,'')===r) || rows.find(x=>String(x.ad||'').trim().toLocaleLowerCase('tr-TR')===String(ref.ad||'').trim().toLocaleLowerCase('tr-TR')) || null;
}
function v5Districts(rows){
 const vals=new Set(['TÜMÜ']);
 rows.forEach(x=>{if(x.bolge)vals.add(String(x.bolge).trim().toUpperCase())});
 TERFI_DATA.forEach(x=>{if(x.bolge)vals.add(String(x.bolge).trim().toUpperCase())});
 return [...vals].sort((a,b)=>a==='TÜMÜ'?-1:b==='TÜMÜ'?1:a.localeCompare(b,'tr'));
}
function v5SetDistrict(x){v5District=x;localStorage.setItem(V5_DISTRICT_KEY,x);home()}

}

 const e=extras.map(row=>`<div class="v5-site" onclick="openStation('${row.id}')"><div class="v5-site-head"><div><div class="v5-site-name">${v5Esc(row.ad)}</div><div class="v5-site-meta">${v5Esc(row.terfi_no||'RTU YOK')} · ${v5Esc(row.bolge||'Bölge yok')}</div></div><span class="v5-site-badge">KAYIT</span></div></div>`).join('');

async function openStation(id){
 const same=!!(current?.s?.id&&current.s.id===id), wantedTab=same?tab:'terfi',wantedPump=same?selectedPumpId:null;

 const errs=[s.error,m.error,p.error,d.error].filter(Boolean);if(errs.length){alert('Terfi verileri okunamadı:\n\n'+errs.map(x=>x.message).join('\n'));return;}
 current={s:s.data,m:m.data||[],p:p.data||[],d:d.data||[],h:[],w:[],tp:[],detail:getTerfiDetail(id),location:getLocation(id),ssr:{level:'',low:'',high:'',note:''}};
 const ssrMap=localJSON(LOCAL_SSR_KEY,{});const oldSsr=ssrMap[id]||{};current.ssr=oldSsr[selectedPumpId]||oldSsr||{};
 tab=wantedTab;hmiPage=same?hmiPage:1;
 const ps=v5Pumps();selectedPumpId=ps.find(x=>x.id===wantedPump)?.id||ps[0]?.id||null;const sp=v5SelectedPump();selectedMotorId=sp?.motor_id||null;workMotor=sp?.motor_id||null;
 if(edit)touchAdminSession();render();recordHistory('TERFİ AÇILDI',`${current.s.ad||''}`);
 const extras=await Promise.all([db.from('hmi_kayitlari').select('*').eq('terfi_id',id).order('ekran_no',{ascending:true}),db.from('motor_calisma_kayitlari').select('*').eq('terfi_id',id).order('captured_at',{ascending:false}),db.from('terfi_parametreleri').select('*').eq('terfi_id',id).order('sira',{ascending:true})]);

function v5OpenPump(id){if(!current?.p?.some(p=>p.id===id))return;selectedPumpId=id;const p=current.p.find(x=>x.id===id);selectedMotorId=p?.motor_id||null;workMotor=p?.motor_id||null;tab='pompa';hmiPage=1;if(edit)touchAdminSession();render();}

 const selected=v5SelectedPump();
 const hmi=Array.isArray(current?.h)?current.h:[];
 const hmiText=HMI.map((pg,i)=>{
   const r=hmi.find(x=>x.ekran_no===i+1 && (!selected || x.pompa_id===selected.id)) || hmi.find(x=>x.ekran_no===i+1 && !x.pompa_id);
   const vals=r?.degerler||{};
   const parts=pg.labels.slice(0,8).map((lab,j)=>`${lab}: ${vals[j]??'—'}`);
   return `<div class="v6p-hmi"><b>${i+1}. ${v6PdfEsc(pg.title)}</b><span>${v6PdfEsc(parts.join(' · '))}</span></div>`;
 }).join('');
 const pumpRows=pumps.map((p,i)=>{
   const n=v5PumpNo(p,i), m=p.motor_id?current.m.find(x=>x.id===p.motor_id):null, d=p.surucu_id?current.d.find(x=>x.id===p.surucu_id):null;
   return `<tr><td class="num">P${n}</td><td>${v6PdfEsc(p.ad||`P${n}`)}</td><td>${v6PdfEsc(`${p.marka||''} ${p.model||''}`.trim())}</td><td>${v6PdfEsc(p.tip||'')}</td><td>${v6PdfEsc(`${p.guc_kw??'—'} kW`)}</td><td>${v6PdfEsc(m?.ad||'YOK')}</td><td>${v6PdfEsc(`${d?.marka||''} ${d?.model||''}`.trim()||d?.ad||'YOK')}</td><td>${v6PdfEsc(d?.surucu_ailesi||'')}</td></tr>`;
 }).join('');
 return `<div class="v6p-page">
 <div class="v6p-head"><div><h1>MESKİ TERFİ TEKNİK ARŞİVİ</h1><div class="v6p-sub">${v6PdfEsc(s.ad||'')} · ${v6PdfEsc(s.terfi_no||s.kod||'RTU YOK')} · ${v6PdfEsc(s.bolge||'')}</div></div><div class="v6p-right">${v6PdfEsc(s.adres||'')}<br>${v6PdfEsc(now())}</div></div>
 <div class="v6p-info">
  ${v6PdfCell('Terfi Tipi',s.terfi_tipi||detail.tip||'Terfi')}${v6PdfCell('Kuyu Derinliği',s.kuyu_derinligi!=null?`${s.kuyu_derinligi} m`:'—')}${v6PdfCell('Kaynak',detail.emiş_kaynagi||'')}${v6PdfCell('Basma',detail.basma_noktasi||'')}${v6PdfCell('Pompa Tipi',detail.pompa_tipi||'')}${v6PdfCell('Çalışma',detail.calisma_sekli||'')}${v6PdfCell('GPS',loc?`${Number(loc.lat).toFixed(5)}, ${Number(loc.lng).toFixed(5)}`:'Kayıt yok')}${v6PdfCell('Açıklama',s.aciklama||detail.sistem_aciklama||'')}
 </div>
 <div class="v6p-section"><h2>POMPA / MOTOR / SÜRÜCÜ BLOKLARI · ${pumps.length} ADET</h2><table><thead><tr><th>P</th><th>Pompa</th><th>Marka / Model</th><th>Tip</th><th>Güç</th><th>Motor</th><th>Sürücü</th><th>Aile</th></tr></thead><tbody>${pumpRows||'<tr><td colspan="8">Pompa kaydı yok.</td></tr>'}</tbody></table></div>
 <div class="v6p-two"><div class="v6p-section"><h2>SSR / SEVİYE · ${selected?'P'+v5PumpNo(selected,0):'TERFİ'}</h2><div class="v6p-mini">${v6PdfCell('Seviye',current?.ssr?.level||'')}${v6PdfCell('Alt',current?.ssr?.low||'')}${v6PdfCell('Üst',current?.ssr?.high||'')}${v6PdfCell('Not',current?.ssr?.note||'')}</div></div><div class="v6p-section"><h2>HMI / PLC · SEÇİLİ POMPA ${selected?'P'+v5PumpNo(selected,0):'—'}</h2>${hmiText}</div></div>
 <div class="v6p-foot">MESKİ TERFİ ARŞİVİM · Tek sayfa teknik özet · ${v6PdfEsc(s.kod||s.terfi_no||'')}</div>
 </div>`;
}
async function makePDF(){
 if(!current){toast('Önce terfi açın.');return;}
 if(edit)touchAdminSession();
 try{
  const id=current.s.id;
  const [h,w,tp]=await Promise.all([
   db.from('hmi_kayitlari').select('*').eq('terfi_id',id),
   db.from('motor_calisma_kayitlari').select('*').eq('terfi_id',id).order('captured_at',{ascending:false}).limit(8),
   db.from('terfi_parametreleri').select('*').eq('terfi_id',id).order('sira',{ascending:true})
  ]);
  if(h?.data)current.h=h.data;
  if(w?.data)current.w=w.data;
  if(tp?.data)current.tp=tp.data;
 }catch(e){/* PDF yine de mevcut verilerle oluşturulur. */}
 document.getElementById('printArea')?.remove();
 const area=document.createElement('div');area.id='printArea';area.className='print-only';area.innerHTML=v6CompactReportHTML();document.body.appendChild(area);
 setTimeout(()=>window.print(),120);
}

// V5 fonksiyonlarını global bağlama taşı: HTML onclick ve mevcut uygulama gövdesi bunları kullanır.

window.showV5Library=showV5Library;
window.v5FilterLibrary=v5FilterLibrary;
window.stationBody=stationBody;
window.pumpBody=pumpBody;
window.motorBody=motorBody;
window.driverBody=driverBody;
window.ssrBody=ssrBody;
window.workBody=workBody;
window.hmiBody=hmiBody;
window.parameterBody=parameterBody;
window.faultBody=faultBody;
window.saveActive=saveActive;
window.makePDF=makePDF;
window.addMotor=addMotor;
window.addDriver=addDriver;
window.addPump=addPump;
window.requestAdmin=requestAdmin;
window.checkAdmin=checkAdmin;
window.showLogin=showLogin;

// Uygulama ilk yüklendiğinde yeni login ekranını göster.
setTimeout(()=>{if(!loggedIn)window.showLogin()},0);
})();
