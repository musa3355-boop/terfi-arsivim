.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field label{display:block;color:#82a5b7;font-size:9px;font-weight:900;margin:0 0 5px;text-transform:uppercase}.field{min-width:0}.row-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;margin-top:11px}

}
</style>

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){return "ID-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function blankPump(no,ad){
 return {id:uid(),no,ad,motor:{marka:"",model:"",seri:"",guc:"",gerilim:"",akim:"",frekans:"50",devir:"",cos:"",tip:"",not:""},
 drive:{marka:"ABB",model:"",seri:"",guc:"",gerilim:"",ailesi:"",firmware:"",not:""},
 pump:{marka:"",model:"",tip:"",seri:"",debiMin:"",debiMax:"",basmaMin:"",basmaMax:"",not:""},

 box:{motor:{u:"",v:"",w:""},boxMotor:{u:"",v:"",w:""},boxSurucu:{u:"",v:"",w:""},surucu:{u:"",v:"",w:""}},
 hmi:HMI.map(()=>({})),work:[],params:[],faults:[],photos:[],note:""};
}
function buildSeed(){
 return SEED.map(s=>({...clone(s),address:"",source:"",outlet:"",depth:"",gps:"",note:"",
  pumps:s.pompalar.map(p=>blankPump(p.no,p.ad)),history:[]}));
}
function load(){
 try{
  const raw=localStorage.getItem(DB_KEY);
  if(raw){
   const x=JSON.parse(raw);
   if(Array.isArray(x)&&x.length===42) return normalize(x);
  }
 }catch(e){}
 return buildSeed();
}
function normalize(arr){
 const base=buildSeed();
 const bm=Object.fromEntries(base.map(s=>[s.id,s]));
 return base.map(b=>{
  const old=arr.find(x=>x.id===b.id)||arr.find(x=>x.ad===b.ad);
  if(!old)return b;
  const out={...b,...old};
  out.pumps=b.pumps.map(bp=>{
   const op=(old.pumps||[]).find(x=>x.id===bp.id)|| (old.pumps||[]).find(x=>x.no===bp.no);
   if(!op)return bp;
   return {...bp,...op,motor:{...bp.motor,...(op.motor||{})},drive:{...bp.drive,...(op.drive||{})},pump:{...bp.pump,...(op.pump||{})},ssr:{...bp.ssr,...(op.ssr||{})},box:{...bp.box,...(op.box||{})},hmi:bp.hmi.map((h,i)=>({...h,...((op.hmi||[])[i]||{})}))};
  });
  return out;
 });
}

function field(label,path,value,type="text",ro=false){
 const safe=esc(value??"");
 return `<div class="field"><label>${esc(label)}</label><input data-path="${esc(path)}" value="${safe}" type="${type}" ${ro&&!state.admin?"readonly":""}></div>`;
}
function textField(label,path,value,ro=false){
 return `<div class="field"><label>${esc(label)}</label><textarea data-path="${esc(path)}" ${ro&&!state.admin?"readonly":""}>${esc(value??"")}</textarea></div>`;
}
function getPath(obj,path){
 return path.split(".").reduce((a,k)=>a?.[k],obj);
}
function setPath(obj,path,value){
 const a=path.split(".");let x=obj;
 a.slice(0,-1).forEach(k=>{if(!x[k]||typeof x[k]!=="object")x[k]={};x=x[k]});
 x[a[a.length-1]]=value;
}
function collect(pathPrefix, target){
 document.querySelectorAll("[data-path]").forEach(el=>{
  const path=el.dataset.path;if(!path.startsWith(pathPrefix))return;
  const p=path.slice(pathPrefix.length);if(!p)return;
  setPath(target,p,el.value);
 });
}

function exportJSON(){

function importJSON(e){
 const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{
  try{const x=JSON.parse(r.result);if(!Array.isArray(x)||x.length<1)throw Error("Geçersiz yedek");
   state.stations=normalize(x);save();home();toast("Yedek içe aktarıldı.");
  }catch(err){alert(err.message)}
 };r.readAsText(f);
}

 </div>
 <div class="card"><div class="section-head"><div><b>TERFİ BİLGİLERİ</b><div class="muted">Bu bilgiler terfi seviyesindedir.</div></div>${state.admin?`<button class="btn" onclick="editStation()">DÜZENLE</button>`:""}</div><div class="grid3" style="margin-top:10px">${cardKV("SAHA",{"Adres":s.address||"Kayıt yok","Kaynak":s.source||"Kayıt yok","Basma":s.outlet||"Kayıt yok","GPS":s.gps||"Kayıt yok"})}<div class="data-card"><h3>NOT</h3><div class="muted">${esc(s.note||"Terfi açıklaması girilmemiş.")}</div></div></div></div>`;
 if(state.tab==="pompa")return `<div class="card" style="margin-top:12px"><div class="section-head"><div><h3>💧 P${n} POMPA</h3><div class="muted">Yalnızca seçili pompanın bilgileri.</div></div>${state.admin?`<div class="row-actions"><button class="btn" onclick="editPump()">DÜZENLE</button><button class="btn bad" onclick="deletePump()">POMPAYI SİL</button></div>`:""}</div><div class="grid3" style="margin-top:10px">${cardKV("POMPA",{"Ad":p.ad,"Marka":p.pump.marka||"Kayıt yok","Model":p.pump.model||"Kayıt yok","Tip":p.pump.tip||"Kayıt yok","Seri":p.pump.seri||"Kayıt yok"})}${cardKV("HİDROLİK",{"Q min":p.pump.debiMin?p.pump.debiMin+" m³/h":"Kayıt yok","Q max":p.pump.debiMax?p.pump.debiMax+" m³/h":"Kayıt yok","H min":p.pump.basmaMin?p.pump.basmaMin+" m":"Kayıt yok","H max":p.pump.basmaMax?p.pump.basmaMax+" m":"Kayıt yok"})}${cardKV("BAĞLANTI",{"Motor":p.motor.marka||p.motor.model?"Bağlı":"Kayıt yok","Sürücü":p.drive.model||p.drive.marka?"Bağlı":"Kayıt yok"})}</div><div class="data-card" style="margin-top:10px"><h3>NOT</h3><div class="muted">${esc(p.pump.not||"Pompa teknik notu girilmemiş.")}</div></div></div>`;
 if(state.tab==="motor")return motorTab(p);
 if(state.tab==="surucu")return driverTab(p);
 if(state.tab==="box")return boxTab(p);
 if(state.tab==="ssr")return ssrTab(p);
 if(state.tab==="hmi")return hmiTab(p);
 if(state.tab==="param")return paramTab(p);
 if(state.tab==="work")return workTab(p);
 if(state.tab==="fault")return faultTab(p);
 if(state.tab==="photo")return photoTab(p);
 return historyTab(s,p);
}
function cardKV(title,obj){return `<div class="data-card"><h3>${title}</h3>${Object.entries(obj).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${esc(v??"—")}</span></div>`).join("")}</div>`}
function motorTab(p){return `<div class="grid3" style="margin-top:12px">${cardKV("⚙ MOTOR ETİKET",{"Marka":p.motor.marka||"Kayıt yok","Model":p.motor.model||"Kayıt yok","Seri":p.motor.seri||"Kayıt yok","Tip":p.motor.tip||"Kayıt yok"})}${cardKV("ELEKTRİKSEL",{"Güç":p.motor.guc?p.motor.guc+" kW":"Kayıt yok","Gerilim":p.motor.gerilim?p.motor.gerilim+" V":"Kayıt yok","Akım":p.motor.akim?p.motor.akim+" A":"Kayıt yok","Frekans":p.motor.frekans?p.motor.frekans+" Hz":"Kayıt yok"})}${cardKV("MEKANİK",{"Devir":p.motor.devir?p.motor.devir+" rpm":"Kayıt yok","Cosφ":p.motor.cos||"Kayıt yok","Not":p.motor.not||"Kayıt yok"})}</div>${state.admin?`<div class="row-actions"><button class="btn ok" onclick="editMotor()">MOTORU DÜZENLE</button></div>`:""}`}
function driverTab(p){return `<div class="grid3" style="margin-top:12px">${cardKV("🔌 SÜRÜCÜ",{"Marka":p.drive.marka||"Kayıt yok","Model":p.drive.model||"Kayıt yok","Seri":p.drive.seri||"Kayıt yok","Aile":p.drive.ailesi||"Kayıt yok"})}${cardKV("ELEKTRİK",{"Güç":p.drive.guc||"Kayıt yok","Besleme":p.drive.gerilim||"Kayıt yok","Firmware":p.drive.firmware||"Kayıt yok"})}<div class="data-card"><h3>NOT</h3><div class="muted">${esc(p.drive.not||"Sürücü notu girilmemiş.")}</div></div></div>${state.admin?`<div class="row-actions"><button class="btn ok" onclick="editDriver()">SÜRÜCÜYÜ DÜZENLE</button></div>`:""}`}
function boxTab(p){
 const sections=[["motor","MOTOR → BOX"],["boxMotor","BOX → MOTOR"],["boxSurucu","BOX → SÜRÜCÜ"],["surucu","SÜRÜCÜ U/V/W"]];
 return `<div class="grid2" style="margin-top:12px">${sections.map(([key,title])=>`<div class="data-card"><h3>🔧 ${title}</h3>${["u","v","w"].map(k=>`<div class="field" style="margin-top:7px"><label>${k.toUpperCase()}</label><input data-box="${key}.${k}" value="${esc(p.box[key][k])}" ${state.admin?"":"readonly"}></div>`).join("")}</div>`).join("")}</div>${state.admin?`<div class="row-actions"><button class="btn ok" onclick="saveBox()">BOX / KABLO KAYDET</button></div>`:""}`;
}
function ssrTab(p){return `<div class="grid2" style="margin-top:12px">${cardKV("🟢 SSR / SEVİYE",{"Seviye":p.ssr.seviye||"Kayıt yok","Alt":p.ssr.alt||"Kayıt yok","Üst":p.ssr.ust||"Kayıt yok","Basınç koruma":p.ssr.basincKoruma||"Kayıt yok"})}<div class="data-card"><h3>NOT</h3><div class="muted">${esc(p.ssr.not||"SSR / seviye notu girilmemiş.")}</div></div></div>${state.admin?`<div class="row-actions"><button class="btn ok" onclick="editSSR()">SSR / SEVİYE DÜZENLE</button></div>`:""}`}
function hmiTab(p){
 const page=HMI[state.hmiPage-1],vals=p.hmi[state.hmiPage-1]||{};
 return `<div class="card" style="margin-top:12px"><div class="section-head"><div><h3>🖥 P${p.no} · WEINTEK HMI / PLC</h3><div class="muted">5 ekranın her biri P${p.no} pompasına özeldir.</div></div><span class="badge">EKRAN ${state.hmiPage}/5</span></div><div class="hmi-tabs" style="margin-top:10px">${HMI.map((x,i)=>`<button class="${state.hmiPage===i+1?"active":""}" onclick="setHmiPage(${i+1})">${i+1} · ${esc(x.title)}</button>`).join("")}</div></div>
 <div class="card"><div class="hmi-grid">${page.labels.map((lab,i)=>`<div class="hmi-field"><span>${esc(lab)}</span><input data-hmi="${i}" value="${esc(vals[i]??"")}" ${state.admin?"":"readonly"}></div>`).join("")}</div>${state.admin?`<div class="row-actions"><button class="btn ok" onclick="saveHmi()">HMI EKRANINI KAYDET</button></div>`:""}</div>`;
}
function paramTab(p){
 return `<div class="card" style="margin-top:12px"><div class="section-head"><div><h3>⚙ P${p.no} · TERFİYE ÖZEL PARAMETRELER</h3><div class="muted">Bu kayıtlar yalnızca seçili pompa bloğuna aittir.</div></div>${state.admin?`<button class="btn ok" onclick="addParam()">+ PARAMETRE</button>`:""}</div><div class="table-wrap" style="margin-top:10px"><table class="table"><tr><th>Kod</th><th>Parametre</th><th>Değer</th><th>Birim</th><th>Not</th>${state.admin?"<th>İşlem</th>":""}</tr>${p.params.map(x=>`<tr><td>${esc(x.code||"—")}</td><td>${esc(x.name||"—")}</td><td>${esc(x.value||"—")}</td><td>${esc(x.unit||"—")}</td><td>${esc(x.note||"")}</td>${state.admin?`<td><button class="btn" onclick="openParamModal('${x.id}')">DÜZENLE</button></td>`:""}</tr>`).join("")||`<tr><td colspan="${state.admin?6:5}"><div class="empty">P${p.no} için henüz terfiye özel parametre kaydı yok.</div></td></tr>`}</table></div></div>
 <div class="card"><div class="section-head"><div><h3>ABB ACS580 / ACQ580 PARAMETRE KÜTÜPHANESİ</h3><div class="muted">Genel referans kütüphanesi; seçili pompanın kaydı değildir.</div></div></div><input class="search" id="paramSearch" placeholder="Parametre kodu veya adı ara..." oninput="filterLibrary('paramGrid','paramSearch')"><div id="paramGrid" class="library-grid">${PARAMS.map(x=>`<div class="data-card" data-search="${esc((x.code+" "+x.name+" "+x.source).toLocaleLowerCase("tr-TR"))}" style="margin-top:8px"><div class="kv"><span>${esc(x.code)}</span><span>${esc(x.name)}</span></div><div class="muted">${esc(x.source)} · ${esc(x.unit)}</div></div>`).join("")}</div></div>`;
}
function filterLibrary(gridId,inputId){const q=(document.getElementById(inputId)?.value||"").toLocaleLowerCase("tr-TR");document.querySelectorAll(`#${gridId} [data-search]`).forEach(x=>x.style.display=!q||x.dataset.search.includes(q)?"block":"none")}
function workTab(p){
 return `<div class="card" style="margin-top:12px"><div class="section-head"><div><h3>▶ P${p.no} · ÇALIŞMA KAYITLARI</h3><div class="muted">Anlık ölçüm ve saha kontrol kayıtları.</div></div>${state.admin?`<button class="btn ok" onclick="addWork()">+ ÇALIŞMA KAYDI</button>`:""}</div><div class="table-wrap" style="margin-top:10px"><table class="table"><tr><th>Tarih</th><th>Hz</th><th>A</th><th>kW</th><th>V</th><th>RPM</th><th>bar</th><th>m³/h</th><th>Durum</th><th>Not</th></tr>${p.work.map(w=>`<tr><td>${esc(w.date)}</td><td>${esc(w.frekans||"—")}</td><td>${esc(w.akim||"—")}</td><td>${esc(w.guc||"—")}</td><td>${esc(w.gerilim||"—")}</td><td>${esc(w.devir||"—")}</td><td>${esc(w.basinc||"—")}</td><td>${esc(w.debi||"—")}</td><td>${esc(w.durum||"—")}</td><td>${esc(w.not||"")}</td></tr>`).join("")||`<tr><td colspan="10"><div class="empty">P${p.no} için çalışma kaydı yok.</div></td></tr>`}</table></div></div>`;
}
function faultTab(p){
 return `<div class="card" style="margin-top:12px"><div class="section-head"><div><h3>⚠ P${p.no} · ARIZA KAYITLARI</h3><div class="muted">Seçili pompaya ait saha arıza geçmişi.</div></div>${state.admin?`<button class="btn bad" onclick="addFault()">+ ARIZA KAYDI</button>`:""}</div><div class="table-wrap" style="margin-top:10px"><table class="table"><tr><th>Tarih</th><th>Kod</th><th>Başlık</th><th>Tespit</th><th>İşlem</th><th>Sonuç</th></tr>${p.faults.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.code||"—")}</td><td>${esc(x.name||"—")}</td><td>${esc(x.cause||"—")}</td><td>${esc(x.action||"—")}</td><td>${esc(x.result||"—")}</td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">P${p.no} için arıza kaydı yok.</div></td></tr>`}</table></div></div>
 <div class="card"><h3>ABB SÜRÜCÜ ARIZA KÜTÜPHANESİ</h3><div class="table-wrap" style="margin-top:8px"><table class="table"><tr><th>Kod</th><th>Başlık</th><th>Neden</th><th>Kontrol</th></tr>${FAULTS.map(x=>`<tr><td>${x.code}</td><td>${esc(x.name)}</td><td>${esc(x.cause)}</td><td>${esc(x.solution)}</td></tr>`).join("")}</table></div></div>`;
}
function photoTab(p){
 return `<div class="card" style="margin-top:12px"><div class="section-head"><div><h3>📷 P${p.no} · FOTOĞRAF ARŞİVİ</h3><div class="muted">HMI, motor etiketi, pompa etiketi ve saha fotoğraflarının adlarını sakla.</div></div>${state.admin?`<button class="btn ok" onclick="photoAdd()">+ FOTOĞRAF / DOKÜMAN</button>`:""}</div>${p.photos.map(x=>`<div class="data-card" style="margin-top:8px"><div class="kv"><span>${esc(x.date)}</span><span>${esc(x.name)}</span></div></div>`).join("")||`<div class="empty" style="margin-top:10px">P${p.no} için fotoğraf/doküman kaydı yok.</div>`}</div>`;
}
function historyTab(s,p){
 return `<div class="card" style="margin-top:12px"><h3>🕘 DEĞİŞİKLİK GEÇMİŞİ</h3>${s.history.map(x=>`<div class="kv"><span>${esc(x.date)}</span><span>${esc(x.action)} · ${esc(x.detail)}</span></div>`).join("")||`<div class="empty" style="margin-top:10px">Bu terfide henüz işlem geçmişi yok.</div>`}</div>`;
}
function showLibrary(kind){
 const title=kind==="fault"?"ARIZA KÜTÜPHANESİ":"ABB ACS580 / ACQ580 PARAMETRELERİ";
 const body=kind==="fault"?`<input class="search" id="libSearch" placeholder="Kod veya açıklama ara..." oninput="filterLibrary('libGrid','libSearch')"><div id="libGrid">${FAULTS.map(x=>`<div class="data-card" data-search="${esc((x.code+" "+x.name+" "+x.cause+" "+x.solution).toLocaleLowerCase("tr-TR"))}" style="margin-top:8px"><div class="kv"><span>${esc(x.code)}</span><span>${esc(x.name)}</span></div><div class="muted">${esc(x.cause)}<br>${esc(x.solution)}</div></div>`).join("")}</div>`:`<input class="search" id="libSearch" placeholder="Parametre ara..." oninput="filterLibrary('libGrid','libSearch')"><div id="libGrid">${PARAMS.map(x=>`<div class="data-card" data-search="${esc((x.code+" "+x.name+" "+x.source).toLocaleLowerCase("tr-TR"))}" style="margin-top:8px"><div class="kv"><span>${esc(x.code)}</span><span>${esc(x.name)}</span></div><div class="muted">${esc(x.source)} · ${esc(x.unit)}</div></div>`).join("")}</div>`;
 openModal(title,body);
}
function showReferences(){
 openModal("HİDROLİK / SAHA REFERANSLARI",`<div>${Object.entries(REF).map(([k,v])=>`<div class="data-card" style="margin-top:8px"><h3>${esc(k)}</h3><div class="kv"><span>Kaynak</span><span>${esc(v[0])}</span></div><div class="kv"><span>Çıkış</span><span>${esc(v[1])}</span></div><div class="muted" style="margin-top:6px">${esc(v[2])}</div></div>`).join("")}</div>`);
}
function makePDF(){
 const s=station(),p=selectedPump();if(!s||!p)return;
 const rows=(obj)=>Object.entries(obj).map(([k,v])=>`<div class="print-cell"><b>${esc(k)}</b><span>${esc(v||"—")}</span></div>`).join("");
 const hmi=HMI.map((pg,i)=>{const vals=p.hmi[i]||{};return `<h2>${i+1}. ${esc(pg.title)}</h2><table class="print-table"><tr>${pg.labels.map(x=>`<th>${esc(x)}</th>`).join("")}</tr><tr>${pg.labels.map((_,j)=>`<td>${esc(vals[j]||"—")}</td>`).join("")}</tr></table>`}).join("");
 const work=p.work.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.frekans)}</td><td>${esc(x.akim)}</td><td>${esc(x.guc)}</td><td>${esc(x.gerilim)}</td><td>${esc(x.devir)}</td><td>${esc(x.basinc)}</td><td>${esc(x.debi)}</td><td>${esc(x.durum)}</td></tr>`).join("")||`<tr><td colspan="9">Kayıt yok</td></tr>`;
 const params=p.params.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.value)}</td><td>${esc(x.unit)}</td><td>${esc(x.note)}</td></tr>`).join("")||`<tr><td colspan="5">Kayıt yok</td></tr>`;
 const faults=p.faults.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.cause)}</td><td>${esc(x.action)}</td><td>${esc(x.result)}</td></tr>`).join("")||`<tr><td colspan="6">Kayıt yok</td></tr>`;
 document.getElementById("printArea").innerHTML=`<div class="print-page"><div class="print-head"><div><h1>MESKİ TERFİ TEKNİK ARŞİVİ</h1><p>${esc(s.ad)} · ${esc(s.rtu)} · P${p.no} BLOĞU</p></div><div>${now()}<br>${esc(s.bolge)}</div></div>
 <div class="print-grid">${rows({"Terfi":s.ad,"RTU":s.rtu,"Bölge":s.bolge,"Tip":s.tip,"Pompa":p.ad,"Adres":s.address,"Kaynak":s.source,"Basma":s.outlet,"Kuyu":s.depth?s.depth+" m":"—","GPS":s.gps})}</div>
 <div class="print-cols"><div><div class="print-sec"><h2>POMPA / MOTOR</h2>${rows({"Pompa marka":p.pump.marka,"Pompa model":p.pump.model,"Pompa seri":p.pump.seri,"Q min":p.pump.debiMin,"Q max":p.pump.debiMax,"H min":p.pump.basmaMin,"H max":p.pump.basmaMax,"Motor marka":p.motor.marka,"Motor model":p.motor.model,"Motor seri":p.motor.seri,"Motor güç":p.motor.guc+" kW","Motor gerilim":p.motor.gerilim+" V","Motor akım":p.motor.akim+" A","Motor frekans":p.motor.frekans+" Hz","Motor devir":p.motor.devir+" rpm"})}</div>
 <div class="print-sec"><h2>SÜRÜCÜ / SSR / BOX</h2>${rows({"Sürücü marka":p.drive.marka,"Sürücü model":p.drive.model,"Sürücü seri":p.drive.seri,"Sürücü aile":p.drive.ailesi,"SSR seviye":p.ssr.seviye,"SSR alt":p.ssr.alt,"SSR üst":p.ssr.ust,"Basınç koruma":p.ssr.basincKoruma,"Motor U":p.box.motor.u,"Motor V":p.box.motor.v,"Motor W":p.box.motor.w,"Sürücü U":p.box.surucu.u,"Sürücü V":p.box.surucu.v,"Sürücü W":p.box.surucu.w})}</div></div>
 <div><div class="print-sec"><h2>HMI / PLC · 5 EKRAN</h2>${hmi}</div><div class="print-sec"><h2>PARAMETRELER</h2><table class="print-table"><tr><th>Kod</th><th>Ad</th><th>Değer</th><th>Birim</th><th>Not</th></tr>${params}</table></div><div class="print-sec"><h2>ÇALIŞMA</h2><table class="print-table"><tr><th>Tarih</th><th>Hz</th><th>A</th><th>kW</th><th>V</th><th>RPM</th><th>bar</th><th>m³/h</th><th>Durum</th></tr>${work}</table></div><div class="print-sec"><h2>ARIZA</h2><table class="print-table"><tr><th>Tarih</th><th>Kod</th><th>Başlık</th><th>Tespit</th><th>İşlem</th><th>Sonuç</th></tr>${faults}</table></div></div></div>
 <div class="print-foot">MESKİ TERFİ ARŞİVİM · ${esc(s.ad)} · P${p.no} · TEKNİK ARŞİV</div></div>`;
 window.print();
}
function render(){
 const root=document.getElementById("app");
 root.innerHTML=`<div class="shell">${sidebar()}<main class="main">${topbar()}${state.stationId?stationView():homeView()}<div class="footer">MESKİ TERFİ ARŞİVİM · 42 TERFİ · 109 POMPA · ÇALIŞAN TEK DOSYA SÜRÜMÜ</div></main></div>`;
 if(state.admin){let x=document.createElement("div");x.className="adminbar";x.textContent="● YÖNETİCİ MODU AKTİF · Kilitle";x.onclick=admin;document.body.appendChild(x)}else document.querySelectorAll(".adminbar").forEach(x=>x.remove());
}
state.stations=load();
render();
</script>
</body>
</html>
