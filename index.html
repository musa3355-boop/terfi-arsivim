async function saveTerfi(){

  const payload = {

    terfi_no:
      document.getElementById("terfi_no").value.trim(),

    ad:
      document.getElementById("ad").value.trim(),

    adres:
      document.getElementById("adres").value.trim(),

    motor_sayisi:
      Number(document.getElementById("motor_sayisi").value) || 0,

    pompa_sayisi:
      Number(document.getElementById("pompa_sayisi").value) || 0,

    aciklama:
      document.getElementById("aciklama").value.trim()

  };


  if(!payload.terfi_no || !payload.ad){

    alert("Terfi No ve Terfi Adı zorunludur.");

    return;
  }


  let result;


  if(current.id){

    result = await db
      .from("terfiler")
      .update(payload)
      .eq("id",current.id)
      .select()
      .single();

  }else{

    result = await db
      .from("terfiler")
      .insert(payload)
      .select()
      .single();

  }


  if(result.error){

    const msg =
      document.getElementById("message");

    if(msg){

      msg.innerHTML = `
        <div class="notice">
          ${esc(result.error.message)}
        </div>
      `;

    }

    return;
  }


  current = result.data;


  await loadTerfiler();


  current =
    terfiler.find(x=>x.id===current.id)
    || result.data;


  showDetail();

}

  current = null;

  await loadTerfiler();

}

async function saveHMI(){

  const screen =
    hmiScreens[activeHmi];


  const values = {};


  screen.fields.forEach(f=>{

    const el =
      document.getElementById(
        "hmi_"+f[0]
      );

    values[f[0]] =
      el ? el.value.trim() : "";

  });


  const payload = {

    terfi_id:current.id,

    ekran_no:Number(activeHmi),

    ekran_adi:screen.title,

    degerler:values

  };


  const {error} = await db
    .from("hmi_ayarlar")
    .insert(payload);


  if(error){

    alert(error.message);

    return;

  }


  alert(
    "HMI Ekran "+activeHmi+
    " başarıyla arşivlendi."
  );


  loadHMIHistory();

function renderPhotos(){

  document.getElementById("tab").innerHTML = `

    <div class="card">

      <div class="section-head">
        <h3>📷 Saha Fotoğraf Arşivi</h3>
      </div>


      <div class="field">

        <label>Fotoğraf türü</label>

        <select id="foto_tur">

          <option>Motor etiketi</option>
          <option>Pompa etiketi</option>
          <option>Sürücü</option>
          <option>HMI ekranı</option>
          <option>Pano içi</option>
          <option>Pano bağlantısı</option>
          <option>Klemens</option>
          <option>Arıza</option>
          <option>Ölçüm</option>
          <option>Genel saha</option>

        </select>

      </div>


      <div class="field">

        <label>Fotoğraf açıklaması</label>

        <input
          id="foto_aciklama"
          placeholder="Örn: Sürücü etiket bilgisi">

      </div>


      <div class="field">

        <label>Fotoğraf</label>

        <input
          id="foto_file"
          type="file"
          accept="image/*"
          capture="environment">

      </div>


      <div class="notice">

        📱 Telefonda kamerayı açıp fotoğrafı
        doğrudan çekebilirsin.

      </div>


      <button class="btn primary"
        onclick="savePhoto()">
        📷 Fotoğrafı arşivle
      </button>

    </div>


    <div id="photoHistory"></div>

  `;

  loadPhotos();

}


async function savePhoto(){

  const file =
    document.getElementById("foto_file")
      .files[0];


  if(!file){

    alert("Önce fotoğraf seç.");

    return;

  }


  const tur =
    document.getElementById("foto_tur").value;


  const path =
    current.id +
    "/" +
    Date.now() +
    "_" +
    file.name;


  const upload =
    await db.storage
      .from("terfi-fotograflari")
      .upload(path,file);


  if(upload.error){

    alert(upload.error.message);

    return;

  }


  const publicUrl =
    db.storage
      .from("terfi-fotograflari")
      .getPublicUrl(path)
      .data.publicUrl;


  const {error} = await db
    .from("fotograflar")
    .insert({

      terfi_id:current.id,

      tur:tur,

      aciklama:
        document.getElementById(
          "foto_aciklama"
        ).value,

      url:publicUrl,

      storage_path:path

    });


  if(error){

    alert(error.message);

    return;

  }


  alert("Fotoğraf arşivlendi.");

  renderPhotos();

}


async function loadPhotos(){

  const el =
    document.getElementById("photoHistory");


  const {data,error} = await db
    .from("fotograflar")
    .select("*")
    .eq("terfi_id",current.id)
    .order("created_at",{ascending:false});


  if(error){

    el.innerHTML = `
      <div class="card">
        ${esc(error.message)}
      </div>
    `;

    return;

  }


  el.innerHTML = `

    <div class="card">

      <div class="section-head">

        <h3>📷 Fotoğraf Galerisi</h3>

        <span class="smallmuted">
          ${data.length} fotoğraf
        </span>

      </div>


      ${
        data.length

        ?

        data.map(x=>`

          <div class="item">

            <span class="badge">
              ${esc(x.tur)}
            </span>

            <div class="photo">

              <img
                src="${esc(x.url)}"
                alt="${esc(x.aciklama || x.tur)}">

            </div>

            <div class="smallmuted"
                 style="margin-top:7px">

              ${esc(x.aciklama || "")}

            </div>

            <button
              class="btn danger small"
              style="margin-top:8px"
              onclick="deletePhoto('${x.id}','${esc(x.storage_path || "")}')">
              Fotoğrafı sil
            </button>

          </div>

        `).join("")

        :

        `<div class="empty">
          Henüz saha fotoğrafı yok.
        </div>`
      }

    </div>

  `;

}


async function deletePhoto(id,path){

  if(!confirm(
    "Bu fotoğraf arşivden silinsin mi?"
  )) return;


  if(path){

    await db.storage
      .from("terfi-fotograflari")
      .remove([path]);

  }


  await db
    .from("fotograflar")
    .delete()
    .eq("id",id);


  loadPhotos();

}
