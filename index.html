/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(m){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[m];

    }
  );

}


/* =========================================================
   SAYI
========================================================= */

function num(value){

  if(
    value===null ||
    value===undefined ||
    value===""
  ){
    return null;
  }

  const n =
    Number(
      String(value)
      .replace(",",".")
    );

  return Number.isFinite(n)
    ? n
    : null;

}


/* =========================================================
   DOM VALUE
========================================================= */

function val(key){

  const el =
    document.querySelector(
      `[data-k="${CSS.escape(key)}"]`
    );

  return el
    ? el.value
    : "";

}


/* =========================================================
   INPUT
========================================================= */

function inp(
  label,
  key,
  value="",
  type="text"
){

  const numeric =
    type==="number";


  const disabled =
    edit
    ? ""
    : "disabled";


  const keyboard =
    numeric
    ?
    `inputmode="decimal" step="any"`
    :
    "";


  return `

    <div class="field">

      <label>
        ${esc(label)}
      </label>

      <input

        data-k="${esc(key)}"

        type="${type}"

        value="${esc(value)}"

        ${disabled}

        ${keyboard}

      >

    </div>

  `;

}


/* =========================================================
   TEXTAREA
========================================================= */

function area(
  label,
  key,
  value=""
){

  return `

    <div class="field">

      <label>
        ${esc(label)}
      </label>

      <textarea
        data-k="${esc(key)}"
        ${edit ? "" : "disabled"}
      >${esc(value)}</textarea>

    </div>

  `;

}


/* =========================================================
   TARİH
========================================================= */

function dateInp(
  label,
  key,
  value=""
){

  return inp(
    label,
    key,
    value,
    "date"
  );

}


/* =========================================================
   HMI INPUT
========================================================= */

function hmiInput(
  page,
  index,
  label,
  value
){

  const text =
    HMI_TEXT.some(
      word =>
        label
        .toLocaleLowerCase("tr-TR")
        .includes(
          word.toLocaleLowerCase("tr-TR")
        )
    );


  return inp(
    label,
    `h${page}_${index}`,
    value,
    text
      ? "text"
      : "number"
  );

}

/* =========================================================

========================================================= */

function drawStations(
  query
){

  const q =
    String(query || "")
    .toLocaleLowerCase(
      "tr-TR"
    )
    .trim();


  const rows =
    cachedStations.filter(
      x=>{

        const text=

          `${x.ad || ""} `+
          `${x.terfi_no || ""} `+
          `${x.kod || ""} `+
          `${x.bolge || ""} `+
          `${x.adres || ""}`

          .toLocaleLowerCase(
            "tr-TR"
          );


        return text.includes(q);

      }
    );


  const list =
    document.getElementById(
      "stationList"
    );


  if(!rows.length){

    list.innerHTML=`

      <div class="empty">
        Kayıt bulunamadı.
      </div>

    `;

    return;

  }


  list.innerHTML =
    rows.map(
      x=>`

        <button
          class="card station"
          data-station-id="${esc(x.id)}"
        >

          <span class="code">
            ${esc(
              x.terfi_no ||
              x.kod ||
              ""
            )}
          </span>

          <h3>
            ${esc(
              x.ad ||
              "İsimsiz Terfi"
            )}
          </h3>

          <div class="muted">

            ${esc(
              x.bolge ||
              ""
            )}

            ${
              x.adres
              ?
              " · "+esc(x.adres)
              :
              ""
            }

          </div>

          <div
            style="
              margin-top:18px;
              color:#62c8ff;
              font-weight:900;
            "
          >
            TEKNİK ARŞİVİ AÇ →
          </div>

        </button>

      `
    ).join("");


  list
  .querySelectorAll(
    "[data-station-id]"
  )
  .forEach(
    button=>{

      button.onclick=()=>{
        openStation(
          button.dataset.stationId
        );
      };

    }
  );

}


/* =========================================================
   TERFİ AÇ
========================================================= */

async function openStation(
  id
){

  if(!id){

    alert(
      "Terfi kaydı bulunamadı."
    );

    return;

  }


  app.innerHTML=`

    <div class="loading">
      Terfi arşivi açılıyor...
    </div>

  `;


  const s =
    await db
    .from("terfiler")
    .select("*")
    .eq("id",id)
    .single();


  if(s.error){

    alert(
      "Terfi açılamadı.\n\n"+
      s.error.message
    );

    home();

    return;

  }


  /*
     Ana kayıtlar.
  */

  const [
    m,
    p,
    d,
    h,
    w
  ] =
    await Promise.all([

      db
      .from("motorlar")
      .select("*")
      .eq("terfi_id",id),

      db
      .from("pompalar")
      .select("*")
      .eq("terfi_id",id),

      db
      .from("suruculer")
      .select("*")
      .eq("terfi_id",id),

      db
      .from("hmi_kayitlari")
      .select("*")
      .eq("terfi_id",id)
      .order(
        "ekran_no"
      ),

      db
      .from("motor_calisma_kayitlari")
      .select("*")
      .eq("terfi_id",id)
      .order(
        "captured_at",
        {
          ascending:false
        }
      )

    ]);


  current={

    s:s.data,

    m:m.error
      ?
      []
      :
      (m.data || []),

    p:p.error
      ?
      []
      :
      (p.data || []),

    d:d.error
      ?
      []
      :
      (d.data || []),

    h:h.error
      ?
      []
      :
      (h.data || []),

    w:w.error
      ?
      []
      :
      (w.data || []),

    extra:{}

  };


  /*
     Ek tablolar.
     Tablo yoksa uygulama çökmeyecek.
  */

  const extraTables=[

    "seviye_bilgileri",

    "motor_box_kablolari",

    "servis_kayitlari",

    "surucu_ariza_kayitlari",

    "surucu_parametre_kayitlari",

    "teknik_fotograflar",

    "degisiklik_gecmisi",

    "olcumler",

    "panolar"

  ];


  for(
    const table of extraTables
  ){

    try{

      const r =
        await db
        .from(table)
        .select("*")
        .eq(
          "terfi_id",
          id
        );


      if(!r.error){

        current.extra[
          table
        ] =
          r.data || [];

      }else{

        current.extra[
          table
        ]=[];

      }

    }catch(e){

      current.extra[
        table
      ]=[];

    }

  }


  workMotor =
    current.m[0]?.id ||
    null;


  tab="terfi";

  render();

}

========================================================= */

  if(!current){

  }


  const s=
    current.s;


  const tabs=[

    ["motor","Motorlar"],

    ["pompa","Pompa"],

    ["surucu","Sürücüler"],

    ["calisma","Çalışma"],

    ["hmi","HMI / PLC"]

  app.innerHTML=`

  const patch={};


  /*

     ona göre güncelle.
  */

  if(
    Object.prototype.hasOwnProperty.call(
      s,
      "ad"
    )
  ){

    patch.ad=
      val("ad");

  }


  if(
    Object.prototype.hasOwnProperty.call(
      s,
      "terfi_no"
    )
  ){

    patch.terfi_no=
      val("terfi_no");

  }


  if(
    Object.prototype.hasOwnProperty.call(
      s,
      "kod"
    )
  ){

    patch.kod=
      val("terfi_no");

  }


  if(
    Object.prototype.hasOwnProperty.call(
      s,
      "bolge"
    )
  ){

    ].forEach(
      (_,i)=>{

        );

        .from("hmi_kayitlari")
        .insert({

            current.s.id,

          ekran_no:

    if(result.error)
      throw result.error;

  }

========================================================= */

async function newStation(){

  if(!edit){

    unlock();

    return;

  }


  const code=
    "T"+
    String(
      Date.now()
    ).slice(-5);


  /*
     Önce sadece kod/ad ile oluştur.
     Eğer DB'de terfi_no varsa ikinci güncelleme.
  */

  const result =
    await db
    .from("terfiler")
    .insert({

      ad:
        "Yeni Terfi",

      kod:
        code,

      terfi_no:
        code

    })
    .select()
    .single();


  if(result.error){

    /*
       Eğer terfi_no sütunu yoksa
       tekrar sadece kod ile dene.
    */

    const retry =
      await db
      .from("terfiler")
      .insert({

        ad:
          "Yeni Terfi",

        kod:
          code

      })
      .select()
      .single();


    if(retry.error){

      alert(
        retry.error.message
      );

      return;

    }


    await openStation(
      retry.data.id
    );

    return;

  }


  await openStation(
    result.data.id
  );

}

/* =========================================================
   PDF EK TABLO
========================================================= */

function pdfExtra(
  title,
  rows
){

  if(
    !rows ||
    !rows.length
  ){

    return "";

  }


  const importantKeys=[

    "ad",
    "adi",
    "baslik",
    "kod",
    "parametre_kodu",
    "parametre_adi",
    "deger",
    "yeni_deger",
    "mevcut_deger",
    "birim",
    "durum",
    "aciklama",
    "notlar",
    "islem",
    "tarih"

  ];


  let cells="";


  rows
  .slice(
    0,
    18
  )
  .forEach(
    row=>{

      const pairs=[];


      importantKeys.forEach(
        key=>{

          if(
            row[key]!==undefined &&
            row[key]!==null &&
            row[key]!==""
          ){

            pairs.push(
              `${key}: ${row[key]}`
            );

          }

        }
      );


      if(
        !pairs.length
      ){

        Object.keys(row)
        .slice(0,4)
        .forEach(
          key=>{

            if(
              key!=="id" &&
              key!=="terfi_id" &&
              row[key]!==null &&
              row[key]!==""
            ){

              pairs.push(
                `${key}: ${row[key]}`
              );

            }

          }
        );

      }


      cells +=
        pdfCell(
          "Kayıt",
          pairs.join(" · ")
        );

    }
  );


  return pdfSection(
    title,
    `<div class="pdf-grid">${cells}</div>`
  );

}

              "Sürücü kaydı yok."

            )
          }


          ${
            pdfSection(

              "ANLIK ÇALIŞMA KAYITLARI",

              current.w.length
              ?

              current.w
              .slice(
                0,
                8
              )
              .map(
                pdfWork
              )
              .join("")

              :

              "Çalışma kaydı yok."

            )
          }


          ${
            pdfExtra(
              "BOX KABLO / BARA",
              extra.motor_box_kablolari
            )
          }


          ${
            pdfExtra(
              "SERVİS / BAKIM",
              extra.servis_kayitlari
            )
          }


        </div>


        <!-- =================================================
             KOLON 3
        ================================================== -->

        <div class="pdf-column">


          ${
            pdfExtra(
              "SÜRÜCÜ ARIZA KAYITLARI",
              extra.surucu_ariza_kayitlari
            )
          }


          ${
            pdfExtra(
              "SÜRÜCÜ PARAMETRELERİ",
              extra.surucu_parametre_kayitlari
            )
          }


          ${
            pdfExtra(
              "ÖLÇÜMLER",
              extra.olcumler
            )
          }


          ${
            pdfExtra(
              "PANO",
              extra.panolar
            )
          }


          ${
            pdfExtra(
              "TEKNİK FOTOĞRAF KAYITLARI",
              extra.teknik_fotograflar
            )
          }


          ${
            pdfExtra(
              "DEĞİŞİKLİK GEÇMİŞİ",
              extra.degisiklik_gecmisi
            )
          }


        </div>


        <!-- =================================================
             KOLON 4 = HMI 1-5
        ================================================== -->

        <div class="pdf-column">

          ${
            [1,2,3,4,5]
            .map(
              pdfHMI
            )
            .join("")
          }

        </div>


      </div>


      <div class="pdf-footer">

        <span>
          MESKİ Terfi Arşivim · Merkezi Teknik Arşiv
        </span>

        <span>

          ${
            esc(
              s.terfi_no ||
              s.kod ||
              ""
            )
          }

          ·

          TEK SAYFA

        </span>

      </div>


    </div>

  `;

}


/* =========================================================
   PDF AKTAR
========================================================= */

function makePDF(){

  if(!current){

    alert(
      "Önce bir terfi seçin."
    );

    return;

  }


  const printArea =
    document.getElementById(
      "printArea"
    );


  /*
     Mevcut ekranı yazdırmıyoruz.
     Baştan özel PDF raporu oluşturuyoruz.
  */

  printArea.innerHTML=
    buildPDF();


  /*
     Tarayıcının yeni DOM'u
     hazırlaması için küçük bekleme.
  */

  setTimeout(
    function(){

      window.print();

    },
    250
  );

}


/* =========================================================
   SAYFA BAŞLANGICI
========================================================= */

siteGate();

</script>
