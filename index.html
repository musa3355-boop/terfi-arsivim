 if(!requireAdmin())return;
 const list=state.stations.map((s,i)=>`<tr><td>${esc(s.ad)}</td><td>RTU ${esc(s.rtu)}</td><td>${esc(s.bolge)}</td><td>${s.pumps.length}</td><td><button class="smallbtn" onclick="chooseStation('${esc(s.id)}')">AÇ</button> <button class="smallbtn danger" onclick="deleteStation('${esc(s.id)}')">SİL</button></td></tr>`).join("");
 modal("TERFİ YÖNETİMİ",`<div class="formactions" style="justify-content:flex-start"><button class="smallbtn" onclick="newStation()">＋ YENİ TERFİ</button></div><table class="table"><tr><th>Terfi</th><th>RTU</th><th>Bölge</th><th>Pompa</th><th>İşlem</th></tr>${list}</table>`);
}
function chooseStation(id){state.stationId=id;state.pump=0;state.tab="GENEL";closeAnyModal();render()}
function deleteStation(id){if(state.stations.length<=1){toast("Son terfi silinemez.");return}if(!confirm("Bu terfiyi ve tüm pompa kayıtlarını silmek istediğinize emin misiniz?"))return;state.stations=state.stations.filter(s=>s.id!==id);if(state.stationId===id)state.stationId=state.stations[0].id;state.pump=0;saveAll();closeAnyModal();render()}
function newStation(){
 modal("YENİ TERFİ OLUŞTUR",`<div class="formgrid">
 <div class="field"><label>Terfi Adı</label><input id="n_ad"></div><div class="field"><label>RTU / Terfi No</label><input id="n_rtu"></div>
 <div class="field"><label>Bölge</label><select id="n_bolge"><option>AKDENİZ</option><option>MEZİTLİ</option><option>TOROSLAR</option><option>YENİŞEHİR</option><option>MERKEZ</option></select></div>
 <div class="field"><label>Alt Bölge</label><input id="n_alt"></div><div class="field"><label>Terfi Tipi</label><input id="n_tip" value="Terfi"></div>
 <div class="field"><label>Pompa Tipi</label><input id="n_ptip" value="Dalgıç"></div><div class="field"><label>Kuyu Derinliği (m)</label><input id="n_kuyu" type="number"></div>
 <div class="field"><label>Pompa Sayısı (1–50)</label><input id="n_count" type="number" min="1" max="50" value="1"></div>
 <div class="field"><label>Kaynak</label><input id="n_kaynak"></div><div class="field"><label>Basma</label><input id="n_basma"></div>
 <div class="field"><label>GPS</label><input id="n_gps"></div><div class="field"><label>Çalışma</label><input id="n_cal"></div>
 </div><div class="formactions"><button class="smallbtn" onclick="createStation()">OLUŞTUR</button></div>`);
}
function createStation(){
 const ad=document.getElementById("n_ad").value.trim(),rtu=document.getElementById("n_rtu").value.trim();
 if(!ad||!rtu){toast("Terfi adı ve RTU zorunlu.");return}
 const n=Math.max(1,Math.min(50,Number(document.getElementById("n_count").value)||1));
 const s={id:"RTU-"+rtu,ad,rtu,bolge:document.getElementById("n_bolge").value,altBolge:document.getElementById("n_alt").value,kaynak:document.getElementById("n_kaynak").value,basma:document.getElementById("n_basma").value,terfiTipi:document.getElementById("n_tip").value,pompaTipi:document.getElementById("n_ptip").value,calisma:document.getElementById("n_cal").value,kuyu:document.getElementById("n_kuyu").value,gps:document.getElementById("n_gps").value,aciklama:"",pumps:[]};
 for(let i=1;i<=n;i++)s.pumps.push(makePump(i));state.stations.push(s);state.stationId=s.id;state.pump=0;saveAll();closeAnyModal();render();toast("Yeni terfi oluşturuldu.");
}
function addPump(){if(!requireAdmin())return;const s=st();if(s.pumps.length>=50){toast("En fazla 50 pompa.");return}s.pumps.push(makePump(s.pumps.length+1));state.pump=s.pumps.length-1;saveAll();render();toast("Yeni pompa oluşturuldu.")}
function removeCurrentPump(){if(!requireAdmin())return;const s=st();if(s.pumps.length<=1){toast("Terfide en az 1 pompa olmalı.");return}if(!confirm("Seçili pompa ve ona ait tüm kayıtlar silinsin mi?"))return;s.pumps.splice(state.pump,1);s.pumps.forEach((p,i)=>p.no=i+1);state.pump=Math.max(0,state.pump-1);saveAll();render()}
function modal(title,body){closeAnyModal();document.body.insertAdjacentHTML("beforeend",`<div class="modal appmodal"><div class="modalcard"><div class="modalhead"><h2>${esc(title)}</h2><button class="x" onclick="closeAnyModal()">×</button></div>${body}</div></div>`)}
function closeAnyModal(){document.querySelectorAll(".appmodal").forEach(x=>x.remove())}
function library(type){
 const arr=type==="fault"?FAULTS:type==="acs"?ACS:ACQ,title=type==="fault"?"ARIZA KÜTÜPHANESİ":type==="acs"?"ACS580 PARAMETRELERİ":"ACQ580 PARAMETRELERİ";
 modal(title,`<input id="libsearch" oninput="filterLib()" style="width:100%;background:#071a29;border:1px solid #24536b;color:#fff;border-radius:7px;padding:9px;margin-bottom:9px" placeholder="Kod veya açıklama ara..."><table class="table" id="libtable"><tr><th>Kod</th><th>Açıklama</th><th>Detay/Birim</th></tr>${arr.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2]||"")}</td></tr>`).join("")}</table>`);
}
function filterLib(){const q=document.getElementById("libsearch").value.toLocaleLowerCase("tr-TR");document.querySelectorAll("#libtable tr").forEach((r,i)=>{if(i)r.style.display=r.textContent.toLocaleLowerCase("tr-TR").includes(q)?"":"none"})}
function home(){renderHome()}
function renderHome(){
 const matches=state.stations.filter(s=>(state.filter==="TÜMÜ"||s.bolge===state.filter)&&(!state.search||(`${s.ad} ${s.rtu} ${s.bolge}`).toLocaleLowerCase("tr-TR").includes(state.search.toLocaleLowerCase("tr-TR"))));
 const groups=["AKDENİZ","MEZİTLİ","TOROSLAR","YENİŞEHİR","MERKEZ"];
 document.getElementById("crumb").innerHTML="<b>Ana Sayfa</b>";
 document.getElementById("siteTitle").textContent="MESKİ TERFİ TEKNİK ARŞİV";
 document.getElementById("siteSub").textContent=`${state.stations.length} terfi · ${state.stations.reduce((a,s)=>a+s.pumps.length,0)} pompa`;
 document.querySelectorAll("[data-site]").forEach(e=>e.textContent="—");
 document.getElementById("pumpList").innerHTML="";
 document.getElementById("pumpCount").textContent="";
 document.getElementById("sysTitle").textContent="TERFİLER";
 document.getElementById("sysSub").textContent="Bölge bazlı teknik arşiv";
 document.getElementById("innerNav").innerHTML="";
 document.getElementById("content").innerHTML=`<div class="homehead"><input id="homeSearch" value="${esc(state.search)}" oninput="state.search=this.value;renderHome()" placeholder="Terfi / RTU / bölge ara..." style="width:100%;background:#071a29;border:1px solid #24536b;color:#fff;border-radius:8px;padding:11px"></div>${groups.map(g=>{let a=matches.filter(s=>s.bolge===g);return a.length?`<div class="card" style="margin-top:9px"><h3>⌂ ${g} <span style="float:right">${a.length} terfi</span></h3><div style="padding:10px" class="grid">${a.map(s=>`<div class="card"><h3>${esc(s.ad)}</h3>${rows([["RTU",s.rtu],["Pompa",s.pumps.length],["Tip",s.terfiTipi],["Kaynak",s.kaynak||"—"]])}<div style="padding:8px"><button class="smallbtn" onclick="openStation('${esc(s.id)}')">TERFİYİ AÇ</button></div></div>`).join("")}</div></div>`:""}).join("")}`;
}
function openStation(id){state.stationId=id;state.pump=0;state.tab="GENEL";render()}
function saveCurrent(){if(!requireAdmin())return;saveAll();toast("Tüm değişiklikler kaydedildi.")}
function exportData(){if(!requireAdmin())return;const b=new Blob([JSON.stringify(state.stations,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="meski-terfi-arsiv-yedek.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importData(inp){if(!requireAdmin())return;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw Error();state.stations=x;state.stationId=x[0].id;state.pump=0;saveAll();render();toast("Yedek geri yüklendi.")}catch(e){toast("Geçersiz yedek dosyası.")}};r.readAsText(f)}
function report(){
 const s=st(),x=pm();if(!s||!x)return;const w=window.open("","_blank");if(!w){window.print();return}
 w.document.write(`<html><head><title>MESKİ ${esc(s.ad)} P${x.no}</title><style>body{font-family:Arial;padding:25px;color:#111}h1{margin-bottom:4px}h2{background:#eee;padding:8px}table{width:100%;border-collapse:collapse;margin-bottom:16px}td,th{border:1px solid #bbb;padding:6px;text-align:left;font-size:11px}</style></head><body><h1>MESKİ TERFİ TEKNİK ARŞİV</h1><div>${esc(s.ad)} · RTU ${esc(s.rtu)} · P${x.no}</div><h2>Pompa</h2>${reportTable(x.pump)}<h2>Motor</h2>${reportTable(x.motor)}<h2>Sürücü</h2>${reportTable(x.driver)}<h2>SSR / Seviye</h2>${reportTable(x.ssr)}<h2>Pano / Kablo</h2>${reportTable(x.pano)}<h2>HMI / PLC</h2>${reportTable(x.hmi)}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()
}
function reportTable(o){return `<table>${Object.entries(o).map(([k,v])=>`<tr><th>${esc(label(k))}</th><td>${esc(v)}</td></tr>`).join("")}</table>`}
function clock(){document.getElementById("clock").textContent=new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})+" "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}
function init(){
 document.getElementById("adminBtn").onclick=()=>isAdmin()?showAdmin():login();
 if(isAdmin())showAdmin();
 clock();setInterval(clock,30000);render();
}

init();
</script></body></html>
