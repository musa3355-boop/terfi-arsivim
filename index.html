/* =========================================================
   ESC
========================================================= */

function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* =========================================================
   SAYI
========================================================= */

function num(v){

  if(
    v===null ||
    v===undefined ||
    v===""
  ){
    return null;
  }

  const n =
    Number(
      String(v)
      .replace(",",".")
    );

  return Number.isFinite(n)
    ? n
    : null;

}

function renderStationList(data){

  if(!data.length){

    return `

      <div class="empty">
        Kayıtlı terfi bulunamadı.
      </div>

    `;

  }


  return data.map(
    (x,i)=>{

      const id =
        String(x.id || "");


      const code =
        x.terfi_no ||
        x.kod ||
        `T-${i+1}`;


      return `

        <div
          class="card"
          onclick='openStationSafe(${JSON.stringify(id)})'
          style="cursor:pointer"
        >

          <div class="code">
            ${esc(code)}
          </div>

          <div
            style="
              font-size:19px;
              font-weight:900;
              margin-top:4px;
            "
          >
            ${esc(
              x.ad ||
              "İsimsiz Terfi"
            )}
          </div>

          <div
            class="muted"
            style="margin-top:5px"
          >

            ${esc(
              x.bolge ||
              ""
            )}

async function filterStations(){

  const q =
    String(
      document
      .getElementById(
        "stationSearch"
      )
      ?.value ||
      ""
    )
    .toLocaleLowerCase(
      "tr-TR"
    );


  const result =
    await db
    .from("terfiler")
    .select("*")
    .order("kod");


  if(result.error)
    return;


  const filtered =
    (result.data || [])
    .filter(
      x=>{

        const text=`

          ${x.ad || ""}
          ${x.kod || ""}
          ${x.terfi_no || ""}
          ${x.bolge || ""}
          ${x.adres || ""}

        `
        .toLocaleLowerCase(
          "tr-TR"
        );


        return text.includes(q);

      }
    );


  const list =
    document.getElementById(
      "stationList"
    );


  if(list)
    list.innerHTML=
      renderStationList(
        filtered
      );

}

async function openStationSafe(id){

  if(!id){

    alert(
      "Terfi kaydı bulunamadı."
    );

    return;

  }


  try{

  }catch(e){

        e?.message ||
        "Bilinmeyen hata."
      )

/* =========================================================
   TERFİYİ YÜKLE
========================================================= */

async function openStation(id){

  const station =
    await db
    .from("terfiler")
    .select("*")
    .eq("id",id)
    .single();


  if(station.error){

    throw new Error(
      station.error.message
    );

  }


  current={

    s:station.data,

    m:[],
    p:[],
    d:[],
    h:[],
    w:[],
    levels:[],
    services:[],
    faults:[],
    params:[],
    cables:[],
    photos:[],
    changes:[]

  };


  /*
     Her tablo bağımsız yüklenir.
  */

  const q1 =
    await db
    .from("motorlar")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at");


  if(!q1.error)
    current.m=q1.data || [];


  const q2 =
    await db
    .from("pompalar")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at");


  if(!q2.error)
    current.p=q2.data || [];


  const q3 =
    await db
    .from("suruculer")
    .select("*")
    .eq("terfi_id",id)
    .order("created_at");


  if(!q3.error)
    current.d=q3.data || [];


  const q4 =
    await db
    .from("hmi_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order("ekran_no");


  if(!q4.error)
    current.h=q4.data || [];


  const q5 =
    await db
    .from("motor_calisma_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "captured_at",
      {ascending:false}
    );


  if(!q5.error)
    current.w=q5.data || [];


  const q6 =
    await db
    .from("seviye_bilgileri")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!q6.error)
    current.levels=q6.data || [];


  const q7 =
    await db
    .from("servis_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "created_at",
      {ascending:false}
    );


  if(!q7.error)
    current.services=q7.data || [];


  const q8 =
    await db
    .from("surucu_ariza_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!q8.error)
    current.faults=q8.data || [];


  const q9 =
    await db
    .from("surucu_parametre_kayitlari")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!q9.error)
    current.params=q9.data || [];


  const q10 =
    await db
    .from("teknik_fotograflar")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "created_at",
      {ascending:false}
    );


  if(!q10.error)
    current.photos=q10.data || [];


  const q11 =
    await db
    .from("degisiklik_gecmisi")
    .select("*")
    .eq("terfi_id",id)
    .order(
      "tarih",
      {ascending:false}
    );


  if(!q11.error)
    current.changes=q11.data || [];


  /*
     BOX
  */

  if(current.m.length){

    const ids =
      current.m
      .map(x=>x.id)
      .filter(Boolean);


    if(ids.length){

      const qb =
        await db
        .from("motor_box_kablolari")
        .select("*")
        .in(
          "motor_id",
          ids
        );


      if(!qb.error)
        current.cables=
          qb.data || [];

    }

  }


  if(
    !workMotor ||
    !current.m.some(
      x=>x.id===workMotor
    )
  ){

    workMotor=
      current.m[0]?.id ||
      null;

  }


  currentTab="terfi";

  renderStation();

}

/* =========================================================
   HMI
========================================================= */

function hmiInput(
  page,
  index,
  label,
  value
){

  const text =
    HMI_TEXT_WORDS
    .some(
      x=>
        label
        .toLocaleLowerCase(
          "tr-TR"
        )
        .includes(
          x.toLocaleLowerCase(
            "tr-TR"
          )
        )
    );


  if(text){

    return textInput(
      label,
      `h${page}_${index}`,
      value
    );

  }


  return numberInput(
    label,
    `h${page}_${index}`,
    value
  );

}

  return `

    <div class="card hmi">

      <h2>
        HMI / PLC ARŞİVİ

    ${
      HMI_FIELDS.map(
        (fields,pageIndex)=>{

          const page=
            pageIndex+1;


          const record =

              x=>
                Number(

            );


          const values =

          return `

              <div class="hmi-title">

              <div class="hmi-grid">

}

async function saveCurrent(){

  if(!current)
    return;


  if(!editMode){

    alert(
      "Düzenleme yapmak için yönetici kodu gerekir."
    );

    return;

  }


  /*
     TERFİ
  */

  if(currentTab==="terfi"){

    const result =
      await db
      .from("terfiler")
      .update({

        ad:
          getVal("terfi_ad"),

        kod:
          getVal("terfi_no"),

        bolge:
          getVal("bolge"),

        adres:
          getVal("adres"),

        aciklama:
          getVal("aciklama")

      })
      .eq(
        "id",
        current.s.id
      );


    if(result.error){

      alert(
        result.error.message
      );

      return;

    }

  }


  /*
     MOTORLAR
  */

  if(currentTab==="motor"){

    for(
      const m of current.m
    ){

      const result =
        await db
        .from("motorlar")
        .update({

          ad:
            getVal(
              `m_${m.id}_ad`
            ) || null,

          marka:
            getVal(
              `m_${m.id}_marka`
            ) || null,

          model:

  }

    "T"+
    String(
      Date.now()
    ).slice(-6);


  const result =
    await db
    .from("terfiler")
    .insert({

      ad:
        "Yeni Terfi",

      kod:
        code

    })
    .select()

    );

    return;

  }


  await openStation(
    result.data.id

  if(

    value===""

  }


  return `

    <div class="pdf-cell">

      <b>
        ${esc(label)}

    </div>

                          }`

                        )

                    ).join("")
                  }

                </div>
              `

              :

              `<div class="pdf-cell">
                Servis kaydı yok.
              </div>`

            )
          }

        </div>


        <!-- =================================================
             KOLON 3
        ================================================== -->

        <div class="pdf-col">

          ${
            pdfSection(
              "SÜRÜCÜ ARIZA KAYITLARI",

              current.faults.length
              ?

              `
                <div class="pdf-grid">

                  ${
                    current.faults
                    .map(
                      x=>

                        pdfCell(

                          `Arıza ${
                            x.kod ||
                            ""
                          }`,

                          x.aciklama ||
                          x.tespit ||
                          x.yapilan_islem ||
                          x.sonuc ||
                          "—"

                        )

                    ).join("")
                  }

                </div>
              `

              :

              `<div class="pdf-cell">
                Arıza kaydı yok.
              </div>`

            )
          }


          ${
            pdfSection(
              "SÜRÜCÜ PARAMETRELERİ",

              current.params.length
              ?

              `
                <div class="pdf-grid">

                  ${
                    current.params
                    .map(
                      x=>

                        pdfCell(

                          `Parametre ${
                            x.parametre_kodu ||
                            ""
                          }`,

                          `${
                            x.parametre_adi ||
                            ""
                          } : ${
                            x.yeni_deger ??
                            x.mevcut_deger ??
                            "—"
                          } ${
                            x.birim ||
                            ""
                          }`

                        )

                    ).join("")
                  }

                </div>
              `

              :

              `<div class="pdf-cell">
                Parametre kaydı yok.
              </div>`

            )
          }


          ${
            pdfSection(
              "TEKNİK FOTOĞRAFLAR",

              current.photos.length
              ?

              `
                <div class="pdf-grid">

                  ${
                    current.photos
                    .map(
                      x=>

                        pdfCell(

                          x.kategori ||
                          "Genel",

                          x.baslik ||
                          x.aciklama ||
                          "Fotoğraf"

                        )

                    ).join("")
                  }

                </div>
              `

              :

              `<div class="pdf-cell">
                Fotoğraf kaydı yok.
              </div>`

            )
          }


          ${
            pdfSection(
              "DEĞİŞİKLİK GEÇMİŞİ",

              current.changes.length
              ?

              `
                <div class="pdf-grid">

                  ${
                    current.changes
                    .map(
                      x=>

                        pdfCell(

                          x.tarih
                          ?
                          new Date(
                            x.tarih
                          )
                          .toLocaleString(
                            "tr-TR"
                          )
                          :
                          "—",

                          `${
                            x.islem ||
                            ""
                          } ${
                            x.aciklama ||
                            ""
                          }`

                        )

                    ).join("")
                  }

                </div>
              `

              :

              `<div class="pdf-cell">
                Değişiklik kaydı yok.
              </div>`

            )
          }

        </div>


        <!-- =================================================
             KOLON 4 = HMI 1-5
        ================================================== -->

        <div class="pdf-col">

          ${
            [1,2,3,4,5]
            .map(pdfHMI)
            .join("")
          }

        </div>


      </div>


      <div class="pdf-footer">

        <span>
          MESKİ Terfi Arşivim · Merkezi Teknik Arşiv
        </span>

        <span>

          ${
            esc(
              s.terfi_no ||
              s.kod ||
              ""
            )
          }

          ·

          TEK SAYFA

        </span>

      </div>

    </div>

  `;

}


/* =========================================================
   PDF OLUŞTUR
========================================================= */

async function makePDF(){

  if(!current){

    alert(
      "Önce bir terfi seçin."
    );

    return;

  }


  if(
    typeof html2canvas==="undefined" ||
    !window.jspdf
  ){

    alert(
      "PDF kütüphaneleri yüklenemedi. Sayfayı yenileyip tekrar deneyin."
    );

    return;

  }


  const render =
    document.getElementById(
      "pdfRender"
    );


  /*
     Bütün raporu özel PDF alanına koyuyoruz.
     Mevcut sekmenin hiçbir önemi yok.
  */

  render.innerHTML =
    buildPDFReport();


  /*
     iPhone'da render'ın tamamlanması için.
  */

  await new Promise(
    resolve=>
      setTimeout(
        resolve,
        300
      )
  );


  const sheet =
    render.querySelector(
      ".pdf-sheet"
    );


  if(!sheet){

    alert(
      "PDF raporu oluşturulamadı."
    );

    return;

  }


  try{

    /*
       1400x950 özel raporu canvas'a çevir.
    */

    const canvas =
      await html2canvas(
        sheet,
        {
          backgroundColor:"#ffffff",

          scale:
            Math.min(
              2,
              window.devicePixelRatio ||
              1
            ),

          useCORS:true,

          logging:false,

          width:1400,

          height:950

        }
      );


    /*
       A4 YATAY
    */

    const {
      jsPDF
    } =
      window.jspdf;


    const pdf =
      new jsPDF({

        orientation:"landscape",

        unit:"mm",

        format:"a4",

        compress:true

      });


    /*
       Canvas'ı tek sayfaya tam oturt.
    */

    const img =
      canvas.toDataURL(
        "image/jpeg",
        0.92
      );


    const pageWidth =
      297;

    const pageHeight =
      210;


    /*
       Kenarlardan küçük pay bırak.
    */

    const margin =
      2;


    const usableWidth =
      pageWidth -
      margin*2;


    const usableHeight =
      pageHeight -
      margin*2;


    const ratio =
      Math.min(
        usableWidth /
        canvas.width,

        usableHeight /
        canvas.height
      );


    const imageWidth =
      canvas.width *
      ratio;


    const imageHeight =
      canvas.height *
      ratio;


    const x =
      (
        pageWidth -
        imageWidth
      )/2;


    const y =
      (
        pageHeight -
        imageHeight
      )/2;


    pdf.addImage(
      img,
      "JPEG",
      x,
      y,
      imageWidth,
      imageHeight,
      undefined,
      "FAST"
    );


    /*
       Dosya adı.
    */

    const safeName =
      String(
        current.s.ad ||
        current.s.kod ||
        "terfi"
      )
      .replace(
        /[^a-zA-Z0-9ğüşöçıİĞÜŞÖÇ_-]+/g,
        "_"
      )
      .slice(
        0,
        70
      );


    /*
       iOS Safari'de doğrudan indirme yerine
       paylaş / dosyalara kaydet ekranını
       daha güvenilir açmak için Blob URL.
    */

    const blob =
      pdf.output(
        "blob"
      );


    const url =
      URL.createObjectURL(
        blob
      );


    /*
       Mobilde PDF'yi yeni sekmede aç.
       Kullanıcı oradan Paylaş >
       Dosyalara Kaydet yapabilir.
    */

    const win =
      window.open(
        url,
        "_blank"
      );


    if(!win){

      /*
         popup engellenirse
         link oluştur.
      */

      const a =
        document.createElement(
          "a"
        );

      a.href=url;

      a.download=
        safeName+
        "_Teknik_Arsiv.pdf";

      a.textContent=
        "PDF'yi Aç";

      a.className=
        "btn ok";

      a.style.position=
        "fixed";

      a.style.zIndex=
        "999999";

      a.style.left=
        "20px";

      a.style.right=
        "20px";

      a.style.bottom=
        "100px";

      a.style.textAlign=
        "center";

      document.body.appendChild(a);

    }


    /*
       Bir süre sonra URL temizle.
    */

    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      60000
    );


  }catch(error){

    console.error(
      error
    );


    alert(
      "PDF oluşturulurken hata oluştu.\n\n"+
      (
        error?.message ||
        "Bilinmeyen hata."
      )
    );

  }finally{

    /*
       PDF alanını temizle.
    */

    setTimeout(
      ()=>{
        render.innerHTML="";
      },
      1000
    );

  }

}

showSiteGate();
