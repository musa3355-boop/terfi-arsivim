<!doctype html>  
<html lang="tr">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  
<meta name="theme-color" content="#061a2d">  
<title>MESKİ Terfi Arşivim</title>  
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  
<style>  
:root{  
 --bg:#061a2d;  
 --bg2:#09233b;  
 --card:#0c2a45;  
 --card2:#102f4d;  
 --line:#285573;  
 --line2:#3a769d;  
 --text:#eff8ff;  
 --muted:#9eb9cc;  
 --blue:#2eacef;  
 --blue2:#6dd0ff;  
 --ok:#18bd82;  
 --danger:#df4e5b;  
 --warn:#e0a62f;  
 --shadow:0 12px 32px rgba(0,0,0,.22);  
 --radius:16px;  
 --scale:1;  
}  
  
*{  
 box-sizing:border-box  
}  
  
html{  
 scroll-behavior:smooth  
}  
  
body{  
 margin:0;  
 min-height:100vh;  
 background:  
  radial-gradient(circle at top right,rgba(46,172,239,.11),transparent 28%),  
  linear-gradient(145deg,#041525,#09233b 60%,#071a2d);  
 color:var(--text);  
 font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif  
}  
  
body.zoom-small{  
 --scale:.88  
}  
  
body.zoom-large{  
 --scale:1.12  
}  
  
button,  
input,  
textarea,  
select{  
 font:inherit  
}  
  
button{  
 cursor:pointer;  
 -webkit-tap-highlight-color:transparent  
}  
  
input[type=number]{  
 appearance:textfield  
}  
  
input[type=number]::-webkit-outer-spin-button,  
input[type=number]::-webkit-inner-spin-button{  
 appearance:none;  
 margin:0  
}  
  
.hidden{  
 display:none!important  
}  
  
#app{  
 min-height:100vh  
}  
  
.wrap{  
 max-width:1450px;  
 margin:auto;  
 padding:12px 14px 105px  
}  
  
h1,  
h2,  
h3,  
h4{  
 margin:0 0 10px  
}  
  
.card{  
 background:linear-gradient(145deg,rgba(12,42,69,.99),rgba(8,30,50,.99));  
 border:1px solid var(--line);  
 border-radius:var(--radius);  
 padding:15px;  
 margin:10px 0;  
 box-shadow:var(--shadow)  
}  
  
.row{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:10px  
}  
  
.row3{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px  
}  
  
.row4{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:10px  
}  
  
.grid2{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:9px  
}  
  
.grid3{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:9px  
}  
  
.grid4{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:9px  
}  
  
.field{  
 min-width:0  
}  
  
.field label{  
 display:block;  
 font-size:11px;  
 font-weight:750;  
 color:var(--muted);  
 margin-bottom:5px  
}  
  
.field input,  
.field textarea,  
.field select{  
 width:100%;  
 padding:12px;  
 background:#061a2d;  
 color:#fff;  
 border:1px solid var(--line);  
 border-radius:10px;  
 outline:none;  
 min-height:44px  
}  
  
.field textarea{  
 min-height:90px;  
 resize:vertical  
}  
  
.field input:focus,  
.field textarea:focus,  
.field select:focus{  
 border-color:var(--blue);  
 box-shadow:0 0 0 3px rgba(46,172,239,.10)  
}  
  
.field input[readonly],  
.field textarea[readonly],  
.field select:disabled{  
 opacity:.88;  
 cursor:default  
}  
  
.hmi-field input[readonly]{  
 opacity:.92  
}  
  
.btn{  
 border:1px solid var(--line);  
 background:linear-gradient(145deg,#103653,#0b2943);  
 color:var(--text);  
 border-radius:10px;  
 padding:10px 13px;  
 min-height:42px;  
 font-weight:750;  
 font-size:13px;  
 transition:.15s ease  
}  
  
.btn:hover{  
 border-color:var(--line2);  
 transform:translateY(-1px)  
}  
  
.btn:active{  
 transform:translateY(0)  
}  
  
.btn.primary{  
 background:linear-gradient(145deg,#2199d5,#1979aa);  
 border-color:#42b8f0;  
 color:#fff  
}  
  
.btn.ok{  
 background:linear-gradient(145deg,#18bd82,#108d63);  
 border-color:#35d89d;  
 color:#fff  
}  
  
.btn.danger{  
 background:linear-gradient(145deg,#c74350,#9f303b);  
 border-color:#ec6672;  
 color:#fff  
}  
  
.btn.warn{  
 background:linear-gradient(145deg,#c99025,#98711d);  
 border-color:#edbd53;  
 color:#fff  
}  
  
.btn.ghost{  
 background:transparent  
}  
  
.btn.small{  
 min-height:34px;  
 padding:7px 9px;  
 font-size:11px;  
 border-radius:8px  
}  
  
.topbar{  
 position:sticky;  
 top:0;  
 z-index:50;  
 background:rgba(4,21,37,.92);  
 backdrop-filter:blur(14px);  
 border-bottom:1px solid rgba(58,118,157,.35)  
}  
  
.topbar-inner{  
 max-width:1450px;  
 margin:auto;  
 padding:10px 14px;  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:12px  
}  
  
.brand{  
 min-width:0  
}  
  
.brand h1{  
 font-size:19px;  
 letter-spacing:.2px;  
 margin:0  
}  
  
.brand p{  
 margin:3px 0 0;  
 color:var(--muted);  
 font-size:11px  
}  
  
.top-actions{  
 display:flex;  
 gap:7px;  
 align-items:center;  
 flex-wrap:wrap;  
 justify-content:flex-end  
}  
  
.mode-badge{  
 display:inline-flex;  
 align-items:center;  
 gap:5px;  
 padding:7px 9px;  
 border:1px solid var(--line);  
 border-radius:999px;  
 color:var(--muted);  
 font-size:10px;  
 font-weight:800  
}  
  
.mode-badge.admin{  
 color:#b9ffe6;  
 border-color:#267e62;  
 background:rgba(24,189,130,.10)  
}  
  
.mode-badge.visitor{  
 color:#c6d9e7;  
 background:rgba(255,255,255,.04)  
}  
  
.home-head{  
 display:flex;  
 align-items:flex-start;  
 justify-content:space-between;  
 gap:12px;  
 flex-wrap:wrap  
}  
  
.home-title{  
 font-size:22px;  
 margin:0 0 5px  
}  
  
.home-sub{  
 color:var(--muted);  
 font-size:12px  
}  
  
.searchbox{  
 display:flex;  
 gap:7px;  
 min-width:min(100%,390px)  
}  
  
.searchbox input{  
 flex:1;  
 min-width:0;  
 padding:11px 12px;  
 border-radius:10px;  
 border:1px solid var(--line);  
 background:#061a2d;  
 color:#fff;  
 outline:none  
}  
  
.station-grid{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:10px  
}  
  
.station-card{  
 position:relative;  
 background:linear-gradient(145deg,#0d304d,#09243b);  
 border:1px solid var(--line);  
 border-radius:14px;  
 padding:14px;  
 min-height:145px;  
 cursor:pointer;  
 transition:.15s ease;  
 overflow:hidden  
}  
  
.station-card:hover{  
 border-color:var(--line2);  
 transform:translateY(-2px)  
}  
  
.station-card h3{  
 font-size:16px;  
 margin-bottom:6px;  
 padding-right:75px  
}  
  
.station-card .meta{  
 color:var(--muted);  
 font-size:11px;  
 line-height:1.55  
}  
  
.station-card .card-actions{  
 position:absolute;  
 top:9px;  
 right:9px;  
 display:flex;  
 gap:5px  
}  
  
.badges{  
 display:flex;  
 flex-wrap:wrap;  
 gap:5px;  
 margin-top:9px  
}  
  
.badge{  
 display:inline-flex;  
 align-items:center;  
 min-height:22px;  
 padding:3px 7px;  
 border-radius:999px;  
 border:1px solid var(--line);  
 background:#102f4d;  
 color:#c9e6f7;  
 font-size:9px;  
 font-weight:800  
}  
  
.badge.ok{  
 background:rgba(24,189,130,.10);  
 border-color:#267e62;  
 color:#8ff1cd  
}  
  
.badge.warn{  
 background:rgba(224,166,47,.10);  
 border-color:#846725;  
 color:#f4ca70  
}  
  
.badge.danger{  
 background:rgba(223,78,91,.10);  
 border-color:#8e3841;  
 color:#ff9da7  
}  
  
.detail-head{  
 display:flex;  
 justify-content:space-between;  
 align-items:flex-start;  
 gap:10px;  
 flex-wrap:wrap  
}  
  
.detail-title{  
 font-size:23px;  
 margin:0 0 4px  
}  
  
.detail-sub{  
 color:var(--muted);  
 font-size:11px  
}  
  
.detail-actions{  
 display:flex;  
 gap:6px;  
 flex-wrap:wrap;  
 justify-content:flex-end  
}  
  
.tabs{  
 display:flex;  
 gap:6px;  
 overflow:auto;  
 padding:5px 1px 9px;  
 scrollbar-width:thin  
}  
  
.tab{  
 flex:0 0 auto;  
 padding:9px 11px;  
 border-radius:9px;  
 border:1px solid var(--line);  
 background:#0a2842;  
 color:var(--muted);  
 font-size:11px;  
 font-weight:800;  
 white-space:nowrap  
}  
  
.tab.active{  
 background:linear-gradient(145deg,#208fca,#176d99);  
 border-color:#42b8f0;  
 color:#fff  
}  
  
.section-head{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:8px;  
 margin-bottom:10px;  
 flex-wrap:wrap  
}  
  
.section-head h2,  
.section-head h3{  
 margin:0  
}  
  
.section-head small{  
 color:var(--muted);  
 font-size:10px  
}  
  
.kpi-grid{  
 display:grid;  
 grid-template-columns:repeat(5,minmax(0,1fr));  
 gap:8px  
}  
  
.kpi{  
 background:#09263f;  
 border:1px solid var(--line);  
 border-radius:11px;  
 padding:10px  
}  
  
.kpi .v{  
 font-size:19px;  
 font-weight:850  
}  
  
.kpi .l{  
 color:var(--muted);  
 font-size:9px;  
 margin-top:2px  
}  
  
.table-wrap{  
 overflow:auto;  
 border:1px solid var(--line);  
 border-radius:10px  
}  
  
table{  
 width:100%;  
 border-collapse:collapse;  
 min-width:680px  
}  
  
th,td{  
 padding:9px 10px;  
 border-bottom:1px solid rgba(58,118,157,.28);  
 text-align:left;  
 vertical-align:top;  
 font-size:11px  
}  
  
th{  
 background:#09263f;  
 color:#bcd8e8;  
 font-weight:850;  
 position:sticky;  
 top:0  
}  
  
td{  
 color:#e8f5fc  
}  
  
tr:last-child td{  
 border-bottom:0  
}  
  
.empty{  
 padding:28px 15px;  
 text-align:center;  
 border:1px dashed var(--line);  
 border-radius:11px;  
 color:var(--muted);  
 font-size:12px  
}  
  
.muted{  
 color:var(--muted)  
}  
  
.tiny{  
 font-size:9px  
}  
  
.mini{  
 font-size:10px  
}  
  
.flex{  
 display:flex;  
 align-items:center;  
 gap:7px  
}  
  
.flex-between{  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:8px  
}  
  
.wrap-flex{  
 display:flex;  
 align-items:center;  
 gap:7px;  
 flex-wrap:wrap  
}  
  
.hmi-page-nav{  
 display:flex;  
 gap:6px;  
 overflow:auto;  
 padding-bottom:7px;  
 margin-bottom:8px  
}  
  
.hmi-page-btn{  
 flex:0 0 auto;  
 border:1px solid var(--line);  
 background:#08243b;  
 color:var(--muted);  
 border-radius:9px;  
 padding:8px 10px;  
 font-size:10px;  
 font-weight:800  
}  
  
.hmi-page-btn.active{  
 background:#176d99;  
 color:#fff;  
 border-color:#42b8f0  
}  
  
.hmi-grid{  
 display:grid;  
 grid-template-columns:repeat(2,minmax(0,1fr));  
 gap:8px  
}  
  
.hmi-field{  
 background:#09263f;  
 border:1px solid var(--line);  
 border-radius:10px;  
 padding:9px  
}  
  
.hmi-field label{  
 display:block;  
 font-size:10px;  
 color:var(--muted);  
 font-weight:750;  
 margin-bottom:5px  
}  
  
.hmi-field input,  
.hmi-field textarea,  
.hmi-field select{  
 width:100%;  
 min-height:40px;  
 padding:9px;  
 background:#061a2d;  
 color:#fff;  
 border:1px solid var(--line);  
 border-radius:8px;  
 outline:none  
}  
  
.hmi-field textarea{  
 min-height:72px;  
 resize:vertical  
}  
  
.motor-list{  
 display:grid;  
 grid-template-columns:repeat(3,minmax(0,1fr));  
 gap:9px  
}  
  
.motor-card{  
 border:1px solid var(--line);  
 background:#09263f;  
 border-radius:11px;  
 padding:10px;  
 cursor:pointer  
}  
  
.motor-card.active{  
 border-color:#42b8f0;  
 box-shadow:0 0 0 1px rgba(66,184,240,.18)  
}  
  
.motor-card h4{  
 font-size:13px;  
 margin-bottom:4px  
}  
  
.motor-card p{  
 margin:2px 0;  
 color:var(--muted);  
 font-size:10px  
}  
  
.photo-grid{  
 display:grid;  
 grid-template-columns:repeat(4,minmax(0,1fr));  
 gap:8px  
}  
  
.photo-item{  
 position:relative;  
 aspect-ratio:1/1;  
 overflow:hidden;  
 border-radius:10px;  
 border:1px solid var(--line);  
 background:#061a2d  
}  
  
.photo-item img{  
 width:100%;  
 height:100%;  
 object-fit:cover;  
 display:block  
}  
  
.photo-item .photo-label{  
 position:absolute;  
 left:5px;  
 right:5px;  
 bottom:5px;  
 padding:4px 5px;  
 background:rgba(0,0,0,.68);  
 border-radius:6px;  
 font-size:9px;  
 white-space:nowrap;  
 overflow:hidden;  
 text-overflow:ellipsis  
}  
  
.photo-actions{  
 position:absolute;  
 top:5px;  
 right:5px;  
 display:flex;  
 gap:4px  
}  
  
.photo-actions button{  
 width:28px;  
 height:28px;  
 border-radius:7px;  
 background:rgba(0,0,0,.72);  
 color:#fff;  
 border:1px solid rgba(255,255,255,.16)  
}  
  
.modal-backdrop{  
 position:fixed;  
 inset:0;  
 z-index:1000;  
 display:none;  
 align-items:center;  
 justify-content:center;  
 padding:12px;  
 background:rgba(0,0,0,.70);  
 backdrop-filter:blur(5px)  
}  
  
.modal-backdrop.show{  
 display:flex  
}  
  
.modal{  
 width:min(760px,100%);  
 max-height:92vh;  
 overflow:auto;  
 background:#09243b;  
 border:1px solid var(--line2);  
 border-radius:15px;  
 box-shadow:0 25px 80px rgba(0,0,0,.45)  
}  
  
.modal-head{  
 position:sticky;  
 top:0;  
 z-index:2;  
 display:flex;  
 align-items:center;  
 justify-content:space-between;  
 gap:8px;  
 padding:13px 15px;  
 background:#09243b;  
 border-bottom:1px solid var(--line)  
}  
  
.modal-head h3{  
 margin:0;  
 font-size:15px  
}  
  
.modal-body{  
 padding:14px  
}  
  
.modal-foot{  
 display:flex;  
 justify-content:flex-end;  
 gap:7px;  
 padding:11px 14px;  
 border-top:1px solid var(--line)  
}  
  
.close-btn{  
 width:32px;  
 height:32px;  
 border-radius:8px;  
 background:#123b59;  
 color:#fff;  
 border:1px solid var(--line);  
 font-size:18px;  
 line-height:1  
}  
  
.notice{  
 padding:10px 11px;  
 border-radius:9px;  
 border:1px solid var(--line);  
 background:#08243b;  
 color:#cce1ee;  
 font-size:11px;  
 line-height:1.55  
}  
  
.notice.warn{  
 border-color:#846725;  
 background:rgba(224,166,47,.08);  
 color:#f4d27f  
}  
  
.notice.danger{  
 border-color:#8e3841;  
 background:rgba(223,78,91,.08);  
 color:#ffabb3  
}  
  
.notice.ok{  
 border-color:#267e62;  
 background:rgba(24,189,130,.08);  
 color:#98f4d4  
}  
  
.upload-zone{  
 border:1px dashed var(--line2);  
 border-radius:11px;  
 padding:14px;  
 text-align:center;  
 background:#08243b  
}  
  
.upload-zone input[type=file]{  
 width:100%  
}  
  
.ocr-preview{  
 display:grid;  
 grid-template-columns:180px 1fr;  
 gap:10px;  
 align-items:start  
}  
  
.ocr-preview img{  
 width:100%;  
 max-height:260px;  
 object-fit:contain;  
 background:#061a2d;  
 border:1px solid var(--line);  
 border-radius:9px  
}  
  
.ocr-text{  
 white-space:pre-wrap;  
 min-height:150px;  
 max-height:320px;  
 overflow:auto;  
 padding:10px;  
 border:1px solid var(--line);  
 border-radius:9px;  
 background:#061a2d;  
 color:#dceef8;  
 font-size:11px  
}  
  
.loading{  
 position:fixed;  
 inset:0;  
 z-index:3000;  
 display:none;  
 align-items:center;  
 justify-content:center;  
 background:rgba(0,0,0,.55);  
 backdrop-filter:blur(3px)  
}  
  
.loading.show{  
 display:flex  
}  
  
.spinner{  
 width:42px;  
 height:42px;  
 border-radius:50%;  
 border:4px solid rgba(255,255,255,.15);  
 border-top-color:var(--blue2);  
 animation:spin .8s linear infinite  
}  
  
@keyframes spin{  
 to{transform:rotate(360deg)}  
}  
  
.login-screen{  
 position:fixed;  
 inset:0;  
 z-index:4000;  
 display:none;  
 align-items:center;  
 justify-content:center;  
 padding:15px;  
 background:  
  radial-gradient(circle at top,#123e60,#061a2d 55%,#04121f)  
}  
  
.login-screen.show{  
 display:flex  
}  
  
.login-box{  
 width:min(430px,100%);  
 background:#09243b;  
 border:1px solid var(--line2);  
 border-radius:17px;  
 padding:20px;  
 box-shadow:0 25px 90px rgba(0,0,0,.48)  
}  
  
.login-box h1{  
 font-size:21px;  
 margin-bottom:5px  
}  
  
.login-box p{  
 margin:0 0 15px;  
 color:var(--muted);  
 font-size:11px;  
 line-height:1.55  
}  
  
.login-actions{  
 display:flex;  
 gap:7px;  
 margin-top:9px  
}  
  
.login-actions .btn{  
 flex:1  
}  
  
.footer{  
 text-align:center;  
 color:#66859b;  
 font-size:9px;  
 padding:15px 0  
}  
  
@media(max-width:1100px){  
 .station-grid{  
  grid-template-columns:repeat(2,minmax(0,1fr))  
 }  
  
 .motor-list{  
  grid-template-columns:repeat(2,minmax(0,1fr))  
 }  
  
 .kpi-grid{  
  grid-template-columns:repeat(3,minmax(0,1fr))  
 }  
}  
  
@media(max-width:760px){  
 .wrap{  
  padding:9px 9px 100px  
 }  
  
 .topbar-inner{  
  align-items:flex-start;  
  flex-direction:column  
 }  
  
 .top-actions{  
  width:100%;  
  justify-content:flex-start  
 }  
  
 .station-grid,  
 .motor-list,  
 .row3,  
 .row4,  
 .grid3,  
 .grid4{  
  grid-template-columns:1fr  
 }  
  
 .row,  
 .grid2,  
 .hmi-grid{  
  grid-template-columns:1fr  
 }  
  
 .kpi-grid{  
  grid-template-columns:repeat(2,minmax(0,1fr))  
 }  
  
 .photo-grid{  
  grid-template-columns:repeat(2,minmax(0,1fr))  
 }  
  
 .ocr-preview{  
  grid-template-columns:1fr  
 }  
  
 .detail-title{  
  font-size:20px  
 }  
}  
  
@media(max-width:430px){  
 .kpi-grid{  
  grid-template-columns:1fr 1fr  
 }  
  
 .top-actions .btn{  
  flex:1  
 }  
}  
</style>  
</head>  
  
<body>  
  
<div id="loading" class="loading">  
 <div class="spinner"></div>  
</div>  
  
<div id="loginScreen" class="login-screen">  
 <div class="login-box">  
  <h1 id="loginTitle">MESKİ Terfi Arşivim</h1>

function $(id){  
 return document.getElementById(id);  
}  
  
function esc(v){  
 return String(v ?? '')  
  .replace(/&/g,'&amp;')  
  .replace(/</g,'&lt;')  
  .replace(/>/g,'&gt;')  
  .replace(/"/g,'&quot;')  
  .replace(/'/g,'&#039;');  
}  
  
function showLoading(){  
 $('loading')?.classList.add('show');  
}  
  
function hideLoading(){  
 $('loading')?.classList.remove('show');  
}  
  
function showModal(id){  
 $(id)?.classList.add('show');  
}  
  
function closeModal(id){  
 $(id)?.classList.remove('show');  
}  
  
function nowISO(){  
 return new Date().toISOString();  
}  
  
function num(v){  
 const n = Number(v);  
 return Number.isFinite(n) ? n : null;  
}  
  
function fmt(v){  
 return v===null || v===undefined || v===''  
  ? '-'  
  : esc(v);  
}  
  
function loadSettings(){  
 try{  
  return JSON.parse(  
   localStorage.getItem(SETTINGS_KEY) || '{}'  
  );  
 }catch(e){  
  return {};  
 }  
}  
  
function saveSettingsLocal(x){  
 try{  
  localStorage.setItem(  
   SETTINGS_KEY,  
   JSON.stringify(x)  
  );  
 }catch(e){}  
}  
  
function applySettings(){  
 const s = loadSettings();  
  
 const title =  
  s.title ||  
  'MESKİ Terfi Arşivim';  
  
 const subtitle =  
  s.subtitle ||  
  'Terfi · Motor · Pompa · Sürücü · HMI/PLC · Ölçüm · Arıza · Bakım';  
  
 document.title = title;  
  
 if($('loginTitle')){  
  $('loginTitle').textContent = title;  
 }  
  
 const body = document.body;  
  
 body.classList.remove(  
  'zoom-small',  
  'zoom-large'  
 );  
  
 if(s.zoom==='small'){  
  body.classList.add('zoom-small');  
 }else if(s.zoom==='large'){  
  body.classList.add('zoom-large');  
 }  
  
 if(s.theme==='light'){  
  document.documentElement.style.setProperty('--bg','#edf5fa');  
  document.documentElement.style.setProperty('--bg2','#dfeef6');  
  document.documentElement.style.setProperty('--card','#fff');  
  document.documentElement.style.setProperty('--card2','#f5f9fc');  
  document.documentElement.style.setProperty('--line','#c7d9e5');  
  document.documentElement.style.setProperty('--line2','#8eb2c8');  
  document.documentElement.style.setProperty('--text','#102b3d');  
  document.documentElement.style.setProperty('--muted','#557184');  
 }else{  
  document.documentElement.style.setProperty('--bg','#061a2d');  
  document.documentElement.style.setProperty('--bg2','#09233b');  
  document.documentElement.style.setProperty('--card','#0c2a45');  
  document.documentElement.style.setProperty('--card2','#102f4d');  
  document.documentElement.style.setProperty('--line','#285573');  
  document.documentElement.style.setProperty('--line2','#3a769d');  
  document.documentElement.style.setProperty('--text','#eff8ff');  
  document.documentElement.style.setProperty('--muted','#9eb9cc');  
 }  
  
 return {title,subtitle};  
}  
  
function isAdminSessionValid(){  
 try{  
  const raw =  
   sessionStorage.getItem(ADMIN_SESSION_KEY);  
  
  if(!raw){  
   return false;  
  }  
  
  const x = JSON.parse(raw);  
  
  return !!x.ok &&  
   Date.now() - Number(x.at || 0) < 30*60*1000;  
 }catch(e){  
  return false;  
 }  
}  
  
function touchAdminSession(){  
 if(!edit){  
  return;  
 }  
  
 try{  
  sessionStorage.setItem(  
   ADMIN_SESSION_KEY,  
   JSON.stringify({  
    ok:true,  
    at:Date.now()  
   })  
  );  
 }catch(e){}  
}  
  
function clearAdminSession(){  
 try{  
  sessionStorage.removeItem(  
   ADMIN_SESSION_KEY  
  );  
 }catch(e){}  
}  
  
function loadViewState(){  
 try{  
  return JSON.parse(  
   sessionStorage.getItem(  
    VIEW_STATE_KEY  
   ) || '{}'  
  );  
 }catch(e){  
  return {};  
 }  
}  
  
function saveViewState(state){  
 try{  
  sessionStorage.setItem(  
   VIEW_STATE_KEY,  
   JSON.stringify(state)  
  );  
 }catch(e){}  
}  
  
function viewKey(  
 id,  
 section=tab,  
 page=hmiPage  
){  
 return `${id||'home'}::${section}::${page||1}`;  
}  
  
function captureScrollPosition(){  
 if(!current?.s?.id){  
  return;  
 }  
  
 const state =  
  loadViewState();  
  
 state[  
  viewKey(  
   current.s.id,  
   tab,  
   hmiPage  
  )  
 ] = {  
  y:window.scrollY ||  
     window.pageYOffset ||  
     0,  
  at:Date.now()  
 };  
  
 saveViewState(state);  
}  
  
function restoreScrollPosition(){  
 if(!current?.s?.id){  
  return;  
 }  
  
 const state =  
  loadViewState();  
  
 const saved =  
  state[  
   viewKey(  
    current.s.id,  
    tab,  
    hmiPage  
   )  
  ];  
  
 const y =  
  Number(saved?.y || 0);  
  
 requestAnimationFrame(()=>  
  requestAnimationFrame(()=>{  
   window.scrollTo({  
    top:y,  
    left:0,  
    behavior:'auto'  
   });  
  })  
 );  
}  
  
function setHmiPage(page){  
 if(edit){  
  touchAdminSession();  
 }  
  
 captureScrollPosition();  
  
 hmiPage =  
  Number(page) || 1;  
  
 render();  
}  
  
function setTab(x){  
 captureScrollPosition();  
 tab=x;  
 render();  
}  
  
function openLogin(){  
 $('loginError')?.classList.add('hidden');  
 $('loginPassword').value='';  
 $('loginScreen')?.classList.add('show');  
  
 setTimeout(()=>{  
  $('loginPassword')?.focus();  
 },80);  
}  
  
function hideLogin(){  
 $('loginScreen')?.classList.remove('show');  
}  
  
function continueVisitor(){  
 edit=false;  
 clearAdminSession();  
 hideLogin();  
 render();  
}  
  
function loginAdmin(){  
 const password =  
  $('loginPassword')?.value || '';  
  
 const settings =  
  loadSettings();  
  
 const wanted =  
  settings.adminPassword ||  
  DEFAULT_ADMIN_PASSWORD;  
  
 if(password!==wanted){  
  $('loginError').textContent =  
   'Şifre hatalı.';  
  
  $('loginError')  
   .classList.remove('hidden');  
  
  return;  
 }  
  
 edit=true;  
  
 touchAdminSession();  
  
 hideLogin();  
 render();  
}  
  
function logoutAdmin(){  
 edit=false;

async function openStation(id){  
  
 const sameStation =  
  !!(current?.s?.id && current.s.id===id);  
  
 const wantedTab =  
  sameStation ? tab : 'terfi';  
  
 const wantedHmiPage =  
  sameStation ? hmiPage : 1;  
  
 const wantedWorkMotor =  
  sameStation ? workMotor : null;  
  
 const wantedSelectedMotorId =  
  sameStation ? selectedMotorId : null;  
  
 showLoading();  
  
 try{  
  
  const stationResult =  
   await db  
    .from('terfiler')  
    .select('*')  
    .eq('id',id)  
    .single();  
  
  if(stationResult.error){  
   throw stationResult.error;  
  }  
  
  const [  
   motorsResult,  
   pumpsResult,  
   driversResult,  
   hmiResult,  
   workResult,  
   paramResult,  
   faultResult  
  ] = await Promise.all([  
  
   db  
    .from('motorlar')  
    .select('*')  
    .eq('terfi_id',id)  
    .order('created_at',{ascending:true}),  
  
   db  
    .from('pompalar')  
    .select('*')  
    .eq('terfi_id',id)  
    .order('created_at',{ascending:true}),  
  
   db  
    .from('suruculer')  
    .select('*')  
    .eq('terfi_id',id)  
    .order('created_at',{ascending:true}),  
  
   db  
    .from('hmi_kayitlari')  
    .select('*')  
    .eq('terfi_id',id)  
    .order('ekran_no',{ascending:true}),  
  
   db  
    .from('motor_calisma_kayitlari')  
    .select('*')  
    .eq('terfi_id',id)  
    .order('created_at',{ascending:false}),  
  
   db  
    .from('terfi_parametreleri')  
    .select('*')  
    .eq('terfi_id',id)  
    .order('created_at',{ascending:false}),  
  
   db  
    .from('arizalar')  
    .select('*')  
    .eq('terfi_id',id)  
    .order('created_at',{ascending:false})  
  
  ]);  
  
  current={  
   s:stationResult.data,  
   m:motorsResult.data || [],  
   p:pumpsResult.data || [],  
   d:driversResult.data || [],  
   h:hmiResult.data || [],  
   work:workResult.data || [],  
   params:paramResult.data || [],  
   faults:faultResult.data || [],  
   photos:[]  
  };  
  
  tab=wantedTab;  
  hmiPage=wantedHmiPage;  
  
  workMotor =  
   wantedWorkMotor ||  
   current.m[0]?.id ||  
   null;  
  
  selectedMotorId =  
   wantedSelectedMotorId ||  
   current.m[0]?.id ||  
   null;  
  
  await loadPhotos(id);  
  
  render();  
  restoreScrollPosition();  
  
 }catch(e){  
  
  console.error(e);  
  
  alert(  
   'Terfi açılırken hata oluştu: ' +  
   (e.message || e)  
  );  
  
 }finally{  
  hideLoading();  
 }  
}

async function saveStation(){  
  
 if(!edit){  
  return;  
 }  
  
 touchAdminSession();  
  
 const name =  
  $('station_name').value.trim();  
  
 if(!name){  
  alert('Terfi adı gerekli.');  
  return;  
 }  
  
 const no =  
  $('station_no').value.trim();  
  
 const payload={  
  ad:name,  
  terfi_adi:name,  
  terfi_no:no,  
  no:no,  
  kod:$('station_code').value.trim(),  
  bolge:$('station_region').value.trim(),  
  adres:$('station_address').value.trim(),  
  pompa_tipi:$('station_pump_type').value,  
  calisma_sekli:$('station_work_type').value,  
  emiş_kaynagi:$('station_suction').value.trim(),  
  emis_kaynagi:$('station_suction').value.trim(),  
  basma_noktasi:$('station_discharge').value.trim(),  
  aciklama:$('station_description').value.trim(),  
  sistem_aciklama:$('station_description').value.trim()  
 };  
  
 showLoading();  
  
 try{  
  
  if(stationEditingId){  
  
   const {error}=  
    await db  
     .from('terfiler')  
     .update(payload)  
     .eq('id',stationEditingId);  
  
   if(error) throw error;  
  
   closeModal('stationModal');  
  
   await openStation(  
    stationEditingId  
   );  
  
  }else{  
  
   const {data,error}=  
    await db  
     .from('terfiler')  
     .insert(payload)  
     .select()  
     .single();  
  
   if(error) throw error;  
  
   closeModal('stationModal');  
  
   if(data?.id){  
    await openStation(data.id);  
   }else{  
    await loadStations();  
   }  
  
  }  
  
 }catch(e){  
  
  console.error(e);  
  
  alert(  
   'Terfi kaydedilemedi: ' +  
   (e.message || e)  
  );  
  
 }finally{  
  hideLoading();  
 }  
}  
  
async function deleteCurrentStation(){  
  
 if(!edit || !current?.s?.id){  
  return;  
 }  
  
 const name =  
  current.s.ad ||  
  current.s.terfi_adi ||  
  'Bu terfi';  
  
 if(!confirm(  
  `${name} silinsin mi?`  
 )){  
  return;  
 }  
  
 showLoading();  
  
 try{  
  
  const {error}=  
   await db  
    .from('terfiler')  
    .delete()  
    .eq('id',current.s.id);  
  
  if(error) throw error;  
  
  goHome();  
  
 }catch(e){  
  
  console.error(e);  
  
  alert(  
   'Terfi silinemedi: ' +  
   (e.message || e)  
  );  
  
 }finally{  
  hideLoading();  
 }  
}  
  
function updateCurrentStationField(key,value){  
  
 if(!edit || !current?.s?.id){  
  return;  
 }  
  
 touchAdminSession();  
  
 current.s[key]=value;  
  
 db  
  .from('terfiler')  
  .update({[key]:value})  
  .eq('id',current.s.id)  
  .then(({error})=>{  
   if(error){  
    console.error(error);  
   }  
  });  
}

async function saveMotor(){

 if(!edit){
  return;
 }

 touchAdminSession();

 const name=
  $('motor_name').value.trim();

 if(!name){
  alert('Motor adı gerekli.');
  return;
 }

 const payload={
  terfi_id:current.s.id,

  ad:name,

  motor_adi:name,

  pompa_adi:
   $('motor_pump_name').value.trim(),

  pump_name:
   $('motor_pump_name').value.trim(),

  marka:
   $('motor_brand').value.trim(),

  brand:
   $('motor_brand').value.trim(),

  model:
   $('motor_model').value.trim(),

  guc_kw:
   num($('motor_power').value),

  power_kw:
   num($('motor_power').value),

  gerilim_v:
   num($('motor_voltage').value),

  voltage_v:
   num($('motor_voltage').value),

  akim_a:
   num($('motor_current').value),

  current_a:
   num($('motor_current').value),

  devir:
   num($('motor_rpm').value),

  rpm:
   num($('motor_rpm').value),

  frekans_hz:
   num($('motor_frequency').value),

  frequency_hz:
   num($('motor_frequency').value),

  cos_phi:
   num($('motor_cosphi').value),

  cosphi:
   num($('motor_cosphi').value),

  verim:
   num($('motor_efficiency').value),

  efficiency:
   num($('motor_efficiency').value),

  izolasyon_sinifi:
   $('motor_insulation').value.trim(),

  insulation_class:
   $('motor_insulation').value.trim(),

  ip:
   $('motor_ip').value.trim(),

  koruma_sinifi:
   $('motor_ip').value.trim(),

  seri_no:
   $('motor_serial').value.trim(),

  serial_no:
   $('motor_serial').value.trim(),

  kod:
   $('motor_code').value.trim(),

  motor_kodu:
   $('motor_code').value.trim(),

  not:
   $('motor_note').value.trim(),

  note:
   $('motor_note').value.trim()
 };

 showLoading();

 try{

  if(motorEditingId){

   const {error}=
    await db
     .from('motorlar')
     .update(payload)
     .eq('id',motorEditingId);

   if(error){
    throw error;
   }

   selectedMotorId=
    motorEditingId;

  }else{

   const {data,error}=
    await db
     .from('motorlar')
     .insert(payload)
     .select()
     .single();

   if(error){
    throw error;
   }

   if(data?.id){
    selectedMotorId=data.id;
   }

  }

  closeModal('motorEditModal');

  await openStation(
   current.s.id
  );

 }catch(e){

  console.error(e);

  alert(
   'Motor kaydedilemedi: '+
   (e.message || e)
  );

 }finally{

  hideLoading();

 }
}


async function deleteMotor(id){

 )){

  );

 }
}

async function saveHmiValue(
 key,
 value
){

 if(!edit){
  return;
 }

 touchAdminSession();

 const page=
  HMI_PAGES.find(
   x=>x.no===Number(hmiPage)
  ) ||
  HMI_PAGES[0];

 const existing=
  current.h.find(
   x=>Number(x.ekran_no)===page.no
  );

 let values={};

 try{

  values=
   typeof existing?.degerler==='string'
    ? JSON.parse(existing.degerler||'{}')
    : (existing?.degerler || {});

 }catch(e){

  values={};

 }

 values[key]=value;

 const payload={
  terfi_id:current.s.id,
  ekran_no:page.no,
  ekran_adi:page.title,
  degerler:values
 };

 try{

  if(existing?.id){

   const {error}=
    await db
     .from('hmi_kayitlari')
     .update(payload)
     .eq('id',existing.id);

   if(error){
    throw error;
   }

  }else{

   const {data,error}=
    await db
     .from('hmi_kayitlari')
     .insert(payload)
     .select()
     .single();

   if(error){
    throw error;
   }

   if(data){
    current.h.push(data);
   }

  }

 }catch(e){

  console.error(e);

  alert(
   'HMI kaydedilemedi: '+
   (e.message || e)
  );

 }

}

    r?.degerler||
    {};

   page.labels.forEach(
    (label,i)=>{

     rows.push([

      `HMI ${pageNo}`,
      page.title,
      label,
      values[i]??''

     ]);

    }
   );

  }
 );

 rows.push([]);

 rows.push([
  'TERFİYE ÖZEL PARAMETRELER'
 ]);

 rows.push([
  'Ekran',
  'Parametre',
  'Değer',
  'Birim',
  'Açıklama',
  'Kaynak'
 ]);

 current.tp.forEach(
  x=>{

   rows.push([

    x.ekran_adi,
    x.parametre_adi,
    x.deger,
    x.birim,
    x.aciklama,
    x.kaynak

   ]);

  }
 );

 const csv=
  '\ufeff'+
  rows
   .map(
    r=>
     r.map(
      csvEscape
     ).join(';')
   )
   .join('\r\n');

 const blob=
  new Blob(
   [csv],
   {
    type:
     'text/csv;charset=utf-8'
   }
  );

 const url=
  URL.createObjectURL(
   blob
  );

 const a=
  document.createElement(
   'a'
  );

 a.href=url;

 a.download=
  `${
   current.s.kod||
   'terfi'
  }-teknik-arsiv.csv`;

 a.click();

 setTimeout(
  ()=>{

   URL.revokeObjectURL(
    url
   );

  },
  500
 );

 recordHistory(
  'EXCEL/CSV DIŞA AKTARMA',
  ''
 );


}

 applyPrefs();

 restoreAdminSession();

 showLogin();
