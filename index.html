<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>MESKİ | Terfi Arşivim</title>

<style>
:root{
    --bg:#edf3f6;
    --bg2:#e4edf2;
    --panel:#ffffff;
    --panel2:#f7fafc;
    --line:#cbdce6;
    --line2:#a9c6d7;
    --blue:#087fe0;
    --blue2:#2c9af0;
    --text:#173042;
    --muted:#698092;
    --muted2:#8ba0ad;
    --success:#159b69;
    --warning:#d89216;
    --danger:#d84b4b;
    --shadow:0 10px 30px rgba(27,68,91,.10);
    --radius:16px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 80% 0%,
            rgba(47,154,240,.08),
            transparent 28%
        ),
        linear-gradient(
            145deg,
            var(--bg),
            var(--bg2)
        );

    color:var(--text);
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    min-height:100vh;
    display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:225px;
    min-width:225px;
    position:fixed;
    inset:0 auto 0 0;

    background:rgba(248,252,254,.96);

    border-right:1px solid var(--line);

    padding:18px 14px;

    z-index:50;

    overflow:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    padding:4px 5px 20px;

    border-bottom:1px solid var(--line);
}

.brand-mark{
    width:50px;
    height:50px;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #168ee8,
            #075fae
        );

    color:#fff;

    display:grid;
    place-items:center;

    font-size:25px;
    font-weight:900;
}

.brand-title{
    font-size:19px;
    font-weight:850;
}

.brand-sub{
    font-size:9px;
    color:var(--blue);
    font-weight:750;

    letter-spacing:.7px;

    margin-top:2px;
}

.nav{
    margin-top:15px;
}

.nav button{
    width:100%;

    display:flex;
    align-items:center;

    gap:11px;

    padding:12px;

    border:1px solid transparent;

    border-radius:11px;

    background:transparent;

    color:#385366;

    cursor:pointer;

    text-align:left;

    margin-bottom:5px;

    transition:.15s;
}

.nav button:hover{
    background:#edf7fd;
    border-color:#d2e7f3;
}

.nav button.active{
    background:#1285df;
    color:#fff;

    border-color:#2698ee;

    box-shadow:
        0 7px 18px
        rgba(8,127,224,.18);
}

.nav-icon{
    width:22px;

    text-align:center;

    font-size:17px;
}

.sidebar-footer{
    margin-top:25px;

    padding-top:14px;

    border-top:1px solid var(--line);

    font-size:10px;

    color:#8aa0ae;

    line-height:1.6;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    margin-left:225px;

    width:calc(100% - 225px);

    min-height:100vh;
}

.topbar{
    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 25px;

    border-bottom:1px solid var(--line);

    background:
        rgba(255,255,255,.78);

    backdrop-filter:blur(12px);

    position:sticky;

    top:0;

    z-index:30;
}

.top-title{
    font-size:16px;

    font-weight:800;
}

.top-right{
    display:flex;

    align-items:center;

    gap:9px;
}

.mode{
    padding:8px 11px;

    border:1px solid var(--line);

    border-radius:9px;

    color:#718594;

    font-size:11px;

    background:#fff;
}

.mode.edit{
    border-color:#78bdf0;

    color:#0874c8;

    background:#eef8ff;
}

.content{
    padding:22px;

    max-width:1500px;

    margin:auto;
}

/* =========================================================
   CARD
========================================================= */

.card{
    background:
        rgba(255,255,255,.94);

    border:1px solid var(--line);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    overflow:hidden;
}

.card + .card{
    margin-top:16px;
}

.card-header{
    padding:18px 20px;

    border-bottom:1px solid var(--line);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;
}

.card-title{
    font-size:17px;

    font-weight:800;
}

.card-subtitle{
    font-size:11px;

    color:var(--muted);

    margin-top:4px;
}

.card-body{
    padding:20px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    padding:26px;

    margin-bottom:18px;

    position:relative;

    overflow:hidden;
}

.hero:after{
    content:"MESKİ";

    position:absolute;

    right:-10px;

    bottom:-35px;

    font-size:110px;

    font-weight:900;

    color:
        rgba(24,126,189,.035);

    pointer-events:none;
}

.hero-inner{
    position:relative;

    z-index:2;
}

.hero-title{
    font-size:29px;

    font-weight:900;
}

.hero-sub{
    color:var(--muted);

    margin-top:5px;
}

.hero-note{
    margin-top:17px;

    max-width:800px;

    color:#607989;

    line-height:1.6;

    font-size:12px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:12px;

    margin-bottom:18px;
}

.stat{
    padding:17px;

    border:1px solid var(--line);

    background:#fff;

    border-radius:13px;
}

.stat-label{
    font-size:11px;

    color:var(--muted);
}

.stat-value{
    font-size:25px;

    font-weight:900;

    margin-top:7px;
}

.stat-unit{
    font-size:10px;

    color:var(--muted2);
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
    border:1px solid #aac8d9;

    background:#f4f9fc;

    color:#29485b;

    border-radius:9px;

    padding:9px 13px;

    cursor:pointer;

    font-size:12px;

    font-weight:700;

    transition:.15s;
}

.btn:hover{
    border-color:#5aa9df;

    transform:translateY(-1px);
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            #138de9,
            #0876ce
        );

    border-color:#1994ed;

    color:#fff;
}

.btn-success{
    background:#eaf8f2;

    color:#12835a;

    border-color:#9bd9bf;
}

.btn-danger{
    background:#fff1f1;

    color:#c44747;

    border-color:#efb1b1;
}

.btn-warning{
    background:#fff7e8;

    color:#a66a0b;

    border-color:#efd49a;
}

.btn-small{
    padding:6px 9px;

    font-size:10px;
}

/* =========================================================
   SEARCH
========================================================= */

.toolbar{
    display:flex;

    gap:9px;

    align-items:center;

    margin-bottom:13px;
}

.search{
    flex:1;

    max-width:470px;
}

.search input{
    width:100%;

    background:#f8fbfd;

    color:var(--text);

    border:1px solid #c8dce7;

    border-radius:9px;

    padding:11px 12px;

    outline:none;
}

/* =========================================================
   STATIONS
========================================================= */

.station-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;
}

.station-card{
    padding:18px;

    border:1px solid var(--line);

    background:
        linear-gradient(
            145deg,
            #fff,
            #f7fafc
        );

    border-radius:13px;

    cursor:pointer;

    transition:.15s;
}

.station-card:hover{
    border-color:#73b5df;

    transform:translateY(-1px);
}

.station-top{
    display:flex;

    justify-content:space-between;

    gap:10px;
}

.station-code{
    font-size:11px;

    color:#087fdc;

    font-weight:850;
}

.station-name{
    font-size:18px;

    font-weight:850;

    margin-top:5px;
}

.station-type-line{
    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:8px;
}

.type-badge{
    padding:4px 7px;

    border-radius:6px;

    font-size:9px;

    font-weight:750;

    background:#eef7fd;

    color:#087bd2;

    border:1px solid #c9e3f3;
}

.station-meta{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:7px;

    margin-top:14px;
}

.meta-box{
    background:#f2f7fa;

    border:1px solid #d7e5ec;

    padding:9px;

    border-radius:8px;
}

.meta-label{
    font-size:8px;

    color:#8196a4;
}

.meta-value{
    font-size:13px;

    font-weight:800;

    margin-top:3px;
}

.badge{
    display:inline-flex;

    padding:5px 8px;

    border-radius:6px;

    background:#edf9f4;

    color:#16845b;

    border:1px solid #b5e3cd;

    font-size:9px;

    font-weight:750;
}

/* =========================================================
   DETAIL
========================================================= */

.back-row{
    display:flex;

    gap:8px;

    margin-bottom:14px;

    flex-wrap:wrap;
}

.station-heading{
    margin-bottom:15px;
}

.station-heading h1{
    margin:0;

    font-size:27px;
}

.station-heading p{
    margin:5px 0;

    color:var(--muted);

    font-size:12px;
}

/* =========================================================
   DETAIL TABS
========================================================= */

.detail-tabs{
    display:flex;

    gap:7px;

    overflow-x:auto;

    padding:5px 2px 13px;

    position:sticky;

    top:70px;

    z-index:20;

    background:
        rgba(237,243,246,.94);

    backdrop-filter:blur(10px);

    margin-bottom:5px;

    scrollbar-width:none;
}

.detail-tabs::-webkit-scrollbar{
    display:none;
}

.detail-tab{
    flex:0 0 auto;

    border:1px solid #bdd4e0;

    background:#fff;

    color:#547080;

    border-radius:10px;

    padding:10px 13px;

    cursor:pointer;

    font-size:11px;

    font-weight:750;

    white-space:nowrap;

    transition:.15s;
}

.detail-tab.active{
    background:#0f84df;

    color:#fff;

    border-color:#2498ec;

    box-shadow:
        0 5px 13px
        rgba(8,127,224,.15);
}

.section{
    scroll-margin-top:145px;
}

.detail-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:16px;
}

.full{
    grid-column:1/-1;
}

/* =========================================================
   FORM
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;
}

.field{
    display:flex;

    flex-direction:column;

    gap:6px;
}

.field label{
    font-size:11px;

    color:#647d8c;

    font-weight:700;
}

.field input,
.field textarea,
.field select{
    width:100%;

    background:#f8fbfd;

    color:var(--text);

    border:1px solid #c8dce7;

    border-radius:9px;

    padding:11px 12px;

    outline:none;
}

.field textarea{
    min-height:100px;

    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#53a9e5;

    box-shadow:
        0 0 0 3px
        rgba(22,136,237,.08);
}

.field input:disabled,
.field textarea:disabled,
.field select:disabled{
    opacity:.72;

    background:#f3f6f8;
}

/* =========================================================
   SSR
========================================================= */

.ssr-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:13px;
}

.ssr-card{
    border:1px solid #cbdde7;

    background:
        linear-gradient(
            145deg,
            #f8fbfd,
            #eef6fa
        );

    border-radius:12px;

    padding:17px;
}

.ssr-card-title{
    font-size:11px;

    color:#617b8b;

    font-weight:750;
}

.ssr-card-value{
    font-size:25px;

    color:#087bd2;

    font-weight:900;

    margin-top:7px;
}

/* =========================================================
   MOTOR LIST
========================================================= */

.motor-toolbar{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    margin-bottom:15px;

    flex-wrap:wrap;
}

.motor-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;
}

.motor-card{
    border:1px solid #cbdde7;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #f9fcfd,
            #eef5f8
        );

    padding:16px;

    transition:.15s;
}

.motor-card:hover{
    border-color:#78b8dc;
}

.motor-card-header{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.motor-card-title{
    font-size:17px;

    font-weight:850;

    color:#1e4359;
}

.motor-card-sub{
    font-size:10px;

    color:#7c909c;

    margin-top:4px;
}

.motor-status{
    padding:5px 8px;

    border-radius:7px;

    font-size:9px;

    font-weight:800;

    background:#eef8ff;

    color:#087bd2;

    border:1px solid #c9e3f3;
}

.motor-type-selector{
    display:flex;

    gap:6px;

    flex-wrap:wrap;

    margin-bottom:13px;
}

.motor-type{
    border:1px solid #c8dae4;

    background:#fff;

    color:#59717f;

    padding:7px 9px;

    border-radius:8px;

    cursor:pointer;

    font-size:10px;

    font-weight:700;
}

.motor-type.active{
    background:#1285df;

    color:#fff;

    border-color:#2597ea;
}

.motor-actions{
    display:flex;

    gap:7px;

    flex-wrap:wrap;

    margin-top:13px;

    padding-top:12px;

    border-top:1px solid #d6e2e8;
}

/* =========================================================
   MOTOR DETAIL
========================================================= */

.motor-detail-head{
    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:10px;

    margin-bottom:14px;

    flex-wrap:wrap;
}

.motor-detail-title{
    font-size:22px;

    font-weight:900;
}

.motor-detail-sub{
    font-size:11px;

    color:var(--muted);

    margin-top:4px;
}

.motor-detail-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;
}

/* =========================================================
   RUNNING VALUES
========================================================= */

.value-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}

.value{
    border:1px solid #d1e1e8;

    background:#f7fafc;

    border-radius:10px;

    padding:13px;
}

.value-label{
    font-size:10px;

    color:#718796;
}

.value-number{
    font-size:18px;

    font-weight:850;

    margin-top:6px;
}

.value input,
.value textarea{
    width:100%;

    margin-top:7px;

    background:#fff;

    border:1px solid #c8dce7;

    border-radius:8px;

    padding:9px;

    color:#183345;
}

/* =========================================================
   NAMEPLATE
========================================================= */

.nameplate{
    background:
        linear-gradient(
            145deg,
            #f0f3f4,
            #d7dee2
        );

    color:#253137;

    border:5px solid #77838a;

    border-radius:9px;

    padding:17px;

    box-shadow:
        inset 0 0 0 1px #fff;
}

.nameplate-header{
    text-align:center;

    border-bottom:2px solid #465158;

    padding-bottom:11px;

    margin-bottom:12px;
}

.nameplate-brand{
    font-size:21px;

    font-weight:900;
}

.nameplate-type{
    font-size:11px;

    font-weight:800;

    margin-top:3px;
}

.nameplate-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    border-top:1px solid #69757b;

    border-left:1px solid #69757b;
}

.np-field{
    padding:8px;

    border-right:1px solid #69757b;

    border-bottom:1px solid #69757b;
}

.np-label{
    font-size:8px;

    color:#59676e;

    font-weight:750;
}

.np-value{
    font-size:12px;

    font-weight:850;

    margin-top:3px;
}

.np-field input{
    width:100%;

    margin-top:4px;

    padding:7px;

    border:1px solid #89959b;

    background:#fff;

    color:#18252c;

    border-radius:4px;

    font-size:12px;
}

/* =========================================================
   CABLE
========================================================= */

.cable-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.cable{
    border:1px solid #d1e1e8;

    background:#f8fbfd;

    border-radius:11px;

    padding:14px;
}

.wire{
    height:13px;

    border-radius:20px;

    margin-bottom:10px;

    border:1px solid rgba(0,0,0,.18);
}

.wire-red{
    background:#d92828;
}

.wire-yellow{
    background:#e8c52e;
}

.wire-black{
    background:#111;
}

.wire-green{
    background:#198744;
}

.wire-blue{
    background:#267bd4;
}

.wire-label{
    font-size:10px;

    color:#6c8190;

    margin-bottom:7px;
}

.cable input{
    width:100%;

    padding:9px;

    border:1px solid #c8dce7;

    border-radius:8px;

    background:#fff;
}

/* =========================================================
   HMI
========================================================= */

.hmi-tabs{
    display:flex;

    gap:7px;

    overflow:auto;

    margin-bottom:13px;
}

.hmi-tab{
    flex:0 0 auto;

    padding:10px 14px;

    border:1px solid #bdd4e0;

    border-radius:8px;

    background:#f4f9fc;

    color:#5d7787;

    cursor:pointer;

    font-size:11px;
}

.hmi-tab.active{
    background:#1285df;

    color:#fff;

    border-color:#2a9af0;
}

.hmi-screen{
    border:2px solid #344d5c;

    background:#111b22;

    border-radius:12px;

    padding:18px;
}

.hmi-title{
    text-align:center;

    color:#e8eef2;

    font-weight:850;

    padding-bottom:13px;

    border-bottom:1px solid #36444d;

    margin-bottom:15px;
}

.hmi-fields{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:11px;
}

.hmi-field{
    display:flex;

    align-items:center;

    gap:7px;
}

.hmi-field label{
    flex:1;

    color:#d9e2e7;

    font-size:10px;
}

.hmi-field input{
    width:105px;

    padding:8px;

    border-radius:4px;

    border:1px solid #6a7881;

    background:#eef3f6;

    color:#15232d;

    font-size:13px;
}

.hmi-foot{
    display:flex;

    justify-content:space-between;

    margin-top:16px;

    padding-top:11px;

    border-top:1px solid #36444d;

    color:#aebcc4;

    font-size:9px;
}

/* =========================================================
   SETTINGS
========================================================= */

.settings-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:14px;
}

.setting-group{
    border:1px solid #d3e1e8;

    border-radius:12px;

    padding:16px;

    background:#f8fbfd;
}

.setting-group h3{
    font-size:13px;

    margin:0 0 12px;
}

.choice-row{
    display:flex;

    flex-wrap:wrap;

    gap:8px;
}

.choice{
    border:1px solid #c6dbe6;

    background:#fff;

    border-radius:9px;

    padding:9px 12px;

    color:#567181;

    cursor:pointer;

    font-size:11px;
}

.choice.active{
    background:#1285df;

    color:#fff;

    border-color:#2799ed;
}

/* =========================================================
   LOCK
========================================================= */

.lock-box{
    text-align:center;

    padding:40px 20px;
}

.lock-icon{
    width:62px;

    height:62px;

    margin:auto auto 14px;

    border:2px solid #2493e8;

    border-radius:50%;

    display:grid;

    place-items:center;

    font-size:25px;
}

.password-row{
    max-width:420px;

    margin:auto;

    display:flex;

    gap:8px;
}

.password-row input{
    flex:1;

    padding:11px;

    border:1px solid #c8dce7;

    border-radius:9px;

    text-align:center;

    letter-spacing:4px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    text-align:center;

    padding:45px 20px;

    color:#718796;
}

.empty h3{
    color:#365467;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    right:18px;

/* =========================================================
   MOTOR DÖNÜŞÜMÜ
   Eski sistemde tek motor vardı.
   Onu Motor 1 olarak içeri al.
========================================================= */

function migrateStation(s){

    if(!s || typeof s!=="object")
        return s;


    /* -----------------------------------------------------
       motors yoksa eski motor alanını Motor 1 yap
    ----------------------------------------------------- */

    if(!Array.isArray(s.motors)){

        let motor =
            s.motor ||
            null;

        const m =
            createDefaultMotor(1);

        if(motor){

            m.plate =
                {...motor};

        }

        m.role =
            "Asıl";

        s.motors=[m];

    }


    if(!Array.isArray(s.motors))
        s.motors=[];


    s.motors.forEach(
        (m,i)=>{

            if(!m.id)
                m.id =
                    Date.now()+
                    Math.random()+
                    i;

            if(!m.name)
                m.name =
                    "Motor "+(i+1);

            if(!m.type)
                m.type =
                    "belirsiz";

            if(!m.role)
                m.role =
                    "Asıl";

            m.running ??={};

            m.plate ??={};

            m.cable ??={

                l1:"",
                l2:"",
                l3:"",
                pe:"",
                note:""

            };

            m.notes ??="";

        }
    );


    delete s.motor;


    if(!s.ssr)
        s.ssr={
            level:"",
            low:"",
            high:""
        };


    if(!Array.isArray(s.hmi))
        s.hmi=
            HMI_PAGES.map(
                ()=>({})
            );


    if(!s.pump)
        s.pump={};


    return s;

}

/* =========================================================

========================================================= */

function savePreferences(){

    localStorage.setItem(

        PREF_KEY,

        JSON.stringify(
            state.settings
        )

    );

    applyPreferences();

}


function applyPreferences(){

    document.body.classList.toggle(

        "theme-dark",

        state.settings.theme==="dark"

    );


    document.body.classList.toggle(

        "compact",

        state.settings.density==="compact"

    );

}


/* =========================================================
   YARDIMCI
========================================================= */

function esc(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function toast(message){

    const t=
        document.getElementById(
            "toast"
        );

    if(!t)
        return;


    t.textContent=message;

    t.classList.add("show");


    setTimeout(
        ()=>{
            t.classList.remove(
                "show"
            );
        },
        2200
    );

}


function currentStation(){

    return state.stations.find(

        s=>
            String(s.id)===String(
                state.selectedStation
            )

    );

}


function currentMotor(){

    const s=
        currentStation();

    if(!s)
        return null;


    return s.motors.find(

        m=>
            String(m.id)===String(
                state.selectedMotor
            )

    );

}


function motorTypeLabel(type){

    const item=
        MOTOR_TYPES.find(
            x=>x.id===type
        );

    return item
        ?
        item.label
        :
        "Belirtilmemiş";

}

function updateMode(){

    if(state.editMode){

    const root=
        document.getElementById(

    if(!root)
        return;


    if(state.page==="home")
        root.innerHTML=
            homeHTML();


    else if(state.page==="stations")
        root.innerHTML=
            stationsHTML();


    else if(state.page==="detail")
        root.innerHTML=
            detailHTML();


    else if(state.page==="motorDetail")
        root.innerHTML=
            motorDetailHTML();


    else if(state.page==="references")
        root.innerHTML=
            referencesHTML();


    else if(state.page==="settings")
        root.innerHTML=
            settingsHTML();

}

/* =========================================================
   FIELD
========================================================= */

function fieldHTML(
    label,
    key,
    type,
    obj,
    prefix
){

    const value=
        obj?.[key] ??
        "";


    const disabled=
        state.editMode
        ?
        ""
        :
        "disabled";


    if(type==="textarea"){

        return `

        <div
            class="field"
            style="
                grid-column:1/-1
            ">

            <label>
                ${esc(label)}
            </label>


            <textarea
                ${disabled}
                onchange="
                    updateObject(
                        '${prefix}',
                        '${key}',
                        this.value
                    )
                ">${esc(value)}</textarea>

        </div>

        `;

    }


    let htmlType=
        "text";


    if(
        type==="integer" ||
        type==="decimal"
    )
        htmlType=
            "number";


    if(type==="date")
        htmlType=
            "date";


    if(type==="time")
        htmlType=
            "time";


    return `

    <div class="field">

        <label>
            ${esc(label)}
        </label>


        <input

            type="${htmlType}"

            ${
                type==="decimal"
                ?
                'step="any" inputmode="decimal"'
                :
                type==="integer"
                ?
                'step="1" inputmode="numeric"'
                :
                ""
            }

            value="${esc(value)}"

            ${disabled}

            onchange="
                updateObject(
                    '${prefix}',
                    '${key}',
                    this.value
                )
            "

        >

    </div>

    `;

}


/* =========================================================
   OBJECT UPDATE
========================================================= */

function updateObject(
    prefix,
    key,
    value
){

    const s=
        currentStation();


    if(!s)
        return;


    if(prefix==="station"){

        s[key]=value;

    }else{

        if(!s[prefix])
            s[prefix]={};

        s[prefix][key]=value;

    }


    saveData();


    /* Motor sayısı metadatası değişirse düzenle */

    if(
        prefix==="station" &&
        key==="pumpCount"
    ){

        s.pumpCount=
            Math.max(
                0,
                Number(value)||0
            );

    }


    if(
        prefix==="station" &&
        key==="driveCount"
    ){

        s.driveCount=
            Math.max(
                0,
                Number(value)||0
            );

    }

}

/* =========================================================
   MOTOR EKLE
========================================================= */

function addMotor(){

    if(!state.editMode){

        openAccess();

        return;

    }


    const s=
        currentStation();


    if(!s)
        return;


    migrateStation(s);


    const newMotor=
        createDefaultMotor(
            s.motors.length+1
        );


    /* Yedek için otomatik öneri */

    if(
        s.motors.length>0 &&
        s.motors.some(
            m=>m.role==="Asıl"
        )
    ){

        const first=
            s.motors.find(
                m=>m.role==="Asıl"
            );


        if(
            s.motors.length===1
        ){

            newMotor.type=
                first.type;

            newMotor.role=
                "Yedek";

            newMotor.plate=
                JSON.parse(
                    JSON.stringify(
                        first.plate||{}
                    )
                );

        }

    }


    s.motors.push(
        newMotor
    );


    saveData();

    render();


    toast(
        newMotor.role==="Yedek"
        ?
        "Yedek motor hazırlandı."
        :
        "Yeni motor eklendi."
    );

}


/* =========================================================
   MOTOR SİL
========================================================= */

function deleteMotor(
    id
){

    if(!state.editMode)
        return;


    const s=
        currentStation();


    if(!s)
        return;


    if(s.motors.length<=1){

        if(
            !confirm(
                "Bu terfinin son motorunu da silmek istiyor musun?"
            )
        )
            return;

    }


    const motor=
        s.motors.find(
            m=>
                String(m.id)===
                String(id)
        );


    if(!motor)
        return;


    if(
        !confirm(
            `"${motor.name}" silinsin mi?`
        )
    )
        return;


    s.motors=
        s.motors.filter(
            m=>
                String(m.id)!==
                String(id)
        );


    s.motors.forEach(
        (m,i)=>{
            if(
                /^Motor \d+$/.test(
                    m.name||""
                )
            ){
                m.name=
                    "Motor "+(i+1);
            }
        }
    );


    state.selectedMotor=null;


    saveData();

    render();


    toast(
        "Motor silindi."
    );

}

    if(!s)
        return;


    s.hmi ??=
        HMI_PAGES.map(
            ()=>({})
        );


    s.hmi[page] ??={};


    s.hmi[page][key]=
        String(value)
        .replace(",", ".");


    saveData();

}

/* =========================================================

========================================================= */

function choice(
    key,
    value,
    label
){

    return `

<button

    class="
        choice
        ${
            state.settings[key]===
            value
            ?
            "active"
            :
            ""
        }
    "

    onclick="
        setPreference(
            '${key}',
            '${value}'
        )
    "

>

    ${label}

</button>

`;

}


function setPreference(
    key,
    value
){

    state.settings[key]=
        value;


    savePreferences();

    render();


    toast(
        "Görünüm ayarı kaydedildi."
    );

}


function resetPreferences(){

    state.settings={

        theme:"light",

        density:"normal"

    };


    savePreferences();

    render();


    toast(
        "Varsayılan görünüm geri yüklendi."
    );

}

function openAccess(){

    document.getElementById(
        "appContent"
    ).innerHTML=`

<section class="card">

    <div class="lock-box">

        <div class="lock-icon">

            🔒

        </div>


        <h2>
            Düzenleme Yetkisi

        </p>

                        checkPassword()

            >


            <button

                ">

            </button>

</section>

`;

}


function checkPassword(){

    const input=
        document.getElementById(
            "passwordInput"
        );


    if(
        input &&
        input.value===
        EDIT_PASSWORD
    ){

        state.editMode=
            true;


        render();


        toast(
            "Düzenleme modu açıldı."
        );

    }else{

        toast(
            "Şifre hatalı."
        );

    }

}


function visitorContinue(){

    state.editMode=
        false;


    render();


    toast(
        "Ziyaretçi modu aktif."
    );

}


function lockEditing(){

    state.editMode=
        false;


    render();


    toast(
        "Düzenleme modu kapatıldı."
    );

}


/* =========================================================
   NEW STATION
========================================================= */

function newStation(){

    if(!state.editMode){

        openAccess();

        return;

    }


    const s=
        createDefaultStation();


    const numbers=
        state.stations.map(

            x=>

                parseInt(

                    String(
                        x.code
                    )
                    .replace(
                        /\D/g,
                        ""
                    )

                ) || 0

        );


    const next=
        Math.max(
            0,
            ...numbers
        )+1;


    s.code=
        "T"+
        String(next)
        .padStart(
            3,
            "0"
        );


    s.name=
        "Yeni Terfi";


    state.stations.push(
        s
    );


    saveData();


    state.selectedStation=
        s.id;


    state.page=
        "detail";


    state.detailTab=
        "station";


    document.getElementById(
        "pageTitle"
    ).textContent=
        "Terfi Teknik Arşivi";


    setActiveNav(
        "navStations"
    );


    render();


    toast(
        "Yeni terfi oluşturuldu. Motor 1 hazır."
    );

}


/* =========================================================
   DELETE STATION
========================================================= */

function deleteStation(){

    if(!state.editMode)
        return;


    const s=
        currentStation();


    if(!s)
        return;


    if(
        !confirm(
            `"${s.code} - ${s.name}" kaydı silinsin mi?`
        )
    )
        return;


    state.stations=
        state.stations.filter(

            x=>
                String(x.id)!==
                String(s.id)

        );


    saveData();


    showStations();


    toast(
        "Terfi kaydı silindi."
    );

}
