function esc(v){

 return String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#39;");

}


function val(id){

 const e=
  document.getElementById(id);

 return e?e.value:'';

}


function num(v){

 if(
  v===null||
  v===undefined||
  v===''
 )
  return null;

 const n=
  Number(
   String(v).replace(',','.')
  );

 return Number.isFinite(n)
  ?n
  :null;

}

function toast(message){

  document.getElementById(
   'toast'
  );

 if(!t)
  return;

 t.textContent=message;

 t.classList.add(
  'show'
 );

 clearTimeout(t._timer);

  setTimeout(
   ()=>{
    t.classList.remove(
     'show'
    );
   },
   2600

}

========================================================= */

function getSession(){

 try{

  return JSON.parse(
   sessionStorage.getItem(
    ADMIN_SESSION_KEY
   )
  );

 }catch(e){

  return null;

 }

}


function setSession(){

 sessionStorage.setItem(
  ADMIN_SESSION_KEY,
  JSON.stringify({
   lastActivity:
    Date.now()
  })
 );

 armAdminTimeout();

}


function touchAdminSession(){

 if(!edit)
  return;

 setSession();

}


function clearAdminSession(){

 edit=false;

 clearTimeout(
  adminTimer
 );

 adminTimer=null;

 sessionStorage.removeItem(
  ADMIN_SESSION_KEY
 );

}


function restoreAdminSession(){

 const s=getSession();

 if(!s)
  return false;

 const age=
  Date.now()-
  Number(
   s.lastActivity||0
  );

 if(age>=ADMIN_IDLE_MS){

  clearAdminSession();

  return false;

 }

 edit=true;

 armAdminTimeout();

 return true;

}


function armAdminTimeout(){

 clearTimeout(
  adminTimer
 );

 if(!edit)
  return;

 const s=getSession();

 if(!s){

  edit=false;

  return;

 }

 const remaining=
  ADMIN_IDLE_MS-
  (
   Date.now()-
   Number(
    s.lastActivity||0
   )
  );

 if(remaining<=0){

  lockAdminForTimeout();

  return;

 }

 adminTimer=
  setTimeout(
   checkAdminTimeout,
   Math.min(
    remaining,
    15000
   )
  );

}


function checkAdminTimeout(){

 if(!edit)
  return;

 const s=getSession();

 if(!s){

  lockAdminForTimeout();

  return;

 }

 if(
  Date.now()-
  Number(
   s.lastActivity||0
  )>=ADMIN_IDLE_MS
 ){

  lockAdminForTimeout();

 }else{

  armAdminTimeout();

 }

}


function lockAdminForTimeout(){

 clearAdminSession();

 toast(
  'Yönetici oturumu zaman aşımı nedeniyle kilitlendi.'
 );

 if(current)
  render();
 else
  home();

}

async function countTable(
 table,
 ids
){

 if(!ids.length)
  return 0;

 const r=
  await db
   .from(table)
   .select(
    'id,terfi_id'
   )
   .in(
    'terfi_id',
    ids
   );

 if(r.error)
  return 0;

 return (
  r.data||[]
 ).length;

}

function filterStations(){

 const q=
  (
   val('search')||
   ''
  )
  .toLowerCase();

 document
  .querySelectorAll(
   '#stations .station'
  )
  .forEach(
   x=>{
    x.style.display=
     x.dataset.search
      .includes(q)
      ?
      ''
      :
      'none';
   }
  );

}

async function openStation(
 id
){

 if(isSeedId(id)){

  const s=
   makeSeedStations()
    .find(
     x=>x.id===id
    );

  if(!s)
   return;

  const c=
   getSeedChildren(
    id,
    s
   );

  current={

   s,

   m:c.m||[],

   p:c.p||[],

   d:c.d||[],

   h:c.h||[],

   w:c.w||[],

   tp:[],

   detail:
    getTerfiDetail(id),

   location:
    getLocation(id),

   ssr:
    localJSON(
     LOCAL_SSR_KEY,
     {}
    )[id]||
    {
     level:'',
     low:'',
     high:'',
     note:''
    }

  };

  tab='terfi';

  hmiPage=1;

  workMotor=
   current.m[0]?.id||
   null;

  selectedMotorId=
   current.m[0]?.id||

  render();

  return;

 }


 const [
  s,
  m,
  p,

  h,
  w,
  tp
 ]=
  await Promise.all([

   db
    .from('terfiler')
    .select('*')

     'id',

    .single(),

   db
    .from('motorlar')
    .select('*')

    .order(
     'created_at',
     {ascending:true}

   db
    .from('suruculer')

    .eq(
     'terfi_id',
     id

    .order(
     'created_at',
     {ascending:true}

   db

    .select('*')

    .select('*')
    .eq(
     'terfi_id',

     'captured_at',

   db

    .eq(
     'terfi_id',

    )
    .order(
     'sira',
     {ascending:true}

  ]);

 if(s.error){

  alert(
   s.error.message

  return;

 }

 current={

  s:s.data,

  m:m.data||[],

  p:p.data||[],

  d:d.data||[],

  h:h.data||[],

  w:w.data||[],

  tp:tp.data||[],

  detail:
   getTerfiDetail(id),

  location:
   getLocation(id),

  ssr:{
   level:'',
   low:'',
   high:'',
   note:''

 };

 const ssrMap=

  );

 current.ssr=

 tab='terfi';

 hmiPage=1;

 workMotor=

 selectedMotorId=

 if(edit)

 recordHistory(

 );

 render();

}

function requestLocation(){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(
  !navigator.geolocation
 ){

  toast(
   'Bu cihaz konum özelliğini desteklemiyor.'
  );

  return;

 }

 navigator.geolocation.getCurrentPosition(

  pos=>{

   const l={

    lat:
     pos.coords.latitude,

    lng:
     pos.coords.longitude,

    accuracy:
     pos.coords.accuracy,

    date:now()

   };

   terfiLocations[
    current.s.id
   ]=l;

   saveLocal(
    LOCAL_LOCATION_KEY,
    terfiLocations
   );

   current.location=l;

   recordHistory(
    'TERFİ KONUMU KAYDEDİLDİ',
    `${l.lat}, ${l.lng}`
   );

   render();

   toast(
    'Konum kaydedildi.'
   );

  },

  err=>{

   toast(
    err.code===1
    ?
    'Konum izni verilmedi.'
    :
    err.code===2
    ?
    'Konum alınamadı.'
    :
    'Konum alma zaman aşımına uğradı.'
   );

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }

 );

}


function openGoogleMaps(){

 const l=
  current.location||
  getLocation(
   current.s.id
  );

 if(!l)
  return;

 window.open(
  'https://www.google.com/maps/search/?api=1&query='+
  encodeURIComponent(
   `${l.lat},${l.lng}`
  ),
  '_blank'
 );

}


function openAppleMaps(){

 const l=
  current.location||
  getLocation(
   current.s.id
  );

 if(!l)
  return;

 window.open(
  'https://maps.apple.com/?ll='+
  encodeURIComponent(
   `${l.lat},${l.lng}`
  )+
  '&q='+
  encodeURIComponent(
   current.s.ad||
   'MESKİ Terfi'
  ),
  '_blank'
 );

}


function deleteLocation(){

 recordHistory(

  });

  saveSeedChildren(
   current.s.id,
   {
    m:current.m,
    p:current.p,
    d:current.d,
    h:current.h,
    w:current.w
   }
  );

  render();

  return;

 }

 const r=
  await db
   .from('motorlar')
   .insert({

    terfi_id:

 recordHistory(

 );

 );

async function deleteMotor(
 id
){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(
  !confirm(
   'Bu motor ve bağlı sürücü ilişkisi silinsin mi?'
  )
 )
  return;

 if(
  isSeedId(
   current.s.id
  )
 ){

  const d=
   current.d.find(
    x=>x.motor_id===id
   );

  if(d)
   d.motor_id=null;

  current.m=
   current.m.filter(
    x=>x.id!==id
   );

  delete localBoxes[id];

  saveLocal(
   LOCAL_BOX_KEY,
   localBoxes
  );

  saveSeedChildren(
   current.s.id,
   {
    m:current.m,
    p:current.p,
    d:current.d,
    h:current.h,
    w:current.w
   }
  );

  render();

  return;

 }

 const d=
  current.d.find(
   x=>x.motor_id===id
  );

 if(d){

  const ur=
   await db
    .from('suruculer')
    .update({
     motor_id:null
    })
    .eq(
     'id',
     d.id
    );

  if(ur.error){

   alert(
    ur.error.message
   );

   return;

  }

 }

 const r=
  await db
   .from('motorlar')
   .delete()
   .eq(
    'id',
    id
   );

 if(r.error){

  alert(
   r.error.message
  );

  return;

 }

 delete localBoxes[id];

 saveLocal(
  LOCAL_BOX_KEY,
  localBoxes
 );

 recordHistory(
  'MOTOR SİLİNDİ',
  id
 );

 await openStation(
  current.s.id
 );

}

function blankTerm(){

function defaultBox(){

  motor:{

   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()

  },

  box_motor:{

   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()

  },

  box_surucu:{

   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()

  },

  surucu:{

   u:blankTerm(),
   v:blankTerm(),
   w:blankTerm()

  }

 };

}


function normalizeBox(
 b
){

 const d=
  defaultBox();

 return {

  motor:{

   u:{
    ...d.motor.u,
    ...(b?.motor?.u||{})
   },

   v:{
    ...d.motor.v,
    ...(b?.motor?.v||{})
   },

   w:{
    ...d.motor.w,
    ...(b?.motor?.w||{})
   }

  },

  box_motor:{

   u:{
    ...d.box_motor.u,
    ...(b?.box_motor?.u||{})
   },

   v:{
    ...d.box_motor.v,
    ...(b?.box_motor?.v||{})
   },

   w:{
    ...d.box_motor.w,
    ...(b?.box_motor?.w||{})
   }

  },

  box_surucu:{

   u:{
    ...d.box_surucu.u,
    ...(b?.box_surucu?.u||{})
   },

   v:{
    ...d.box_surucu.v,
    ...(b?.box_surucu?.v||{})
   },

   w:{
    ...d.box_surucu.w,
    ...(b?.box_surucu?.w||{})
   }

  },

  surucu:{

   u:{
    ...d.surucu.u,
    ...(b?.surucu?.u||{})
   },

   v:{
    ...d.surucu.v,
    ...(b?.surucu?.v||{})
   },

   w:{
    ...d.surucu.w,
    ...(b?.surucu?.w||{})
   }

  }

 };

}

function params(){

 const map=
  new Map();

 DEFAULT_PARAMS.forEach(
  p=>
   map.set(
    p.code,
    {
     ...p
    }
   )
 );

 customParams.forEach(
  p=>
   map.set(
    p.code,
    {
     ...p
    }
   )
 );

 Object
  .entries(paramEdits)
  .forEach(
   ([code,p])=>
    map.set(
     code,
     {
      ...map.get(code),
      ...p
     }
    )
  );

 paramDeleted.forEach(
  code=>
   map.delete(code)
 );

 return [
  ...map.values()
 ];

}

 const original=

 if(!code){

 const duplicate=

 const data={

 };

 if(isEdit){

  delete paramEdits[
   original
  ];

  paramEdits[code]=
   data;

  paramDeleted=
   paramDeleted.filter(
    x=>x!==code
   );

  customParams.push(
   data
  );

  paramDeleted=
   paramDeleted.filter(
    x=>x!==code
   );

 }

 saveLocal(
  LOCAL_PARAM_KEY,
  customParams
 );

 saveLocal(
  LOCAL_PARAM_EDIT_KEY,
  paramEdits
 );

 saveLocal(
  LOCAL_PARAM_DELETE_KEY,

 recordHistory(

function faults(){

 const map=
  new Map();

 DEFAULT_FAULTS.forEach(
  f=>
   map.set(
    f.code,
    {
     ...f
    }
   )
 );

 customFaults.forEach(
  f=>
   map.set(
    f.code,
    {
     ...f
    }
   )
 );

 Object
  .entries(faultEdits)
  .forEach(
   ([code,f])=>
    map.set(
     code,
     {
      ...map.get(code),
      ...f
     }
    )
  );

 faultDeleted.forEach(
  code=>
   map.delete(code)
 );

 return [
  ...map.values()
 ];

}

function recordHistory(
 action,
 detail
){

 if(!current)
  return;

 changeHistory.push({

  terfi_id:
   current.s.id,

  action,

  detail,

  date:
   now()

  changeHistory.slice(
   -1000

 saveLocal(
  LOCAL_HISTORY_KEY,
  changeHistory
 );

function addPhotos(
 event
){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 const files=[
  ...(event.target.files||[])
 ];

 if(!files.length)
  return;

 let pending=
  files.length;

 files.forEach(
  file=>{

   const reader=
    new FileReader();

   reader.onload=
    ()=>{

     localPhotos[
      current.s.id
     ]||=[];

     localPhotos[
      current.s.id
     ].push({

      name:file.name,
      type:file.type,
      data:reader.result,
      date:now()

     });

     pending--;

     if(
      pending===0
     ){

      saveLocal(
       LOCAL_PHOTO_KEY,
       localPhotos
      );

      recordHistory(
       'FOTOĞRAF EKLENDİ',
       `${files.length} fotoğraf`
      );

      render();

     }

    };

   reader.readAsDataURL(
    file
   );

  }
 );

}


function deletePhoto(
 index
){

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(
  !confirm(
   'Fotoğraf silinsin mi?'
  )
 )
  return;

 localPhotos[
  current.s.id
 ].splice(
  index,
  1
 );

 saveLocal(
  LOCAL_PHOTO_KEY,
  localPhotos
 );

 recordHistory(
  'FOTOĞRAF SİLİNDİ',
  ''
 );

 render();

}

function openModal(
 html
){

 closeModal();

 const wrap=
  document.createElement(
   'div'
  );

 wrap.className=
  'modal-backdrop';

 wrap.id=
  'modalRoot';

 wrap.innerHTML=`

  <div
   class="modal"
   onclick="event.stopPropagation()">

   <div class="modal-head">

    <h2>
     ${getModalTitle(html)}
    </h2>

    <button
     class="modal-close"
     type="button"
     aria-label="Kapat"
     onclick="closeModal()">

     ✕

    </button>

   </div>

   <div id="modalContent">

    ${removeFirstH2(html)}

   </div>

  </div>

 `;

 document.body.appendChild(
  wrap
 );

 wrap.addEventListener(
  'click',
  function(e){

   if(
    e.target===wrap
   ){

    closeModal();

   }

  }
 );

}


function getModalTitle(
 html
){

 try{

  const holder=
   document.createElement(
    'div'
   );

  holder.innerHTML=
   html;

  const h2=
   holder.querySelector(
    'h2'
   );

  return h2
   ?
   h2.textContent.trim()
   :
   '';

 }catch(e){

  return '';

 }

}


function removeFirstH2(
 html
){

 try{

  const holder=
   document.createElement(
    'div'
   );

  holder.innerHTML=
   html;

  const h2=
   holder.querySelector(
    'h2'
   );

  if(h2)
   h2.remove();

  return holder.innerHTML;

 }catch(e){

  return html;

 }

}


function closeModal(){

 document
  .getElementById(
   'modalRoot'
  )
  ?.remove();

}

 }

 if(!edit){

  requestAdmin();

  return;

 }

 touchAdminSession();

 if(
  isSeedId(
   current.s.id
  )
 ){

  saveSeedCurrent();

  return;

 }

 try{

  if(tab==='terfi'){

   const kod=
    val('s_kod')
    .trim();

   if(kod){

    const duplicate=
     await db
      .from('terfiler')
      .select('id')
      .eq(
       'kod',
       kod
      )
      .neq(
       'id',
       current.s.id
      )
      .limit(1);

    if(
     duplicate.data?.length
    ){

     toast(
      'Bu kod başka bir terfide kullanılıyor.'
     );

     return;

    }

   }

   const r=
    await db
     .from('terfiler')
     .update({

      ad:
       val('s_ad'),

      terfi_no:
       val('s_no'),

       kod||null,

      bolge:
       val('s_bolge'),

      adres:
       val('s_adres'),

      aciklama:
       val('s_aciklama'),

      updated_at:
       new Date().toISOString()

     })
     .eq(
      'id',
      current.s.id
     );

   if(r.error)
    throw r.error;

   const detail={

    pompa_tipi:
     val(
      's_pompa_tipi'
     ),

    calisma_sekli:
     val(

     val(

     ),

     val(

     )

   };

   saveTerfiDetail(
    current.s.id,

   );

   current.detail=

  if(tab==='ssr'){

     val('ssr_note')

   const map=

     LOCAL_SSR_KEY,
     {}
    );

   map[

   ]=
    current.ssr;

   saveLocal(

  if(tab==='motor'){

         )
        ),

       m.id

  if(tab==='pompa'){

function exportCSV(){

 if(!current)
  return;

 const rows=[];

 rows.push([
  'TERFİ',
  current.s.ad||''
 ]);

 current.m.forEach(
  (m,i)=>
   rows.push([
    'MOTOR',
    i+1,
    m.ad||'',
    m.marka||'',
    m.model||'',
    m.guc_kw??'',
    m.nominal_akim_a??'',
    m.gerilim_v??'',
    m.frekans_hz??'',
    m.devir_rpm??'',
    m.cos_phi??'',
    m.montaj_tarihi??'',
    m.degisim_tarihi??''
   ])
 );

 current.p.forEach(
  (p,i)=>
   rows.push([
    'POMPA',
    i+1,
    p.ad||'',
    p.marka||'',
    p.model||'',
    p.tip||'',
    p.seri_no||'',
    p.guc_kw??'',
    p.guc_hp??'',
    p.q_min_m3h??'',
    p.q_max_m3h??'',
    p.h_min_m??'',
    p.h_max_m??''
   ])
 );

 current.d.forEach(
  (d,i)=>
   rows.push([
    'SÜRÜCÜ',
    i+1,
    d.ad||'',
    d.marka||'',
    d.model||'',
    d.seri_no||'',
    d.guc_kw??'',
    d.besleme_v??''
   ])
 );

 const csv=
  rows
   .map(
    r=>
     r
      .map(
       v=>
        `"${String(
         v??''
        ).replace(
         /"/g,
         '""'
        )}"`
      )
      .join(';')
   )
   .join('\n');

 const blob=
  new Blob(
   [csv],
   {
    type:
     'text/csv;charset=utf-8'
   }
  );

 const a=
  document.createElement(
   'a'
  );

 a.href=
  URL.createObjectURL(
   blob
  );

 a.download=
  (
   current.s.ad||
   'terfi'
  )+
  '.csv';

 a.click();

 URL.revokeObjectURL(
  a.href
 );

}
