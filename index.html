<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terfi Arşivim | Merkezi Saha Arşivi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07111f;
 color:#f4f8fc;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.wrap{
 max-width:1200px;
 margin:auto;
 padding:18px
}

.top{
 position:sticky;
 top:0;
 z-index:5;
 background:#07111fee;
 backdrop-filter:blur(16px);
 border-bottom:1px solid #23415d;
 padding:12px 18px;
 display:flex;
 justify-content:space-between;
 gap:12px
}

.brand{
 display:flex;
 gap:10px;
 align-items:center
}

.logo{
 width:46px;
 height:46px;
 border-radius:15px;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,#2997ff,#43d8d0);
 font-size:25px
}

.brand b{font-size:20px}
.brand small{
 display:block;
 color:#9eb1c5
}

.btn{
 border:1px solid #23415d;
 background:#11283e;
 color:white;
 border-radius:12px;
 padding:10px 14px
}

.primary{
 background:#2997ff;
 border-color:#2997ff;
 font-weight:800
}

.danger{
 background:#67242d
}

.hero,.card{
 border:1px solid #23415d;
 border-radius:20px;
 background:linear-gradient(145deg,#0d2033,#091827);
 padding:18px;
 margin-bottom:13px
}

.hero{
 background:
 radial-gradient(circle at 85% 0,#16476b,transparent 45%),
 linear-gradient(145deg,#0d2033,#091827)
}

h1{
 font-size:30px;
 margin:0 0 7px
}

h2,h3{margin-top:0}

.muted{color:#9eb1c5}

.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.search,
.field input,
.field textarea,
.field select{
 width:100%;
 padding:12px;
 border:1px solid #23415d;
 background:#091a2b;
 color:white;
 border-radius:12px;
 outline:0
}

.search{margin-bottom:13px}

.field{margin:9px 0}

.field label{
 display:block;
 color:#b9c9d9;
 font-weight:700;
 font-size:13px;
 margin-bottom:5px
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.full{grid-column:1/-1}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-bottom:13px
}

.stat{
 padding:15px;
 border:1px solid #23415d;
 border-radius:17px;
 background:#0d2033
}

.stat b{
 font-size:26px;
 display:block
}

.stat small{color:#9eb1c5}

.layout{
 display:grid;
 grid-template-columns:235px 1fr;
 gap:12px
}

.side{
 height:max-content;
 position:sticky;
 top:75px;
 border:1px solid #23415d;
 border-radius:17px;
 padding:8px;
 background:#0a1929
}

.nav{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:#aebfd0;
 padding:11px;
 border-radius:10px
}

.nav.active,
.nav:hover{
 background:#163550;
 color:white
}

.tablewrap{overflow:auto}

.table{
 width:100%;
 border-collapse:collapse;
 min-width:650px
}

.table th,
.table td{
 padding:10px;
 border-bottom:1px solid #19334c;
 text-align:left
}

.table th{color:#8ecbff}

.equip{
 padding:14px;
 border:1px solid #23415d;
 border-radius:14px;
 background:#091a2a
}

.equipment{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px
}

.modal{
 position:fixed;
 inset:0;
 background:#0009;
 z-index:30;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px
}

.box{
 width:min(900px,100%);
 max-height:90vh;
 overflow:auto;
 background:#0b1b2c;
 border:1px solid #31516d;
 border-radius:20px;
 padding:18px
}

.close{
 float:right;
 background:#172d42;
 color:#fff;
 border:0;
 border-radius:9px;
 padding:7px
}

.notice{
 padding:11px;
 border:1px dashed #3b6789;
 border-radius:11px;
 background:#0d263d;
 color:#bdd4e7;
 font-size:13px;
 line-height:1.5
}

.login{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:
 radial-gradient(circle at 50% 0,#143957,transparent 45%),
 #07111f
}

.loginbox{
 width:min(440px,100%);
 padding:24px;
 background:#0b1b2c;
 border:1px solid #23415d;
 border-radius:22px
}

.hidden{display:none}

@media(max-width:800px){
 .stats{
  grid-template-columns:repeat(2,1fr)
 }

 .layout{
  grid-template-columns:1fr
 }

 .side{
  position:static;
  display:flex;
  overflow:auto
 }

 .nav{
  white-space:nowrap;
  width:auto
 }

 .grid,
 .equipment{
  grid-template-columns:1fr
 }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal">
 <div id="box" class="box"></div>
</div>

<script>

/* =========================================================
   TERFİ ARŞİVİM V5
   =========================================================

   ŞİMDİLİK TEST MODU

   Daha sonra buraya Supabase bilgilerini gireceğiz.

   ========================================================= */

const SUPABASE_URL="BURAYA_SUPABASE_URL";
const SUPABASE_ANON_KEY="BURAYA_SUPABASE_ANON_KEY";

const USE_SUPABASE=
 !SUPABASE_URL.startsWith("BURAYA_");

const sb=
 USE_SUPABASE
 ? supabase.createClient(
     SUPABASE_URL,
     SUPABASE_ANON_KEY
   )
 : null;


/* =========================================================
   MENÜLER
   ========================================================= */

const TABS=[
 ["general","📋 Genel"],
 ["motors","⚡ Motorlar"],
 ["pumps","💧 Pompalar"],
 ["drives","🎛️ Sürücüler"],
 ["params","⚙️ Sürücü Ayarları"],
 ["hmi","🖥️ HMI / PLC"],
 ["panel","🔌 Pano"],
 ["measurements","📏 Ölçümler"],
 ["faults","🚨 Arızalar"],
 ["maintenance","🔧 Bakım"],
 ["notes","📝 Notlar"]
];


/* =========================================================
   SÜRÜCÜ PARAMETRELERİ
   ========================================================= */

const PARAMS={

 Temel:{
  motor_voltage:"Motor Voltajı (V)",
  motor_current:"Motor Akımı (A)",
  motor_power:"Motor Gücü (kW)",
  motor_freq:"Motor Frekansı (Hz)",
  motor_rpm:"Motor Devir (RPM)",
  nominal_current_x15:"Nominal Akım ×1.5 (A)"
 },

 Sensör:{
  ai1_min:"Sensör [AI1] Min.",
  ai1_max:"Sensör [AI1] Maks.",
  ai2_min:"Sensör [AI2] Min.",
  ai2_max:"Sensör [AI2] Maks.",
  sensor_type:"Sensör Tipi",
  sensor_port:"Sensör Giriş Portu",
  sensor_error:"Sensör Giriş Hata",
  set_select:"Set Değer Seçimi"
 },

 Koruma:{
  thermal:"Motor Termik Kontrol",
  auto_reset:"Oto. Reset Sayısı",
  total_reset:"Top. Reset Süresi (sn)",
  reset_delay:"Reset Gecikme Süresi (sn)",
  panel_error:"Panel Hata",
  over_voltage:"Aşırı Gerilim",
  under_voltage:"Düşük Gerilim",
  over_current:"Aşırı Akım",
  earth_error:"Toprak Hata"
 },

 Röle:{
  relay1:"Röle 1 Yapılandırma",
  relay2:"Röle 2 Yapılandırma",
  relay3:"Röle 3 Yapılandırma",
  relay4:"Röle 4 Yapılandırma",
  digital_relay:"Dijital Röle",
  lock_di:"Kilitleme [DI1-DI5]",
  run_hours:"Çalışma Süresi [h]",
  auto_change:"Otomatik Değişim Aralığı",
  auto_level:"Oto Değişim Seviyesi (%)"
 },

 PID:{
  min_freq:"Minimum Frekans",
  min_freq1:"Minimum Frekans 1",
  min_freq2:"Minimum Frekans 2",
  min_freq3:"Minimum Frekans 3",
  max_freq:"Maksimum Frekans",
  max_freq1:"Maksimum Frekans -1",
  max_freq2:"Maksimum Frekans -2",
  max_freq3:"Maksimum Frekans -3",
  tolerance:"Tolerans [bar]",
  accel:"Hızlanma Rampası (sn)",
  decel:"Yavaşlama Rampası (sn)",
  pid_gain:"PID Kazanç",
  oscillation:"Osilasyon",
  direction:"Ters / Düz Çalıştırma"
 },

 Uyku:{
  wake:"Uyanma süresi (sn)",
  max_wait:"Maks. Frekans Bekleme (sn)",
  aux_stop:"Yard. motor Stop (sn)",
  sleep_cancel:"Uyku İptal",
  sleep_time:"Uyku Zamanı",
  total_motors:"Top. Motor Sayısı",
  aux_motors:"Yard. Motor Sayısı"
 }

};


/* =========================================================
   UYGULAMA DURUMU
   ========================================================= */

let me=null;
let stations=[];
let selected=null;
let tab="general";
let q="";

let cache={
 motors:[],
 pumps:[],
 drives:[],
 params:[],
 hmi:[],
 panel:[],
 measurements:[],
 faults:[],
 maintenance:[],
 notes:[]
};


/* =========================================================
   TEST KULLANICILARI
   ========================================================= */

const demoUsers={

 }const EDIT_PASSWORD = "6872";

let editMode = false;
let visitorMode = false;

};


/* =========================================================
   TEST VERİSİ
   ========================================================= */

let demo=
 JSON.parse(
  localStorage.getItem("terfi_demo")||"null"
 )
 ||
 {
  stations:[
   {
    id:"T001",
    station_no:"T001",
    name:"DALGIÇ 3",
    region:"Mersin / Mezitli",
    address:"Şebeke-Yenimahalle",
    description:"Demo saha kaydı",
    motors:1,
    pumps:1,
    drives:1
   }
  ]
 };


/* =========================================================
   GÜVENLİ METİN
   ========================================================= */

function esc(x){

 return String(x??"")
 .replace(/[&<>"']/g,m=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"

 }[m]));

}


/* =========================================================
   YETKİLER
   ========================================================= */

function canEdit(){

 return(
  me.role==="admin" ||
  me.role==="tech"
 );

}

function canAdmin(){

 return me.role==="admin";

}


/* =========================================================
   MODAL
   ========================================================= */

function modal(x){

 document.getElementById("box").innerHTML=
  '<button class="close" onclick="closeM()">✕</button>'+
  x;

 document.getElementById("modal").style.display="flex";

}

function closeM(){

 document.getElementById("modal").style.display="none";

}


/* =========================================================
   GİRİŞ EKRANI
   ========================================================= */

function loginPage(){

 return `

 <div class="login">

  <div class="loginbox">

   <div class="brand">

    <div class="logo">⚡</div>

    <div>
     <b>Terfi Arşivim</b>
     <small>Merkezi saha teknik arşivi</small>
    </div>

   </div>

   <h2>Giriş</h2>

   ${
    USE_SUPABASE
    ?
    `
    <div class="notice">
     Merkezi Supabase bağlantısı aktif.
    </div>
    `
    :
    `
    <div class="notice">

     <b>TEST MODU</b>

     <br><br>

     👑 Yönetici<br>
     Kullanıcı: <b>musa</b><br>
     Şifre: <b>1234</b>

     <br><br>

     🛠️ Teknisyen<br>
     Kullanıcı: <b>teknisyen</b><br>
     Şifre: <b>1234</b>

     <br><br>

     👁️ İzleyici<br>
     Kullanıcı: <b>izleyici</b><br>
     Şifre: <b>1234</b>

     <br><br>

     Bu test modunda kayıtlar
     bu cihazın tarayıcısında tutulur.

    </div>
    `
   }

   <div class="field">
    <label>E-posta / kullanıcı adı</label>
    <input id="login">
   </div>

   <div class="field">
    <label>Şifre</label>
    <input id="pass" type="password">
   </div>

   <button
    class="btn primary"
    style="width:100%"
    onclick="login()"
   >
    Giriş yap
   </button>

  </div>

 </div>

 `;

}


/* =========================================================
   GİRİŞ
   ========================================================= */

async function login(){

 let u=
  document.getElementById("login")
  .value
  .trim();

 let p=
  document.getElementById("pass")
  .value;


 if(USE_SUPABASE){

  let r=
   await sb.auth.signInWithPassword({
    email:u,
    password:p
   });

  if(r.error)
   return alert(r.error.message);

  await start();

 }
 else{

  let x=demoUsers[u];

  if(
   !x ||
   x.pass!==p
  )
   return alert("Hatalı giriş");

  me={
   name:x.name,
   role:x.role,
   id:u
  };

  stations=demo.stations;

  render();

 }

}


/* =========================================================
   SUPABASE BAŞLAT
   ========================================================= */

async function start(){

 let {
  data:{session}
 }=
 await sb.auth.getSession();

 if(!session){

  render();
  return;

 }

 let r=
 await sb
 .from("profiles")
 .select("*")
 .eq("id",session.user.id)
 .single();

 if(r.error)
  return alert(
   "Profil bulunamadı. Supabase profiles kaydını kontrol et."
  );

 me=r.data;

 let s=
 await sb
 .from("stations")
 .select("*")
 .is("deleted_at",null)
 .order("station_no");

 stations=s.data||[];

 render();

}


/* =========================================================
   ÇIKIŞ
   ========================================================= */

async function logout(){

 if(USE_SUPABASE)
  await sb.auth.signOut();

 me=null;
 selected=null;

 render();

}


/* =========================================================
   ANA RENDER
   ========================================================= */

function render(){

 document.getElementById("app").innerHTML=
  me
  ?
  main()
  :
  loginPage();

}


/* =========================================================
   ANA SAYFA
   ========================================================= */

function main(){

 return `

 <header class="top">

  <div class="brand">

   <div class="logo">⚡</div>

   <div>
    <b>Terfi Arşivim</b>
    <small>
     Saha arşivi • Teknisyen Musa Er
    </small>
   </div>

  </div>

  <div class="actions">

   <span class="btn">
    👤
    ${esc(me.name)}
    •
    ${
     me.role==="admin"
     ?"Yönetici"
     :
     me.role==="tech"
     ?"Teknisyen"
     :
     "İzleyici"
    }
   </span>

   <button
    class="btn"
    onclick="logout()"
   >
    Çıkış
   </button>

  </div>

 </header>

 <main class="wrap">

  ${header()}

  ${
   selected
   ?
   station()
   :
   home()
  }

 </main>

 `;

}


/* =========================================================
   ÜST ALAN
   ========================================================= */

function header(){

 return `

 <section class="hero">

  <h1>Merkezi Saha Arşivi</h1>

  <p class="muted">

   Motor, pompa, sürücü,
   HMI/PLC, pano, ölçüm,
   arıza ve bakım kayıtları
   tek istasyon altında.

  </p>

  <div class="actions">

   ${
    canEdit()
    ?
    `
    <button
     class="btn primary"
     onclick="newStation()"
    >
     ＋ Yeni Terfi İstasyonu
    </button>
    `
    :
    ""
   }

   <button
    class="btn"
    onclick="archive()"
   >
    📦 Arşiv / Dışa Aktarma
   </button>

   ${
    canAdmin()
    ?
    `
    <button
     class="btn"
     onclick="users()"
    >
     👥 Kullanıcılar
    </button>
    `
    :
    ""
   }

  </div>

 </section>

 `;

}


/* =========================================================
   ANA İSTASYON LİSTESİ
   ========================================================= */

function home(){

 let a=
 stations.filter(
  s=>
   (
    (s.station_no||"")+" "+
    (s.name||"")+" "+
    (s.region||"")+" "+
    (s.address||"")
   )
   .toLowerCase()
   .includes(q.toLowerCase())
 );

 return `

 <input
  class="search"
  placeholder="🔎 Terfi no, istasyon, bölge veya adres ara..."
  value="${esc(q)}"
  oninput="q=this.value;render()"
 >

 <div class="stats">

  <div class="stat">
   <b>${stations.length}</b>
   <small>Terfi istasyonu</small>
  </div>

  <div class="stat">
   <b>
    ${
     stations.reduce(
      (n,s)=>
       n+(s.motor_count||s.motors||0),
      0
     )
    }
   </b>
   <small>Motor</small>
  </div>

  <div class="stat">
   <b>
    ${
     stations.reduce(
      (n,s)=>
       n+(s.pump_count||s.pumps||0),
      0
     )
    }
   </b>
   <small>Pompa</small>
  </div>

  <div class="stat">
   <b>
    ${
     stations.reduce(
      (n,s)=>
       n+(s.drive_count||s.drives||0),
      0
     )
    }
   </b>
   <small>Sürücü</small>
  </div>

 </div>

 <div class="card">

  <h2>İstasyonlar</h2>

  <div class="tablewrap">

   <table class="table">

    <tr>
     <th>Terfi No</th>
     <th>İstasyon</th>
     <th>Bölge</th>
     <th>Adres</th>
     <th></th>
    </tr>

    ${
     a.map(
      s=>
       `
       <tr>

        <td>
         <b>
          ${esc(s.station_no||s.id)}
         </b>
        </td>

        <td>
         ${esc(s.name)}
        </td>

        <td>
         ${esc(s.region||"")}
        </td>

        <td>
         ${esc(s.address||"")}
        </td>

        <td>

         <button
          class="btn"
          onclick="openStation('${s.id}')"
         >
          Aç
         </button>

        </td>

       </tr>
       `
     ).join("")
    }

   </table>

  </div>

 </div>

 `;

}


/* =========================================================
   İSTASYON AÇ
   ========================================================= */

async function openStation(id){

 selected=id;
 tab="general";

 if(USE_SUPABASE){

  for(
   let t of Object.keys(cache)
  ){

   let r=
    await sb
    .from(t)
    .select("*")
    .eq("station_id",id)
    .order("created_at");

   cache[t]=r.data||[];

  }

 }

 render();

}


/* =========================================================
   İSTASYON SAYFASI
   ========================================================= */

function station(){

 let s=
  stations.find(
   x=>x.id===selected
  );

 if(!s){

  selected=null;

  return home();

 }

 return `

 <div class="layout">

  <aside class="side">

   ${
    TABS.map(
     x=>
      `
      <button
       class="nav ${
        tab===x[0]
        ?
        "active"
        :
        ""
       }"
       onclick="tab='${x[0]}';render()"
      >
       ${x[1]}
      </button>
      `
    ).join("")
   }

  </aside>

  <section>

   <div class="card">

    <button
     class="btn"
     onclick="selected=null;render()"
    >
     ← Arşiv
    </button>

    <h2 style="margin:13px 0 3px">

     ${esc(s.station_no||s.id)}
     •
     ${esc(s.name)}

    </h2>

    <div class="muted">

     ${esc(s.region||"")}
     •
     ${esc(s.address||"")}

    </div>

    <div
     class="actions"
     style="margin-top:10px"
    >

     ${
      canEdit()
      ?
      `
      <button
       class="btn"
       onclick="editStation()"
      >
       ✏️ Düzenle
      </button>
      `
      :
      ""
     }

     ${
      canAdmin()
      ?
      `
      <button
       class="btn danger"
       onclick="removeStation()"
      >
       🗑️ Arşivden kaldır
      </button>
      `
      :
      ""
     }

    </div>

   </div>

   ${tabContent()}

  </section>

 </div>

 `;

}


/* =========================================================
   SEKME İÇERİĞİ
   ========================================================= */

function tabContent(){

 if(tab==="general"){

  let s=
   stations.find(
    x=>x.id===selected
   );

  return `

  <div class="card">

   <h2>📋 Genel</h2>

   <div class="grid">

    <div>
     <b>Terfi No</b>
     <div class="muted">
      ${esc(s.station_no||"")}
     </div>
    </div>

    <div>
     <b>Oluşturma</b>
     <div class="muted">
      ${esc((s.created_at||"").slice(0,10))}
     </div>
    </div>

    <div>
     <b>Bölge</b>
     <div class="muted">
      ${esc(s.region||"")}
     </div>
    </div>

    <div>
     <b>Adres</b>
     <div class="muted">
      ${esc(s.address||"")}
     </div>
    </div>

    <div class="full">

     <b>Açıklama</b>

     <div class="muted">
      ${esc(s.description||"")}
     </div>

    </div>

   </div>

  </div>

  <div class="equipment">

   <div class="equip">
    <b>⚡ Motor</b><br>
    ${
     cache.motors.length||
     s.motor_count||
     s.motors||
     0
    }
    kayıt
   </div>

   <div class="equip">
    <b>💧 Pompa</b><br>
    ${
     cache.pumps.length||

async function saveStation(id){

 let p={

  station_no:
   document.getElementById("fno").value.trim(),

  name:
   document.getElementById("fname").value.trim(),

  region:
   document.getElementById("freg").value.trim(),

  address:
   document.getElementById("faddr").value.trim(),

  description:
   document.getElementById("fdesc").value.trim()

 };

 if(
  !p.station_no||
  !p.name
 )
  return alert(
   "Terfi No ve istasyon adı gerekli."
  );


 if(USE_SUPABASE){

  let r=
   id
   ?
   await sb
   .from("stations")
   .update(p)
   .eq("id",id)

   :

   await sb
   .from("stations")
   .insert(p);

  if(r.error)
   return alert(
    r.error.message
   );

  await start();

 }
 else{

  if(id){

   Object.assign(
    stations.find(
     x=>x.id===id
    ),
    p
   );

  }
  else{

   stations.push({

    ...p,

    id:
     "d"+
     Date.now(),

    created_at:
     new Date().toISOString(),

    motor_count:0,
    pump_count:0,
    drive_count:0

   });

  }

  demo.stations=stations;

  localStorage.setItem(
   "terfi_demo",
   JSON.stringify(demo)
  );

  render();

 }

 closeM();

}

async function saveRec(){

 let t=ctx.t;

 let table=
  t==="motor"
  ?
  "motors"
  :
  t==="pump"
  ?
  "pumps"
  :
  t==="drive"
  ?
  "drives"
  :
  t;


 if(t==="params"){

  let values={};

  for(
   let fs of Object.values(PARAMS)
  ){

   for(
    let k of Object.keys(fs)
   ){

    values[k]=
     document.getElementById(
      "p_"+k
     ).value;

   }

  }

  let p={

   station_id:selected,

   reading_date:
    document.getElementById(
     "date"
    ).value,

   technician_name:
    me.name,

   values

  };

  await write(
   table,
   p
  );

 }
 else{

  let p={
   station_id:selected,
   technician_name:me.name
  };

  for(
   let k of FORMS[t][1]
  ){

   p[k]=
    document.getElementById(
     "r_"+k
    ).value;

  }

  await write(
   table,
   p
  );

 }

}


/* =========================================================
   VERİ YAZ
   ========================================================= */

async function write(
 table,
 p
){

 let old=
  ctx.i>=0
  ?
  cache[ctx.t][ctx.i]
  :
  null;

 let r;


 if(USE_SUPABASE){

  r=
   old
   ?
   await sb
   .from(table)
   .update(p)
   .eq("id",old.id)

   :

   await sb
   .from(table)
   .insert(p);

 }
 else{

  r={
   error:null
  };

  cache[ctx.t].push({
   ...p,
   id:Date.now()
  });

 }


 if(r.error)
  return alert(
   r.error.message
  );


 closeM();


 if(USE_SUPABASE){

  await openStation(
   selected
  );

 }
 else{

  render();

 }

}
